<style>
  body { overflow: hidden; }
  .split { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100vh; }
  aside { border-right: 1px solid var(--border); background: var(--bg-panel); overflow: auto; padding: 10px 8px; display: grid; align-content: start; gap: 2px; }
  main { overflow: auto; padding: 16px 18px 40px; display: grid; align-content: start; gap: 14px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h2 { font-size: 11px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); font-weight: 600; }
  p { margin: 0; line-height: 1.55; }
  .dim { color: var(--text-dim); } .faint { color: var(--text-faint); } .small { font-size: 11px; } .bad { color: var(--danger); }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: var(--bg-panel); display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .btn { font: inherit; font-size: 12px; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; background: var(--bg-elevated); cursor: pointer; white-space: nowrap; }
  .btn:hover:not([disabled]) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent, var(--bg)); font-weight: 600; }
  .btn.quiet { border-color: transparent; color: var(--text-dim); }
  .btn.danger { color: var(--danger); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); display: inline-block; flex: none; }
  .dot.on { background: var(--ok); } .dot.bad { background: var(--danger); }
  input[type="text"], input[type="password"], input[type="number"], select, textarea { font: inherit; font-size: 12px; color: var(--text); background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label.field { display: grid; gap: 4px; font-size: 12px; }
  label.field > span { color: var(--text-dim); }
  label.check { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
  code, pre { font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 12px; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .conn { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; text-align: left; font: inherit; font-size: 12px; background: none; border: 0; border-radius: 6px; color: var(--text); padding: 7px 8px; cursor: pointer; }
  .conn:hover { background: var(--bg-elevated); }
  .conn.is-on { background: var(--bg-elevated); box-shadow: inset 2px 0 0 var(--accent); }
  .conn .host { grid-column: 2; font-size: 11px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-dim); white-space: nowrap; }
  .pill.warn { color: var(--warn, #e2a84b); border-color: var(--warn, #e2a84b); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.bad { color: var(--danger); border-color: var(--danger); }
  .toollist { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; }
  .toollist nav { display: grid; gap: 10px; max-height: 70vh; overflow: auto; }
  .toollist nav input { width: 100%; box-sizing: border-box; }
  .toollist nav .group { display: grid; gap: 1px; }
  .toollist nav button { text-align: left; font: inherit; font-size: 12px; background: none; border: 0; border-radius: 5px; color: var(--text); padding: 4px 7px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toollist nav button:hover { background: var(--bg-elevated); }
  .toollist nav button.is-on { background: var(--bg-elevated); color: var(--accent); }
  .form { display: grid; gap: 8px; }
  .tree { font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 12px; line-height: 1.55; }
  .tree details { margin-left: 14px; }
  .tree summary { cursor: pointer; margin-left: -14px; }
  .tree .leaf { overflow-wrap: anywhere; }
  .tree .k { color: var(--text-dim); }
  .tree .s { color: var(--ok); } .tree .n { color: var(--accent); } .tree .z { color: var(--text-faint); }
  .flash { padding: 8px 12px; border-radius: 6px; font-size: 12px; background: var(--bg-elevated); border: 1px solid var(--border); }
  .flash.bad { border-color: var(--danger); color: var(--danger); }
  .flash.warn { border-color: var(--warn, #e2a84b); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  @media (max-width: 640px) { .split { grid-template-columns: 1fr; height: auto; } body { overflow: auto; } .toollist { grid-template-columns: 1fr; } }
</style>
<div class="split"><aside id="list"></aside><main id="page"><p class="dim">Loading…</p></main></div>
<script>
  /*
   * MCP connections: servers the person adds by hand — a name, an address, a
   * token and, for a product that serves one server per module, its modules.
   * The app holds the tokens; this panel never sees one and cannot reach the
   * network. It asks the app for verbs (`mcp.*`) and, through `run`, for any
   * tool a connection reaches. The app says `mcp` when a connection changes.
   */
  var state = {
    list: null, error: '', busy: {}, selected: null, mode: 'view',
    draft: null, formError: '',
    detail: null, detailError: '', loadingDetail: false,
    toolFilter: '', tool: null, toolArgs: {}, result: null, resultError: '', running: false,
  };
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function call(name, args) {
    return host.call('mcp.' + name, args || {}).then(function (r) {
      if (r && r.ok === false) throw new Error(r.error || 'Something went wrong.');
      return r;
    });
  }
  function say(text, bad) { host.emit('notify', { text: String(text).slice(0, 300), kind: bad ? 'bad' : 'ok' }); }
  function hostOf(url) { try { return new URL(url).host + new URL(url).pathname.replace(/\/$/, ''); } catch (e) { return url; } }
  function current() { return (state.list || []).filter(function (c) { return c.id === state.selected; })[0] || null; }
  function tools() { return ((state.detail && state.detail.endpoints) || []).reduce(function (all, e) { return all.concat(e.tools || []); }, []); }

  function loadList() {
    return call('list').then(function (r) {
      state.list = r.connections; state.error = '';
      if (state.selected && !current()) { state.selected = null; state.detail = null; }
      if (!state.selected && state.list.length && state.mode === 'view') select(state.list[0].id);
      if (!state.list.length && state.mode === 'view') startAdd();
    }).catch(function (e) { state.error = e.message; }).then(render);
  }

  function loadDetail(fresh) {
    if (!state.selected) return Promise.resolve();
    var id = state.selected;
    state.loadingDetail = true; state.detailError = ''; render();
    return call('inspect', { id: id, fresh: Boolean(fresh) }).then(function (r) {
      if (state.selected === id) state.detail = r;
    }).catch(function (e) { state.detailError = e.message; })
      .then(function () { state.loadingDetail = false; render(); });
  }

  function select(id) {
    state.selected = id; state.mode = 'view'; state.detail = null;
    state.tool = null; state.toolArgs = {}; state.result = null; state.resultError = ''; state.toolFilter = '';
    render(); loadDetail(false);
  }

  function startAdd() {
    state.mode = 'add'; state.formError = '';
    state.draft = { name: '', url: '', token: '', modules: '', claude: false };
    render();
  }
  function startEdit() {
    var c = current(); if (!c) return;
    state.mode = 'edit'; state.formError = '';
    state.draft = { id: c.id, name: c.name, url: c.url, token: '', modules: c.modules.join(', '), claude: c.claude, hasToken: c.hasToken };
    render();
  }

  // --- the list ------------------------------------------------------------------

  function listView() {
    var h = '<h2 style="padding:2px 8px">Connections</h2>';
    (state.list || []).forEach(function (c) {
      var bad = c.error ? ' bad' : (c.checkedAt ? ' on' : '');
      h += '<button class="conn' + (c.id === state.selected && state.mode !== 'add' ? ' is-on' : '') + '" data-conn="' + esc(c.id) + '" title="' + esc(c.url) + '">'
        + '<span class="dot' + bad + '"></span><b>' + esc(c.name) + (c.claude ? ' <span class="pill">Claude</span>' : '') + '</b>'
        + '<span class="host">' + esc(hostOf(c.url)) + (c.modules.length ? ' · ' + c.modules.length + ' module' + (c.modules.length === 1 ? '' : 's') : '') + '</span></button>';
    });
    if (state.list && !state.list.length) h += '<p class="dim small" style="padding:4px 8px">None yet.</p>';
    h += '<div style="padding:8px 4px"><button class="btn" id="add">+ Add connection</button></div>';
    return h;
  }

  // --- add and edit ------------------------------------------------------------------

  function formView() {
    var d = state.draft;
    var editing = state.mode === 'edit';
    return '<div class="card"><h1>' + (editing ? 'Change ' + esc(d.name) : 'Add an MCP connection') + '</h1>'
      + '<p class="dim small">Any MCP server reached over HTTP. For a product that serves one server per module, like Kubrik OS (<code>https://mcp.kubrik.io</code>) or Timelogbook (<code>https://mcp.timelogbook.com</code>), give its address and the modules: each one is <code>address/module</code>.</p>'
      + '<label class="field"><span>Name — what you and Claude call it. Letters, numbers and dashes.</span><input type="text" id="f-name" placeholder="kubrik" value="' + esc(d.name) + '" autocomplete="off"></label>'
      + '<label class="field"><span>Address</span><input type="text" id="f-url" placeholder="https://mcp.example.com" value="' + esc(d.url) + '" autocomplete="off"></label>'
      + '<label class="field"><span>Token — sent as <code>Authorization: Bearer …</code>. ' + (editing && d.hasToken ? 'Leave it blank to keep the one saved.' : 'Leave it blank if the server needs none.') + '</span><input type="password" id="f-token" placeholder="' + (editing && d.hasToken ? '•••••• (saved)' : 'kos_… / tlbk_… / a token') + '" value="' + esc(d.token) + '" autocomplete="off"></label>'
      + '<label class="field"><span>Modules — optional. Separate them with commas: <code>acc, crm, oms</code></span><input type="text" id="f-modules" placeholder="none: the address is the server itself" value="' + esc(d.modules) + '" autocomplete="off"></label>'
      + '<label class="check"><input type="checkbox" id="f-claude"' + (d.claude ? ' checked' : '') + '> Let Claude sessions use it</label>'
      + (state.formError ? '<div class="flash bad">' + esc(state.formError) + '</div>' : '')
      + '<div class="row"><button class="btn primary" id="save"' + (state.busy.save ? ' disabled' : '') + '>' + (state.busy.save ? 'Checking…' : (editing ? 'Save' : 'Connect')) + '</button>'
      + (state.list && state.list.length ? '<button class="btn quiet" id="cancel">Cancel</button>' : '')
      + '<span class="dim small">It is kept only if the server answers. The token is encrypted by your system’s keychain and never shown again.</span></div></div>';
  }

  // --- one connection ------------------------------------------------------------------

  function fieldsOf(tool) {
    var schema = tool.inputSchema || {};
    var props = schema.properties || {};
    var required = schema.required || [];
    return Object.keys(props).map(function (name) { return { name: name, spec: props[name] || {}, required: required.indexOf(name) >= 0 }; });
  }

  function fieldInput(f) {
    var v = state.toolArgs[f.name];
    var id = 'arg-' + f.name;
    var type = Array.isArray(f.spec.type) ? f.spec.type[0] : f.spec.type;
    if (Array.isArray(f.spec.enum)) {
      return '<select id="' + esc(id) + '" data-arg="' + esc(f.name) + '"><option value="">—</option>' + f.spec.enum.map(function (e) {
        return '<option' + (String(v) === String(e) ? ' selected' : '') + '>' + esc(e) + '</option>';
      }).join('') + '</select>';
    }
    if (type === 'boolean') {
      return '<select id="' + esc(id) + '" data-arg="' + esc(f.name) + '" data-type="boolean"><option value="">—</option><option' + (v === 'true' ? ' selected' : '') + '>true</option><option' + (v === 'false' ? ' selected' : '') + '>false</option></select>';
    }
    if (type === 'integer' || type === 'number') {
      return '<input type="number" id="' + esc(id) + '" data-arg="' + esc(f.name) + '" data-type="number" value="' + esc(v == null ? '' : v) + '">';
    }
    if (type === 'array' || type === 'object') {
      return '<input type="text" id="' + esc(id) + '" data-arg="' + esc(f.name) + '" data-type="json" placeholder="JSON" value="' + esc(v == null ? '' : v) + '">';
    }
    return '<input type="text" id="' + esc(id) + '" data-arg="' + esc(f.name) + '" value="' + esc(v == null ? '' : v) + '">';
  }

  function tree(value, key, depth) {
    var label = key == null ? '' : '<span class="k">' + esc(key) + ':</span> ';
    if (value === null || value === undefined) return '<div class="leaf">' + label + '<span class="z">null</span></div>';
    if (typeof value === 'string') return '<div class="leaf">' + label + '<span class="s">' + esc(value) + '</span></div>';
    if (typeof value === 'number' || typeof value === 'boolean') return '<div class="leaf">' + label + '<span class="n">' + esc(value) + '</span></div>';
    var isArray = Array.isArray(value);
    var keys = isArray ? value.map(function (_, i) { return i; }) : Object.keys(value);
    var head = isArray ? '[' + keys.length + ']' : '{' + keys.length + '}';
    var body = keys.slice(0, 500).map(function (k) { return tree(value[k], k, depth + 1); }).join('')
      + (keys.length > 500 ? '<div class="leaf z">… ' + (keys.length - 500) + ' more</div>' : '');
    return '<details' + (depth < 2 ? ' open' : '') + '><summary>' + label + '<span class="z">' + head + '</span></summary>' + body + '</details>';
  }

  function toolsView() {
    var endpoints = ((state.detail && state.detail.endpoints) || []).filter(function (e) { return e.reached; });
    if (!endpoints.length) return '<p class="dim">This connection offers no tools.</p>';
    var needle = state.toolFilter.trim().toLowerCase();
    var h = '<div class="toollist"><nav><input type="text" id="toolFilter" placeholder="Filter tools…" value="' + esc(state.toolFilter) + '">';
    endpoints.forEach(function (e) {
      var shown = e.tools.filter(function (t) { return !needle || (t.name + ' ' + t.title).toLowerCase().indexOf(needle) >= 0; });
      if (!shown.length) return;
      h += '<div class="group"><h2>' + esc(e.module || 'Tools') + ' <span class="faint">' + shown.length + '</span></h2>' + shown.map(function (t) {
        return '<button data-tool="' + esc(t.name) + '" class="' + (state.tool === t.name ? 'is-on' : '') + '" title="' + esc(t.name) + '">' + esc(t.title) + '</button>';
      }).join('') + '</div>';
    });
    h += '</nav><div style="display:grid;gap:12px">';
    var tool = tools().filter(function (t) { return t.name === state.tool; })[0];
    if (!tool) {
      h += '<p class="dim">Pick a tool. It runs with this connection’s token — the same tools a Claude session gets when you let it.</p>';
    } else {
      h += '<div class="card"><div class="row"><b>' + esc(tool.title) + '</b><code class="faint">' + esc(tool.name) + '</code>'
        + (tool.readOnly ? '' : '<span class="pill warn">may change something — asks first</span>') + '</div>'
        + '<p class="dim small" style="white-space:pre-wrap">' + esc(tool.description) + '</p><div class="form">';
      fieldsOf(tool).forEach(function (f) {
        h += '<label class="field"><span>' + esc(f.name) + (f.required ? ' *' : '') + (f.spec.description ? ' — ' + esc(f.spec.description) : '') + '</span>' + fieldInput(f) + '</label>';
      });
      h += '<div class="row"><button class="btn primary" id="runTool"' + (state.running ? ' disabled' : '') + '>' + (state.running ? 'Running…' : 'Run') + '</button></div></div></div>';
      if (state.resultError) h += '<div class="flash bad">' + esc(state.resultError) + '</div>';
      if (state.result) {
        var d = state.result.data;
        if (d && d.status === 'proposal_pending') {
          h += '<div class="flash warn"><b>Nothing has changed yet.</b> The server made this a proposal: confirm it there to have it done.'
            + (d.confirmUrl ? ' <button class="btn primary" id="confirmProposal">Open to confirm</button>' : '') + '</div>';
        }
        h += '<div class="card">' + (state.result.isError ? '<p class="bad">The server said no:</p>' : '')
          + (d !== null && d !== undefined ? '<div class="tree">' + tree(d, null, 0) + '</div>' : '<pre>' + esc(state.result.text) + '</pre>')
          + '</div>';
      }
    }
    return h + '</div></div>';
  }

  function connectionView() {
    var c = current();
    if (!c) return '<p class="dim">Pick a connection, or add one.</p>';
    var d = state.detail;
    var h = '<div class="row"><span class="dot ' + ((d && d.error) || state.detailError ? 'bad' : (d ? 'on' : '')) + '"></span><h1>' + esc(c.name) + '</h1><code class="faint">' + esc(c.url) + '</code>'
      + '<span class="spacer"></span><button class="btn quiet" id="refresh" title="Ask the server again what it offers">Refresh</button>'
      + '<button class="btn quiet" id="edit">Change</button><button class="btn quiet danger" id="remove">Remove</button></div>';
    h += '<div class="row"><label class="check"><input type="checkbox" id="claude"' + (c.claude ? ' checked' : '') + (state.busy.claudeSave ? ' disabled' : '') + '> Let Claude sessions use it, as <code>' + esc(c.name) + '</code></label>'
      + '<span class="dim small">Sessions started from now on get it; one already running needs a restart.</span></div>';
    if (state.detailError) h += '<div class="flash bad">' + esc(state.detailError) + '</div>';
    if (d && d.error) h += '<div class="flash bad">' + esc(d.error) + '</div>';
    if (!d) return h + '<p class="dim">' + (state.loadingDetail ? 'Asking the server what it offers…' : '') + '</p>';
    if (d.endpoints.length > 1 || (d.endpoints[0] && d.endpoints[0].module)) {
      h += '<div class="row">' + d.endpoints.map(function (e) {
        return '<span class="pill ' + (e.reached ? 'ok' : 'bad') + '" title="' + esc(e.reached ? e.url : (e.why || '')) + '">' + esc(e.module) + (e.reached ? ' · ' + e.tools.length : ' · ' + esc(e.why || 'not reached')) + '</span>';
      }).join('') + '</div>';
    }
    return h + toolsView();
  }

  function render() {
    var focused = document.activeElement && document.activeElement.id;
    var caret = null;
    try { caret = focused ? document.activeElement.selectionStart : null; } catch (e) { caret = null; }
    $('list').innerHTML = state.list ? listView() : '';
    var h;
    if (state.error) h = '<div class="flash bad">' + esc(state.error) + '</div>';
    else if (!state.list) h = '<p class="dim">Loading…</p>';
    else if (state.mode === 'add' || state.mode === 'edit') h = formView();
    else h = connectionView();
    $('page').innerHTML = h;
    if (focused && $(focused)) { $(focused).focus(); try { if (caret != null) $(focused).setSelectionRange(caret, caret); } catch (e) { /* not a text box */ } }
  }

  // --- what the person does ------------------------------------------------------------

  function readArgs() {
    var args = {};
    var bad = null;
    document.querySelectorAll('[data-arg]').forEach(function (el) {
      var raw = el.value;
      if (raw === '') return;
      var name = el.getAttribute('data-arg');
      var type = el.getAttribute('data-type');
      if (type === 'number') args[name] = Number(raw);
      else if (type === 'boolean') args[name] = raw === 'true';
      else if (type === 'json') { try { args[name] = JSON.parse(raw); } catch (e) { bad = name + ' is not valid JSON'; } }
      else args[name] = raw;
    });
    if (bad) throw new Error(bad);
    return args;
  }

  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (state.draft && id && id.indexOf('f-') === 0 && id !== 'f-claude') state.draft[id.slice(2)] = e.target.value;
    if (id === 'toolFilter') { state.toolFilter = e.target.value; render(); }
    var arg = e.target.getAttribute && e.target.getAttribute('data-arg');
    if (arg) state.toolArgs[arg] = e.target.value;
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'f-claude' && state.draft) state.draft.claude = e.target.checked;
    if (e.target.id === 'claude') {
      var c = current(); if (!c) return;
      var on = e.target.checked;
      state.busy.claudeSave = true; render();
      call('claudeSave', { id: c.id, on: on, name: c.name })
        .then(function () { say(on ? c.name + ': Claude sessions started from now on get it.' : c.name + ': new Claude sessions will not get it.'); })
        .catch(function (err) { say(err.message, true); })
        .then(function () { delete state.busy.claudeSave; return loadList(); });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id && e.target.id.indexOf('f-') === 0 && $('save')) $('save').click();
    if (e.target.getAttribute && e.target.getAttribute('data-arg') && $('runTool')) $('runTool').click();
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button');
    if (!el) return;
    if (el.dataset.conn) {
      select(el.dataset.conn);
    } else if (el.id === 'add') {
      startAdd();
    } else if (el.id === 'cancel') {
      state.mode = 'view'; state.draft = null; render();
      if (!state.selected && state.list.length) select(state.list[0].id);
    } else if (el.id === 'save') {
      var d = state.draft;
      state.busy.save = true; state.formError = ''; render();
      call('save', { id: d.id || null, name: d.name, url: d.url, token: d.token, modules: d.modules, claude: d.claude }).then(function (r) {
        say(d.id ? d.name + ' saved.' : d.name + ' connected.');
        state.draft = null; state.mode = 'view';
        return loadList().then(function () { select(r.id); });
      }).catch(function (err) { state.formError = err.message; })
        .then(function () { delete state.busy.save; render(); });
    } else if (el.id === 'edit') {
      startEdit();
    } else if (el.id === 'remove') {
      var c = current(); if (!c) return;
      call('remove', { id: c.id, name: c.name }).then(function () {
        say(c.name + ' removed.'); state.selected = null; state.detail = null; return loadList();
      }).catch(function (err) { say(err.message, true); });
    } else if (el.id === 'refresh') {
      loadDetail(true).then(loadList);
    } else if (el.dataset.tool) {
      if (state.tool !== el.dataset.tool) { state.tool = el.dataset.tool; state.toolArgs = {}; state.result = null; state.resultError = ''; }
      render();
    } else if (el.id === 'runTool') {
      var args;
      try { args = readArgs(); } catch (err) { state.resultError = err.message; render(); return; }
      state.running = true; state.resultError = ''; render();
      call('run', { id: state.selected, tool: state.tool, args: args }).then(function (r) { state.result = r; })
        .catch(function (err) { state.result = null; state.resultError = err.message; })
        .then(function () { state.running = false; render(); });
    } else if (el.id === 'confirmProposal') {
      // The app opens it only if it is on the same site as the connection.
      var link = state.result && state.result.data && state.result.data.confirmUrl;
      call('openLink', { id: state.selected, url: link }).catch(function (err) { say(err.message, true); });
    }
  });

  host.on('mcp', function () { loadList(); });
  host.on('context', function () { loadList(); });
  host.ready();
</script>
