<!--
  Maven and Gradle — the build tool window.

  This file is the whole extension. It runs in a frame with an origin of its
  own: no DOM of the app, no `window.api`, no filesystem, no modules. Everything
  it knows it asked for through `host.call`, and everything it runs it asked the
  app to run — the panel names a goal and a module, the app writes the command
  line and opens the terminal. If this throws, the app does not notice.

  The head of the document belongs to the app — the reset, the theme variables
  and the `host` bridge are already in place before anything below runs.
-->

<style>
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; }

  /* ---------- the bar across the top ---------- */

  .top {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .top input {
    font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 7px;
  }
  .top input:focus { outline: none; border-color: var(--accent); }
  #run { flex: 1; min-width: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  #filter { width: 130px; }
  .btn {
    padding: 3px 9px; border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text-dim); white-space: nowrap; font-size: 11.5px;
  }
  .btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-elevated); }
  .btn.on { color: var(--accent); border-color: var(--accent); }
  .btn.go { color: var(--accent); border-color: var(--accent); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  .sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

  /* ---------- the tree and the detail beside it ---------- */

  .body { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; overflow: hidden; position: relative; }
  .body.with-detail { grid-template-columns: minmax(0, 1fr) 38%; }
  .tree { overflow: auto; min-height: 0; padding: 4px 0 24px; outline: none; }
  .detail {
    border-left: 1px solid var(--border); background: var(--bg-panel);
    overflow: auto; min-height: 0; padding: 10px 12px 24px;
  }

  .row {
    display: flex; align-items: center; gap: 5px; height: 24px; padding-right: 8px;
    white-space: nowrap; cursor: default; user-select: none; -webkit-user-select: none;
  }
  .row:hover { background: var(--bg-elevated); }
  .row.on { background: var(--accent-soft); }
  .row.on .name { color: var(--accent); }
  .row.picked .name { color: var(--accent); }
  .twist {
    display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 10px; flex: 0 0 16px;
  }
  .twist.leaf { visibility: hidden; }
  .icon { width: 14px; height: 14px; flex: 0 0 14px; color: var(--text-faint); }
  .row.head .icon { color: var(--accent); }
  /* The name never gives way to the description: a row that reads
     "spring-boot:bu… Package an application…" has cut off the one word that
     mattered. The description is what gets the ellipsis. */
  .name { color: var(--text); flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .row.group .name { color: var(--text-dim); font-weight: 550; }
  .row.runnable .name { color: var(--text); }
  .meta { color: var(--text-faint); font-size: 11px; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .meta.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .count { color: var(--text-faint); font-size: 10.5px; margin-left: 2px; }
  .tag {
    font-size: 9.5px; padding: 0 5px; border-radius: 8px; line-height: 15px;
    border: 1px solid var(--border); color: var(--text-faint); flex: 0 0 auto;
  }
  .tag.profile { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
  .tag.scope-test { color: var(--git-new); }
  .tag.scope-provided, .tag.scope-runtime { color: var(--accent); }
  .tag.implied { opacity: 0.7; }
  .row input[type="checkbox"] { margin: 0 2px 0 0; cursor: pointer; }
  .play {
    margin-left: auto; opacity: 0; color: var(--accent); padding: 0 4px; border-radius: var(--radius);
    display: inline-flex; align-items: center; flex: 0 0 auto;
  }
  .row:hover .play, .row.on .play { opacity: 1; }
  .play:hover { background: var(--bg-elevated); }
  .row.dim .name, .row.dim .meta { color: var(--text-faint); }
  .row.bad .name { color: var(--danger); }

  /* ---------- detail ---------- */

  .detail h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; word-break: break-all; }
  .detail .sub { color: var(--text-dim); font-size: 11.5px; margin-bottom: 10px; word-break: break-all; }
  .detail h4 {
    margin: 12px 0 4px; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-faint);
  }
  .detail .cmd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px 8px; white-space: pre-wrap; word-break: break-all; color: var(--text);
  }
  .detail .cmd .dir { color: var(--text-faint); }
  .detail .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .detail p { margin: 4px 0; color: var(--text-dim); }
  .detail .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11.5px; }
  .detail .kv span:nth-child(odd) { color: var(--text-faint); }
  .detail .kv span:nth-child(even) { word-break: break-all; }
  .goal-list .row { height: auto; min-height: 24px; white-space: normal; padding: 3px 4px 3px 0; }
  .goal-list .meta { white-space: normal; }
  .detail select {
    font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 6px;
  }
  .dep-tree .row { height: 22px; }
  .dep-tree .arrow { color: var(--git-new); }
  .dep-tree .seen { color: var(--text-faint); }

  /* ---------- the foot ---------- */

  .foot {
    display: flex; align-items: center; gap: 10px; padding: 4px 10px;
    border-top: 1px solid var(--border); background: var(--bg-panel);
    font-size: 11px; color: var(--text-faint); min-height: 24px;
  }
  .foot .grow { flex: 1; }
  .foot .bad { color: var(--danger); }
  .foot .stale { color: var(--git-new); }

  .empty { padding: 30px 20px; color: var(--text-dim); text-align: center; }
  .empty strong { color: var(--text); }
</style>

<div id="app">
  <div class="top">
    <button class="btn" id="reload" title="Read the project again">⟳ Reload</button>
    <input id="run" placeholder="goals… (Enter runs on the selected module)" spellcheck="false" autocomplete="off">
    <button class="btn go" id="go" title="Run what is in the box">▶ Run</button>
    <span class="sep"></span>
    <button class="btn" id="skip" title="Add -DskipTests / -x test to every run">Skip tests</button>
    <button class="btn" id="offline" title="Do not touch the network: -o / --offline">Offline</button>
    <span class="sep"></span>
    <input id="filter" placeholder="Filter" spellcheck="false" autocomplete="off">
  </div>
  <div class="body" id="body">
    <div class="tree" id="tree" tabindex="0"></div>
    <div class="detail" id="detail" hidden></div>
  </div>
  <div class="foot">
    <span id="summary"></span>
    <span class="grow"></span>
    <span id="stale" class="stale"></span>
    <span id="busy"></span>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- state

  var state = {
    root: null,          // the folder the panel was opened on
    project: null,       // what the app read: { tool, root, wrapper, project, ... }
    tasks: null,         // gradle only: { groups } once Gradle has been asked
    tasksError: null,
    tasksStale: false,   // a build file changed since the tasks were read
    tree: [],            // the nodes, built from the project
    byId: new Map(),
    open: new Set(),     // which node ids are expanded
    selected: null,      // node id
    picked: [],          // runnable node ids to run together, in order (ctrl-click)
    profiles: {},        // module id -> { profileId: true }
    skipTests: false,
    offline: false,
    filter: '',
    recent: [],          // { label, run } of what ran, newest first
    resolved: {},        // gradle: project path -> { configuration, nodes }
    resolvedOpen: new Set(),
    showing: true,
    stale: null,         // a change arrived while hidden
    error: null,
    loading: false,
  };

  var el = {
    tree: document.getElementById('tree'),
    detail: document.getElementById('detail'),
    body: document.getElementById('body'),
    run: document.getElementById('run'),
    filter: document.getElementById('filter'),
    summary: document.getElementById('summary'),
    busy: document.getElementById('busy'),
    stale: document.getElementById('stale'),
    skip: document.getElementById('skip'),
    offline: document.getElementById('offline'),
  };

  // ---------------------------------------------------------------- helpers

  function h(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function svgIcon(kind) {
    var wrap = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    wrap.setAttribute('viewBox', '0 0 14 14');
    wrap.setAttribute('class', 'icon');
    wrap.setAttribute('fill', 'none');
    wrap.setAttribute('stroke', 'currentColor');
    wrap.setAttribute('stroke-width', '1.3');
    wrap.setAttribute('stroke-linejoin', 'round');
    wrap.setAttribute('stroke-linecap', 'round');
    var d = {
      module: 'M7 1.8 12.4 4.5 7 7.2 1.6 4.5zM1.6 7.2 7 9.9l5.4-2.7M1.6 9.9 7 12.6l5.4-2.7',
      phase: 'M3.5 2.5v9l7.5-4.5z',
      goal: 'M2 7h10M8.5 3.5 12 7l-3.5 3.5',
      plugin: 'M4.5 2.5h5v2h2v5h-2v2h-5v-2h-2v-5h2z',
      dep: 'M7 2.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6zM7 4.8v4.4',
      folder: 'M1.6 3.4h3.4l1.1 1.4h6.3v6.2H1.6z',
      profile: 'M2 3.5h10M2 7h10M2 10.5h10',
      task: 'M3.5 2.5v9l7.5-4.5z',
      group: 'M2.5 3.5h9M2.5 7h9M2.5 10.5h5',
      recent: 'M7 2.5a4.5 4.5 0 1 0 4.5 4.5M7 4.5V7l2 1.2',
    }[kind] || 'M2 2h10v10H2z';
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    wrap.appendChild(path);
    return wrap;
  }

  function busy(text) { el.busy.textContent = text || ''; }

  function call(name, args) {
    return host.call(name, args).then(function (result) {
      if (result && result.ok === false) throw new Error(result.error || 'the app said no');
      return result;
    });
  }

  function basename(p) { return String(p || '').replace(/\/+$/, '').split('/').pop() || p; }

  function coords(m) {
    return [m.groupId, m.artifactId, m.version].filter(Boolean).join(':');
  }

  // ---------------------------------------------------------------- building the tree

  /**
   * One node of the tree. `run` is what double-clicking does — the parts the
   * app needs to write a command — and is absent on anything that is not a
   * thing to run. `dir` on a module is where its goals run.
   */
  function node(id, kind, label, extra) {
    var n = { id: id, kind: kind, label: label, children: [], meta: '', run: null, tags: [], cls: '' };
    for (var key in extra || {}) n[key] = extra[key];
    state.byId.set(id, n);
    return n;
  }

  function buildTree() {
    state.byId = new Map();
    var p = state.project;
    if (!p) { state.tree = []; return; }
    var roots = [];
    if (state.recent.length) roots.push(recentNode());
    if (p.tool === 'maven') roots.push(mavenModule(p.project, 'm'));
    else roots.push(gradleProject(p.project, true));
    state.tree = roots;
    // Only the first level opens itself: a project of thirty modules should
    // arrive as a list of thirty, not as a thousand rows.
    if (!state.open.size) {
      roots.forEach(function (r) {
        state.open.add(r.id);
        r.children.forEach(function (c) { if (c.kind === 'lifecycle' || c.kind === 'modules' || c.kind === 'projects' || c.kind === 'tasks') state.open.add(c.id); });
      });
    }
  }

  function recentNode() {
    var n = node('recent', 'recent', 'Recent', { cls: 'group' });
    state.recent.forEach(function (entry, i) {
      n.children.push(node('recent/' + i, 'recentRun', entry.label, { run: entry.run, meta: entry.dir || '', cls: 'runnable' }));
    });
    return n;
  }

  /** A Maven module, with everything IntelliJ puts under one. */
  function mavenModule(m, id) {
    var head = node(id, 'module', m.artifactId || basename(m.dir), {
      module: m, dir: m.dir, meta: m.version || '', cls: 'head',
      tags: [m.packaging || 'jar'].concat(m.profile ? [{ text: 'profile ' + m.profile, cls: 'profile' }] : []),
    });
    if (m.error) {
      head.cls = 'bad';
      head.meta = m.error;
      return head;
    }
    var run = function (goals) { return { tool: 'maven', dir: m.dir, moduleId: id, goals: goals }; };

    var life = node(id + '/lifecycle', 'lifecycle', 'Lifecycle', { cls: 'group' });
    state.project.lifecycle.forEach(function (phase) {
      life.children.push(node(id + '/lifecycle/' + phase.name, 'phase', phase.name, {
        run: run([phase.name]), meta: phase.description, cls: 'runnable',
      }));
    });
    head.children.push(life);

    var plugins = node(id + '/plugins', 'plugins', 'Plugins', { cls: 'group', count: m.plugins.length });
    m.plugins.forEach(function (plugin) {
      var pid = id + '/plugins/' + plugin.groupId + ':' + plugin.artifactId;
      var pn = node(pid, 'plugin', plugin.prefix, {
        plugin: plugin, meta: plugin.artifactId + (plugin.version ? ' ' + plugin.version : ''),
        tags: plugin.implied ? [{ text: 'bound', cls: 'implied' }] : [],
      });
      plugin.goals.forEach(function (goal) {
        pn.children.push(node(pid + '/' + goal.name, 'goal', plugin.prefix + ':' + goal.name, {
          run: run([plugin.prefix + ':' + goal.name]), meta: goal.description || '', cls: 'runnable', goal: goal, plugin: plugin,
        }));
      });
      if (!plugin.goals.length) pn.cls = 'dim';
      plugins.children.push(pn);
    });
    head.children.push(plugins);

    var deps = node(id + '/deps', 'deps', 'Dependencies', { cls: 'group', count: m.dependencies.length });
    m.dependencies.forEach(function (dep, i) {
      deps.children.push(node(id + '/deps/' + i, 'dep', dep.groupId + ':' + dep.artifactId, {
        dep: dep, meta: dep.version || '', tags: dep.scope !== 'compile' ? [{ text: dep.scope, cls: 'scope-' + dep.scope }] : [],
        cls: dep.optional ? 'dim' : '',
      }));
    });
    if (m.dependencies.length) deps.children.push(node(id + '/deps/tree', 'depTree', 'Show the resolved tree', {
      run: run(['dependency:tree']), meta: 'mvn dependency:tree, in a terminal', cls: 'runnable dim',
    }));
    head.children.push(deps);

    if (m.profiles.length) {
      var profiles = node(id + '/profiles', 'profiles', 'Profiles', { cls: 'group', count: m.profiles.length });
      m.profiles.forEach(function (profile) {
        profiles.children.push(node(id + '/profiles/' + profile.id, 'profile', profile.id, {
          profile: profile, moduleId: id, meta: profile.activeByDefault ? 'active by default' : '',
        }));
      });
      head.children.push(profiles);
    }

    if (m.modules.length) {
      var modules = node(id + '/modules', 'modules', 'Modules', { cls: 'group', count: m.modules.length });
      m.modules.forEach(function (sub) {
        modules.children.push(mavenModule(sub, id + '/' + (sub.relative || sub.artifactId)));
      });
      head.children.push(modules);
    }
    return head;
  }

  /** A Gradle project: tasks by group, declared dependencies, and its subprojects. */
  function gradleProject(p, isRoot) {
    var id = 'g' + p.path;
    var head = node(id, 'module', p.name, {
      module: p, dir: p.dir, meta: isRoot ? '' : p.path, cls: 'head', project: p,
      tags: isRoot ? [state.project.kotlin ? 'kotlin dsl' : 'groovy dsl'] : [],
    });
    var run = function (task) { return { tool: 'gradle', dir: state.project.root, moduleId: id, goals: [task] }; };

    var tasks = node(id + '/tasks', 'tasks', 'Tasks', { cls: 'group' });
    if (state.tasks) {
      var mine = state.tasks.groups.map(function (group) {
        return { name: group.name, tasks: group.tasks.filter(function (t) { return t.project === p.path; }) };
      }).filter(function (group) { return group.tasks.length; });
      tasks.count = mine.reduce(function (n, g) { return n + g.tasks.length; }, 0);
      mine.forEach(function (group) {
        var gn = node(id + '/tasks/' + group.name, 'taskGroup', group.name.toLowerCase(), { cls: 'group', count: group.tasks.length });
        group.tasks.forEach(function (task) {
          gn.children.push(node(id + '/tasks/' + group.name + '/' + task.name, 'task', task.name, {
            run: run(task.path), meta: task.description, cls: 'runnable', task: task,
          }));
        });
        tasks.children.push(gn);
      });
      if (!mine.length) tasks.children.push(node(id + '/tasks/none', 'note', 'No tasks in this project', { cls: 'dim' }));
    } else if (state.tasksError) {
      tasks.children.push(node(id + '/tasks/error', 'note', state.tasksError, { cls: 'bad' }));
    } else {
      tasks.children.push(node(id + '/tasks/loading', 'note', 'Asking Gradle…', { cls: 'dim' }));
    }
    head.children.push(tasks);

    var deps = node(id + '/deps', 'deps', 'Dependencies', { cls: 'group', count: p.dependencies.length, project: p });
    var byConf = {};
    p.dependencies.forEach(function (dep) { (byConf[dep.configuration] = byConf[dep.configuration] || []).push(dep); });
    Object.keys(byConf).forEach(function (conf) {
      var cn = node(id + '/deps/' + conf, 'configuration', conf, { cls: 'group', count: byConf[conf].length });
      byConf[conf].forEach(function (dep, i) {
        var parts = dep.project ? [dep.notation, ''] : splitNotation(dep.notation);
        cn.children.push(node(id + '/deps/' + conf + '/' + i, 'dep', parts[0], {
          dep: dep, meta: parts[1], tags: dep.catalog ? ['catalog'] : dep.platform ? ['platform'] : [],
        }));
      });
      deps.children.push(cn);
    });
    deps.children.push(node(id + '/deps/resolved', 'resolved', 'Resolved…', {
      meta: 'what Gradle actually resolves, per configuration', project: p, cls: 'dim',
    }));
    head.children.push(deps);

    if (isRoot && p.subprojects && p.subprojects.length) {
      var subs = node(id + '/projects', 'projects', 'Projects', { cls: 'group', count: p.subprojects.length });
      p.subprojects.forEach(function (sub) { subs.children.push(gradleProject(sub, false)); });
      head.children.push(subs);
    }
    return head;
  }

  /** "g:a:v" → ["g:a", "v"]; anything else stays whole. */
  function splitNotation(notation) {
    var parts = String(notation || '').split(':');
    if (parts.length >= 3) return [parts[0] + ':' + parts[1], parts.slice(2).join(':')];
    return [notation, ''];
  }

  // ---------------------------------------------------------------- drawing

  /** The rows on screen: the tree walked to its open nodes, filtered if asked. */
  function visibleRows() {
    var rows = [];
    var q = state.filter.trim().toLowerCase();
    function matches(n) {
      if (!q) return true;
      return (n.label + ' ' + (n.meta || '')).toLowerCase().indexOf(q) !== -1;
    }
    function anyBelow(n) {
      if (matches(n)) return true;
      for (var i = 0; i < n.children.length; i += 1) if (anyBelow(n.children[i])) return true;
      return false;
    }
    function walk(n, depth) {
      if (q && !anyBelow(n)) return;
      rows.push({ node: n, depth: depth });
      // Filtering opens everything that has a match under it; the person is
      // looking for something, and a closed group is a hidden answer.
      var open = q ? true : state.open.has(n.id);
      if (open) n.children.forEach(function (c) { walk(c, depth + 1); });
    }
    state.tree.forEach(function (n) { walk(n, 0); });
    return rows;
  }

  function draw() {
    var rows = visibleRows();
    var frag = document.createDocumentFragment();
    if (!rows.length) {
      var empty = h('div', 'empty');
      if (state.error) {
        empty.appendChild(h('strong', null, 'Could not read the project.'));
        empty.appendChild(h('p', null, state.error));
      } else if (state.loading) {
        empty.textContent = 'Reading…';
      } else if (state.filter) {
        empty.textContent = 'Nothing matches.';
      } else {
        empty.textContent = 'Nothing here.';
      }
      frag.appendChild(empty);
    }
    rows.forEach(function (entry) {
      var n = entry.node;
      var row = h('div', 'row ' + (n.cls || '') + (n.id === state.selected ? ' on' : '') + (state.picked.indexOf(n.id) !== -1 ? ' picked' : ''));
      row.dataset.id = n.id;
      row.style.paddingLeft = (6 + entry.depth * 16) + 'px';

      var twist = h('span', 'twist' + (n.children.length ? '' : ' leaf'), state.open.has(n.id) || state.filter ? '▾' : '▸');
      row.appendChild(twist);

      if (n.kind === 'profile') {
        var box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = isProfileOn(n.moduleId, n.profile.id);
        box.addEventListener('click', function (event) {
          event.stopPropagation();
          toggleProfile(n.moduleId, n.profile.id);
        });
        row.appendChild(box);
      } else {
        row.appendChild(svgIcon(iconFor(n)));
      }

      row.appendChild(h('span', 'name', n.label));
      if (n.count !== undefined) row.appendChild(h('span', 'count', n.count));
      (n.tags || []).forEach(function (tag) {
        var text = typeof tag === 'string' ? tag : tag.text;
        row.appendChild(h('span', 'tag ' + (typeof tag === 'string' ? '' : tag.cls || ''), text));
      });
      if (n.meta) row.appendChild(h('span', 'meta' + (n.kind === 'module' || n.kind === 'dep' ? ' mono' : ''), n.meta));

      if (n.run) {
        var play = h('button', 'play', '▶');
        play.title = 'Run';
        play.addEventListener('click', function (event) {
          event.stopPropagation();
          select(n.id);
          runSelection();
        });
        row.appendChild(play);
      }

      row.addEventListener('click', function (event) {
        if (event.metaKey || event.ctrlKey) { pick(n.id); return; }
        select(n.id);
      });
      row.addEventListener('dblclick', function () {
        if (n.run) { select(n.id); runSelection(); return; }
        if (n.kind === 'resolved') { showResolved(n.project); return; }
        toggle(n.id);
      });
      twist.addEventListener('click', function (event) {
        event.stopPropagation();
        toggle(n.id);
      });
      frag.appendChild(row);
    });
    el.tree.textContent = '';
    el.tree.appendChild(frag);
    drawFoot();
  }

  function iconFor(n) {
    return {
      module: 'module', phase: 'phase', goal: 'goal', plugin: 'plugin', dep: 'dep', task: 'task',
      recent: 'recent', recentRun: 'phase', taskGroup: 'group', configuration: 'group', depTree: 'goal', resolved: 'dep',
    }[n.kind] || 'group';
  }

  function drawFoot() {
    var p = state.project;
    if (!p) { el.summary.textContent = ''; return; }
    var parts = [];
    if (p.tool === 'maven') {
      var count = 0;
      (function walk(m) { count += 1; (m.modules || []).forEach(walk); })(p.project);
      parts.push('Maven', count === 1 ? '1 module' : count + ' modules', p.wrapper ? 'mvnw' : 'mvn on PATH');
    } else {
      parts.push('Gradle', (1 + (p.project.subprojects || []).length) + ' projects', p.wrapper ? 'gradlew' : 'gradle on PATH');
      if (state.tasks) parts.push(state.tasks.groups.reduce(function (n, g) { return n + g.tasks.length; }, 0) + ' tasks');
    }
    el.summary.textContent = parts.join(' · ');
    el.stale.textContent = state.tasksStale ? 'build files changed — Reload to read the tasks again' : '';
    el.skip.classList.toggle('on', state.skipTests);
    el.offline.classList.toggle('on', state.offline);
  }

  // ---------------------------------------------------------------- selection

  function toggle(id) {
    if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
    draw();
    remember();
  }

  function select(id) {
    state.selected = id;
    state.picked = [];
    draw();
    drawDetail();
    remember();
  }

  /**
   * Adding to the run rather than replacing it.
   *
   * `clean` then `install` is the run everybody makes, and it is two rows; a
   * ctrl-click on the second keeps the first. Only within one module: goals
   * from two modules are two commands, and the app runs one at a time.
   */
  function pick(id) {
    var n = state.byId.get(id);
    if (!n || !n.run) { select(id); return; }
    var current = state.byId.get(state.selected);
    if (!current || !current.run || current.run.moduleId !== n.run.moduleId) { select(id); return; }
    if (state.picked.indexOf(state.selected) === -1) state.picked = [state.selected];
    var at = state.picked.indexOf(id);
    if (at === -1) state.picked.push(id); else if (state.picked.length > 1) state.picked.splice(at, 1);
    draw();
    drawDetail();
  }

  function isProfileOn(moduleId, profileId) {
    var set = state.profiles[moduleId];
    if (set && profileId in set) return Boolean(set[profileId]);
    var n = state.byId.get(moduleId + '/profiles/' + profileId);
    return Boolean(n && n.profile && n.profile.activeByDefault);
  }

  function toggleProfile(moduleId, profileId) {
    var set = state.profiles[moduleId] = state.profiles[moduleId] || {};
    set[profileId] = !isProfileOn(moduleId, profileId);
    draw();
    drawDetail();
    remember();
  }

  /** The profiles switched on for a module: its own, plus those of every module above it. */
  function profilesFor(moduleId) {
    var on = [];
    var id = moduleId;
    while (id) {
      var n = state.byId.get(id);
      if (n && n.module && n.module.profiles) {
        n.module.profiles.forEach(function (p) {
          if (isProfileOn(id, p.id) && on.indexOf(p.id) === -1) on.push(p.id);
        });
      }
      var cut = id.lastIndexOf('/modules/');
      id = cut === -1 ? null : id.slice(0, cut);
    }
    return on;
  }

  // ---------------------------------------------------------------- running

  /** What would run, from the selection, the toggles and the run box. */
  function plannedRun() {
    var ids = state.picked.length ? state.picked : (state.selected ? [state.selected] : []);
    var nodes = ids.map(function (id) { return state.byId.get(id); }).filter(function (n) { return n && n.run; });
    var typed = el.run.value.trim().replace(/^(mvn|mvnw|\.\/mvnw|gradle|gradlew|\.\/gradlew)\s+/, '');
    var words = typed ? typed.split(/\s+/) : [];

    var base = nodes[0] ? nodes[0].run : null;
    if (!base) {
      // Nothing runnable selected: the box runs on the selected module, or the root.
      var m = moduleOf(state.selected) || state.tree[state.tree.length - 1];
      if (!m || !words.length) return null;
      base = { tool: state.project.tool, dir: m.dir, moduleId: m.id, goals: [] };
    }
    var goals = [];
    nodes.forEach(function (n) { n.run.goals.forEach(function (g) { if (goals.indexOf(g) === -1) goals.push(g); }); });
    // Words from the box: goals go with the goals, flags go after.
    var extra = [];
    words.forEach(function (w) { if (w.charAt(0) === '-') extra.push(w); else if (goals.indexOf(w) === -1) goals.push(w); });
    if (!goals.length) return null;

    var profiles = base.tool === 'maven' ? profilesFor(base.moduleId) : [];
    return {
      tool: base.tool,
      wrapper: Boolean(state.project.wrapper),
      dir: base.dir,
      goals: goals,
      profiles: profiles,
      skipTests: state.skipTests,
      offline: state.offline,
      extra: extra,
      moduleId: base.moduleId,
    };
  }

  /** The module node a node belongs to. */
  function moduleOf(id) {
    var at = id;
    while (at) {
      var n = state.byId.get(at);
      if (n && n.kind === 'module') return n;
      var cut = at.lastIndexOf('/');
      if (cut === -1) return null;
      at = at.slice(0, cut);
    }
    return null;
  }

  /** The line the app will write, as best the panel can guess it, for the detail pane. */
  function describeRun(run) {
    var parts = [];
    if (run.tool === 'maven') {
      parts.push(run.wrapper ? './mvnw' : 'mvn');
      if (run.offline) parts.push('-o');
      if (run.profiles.length) parts.push('-P' + run.profiles.join(','));
      parts = parts.concat(run.goals);
      if (run.skipTests) parts.push('-DskipTests');
    } else {
      parts.push(run.wrapper ? './gradlew' : 'gradle');
      if (run.offline) parts.push('--offline');
      parts = parts.concat(run.goals);
      if (run.skipTests) parts.push('-x', 'test');
    }
    return parts.concat(run.extra).join(' ');
  }

  function runSelection() {
    var run = plannedRun();
    if (!run) { host.emit('notify', { text: 'Select a phase, a goal or a task first, or type one.', kind: 'bad' }); return; }
    execute(run);
  }

  function execute(run) {
    var label = describeRun(run);
    busy('Running ' + label + '…');
    /*
     * Written down before the call, not after. Opening the terminal splits the
     * pane this panel is in, and a split rebuilds the frame — so the reply to
     * this call lands in a document that no longer exists. What the person
     * asked to run is known now; whether it started, the terminal will say.
     */
    rememberRecent(label, run);
    return call('build.run', run)
      .then(function (result) {
        busy('');
        host.emit('notify', { text: 'Running in a terminal below: ' + (result.command || label) });
      })
      .catch(function (error) {
        busy('');
        host.emit('notify', { text: 'Could not run: ' + error.message, kind: 'bad' });
      });
  }

  function rememberRecent(label, run) {
    // Named by the module it ran in, because `mvn install` in two modules is
    // two different things to run again.
    var dir = run.tool === 'maven' ? basename(run.dir) : '';
    state.recent = [{ label: label, run: run, dir: dir }]
      .concat(state.recent.filter(function (r) { return r.label !== label || r.dir !== dir; }))
      .slice(0, 8);
    buildTree();
    state.open.add('recent');
    draw();
    remember();
  }

  // ---------------------------------------------------------------- detail

  function drawDetail() {
    var n = state.byId.get(state.selected);
    if (!n) {
      el.detail.hidden = true;
      el.body.classList.remove('with-detail');
      return;
    }
    el.detail.hidden = false;
    el.body.classList.add('with-detail');
    el.detail.textContent = '';

    var run = plannedRun();
    var runNodes = state.picked.length > 1 ? state.picked.map(function (id) { return state.byId.get(id); }) : [n];

    if (n.kind === 'module') {
      var m = n.module;
      el.detail.appendChild(h('h3', null, m.name || m.artifactId || n.label));
      el.detail.appendChild(h('div', 'sub', state.project.tool === 'maven' ? coords(m) : (m.path || ':')));
      var kv = h('div', 'kv');
      if (state.project.tool === 'maven') {
        kv.appendChild(h('span', null, 'packaging')); kv.appendChild(h('span', null, m.packaging || 'jar'));
        kv.appendChild(h('span', null, 'pom')); kv.appendChild(h('span', null, m.relative === '.' ? 'pom.xml' : m.relative + '/pom.xml'));
        if (m.profile) { kv.appendChild(h('span', null, 'only with')); kv.appendChild(h('span', null, '-P' + m.profile)); }
        var on = profilesFor(n.id);
        if (on.length) { kv.appendChild(h('span', null, 'profiles on')); kv.appendChild(h('span', null, on.join(', '))); }
      } else {
        kv.appendChild(h('span', null, 'folder')); kv.appendChild(h('span', null, m.relative || '.'));
        if (m.file) { kv.appendChild(h('span', null, 'script')); kv.appendChild(h('span', null, basename(m.file))); }
      }
      el.detail.appendChild(kv);
      var actions = h('div', 'actions');
      var file = state.project.tool === 'maven' ? m.file : m.file;
      if (file) actions.appendChild(button('Open ' + basename(file), function () { host.emit('openFile', { path: file }); }));
      if (state.project.tool === 'maven') {
        actions.appendChild(button('▶ clean install', function () {
          execute({ tool: 'maven', wrapper: Boolean(state.project.wrapper), dir: m.dir, goals: ['clean', 'install'], profiles: profilesFor(n.id), skipTests: state.skipTests, offline: state.offline, extra: [], moduleId: n.id });
        }, 'go'));
      } else {
        actions.appendChild(button('▶ build', function () {
          execute({ tool: 'gradle', wrapper: Boolean(state.project.wrapper), dir: state.project.root, goals: [(m.path === ':' ? '' : m.path) + ':build'], profiles: [], skipTests: state.skipTests, offline: state.offline, extra: [], moduleId: n.id });
        }, 'go'));
      }
      el.detail.appendChild(actions);
      if (state.project.tool === 'maven') {
        var fromTable = m.plugins.filter(function (p) { return !p.resolved && p.goals.length; }).length;
        if (fromTable) el.detail.appendChild(h('p', null, fromTable + (fromTable === 1 ? ' plugin lists' : ' plugins list') + ' goals from a built-in table rather than from the plugin itself — it has not been downloaded to ~/.m2 yet. A build fixes that.'));
      }
      return;
    }

    if (n.kind === 'plugin') {
      var plugin = n.plugin;
      el.detail.appendChild(h('h3', null, plugin.prefix));
      el.detail.appendChild(h('div', 'sub', plugin.groupId + ':' + plugin.artifactId + (plugin.version ? ':' + plugin.version : '')));
      if (plugin.implied) el.detail.appendChild(h('p', null, 'Not declared in the pom — Maven binds it to the lifecycle for this packaging.'));
      if (!plugin.resolved && plugin.goals.length) el.detail.appendChild(h('p', null, 'Goals from a built-in table; the plugin is not in ~/.m2 yet.'));
      if (!plugin.goals.length) el.detail.appendChild(h('p', null, 'No goals known: the plugin is not in ~/.m2 and it is not one this panel has a table for. Run a build and reload.'));
      el.detail.appendChild(h('h4', null, 'Goals'));
      var list = h('div', 'goal-list');
      plugin.goals.forEach(function (goal) {
        var row = h('div', 'row runnable');
        row.appendChild(svgIcon('goal'));
        row.appendChild(h('span', 'name', plugin.prefix + ':' + goal.name));
        if (goal.description) row.appendChild(h('span', 'meta', goal.description));
        row.addEventListener('dblclick', function () {
          var mod = moduleOf(n.id);
          execute({ tool: 'maven', wrapper: Boolean(state.project.wrapper), dir: mod.dir, goals: [plugin.prefix + ':' + goal.name], profiles: profilesFor(mod.id), skipTests: state.skipTests, offline: state.offline, extra: [], moduleId: mod.id });
        });
        list.appendChild(row);
      });
      el.detail.appendChild(list);
      return;
    }

    if (n.kind === 'dep') {
      var dep = n.dep;
      el.detail.appendChild(h('h3', null, n.label));
      el.detail.appendChild(h('div', 'sub', dep.notation || coords(dep)));
      var dkv = h('div', 'kv');
      if (dep.version !== undefined) { dkv.appendChild(h('span', null, 'version')); dkv.appendChild(h('span', null, dep.version || '(managed — not on this machine)')); }
      if (dep.scope) { dkv.appendChild(h('span', null, 'scope')); dkv.appendChild(h('span', null, dep.scope)); }
      if (dep.type && dep.type !== 'jar') { dkv.appendChild(h('span', null, 'type')); dkv.appendChild(h('span', null, dep.type)); }
      if (dep.configuration) { dkv.appendChild(h('span', null, 'configuration')); dkv.appendChild(h('span', null, dep.configuration)); }
      if (dep.optional) { dkv.appendChild(h('span', null, 'optional')); dkv.appendChild(h('span', null, 'yes')); }
      if (dep.catalog) { dkv.appendChild(h('span', null, 'from')); dkv.appendChild(h('span', null, 'the version catalog (gradle/libs.versions.toml)')); }
      el.detail.appendChild(dkv);
      return;
    }

    if (n.kind === 'resolved') {
      drawResolved(n.project);
      return;
    }

    if (n.kind === 'profile') {
      el.detail.appendChild(h('h3', null, n.profile.id));
      el.detail.appendChild(h('div', 'sub', 'profile'));
      el.detail.appendChild(h('p', null, (isProfileOn(n.moduleId, n.profile.id) ? 'On: ' : 'Off: ') + 'the checkbox decides whether -P' + n.profile.id + ' goes on every run of this module and the ones under it.'));
      return;
    }

    // Something to run: a phase, a goal, a task, a recent run.
    if (run) {
      el.detail.appendChild(h('h3', null, runNodes.map(function (r) { return r.label; }).join(' ')));
      el.detail.appendChild(h('div', 'sub', runNodes.length === 1 && n.meta ? n.meta : ''));
      el.detail.appendChild(h('h4', null, 'Runs'));
      var cmd = h('div', 'cmd');
      cmd.appendChild(h('span', 'dir', (run.tool === 'maven' ? run.dir.replace(state.root, '') || '/' : '.') + ' $ '));
      cmd.appendChild(document.createTextNode(describeRun(run)));
      el.detail.appendChild(cmd);
      if (run.tool === 'maven' && run.dir !== state.project.root) el.detail.appendChild(h('p', null, 'In the module, the way IntelliJ runs it: this module and the modules under it, not the whole reactor.'));
      var ra = h('div', 'actions');
      ra.appendChild(button('▶ Run in a terminal', function () { execute(run); }, 'go'));
      el.detail.appendChild(ra);
      if (n.kind === 'task' && n.task) {
        el.detail.appendChild(h('h4', null, 'Task'));
        var tkv = h('div', 'kv');
        tkv.appendChild(h('span', null, 'path')); tkv.appendChild(h('span', null, n.task.path));
        el.detail.appendChild(tkv);
      }
      el.detail.appendChild(h('p', null, 'Double-click runs. ⌘-click another row to run them together.'));
      return;
    }

    el.detail.appendChild(h('h3', null, n.label));
    if (n.count !== undefined) el.detail.appendChild(h('div', 'sub', n.count + ' inside'));
  }

  function button(text, onClick, cls) {
    var b = h('button', 'btn ' + (cls || ''), text);
    b.addEventListener('click', onClick);
    return b;
  }

  /** Gradle's resolved tree for one project, one configuration, drawn in the detail pane. */
  function showResolved(project) {
    state.selected = 'g' + project.path + '/deps/resolved';
    draw();
    drawResolved(project);
  }

  function drawResolved(project) {
    el.detail.hidden = false;
    el.body.classList.add('with-detail');
    el.detail.textContent = '';
    var held = state.resolved[project.path];
    var configuration = held ? held.configuration : 'runtimeClasspath';

    el.detail.appendChild(h('h3', null, 'Resolved dependencies'));
    el.detail.appendChild(h('div', 'sub', project.path === ':' ? project.name : project.path));
    var pick = document.createElement('select');
    ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c; opt.selected = c === configuration;
      pick.appendChild(opt);
    });
    // Choosing a configuration is asking for it; a second click would be a tax.
    pick.addEventListener('change', function () { loadResolved(project, pick.value); });
    var actions = h('div', 'actions');
    actions.appendChild(pick);
    actions.appendChild(button(held && held.configuration === configuration ? 'Read again' : 'Read', function () { loadResolved(project, pick.value); }));
    el.detail.appendChild(actions);

    if (!held) {
      el.detail.appendChild(h('p', null, 'Asks Gradle — a second or two with a warm daemon, longer cold.'));
      if (!state.resolved[project.path + '#loading']) loadResolved(project, configuration);
      else el.detail.appendChild(h('p', null, 'Asking…'));
      return;
    }
    if (held.error) { el.detail.appendChild(h('p', 'bad', held.error)); return; }
    if (!held.nodes.length) { el.detail.appendChild(h('p', null, 'Nothing in ' + held.configuration + '.')); return; }

    el.detail.appendChild(h('h4', null, held.configuration));
    var tree = h('div', 'dep-tree');
    var key = project.path + '#';
    function walk(node, depth, path) {
      var id = key + path;
      var row = h('div', 'row');
      row.style.paddingLeft = (depth * 14) + 'px';
      var twist = h('span', 'twist' + (node.children.length ? '' : ' leaf'), state.resolvedOpen.has(id) ? '▾' : '▸');
      row.appendChild(twist);
      var parts = splitNotation(node.notation);
      row.appendChild(h('span', 'name' + (node.seen ? ' seen' : ''), parts[0]));
      if (parts[1]) row.appendChild(h('span', 'meta mono', parts[1]));
      if (node.resolvedTo) { row.appendChild(h('span', 'meta arrow', '→ ' + node.resolvedTo)); }
      if (node.constraint) row.appendChild(h('span', 'tag', 'constraint'));
      if (node.seen) row.appendChild(h('span', 'tag', 'shown above'));
      row.addEventListener('click', function () {
        if (!node.children.length) return;
        if (state.resolvedOpen.has(id)) state.resolvedOpen.delete(id); else state.resolvedOpen.add(id);
        drawResolved(project);
      });
      tree.appendChild(row);
      if (state.resolvedOpen.has(id)) node.children.forEach(function (c, i) { walk(c, depth + 1, path + '/' + i); });
    }
    held.nodes.forEach(function (n, i) { walk(n, 0, String(i)); });
    el.detail.appendChild(tree);
  }

  function loadResolved(project, configuration) {
    state.resolved[project.path + '#loading'] = true;
    busy('Asking Gradle for ' + configuration + '…');
    call('build.dependencies', { project: project.path, configuration: configuration })
      .then(function (result) {
        state.resolved[project.path] = { configuration: result.configuration, nodes: result.nodes || [] };
      })
      .catch(function (error) {
        state.resolved[project.path] = { configuration: configuration, nodes: [], error: error.message };
      })
      .then(function () {
        delete state.resolved[project.path + '#loading'];
        busy('');
        if (state.selected === 'g' + project.path + '/deps/resolved') drawResolved(project);
      });
  }

  // ---------------------------------------------------------------- loading

  /** Read the project. `force` re-asks Gradle for its tasks as well. */
  function load(force) {
    if (!state.root) return Promise.resolve();
    state.loading = true;
    state.error = null;
    busy('Reading…');
    return call('build.project', {})
      .then(function (project) {
        state.project = project;
        state.loading = false;
        buildTree();
        draw();
        drawDetail();
        busy('');
        if (project.tool === 'gradle') return loadTasks(force);
        return null;
      })
      .catch(function (error) {
        state.loading = false;
        state.error = error.message;
        state.project = null;
        state.tree = [];
        draw();
        busy('');
      });
  }

  function loadTasks(force) {
    if (!force && state.tasks && !state.tasksStale) return Promise.resolve();
    busy('Asking Gradle for its tasks…');
    state.tasksError = null;
    return call('build.tasks', { force: Boolean(force) })
      .then(function (result) {
        state.tasks = { groups: result.groups || [] };
        state.tasksStale = false;
      })
      .catch(function (error) {
        state.tasks = null;
        state.tasksError = error.message;
      })
      .then(function () {
        busy('');
        buildTree();
        draw();
        drawDetail();
      });
  }

  // ---------------------------------------------------------------- remembering

  function remember() {
    host.emit('remember', {
      open: Array.from(state.open),
      selected: state.selected,
      profiles: state.profiles,
      skipTests: state.skipTests,
      offline: state.offline,
      recent: state.recent,
      filter: state.filter,
      run: el.run.value,
    });
  }

  function resume(saved) {
    if (!saved) return;
    state.open = new Set(saved.open || []);
    state.selected = saved.selected || null;
    state.profiles = saved.profiles || {};
    state.skipTests = Boolean(saved.skipTests);
    state.offline = Boolean(saved.offline);
    state.recent = saved.recent || [];
    state.filter = saved.filter || '';
    el.filter.value = state.filter;
    el.run.value = saved.run || '';
  }

  // ---------------------------------------------------------------- wiring

  document.getElementById('reload').addEventListener('click', function () {
    state.resolved = {};
    load(true);
  });
  document.getElementById('go').addEventListener('click', runSelection);
  el.run.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { event.preventDefault(); runSelection(); }
  });
  el.run.addEventListener('input', function () { drawDetail(); remember(); });
  el.skip.addEventListener('click', function () { state.skipTests = !state.skipTests; drawFoot(); drawDetail(); remember(); });
  el.offline.addEventListener('click', function () { state.offline = !state.offline; drawFoot(); drawDetail(); remember(); });
  el.filter.addEventListener('input', function () { state.filter = el.filter.value; draw(); remember(); });

  el.tree.addEventListener('keydown', function (event) {
    var rows = visibleRows();
    var at = rows.findIndex(function (r) { return r.node.id === state.selected; });
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      var next = Math.max(0, Math.min(rows.length - 1, at + (event.key === 'ArrowDown' ? 1 : -1)));
      if (rows[next]) select(rows[next].node.id);
      var row = el.tree.querySelector('.row.on');
      if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    } else if (event.key === 'ArrowRight' && at >= 0) {
      event.preventDefault();
      if (rows[at].node.children.length && !state.open.has(state.selected)) toggle(state.selected);
    } else if (event.key === 'ArrowLeft' && at >= 0) {
      event.preventDefault();
      if (state.open.has(state.selected)) toggle(state.selected);
      else {
        var cut = state.selected.lastIndexOf('/');
        if (cut > 0) select(state.selected.slice(0, cut));
      }
    } else if (event.key === 'Enter' && at >= 0) {
      event.preventDefault();
      if (rows[at].node.run) runSelection();
      else toggle(state.selected);
    }
  });

  // The app answers `ready` with where we are, and tells us when the folder
  // moves. Everything else this panel knows, it asked for.
  host.on('context', function (context) {
    state.root = context.root;
    if (context.showing === false) state.showing = false;
    resume(context.resume);
    load(false);
  });

  host.on('showing', function (payload) {
    var was = state.showing;
    state.showing = !payload || payload.showing !== false;
    if (!state.showing || was) return;
    if (state.stale) { state.stale = null; load(false); }
  });

  /**
   * The folder changed. A build writes hundreds of files into `target/` and
   * none of them change what the tree says; a pom changing does. There is no
   * way to know which from here, so the cheap read is repeated after things
   * settle, and the expensive one — Gradle's tasks — is only marked as owed.
   */
  var settle = null;
  host.on('changed', function (payload) {
    if (!payload || payload.kind !== 'tree') return;
    if (!state.showing) { state.stale = true; return; }
    if (settle) clearTimeout(settle);
    settle = setTimeout(function () {
      settle = null;
      var before = state.project ? JSON.stringify(state.project.project) : '';
      call('build.project', {}).then(function (project) {
        var after = JSON.stringify(project.project);
        if (after === before) return;
        state.project = project;
        if (project.tool === 'gradle') state.tasksStale = true;
        buildTree();
        draw();
        drawDetail();
      }).catch(function () { /* the next read will say */ });
    }, 1200);
  });

  host.ready();
})();
</script>
