<style>
  /*
   * Port Forward, drawn in a frame that cannot reach the network or the disk.
   * What it knows arrives through `host.call('pf.*')`: forwards by id, and
   * where each one stands. Nothing a cluster says is read as markup — every
   * name on this page is set as text, and the only markup built from strings
   * is the icons below, which are this file's own.
   */
  html { font-size: 12px; }
  #app { display: grid; grid-template-columns: 214px minmax(0, 1fr) auto; height: 100%; min-height: 0; position: relative; }
  body { container: app / inline-size; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .faint { color: var(--text-faint); }
  .dim { color: var(--text-dim); }
  .spacer { flex: 1; }
  [hidden] { display: none !important; }
  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); color: var(--text); background: transparent; font: inherit; cursor: pointer; white-space: nowrap; transition: background 0.12s, border-color 0.12s, color 0.12s; }
  .btn:hover { border-color: var(--text-faint); background: var(--bg-elevated); }
  .btn:focus-visible, .ib:focus-visible, .nav:focus-visible, .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { color: var(--on-accent); border-color: var(--accent); background: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--text)); }
  .btn.quiet { border-color: transparent; color: var(--text-dim); }
  .btn.quiet:hover { color: var(--text); background: var(--bg-elevated); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  /* An icon alone: the row's own actions. */
  .ib { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: var(--radius); color: var(--text-dim); transition: background 0.12s, color 0.12s; }
  .ib:hover { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }
  input[type="text"], select { min-height: 28px; padding: 3px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font: inherit; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input::placeholder { color: var(--text-faint); }
  kbd { padding: 0 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; font: 0.85rem/1.5 ui-monospace, Menlo, monospace; color: var(--text-dim); }

  /* ── where you are ── */
  #side { display: flex; flex-direction: column; min-height: 0; background: var(--bg-panel); border-right: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 9px; padding: 13px 14px 11px; }
  .brand .mark { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 7px; color: var(--on-accent); background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--violet, #a78bfa))); }
  .brand .mark svg { width: 15px; height: 15px; stroke-width: 2.1; }
  .brand b { font-size: 1.08rem; font-weight: 650; letter-spacing: 0.01em; }
  #nav { flex: 1; overflow: auto; min-height: 0; padding: 0 8px 12px; }
  .sec { display: flex; align-items: center; margin: 14px 6px 4px; color: var(--text-faint); font-size: 0.8rem; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; }
  .sec .ib { width: 20px; height: 20px; margin-left: auto; }
  .nav { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border-radius: var(--radius); color: var(--text-dim); text-align: left; position: relative; transition: background 0.12s, color 0.12s; }
  .nav:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
  .nav.on { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .nav.on::before { content: ''; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav.drop { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  .nav .lb { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .n { font-size: 0.86rem; color: var(--text-faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  .nav .n.live { color: var(--ok); font-weight: 600; }
  .nav .n.bad { color: var(--danger); font-weight: 600; }
  .nav .more { display: none; margin-right: -4px; width: 20px; height: 20px; }
  .nav:hover .more { display: inline-flex; }
  .nav:hover .n:has(+ .more) { display: none; }
  .nav .pip { width: 8px; height: 8px; border-radius: 2px; flex: none; margin: 0 3px; }
  .nav .active-tag { font-size: 0.78rem; padding: 0 6px; border-radius: 999px; color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 50%, var(--border)); font-weight: 600; }
  .side-foot { display: flex; gap: 4px; padding: 8px; border-top: 1px solid var(--border); }
  .side-foot .btn { flex: 1; justify-content: center; padding: 2px 6px; }

  /* ── the forwards ── */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; container: main / inline-size; }
  .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex: none; min-height: 58px; }
  .head .ttl { min-width: 60px; flex: 0 1 auto; margin-right: 6px; overflow: hidden; }
  .head .sub { overflow: hidden; text-overflow: ellipsis; }
  .head h1 { margin: 0; font-size: 1.22rem; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .sub { color: var(--text-faint); white-space: nowrap; }
  .head .sub b { color: var(--ok); font-weight: 600; }
  .find { position: relative; display: flex; align-items: center; flex: 0 1 190px; min-width: 90px; }
  .find svg { position: absolute; left: 8px; color: var(--text-faint); pointer-events: none; }
  .find input { width: 100%; padding-left: 27px; }
  .find kbd { position: absolute; right: 7px; pointer-events: none; }
  .find input:focus + kbd, .find input:not(:placeholder-shown) + kbd { display: none; }

  .alert { display: flex; align-items: center; gap: 10px; margin: 10px 14px 0; padding: 8px 12px; border: 1px solid color-mix(in srgb, var(--warn, #d9a441) 45%, var(--border)); border-radius: var(--radius); background: color-mix(in srgb, var(--warn, #d9a441) 9%, transparent); line-height: 1.45; }
  .alert > svg { color: var(--warn, #d9a441); width: 16px; height: 16px; }
  .alert .msg { flex: 1; min-width: 0; }

  #list { flex: 1; overflow: auto; min-height: 0; padding: 4px 0 28px; outline: none; }
  .ghead { position: sticky; top: -4px; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 8px; min-height: 30px; margin: 10px 6px 0; padding: 0 6px 0 8px; cursor: pointer; user-select: none; -webkit-user-select: none; border-radius: var(--radius); }
  .ghead .tw { display: inline-flex; color: var(--text-faint); transition: transform 0.12s; }
  .ghead .tw.open { transform: rotate(90deg); }
  .ghead .gn { font-size: 0.86rem; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-dim); }
  .ghead .ct { color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .ghead .ct.live { color: var(--ok); font-weight: 600; }
  .ghead .line { flex: 1; height: 1px; background: var(--border); }
  .ghead .acts { display: flex; gap: 2px; opacity: 0; transition: opacity 0.12s; }
  .ghead:hover .acts, .ghead:focus-within .acts { opacity: 1; }
  .ghead.drop { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }

  .row { display: grid; grid-template-columns: 34px minmax(170px, 1.5fr) minmax(86px, 0.6fr) minmax(150px, 1.1fr) minmax(130px, 1fr) 60px; align-items: center; column-gap: 12px; min-height: 46px; margin: 2px 8px; padding: 4px 8px 4px 12px; border: 1px solid transparent; border-radius: calc(var(--radius) + 1px); cursor: default; position: relative; transition: background 0.12s, border-color 0.12s; }
  .row:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
  .row.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 38%, transparent); }
  .row.dragging { opacity: 0.45; }
  .row::before { content: ''; position: absolute; left: 1px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: transparent; transition: background 0.2s; }
  .row.s-up::before { background: var(--ok); }
  .row.s-starting::before, .row.s-reconnecting::before, .row.s-auth::before { background: var(--warn, #d9a441); }
  .row.s-failed::before { background: var(--danger); }
  .row > div { min-width: 0; }
  .who .nm { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .who .nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .tg { color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.93rem; }
  .who .tg .k { opacity: 0.75; }
  .row.off .who .nm { color: var(--text-dim); font-weight: 500; }
  .cl { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; color: var(--text-dim); }
  .cl i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .cl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eps { display: flex; flex-wrap: wrap; gap: 4px; }
  .ep { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; font: 0.92rem/18px ui-monospace, Menlo, monospace; color: var(--text-faint); white-space: nowrap; }
  .ep .a { opacity: 0.6; }
  .ep.live { color: var(--text); border-color: color-mix(in srgb, var(--ok) 50%, var(--border)); background: color-mix(in srgb, var(--ok) 9%, transparent); cursor: pointer; }
  .ep.live:hover { background: color-mix(in srgb, var(--ok) 20%, transparent); }
  .ep.live svg { width: 11px; height: 11px; opacity: 0.45; transition: opacity 0.12s; }
  .ep.live:hover svg { opacity: 1; }
  .ep.done { background: color-mix(in srgb, var(--ok) 34%, transparent); border-color: var(--ok); }
  /* Rows that are not there yet: the shape of the list while it is being read. */
  .skel { height: 46px; margin: 2px 8px; border-radius: calc(var(--radius) + 1px); background: linear-gradient(90deg, color-mix(in srgb, var(--text) 4%, transparent) 25%, color-mix(in srgb, var(--text) 8%, transparent) 37%, color-mix(in srgb, var(--text) 4%, transparent) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
  @keyframes shimmer { from { background-position: 100% 50%; } to { background-position: 0 50%; } }
  .st { overflow: hidden; }
  .st .l1 { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .l2 { color: var(--text-faint); font-size: 0.93rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st.ok .l1 { color: var(--ok); }
  .st.warn .l1 { color: var(--warn, #d9a441); }
  .st.bad .l1 { color: var(--danger); }
  .st.idle .l1 { color: var(--text-faint); }
  .beat { width: 7px; height: 7px; border-radius: 50%; flex: none; background: currentColor; }
  .ok .beat { animation: beat 2.4s ease-out infinite; }
  .warn .beat { animation: blink 1.1s ease-in-out infinite; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  @keyframes blink { 50% { opacity: 0.3; } }
  .acts { display: flex; justify-content: flex-end; gap: 1px; opacity: 0; transition: opacity 0.12s; }
  .row:hover .acts, .row.on .acts, .row:focus-within .acts { opacity: 1; }
  .tag { flex: none; padding: 0 6px; border-radius: 999px; font-size: 0.78rem; line-height: 15px; font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; border: 1px solid var(--border); color: var(--text-dim); }
  .tag.prod { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .tag.net { color: var(--warn, #d9a441); border-color: color-mix(in srgb, var(--warn, #d9a441) 50%, var(--border)); }
  .tag.auto { color: var(--text-faint); font-weight: 500; text-transform: none; letter-spacing: 0; }

  /* The switch: the one control a forward is, most of the time. */
  .sw { position: relative; display: block; width: 32px; height: 18px; border-radius: 999px; background: var(--border-strong); cursor: pointer; flex: none; transition: background 0.16s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); transition: transform 0.16s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .sw:hover { background: color-mix(in srgb, var(--border-strong) 70%, var(--text-dim)); }
  .sw.on { background: var(--ok); }
  .sw.on::after, .sw.wait::after { transform: translateX(14px); }
  .sw.wait { background: var(--warn, #d9a441); }
  .sw.busy { opacity: 0.6; pointer-events: none; }

  .empty { display: flex; flex-direction: column; align-items: center; padding: 56px 24px; color: var(--text-faint); text-align: center; line-height: 1.7; }
  .empty.small { padding: 30px 20px; }
  .empty .art { width: 220px; height: 74px; margin-bottom: 14px; color: var(--text-faint); }
  .empty .art .flow { stroke-dasharray: 4 5; animation: flow 1.4s linear infinite; stroke: var(--accent); }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .empty b { color: var(--text); font-size: 1.25rem; font-weight: 650; margin-bottom: 4px; }
  .empty p { margin: 0; max-width: 460px; }
  .empty .btns { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .foot { display: flex; align-items: center; gap: 14px; padding: 5px 14px; border-top: 1px solid var(--border); color: var(--text-faint); background: var(--bg-panel); flex: none; white-space: nowrap; overflow: hidden; }

  /* ── one of them, looked at ── */
  #inspect { width: clamp(300px, 31vw, 372px); display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: var(--bg-panel); }
  #inspect.in { animation: slide 0.16s ease-out; }
  @keyframes slide { from { transform: translateX(14px); opacity: 0; } }
  .ih { padding: 13px 14px 11px; border-bottom: 1px solid var(--border); }
  .ih .top { display: flex; align-items: flex-start; gap: 8px; }
  .ih h2 { flex: 1; margin: 0; font-size: 1.16rem; font-weight: 650; overflow-wrap: anywhere; line-height: 1.3; }
  .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 7px; padding: 1px 9px; border-radius: 999px; font-weight: 600; border: 1px solid var(--border); color: var(--text-dim); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); background: color-mix(in srgb, var(--ok) 9%, transparent); }
  .pill.warn { color: var(--warn, #d9a441); border-color: color-mix(in srgb, var(--warn, #d9a441) 45%, var(--border)); background: color-mix(in srgb, var(--warn, #d9a441) 9%, transparent); }
  .pill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); background: color-mix(in srgb, var(--danger) 9%, transparent); }
  .ih .acts2 { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .ib2 { flex: 1; overflow: auto; min-height: 0; }
  .blk { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .blk h3 { margin: 0 0 7px; font-size: 0.8rem; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-faint); display: flex; align-items: center; }
  .why { padding: 9px 11px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--border)); background: color-mix(in srgb, var(--danger) 8%, transparent); line-height: 1.5; overflow-wrap: anywhere; }
  .why.warn { border-color: color-mix(in srgb, var(--warn, #d9a441) 40%, var(--border)); background: color-mix(in srgb, var(--warn, #d9a441) 8%, transparent); }
  .why .btns { display: flex; gap: 6px; margin-top: 8px; }
  .addr { display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 5px; min-height: 40px; }
  .addr .v { flex: 1; min-width: 0; font: 1rem/1.4 ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addr .v small { color: var(--text-faint); font-size: 0.92rem; }
  .addr.live { border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
  .addr:not(.live) .v { color: var(--text-faint); }
  .facts { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; margin: 0; }
  .facts dt { color: var(--text-faint); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .num { padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius); }
  .num b { display: block; font-size: 1.25rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .num span { color: var(--text-faint); font-size: 0.9rem; }
  .cmd { position: relative; padding: 8px 34px 8px 10px; border-radius: var(--radius); background: var(--bg-input); border: 1px solid var(--border); font: 0.93rem/1.5 ui-monospace, Menlo, monospace; color: var(--text-dim); overflow-wrap: anywhere; }
  .cmd .ib { position: absolute; top: 3px; right: 3px; }
  pre.log { margin: 0; max-height: 240px; overflow: auto; padding: 8px 10px; border-radius: var(--radius); background: var(--bg-input); border: 1px solid var(--border); font: 0.93rem/1.55 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-dim); }

  /* ── sheets, drawn over everything ── */
  #veil { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 38px 16px; background: color-mix(in srgb, var(--bg) 66%, transparent); backdrop-filter: blur(2px); overflow: auto; }
  #veil.in { animation: fade 0.12s ease-out; }
  #veil.in .card { animation: pop 0.16s cubic-bezier(0.2, 1.2, 0.4, 1); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: translateY(8px) scale(0.985); opacity: 0; } }
  .card { width: min(580px, 100%); border: 1px solid var(--border-strong); border-radius: calc(var(--radius) + 4px); background: var(--bg-panel); box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45); }
  .card.wide { width: min(760px, 100%); }
  .card .ch { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .card .ch h2 { margin: 0; font-size: 1.16rem; font-weight: 650; }
  .card .ch p { margin: 2px 0 0; color: var(--text-faint); }
  .card .body { padding: 14px 16px; display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 10px 12px; align-items: center; }
  .card .body > label { color: var(--text-dim); }
  .card .body .full { grid-column: 1 / -1; }
  .card .body .top { align-self: start; padding-top: 24px; }
  .card .body input[type="text"], .card .body select { width: 100%; }
  .card .cut { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 4px; color: var(--text-faint); font-size: 0.8rem; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; cursor: pointer; }
  .card .cut:hover { color: var(--text-dim); }
  .card .cut::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .card .cf { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--border); }
  .err { color: var(--danger); line-height: 1.45; overflow-wrap: anywhere; }
  .ports { display: flex; flex-direction: column; gap: 6px; }
  .ports .p { display: flex; align-items: center; gap: 7px; }
  .card .body .ports .p input { width: 112px; font-family: ui-monospace, Menlo, monospace; }
  .ports .p .w { color: var(--warn, #d9a441); font-size: 0.93rem; line-height: 1.3; }
  .ports .cap { display: flex; gap: 7px; color: var(--text-faint); font-size: 0.86rem; }
  .ports .cap span { width: 112px; }
  .ports .cap span + span { margin-left: 20px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; }
  .hint { color: var(--text-faint); line-height: 1.45; }
  .hint.warn { color: var(--warn, #d9a441); }
  .paste { grid-column: 1 / -1; position: relative; }
  .paste input { padding-left: 30px; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; border-style: dashed; }
  .paste svg { position: absolute; left: 9px; top: 7px; color: var(--text-faint); }
  .paste .ok { color: var(--ok); margin-top: 4px; }
  .mem { display: flex; align-items: center; gap: 9px; padding: 5px 16px; cursor: pointer; }
  .mem:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
  .mem .n { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem .g { color: var(--text-faint); white-space: nowrap; }
  .memh { padding: 8px 16px 3px; color: var(--text-faint); font-size: 0.8rem; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; }
  .seg { display: inline-flex; justify-self: start; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { padding: 4px 12px; color: var(--text-dim); border-right: 1px solid var(--border-strong); white-space: nowrap; }

    var inner = old ? old.querySelector('.pick, .tall') : null;
    var innerAt = inner ? inner.scrollTop : 0;
    var focused = document.activeElement && old && old.contains(document.activeElement) ? document.activeElement.id : '';
    var caret = focused && document.activeElement.type === 'text' ? document.activeElement.selectionStart : null;
    if (old) old.remove();
    var card = state.form ? formCard() : state.sheet ? ({ ports: portsCard, name: nameCard, browse: browseCard, keys: keysCard, members: membersCard })[state.sheet.kind]() : null;
    if (!card) return;
    // It arrives once; being brought up to date is not arriving again.
    var veil = h('div', { id: 'veil', class: old ? '' : 'in', role: 'dialog', 'aria-modal': 'true',
      onmousedown: function (event) { if (event.target === veil && !state.form) closeSheet(); },
      // Tab stays in what is open: the list behind it is not somewhere to end up by accident.
      onkeydown: function (event) {
        if (event.key !== 'Tab') return;
        var stops = [].slice.call(veil.querySelectorAll('button, input, select, [tabindex="0"]')).filter(function (node) { return !node.disabled && node.offsetParent !== null; });
        if (!stops.length) return;
        var first = stops[0];
        var last = stops[stops.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      } }, card);
    document.body.appendChild(veil);
    veil.scrollTop = at;
    var again = veil.querySelector('.pick, .tall');
    if (again) again.scrollTop = innerAt;
    if (state.form) fillLists();
    var first = (focused && $(focused)) || (!old && ($('name-field') || $('f-target')));
    if (first) {
      first.focus();
      if (first.id === 'name-field' && !old) first.select();
      else if (caret !== null && first.setSelectionRange) first.setSelectionRange(caret, caret);
    }
  }

  // ── menus ──
  function closeMenu() {
    var shown = $('menu');
    if (shown) shown.remove();
    if (waiting) { waiting = false; draw(); }
  }
  function menuBox(items) {
    closeMenu();
    var box = h('div', { id: 'menu', role: 'menu' }, items.map(function (item) {
      if (item === '-') return h('div', { class: 'sep' });
      if (item.label) return h('div', { class: 'lbl', text: item.label });
      return h('button', { class: item.danger ? 'danger' : '', role: 'menuitem', disabled: item.disabled, onclick: function () { closeMenu(); item.run(); } }, icon(item.icon || 'chev'), item.text);
    }));
    document.body.appendChild(box);
    return box;
  }
  function place(box, left, top) {
    var wide = document.documentElement.clientWidth;
    var tall = document.documentElement.clientHeight;
    box.style.left = Math.max(6, Math.min(left, wide - box.offsetWidth - 6)) + 'px';
    box.style.top = Math.max(6, Math.min(top, tall - box.offsetHeight - 6)) + 'px';
  }
  function menu(anchor, items) {
    var at = anchor.getBoundingClientRect();
    place(menuBox(items), at.left, at.bottom + 4);
  }
  function menuAt(x, y, items) { place(menuBox(items), x, y); }
  window.addEventListener('blur', closeMenu);

  /*
   * Nothing is redrawn under a hand. A click is a press and a release on the
   * same node; a row rebuilt in between — by a forward coming up, or by the
   * clock — would swallow it. So while a button is down, or a menu is open, or
   * something is being dragged, what wants drawing waits for that to end.
   */
  var pressing = false;
  var pressedAt = 0;
  var waiting = false;
  document.addEventListener('mousedown', function (event) {
    // Down first: closing a menu may want a redraw, and that must not happen under this very press.
    pressing = true;
    pressedAt = Date.now();
    if (!event.target.closest || !event.target.closest('#menu')) closeMenu();
  }, true);
  document.addEventListener('mouseup', function () {
    setTimeout(function () { pressing = false; if (waiting && !$('menu') && !state.dragging) { waiting = false; draw(); } }, 0);
  }, true);
  document.addEventListener('dragend', function () { pressing = false; setTimeout(function () { if (waiting) { waiting = false; draw(); } }, 0); }, true);

  // ── keys ──
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      if ($('menu')) return closeMenu();
      if (state.form || state.sheet) return closeSheet();
      if (document.activeElement && document.activeElement.id === 'search') {
        if (state.filter) { state.filter = ''; return draw(); }
        return $('list').focus();
      }
      if (state.picked) { state.picked = null; remember(); return draw(); }
      return;
    }
    var typing = /^(INPUT|SELECT|TEXTAREA)$/.test((event.target && event.target.tagName) || '');
    if (state.form || state.sheet || $('menu') || event.metaKey || event.ctrlKey || event.altKey) return;
    if (typing) {
      if (event.target.id === 'search' && (event.key === 'ArrowDown' || event.key === 'Enter')) { event.preventDefault(); $('list').focus(); step(1, true); }
      return;
    }
    // A button that has the focus answers Space and Enter itself.
    var onButton = event.target && event.target.closest && event.target.closest('button, [role="button"], [role="checkbox"]');
    var forward = state.picked ? byId(state.picked) : null;
    var key = event.key;
    if (key === '/') { event.preventDefault(); $('search').focus(); $('search').select(); }
    else if (key === 'ArrowDown' || key === 'j') { event.preventDefault(); step(1); }
    else if (key === 'ArrowUp' || key === 'k') { event.preventDefault(); step(-1); }
    else if (key === 'n' || key === 'N') { event.preventDefault(); edit(null, false, state.scope.kind === 'group' ? state.scope.id : null); }
    else if (key === 'b' || key === 'B') { event.preventDefault(); browse(); }
    else if (key === '?') { state.sheet = { kind: 'keys' }; drawSheet(); }
    else if (!forward) return;
    else if (key === ' ' && !onButton) { event.preventDefault(); toggle(forward); }
    else if (key === 'e' || key === 'E' || (key === 'Enter' && !onButton)) { event.preventDefault(); edit(forward); }
    else if ((key === 'Delete' || key === 'Backspace') && !onButton) { event.preventDefault(); remove(forward); }
    else if (key === 'r' || key === 'R') { if (active(forward)) restart(forward); }
    else if (key === 'c' || key === 'C') { var port = livePort(forward, 0) || forward.ports[0].local; if (port) copy('localhost:' + port); }
  });
  function step(by, first) {
    var rows = walkable();
    if (!rows.length) return;
    var at = rows.map(function (one) { return one.id; }).indexOf(state.picked);
    var next = first || at === -1 ? (by > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, at + by));
    if (rows[next].id === state.picked) return;
    pick(rows[next].id);
    var node = $('list').querySelector('.row.on');
    if (node && node.scrollIntoView) node.scrollIntoView({ block: 'nearest' });
  }

  // ── in and out ──
  function importDesktop() { call('importDesktopApp').then(function (result) { broughtIn(result, 'K8S Port Forward'); }, fail); }
  function importFile() { call('importFile').then(function (result) { broughtIn(result, 'the file'); }, fail); }
  function broughtIn(result, from) {
    var added = result.added || 0;
    var parts = [added ? added + ' forward' + (added === 1 ? '' : 's') + ' brought in from ' + from : 'Nothing new in ' + from];
    if (result.skipped) parts.push(result.skipped + ' already here');
    if (result.profiles) parts.push(result.profiles + ' profile' + (result.profiles === 1 ? '' : 's'));
    var notes = (result.notes || []).concat((result.refused || []).length ? ['Left out: ' + result.refused.join('; ')] : []);
    say(parts.join(' · ') + (notes.length ? '\n' + notes.join('\n') : ''), (result.refused || []).length > 0 && !added);
    load();
  }

  fill($('mark'), icon('swap'));
  fill($('b-ports'), icon('ports'), 'Ports in use');
  fill($('b-more'), icon('more'), 'More');
  $('b-ports').onclick = portsSheet;
  $('b-more').onclick = function (event) {
    menu(event.currentTarget, [
      { icon: 'file', text: 'Bring in from K8S Port Forward', disabled: !state.desktopApp, run: importDesktop },
      { icon: 'file', text: 'Import a file…', run: importFile },
      { icon: 'open', text: 'Export everything to a file…', disabled: !state.forwards.length, run: function () {
        call('exportText').then(function (data) { host.emit('save', { name: data.name, text: data.text }); }, fail);
      } },
      '-',
      { icon: 'help', text: 'Keys', run: function () { state.sheet = { kind: 'keys' }; drawSheet(); } },
    ]);
  };

  function draw() {
    // A button released outside this frame never says so here; a press older than a moment is over.
    if (pressing && Date.now() - pressedAt > 1500 && !state.dragging) pressing = false;
    if (pressing || $('menu') || state.dragging) { waiting = true; return; }
    // The search field is rebuilt with the head; what was being typed in it keeps its caret.
    var search = $('search');
    var typing = search && document.activeElement === search ? search.selectionStart : null;
    drawSide();
    drawHead();
    drawAlert();
    drawList();
    drawFoot();
    drawInspect();
    if (typing !== null) { var again = $('search'); again.focus(); again.setSelectionRange(typing, typing); }
  }

  // ── what the app says by itself ──
  host.on('pf', function (event) {
    if (!event) return;
    if (event.type === 'state' && event.state) {
      var forward = byId(event.state.id);
      if (!forward) return;
      forward.run = event.state;
      draw();
      if (state.picked === forward.id) loadLog();
      return;
    }
    // The lists changed, here or in another window.
    if (event.type === 'changed') load();
  });

  var showing = true;
  host.on('showing', function (payload) {
    showing = !payload || payload.showing !== false;
    if (showing && state.loaded) { load(); readContexts(); }
  });
  // Uptimes move, and so do the connection counts, which nothing announces: read again while somebody is looking.
  setInterval(function () {
    if (!showing || !state.loaded || state.form || state.sheet) return;
    if (!state.forwards.some(active)) return;
    refresh().then(function () { if (state.picked) loadLog(); });
  }, 5000);

  host.on('context', function (payload) {
    var resume = payload && payload.resume;
    if (resume && typeof resume === 'object') {
      if (resume.scope && typeof resume.scope.kind === 'string') state.scope = { kind: resume.scope.kind, id: resume.scope.id === undefined ? null : resume.scope.id };
      if (typeof resume.picked === 'string') state.picked = resume.picked;
      if (resume.closed && typeof resume.closed === 'object') state.closed = resume.closed;
    }
    load().then(function () { if (state.picked) loadLog(); });
    readContexts();
  });
  host.ready();
})();
</script>
