<!--
  Git Graph — the history as a graph you can work in.

  This file is the whole extension. It runs in a frame with an origin of its
  own: no DOM of the app, no `window.api`, no filesystem, no modules. Everything
  it knows it asked for through `host.call`, and everything it does it asked the
  app to do. If it throws, the app does not notice.

  The head of the document belongs to the app — the reset, the theme variables
  and the `host` bridge are already in place before anything below runs.
-->

<style>
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- the bar across the top ---------- */

  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; flex: 0 0 auto;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }
  .bar .grow { flex: 1; }
  .btn {
    padding: 3px 9px; border-radius: 5px; font-size: 11.5px;
    border: 1px solid var(--border-strong); color: var(--text-dim);
    white-space: nowrap;
  }
  .btn:hover { color: var(--text); border-color: var(--accent); }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .btn.is-on { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .icon-btn { padding: 2px 6px; border-radius: 5px; color: var(--text-dim); font-size: 13px; }
  .icon-btn:hover { color: var(--text); background: var(--bg-elevated); }

  .where { display: flex; align-items: center; gap: 6px; font-size: 11.5px; min-width: 0; }
  .where .head {
    font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;
  }
  .ahead, .behind { font-size: 10.5px; color: var(--text-dim); }

  .find { display: flex; align-items: center; gap: 4px; }
  .find input {
    width: 170px; padding: 3px 7px; font: inherit; font-size: 11.5px;
    background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 5px;
  }
  .find input:focus { outline: none; border-color: var(--accent); }
  .find .count { font-size: 10.5px; color: var(--text-faint); min-width: 46px; text-align: right; }

  /* A merge that stopped is the one thing worth saying across the whole panel. */
  .stuck {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    padding: 5px 10px; font-size: 11.5px;
    border-bottom: 1px solid var(--border); background: var(--accent-soft);
  }
  .stuck.is-hidden { display: none; }

  /* ---------- the two halves ---------- */

  .body { flex: 1; display: flex; min-height: 0; }
  .list { flex: 1; overflow: auto; position: relative; min-width: 0; }
  .spacer { position: relative; }
  #lanes { position: absolute; left: 0; top: 0; pointer-events: none; }
  #rows { position: absolute; left: 0; top: 0; right: 0; }

  .row {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px 0 0;
    white-space: nowrap; cursor: default;
  }
  .row:hover { background: var(--bg-elevated); }
  .row.is-selected { background: var(--accent-soft); }
  .row.is-match { box-shadow: inset 2px 0 0 var(--accent); }
  .row.is-dim .subject, .row.is-dim .who, .row.is-dim .when { opacity: 0.45; }

  .subject { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .row.is-wip .subject { color: var(--git-new); font-style: italic; }
  .who { display: flex; align-items: center; gap: 5px; color: var(--text-dim); font-size: 11px; flex: 0 0 auto; }
  .pip {
    width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-content: center;
    font-size: 8px; font-weight: 700; letter-spacing: 0.02em;
    color: #0b0d13;
  }
  .who .name { max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
  .when { color: var(--text-faint); font-size: 10.5px; flex: 0 0 auto; width: 52px; text-align: right; }
  .sha {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; color: var(--text-faint); flex: 0 0 auto;
  }

  /* Refs ride on the commit they point at, which is the whole idea. */
  .ref {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 0 6px; height: 16px; border-radius: 8px;
    font-size: 10px; font-weight: 600; flex: 0 0 auto;
    border: 1px solid; cursor: pointer; max-width: 190px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .ref.is-local { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .ref.is-remote { color: var(--text-dim); border-color: var(--border-strong); }
  .ref.is-tag { color: var(--git-new); border-color: var(--git-new); background: transparent; }
  .ref.is-head { box-shadow: 0 0 0 1px var(--accent); }
  .ref .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

  /* ---------- the detail on the right ---------- */

  .detail {
    flex: 0 0 340px; border-left: 1px solid var(--border);
    background: var(--bg-panel); overflow: auto; padding: 10px 12px;
  }
  .detail.is-hidden { display: none; }
  .detail h2 { margin: 0 0 2px; font-size: 12.5px; font-weight: 600; }
  .detail .meta { color: var(--text-faint); font-size: 11px; margin-bottom: 10px; }
  .detail pre {
    margin: 0 0 12px; padding: 8px 9px; white-space: pre-wrap; word-break: break-word;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    font: inherit; font-size: 11.5px; color: var(--text);
  }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .files { display: grid; gap: 1px; }
  .file {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 2px 4px; border-radius: 4px; font-size: 11.5px; text-align: left;
  }
  .file:hover { background: var(--bg-elevated); }
  .file .path { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); direction: rtl; }
  .file .add { color: var(--ok); font-size: 10.5px; }
  .file .del { color: var(--danger); font-size: 10.5px; }
  .file.is-open { background: var(--bg-elevated); }
  .file.is-open .path { color: var(--text); }
  .file .open { color: var(--text-faint); font-size: 10px; padding: 0 3px; border-radius: 3px; opacity: 0; }
  .file:hover .open { opacity: 1; }
  .file .open:hover { color: var(--accent); }

  /* The diff of one file, in the panel, because that is what a click was asking. */
  .patch {
    margin: 1px 0 5px; padding: 6px 8px; max-height: 320px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; line-height: 1.45; white-space: pre; tab-size: 2;
  }
  .patch .p-add { color: var(--ok); }
  .patch .p-del { color: var(--danger); }
  .patch .p-at { color: var(--accent); }
  .patch .p-meta { color: var(--text-faint); }

  .chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text-faint); border-radius: 3px; padding: 0 3px;
  }
  .chip:hover { color: var(--accent); background: var(--bg-elevated); }

  .more { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .more span { color: var(--text-faint); font-size: 11px; }

  .naming { display: flex; gap: 6px; margin-bottom: 12px; }
  .naming input {
    flex: 1; min-width: 0; padding: 3px 7px; font: inherit; font-size: 11.5px;
    background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 5px;
  }
  .naming input:focus { outline: none; border-color: var(--accent); }

  .note { color: var(--text-faint); padding: 14px; font-size: 11.5px; }
  .bad { color: var(--danger); padding: 10px 12px; font-size: 11.5px; }
  .busy { color: var(--text-faint); font-size: 11px; }
</style>

<div id="app">
  <header class="bar">
    <span class="where">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="var(--accent)" stroke-width="1.3">
        <circle cx="3.6" cy="3.2" r="1.7" /><circle cx="3.6" cy="10.8" r="1.7" /><circle cx="10.4" cy="6.4" r="1.7" />
        <path d="M3.6 4.9v4.2M5.2 3.9c2.6.4 3.8 1.3 4 2.3" />
      </svg>
      <span class="head" id="head">…</span>
      <span class="ahead" id="ahead"></span>
      <span class="behind" id="behind"></span>
    </span>

    <button class="btn" id="fetch">Fetch</button>
    <button class="btn" id="pull">Pull</button>
    <button class="btn" id="push">Push</button>

    <span class="grow"></span>
    <span class="busy" id="busy"></span>

    <span class="find">
      <input id="find" type="search" placeholder="Search message, author, hash" spellcheck="false" />
      <span class="count" id="found"></span>
      <button class="icon-btn" id="prev" title="Previous match">↑</button>
      <button class="icon-btn" id="next" title="Next match">↓</button>
    </span>

    <button class="btn" id="density" title="Row height">Compact</button>
    <button class="icon-btn" id="reload" title="Read the history again">⟳</button>
  </header>

  <div class="stuck is-hidden" id="stuck"></div>

  <div class="body">
    <div class="list" id="list">
      <div class="spacer" id="spacer">
        <svg id="lanes" fill="none" stroke-width="1.9" stroke-linecap="round"></svg>
        <div id="rows"></div>
      </div>
      <div id="empty"></div>
    </div>
    <aside class="detail is-hidden" id="detail"></aside>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- state

  var state = {
    root: null,
    commits: [],
    rowOf: new Map(),   // sha -> index into commits
    width: 1,
    status: null,       // the working tree, for the row that rides on HEAD
    refs: null,         // branches, tags and stashes, as git reports them
    headAt: -1,         // which commit HEAD is, as an index into commits
    wipAt: -1,          // the row the uncommitted work occupies, or -1 for none
    selected: null,     // a sha, or the string 'wip'
    query: '',
    matches: [],        // the matching commits, in order, for stepping between
    matchAt: new Set(), // the same, for asking about one row without a scan
    at: -1,             // which match the search is sitting on
    limit: 500,
    deeper: false,      // the history is longer than what has been read
    rowH: 28,
    error: null,
    showing: true,
    reading: null,      // the read in flight, so a second one waits for it
    stale: null,        // what needs re-reading once somebody looks again
  };

  var LANE_W = 15;
  var OVERSCAN = 12;

  var el = {
    list: document.getElementById('list'),
    spacer: document.getElementById('spacer'),
    lanes: document.getElementById('lanes'),
    rows: document.getElementById('rows'),
    empty: document.getElementById('empty'),
    stuck: document.getElementById('stuck'),
    detail: document.getElementById('detail'),
    head: document.getElementById('head'),
    ahead: document.getElementById('ahead'),
    behind: document.getElementById('behind'),
    busy: document.getElementById('busy'),
    find: document.getElementById('find'),
    found: document.getElementById('found'),
    density: document.getElementById('density'),
  };

  // ---------------------------------------------------------------- helpers

  function h(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function svg(tag, attrs) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var key in attrs) node.setAttribute(key, attrs[key]);
    return node;
  }

  /**
   * A colour for a name, so the same person is the same colour every time.
   *
   * Derived from the name rather than assigned in order: assigning in order
   * means somebody's colour changes when a different person commits, which is
   * exactly the thing a colour is supposed to stop happening.
   */
  function colourFor(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i += 1) hash = (hash * 31 + name.charCodeAt(i)) % 360;
    return 'hsl(' + hash + ' 58% 68%)';
  }

  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  /** How long ago, in the shortest form that is still true. */
  function ago(iso) {
    var then = Date.parse(iso);
    if (!then) return '';
    var seconds = (Date.now() - then) / 1000;
    if (seconds < 60) return 'now';
    if (seconds < 3600) return Math.round(seconds / 60) + 'm';
    if (seconds < 86400) return Math.round(seconds / 3600) + 'h';
    if (seconds < 86400 * 30) return Math.round(seconds / 86400) + 'd';
    if (seconds < 86400 * 365) return Math.round(seconds / (86400 * 30)) + 'mo';
    return Math.round(seconds / (86400 * 365)) + 'y';
  }

  function busy(text) {
    el.busy.textContent = text || '';
  }

  /** Ask the app for something, and say so plainly when it will not. */
  function call(name, args) {
    return host.call(name, args).then(function (result) {
      if (result && result.ok === false) throw new Error(result.error || 'git said no');
      return result;
    });
  }

  /**
   * What an update brought, in the number of things it brought.
   *
   * "Pulling — done" is true and says nothing: the question after an update is
   * always whether anything came in, and how much.
   */
  function whatItBrought(result) {
    var changed = result && result.changed;
    if (!changed) return null;
    if (!changed.total) return 'All files are up to date.';
    var parts = [];
    if (changed.updated) parts.push(changed.updated + ' updated');
    if (changed.added) parts.push(changed.added + ' new');
    if (changed.removed) parts.push(changed.removed + ' deleted');
    if (changed.renamed) parts.push(changed.renamed + ' moved');
    var commits = changed.commits
      ? ' in ' + changed.commits + (changed.commits === 1 ? ' commit' : ' commits')
      : '';
    return 'Updated ' + changed.total + (changed.total === 1 ? ' file' : ' files') +
      commits + ' — ' + parts.join(', ') + '.';
  }

  /** A verb that changes the repository: run it, say what happened, reload. */
  function act(label, name, args) {
    busy(label + '…');
    return call(name, args)
      .then(function (result) {
        busy('');
        host.emit('notify', { text: whatItBrought(result) || label + ' — done' });
        return load('all');
      })
      .catch(function (error) {
        busy('');
        host.emit('notify', { text: label + ' failed: ' + error.message, kind: 'bad' });
        // A merge that stops on a conflict, a checkout refused because of an
        // uncommitted file: the command failed and the repository still moved,
        // or is now mid-something. Reading it again is how that becomes visible.
        return load('all');
      });
  }

  // ---------------------------------------------------------------- the rows

  /**
   * Which commit HEAD is on.
   *
   * Not the top of the list, which is the mistake this replaces. `--all` draws
   * every branch, so the newest commit on screen belongs to whichever branch
   * happens to have it — and hanging "Uncommitted" off *that* tells you your
   * unsaved work sits on a branch you are not even on. HEAD says where it is
   * itself: it is the commit git decorated with it.
   */
  function headIndex(commits) {
    for (var i = 0; i < commits.length; i += 1) {
      var refs = commits[i].refs || [];
      for (var r = 0; r < refs.length; r += 1) if (refs[r].head) return i;
    }
    return -1;
  }

  /**
   * Rows and commits are no longer the same list.
   *
   * The uncommitted work is a row with no commit behind it, and it sits
   * immediately above HEAD rather than at the top — which is the same place when
   * you are on the newest branch, and the truthful place when you are not. These
   * two convert between the two numberings, and `wipAt` of -1 means there is
   * nothing uncommitted and the two are the same thing.
   */
  function rowOfCommit(index, wipAt) {
    return wipAt >= 0 && index >= wipAt ? index + 1 : index;
  }

  function commitOfRow(row, wipAt) {
    if (wipAt < 0) return row;
    if (row === wipAt) return -1;
    return row > wipAt ? row - 1 : row;
  }

  /** Where HEAD is and whether anything is uncommitted, after every read. */
  function locate() {
    state.headAt = headIndex(state.commits);
    var files = (state.status && state.status.files) || [];
    // With no commits at all there is nothing for it to sit on, and it is the
    // only row there is — which is the whole of a repository somebody has just
    // run `git init` in.
    state.wipAt = files.length ? Math.max(0, state.headAt) : -1;
  }

  function totalRows() {
    return state.commits.length + (state.wipAt >= 0 ? 1 : 0);
  }

  /** The files git could not merge. Their own state, not a guess from an error. */
  function conflicted() {
    var files = (state.status && state.status.files) || [];
    var out = [];
    for (var i = 0; i < files.length; i += 1) if (files[i].conflicted) out.push(files[i]);
    return out;
  }

  /** Whether a branch of this name is already here, which decides how to check it out. */
  function haveLocal(name) {
    var local = (state.refs && state.refs.local) || [];
    for (var i = 0; i < local.length; i += 1) if (local[i].name === name) return true;
    return false;
  }

  // ---------------------------------------------------------------- loading

  /** Of two things waiting to be re-read, the one that covers both. */
  function strongest(a, b) {
    return a === 'all' || b === 'all' ? 'all' : (a || b || null);
  }

  /**
   * Read the repository.
   *
   * `what` is 'status' when only the working tree moved — a file saved, a build
   * writing — because re-reading five hundred commits and every ref to find out
   * that one file is now modified is two git processes spent on nothing. A
   * commit, a checkout or a fetch moves the history, and that is 'all'.
   */
  function load(what) {
    if (!state.root) return Promise.resolve();
    var wanted = what || 'all';
    // A tab behind another one is not kept true. It is caught up on the way in.
    if (!state.showing) {
      state.stale = strongest(state.stale, wanted);
      return Promise.resolve();
    }
    /*
     * One read at a time.
     *
     * A working tree being written to reports a change every few hundred
     * milliseconds, and reading a large repository takes longer than that — so
     * without this the reads overlap, each spawning git processes whose answer
     * the next one throws away, on a machine that is already busy. What was
     * asked for meanwhile happens once, when this one lands.
     */
    if (state.reading) {
      state.stale = strongest(state.stale, wanted);
      return state.reading;
    }
    var only = wanted === 'status' && state.commits.length > 0;
    busy('Reading…');
    state.reading = Promise.all([
      only ? Promise.resolve(null) : call('graph', { limit: state.limit }),
      call('status', {}),
      only ? Promise.resolve(null) : call('refs', {}),
    ])
      .then(function (answers) {
        if (answers[0]) {
          state.commits = answers[0].commits || [];
          state.width = Math.max(1, answers[0].width || 1);
          // git was asked for `limit` and gave exactly that many: there is
          // almost certainly more behind it.
          state.deeper = state.commits.length >= state.limit;

          // A map, not a scan. Every merge line has to find the row of its
          // parent, and doing that by walking the list turns a long history into
          // something quadratic — which is the difference between this being
          // usable at five thousand commits and not.
          state.rowOf = new Map();
          for (var i = 0; i < state.commits.length; i += 1) state.rowOf.set(state.commits[i].sha, i);
        }
        state.status = answers[1];
        if (answers[2]) state.refs = answers[2];
        state.error = null;
        locate();
        // A commit that was selected and is no longer in the history — rebased
        // away, or behind the end of what was read — is not a selection.
        if (state.selected && state.selected !== 'wip' && !state.rowOf.has(state.selected)) state.selected = null;
        if (state.selected === 'wip' && state.wipAt < 0) state.selected = null;

        busy('');
        search(state.query);
        drawBar();
        draw();
        drawDetail();
        if (resumeTop !== null) {
          el.list.scrollTop = resumeTop;
          resumeTop = null;
          draw();
        }
      })
      .catch(function (error) {
        state.error = error.message;
        busy('');
        draw();
      })
      .then(function () {
        state.reading = null;
        if (!state.stale) return;
        var owed = state.stale;
        state.stale = null;
        load(owed);
      });
    return state.reading;
  }

  // ---------------------------------------------------------------- the bar

  function drawBar() {
    var status = state.status || {};
    var at = state.headAt >= 0 ? state.commits[state.headAt] : null;
    // A detached HEAD with no sha beside it is a state you cannot act on: the
    // sha is the only name the place you are standing in has.
    el.head.textContent = status.detached
      ? 'detached at ' + (at ? at.sha.slice(0, 7) : '?')
      : (status.branch || '—');
    el.head.title = status.upstream ? 'Tracking ' + status.upstream : 'No upstream branch';
    el.ahead.textContent = status.ahead ? '↑' + status.ahead : '';
    el.behind.textContent = status.behind ? '↓' + status.behind : '';
    drawStuck();
  }

  /**
   * A merge that stopped, said once and across the whole panel.
   *
   * Not because the conflicted files are invisible — they are in the row at the
   * top — but because the way out is not. `git merge --abort` is the thing
   * everybody wants and nobody remembers the name of, and a panel that offers
   * merge and no way back out of one is a trap with a button on it.
   */
  function drawStuck() {
    var stuck = conflicted();
    el.stuck.textContent = '';
    el.stuck.className = 'stuck' + (stuck.length ? '' : ' is-hidden');
    if (!stuck.length) return;
    el.stuck.appendChild(h('span', null,
      'A merge stopped on ' + stuck.length + (stuck.length === 1 ? ' file' : ' files') +
      ' git could not put together. Fix them and commit, or:'));
    var abort = h('button', 'btn', 'Abort the merge');
    abort.addEventListener('click', function () { act('Aborting the merge', 'abortMerge', {}); });
    el.stuck.appendChild(abort);
  }

  // ---------------------------------------------------------------- searching

  function search(query) {
    state.query = query;
    var term = query.trim().toLowerCase();
    state.matches = [];
    state.matchAt = new Set();
    if (term) {
      for (var i = 0; i < state.commits.length; i += 1) {
        var commit = state.commits[i];
        if (
          String(commit.subject || '').toLowerCase().indexOf(term) >= 0 ||
          String(commit.body || '').toLowerCase().indexOf(term) >= 0 ||
          String(commit.author || '').toLowerCase().indexOf(term) >= 0 ||
          commit.sha.indexOf(term) === 0
        ) {
          state.matches.push(i);
          state.matchAt.add(i);
        }
      }
    }
    state.at = state.matches.length ? 0 : -1;
    el.found.textContent = term ? (state.matches.length ? (state.at + 1) + '/' + state.matches.length : 'none') : '';
  }

  function step(by) {
    if (!state.matches.length) return;
    state.at = (state.at + by + state.matches.length) % state.matches.length;
    el.found.textContent = (state.at + 1) + '/' + state.matches.length;
    var index = state.matches[state.at];
    state.selected = state.commits[index].sha;
    draw();
    drawDetail();
    remember();
    scrollTo(index);
  }

  function scrollTo(commitIndex) {
    var top = rowOfCommit(commitIndex, state.wipAt) * state.rowH;
    var view = el.list.clientHeight;
    if (top < el.list.scrollTop || top + state.rowH > el.list.scrollTop + view) {
      el.list.scrollTop = Math.max(0, top - view / 3);
    }
  }

  // ---------------------------------------------------------------- drawing

  var laneX = function (lane) { return 11 + lane * LANE_W; };

  function windowKey() {
    return Math.floor(el.list.scrollTop / state.rowH) + ':' + Math.ceil(el.list.clientHeight / state.rowH);
  }

  function draw() {
    drawnWindow = windowKey();
    el.rows.textContent = '';
    while (el.lanes.firstChild) el.lanes.removeChild(el.lanes.firstChild);

    el.empty.textContent = '';
    if (state.error) {
      el.spacer.style.height = '0px';
      el.empty.appendChild(h('p', 'bad', state.error));
      return;
    }
    var rows = totalRows();
    if (!rows) {
      el.spacer.style.height = '0px';
      el.empty.appendChild(h('p', 'note', 'No commits yet.'));
      return;
    }

    var height = rows * state.rowH;
    var graphW = state.width * LANE_W + 14;
    el.spacer.style.height = height + 'px';
    el.lanes.setAttribute('width', graphW);
    el.lanes.setAttribute('height', height);
    el.rows.style.left = graphW + 'px';

    // Only what is on screen, plus a little either side so a fast scroll does
    // not show empty space before it catches up.
    var first = Math.max(0, Math.floor(el.list.scrollTop / state.rowH) - OVERSCAN);
    var last = Math.min(rows - 1, Math.ceil((el.list.scrollTop + el.list.clientHeight) / state.rowH) + OVERSCAN);

    for (var row = first; row <= last; row += 1) {
      var index = commitOfRow(row, state.wipAt);
      if (index < 0) drawWip(row);
      else drawCommit(index, row);
    }

    if (state.deeper) el.empty.appendChild(deeper());
  }

  /**
   * The uncommitted work, sitting on the commit it is actually on.
   *
   * A history that starts at the last commit is a history that leaves out the
   * part you are in the middle of. It is drawn as an open circle on a dashed
   * line so it never reads as something that happened, in HEAD's lane and
   * directly above HEAD's row — which is where it will be when it is committed.
   */
  function drawWip(row) {
    var anchor = state.headAt >= 0 ? state.commits[state.headAt] : null;
    var lane = anchor ? anchor.lane : 0;
    var colour = anchor ? anchor.colour : 'var(--accent)';
    var top = row * state.rowH;
    var y = top + state.rowH / 2;

    if (anchor) {
      el.lanes.appendChild(svg('path', {
        d: 'M' + laneX(lane) + ' ' + y + ' V ' + (top + state.rowH),
        stroke: colour,
        'stroke-dasharray': '3 3',
        opacity: '0.8',
      }));
    }
    el.lanes.appendChild(svg('circle', {
      cx: laneX(lane), cy: y, r: 4.5,
      fill: 'var(--bg)', stroke: colour, 'stroke-dasharray': '2.5 2.5',
    }));

    var node = h('div', 'row is-wip' + (state.selected === 'wip' ? ' is-selected' : ''));
    node.style.top = top + 'px';
    node.style.height = state.rowH + 'px';
    var count = state.status.files.length;
    var stuck = conflicted().length;
    node.appendChild(h('span', 'subject',
      'Uncommitted — ' + count + (count === 1 ? ' file' : ' files') +
      (stuck ? ' · ' + stuck + ' conflicted' : '')));
    node.addEventListener('click', function () { select('wip'); });
    el.rows.appendChild(node);
  }

  function drawCommit(index, row) {
    var commit = state.commits[index];
    var y = row * state.rowH + state.rowH / 2;
    var top = row * state.rowH;

    // Lanes that only pass this row: an unbroken vertical, or the trunk looks
    // like it stops and starts again at every branch point.
    for (var t = 0; t < commit.through.length; t += 1) {
      var lane = commit.through[t];
      el.lanes.appendChild(svg('path', {
        d: 'M' + laneX(lane.lane) + ' ' + top + ' V ' + (top + state.rowH),
        stroke: lane.colour,
      }));
    }

    for (var e = 0; e < commit.edges.length; e += 1) {
      var edge = commit.edges[e];
      var target = state.rowOf.has(edge.sha) ? state.rowOf.get(edge.sha) : -1;
      // A parent below the end of what was read still gets a stub, so the line
      // leaves the page rather than stopping in mid-air.
      var endY = target === -1
        ? y + state.rowH
        : rowOfCommit(target, state.wipAt) * state.rowH + state.rowH / 2;
      var x1 = laneX(edge.from);
      var x2 = laneX(edge.to);

      if (x1 === x2) {
        el.lanes.appendChild(svg('path', { d: 'M' + x1 + ' ' + y + ' V ' + endY, stroke: edge.colour }));
      } else {
        // A curve rather than a diagonal. The bend happens in the row the
        // branch leaves from, so the rest of the line is vertical and the eye
        // can follow it down the page.
        var bend = Math.min(state.rowH, Math.abs(endY - y)) * 0.75;
        el.lanes.appendChild(svg('path', {
          d: 'M' + x1 + ' ' + y +
             ' C ' + x1 + ' ' + (y + bend) + ', ' + x2 + ' ' + (y + bend * 0.4) + ', ' + x2 + ' ' + Math.min(endY, y + bend * 1.3) +
             ' V ' + endY,
          stroke: edge.colour,
        }));
      }
    }

    el.lanes.appendChild(svg('circle', {
      cx: laneX(commit.lane), cy: y,
      r: commit.merge ? 5.2 : 4,
      fill: commit.merge ? commit.colour : 'var(--bg)',
      stroke: commit.colour,
    }));

    var hit = state.matchAt.has(index);
    var node = h('div', 'row' +
      (state.selected === commit.sha ? ' is-selected' : '') +
      (hit ? ' is-match' : '') +
      (state.query.trim() && !hit ? ' is-dim' : ''));
    node.style.top = top + 'px';
    node.style.height = state.rowH + 'px';

    for (var r = 0; r < commit.refs.length; r += 1) node.appendChild(refPill(commit.refs[r]));

    node.appendChild(h('span', 'subject', commit.subject || '(no message)'));

    var who = h('div', 'who');
    var pip = h('span', 'pip', initials(commit.author));
    pip.style.background = colourFor(String(commit.author || ''));
    who.appendChild(pip);
    who.appendChild(h('span', 'name', commit.author || ''));
    node.appendChild(who);

    var when = h('span', 'when', ago(commit.date));
    when.title = new Date(commit.date).toLocaleString();
    node.appendChild(when);
    node.appendChild(h('span', 'sha', commit.sha.slice(0, 7)));

    node.addEventListener('click', function () { select(commit.sha); });
    el.rows.appendChild(node);
  }

  /**
   * More history, asked for rather than assumed.
   *
   * Five hundred commits is a lot to draw and nothing at all next to a repository
   * that has been alive for years, and the old panel simply stopped there without
   * saying so — a history that ends in 2023 and no clue that it does not.
   */
  function deeper() {
    var box = h('div', 'more');
    var button = h('button', 'btn', 'Read further back');
    button.addEventListener('click', function () {
      state.limit += 1000;
      load('all');
    });
    box.appendChild(button);
    box.appendChild(h('span', null, state.commits.length + ' commits read; there is more behind them.'));
    return box;
  }

  /**
   * A branch, a remote or a tag, on the commit it points at.
   *
   * Clickable, because a label you can see but not use is half a feature: a
   * local branch checks out, a remote one is checked out as a local branch that
   * tracks it, and a tag checks out where it points.
   */
  function refPill(ref) {
    var pill = h('button', 'ref is-' + ref.kind + (ref.head ? ' is-head' : ''), ref.name);
    pill.title =
      ref.kind === 'local' ? 'Local branch — click to check out'
      : ref.kind === 'remote' ? 'On the remote — click to check it out'
      : ref.kind === 'tag' ? 'Tag — click to check out'
      : ref.kind;
    if (ref.kind !== 'head') pill.appendChild(h('span', 'dot'));
    pill.addEventListener('click', function (event) {
      event.stopPropagation();
      if (ref.kind === 'remote') {
        var local = ref.name.split('/').slice(1).join('/');
        // `checkout -b --track` refuses outright when the branch is already
        // here — which is the usual case, because a branch you can see on the
        // remote is normally one you pushed. Then it is a plain checkout, and
        // the local branch is already tracking this one.
        if (haveLocal(local)) act('Checking out ' + local, 'checkout', { ref: local });
        else act('Checking out ' + local, 'trackRemote', { remote: ref.name, local: local });
      } else if (ref.kind === 'local' || ref.kind === 'tag') {
        act('Checking out ' + ref.name, 'checkout', { ref: ref.name });
      }
    });
    return pill;
  }

  // ---------------------------------------------------------------- the detail

  function select(what) {
    state.selected = state.selected === what ? null : what;
    draw();
    drawDetail();
    remember();
  }

  function drawDetail() {
    el.detail.textContent = '';
    if (!state.selected) {
      el.detail.className = 'detail is-hidden';
      return;
    }
    el.detail.className = 'detail';

    if (state.selected === 'wip') {
      drawWipDetail();
      return;
    }

    var commit = state.commits[state.rowOf.get(state.selected)];
    if (!commit) return;

    el.detail.appendChild(h('h2', null, commit.subject || '(no message)'));

    var meta = h('p', 'meta');
    var sha = h('button', 'chip', commit.sha.slice(0, 10));
    sha.title = 'Copy the whole hash';
    sha.addEventListener('click', function () {
      host.emit('copy', { text: commit.sha });
      host.emit('notify', { text: 'Copied ' + commit.sha });
    });
    meta.appendChild(sha);
    meta.appendChild(h('span', null, ' · ' + commit.author + ' · ' + new Date(commit.date).toLocaleString()));
    el.detail.appendChild(meta);

    // The rest of the message. A subject line is a title, and a panel that shows
    // only titles cannot answer the question people open a history to ask, which
    // is why somebody did this.
    if (commit.body) el.detail.appendChild(h('pre', null, commit.body));

    var acts = h('div', 'acts');
    acts.appendChild(action('Check out', function () {
      act('Checking out ' + commit.sha.slice(0, 7), 'checkout', { ref: commit.sha });
    }));
    acts.appendChild(action('Branch here', function () {
      // Asked for inline rather than in a dialog. A frame like this one has no
      // modals — and should not: a panel able to stop the app until it is
      // answered is a panel able to stop the app.
      naming(commit.sha);
    }));
    acts.appendChild(action('Revert', function () {
      act('Reverting ' + commit.sha.slice(0, 7), 'revert', { sha: commit.sha });
    }));
    acts.appendChild(action('Merge into current', function () {
      act('Merging ' + commit.sha.slice(0, 7), 'merge', { ref: commit.sha });
    }));
    acts.appendChild(action('Rebase onto this', function () {
      act('Rebasing onto ' + commit.sha.slice(0, 7), 'rebase', { ref: commit.sha });
    }));
    el.detail.appendChild(acts);

    var files = h('div', 'files');
    files.appendChild(h('p', 'note', 'Reading the files…'));
    el.detail.appendChild(files);

    var wanted = commit.sha;
    call('commitFiles', { sha: commit.sha }).then(function (result) {
      if (state.selected !== wanted) return;
      files.textContent = '';
      var listed = result.files || [];
      if (!listed.length) files.appendChild(h('p', 'note', 'No files in it — an empty commit.'));
      for (var i = 0; i < listed.length; i += 1) {
        files.appendChild(fileRow(listed[i], { sha: wanted, file: listed[i].path }));
      }
    }).catch(function (error) {
      if (state.selected !== wanted) return;
      files.textContent = '';
      files.appendChild(h('p', 'bad', error.message));
    });
  }

  /** The uncommitted work: what is in it, and its diff a click away. */
  function drawWipDetail() {
    var files = (state.status && state.status.files) || [];
    var stuck = conflicted();
    el.detail.appendChild(h('h2', null, 'Uncommitted changes'));
    el.detail.appendChild(h('p', 'meta',
      stuck.length
        ? stuck.length + (stuck.length === 1 ? ' file' : ' files') + ' still conflicted.'
        : 'Not committed anywhere yet.'));

    var list = h('div', 'files');
    for (var i = 0; i < files.length; i += 1) {
      var file = files[i];
      list.appendChild(fileRow(file, { file: file.path, untracked: !!file.untracked }));
    }
    el.detail.appendChild(list);
  }

  /**
   * One file, and its diff when you ask for it.
   *
   * A click used to open the file as it is now — which, for a file in a commit
   * from March, is somebody else's answer to the question being asked. What
   * changed *in this commit* is the diff, so that is what a click gives. The
   * arrow still opens the file as it stands today, and now says so.
   */
  function fileRow(file, ask) {
    var wrap = h('div', 'file-wrap');
    var row = h('button', 'file');
    if (file.letter) row.appendChild(h('span', 'sha', file.letter));
    // Right-to-left so the ellipsis eats the start of a long path and leaves
    // the filename, which is the part anybody is looking for.
    row.appendChild(h('span', 'path', file.path));
    if (file.added) row.appendChild(h('span', 'add', '+' + file.added));
    if (file.removed) row.appendChild(h('span', 'del', '−' + file.removed));

    var open = h('span', 'open', '↗');
    open.title = 'Open the file as it is now';
    open.addEventListener('click', function (event) {
      event.stopPropagation();
      host.emit('openFile', { path: state.root + '/' + file.path });
    });
    row.appendChild(open);

    row.title = file.path;
    row.addEventListener('click', function () {
      var shown = wrap.querySelector('.patch');
      if (shown) {
        shown.remove();
        row.className = 'file';
        return;
      }
      row.className = 'file is-open';
      var box = h('pre', 'patch', 'Reading…');
      wrap.appendChild(box);
      call('diff', ask).then(function (result) {
        box.textContent = '';
        paint(box, result.patch || '');
      }).catch(function (error) {
        box.textContent = error.message;
      });
    });

    wrap.appendChild(row);
    return wrap;
  }

  /** What a line of a diff is, which is the whole of how one is read. */
  function patchKind(line) {
    if (line.slice(0, 2) === '@@') return 'p-at';
    if (line.slice(0, 3) === '+++' || line.slice(0, 3) === '---') return 'p-meta';
    if (line.charAt(0) === '+') return 'p-add';
    if (line.charAt(0) === '-') return 'p-del';
    if (line.slice(0, 4) === 'diff' || line.slice(0, 5) === 'index') return 'p-meta';
    return '';
  }

  /** How much of a patch is worth putting in a side panel before it is a file. */
  var PATCH_LINES = 600;

  function paint(box, patch) {
    var lines = String(patch).split('\n');
    if (!String(patch).trim()) {
      box.appendChild(h('span', 'p-meta', 'No text changed — a binary file, or only its mode.'));
      return;
    }
    var shown = lines.slice(0, PATCH_LINES);
    for (var i = 0; i < shown.length; i += 1) {
      box.appendChild(h('span', patchKind(shown[i]), shown[i] + '\n'));
    }
    var left = lines.length - shown.length;
    if (left > 0) {
      box.appendChild(h('span', 'p-meta', '\n… ' + left + ' more lines. Open the file to read the rest.'));
    }
  }

  /** Ask for a branch name in the panel itself, and start it at this commit. */
  function naming(sha) {
    if (el.detail.querySelector('.naming')) return;
    var box = h('div', 'naming');
    var field = document.createElement('input');
    field.type = 'text';
    field.placeholder = 'New branch at ' + sha.slice(0, 7);
    field.spellcheck = false;
    var go = h('button', 'btn', 'Create');
    var stop = h('button', 'btn', 'Cancel');
    box.appendChild(field);
    box.appendChild(go);
    box.appendChild(stop);

    var create = function () {
      var name = field.value.trim();
      if (!name) return;
      act('Creating ' + name, 'createBranch', { name: name, from: sha });
    };
    go.addEventListener('click', create);
    stop.addEventListener('click', function () { box.remove(); });
    field.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') create();
      if (event.key === 'Escape') box.remove();
    });

    el.detail.insertBefore(box, el.detail.querySelector('.files'));
    field.focus();
  }

  function action(label, run) {
    var button = h('button', 'btn', label);
    button.addEventListener('click', run);
    return button;
  }

  // ---------------------------------------------------------------- coming back

  /**
   * Where this panel was, kept by the app rather than by the frame.
   *
   * The frame is thrown away and rebuilt for things that have nothing to do with
   * git — the theme changing, a session opening underneath it — and a rebuilt
   * frame is a new document that starts at the top of the history with nothing
   * selected. Only the navigation goes across: what was on screen, never what
   * was read out of the repository, because the repository is read again anyway.
   */
  function remember() {
    host.emit('remember', {
      selected: state.selected,
      query: state.query,
      rowH: state.rowH,
      limit: state.limit,
      top: Math.round(el.list.scrollTop),
    });
  }

  var resumeTop = null;

  function resume(saved) {
    if (!saved) return;
    state.selected = saved.selected || null;
    state.query = saved.query || '';
    if (saved.rowH === 22 || saved.rowH === 28) state.rowH = saved.rowH;
    if (saved.limit > state.limit) state.limit = saved.limit;
    // The search box is part of the document rather than of the state, so it has
    // to be put back too — a search that is applied and not shown is a list that
    // is greyed out for no reason anybody can see.
    if (state.query) el.find.value = state.query;
    density(state.rowH === 22);
    resumeTop = Number(saved.top) || 0;
  }

  function density(compact) {
    state.rowH = compact ? 22 : 28;
    el.density.textContent = compact ? 'Comfortable' : 'Compact';
    el.density.className = 'btn' + (compact ? ' is-on' : '');
  }

  // ---------------------------------------------------------------- wiring

  /**
   * Redraw on scroll, but only when a different set of rows is on screen.
   *
   * A scroll event fires far more often than the window changes, and rebuilding
   * sixty rows and their lanes for a two-pixel move is work nobody asked for.
   */
  var drawnWindow = '';
  var scrolled = null;
  el.list.addEventListener('scroll', function () {
    // Where the list is scrolled to is worth coming back to, but it changes at
    // the rate of a finger on a trackpad, so it is said once the finger stops.
    if (scrolled) clearTimeout(scrolled);
    scrolled = setTimeout(function () { scrolled = null; remember(); }, 400);
    var key = windowKey();
    if (key === drawnWindow) return;
    drawnWindow = key;
    draw();
  });
  window.addEventListener('resize', function () { draw(); });

  document.getElementById('reload').addEventListener('click', function () { load('all'); });
  document.getElementById('fetch').addEventListener('click', function () { act('Fetching', 'fetch', {}); });
  document.getElementById('pull').addEventListener('click', function () { act('Pulling', 'pull', {}); });
  document.getElementById('push').addEventListener('click', function () {
    var status = state.status || {};
    act('Pushing', 'push', status.upstream ? {} : { setUpstream: status.branch });
  });

  el.density.addEventListener('click', function () {
    density(state.rowH !== 22);
    draw();
    remember();
  });

  el.find.addEventListener('input', function () {
    search(this.value);
    draw();
    remember();
    if (state.matches.length) scrollTo(state.matches[0]);
  });
  el.find.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') step(event.shiftKey ? -1 : 1);
    if (event.key === 'Escape') { this.value = ''; search(''); draw(); remember(); }
  });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });

  document.addEventListener('keydown', function (event) {
    if (event.target === el.find) return;
    if (event.key === '/') { event.preventDefault(); el.find.focus(); return; }
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    if (!totalRows()) return;
    event.preventDefault();
    // Walk rows rather than commits, so the uncommitted row is somewhere the
    // keyboard can reach rather than a thing only the mouse knows about.
    var row = state.selected === 'wip'
      ? state.wipAt
      : (state.selected && state.rowOf.has(state.selected)
        ? rowOfCommit(state.rowOf.get(state.selected), state.wipAt)
        : -1);
    var next = Math.max(0, Math.min(totalRows() - 1, row + (event.key === 'ArrowDown' ? 1 : -1)));
    var index = commitOfRow(next, state.wipAt);
    state.selected = index < 0 ? 'wip' : state.commits[index].sha;
    draw();
    drawDetail();
    remember();
    if (index >= 0) scrollTo(index);
    else el.list.scrollTop = Math.max(0, next * state.rowH - el.list.clientHeight / 3);
  });

  // The app answers `ready` with where we are, and tells us when the working
  // tree moves. Everything else this panel knows, it asked for.
  host.on('context', function (context) {
    state.root = context.root;
    if (context.showing === false) state.showing = false;
    resume(context.resume);
    load('all');
  });

  /**
   * Whether this tab is in front.
   *
   * A panel behind another tab is not kept true: three git processes per change
   * notice, for a picture nobody is looking at, in a repository a build may be
   * writing into. It catches up on the way back in instead, which is the moment
   * the question "what happened while I was away" is actually being asked.
   */
  host.on('showing', function (payload) {
    var was = state.showing;
    state.showing = !payload || payload.showing !== false;
    if (!state.showing || was) return;
    var owed = state.stale;
    state.stale = null;
    load(owed || 'status');
  });

  var settle = null;
  host.on('changed', function (payload) {
    // A build can produce a change notice every few hundred milliseconds. The
    // history is not moving that fast, and three git calls per notice would be
    // the panel making the machine busy to tell you nothing new.
    var kind = payload && payload.kind === 'git' ? 'all' : 'status';
    state.stale = strongest(state.stale, kind);
    if (settle) clearTimeout(settle);
    settle = setTimeout(function () {
      settle = null;
      var owed = state.stale;
      state.stale = null;
      load(owed);
    }, 900);
  });
  host.ready();
})();
</script>
