<style>
  /*
   * A dashboard for a cluster, drawn in a frame that has no idea what a cluster
   * is. Everything it knows arrives through `host.call`, and everything it looks
   * like comes from the app's own tokens — so it is the app's light or dark, its
   * accent and its radius, without knowing which of them it is in.
   */
  #app { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto auto; height: 100%; min-height: 0; }

  /*
   * Subtabs: several places in one cluster at once — a namespace's pods in
   * one, the deployments of another in the next — each with its own view,
   * namespace, filter, sort and selection. What belongs to the cluster rather
   * than to a place (the logs at the bottom, the forwards, the namespaces) is
   * shared between them.
   */
  .subtabs {
    display: flex; align-items: stretch; gap: 1px; min-width: 0;
    padding: 0 6px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
    overflow-x: auto; scrollbar-width: none;
  }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtab {
    display: flex; align-items: center; gap: 6px; flex: 0 1 auto; min-width: 70px; max-width: 220px;
    padding: 4px 6px 4px 10px; font-size: 11.5px; color: var(--text-dim);
    border-bottom: 2px solid transparent; cursor: pointer; user-select: none;
  }
  .subtab:hover { color: var(--text); background: var(--bg-elevated); }
  .subtab.on { color: var(--text); border-bottom-color: var(--accent); }
  .subtab .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subtab .ns { color: var(--text-faint); }
  .subtab .x {
    flex: none; width: 16px; height: 16px; line-height: 14px; text-align: center; border-radius: calc(var(--radius, 8px) / 2);
    color: var(--text-faint); font-size: 13px; visibility: hidden;
  }
  .subtab:hover .x, .subtab.on .x { visibility: visible; }
  .subtab .x:hover { background: var(--border); color: var(--text); }
  .subtab-new { flex: none; padding: 0 9px; color: var(--text-faint); font-size: 15px; }
  .subtab-new:hover { color: var(--text); background: var(--bg-elevated); }
  /* Splitting a place off into a pane of its own, to put two side by side. The
     same two icons the app's own panes use for the same thing. */
  .subtab-tools { display: flex; align-items: center; gap: 1px; margin-left: auto; padding-left: 8px; flex: none; }
  .subtab-tool {
    display: grid; place-items: center; width: 24px; height: 22px; border-radius: var(--radius);
    color: var(--text-faint);
  }
  .subtab-tool:hover { color: var(--text); background: var(--bg-elevated); }
  .subtab-tool svg { width: 14px; height: 14px; }

  .top {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    background: var(--bg-panel); flex-wrap: wrap;
    /* The same 41px bar, 26px controls, as every other panel's top bar. */
    min-height: 41px; box-sizing: border-box;
  }
  .top select, .top input {
    font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 3px 7px; max-width: 260px; min-height: 26px; box-sizing: border-box;
  }
  .top select:focus, .top input:focus { outline: none; border-color: var(--accent); }
  #search { flex: 1; min-width: 120px; max-width: none; }
  .spacer { flex: 1; }

  .btn {
    padding: 3px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius);
    color: var(--text); white-space: nowrap;
  }
  .btn:hover { color: var(--text); border-color: var(--text-faint); background: var(--bg-elevated); }
  .btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  /* The one thing a form or dialog is for — Apply, Ask, Forward — filled, like the app's own primary buttons. */
  .btn.go { color: var(--on-accent, #fff); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.go:hover { color: var(--on-accent, #fff); background: color-mix(in srgb, var(--accent) 88%, var(--text)); border-color: transparent; }
  /*
   * A button that takes something away looks like one before the pointer is on
   * it. It only turned red on hover, which is exactly too late: Delete, Drain
   * and Uninstall sat in a row looking like Logs, and the difference between
   * them showed up at the moment somebody was already committing to a click.
   */
  .btn.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
  .btn.bad:hover { color: var(--danger); border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  .gap { flex: 1; min-width: 8px; }

  /* The columns are set from script, so they can be dragged. The values here
     are only what they start at. */
  /* `overflow: hidden` is what keeps the overview inside its own row. Squeezed
     to nothing — by a log dragged to the top of the panel, or by one filling
     the window — the crumb still wants its thirty-odd pixels, and `.body` is
     positioned, so it paints them straight over the log's tabs. Clipped, the
     row that has no height shows nothing. */
  .body { display: grid; grid-template-columns: 178px 1fr; min-height: 0; overflow: hidden; }
  .body.with-detail { grid-template-columns: 178px 1fr 34%; }

  /* The line between two columns, wide enough to grab and quiet until you do —
     the same handle the log drawer has, standing up. */
  .grip {
    position: absolute; top: 0; bottom: 0; width: 7px; margin-left: -4px;
    cursor: col-resize; z-index: 3;
  }
  .grip:hover, .grip.is-held { background: var(--accent-soft); }

  nav {
    overflow-y: auto; border-right: 1px solid var(--border);
    padding: 6px 0 20px; background: var(--bg-panel);
  }
  nav h4, .nav-group {
    margin: 10px 0 2px; font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint);
  }
  nav h4 { margin-left: 10px; }
  .nav-sub { margin: 7px 0 2px 22px !important; opacity: 0.75; }
  nav button {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    padding: 4px 10px; color: var(--text-dim); font-size: 12px;
  }
  .nav-group { padding: 4px 10px; white-space: nowrap; }
  .nav-group .group-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .nav-group:hover { color: var(--text); }
  .nav-group.is-open { color: var(--text-dim); }
  /* Big enough to read as a state rather than as punctuation: this is the one
     mark that says whether a group is open, so it is the size of the text it
     sits beside, not the size of a bullet. */
  .twist { display: inline-block; width: 12px; font-size: 12px; line-height: 1; opacity: 0.85; }
  .nav-item { padding-left: 25px; }
  nav button:hover { background: var(--bg-elevated); color: var(--text); }
  nav button.on { background: var(--accent-soft); color: var(--accent); }
  nav .count { margin-left: auto; font-size: 10px; color: var(--text-faint); }
  nav button.on .count { color: var(--accent); }

  main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  .crumb {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
  }
  .crumb strong { color: var(--text); font-weight: 550; font-size: 12px; }
  .scroll { overflow: auto; min-height: 0; }

  table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  th.tick, td.tick { width: 24px; padding-right: 0; }
  td.tick input, th.tick input { cursor: pointer; margin: 0; vertical-align: middle; accent-color: var(--accent); }
  th.more, td.more { width: 22px; padding: 0; text-align: center; }
  td.more button { color: var(--text-faint); padding: 2px 4px; border-radius: var(--radius); opacity: 0; }
  tbody tr:hover td.more button, tbody tr.on td.more button { opacity: 1; }
  td.more button:hover { color: var(--text); background: var(--bg-elevated); }
  .row-menu {
    position: fixed; z-index: 8; display: flex; flex-direction: column; gap: 2px; padding: 4px;
    background: var(--bg-elevated); border: 1px solid var(--border-strong);
    border-radius: var(--radius); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
  }
  .row-menu .btn { border-color: transparent; text-align: left; border-radius: max(2px, calc(var(--radius, 8px) - 4px)); }
  .row-menu .btn:hover { border-color: var(--border); }
  .row-menu .btn { display: flex; align-items: baseline; gap: 14px; min-width: 190px; }
  .menu-hint { margin-left: auto; max-width: 180px; overflow: hidden; text-overflow: ellipsis; color: var(--text-faint); font-size: 10.5px; }
  .menu-rule { border: 0; border-top: 1px solid var(--border); margin: 3px 2px; }
  .detail-head h3 { cursor: copy; }
  .detail-head h3:hover { color: var(--accent); }

  th {
    position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 550;
    padding: 5px 9px; background: var(--bg-panel); color: var(--text-faint);
    border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .arrow { opacity: 0.55; margin-left: 3px; }
  td { padding: 4px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.grow { white-space: normal; word-break: break-word; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg-elevated); }
  tbody tr.on { background: var(--accent-soft); }
  .name { color: var(--text); }
  /* A name is clipped, not allowed to push every other column off the side:
     the status is the thing people scan for, and it was the first to go.
     The whole name is in the tooltip and in the detail pane. */
  td.name .label { display: inline-block; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .with-detail td.name .label { max-width: 30ch; }
  .dim { color: var(--text-dim); }
  /* Ages count every second; figures of one width keep the column from twitching. */
  .since, .fresh { font-variant-numeric: tabular-nums; }
  .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace; font-size: 10.5px; }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn, var(--git-new)); }
  .dot.bad { background: var(--danger); }
  .dot.idle { background: var(--text-faint); }
  .bad-text { color: var(--danger); }
  .warn-text { color: var(--warn, var(--git-new)); }

  aside {
    border-left: 1px solid var(--border); background: var(--bg-panel);
    display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0;
  }
  .detail-head { position: relative; padding: 10px 12px 8px; border-bottom: 1px solid var(--border); }
  aside.pane-in { animation: pane-in 0.16s ease-out; }
  @keyframes pane-in { from { opacity: 0; translate: 12px 0; } to { opacity: 1; translate: 0 0; } }
  .pane-tools { position: absolute; top: 7px; right: 8px; display: flex; gap: 2px; }
  .pane-tool { min-width: 22px; height: 22px; padding: 0 5px; border-radius: var(--radius); color: var(--text-dim); font-size: 11px; line-height: 1; }
  .pane-tool:hover { color: var(--text); background: var(--bg-elevated); }
  .pane-tool.on { color: var(--accent); background: var(--accent-soft); }
  .pane-tool[disabled] { opacity: 0.35; cursor: default; }
  .pane-tools .detail-close { position: static; width: 22px; height: 22px; font-size: 15px; opacity: 1; }
  .pane-title { display: flex; align-items: center; gap: 8px; min-height: 22px; padding-right: 130px; }
  .kind-badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); }
  .kind-badge.c-nw { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }
  .kind-badge.c-st { color: var(--violet); background: color-mix(in srgb, var(--violet) 14%, transparent); }
  .kind-badge.c-nd { color: var(--text-dim); background: var(--bg-elevated); }
  .pane-reading { color: var(--text-faint); font-size: 11px; }
  .detail-head h3.pane-name { margin: 6px 0 4px; font-size: calc(15px * var(--pane-scale, 1)); font-weight: 600; line-height: 1.25; }
  .detail-head small.pane-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: calc(11px * var(--pane-scale, 1)); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--border-strong); color: var(--text-dim); font-weight: 550; }
  .pill.p-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .pill.p-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .pill.p-bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  aside .detail-body { zoom: var(--pane-scale, 1); padding: 12px 12px 20px; }
  .mglance { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 6px; }
  .mstat { padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); min-width: 0; }
  .mstat b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mstat span { display: block; font-size: 10px; color: var(--text-dim); }
  .mstat.warn b { color: var(--warn); }
  .mstat.bad b { color: var(--danger); }
  .mnote { margin: 8px 0 0; font-size: 11px; color: var(--text-dim); }
  .mgos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 5px; }
  .mgo { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 5px 8px; text-align: left; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-size: 11px; line-height: 14px; transition: border-color 0.12s, background-color 0.12s; }
  .mgo:hover { border-color: var(--accent); background: var(--accent-soft); }
  .mgo.h-warn { border-color: color-mix(in srgb, var(--warn) 60%, var(--border)); }
  .mgo.h-bad { border-color: color-mix(in srgb, var(--danger) 60%, var(--border)); }
  .mchain { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .mchain .mgo { flex: 1 1 0; }
  .mchain > i { flex: none; font-style: normal; color: var(--text-faint); }
  .mmeter { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 2px 10px; margin-top: 7px; font-size: 11px; color: var(--text-dim); }
  .mmeter small { grid-column: 2; font-size: 10px; color: var(--text-faint); }
  .mrisk { padding: 6px 0; border-top: 1px solid var(--border); font-size: 11px; }
  .mrisk:first-child { border-top: 0; padding-top: 0; }
  .mrisk p { margin: 3px 0 0; color: var(--text-dim); }
  .msub { margin: 9px 0 4px; font-size: 10.5px; font-weight: 500; color: var(--text-dim); }
  .msub:first-child { margin-top: 0; }
  .pane-fold { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 8px; }
  .pane-fold > summary { cursor: pointer; font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint); }
  .pane-fold > summary:hover { color: var(--text); }
  .pane-fold .block { margin-top: 6px; }
  .pane-fold .block-head { display: none; }
  @media (prefers-reduced-motion: reduce) { aside.pane-in { animation: none; } }
  .detail-close {
    position: absolute; top: 5px; right: 6px; width: 18px; height: 18px; line-height: 1;
    border-radius: var(--radius); color: var(--text-faint); font-size: 14px; opacity: 0.7;
  }
  .detail-close:hover { opacity: 1; color: var(--danger); background: var(--bg-elevated); }
  .detail-head h3 { margin: 0 0 2px; font-size: 12.5px; font-weight: 550; word-break: break-all; }
  .detail-head small { color: var(--text-dim); font-size: 10.5px; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  /* One line, always: the tabs scroll sideways when there are many, and Copy
     stays at the right end instead of dropping to a line of its own on the
     kinds with six tabs. */
  .tabs { display: flex; align-items: center; gap: 2px; padding: 5px 8px; border-bottom: 1px solid var(--border); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs > * { flex: none; }
  .tabs > .spacer { flex: 1; }
  /* The last button of the row — Copy, All — stays at the right edge even while the tabs scroll under it. */
  .tabs > .btn:last-child { position: sticky; right: 0; background: var(--bg-panel); box-shadow: -14px 0 10px -4px var(--bg-panel); }
  .tabs button { padding: 3px 8px; border-radius: var(--radius); color: var(--text-dim); font-size: 11px; }
  .tabs button:hover { background: var(--bg-elevated); color: var(--text); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); }
  .detail-body { overflow: auto; padding: 9px 10px 16px; min-height: 0; }

  pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.55; color: var(--text-dim);
  }
  pre.wrapless { white-space: pre; word-break: normal; }
  /* Full strength, not the dimmed grey the rest of the prose uses: a log is
     read line by line, often at speed, and dim text is the wrong trade there. */
  .dock-body pre { color: var(--text); }
  .log-line.err, .log-line.lvl-bad { color: var(--danger); }
  .log-line.lvl-warn { color: var(--warn, var(--git-new)); }
  .log-line.lvl-debug { color: var(--text-faint); }
  .log-line.log-note { color: var(--text-faint); font-style: italic; }
  /* When it was written: there to be read, set back so the message leads. */
  .log-ts { color: var(--text-faint); }
  /* The sixteen ANSI colours, in the same ink as the YAML below — the theme's,
     so a log stays readable on a light theme too. Bright is the same hue. */
  .a-0 { color: var(--text-dim, #545c7e); } .a-1 { color: var(--danger, #f7768e); } .a-2 { color: var(--ok, #9ece6a); } .a-3 { color: var(--warn, #e0af68); }
  .a-4 { color: var(--accent, #7aa2f7); } .a-5 { color: var(--violet, #bb9af7); } .a-6 { color: var(--info, #7dcfff); } .a-7 { color: var(--text); }
  .a-8 { color: var(--text-faint, #737aa2); } .a-9 { color: var(--danger, #ff7a93); } .a-10 { color: var(--ok, #b9f27c); } .a-11 { color: var(--warn, #ff9e64); }
  .a-12 { color: var(--accent, #7da6ff); } .a-13 { color: var(--violet, #c0a8ff); } .a-14 { color: var(--info, #0db9d7); } .a-15 { color: var(--text); }
  .a-bold { font-weight: 650; } .a-dim { opacity: 0.7; } .a-italic { font-style: italic; } .a-under { text-decoration: underline; }

  .yaml-tools { display: flex; align-items: center; gap: 5px; margin-bottom: 7px; flex-wrap: wrap; }
  /* Stuck to the top of the pane: a form long enough to scroll is a form whose
     save button you cannot see, and a save button you cannot see is one people
     reasonably conclude is not there. */
  .yaml-tools.is-stuck {
    position: sticky; top: -9px; z-index: 2; margin: -9px -10px 7px; padding: 9px 10px 7px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
  }
  .yaml-tools .dim { font-size: 10.5px; }
  .yaml-tools .btn .spin { display: inline-block; }
  #yaml-pos { font-variant-numeric: tabular-nums; }
  .btn[data-armed="1"] { color: var(--danger); border-color: var(--danger); }
  #yaml-edit[readonly] { opacity: 0.7; }
  #yaml-edit.is-wrapped { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }

  /* What the server said, where the edit is: a toast is gone before a long error has been read. */
  .edit-note {
    display: flex; gap: 8px; align-items: flex-start; margin: 0 0 7px; padding: 7px 9px;
    border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: var(--radius);
    background: var(--bg-input); font-size: 11px; animation: note-in 0.16s ease-out;
  }
  .edit-note.is-bad { border-left-color: var(--danger); }
  .edit-note-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; user-select: text; }
  .edit-note.is-bad .edit-note-text { color: var(--danger); }
  .edit-note-tools { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .edit-note-tools .btn { white-space: nowrap; }
  @keyframes note-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  .mwarn {
    position: absolute; top: 2px; right: 3px; min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px;
    font-size: 9px; line-height: 14px; font-weight: 700; text-align: center; color: #fff; background: var(--danger);
  }
  .block-note { margin-left: 8px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .row-warn, .mcard .mwarn, .mtile .mwarn { cursor: pointer; }
  .row-warn {
    margin-left: 6px; padding: 0 5px; border-radius: 7px; font-size: 9.5px; font-weight: 700; line-height: 14px;
    color: var(--danger); background: color-mix(in srgb, var(--danger) 20%, transparent);
  }
  .mwarn.is-inline { position: static; flex: none; }
  .edit-note.is-owned { border-left-color: var(--warn, #e0af68); }
  .btn[data-cannot="1"] { text-decoration: line-through; }
  #sheet { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; background: rgba(0, 0, 0, 0.45); animation: note-in 0.14s ease-out; }
  .sheet-box {
    width: min(720px, 92vw); max-height: 84vh; display: grid; grid-template-rows: auto minmax(0, 1fr);
    background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .sheet-head { display: flex; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .sheet-body { padding: 10px 12px 12px; overflow: auto; font-size: 11.5px; }
  .sheet-sub { margin-bottom: 8px; }
  .sheet-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .keys { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 4px 0 12px; }
  .keys dd { margin: 0; color: var(--text); }
  kbd {
    font: inherit; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
    background: var(--bg-input); border: 1px solid var(--border-strong); color: var(--text);
  }
  .keys-link { opacity: 0.6; margin-left: 6px; }
  .keys-link:hover { opacity: 1; }
  .rev-tools { white-space: nowrap; }
  .rev-tools .btn + .btn { margin-left: 4px; }
  .timeline-scale { display: flex; font-size: 10px; margin-bottom: 4px; }
  .timeline-track { position: relative; height: 5px; margin: 5px 0 2px; border-radius: 3px; background: var(--bg-panel); overflow: hidden; }
  .timeline-track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--text-faint); }
  .event.is-warn .timeline-track i { background: var(--danger); }
  .timeline-track i.is-going { animation: going 1.6s ease-in-out infinite; }
  @keyframes going { 50% { opacity: 0.45; } }
  .event-about { font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pane-find { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
  .pane-find input {
    flex: 1; min-width: 0; font: inherit; font-size: 11px; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--accent); border-radius: var(--radius); padding: 3px 7px;
  }
  .pane-find input:focus { outline: none; }
  .pane-find .dim { font-size: 10.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  ::highlight(pane-find) { background-color: color-mix(in srgb, var(--warn, #e0af68) 38%, transparent); }
  ::highlight(pane-find-at) { background-color: var(--warn, #e0af68); color: #111; }
  .pending-edits { color: var(--warn, #e0af68); }
  .tab-unsaved { color: var(--warn, #e0af68); font-size: 8px; margin-left: 4px; vertical-align: 2px; }
  .tab-count {
    margin-left: 5px; padding: 0 5px; border-radius: 8px; font-size: 9.5px; font-weight: 600;
    background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger);
  }

  .diff-title { display: flex; align-items: center; gap: 8px; font-size: 10.5px; margin-bottom: 5px; }
  .diff {
    font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace; font-size: 11.5px; line-height: 1.55;
    border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; background: var(--bg-input);
  }
  .diff-line { display: flex; white-space: pre; min-width: max-content; }
  .diff-line[data-line] { cursor: pointer; }
  .diff-line[data-line]:hover { filter: brightness(1.15); }
  .diff-no { width: 38px; flex: none; text-align: right; padding-right: 8px; color: var(--text-faint); user-select: none; }
  .diff-op { width: 14px; flex: none; color: var(--text-faint); user-select: none; }
  .diff-line.is-add { background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .diff-line.is-add .diff-op { color: var(--ok); }
  .diff-line.is-del { background: color-mix(in srgb, var(--danger) 16%, transparent); }
  .diff-line.is-del .diff-op { color: var(--danger); }
  .diff-line.is-del .diff-text { opacity: 0.75; }
  .diff-gap { text-align: center; color: var(--text-faint); border-block: 1px dashed var(--border); line-height: 1.1; }

  .config-problems { margin: 0 0 7px; padding: 0; list-style: none; font-size: 11px; color: var(--danger); }
  .config-problems:empty { display: none; }
  .config-problems li::before { content: "✕  "; }
  .config-field input.is-wrong, .config-env input.is-wrong { border-color: var(--danger); }

  .events { display: grid; gap: 5px; }
  .event {
    padding: 6px 9px; border: 1px solid var(--border); border-left: 3px solid var(--border-strong, var(--border));
    border-radius: var(--radius); background: var(--bg-input); font-size: 11px;
  }
  .event.is-warn { border-left-color: var(--danger); }
  /* Over: still readable, no longer asking for anything. */
  .event.is-past { opacity: 0.62; }
  .event.is-past .event-head { align-items: center; flex-wrap: wrap; }
  .event-head { display: flex; align-items: baseline; gap: 6px; }
  .event-head .dot { margin-right: 0; }
  .event.is-warn .event-head b { color: var(--danger); }
  .event-count { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--bg-panel); color: var(--text-dim, var(--text-faint)); }
  .event-text { margin-top: 3px; white-space: pre-wrap; word-break: break-word; user-select: text; }
  .event-meta { margin-top: 3px; font-size: 10.5px; }
  .event-open { color: var(--accent); cursor: pointer; text-decoration: none; }
  .event-open:hover { text-decoration: underline; }
  .event-none { padding: 14px 2px; }
  #yaml-edit {
    width: 100%; min-height: 320px; height: calc(100% - 34px); resize: vertical;
    font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.55; tab-size: 2;
    color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 8px;
    white-space: pre; overflow-wrap: normal; overflow-x: auto;
  }
  #yaml-edit:focus { outline: none; border-color: var(--accent); }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11px; }
  .facts dt { color: var(--text-faint); }
  .facts dd { margin: 0; color: var(--text); word-break: break-word; }

  /*
   * Two charts of the same size, always. Side by side while there is room for
   * both, stacked when there is not — never one wide and one narrow, which is
   * what a row of three flexing items gave: the reader compares their shapes,
   * and two different widths make the same shape look like two.
   */
  /*
     Every grid on the overview is written the same way, for the same two
     reasons.

     `min(N, 100%)` because `minmax(N, 1fr)` is a promise the track keeps even
     when the container is narrower than N — the column stays N wide and the
     content hangs out of the panel. With the min it gives up and takes the
     width there is.

     And `min-width: 0` on the children because a grid item's minimum is its
     *content's* minimum by default, so one long node name or a two-column block
     inside pushes the whole row wider than the panel and everything after it
     shifts. Neither has anything to do with how wide the window is until the
     window gets narrow, which is exactly when both show up at once.
  */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 10px; margin: 0 0 12px; }
  .charts > * { min-width: 0; }
  .chart {
    min-width: 0;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 9px 5px;
    background: var(--bg-panel);
  }
  .chart-range { display: flex; gap: 4px; justify-content: flex-end; margin: 0 0 6px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 10.5px; color: var(--text-faint); }
  .chart-head b { font-size: 13px; font-weight: 550; color: var(--text); }
  .chart svg { display: block; width: 100%; height: 46px; margin: 3px 0 2px; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .chart-fill { fill: var(--accent-soft); stroke: none; }
  .chart-foot { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-faint); }
  .chart.is-read { border-color: var(--accent); }
  .chart.is-read .chart-when { color: var(--accent); }
  .chart-cursor { stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0.7; }
  .chart-range { display: flex; align-items: flex-start; gap: 4px; }
  .chart-range .btn { padding: 2px 7px; font-size: 10.5px; }

  /* On the overview the charts sit under the cards, so they take that padding. */
  #table > .charts { padding: 0 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(118px, 100%), 1fr)); gap: 8px; padding: 12px; }
  .cards > * { min-width: 0; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; background: var(--bg-panel); }
  .card b { display: block; font-size: 21px; font-weight: 500; line-height: 1.2; }
  .card span { font-size: 10.5px; color: var(--text-faint); }
  .card.bad b { color: var(--danger); }
  .card.warn b { color: var(--warn, var(--git-new)); }

  /* Capacity: one bar carrying two facts, promised behind and used in front. */
  .gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 10px; padding: 0 12px 12px; }
  .gauges > * { min-width: 0; }
  .gauge { border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; background: var(--bg-panel); }
  .gauge-head { display: flex; align-items: baseline; gap: 5px; font-size: 10.5px; color: var(--text-faint); }
  .gauge-head span:first-child { flex: 1; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .gauge-head b { font-size: 15px; font-weight: 550; color: var(--text); }
  .gauge-bar {
    position: relative; height: 9px; margin: 7px 0 6px; border-radius: 99px;
    background: var(--bg-input); overflow: hidden;
  }
  .gauge-bar span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; }
  .gauge-req { background: var(--accent-soft); }
  .gauge-use { background: var(--accent); height: 4px !important; top: 2.5px !important; }
  .gauge-use.is-over { background: var(--warn, var(--git-new)); }
  .gauge-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--text-faint); }
  .gauge-foot i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: baseline; }
  .key-req { background: var(--accent-soft); }
  .key-use { background: var(--accent); }
  .key-use.is-over { background: var(--warn, var(--git-new)); }

  /* Two blocks side by side where there is room, stacked where there is not. */
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 10px; padding: 0 12px 12px; }
  .split > * { min-width: 0; }
  /* A block scrolls its own contents rather than pushing the row wider. A table
     of node names has a minimum width — `ip-10-0-33-84.sa-east-1.compute.internal`
     is what it is — and without this the block simply drew past the edge of the
     panel and over whatever was beside it. */
  .panel-block {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px 7px;
    background: var(--bg-panel); overflow-x: auto;
  }
  .panel-block h4 {
    margin: 0 0 8px; font-size: 10.5px; font-weight: 600; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .panel-block h4 .dim { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .panel-block table { font-size: 11px; width: 100%; }
  .panel-block td { border-bottom: 0; padding: 2px 8px 2px 0; overflow-wrap: anywhere; }

  .meter { display: flex; align-items: center; gap: 7px; font-size: 11px; padding: 2px 0; }
  .meter-name { flex: 0 0 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
  .meter-track { flex: 1; height: 6px; border-radius: 99px; background: var(--bg-input); overflow: hidden; }
  .meter-track.wide { flex: 2; }
  .meter-track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .meter-track i.is-warn { background: var(--warn, var(--git-new)); }
  .meter-track i.is-bad { background: var(--danger); }
  .meter-num { flex: 0 0 auto; min-width: 34px; text-align: right; color: var(--text-dim); font-size: 10.5px; }
  .meter-legend { display: flex; gap: 7px; font-size: 9.5px; color: var(--text-faint); padding-top: 3px; }
  .meter-legend span:nth-child(1) { flex: 0 0 34%; }
  .meter-legend span:nth-child(2), .meter-legend span:nth-child(4), .meter-legend span:nth-child(6) { flex: 1; }
  /* Inside a half-width block the names must give way to the numbers. */
  /* Shrinkable, not fixed: at the widths where the two columns have already
     folded into one, a name that refuses to give up 44% is the last four pixels
     of overflow. */
  .half .meter-name { flex: 0 1 44%; min-width: 0; }
  .half .meter-num { min-width: 0; }

  /* Two columns while two fit, and one when they do not — a pair of columns
     that will not fold is the whole of why "Busiest right now" hung out of the
     panel on a narrow window. */
  .halves { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; }
  .halves > * { min-width: 0; }
  .half h5 { margin: 0 0 4px; font-size: 10px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.07em; }
  .all-well { margin: 2px 0 4px; font-size: 11.5px; color: var(--text-dim); }
  tbody tr.clickable { cursor: default; }

  /* Pressure: rare, and worth the room when it is there. */
  .pressure {
    margin: 0 12px 12px; padding: 8px 11px; font-size: 11.5px;
    border: 1px solid var(--danger); border-radius: var(--radius);
    background: color-mix(in srgb, var(--danger) 8%, transparent); color: var(--text);
  }
  .pressure b { color: var(--danger); font-weight: 600; }

  /*
   * The same ink as the app's editor, so the same manifest is the same colours
   * wherever it is read. Copied rather than shared because this frame has an
   * origin of its own and cannot reach the app's stylesheet; a test compares the
   * rules that produce the spans, which is the half that can be wrong quietly.
   */
  .y-key { color: var(--accent, #7aa2f7); }
  .y-str { color: var(--ok, #9ece6a); }
  .y-num { color: color-mix(in srgb, var(--danger, #f7768e) 45%, var(--warn, #e0af68)); }
  .y-const, .y-anchor { color: var(--violet, #bb9af7); }
  .y-tag, .y-block { color: var(--warn, #e0af68); }
  .y-punct, .y-colon, .y-dash { color: var(--text-dim, #7b849c); }
  .y-comment { color: var(--text-faint, #565f89); font-style: italic; }
  .y-doc { color: var(--text-faint, #565f89); }

  /* A manifest is read far more often than it is edited: give it room. */
  pre.yaml, #yaml-edit {
    font-size: 11.5px; line-height: 1.55; tab-size: 2;
  }
  pre.yaml { margin: 0; padding: 10px 12px; white-space: pre; overflow: auto; }

  /*
   * One container per row: its name and its log button on top, its image under
   * both. They were three cells of a table, and an image is a registry address
   * with no spaces in it — the table gave it the width, and the name was left a
   * column one letter wide.
   */
  .containers { display: grid; gap: 7px; font-size: 11px; }
  .container-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 8px;
    row-gap: 1px;
  }
  .container-name { min-width: 0; overflow-wrap: anywhere; color: var(--text); }
  .container-image {
    grid-column: 1 / -1;
    min-width: 0;
    overflow-wrap: anywhere;
    font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace;
    font-size: 10.5px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    font-size: 10.5px; padding: 1px 6px; border-radius: var(--radius);
    background: var(--bg-input); color: var(--text); white-space: nowrap;
  }
  .chip b { font-weight: 500; color: var(--text-faint); }
  /* Not decoration: it is what makes a copied chip a label selector. */
  .chip i { font-style: normal; color: var(--text-faint); opacity: .6; margin: 0 2px; }

  /* Kept in kubectl's own columns: wrapped, a label's continuation lines landed under the wrong heading. */
  pre.describe { margin: 0; font-size: 11px; line-height: 1.5; white-space: pre; overflow-x: auto; }

  /* A block of text with a heading and a way to take a copy of just that. */
  .block { margin: 12px 0 0; }
  .block-head {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .block-head .spacer { flex: 1; }
  /*
   * Visible without hovering. A copy button that only appears under the pointer
   * is a copy button nobody knows is there, which is the opposite of what one is
   * for; it is quiet until wanted rather than hidden until found.
   */
  .block-head .btn {
    text-transform: none; letter-spacing: 0; font-weight: 400; padding: 1px 6px; font-size: 10.5px;
    opacity: .55; transition: opacity .12s;
  }
  .block:hover .block-head .btn, .block-head .btn:hover, .block-head .btn:focus { opacity: 1; }

  tr.is-link { cursor: pointer; }
  tr.is-link:hover { background: var(--bg-elevated); }

  /* Anything that goes somewhere says so before it is clicked. */
  .card.is-link, .gauge.is-link { cursor: pointer; }
  .card.is-link:hover, .gauge.is-link:hover { border-color: var(--accent); }
  .meter[data-node], .meter[data-namespace] { cursor: pointer; border-radius: var(--radius); }
  .meter[data-node]:hover, .meter[data-namespace]:hover { background: var(--bg-elevated); }
  .link { color: var(--accent); padding: 0; font: inherit; }
  .link:hover { text-decoration: underline; }

  .stat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; }
  .stat-tabs { display: flex; gap: 4px; }
  .stat-tabs .btn.on { color: var(--accent); border-color: var(--accent); }
  .charts.one { padding: 0 12px; grid-template-columns: 1fr; }
  .chart.is-big svg { height: 150px; }

  .note { padding: 22px 16px; color: var(--text-dim); font-size: 12px; line-height: 1.6; max-width: 60ch; }
  .note code { font-family: "JetBrains Mono", Menlo, ui-monospace, monospace; font-size: 11px; color: var(--text); }
  .error { color: var(--danger); }
  /* A failure reads as a box with an edge, not as a paragraph that happens to be red. */
  .note.error {
    margin: 12px; padding: 10px 12px; max-width: none; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--border)); border-radius: var(--radius);
    background: color-mix(in srgb, var(--danger) 7%, transparent);
  }

  /* The cluster, chosen where it is named. A control of the same height and
     edge as the namespace beside it, heavier in weight because it is the one
     everything else on the page hangs from. */
  .cluster-pick {
    display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 550; color: var(--text);
    background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 3px 6px 3px 9px; min-height: 26px; box-sizing: border-box; max-width: 240px; cursor: pointer;
  }
  .cluster-pick:hover, .cluster-pick[aria-expanded="true"] { border-color: var(--border-strong); }
  .cluster-pick:focus-visible, .cluster-pick[aria-expanded="true"] { outline: none; border-color: var(--accent); }
  .cluster-pick .cl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cluster-pick svg { width: 13px; height: 13px; flex: none; color: var(--text-faint); }
  .cluster-menu {
    position: fixed; z-index: 9; width: 320px; max-width: calc(100vw - 16px); display: flex; flex-direction: column;
    background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); font-size: 11.5px; overflow: hidden;
  }
  .cluster-menu input {
    font: inherit; color: var(--text); background: transparent; border: 0; border-bottom: 1px solid var(--border);
    padding: 8px 10px; outline: none; width: 100%; box-sizing: border-box;
  }
  .cl-list { max-height: min(46vh, 340px); overflow: auto; padding: 4px; }
  .cl-row {
    display: flex; align-items: center; gap: 8px; padding: 0 4px 0 8px; min-height: 28px; cursor: pointer;
    border-radius: max(2px, calc(var(--radius, 8px) - 4px)); color: var(--text);
  }
  .cl-row.on { background: var(--accent-soft); }
  .cl-row.here .cl-label { color: var(--accent); }
  .cl-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .cl-dot.is-ok { background: var(--ok); }
  .cl-dot.is-bad { background: var(--danger); }
  .cl-dot.is-warn { background: var(--warn, #e0af68); }
  .cl-dot.is-unknown { box-shadow: inset 0 0 0 1px var(--border-strong); }
  .cl-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cl-note { color: var(--text-faint); font-size: 10.5px; white-space: nowrap; }
  .cl-badge { color: var(--text-dim); font-size: 10px; border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
  .cl-check { margin-left: auto; color: var(--accent); width: 14px; text-align: center; flex: none; }
  .cl-tool {
    font: inherit; color: var(--text-faint); background: none; border: 0; border-radius: var(--radius); cursor: pointer;
    width: 22px; height: 22px; display: inline-grid; place-items: center; flex: none; opacity: 0; padding: 0;
  }
  .cl-tool svg { width: 13px; height: 13px; }
  .cl-row:hover .cl-tool, .cl-row.on .cl-tool, .cl-tool:focus-visible { opacity: 1; }
  .cl-tool:hover { color: var(--text); background: var(--bg-panel); }
  .cl-empty { padding: 10px; color: var(--text-dim); line-height: 1.5; }
  .cl-foot { display: flex; gap: 2px; padding: 4px; border-top: 1px solid var(--border); }
  .cl-foot button {
    font: inherit; color: var(--text-dim); background: none; border: 0; cursor: pointer; padding: 5px 8px;
    border-radius: max(2px, calc(var(--radius, 8px) - 4px)); display: inline-flex; align-items: center; gap: 6px;
  }
  .cl-foot button:hover { color: var(--text); background: var(--bg-panel); }
  .cl-foot svg { width: 12px; height: 12px; }
  .cl-foot .spacer { flex: 1; }
  .add-cluster { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: center; }
  .add-cluster label { color: var(--text-dim); }
  .add-cluster input, .add-cluster select {
    font: inherit; color: var(--text); background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px 7px; min-height: 26px; box-sizing: border-box; width: 100%;
  }
  .add-cluster input:focus, .add-cluster select:focus { outline: none; border-color: var(--accent); }
  .add-line {
    margin: 12px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    font-family: var(--mono, ui-monospace, Menlo, monospace); font-size: 11px; white-space: pre-wrap; word-break: break-all; color: var(--text);
  }
  .add-line.is-short { color: var(--text-faint); }

  /* The configuration form.

     Laid out as fields rather than as a document, because that is what it is:
     four things you set and a list you add to. The inputs look like the rest of
     the panel's inputs — nothing here is trying to look like a form from
     somewhere else. */
  .config-grid { display: grid; gap: 6px 10px; padding: 0 2px 2px; }
  .config-grid.config-four { grid-template-columns: repeat(auto-fit, minmax(min(128px, 100%), 1fr)); }
  .config-grid.config-narrow { grid-template-columns: 120px; }
  .config-field { display: grid; gap: 2px; font-size: 11px; min-width: 0; }
  .config-field > span { color: var(--text-faint); }
  .config-field input,
  .config-env input {
    font: inherit; font-size: 11px; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 6px; min-width: 0;
  }
  .config-field input:focus, .config-env input:focus { outline: none; border-color: var(--accent); }
  .config-envs { display: grid; gap: 4px; padding: 4px 2px 2px; }
  .config-env { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto auto; gap: 5px; align-items: center; }
  .config-env.is-from { grid-template-columns: minmax(90px, 34%) 1fr auto; }
  .config-env.is-from { font-size: 11px; }
  .config-env .env-name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .config-env .btn { padding: 2px 6px; opacity: 0.5; }
  .config-env:hover .btn { opacity: 1; }
  .config-envs > .btn { justify-self: start; margin-top: 2px; }
  /* What is about to happen, in the same words the dialog will use. */
  .config-diff { margin: 0; padding: 0 0 0 16px; font-size: 11px; color: var(--text); }
  .config-diff li { margin: 1px 0; }
  .btn[disabled] { opacity: 0.4; cursor: default; }

  /* Three rows, because there are three children: the grip you drag it by, the
     tabs, and the log. Two rows put the log in an implicit row that sized
     itself to a thousand lines and painted over the tabs. */
  .dock {
    display: grid; grid-template-rows: auto auto minmax(0, 1fr);
    border-top: 1px solid var(--border); background: var(--bg-panel);
  }
  /* A handle you can see and can hit.
     It was five transparent pixels with nothing to say it was a handle, sitting
     above the dock's own top edge where the eye reads them as the gap between
     two things. So people found no way to resize the log and concluded there
     was none. It is taller now, it draws a line to be grabbed by, it lights up
     under the pointer, and it is positioned so that nothing overlapping it can
     take the click. The tab strip below drags it too — see the mousedown. */
  .dock-grip {
    position: relative; z-index: 4;
    height: 9px; margin-top: -5px; cursor: ns-resize; background: transparent;
  }
  .dock-grip::after {
    content: ''; display: block; width: 42px; height: 3px; margin: 3px auto 0;
    border-radius: 2px; background: var(--border);
  }
  .dock-grip:hover::after, .dock-grip.is-held::after { background: var(--accent); }
  .dock-tabs { cursor: ns-resize; }
  .dock-tabs > *, .dock-tools > * { cursor: default; }
  .dock-tabs button, .dock-tabs .btn { cursor: pointer; }
  .dock-tabs input, .dock-tabs select { cursor: text; }

  /* Filling the window: the table's row goes to nothing and the dock's takes
     what is left, so the log is as tall as the panel rather than as tall as
     some number of pixels somebody dragged to. */
  #app.dock-full { grid-template-rows: auto 0 minmax(0, 1fr) auto auto; }
  #dock-slot { min-height: 0; }
  .dock.is-full { height: 100%; }
  .dock-tabs { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .dock-tab {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 8px;
    border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-dim); font-size: 11px;
    max-width: 230px;
  }
  .dock-tab.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .dock-tab .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-tab .x { opacity: 0.6; padding: 0 2px; }
  .dock-tab .x:hover { opacity: 1; color: var(--danger); }
  .dock-tools { display: flex; align-items: center; gap: 5px; margin-left: auto; }
  .dock-tools input, .dock-tools select {
    font: inherit; font-size: 11px; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 2px 6px; max-width: 170px;
  }
  .dock-tools input:focus, .dock-tools select:focus { outline: none; border-color: var(--accent); }
  .dock-body { overflow: auto; padding: 7px 10px 10px; min-height: 0; }
  .hit { background: var(--accent-soft); color: var(--accent); border-radius: 2px; }
  mark.hit { background: color-mix(in srgb, var(--git-new) 30%, transparent); color: inherit; }
  mark.hit.now { background: var(--git-new); color: var(--bg); }
  .btn.icon { display: inline-grid; place-items: center; padding: 3px 6px; min-width: 26px; }
  .btn.icon svg { width: 13px; height: 13px; display: block; }
  .log-find { display: inline-flex; align-items: center; gap: 3px; }
  .log-find #log-count { font-size: 10.5px; white-space: nowrap; min-width: 0; }
  .dock { position: relative; }
  /* Scrolled up in a followed log: the new lines are below, and this says how many. */
  .log-latest {
    position: absolute; right: 20px; bottom: 12px; z-index: 5;
    padding: 4px 10px; border-radius: 99px; font-size: 11px;
    background: var(--accent); color: var(--on-accent, var(--bg)); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .log-latest[hidden] { display: none; }

  .bar {
    display: flex; align-items: center; gap: 7px; padding: 5px 10px;
    border-top: 1px solid var(--border); background: var(--bg-panel);
    font-size: 11px; color: var(--text-dim); flex-wrap: wrap;
  }
  .bar:empty { display: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px;
    border: 1px solid var(--border); border-radius: 99px; font-size: 10.5px;
  }
  .pill.up { border-color: color-mix(in srgb, var(--ok, #3fb950) 55%, var(--border)); color: var(--text); }
  .pill.retry { border-color: color-mix(in srgb, var(--warn, #d29922) 60%, var(--border)); }
  .pill .addr { font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace; cursor: pointer; }
  .pill .addr:hover { text-decoration: underline; }
  .pill .btn { padding: 0 4px; }
  .pill.failed { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
  /* In the table, beside the name: this one is reachable from here right now. */
  .fw-mark { margin-left: 6px; font-size: 10px; color: var(--ok, #3fb950); white-space: nowrap; }
  .fw-mark.retry { color: var(--warn, #d29922); }
  .detail-forwards { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; font-size: 11px; color: var(--text-dim); }
  /* The forward dialog: one form, not two questions in a row. */
  .fw-ports { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
  .fw-port { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; font-size: 11.5px; }
  .fw-port.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .fw-port .dim { font-size: 10.5px; }
  .fw-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin: 6px 0; }
  .fw-row input[type=number] { font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 7px; width: 110px; }
  .ask {
    display: flex; gap: 6px; align-items: center; margin-top: 7px;
  }
  .ask input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 7px; }
  .ask input:focus { outline: none; border-color: var(--accent); }
  .spin { display: inline-block; animation: turn 0.9s linear infinite; }
  .btn.with-icon { display: inline-flex; align-items: center; gap: 6px; }
  .btn.with-icon svg, .top .btn.icon svg { width: 13px; height: 13px; flex: none; }
  .top .btn.icon { display: inline-grid; place-items: center; padding: 3px 7px; min-width: 26px; min-height: 26px; box-sizing: border-box; }
  /* Refreshing: the arrow turns while a question is in the air, and only then. */
  #reload.is-busy svg { animation: turn 0.9s linear infinite; }
  .refresh-group { display: inline-flex; align-items: center; gap: 6px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
  #live.on .live-dot { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: beat 2.4s ease-out infinite; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 5px transparent; } }
  /* When it was last true, and whether the last try failed. */
  .fresh { font-size: 10.5px; color: var(--text-faint); white-space: nowrap; min-width: 0; }
  .fresh.is-stale { color: var(--danger); cursor: help; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /*
   * The map. A canvas of cards and the lines between them, in the app's own
   * colours: workloads in the accent, the network in `info`, storage in
   * `violet` — a strip along the top of a card, so the kind can be read without
   * the border, which is busy saying whether the thing is well.
   */
  .map { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; min-height: 0; }
  .map-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 11px; }
  .map-bar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  .map-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .map-seg button { padding: 3px 10px; color: var(--text-dim); font-size: 11.5px; }
  .map-seg button:hover { color: var(--text); }
  .map-seg button.on { background: var(--accent); color: var(--on-accent, #fff); font-weight: 600; }
  .map-drop { position: relative; display: inline-flex; }
  .map-menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 6; width: 330px; max-height: 60vh; overflow: auto;
    padding: 6px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
  }
  .map-row { display: flex; align-items: center; gap: 8px; padding: 1px 4px; }
  .map-row.in { padding-left: 22px; }
  .map-row.map-head.in { padding: 5px 0 1px; }
  .map-row.map-head .map-tick span { font-weight: 600; letter-spacing: 0.08em; }
  .map-tick.some i { border-color: var(--accent); color: var(--accent); }
  .map-row.map-head { padding: 6px 4px 2px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .map-row:first-child { justify-content: space-between; padding: 3px 4px 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .map-tick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; padding: 3px 4px; text-align: left; border-radius: calc(var(--radius) / 2); color: var(--text-dim); font-size: 11.5px; }
  .map-tick:hover { background: var(--bg-panel); }
  .map-tick.on { color: var(--text); }
  .map-tick i { flex: none; width: 13px; height: 13px; display: grid; place-items: center; border: 1px solid var(--border-strong); border-radius: 3px; font-style: normal; font-size: 10px; line-height: 1; }
  .map-tick.on i { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
  .map-tick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-row:not(.in) .map-tick span { font-weight: 600; }
  .map-tick small { margin-left: auto; padding-left: 8px; color: var(--text-faint); font-size: 10px; white-space: nowrap; }
  .map-row .link { font-size: 10.5px; opacity: 0; }
  .map-row:hover .link, .map-row:first-child .link { opacity: 1; }
  .map-acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--accent-soft); font-size: 11px; }
  .map-acts .sep { width: 1px; align-self: stretch; background: var(--border-strong); margin: 0 4px; }
  .map-form { position: absolute; inset: 0; z-index: 20; display: grid; place-items: start center; padding-top: 6vh; background: color-mix(in srgb, var(--bg) 70%, transparent); overflow: auto; }
  .map-form-card { width: min(520px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: calc(var(--radius) + 2px); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
  .map-form-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .map-form-card h3 small { margin-left: 6px; font-weight: 400; color: var(--text-dim); }
  .map-form-card p { margin: 0; font-size: 11.5px; }
  .mfield { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; font-size: 11px; color: var(--text-dim); }
  .mfield input, .mfield select, .mfield textarea { width: 100%; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font: inherit; font-size: 12px; }
  .mfield textarea { resize: vertical; }
  .mfield small { color: var(--text-faint); }
  .mfield-row { display: flex; gap: 10px; }
  .mcheck { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  .map-form-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .map-note { padding: 5px 10px; font-size: 11px; color: var(--warn); border-bottom: 1px solid var(--border); }
  .map-view {
    overflow: auto; min-height: 0; cursor: grab;
    background-image: radial-gradient(color-mix(in srgb, var(--text) 8%, transparent) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .map-view.drag { cursor: grabbing; user-select: none; }
  .map-inner { position: relative; transform-origin: 0 0; }
  .msvg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .medge { fill: none; stroke: color-mix(in srgb, var(--text-dim) 75%, transparent); stroke-width: 1.3; }
  .medge.inf { stroke-dasharray: 5 4; }
  .medge.uses { stroke: var(--accent); opacity: 0.75; }
  .medge.vol { stroke: var(--violet); stroke-dasharray: 1 5; stroke-linecap: round; stroke-width: 1.6; opacity: 0.5; }
  .medge.on { stroke: var(--accent); stroke-width: 2; opacity: 1; }
  .mtag { display: inline-block; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 99px; color: var(--text-dim); font-size: 10px; line-height: 15px; white-space: nowrap; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .mtag.inf { border-style: dashed; }
  .mtag.warn { border-color: var(--warn); color: var(--warn); }
  .mtag.bad { border-color: var(--danger); color: var(--danger); }
  .mdot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .h-warn > .mdot, .h-warn > .mnode-h .mdot { background: var(--warn); }
  .h-bad > .mdot, .h-bad > .mnode-h .mdot { background: var(--danger); }
  .h-idle > .mdot { background: var(--text-faint); }
  .mtext { display: block; flex: 1; min-width: 0; }
  .mtext b, .mtext small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mtext b { font-weight: 550; }
  .mtext small { color: var(--text-dim); font-size: 10px; }
  .mcard {
    position: absolute; width: 170px; height: 40px; padding: 4px 8px; display: flex; align-items: center; gap: 7px;
    text-align: left; background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: var(--radius);
    font-size: 11px; line-height: 14px; overflow: hidden; box-shadow: inset 0 2px 0 var(--accent);
  }
  .mcard.c-nw { box-shadow: inset 0 2px 0 var(--info); }
  .mcard.c-st { box-shadow: inset 0 2px 0 var(--violet); }
  .mcard.c-nd { box-shadow: inset 0 2px 0 var(--text-faint); }
  .mcard:hover, .mtile:hover { border-color: var(--text-dim); }
  .mcard.h-warn, .mtile.h-warn { border-color: var(--warn); }
  .mcard.h-bad, .mtile.h-bad { border-color: var(--danger); }
  .mcard.inf { border-style: dashed; }
  .mcard.stack { box-shadow: 3px 3px 0 var(--border-strong); }
  .mcard.spof { border: 2px solid var(--warn); }
  .mcard.mhit { background: color-mix(in srgb, var(--danger) 16%, var(--bg-panel)); border-color: var(--danger); }
  .mcard.focus { border: 2px solid var(--accent); }
  .mcard.sel, .mtile.sel, .mnode-h.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mlabel { position: absolute; display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }
  .msq { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
  .msq.c-nw { background: var(--info); }
  .msq.c-st { background: var(--violet); }
  .mband { position: absolute; left: 8px; border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: color-mix(in srgb, var(--text) 2.5%, transparent); }
  .mband-h { position: absolute; left: 14px; height: 22px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .mband-h b { color: var(--text); font-weight: 600; }
  .mband-h:hover b { color: var(--accent); }
  .mcard, .mtile, .mnode, .mpool { transition: border-color 0.12s, background-color 0.12s, opacity 0.15s, transform 0.12s; }
  .mcard:hover, .mtile:hover { transform: translateY(-1px); }
  .medge { transition: stroke 0.12s, stroke-width 0.12s, opacity 0.15s; }
  .medge.hov { stroke: var(--accent); stroke-width: 2.2; opacity: 1; }
  .map-view.hovering .medge:not(.hov):not(.on) { opacity: 0.22; }
  /* What was inferred, and whatever is pointed at, visibly goes somewhere. */
  .medge.uses, .medge.hov { stroke-dasharray: 6 4; animation: map-flow 0.9s linear infinite; }
  @keyframes map-flow { to { stroke-dashoffset: -20; } }
  /* The thing that is failing is the thing the eye should land on. */
  .h-bad > .mdot, .h-bad > .mnode-h .mdot { animation: map-pulse 1.6s ease-out infinite; }
  @keyframes map-pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 70%, transparent); }
    100% { box-shadow: 0 0 0 7px transparent; }
  }
  .map-inner.map-fresh { animation: map-in 0.2s ease-out; }
  @keyframes map-in { from { opacity: 0; } to { opacity: 1; } }
  .map-menu, .map-form-card { animation: map-drop 0.12s ease-out; }
  @keyframes map-drop { from { opacity: 0; translate: 0 -4px; } to { opacity: 1; translate: 0 0; } }
  .mnode.cordoned { background-image: repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--warn) 9%, transparent) 10px 20px); }
  .mnode-t b { white-space: nowrap; }
  .map-zoom { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mnode-tags { margin-left: auto; display: inline-flex; gap: 4px; flex: none; }
  @media (prefers-reduced-motion: reduce) {
    .mcard, .mtile, .mnode, .mpool, .medge { transition: none; }
    .medge.uses, .medge.hov, .h-bad > .mdot, .h-bad > .mnode-h .mdot, .map-inner.map-fresh, .map-menu, .map-form-card { animation: none; }
    .mcard:hover, .mtile:hover { transform: none; }
    .mnode.draining { animation: none; }
  }
  .mhead-in { position: relative; transform-origin: 0 0; height: 30px; }
  .mhead { position: sticky; top: 0; z-index: 3; height: 30px; min-width: 100%; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(3px); border-bottom: 1px solid var(--border); }
  .mband.troubled { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .mcard.off { opacity: 0.3; }
  .mcard.chain, .mtile.chain { border-color: var(--accent); }
  .map-view.hovering .mcard:not(.chain):not(:hover) { opacity: 0.55; }
  .mcard:focus-visible, .mtile:focus-visible, .mnode-h:focus-visible, .mband-h:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mbar { position: relative; }

<div id="app">

</div>

<script>
  /* ---------------------------------------------------------------------- *
   * The state. One object, because every draw is a function of it — there is
   * no second copy of the truth anywhere in this file.
   * ---------------------------------------------------------------------- */
  var state = {
    // Which things have had their warnings put aside, and when: by map id.
    cleared: {},
    context: null,
    namespaces: [], namespace: '',
    resources: [], resourcesFor: null,
    view: { type: 'overview' },
    /** The cluster as a graph, and the same thing indexed by what joins what. */
    map: null, mapIndex: null,
    table: null, loading: false, error: null, counts: {},
    search: '', sort: { column: null, dir: 1 },
    selected: null, detail: { tab: 'overview' }, detailData: {},
    live: true, everyMs: 10000,
    /*
     * The logs open at the bottom. A list, not a field, because the question
     * "why did this one restart when that one did?" is asked by looking at both
     * — and a viewer that can only hold one turns that into clicking back and
     * forth from memory.

    logs: [], logAt: 0, dock: 240, dockOpen: true, dockFull: false,
    /** The workload being configured, what it is now, and what it would be. */
    config: null,
    forwards: [],
    /** Forwards to open in the browser the moment they are up, by id. */
    openWhenUp: {},
    /** Whether a request is in the air, and how long the last one took. */
    busy: false, tookMs: 0, showing: true, started: false,
    /** Whether a caret is in the YAML box, and what has been typed into it. */
    editing: false,
    /** Edits not applied yet, each kept against the object it is of: uid → { text, base, name }. */
    drafts: {}, configs: {},
    /** What was applied from here, newest first: the way to see it again and to put it back. */
    history: [], can: {}, showSecret: false, eventsGroup: false,
    /** Looking for a word in what the pane is showing. */
    find: { open: false, text: '', at: 0 },
    /** What an apply is doing, what the server last said about one, and whether the edit or its changes are showing. */
    applying: null, editNote: null, yamlView: 'edit', revertArmed: 0, eventsOnly: false, eventsWide: true,
    /** Whether this cluster has releases, asked once rather than on a timer. */
    helm: { checked: false, releases: 0 },
    /** Which rows are ticked, by uid. Ticking is not the same act as opening. */
    picked: [],
    /** A subset a card asked for, and a row a click on the overview wants opened. */
    only: null, wanted: null,
    /** How wide the two columns that can be dragged are. */
    navWidth: 178, detailWidth: 380,
    /** How large the pane's text is, and whether it has been given most of the room. */
    paneScale: 1, paneBig: false,
    /** The open watch, if any: what it is watching and whether a redraw is due. */
    watch: { id: null, kind: null, of: null, token: 0, draw: 0, pane: false },
    /**
     * How full the nodes' own disks are, when anything is measuring them, and
     * the same per node address — kept across refreshes so a slow answer reads
     * as late rather than as the metric having gone away.
     */
    disk: null, diskByHost: null,
    /** Where this cluster's Prometheus is, and what it has said so far. */
    prom: { checked: false, found: null, series: {}, minutes: 60 },
    /** The subtabs: each one a place (see placeNow), and which is in front. Null until there is a second. */
    tabs: null, tabAt: 0,
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /**
   * One call to the app, with its two kinds of failure flattened into one.
   *
   * A rejected promise means the app refused; an `ok: false` means kubectl did.
   * Both are the same thing to draw, and telling them apart at every call site
   * would be twelve copies of the same three lines.
   */
  function call(name, args) {
    return host.call(name, args).then(function (result) {
      if (result && result.ok === false) throw new Error(result.error || 'it did not say why');
      return result || {};
    });
  }

  function say(text, bad) {
    // Cancelling a question the app asked is an answer, not a failure: nothing to report.
    if (bad && /the person said no/.test(String(text))) return;
    host.emit('notify', { text: text, kind: bad ? 'bad' : 'ok' });
  }

  /**
   * Where this panel is, told to the app so it can be put back.
   *
   * The frame is rebuilt whenever the pane it lives in changes shape — a
   * terminal opening underneath it, that terminal being closed again, the theme
   * changing — and a rebuilt frame is a new document that starts at the
   * overview. Which meant that asking Claude about a pod threw away the table
   * you found the pod in, and closing the session threw it away a second time.
   *
   * So the navigation rides along with the app, which outlives the frame. Only
   * the navigation: what was on screen, not what was read from the cluster,
   * because the cluster is asked again anyway and a remembered answer would be
   * a stale one.
   */
  function remember() {
    var here = placeNow();
    host.emit('remember', assign(assign({ edits: editsToKeep() }, here), {
      // Every subtab's place, with the one in front as it is right now.
      tabs: state.tabs ? state.tabs.map(function (tab, at) { return at === state.tabAt ? here : tab.place; }) : null,
      tabAt: state.tabAt,
    }));
    drawTabs();
  }

  /**
   * The edits and the record of what was applied, as they go to the app.
   *
   * They are kept with the workspace so a restart does not cost an afternoon's
   * edit. Never a Secret's: its text is its values, and those are not written
   * anywhere by this panel. And within a size, oldest dropped first — the app
   * is keeping a place, not an archive.
   */
  function editsToKeep() {
    var drafts = {};
    var room = 200000;
    // Newest first when there is not room for all, and written back in the order they were made:
    // reversing them on every save made the next restart drop the newest instead of the oldest.
    var fits = {};
    Object.keys(state.drafts).reverse().forEach(function (uid) {
      var draft = state.drafts[uid];
      var size = draft.text.length + draft.base.length;
      if (draft.kind === 'Secret' || size > room) return;
      room -= size;
      fits[uid] = true;
    });
    Object.keys(state.drafts).forEach(function (uid) { if (fits[uid]) drafts[uid] = state.drafts[uid]; });
    var configs = {};
    Object.keys(state.configs).forEach(function (key) {
      var config = state.configs[key];
      if (configChanges(config).length) configs[key] = { key: key, kind: config.kind, namespace: config.namespace, name: config.name, live: config.live, draft: config.draft };
    });
    var history = state.history.filter(function (entry) { return entry.kind !== 'Secret'; }).slice(0, 20).filter(function (entry) {
      var size = (entry.before || '').length + (entry.after || '').length;
      if (size > room) return false;
      room -= size;
      return true;
    });
    // Events are forgotten by the cluster in about an hour; a clearing older than a few is about nothing.
    var cleared = {};
    Object.keys(state.cleared).forEach(function (id) { if (Date.now() - state.cleared[id] < 6 * 3600000) cleared[id] = state.cleared[id]; });
    return { context: state.context, drafts: drafts, configs: configs, history: history, cleared: cleared };
  }
  var rememberSoonTimer = 0;
  function rememberSoon() {
    clearTimeout(rememberSoonTimer);
    rememberSoonTimer = setTimeout(remember, 1500);
  }

  /** Where this panel is looking, as one value: what a subtab holds. */
  function placeNow() {
    return {
      pane: { scale: state.paneScale, big: state.paneBig },
      view: state.view,
      only: state.only,
      sort: state.sort,
      namespace: state.namespace,
      search: state.search,
      // By name rather than by uid: a pod that was replaced while the frame was
      // being rebuilt has a new uid and the same name, and the name is the one
      // the person was reading.
      selected: state.selected ? { name: state.selected.name, tab: state.detail.tab } : (state.wanted ? { name: state.wanted, tab: state.detail.tab } : null),
    };
  }

  /** Put it back, before anything is asked of the cluster. */
  function resume(saved) {
    if (!saved || !saved.view) return;
    if (saved.pane) {
      state.paneScale = Math.max(0.85, Math.min(1.6, Number(saved.pane.scale) || 1));
      state.paneBig = Boolean(saved.pane.big);
    }
    if (saved.edits && typeof saved.edits === 'object') {
      // For the cluster they were made on: a uid means nothing on another one.
      state.drafts = saved.edits.drafts || {};
      state.configs = saved.edits.configs || {};
      state.history = Array.isArray(saved.edits.history) ? saved.edits.history : [];
      state.cleared = saved.edits.cleared && typeof saved.edits.cleared === 'object' ? saved.edits.cleared : {};
    }
    state.view = saved.view;
    state.only = saved.only || null;
    state.sort = saved.sort || { column: null, dir: 1 };
    state.namespace = saved.namespace || '';
    state.search = saved.search || '';
    if (saved.selected && saved.selected.name) {
      state.wanted = saved.selected.name;
      if (saved.selected.tab) state.detail = { tab: saved.selected.tab };
    }
    // The filter box is part of the document rather than of the state, so it has
    // to be put back too — a filter that is applied and not shown is a table
    // that is missing rows for no reason anybody can see.
    if (state.search) $('search').value = state.search;
    if (Array.isArray(saved.tabs) && saved.tabs.length > 1) {
      state.tabs = saved.tabs.map(function (place) { return { place: place, table: null }; });
      state.tabAt = Math.min(Math.max(0, Number(saved.tabAt) || 0), state.tabs.length - 1);
    }
  }

  /* ---------------------------------------------------------------------- *
   * Subtabs.
   *
   * A place is what `remember` already kept for a rebuilt frame — the view,
   * the namespace, the filter, the sort and what was selected — so a subtab is
   * one of those, and switching is putting one away and taking another out.
   * The table a subtab last showed is kept with it and shown at once while it
   * is asked for again, so switching back does not flash an empty page.
   * ---------------------------------------------------------------------- */
  function tabTitle(place) {
    var view = place.view || { type: 'overview' };
    var what = view.type === 'overview' ? 'Overview'
      : view.type === 'map' ? 'Map'
      : view.type === 'stats' ? 'Stats'
        : view.type === 'helm' ? 'Helm releases'
          : LABELS[view.name] || (known(view.name) || {}).kind || view.name || 'View';
    var bits = [what];
    if (place.selected && place.selected.name) bits.push(place.selected.name);
    else if (place.search) bits.push('“' + place.search + '”');
    return { label: bits.join(' · '), namespace: view.type === 'overview' ? '' : (place.namespace || 'all') };
  }

  function drawTabs() {
    var strip = $('subtabs');
    if (!strip) return;
    var tabs = state.tabs || [{ place: null }];
    strip.innerHTML = tabs.map(function (tab, at) {
      var title = tabTitle(at === state.tabAt ? placeNow() : tab.place);
      return '<div class="subtab' + (at === state.tabAt ? ' on' : '') + '" role="tab" aria-selected="' + (at === state.tabAt) + '" data-subtab="' + at + '"' +
        ' title="' + esc(title.label + (title.namespace ? ' in ' + title.namespace : '')) + '">' +
        // The namespace first: it is what tells two subtabs of the same kind apart, and a long name trims from the end.
        '<span class="label">' + (title.namespace ? '<span class="ns">' + esc(title.namespace) + '</span> ' : '') + esc(title.label) + '</span>' +
        (tabs.length > 1 ? '<button class="x" data-subtab-close="' + at + '" title="Close this subtab" aria-label="Close">×</button>' : '') +
        '</div>';
    }).join('') +
      '<button class="subtab-new" data-subtab-new title="Open another place in this cluster (⌘-click anything to open it in a new one)" aria-label="New subtab">+</button>' +
      '<span class="subtab-tools">' +
        '<button class="subtab-tool" data-subtab-split="right" title="Open this subtab in a pane to the right, to compare the two (right-click a subtab for more)" aria-label="Open to the right">' + ICON_SPLIT_RIGHT + '</button>' +
        '<button class="subtab-tool" data-subtab-split="bottom" title="Open this subtab in a pane below" aria-label="Open below">' + ICON_SPLIT_DOWN + '</button>' +
      '</span>';
  }

  var ICON_SPLIT_RIGHT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M8 2.5v11"/></svg>';
  var ICON_SPLIT_DOWN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 8h13"/></svg>';

  /** A subtab's place, whether or not it is the one in front. */
  function placeOf(at) {
    if (!state.tabs || at === state.tabAt) return placeNow();
    return (state.tabs[at] && state.tabs[at].place) || { view: { type: 'overview' } };
  }

  /**
   * A subtab in an app pane of its own, beside this one.
   *
   * The app's panes already split, resize, maximise, minimise and drag; a copy
   * of this panel in one of them, starting at the same place, is two places in
   * one cluster side by side without a second, smaller set of all of that in
   * here. This one stays where it is: comparing needs both.
   */
  function openBeside(at, side) {
    host.emit('openBeside', { side: side, resume: assign(assign({}, placeOf(at)), { tabs: null, tabAt: 0 }) });
  }

  function subtabMenu(at, near) {
    closeRowMenu();
    var many = state.tabs && state.tabs.length > 1;
    var menu = document.createElement('div');
    menu.className = 'row-menu';
    menu.innerHTML =
      '<button class="btn" data-subtab-menu="right">Open to the right</button>' +
