      var verb = what === 'pick-delete' ? 'kube.remove' : 'kube.restart';
      var first = chosen[0];
      call(verb, {
        context: state.context, namespace: first.namespace, kind: first.kind,
        name: first.name, count: chosen.length,
      }).then(function () {
        var rest = chosen.slice(1).map(function (row) {
          return call(verb, { context: state.context, namespace: row.namespace, kind: row.kind, name: row.name })
            .then(function () { return null; })
            .catch(function (error) { return row.name + ': ' + String(error.message || error); });
        });
        return Promise.all(rest).then(function (failed) {
          var bad = failed.filter(Boolean);
          say(bad.length
            ? (chosen.length - bad.length) + ' of ' + chosen.length + ' done. ' + bad[0]
            : 'All ' + chosen.length + ' done.', bad.length > 0);
          state.picked = [];
          setTimeout(function () { load(true); }, 1200);
        });
      }).catch(function (error) { say(String(error.message || error), true); });
      return;
    }

    var log = currentLog();
    if (log) {
      if (what === 'follow') { followLog(log); return; }
      if (what === 'previous') { readLog(log, true); return; }
      if (what === 'wrap') { log.wrap = !log.wrap; drawDock(); return; }
      if (what === 'dock') { state.dockOpen = !state.dockOpen; drawDock(true); return; }
      // Filling the window is also a way of opening it — asking for a bigger log
      // while it is shut and getting nothing would be the wrong answer.
      if (what === 'dock-full') {
        state.dockFull = !state.dockFull;
        if (state.dockFull) state.dockOpen = true;
        drawDock(true);
        return;
      }
      if (what === 'save-log') {
        var whole = shownLines(log).map(function (line) { return line.text; }).join('\n');
        host.emit('save', { name: log.name + '.log', text: whole });
        return;
      }
      if (what === 'copy-log') {
        var text = shownLines(log).map(function (line) { return line.text; }).join('\n');
        // A frame with no same-origin has no clipboard of its own, so the app
        // is asked to do it — the same door everything else goes through.
        host.emit('copy', { text: text });
        say('Copied ' + shownLines(log).length + ' lines.');
        return;
      }
      if (what === 'ask-log') {
        // Including *which* log is on screen: the previous container's is the
        // one that says why something died, and it is usually why you asked.
        askAbout(
          { kind: 'Pod', name: log.name, namespace: log.namespace, container: log.container, previous: Boolean(log.showingPrevious) },
          '',
        );
        return;
      }
    }

    var row = state.selected;
    if (!row) return;
    var at = { context: state.context, namespace: row.namespace, kind: row.kind, name: row.name };

    if (what === 'logs') { openLog(row); return; }
    if (what === 'yaml-edit') {
      /*
       * Turning on the editor, not editing. The manifest is painted until this
       * is pressed, which is what it is doing almost all of the time — and the
       * textarea it swaps in is plain, because a coloured one would mean
       * maintaining an editor inside a panel.
       */
      state.editingYaml = true;
      drawDetail(true);
      var box = document.getElementById('yaml-edit');
      if (box) box.focus();
      return;
    }

    if (what === 'drain') {
      call('kube.drain', { context: state.context, name: row.name })
        .then(function (result) {
          openStreamTab('drain ' + row.name, result.id);
          say('Draining ' + row.name + '. Its progress is at the bottom.');
        })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }

    if (what === 'values-all') {
      state.helmAll = !state.helmAll;
      state.detailData.values = null;
      drawDetail();
      loadDetail();
      return;
    }
    if (what === 'helm-diff') {
      state.detail.tab = 'manifest';
      drawDetail();
      loadDetail();
      return;
    }
    if (what === 'helm-uninstall') {
      call('helm.uninstall', { context: state.context, namespace: row.namespace, name: row.name })
        .then(function (result) {
          say(result.text || ('Uninstalled ' + row.name + '.'));
          state.selected = null;
          draw();
          setTimeout(function () { load(true); }, 1200);
        })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }
    if (what === 'yaml-revert') {
      stopEditing();
      state.detailData.yaml = null;
      drawDetail();
      loadDetail();
      return;
    }
    if (what === 'yaml-check' || what === 'yaml-apply') {
      var field = document.getElementById('yaml-edit');
      if (!field) return;
      applyYaml(field.value, what === 'yaml-check');
      return;
    }

    if (what === 'shell') {
      call('kube.shell', {
        context: state.context, namespace: row.namespace, pod: row.name,
        container: row.containers && row.containers.length === 1 ? row.containers[0].name : undefined,
      }).then(function () { say('A terminal opened inside ' + row.name + '.'); })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }

    if (what === 'ask') {
      var input = document.getElementById('question');
      askAbout(assign({ kind: row.kind, name: row.name, namespace: row.namespace }, {}), input ? input.value.trim() : '');
      return;
    }

    if (what === 'scale') {
      askFor('Scale ' + row.name + ' to how many?', String(row.replicas == null ? 1 : row.replicas))
        .then(function (wanted) {
          if (wanted == null) return;
          run(call('kube.scale', assign({ replicas: Number(wanted) }, at)), 'Scaled ' + row.name + ' to ' + wanted + '.');
        });
      return;
    }
    if (what === 'restart') {
      run(call('kube.restart', at), 'Rolling ' + row.name + '.');
      return;
    }
    if (what === 'pause') {
      var holding = row.paused !== true;
      run(call('kube.pause', { context: state.context, namespace: row.namespace, name: row.name, on: holding }),
        holding ? 'Held the rollout of ' + row.name + '.' : 'Let ' + row.name + ' carry on.');
      return;
    }
    if (what === 'suspend') {
      var stopping = row.suspended !== true;
      run(call('kube.suspend', { context: state.context, kind: row.kind, namespace: row.namespace, name: row.name, on: stopping }),
        stopping ? 'Suspended ' + row.name + '.' : 'Resumed ' + row.name + '.');
      return;
    }
    if (what === 'trigger') {
      call('kube.trigger', { context: state.context, namespace: row.namespace, name: row.name })
        .then(function (result) {
          say('Started ' + (result.name || 'a job') + '.');
          setTimeout(function () { load(true); }, 1200);
        })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }
    if (what === 'cordon') {
      run(call('kube.cordon', { context: state.context, name: row.name, on: row.schedulable !== false }),
        row.schedulable !== false ? 'Cordoned ' + row.name + '.' : 'Uncordoned ' + row.name + '.');
      return;
    }
    if (what === 'delete') {
      run(call('kube.remove', at), 'Deleting ' + row.name + '.');
      state.selected = null;
      return;
    }
    if (what === 'forward') {
      var ports = row.forwardable || [];
      askFor('Which port of ' + row.name + '? It declares ' + ports.join(', '), String(ports[0]))
        .then(function (remote) {
          if (remote == null) return null;
          return askFor('On which local port? 0 lets the machine choose one.', String(remote))
            .then(function (local) {
              if (local == null) return null;
              forward(row, Number(remote), Number(local));
              return null;
            });
        });
    }
  }

  /**
   * Send an edited manifest, after asking the server whether it is legal.
   *
   * Always the dry run first, even when the button said Apply. The server
   * validates it against the real schemas and the real admission webhooks and
   * then throws it away, which is the whole difference between learning about a
   * bad indent and learning about an outage. Only if that passes does the real
   * one go.
   */
  function applyYaml(text, checkOnly) {
    var at = { context: state.context, yaml: text, dryRun: true };
    if (state.selected && state.selected.namespace) at.namespace = state.selected.namespace;
    say('Asking the server whether this is legal…');

    call('kube.apply', at).then(function (dry) {
      if (checkOnly) {
        say(dry.text || 'The server accepted it. Nothing was changed.');
        return null;
      }
      return call('kube.apply', assign({}, { context: at.context, namespace: at.namespace, yaml: text }))
        .then(function (done) {
          stopEditing();
          say(done.text || 'Applied.');
          state.detailData.yaml = null;
          drawDetail();
          loadDetail();
          setTimeout(function () { load(true); }, 900);
          return null;
        });
    }).catch(function (error) {
      // The server's own words. Ours would be a worse version of
      // "error validating data: unknown field spec.replicaz".
      say(String(error.message || error), true);
    });
  }

  /**
   * Hand the whole story of one object to Claude.
   *
   * The panel says which object and what was asked about it; the app gathers
   * the description, the warnings and the log — including the log of the
   * container that died — and opens a session with all of it already there.
   */
  function askAbout(what, question) {
    say('Gathering everything about ' + what.name + '…');
    call('kube.ask', assign({ context: state.context, question: question || undefined }, what))
      .then(function () { say('A Claude session opened with everything about ' + what.name + '.'); })
      .catch(function (error) { say(String(error.message || error), true); });
  }

  function run(promise, done) {
    promise.then(function () {
      say(done);
      // A change is not visible until the cluster agrees it happened.
      setTimeout(function () { load(true); }, 900);
    }).catch(function (error) { say(String(error.message || error), true); });
  }

  function forward(row, remote, local) {
    call('kube.forward', {
      context: state.context, namespace: row.namespace,
      kind: row.kind === 'Service' ? 'service' : 'pod', name: row.name,
      remote: remote, local: local,
    }).then(function (result) {
      state.forwards.push({ id: result.id, name: row.name, remote: remote, local: local, up: false });
      drawBar();
    }).catch(function (error) { say(String(error.message || error), true); });
  }

  /**
   * What is ticked, and what can be done to all of it at once.
   *
   * It lives in the same strip as the port-forwards because it is the same kind
   * of thing: something that is going on, that you can end. And the count is in
   * every sentence, because "delete these" with an unread number beside it is
   * how the wrong number of things get deleted.
   */
  function drawPicked() {
    var bar = document.getElementById('picked');
    if (!state.picked.length) { bar.innerHTML = ''; return; }
    var rows = pickedRows();
    if (!rows.length) { bar.innerHTML = ''; return; }
    var kind = rows[0].kind || 'object';
    var restartable = rows.every(function (row) { return row.restartable; });
    bar.innerHTML = '<span>' + rows.length + ' ' + esc(kind) + (rows.length === 1 ? '' : 's') + ' ticked</span>' +
      (restartable ? '<button class="btn" data-do="pick-restart">Restart them</button>' : '') +
      '<button class="btn bad" data-do="pick-delete">Delete them</button>' +
      '<button class="btn" data-do="pick-none">Clear</button>';
  }

  function pickedRows() {
    var rows = (state.table && state.table.rows) || [];
    return rows.filter(function (row) { return state.picked.indexOf(row.uid) >= 0; });
  }

  function drawBar() {
    if (!state.forwards.length) { $('bar').innerHTML = ''; return; }
    $('bar').innerHTML = '<span class="dim">Forwarding</span>' + state.forwards.map(function (forward) {
      var label = forward.error
        ? '<span class="bad-text">' + esc(forward.error) + '</span>'
        : forward.up
          ? 'localhost:' + forward.local + ' → ' + esc(forward.name) + ':' + forward.remote
          : 'starting ' + esc(forward.name) + ':' + forward.remote + '…';
      return '<span class="pill">' + label +
        '<button class="btn" data-stop="' + esc(forward.id) + '" style="padding:0 4px">✕</button></span>';
    }).join('');
  }

  $('bar').addEventListener('click', function (event) {
    var button = event.target.closest('[data-stop]');
    if (!button) return;
    var id = button.dataset.stop;
    call('kube.stopForward', { id: id }).catch(function () {});
    state.forwards = state.forwards.filter(function (forward) { return forward.id !== id; });
    drawBar();
  });

  /**
   * Asking for one value, without `prompt`.
   *
   * A sandboxed frame is not allowed to open a modal, and should not be: a
   * panel that can stop the app dead is a panel that can hold it hostage. So
   * the question is drawn, and answered by resolving — the caller waits on a
   * promise instead of on the browser, and cancelling resolves with null rather
   * than leaving anybody hanging.
   */
  function askFor(question, initial) {
    return new Promise(function (resolve) {
      var existing = document.getElementById('prompt');
      if (existing) existing.remove();

      var box = document.createElement('div');
      box.id = 'prompt';
      box.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,0.45);z-index:9';
      box.innerHTML = '<form style="background:var(--bg-panel);border:1px solid var(--border-strong);' +
        'border-radius:var(--radius);padding:14px 16px;min-width:280px;max-width:82vw">' +
        '<div style="margin-bottom:9px">' + esc(question) + '</div>' +
        '<input id="prompt-value" value="' + esc(initial) + '" style="width:100%;font:inherit;color:var(--text);' +
        'background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px" />' +
        '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:11px">' +
        '<button type="button" class="btn" id="prompt-no">Cancel</button>' +
        '<button type="submit" class="btn go">OK</button></div></form>';
      document.body.appendChild(box);

      var field = document.getElementById('prompt-value');
      field.focus();
      field.select();

      var close = function (value) {
        if (!box.parentNode) return;
        box.remove();
        resolve(value);
      };
      box.querySelector('#prompt-no').addEventListener('click', function () { close(null); });
      box.addEventListener('keydown', function (event) { if (event.key === 'Escape') close(null); });
      box.querySelector('form').addEventListener('submit', function (event) {
        event.preventDefault();
        close(field.value);
      });
    });
  }

  /* ---------------------------------------------------------------------- *
   * Keys, the timer, and starting up.
   * ---------------------------------------------------------------------- */
  document.addEventListener('keydown', function (event) {
    /*
     * Copy whatever is selected, wherever it is.
     *
     * The buttons cover the things worth copying whole; this covers everything
     * else — half a log line, one field of a description, a pod's name out of a
     * table. A frame in an origin of its own cannot reach the clipboard, so the
     * app is asked, and the selection is read before anything can clear it.
     */
    if ((event.metaKey || event.ctrlKey) && event.key === 'c') {
      var selected = String(window.getSelection() || '');
      if (selected) {
        event.preventDefault();
        host.emit('copy', { text: selected });
        say('Copied ' + selected.split('\n').length + ' line' + (selected.indexOf('\n') >= 0 ? 's' : '') + '.');
      }
      return;
    }
    if (event.key === 'Escape') {
      // The question closes itself; this is only for what is behind it.
      if (document.getElementById('prompt') || state.editing) return;
      if (state.selected) { state.selected = null; draw(); }
      return;
    }
    if (event.key === '/' && document.activeElement !== $('search')) {
      event.preventDefault();
      $('search').focus();
      return;
    }
    if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && state.table) {
      if (document.activeElement === $('search') || document.activeElement.id === 'question') return;
      var rows = visible();
      if (!rows.length) return;
      var at = -1;
      for (var i = 0; i < rows.length; i += 1) if (state.selected && rows[i].uid === state.selected.uid) at = i;
      var next = event.key === 'ArrowDown' ? Math.min(rows.length - 1, at + 1) : Math.max(0, at - 1);
      event.preventDefault();
      select(rows[next].uid);
    }
  });

  /**
   * Refreshing, paced by how long refreshing actually takes.
   *
   * This used to be an interval: every ten seconds, ask again. On a cluster on
   * another continent a `pods --all-namespaces` takes four to seven seconds and
   * returns four megabytes, so ten seconds meant asking again before the last
   * answer had arrived — and because a quiet refresh never set the flag the
   * interval checked, they stacked up rather than skipping. A slow cluster got
   * two or three of them in flight at once, which is the sort of thing an API
   * server rate-limits you for.
   *
   * So: wait after the answer, not after the question, and wait longer when the
   * cluster is slow. A cluster that answers in half a second is polled every
   * ten; one that takes six is polled every eighteen, which is the same
   * *fraction* of its time rather than the same clock.
   */
  function scheduleRefresh() {
    var took = state.tookMs || 0;
    var wait = Math.max(state.everyMs, Math.min(60000, took * 3));
    /*
     * With a watch open this is no longer the way the table stays true — it is
     * the safety net under it. A watch can miss the second between the list and
     * itself, and a table that is quietly wrong is worse than one that is
     * slowly right, so it is still read from time to time. Rarely.
     */
    if (state.watch.id) wait = Math.max(wait, 120000);
    setTimeout(function () {
      scheduleRefresh();
      // `showing` is the app saying whether this tab is in front; `hidden` is
      // the browser saying whether the window is. Either one means nobody is
      // looking, and a cluster nobody is looking at is not worth asking.
      if (!state.live || state.busy || state.loading || document.hidden || state.showing === false) return;
      // Never while a question is open, and never while a log is streaming:
      // both would redraw the thing somebody is in the middle of using.
      if (document.getElementById('prompt')) return;
      if (state.logs.some(function (log) { return log.following; })) return;
      load(true);
    }, wait);
  }
  scheduleRefresh();

  /**
   * Whether this tab is in front.
   *
   * Coming back to a panel that has been sitting behind another tab, the first
   * thing worth doing is finding out what changed while it was away — so it
   * refreshes on the way in rather than waiting out the rest of its timer.
   */
  host.on('showing', function (payload) {
    var was = state.showing;
    state.showing = !payload || payload.showing !== false;
    if (!state.showing) {
      // A table nobody is looking at does not need to be kept true, and a watch
      // is a connection held open against a cluster.
      stopWatch();
      return;
    }
    // Its first look: everything it needs, now that somebody wants it.
    if (!state.started) { begin(); return; }
    // Coming back: find out what changed while it was away, rather than
    // waiting out the rest of a timer.
    if (was === false && state.live && !state.busy) load(true);
  });

  window.addEventListener('resize', function () {
    // The edges move with the window, so the handles have to be told where
    // they are now.
    drawGrips();
  });

  host.on('theme', function () { /* the app rebuilds the frame; nothing to do here */ });

  host.on('context', function (payload) {
    // The app says which cluster this tab is for. Without one — opened from
    // Extensions rather than from the sidebar — kubeconfig's own current
    // context is the only sensible default.
    if (payload && payload.context) state.context = payload.context;
    if (payload && payload.showing === false) state.showing = false;
    /*
     * A tab that is not in front does not go and read a cluster.
     *
     * These stay mounted so a followed log survives a tab switch, which means
     * five restored cluster tabs would otherwise all start at once — fifteen
     * kubectl processes and fifteen credential plugins racing at launch, some
     * of them against clusters that will take twenty seconds to time out.
     * Nothing happens here until somebody looks.
     */
    if (state.showing) begin();
  });

  /** Everything this tab needs, the first time it is looked at. */
  function begin() {
    state.started = true;
    start().catch(function (error) {
      state.error = String(error.message || error);
      state.loading = false;
      draw();
    });
  }

  draw();
  host.ready();
</script>
