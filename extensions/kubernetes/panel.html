      // Least ready first: the share that is up, then how many there are.
      if (parts) return (Number(parts[2]) ? Number(parts[1]) / Number(parts[2]) : 1) * 1e6 + Number(parts[2]);
    }
    if (column === 'cpu') {
      var cores = /^([\d.]+)(m?)$/.exec(text);
      if (cores) return Number(cores[1]) * (cores[2] ? 1 : 1000);
    }
    if (column === 'memory' || column === 'capacity') {
      var size = /^([\d.]+)\s*(Ki|Mi|Gi|Ti|K|M|G|T|KiB|MiB|GiB|TiB)?$/.exec(text);
      var scale = { Ki: 1024, K: 1000, KiB: 1024, Mi: 1048576, M: 1e6, MiB: 1048576, Gi: 1073741824, G: 1e9, GiB: 1073741824, Ti: 1099511627776, T: 1e12, TiB: 1099511627776 };
      if (size) return Number(size[1]) * (scale[size[2]] || 1);
    }
    if (column === 'restarts') return Number(text) || 0;
    return text;
  }

  var HEADINGS = {
    name: 'Name', namespace: 'Namespace', ready: 'Ready', status: 'Status', restarts: 'Restarts',
    node: 'Node', age: 'Age', upToDate: 'Up to date', available: 'Available', type: 'Type',
    clusterIP: 'Cluster IP', external: 'External', ports: 'Ports', class: 'Class', hosts: 'Hosts',
    address: 'Address', roles: 'Roles', version: 'Version', instance: 'Instance', zone: 'Zone', nodegroup: 'Node group',
    capacity: 'Capacity', keys: 'Keys', schedule: 'Schedule', active: 'Active', lastRun: 'Last run',
    duration: 'Duration', message: 'Message', count: 'Count', object: 'Object',
    cpu: 'CPU', memory: 'Memory',
    chart: 'Chart', chartVersion: 'Version', appVersion: 'App', revision: 'Rev',
    // Said in words, because these reach the summary in the drawer as well as a
    // column heading — and `failedCount` printed at somebody is not a fact, it
    // is a field name that got out.
    replicas: 'Replicas', ip: 'IP', controlledBy: 'Controlled by', failedCount: 'Failed',
    misscheduled: 'Misscheduled', volume: 'Volume', modes: 'Access modes', pods: 'Pods',
    restartNote: 'Last restart', node: 'Node',
    cpuCapacity: 'CPU capacity', memoryCapacity: 'Memory capacity', podCapacity: 'Pod capacity',
  };

  /** How many rows are drawn at once. Past this, scrolling costs more than it is worth. */
  var CAP = 700;

  /**
   * What an empty pane says while the cluster is being asked: what it is
   * waiting for, where the eye already is — not a blank page with a spinner the
   * size of a letter up in the corner.
   */
  function waiting() {
    return '<div class="note waiting"><span class="spin">◐</span> Reading ' + esc(shortContext(state.context || '') || 'the cluster') + '…</div>';
  }

  /**
   * Whether somebody is selecting text inside `el` right now.
   *
   * The table and the detail pane are drawn with `innerHTML`, and a refresh
   * landing between selecting a pod's name and pressing ⌘C took the selection
   * with it — every ten seconds, or on every change a watch reported. So a
   * redraw that nobody asked for waits until the selection is let go of.
   */
  function selectingIn(el) {
    var picked = window.getSelection && window.getSelection();
    if (!el || !picked || picked.isCollapsed || !picked.rangeCount) return false;
    return el.contains(picked.anchorNode) || el.contains(picked.focusNode);
  }
  var heldBack = { table: false, detail: false };
  document.addEventListener('selectionchange', function () {
    var picked = window.getSelection();
    if (picked && !picked.isCollapsed) return;
    if (heldBack.table) { heldBack.table = false; if (state.table) drawTable(); }
    if (heldBack.detail) { heldBack.detail = false; drawDetail(); }
  });

  function drawTable() {
    // Asked for late — a forward changing, a selection let go — while the map is what is showing.
    if (state.view.type === 'map') return;
    if (selectingIn($('table'))) { heldBack.table = true; return; }
    // A row's menu is open: the table under it waits. Redrawn, the menu went and its row stayed selected, unseen.
    if (menuRow) { heldBack.table = true; return; }
    closeRowMenu();
    if (state.error) {
      $('table').innerHTML = '<div class="note error">' + esc(state.error) + '</div>' + advice(state.error);
      return;
    }
    if (!state.table) {
      $('table').innerHTML = state.loading
        ? waiting()
        : '<div class="note">' + (state.started ? 'Nothing loaded.' : 'Waiting to be looked at.') + '</div>';
      return;
    }

    // On every draw rather than once: a pod that arrives by the watch is a new row, and has a node too.
    if (state.zones && state.view.name === 'pods' && state.table.columns.indexOf('zone') >= 0) {
      state.table.rows.forEach(function (row) { row.zone = state.zones[row.node] || ''; });
    }
    var rows = visible();
    if (!rows.length) {
      $('table').innerHTML = '<div class="note">' +
        (state.search ? 'Nothing matches “' + esc(state.search) + '”.' : 'There is nothing here.') + '</div>';
      return;
    }

    var columns = (state.table.columns || []).filter(function (column) {
      // The namespace column says nothing when every row is in the same one.
      return !(column === 'namespace' && state.namespace);
    });

    var head = '<tr><th class="tick"><input type="checkbox" aria-label="Tick all shown" id="tick-all"' +
      (state.picked.length && state.picked.length === rows.length ? ' checked' : '') + ' /></th>' +
      columns.map(function (column) {
      var arrow = state.sort.column === column ? '<span class="arrow">' + (state.sort.dir > 0 ? '↑' : '↓') + '</span>' : '';
      var sorted = state.sort.column === column ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none';
      return '<th scope="col" tabindex="0" role="columnheader" aria-sort="' + sorted + '" data-column="' + esc(column) + '" title="Sort by ' + esc(HEADINGS[column] || column) + '">' + esc(HEADINGS[column] || column) + arrow + '</th>';
    }).join('') + '<th class="more"></th></tr>';

    var body = '';
    var drawn = Math.min(rows.length, CAP);
    for (var i = 0; i < drawn; i += 1) {
      var row = rows[i];
      var on = state.selected && state.selected.uid === row.uid;
      body += '<tr data-uid="' + esc(row.uid) + '" class="' + (on ? 'on' : '') + '">';
      body += '<td class="tick"><input type="checkbox" aria-label="Tick ' + esc(row.name) + '" data-tick="' + esc(row.uid) + '"' +
        (state.picked.indexOf(row.uid) >= 0 ? ' checked' : '') + ' /></td>';
      for (var c = 0; c < columns.length; c += 1) body += cell(row, columns[c]);
      // What you can do to this one, without opening it first.
      body += '<td class="more"><button data-more="' + esc(row.uid) + '" aria-label="What can be done">⋮</button></td>';
      body += '</tr>';
    }

    $('table').innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
      (rows.length > drawn ? '<div class="note">Showing the first ' + drawn + ' of ' + rows.length + '. Filter to narrow it.</div>' : '');
  }

  function cell(row, column) {
    var value = row[column];
    if (column === 'name') {
      return '<td class="name" title="' + esc(value) + '"><span class="dot ' + esc(row.health || 'idle') + '"></span><span class="label">' + esc(value) + '</span>' + forwardMark(row) + warnMark(row) + '</td>';
    }
    if (column === 'status') {
      var klass = row.health === 'bad' ? 'bad-text' : row.health === 'warn' ? 'warn-text' : 'dim';
      return '<td class="' + klass + '">' + esc(value) + '</td>';
    }
    if (column === 'restarts') {
      var text = esc(value) + (row.restartNote ? ' <span class="dim">(' + esc(row.restartNote) + ')</span>' : '');
      return '<td class="' + (value > 0 ? 'warn-text' : 'dim') + '">' + text + '</td>';
    }
    if (column === 'message') return '<td class="grow dim">' + esc(value) + '</td>';
    if (column === 'age') return '<td class="dim age">' + ageHtml(row, value) + '</td>';
    if (column === 'ports' || column === 'clusterIP' || column === 'address') {
      return '<td class="dim mono">' + esc(value) + '</td>';
    }
    return '<td class="dim">' + esc(value == null ? '' : plainValue(value)) + '</td>';
  }

  $('table').addEventListener('click', function (event) {
    /*
     * A tick is not a selection. Clicking a row opens it; ticking rows says
     * which ones an action is about, and the two must not be the same gesture
     * or ticking the fifth thing to delete would open it instead.
     */
    var more = event.target.closest('[data-more]');
    if (more) {
      event.stopPropagation();
      openRowMenu(more.dataset.more, more);
      return;
    }
    var tick = event.target.closest('[data-tick]');
    if (tick) {
      event.stopPropagation();
      var uid = tick.dataset.tick;
      var at = state.picked.indexOf(uid);
      if (at >= 0) state.picked.splice(at, 1);
      else state.picked.push(uid);
      drawPicked();
      return;
    }
    if (event.target.id === 'tick-all') {
      event.stopPropagation();
      // Only what is drawn: past the cap a row cannot be seen, and must not be acted on unseen.
      var all = visible().slice(0, CAP).map(function (row) { return row.uid; });
      var every = all.length > 0 && all.every(function (uid) { return state.picked.indexOf(uid) >= 0; });
      state.picked = every ? [] : all;
      drawTable();
      drawPicked();
      return;
    }
    var heading = event.target.closest('th');
    if (heading) {
      var column = heading.dataset.column;
      state.sort = state.sort.column === column
        ? { column: column, dir: -state.sort.dir }
        : { column: column, dir: 1 };
      drawTable();
      return;
    }
    var row = event.target.closest('tr[data-uid]');
    if (!row) return;
    // The end of dragging across a name to copy it, not a click on the row.
    if (selectingIn(row)) return;
    select(row.dataset.uid);
    if (event.target.closest('.row-warn')) { var toEvents = document.querySelector('aside .tabs [data-tab="events"]'); if (toEvents) toEvents.click(); }
  });

  /**
   * What has been typed into this object's YAML, if anything.
   *
   * Kept against the object rather than the tab, so switching to Events and
   * back finds the text still there. Nothing is ever asked about losing it,
   * because nothing loses it: it goes when the edit is applied, when it is
   * reverted on purpose, or when a different object is selected — and that last
   * one is the only case where the text stops meaning anything.
   */
  function draftFor(row) {
    var draft = row && state.drafts[row.uid];
    return draft ? draft.text : null;
  }

  /** The text the edit started from: what the cluster had, as somebody would write it. */
  function baseFor(row) {
    var draft = row && state.drafts[row.uid];
    if (draft) return draft.base;
    return state.detailData.editable == null ? (state.detailData.yaml || '') : state.detailData.editable;
  }

  function dropDraft(row) {
    if (row) delete state.drafts[row.uid];
  }

  /**
   * Leave the editor, and keep what was typed.
   *
   * It used to throw the text away, so a click on the next row — or an arrow
   * key a moment after leaving the box — cost whatever had been written. The
   * draft stays against its object and is there when that object is opened
   * again; only applying it or reverting it ends it.
   */
  function stopEditing() {
    state.editing = false;
    state.editingYaml = false;
    state.applying = null;
    state.editNote = null;
    state.yamlView = 'edit';
    state.revertArmed = 0;
    state.showSecret = false;
    shownEnv = {};
    applySitting += 1;
  }

  /** Write down something that was applied. Newest first, and not for ever. */
  function recordApplied(row, how, entry) {
    state.history.unshift(assign({ at: Date.now(), how: how, kind: row.kind, namespace: row.namespace || '', name: row.name, uid: row.uid }, entry));
    if (state.history.length > 30) state.history.length = 30;
    rememberSoon();
  }

  /** A sheet over the panel, for something to be read and closed. */
  function sheet(title, html) {
    var old = document.getElementById('sheet');
    if (old) old.remove();
    var box = document.createElement('div');
    box.id = 'sheet';
    box.innerHTML = '<div class="sheet-box" role="dialog" aria-label="' + esc(title) + '"><div class="sheet-head"><b>' + esc(title) + '</b><span class="spacer"></span>' +
      '<button class="pane-tool" data-sheet-close="1" title="Close (Esc)" aria-label="Close">×</button></div><div class="sheet-body">' + html + '</div></div>';
    document.body.appendChild(box);
    box.addEventListener('click', function (event) {
      if (event.target === box || event.target.closest('[data-sheet-close]')) box.remove();
    });
    var shut = box.querySelector('[data-sheet-close]');
    if (shut) shut.focus();
    return box;
  }
  document.addEventListener('keydown', function (event) {
    var open = document.getElementById('sheet');
    if (open && event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); open.remove(); }
  }, true);

  function historyLine(entry) {
    return entry.how + (entry.added != null ? ' · +' + entry.added + ' −' + entry.removed : entry.lines ? ' · ' + entry.lines.length + ' change' + (entry.lines.length === 1 ? '' : 's') : '') +
      ' · ' + sinceText(entry.at);
  }

  function showHistory(at) {
    var entry = state.history[at];
    if (!entry) return;
    var body = '<div class="dim sheet-sub">' + esc(entry.kind + ' ' + (entry.namespace ? entry.namespace + '/' : '') + entry.name + ' · ' + historyLine(entry) + ' · ' + new Date(entry.at).toLocaleString()) + '</div>' +
      (entry.before != null && entry.kind === 'Secret'
        ? '<div class="dim">A Secret: what changed is its values, and they are not shown here.</div>'
        : entry.before != null
        ? '<div class="diff">' + (diffHtml(lineDiff(entry.before, entry.after)) || '<div class="dim">Nothing changed.</div>') + '</div>' +
          '<div class="sheet-foot"><span class="dim">Putting it back opens the editor with the text as it was. Nothing is applied until you apply it.</span>' +
          '<span class="spacer"></span><button class="btn" data-history-copy="' + at + '">Copy diff</button><button class="btn go" data-history-back="' + at + '">Put it back…</button></div>'
        : '<ul class="config-diff">' + (entry.lines || []).map(function (line) { return '<li>' + esc(line) + '</li>'; }).join('') + '</ul>');
    var box = sheet('Applied from here', body);
    box.addEventListener('click', function (event) {
      if (event.target.closest('[data-history-copy]')) { copyText(diffText(lineDiff(entry.before, entry.after)), 'the changes'); return; }
      var back = event.target.closest('[data-history-back]');
      if (!back) return;
      if (state.drafts[entry.uid]) { say('There is an edit of ' + entry.name + ' not applied yet. Apply it or discard it first.', true); return; }
      box.remove();
      // As an edit like any other: the text as it was, measured against what was applied over it.
      state.drafts[entry.uid] = { text: entry.before, base: entry.after, name: entry.name, kind: entry.kind, namespace: entry.namespace };
      drawCrumb();
      openPending({ tab: 'yaml', name: entry.name, kind: entry.kind, namespace: entry.namespace });
    });
  }

  var KEYS = [
    ['Anywhere', [['/', 'Filter the table'], ['↑ ↓', 'The row above or below'], ['Esc', 'Close what is open'], ['⌘C', 'Copy what is selected'], ['?', 'This list']]],
    ['In the pane', [['1 – 9', 'The first to the ninth tab'], ['e', 'Edit the manifest'], ['⌘F', 'Find in the tab that is showing'], ['↵ / ⇧↵ or ⌘G / ⇧⌘G', 'Next and previous match'], ['A− A+', 'Smaller or larger text']]],
    ['Editing a manifest', [['⌘S', 'Apply'], ['⌘↵', 'Dry run: ask the server, change nothing'], ['⌘D', 'What you changed'], ['Tab / ⇧Tab', 'Indent or outdent the lines selected'], ['Esc', 'Leave the editor, when nothing was typed']]],
    ['Configure', [['⌘S', 'Apply'], ['⌘↵', 'Dry run']]],
    ['A log', [['↵ / ⇧↵', 'Next and previous match'], ['Esc', 'Let go of the search']]],
    ['The map', [['Double click', 'What it depends on'], ['Right click', 'Everything that can be done to it'], ['Hover', 'Light the whole chain']]],
  ];
  function showKeys() {
    sheet('Keys', KEYS.map(function (group) {
      return '<h5 class="msub">' + esc(group[0]) + '</h5><dl class="keys">' + group[1].map(function (pair) {
        return '<dt><kbd>' + esc(pair[0]) + '</kbd></dt><dd>' + esc(pair[1]) + '</dd>';
      }).join('') + '</dl>';
    }).join(''));
  }

  document.addEventListener('click', function (event) {
    var keys = event.target.closest && event.target.closest('[data-keys]');
    if (keys) { showKeys(); return; }
    var button = event.target.closest && event.target.closest('[data-history]');
    if (!button) return;
    var at = button.getBoundingClientRect();
    event.stopPropagation();
    menuAt(state.history.slice(0, 15).map(function (entry, i) {
      return { label: entry.name, hint: historyLine(entry), run: function () { showHistory(i); } };
    }).concat(['-', { label: 'Forget these', hint: 'the cluster keeps what was applied', run: function () { state.history = []; remember(); drawCrumb(); } }]),
    { clientX: at.left, clientY: at.bottom + 2 });
  });

  /** Every edit that is waiting, in YAML or in the form, with enough to get back to it. */
  function pendingEdits() {
    var out = [];
    Object.keys(state.drafts).forEach(function (uid) {
      var draft = state.drafts[uid];
      out.push({ tab: 'yaml', name: draft.name, kind: draft.kind, namespace: draft.namespace, uid: uid });
    });
    Object.keys(state.configs).forEach(function (key) {
      var config = state.configs[key];
      if (!configChanges(config).length) return;
      // Another cluster's are kept, and are not this one's to offer.
      if (key.indexOf((state.context || '') + '\n') !== 0) return;
      out.push({ tab: 'configure', kind: config.kind, namespace: config.namespace || '', name: config.name || '', key: key });
    });
    return out;
  }

  /** Back to an edit: the table it is in, the object, and the tab the edit is on. */
  function openPending(edit) {
    var here = state.selected;
    if (here && here.name === edit.name && here.kind === edit.kind && (here.namespace || '') === (edit.namespace || '')) {
      var tab = document.querySelector('.tabs [data-tab="' + edit.tab + '"]');
      if (tab) tab.click();
      return;
    }
    var nav = navFor(edit.kind);
    if (!nav) { say('There is no table of ' + edit.kind + ' to open it from.', true); return; }
    if (edit.namespace && state.namespace && state.namespace !== edit.namespace) {
      state.namespace = edit.namespace;
      var pick = document.getElementById('namespace');
      if (pick) pick.value = state.namespace;
    }
    show({ type: 'kind', name: nav }, { wanted: edit.name, wantedTab: edit.tab, wantedNamespace: edit.namespace });
  }

  document.addEventListener('click', function (event) {
    var button = event.target.closest && event.target.closest('[data-pending]');
    if (!button) return;
    var edits = pendingEdits();
    var at = button.getBoundingClientRect();
    var items = edits.map(function (edit) {
      return { label: edit.name, hint: edit.kind + (edit.namespace ? ' · ' + edit.namespace : '') + ' · ' + (edit.tab === 'yaml' ? 'YAML' : 'Configure'), run: function () { openPending(edit); } };
    });
    items.push('-');
    items.push({ label: 'Discard all of them', run: function () {
      state.drafts = {};
      state.configs = {};
      rememberSoon();
      if (state.selected) { stopEditing(); state.config = null; drawDetail(true); loadDetail(); }
      drawCrumb();
      say(edits.length === 1 ? 'The edit was dropped.' : 'All ' + edits.length + ' edits were dropped.');
    } });
    event.stopPropagation();
    menuAt(items, { clientX: at.left, clientY: at.bottom + 2 });
  });

  /** Said once, on the way out of an object with an edit left on it. */
  function sayKept(next) {
    var row = state.selected;
    if (!row || (next && next === row.uid)) return;
    var config = state.config && configChanges(state.config).length;
    if (draftFor(row) != null || config) say('Your edit of ' + row.name + ' is kept. Open it again to carry on.');
  }

  /** Whether the pane is holding something a redraw would take the caret out of. */
  function holdingEdit() {
    if (state.editing) return true;
    return state.editingYaml && state.detail.tab === 'yaml' && state.yamlView === 'edit' && Boolean(document.getElementById('yaml-edit'));
  }

  /**
   * Redraw the pane around an editor without disturbing it.
   *
   * A note from the server, a button going busy, the count of changed lines:
   * all of them change while somebody is in the box, and the box is rebuilt
   * with the rest. So the caret, the selection and the scroll are read first
   * and put back after.
   */
  function redrawEditor() {
    var box = document.getElementById('yaml-edit');
    var body = document.getElementById('detail-body');
    var kept = box ? { from: box.selectionStart, to: box.selectionEnd, top: box.scrollTop, left: box.scrollLeft, focused: document.activeElement === box } : null;
    var active = !box && document.activeElement && document.activeElement.dataset ? document.activeElement : null;
    var field = active && active.dataset.config
      ? { what: active.dataset.config, at: active.dataset.at, env: active.dataset.env, from: active.selectionStart, to: active.selectionEnd } : null;
    var scrolled = body ? body.scrollTop : 0;
    drawDetail(true);
    var again = document.getElementById('yaml-edit');
    if (kept && again) {
      again.scrollTop = kept.top; again.scrollLeft = kept.left;
      if (kept.focused) { again.focus(); try { again.setSelectionRange(kept.from, kept.to); } catch (error) { /* nothing to select */ } }
    }
    if (field) {
      var same = document.querySelector('[data-config="' + field.what + '"]' + (field.at == null ? '' : '[data-at="' + field.at + '"]') + (field.env == null ? '' : '[data-env="' + field.env + '"]'));
      if (same) { same.focus(); try { same.setSelectionRange(field.from, field.to); } catch (error) { /* a number field has no caret to place */ } }
    }
    var now = document.getElementById('detail-body');
    if (now) now.scrollTop = scrolled;
    yamlWhere();
  }

  /**
   * What is different between two texts, by line.
   *
   * The ordinary longest-common-subsequence, after the lines both ends share
   * are set aside — which on an edited manifest is nearly all of them, so the
   * table that is actually built is a few lines square. Past a size nobody
   * edits by hand it stops looking for the best answer and says "all of it".
   */
  function lineDiff(before, after) {
    var a = String(before).split('\n');
    var b = String(after).split('\n');
    var head = 0;
    while (head < a.length && head < b.length && a[head] === b[head]) head += 1;
    var tail = 0;
    while (tail < a.length - head && tail < b.length - head && a[a.length - 1 - tail] === b[b.length - 1 - tail]) tail += 1;
    var x = a.slice(head, a.length - tail);
    var y = b.slice(head, b.length - tail);
    var ops = [];
    var i;
    var j;
    if (x.length * y.length > 250000) {
      for (i = 0; i < x.length; i += 1) ops.push({ op: '-', text: x[i] });
      for (j = 0; j < y.length; j += 1) ops.push({ op: '+', text: y[j] });
    } else {
      var table = [];
      for (i = 0; i <= x.length; i += 1) { table.push(new Array(y.length + 1)); table[i][y.length] = 0; }
      for (j = 0; j <= y.length; j += 1) table[x.length][j] = 0;
      for (i = x.length - 1; i >= 0; i -= 1) {
        for (j = y.length - 1; j >= 0; j -= 1) {
          table[i][j] = x[i] === y[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
        }
      }
      i = 0; j = 0;
      while (i < x.length && j < y.length) {
        if (x[i] === y[j]) { ops.push({ op: ' ', text: x[i] }); i += 1; j += 1; }
        else if (table[i + 1][j] >= table[i][j + 1]) { ops.push({ op: '-', text: x[i] }); i += 1; }
        else { ops.push({ op: '+', text: y[j] }); j += 1; }
      }
      for (; i < x.length; i += 1) ops.push({ op: '-', text: x[i] });
      for (; j < y.length; j += 1) ops.push({ op: '+', text: y[j] });
    }
    var added = 0;
    var removed = 0;
    for (i = 0; i < ops.length; i += 1) { if (ops[i].op === '+') added += 1; else if (ops[i].op === '-') removed += 1; }
    return { head: a.slice(0, head), ops: ops, tail: a.slice(a.length - tail), added: added, removed: removed };
  }

  /** The changes with three lines either side, the way a review shows them. */
  function diffHtml(diff) {
    var lines = [];
    var oldAt = 1;
    var newAt = 1;
    var push = function (op, text) {
      lines.push({ op: op, text: text, was: op === '+' ? '' : oldAt, now: op === '-' ? '' : newAt });
      if (op !== '+') oldAt += 1;
      if (op !== '-') newAt += 1;
    };
    diff.head.forEach(function (text) { push(' ', text); });
    diff.ops.forEach(function (entry) { push(entry.op, entry.text); });
    diff.tail.forEach(function (text) { push(' ', text); });
    var keep = {};
    lines.forEach(function (line, at) {
      if (line.op === ' ') return;
      for (var k = Math.max(0, at - 3); k <= Math.min(lines.length - 1, at + 3); k += 1) keep[k] = true;
    });
    var out = [];
    var gap = false;
    lines.forEach(function (line, at) {
      if (!keep[at]) { gap = true; return; }
      if (gap && out.length) out.push('<div class="diff-gap">⋯</div>');
      gap = false;
      out.push('<div class="diff-line ' + (line.op === '+' ? 'is-add' : line.op === '-' ? 'is-del' : '') + '"' +
        (line.now ? ' data-line="' + line.now + '" title="Go to line ' + line.now + '"' : '') + '>' +
        '<span class="diff-no">' + (line.now || line.was) + '</span><span class="diff-op">' + line.op + '</span>' +
        '<span class="diff-text">' + (esc(line.text) || ' ') + '</span></div>');
    });
    return out.join('');
  }

  /** The same changes as text, for a message or a ticket: the form every tool that shows a diff understands. */
  function diffText(diff) {
    var lines = [];
    diff.head.slice(-3).forEach(function (text) { lines.push('  ' + text); });
    diff.ops.forEach(function (entry) { lines.push((entry.op === ' ' ? ' ' : entry.op) + ' ' + entry.text); });
    diff.tail.slice(0, 3).forEach(function (text) { lines.push('  ' + text); });
    return lines.join('\n');
  }

  function linesText(diff) {
    var parts = [];
    if (diff.added) parts.push('+' + diff.added);
    if (diff.removed) parts.push('−' + diff.removed);
    return parts.length ? parts.join(' ') + (diff.added + diff.removed === 1 ? ' line' : ' lines') : 'no lines changed';
  }

  /**
   * Find, in whatever the pane is showing.
   *
   * A description is two hundred lines and a manifest is more, and the browser's
   * own find does not exist in a frame inside an app. The matches are marked
   * with the highlight API rather than by rewriting the text, so nothing that
   * is drawn — the colours of a manifest, a link, a selection — is disturbed;
   * in the editor, where text cannot be marked, the match is selected instead.
   */
  var findRanges = [];
  function findApply(move) {
    var marks = window.CSS && CSS.highlights;
    if (marks) { marks.delete('pane-find'); marks.delete('pane-find-at'); }
    findRanges = [];
    var body = document.getElementById('detail-body');
    var count = document.getElementById('pane-find-count');
    var term = state.find.open ? state.find.text.toLowerCase() : '';
    if (!term || !body) { if (count) count.textContent = ''; return; }
    var box = document.getElementById('yaml-edit');
    var total = 0;
    if (box) {
      var hay = box.value.toLowerCase();
      var hits = [];
      for (var from = hay.indexOf(term); from >= 0 && hits.length < 5000; from = hay.indexOf(term, from + term.length)) hits.push(from);
      total = hits.length;
      state.find.at = total ? ((state.find.at % total) + total) % total : 0;
      if (total && move) {
        var hit = hits[state.find.at];
        box.focus();
        box.setSelectionRange(hit, hit + term.length);
        var high = parseFloat(getComputedStyle(box).lineHeight) || 18;
        box.scrollTop = Math.max(0, (box.value.slice(0, hit).split('\n').length - 1) * high - box.clientHeight / 3);
        yamlWhere();
      }
    } else {
      var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
      var node;
      while ((node = walker.nextNode()) && findRanges.length < 5000) {
        if (node.parentElement.closest('button, .yaml-tools, .block-head')) continue;
        var text = node.nodeValue.toLowerCase();
        for (var at = text.indexOf(term); at >= 0; at = text.indexOf(term, at + term.length)) {
          var range = document.createRange();
          range.setStart(node, at);
          range.setEnd(node, at + term.length);
          findRanges.push(range);
        }
      }
      total = findRanges.length;
      state.find.at = total ? ((state.find.at % total) + total) % total : 0;
      if (total && marks && window.Highlight) {
        marks.set('pane-find', new Highlight(...findRanges));
        marks.set('pane-find-at', new Highlight(findRanges[state.find.at]));
      }
      if (total && move) {
        var holder = findRanges[state.find.at].startContainer.parentElement;
        // Folded away is not found: what holds the match is opened first.
        var fold = holder.closest('details:not([open])');
        if (fold) fold.open = true;
        var where = findRanges[state.find.at].getBoundingClientRect();
        var frame = body.getBoundingClientRect();
        if (where.top < frame.top + 40 || where.bottom > frame.bottom - 20) body.scrollTop += where.top - frame.top - body.clientHeight / 3;
        var wide = holder.closest('pre');
        if (wide && (where.left < frame.left || where.right > frame.right)) wide.scrollLeft += where.left - frame.left - 60;
      }
    }
    if (count) count.textContent = total ? (state.find.at + 1) + ' of ' + total : 'none';
    if (count) count.classList.toggle('bad-text', !total);
  }

  function findOpen() {
    if (!state.selected) return;
    var picked = String(window.getSelection() || '');
    var was = state.find.open;
    state.find.open = true;
    // A word that is selected is the word being looked for.
    if (picked && picked.length < 80 && picked.indexOf('\n') < 0) { state.find.text = picked; state.find.at = 0; }
    if (!was) redrawEditor();
    var field = document.getElementById('pane-find');
    if (field) { field.value = state.find.text; field.focus(); field.select(); }
    findApply(false);
  }

  function findClose() {
    state.find.open = false;
    redrawEditor();
    var box = document.getElementById('yaml-edit');
    if (box) box.focus();
  }

  document.addEventListener('input', function (event) {
    if (event.target.id !== 'pane-find') return;
    state.find.text = event.target.value;
    state.find.at = 0;
    findApply(false);
  });

  document.addEventListener('keydown', function (event) {
    var command = event.metaKey || event.ctrlKey;
    if (command && event.key === 'f' && state.selected && !document.getElementById('prompt')) {
      // Not from the log's own search or the table's filter: those are finds of their own.
      if (event.target && (event.target.id === 'log-search' || event.target.id === 'search' || event.target.closest('.dock'))) return;
      event.preventDefault();
      findOpen();
      return;
    }
    if (command && event.key === 'g' && state.find.open && state.find.text) {
      event.preventDefault();
      state.find.at += event.shiftKey ? -1 : 1;
      findApply(true);
      return;
    }
    if (event.target.id !== 'pane-find') return;
    if (event.key === 'Enter') {
      event.preventDefault();
      state.find.at += event.shiftKey ? -1 : 1;
      findApply(true);
      // The editor takes the caret to show its match; in what is only read, the box keeps it and Enter walks on.
      if (!document.getElementById('yaml-edit')) event.target.focus();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      event.stopPropagation();
      findClose();
    }
  }, true);

  /** Put the caret on a line of the editor, with the line showing. */
  function yamlGoTo(line) {
    if (state.yamlView !== 'edit') { state.yamlView = 'edit'; drawDetail(true); }
    var box = document.getElementById('yaml-edit');
    if (!box || !line) return;
    var lines = box.value.split('\n');
    var at = Math.max(1, Math.min(lines.length, line));
    var from = 0;
    for (var i = 0; i < at - 1; i += 1) from += lines[i].length + 1;
    box.focus();
    box.setSelectionRange(from, from + lines[at - 1].length);
    var high = parseFloat(getComputedStyle(box).lineHeight) || 18;
    box.scrollTop = Math.max(0, (at - 1) * high - box.clientHeight / 3);
    yamlWhere();
  }

  /** Line and column of the caret, which is what the server's errors are given in. */
  function yamlWhere() {
    var box = document.getElementById('yaml-edit');
    var mark = document.getElementById('yaml-pos');
    if (!box || !mark) return;
    var before = box.value.slice(0, box.selectionStart);
    var line = before.split('\n').length;
    var total = box.value.split('\n').length;
    mark.textContent = 'Ln ' + line + '/' + total + ', Col ' + (before.length - before.lastIndexOf('\n'));
  }

  /**
   * Going somewhere else leaves the object behind — and any edit of it.
   *
   * Only the selection used to be cleared, so an edit half-typed in YAML or
   * Configure kept `editing` set: the pane that guards typing refused to go
   * away, its Apply had no object to apply to, × and Escape did nothing, and
   * the new table would not redraw either. Somebody who clicks Pods in the
   * middle of an edit has chosen to leave it.
   */
  function leaveDetail() {
    sayKept();
    stopEditing();
    letConfigGo();
    state.selected = null;
  }

  /** The form's draft is kept only while it holds a change; an untouched one is just a copy of the cluster. */
  function letConfigGo() {
    if (state.config && !configChanges(state.config).length) delete state.configs[state.config.key];
    state.config = null;
  }

  /**
   * Shut the detail pane, and stop reading what it was showing.
   *
   * Not only `state.selected = null`: a detail pane that is closed but still
   * charted, still watched and still remembered as open is a pane that costs
   * what it cost while it was open and comes back on the next redraw.
   */
  function closeDetail() {
    if (!state.selected) return;
    sayKept();
    stopEditing();
    letConfigGo();
    state.selected = null;
    state.detail = { tab: 'overview' };
    state.detailData = {};
    if (state.view.type === 'map' && state.view.ui) state.view.ui.sel = null;
    remember();
    draw();
  }

  /**
   * The same things the detail pane offers, without opening it.
   *
   * It selects the row on the way, because every one of these acts on "the
   * selected thing" — and because after a delete or a restart, that is the
   * thing you want in front of you anyway.
   */
  /** The row the open ⋮ menu belongs to, and what was selected before it opened. */
  var menuRow = null;
  var menuWas = null;
  var menuAway = null;

  function openRowMenu(uid, near) {
    // A menu opened over another one: what was selected before *either* of them is what a click-away restores.
    var prior = menuRow ? menuWas : state.selected;
    closeRowMenu();
    var rows = (state.table && state.table.rows) || [];
    var row = null;
    for (var i = 0; i < rows.length; i += 1) if (rows[i].uid === uid) row = rows[i];
    if (!row) return;
    /*
     * Over an open edit of something else, this is leaving it: the selection
     * moved to the menu's row while the editor stayed on screen, and what was
     * typed next was kept against the wrong object.
     */
    var leaving = state.selected && state.selected !== row && (holdingEdit() || state.editing);
    if (leaving) { sayKept(row.uid); stopEditing(); letConfigGo(); state.detail = { tab: 'overview' }; state.detailData = {}; prior = row; }
    menuWas = prior;
    menuRow = row;
    state.selected = row;
    if (leaving) { draw(); loadDetail(); }

    var box = document.createElement('div');
    box.className = 'row-menu';
    box.innerHTML = actionsFor(row);
    applyCan(box);
    askCan(row);
    document.body.appendChild(box);

    var at = near.getBoundingClientRect();
    // Above the button when there is no room below it.
    var below = window.innerHeight - at.bottom > box.offsetHeight + 8;
    box.style.left = Math.max(6, Math.min(at.right - box.offsetWidth, window.innerWidth - box.offsetWidth - 6)) + 'px';
    box.style.top = (below ? at.bottom + 4 : at.top - box.offsetHeight - 4) + 'px';

    /*
     * One click anywhere closes it, including the one that chose something —
     * and a click that chose nothing puts the selection back.
     *
     * The menu has to select the row, because every action below it acts on
     * "the selected thing". But changing your mind used to leave that selection
     * standing invisibly: the drawer was not drawn, so nothing on screen said
     * anything had been selected, and then the next redraw — the refresh timer,
     * ten seconds later — opened the detail pane on a row nobody had asked for.
     */
    setTimeout(function () {
      document.addEventListener('click', menuAway = function (click) {
        menuAway = null;
        var chose = click.target.closest && click.target.closest('.row-menu');
        var mine = menuRow === row;
        var before = menuWas;
        closeRowMenu();
        if (mine && !chose && state.selected === row) {
          state.selected = before;
          drawTable();
        }
      }, { once: true });
    }, 0);
  }

  function closeRowMenu() {
    var open = document.querySelector('.row-menu');
    if (open) open.remove();
    // The click-away of a menu that is gone must not act on the next one.
    if (menuAway) { document.removeEventListener('click', menuAway); menuAway = null; }
    var owed = menuRow && heldBack.table;
    menuRow = null;
    menuWas = null;
    if (owed) setTimeout(function () { if (heldBack.table && !menuRow) { heldBack.table = false; if (state.table) drawTable(); } }, 0);
  }

  /**
   * Keep the open pane pointed at the object, not at a photograph of it.
   *
   * Every refresh replaces the whole table with new row objects, and the pane
   * went on holding the one it was opened with — so a pod that started failing
   * read Running for as long as anybody looked at it, and the buttons decided
   * what they did from the same stale copy: after pausing a rollout the button
   * still said Pause, and pressing it paused the thing again.
   *
   * The object is updated in place rather than replaced, and put back into the
   * table, so the two are the same object again. That matters because the
   * detail's own in-flight answers are guarded by `state.selected === row` —
   * swapping the reference would make every one of them arrive too late to
   * count.
   *
   * Returns whether anything the pane shows is now different, so a watch event
   * about a row nobody can see does not redraw a drawer.
   */
  /**
   * What the drawer shows about an object, so a change to any of it is a change
   * worth redrawing for — and a change to none of it is not. The age is in here
   * because the header says it out loud.
   */
  var WATCHED_FIELDS = ['status', 'health', 'ready', 'restarts', 'replicas', 'available', 'upToDate',
    'paused', 'suspended', 'schedulable', 'active', 'age'];

  function paneWouldChange(before, after) {
    for (var f = 0; f < WATCHED_FIELDS.length; f += 1) {
      if (before[WATCHED_FIELDS[f]] !== after[WATCHED_FIELDS[f]]) return true;
    }
    return false;
  }

  /**
   * Take the fresh facts onto the object the pane is holding.
   *
   * In place, and put back into the list, so the two are one object again —
   * which is the whole point, because the detail's own in-flight answers are
   * guarded by `state.selected === row` and swapping the reference would make
   * every one of them arrive too late to count. Returns whether the pane is now
   * showing something different.
   */
  function adoptInto(chosen, rows) {
    if (!chosen || !chosen.uid || !rows) return false;
    for (var i = 0; i < rows.length; i += 1) {
      if (rows[i].uid !== chosen.uid) continue;
      if (rows[i] === chosen) return false;
      var moved = paneWouldChange(chosen, rows[i]);
      assign(chosen, rows[i]);
      rows[i] = chosen;
      return moved;
    }
    return false;
  }

  function refreshSelection() {
    return adoptInto(state.selected, state.table && state.table.rows);
  }

  function select(uid) {
    var rows = (state.table && state.table.rows) || [];
    var found = null;
    for (var i = 0; i < rows.length; i += 1) if (rows[i].uid === uid) found = rows[i];
    if (!found) return;
    sayKept(uid);
    stopEditing();
    letConfigGo();
    // An event opens as what it said, whole, with the way to the thing it is about: see eventPane.
    state.selected = found;
    /*
     * Whatever was being typed was being typed about something else. Left
     * standing, the guard that protects an edit from a redraw would keep this
     * new object's detail from ever being drawn — the drafts themselves are
     * kept, each against the object it belongs to.
     */
    state.editing = false;
    state.editingYaml = false;
    state.detail = { tab: 'overview' };
    state.detailData = {};
    remember();
    draw();
    loadDetail();
  }

  /* ---------------------------------------------------------------------- *
   * The map: the same cluster, drawn as what is joined to what.
   *
   * Three ways of looking at one graph, and the graph is asked for once —
   * switching between them is a redraw, not a question to the cluster.
   *
   *   Topology      who routes to what, and what disk is behind it
   *   Physical      which machine each pod is actually on
   *   Dependencies  one workload, everything it stands on, and what goes with it
   *
   * Every line the API stated is solid. Every line that was worked out — a
   * Deployment that names a service in an environment variable, a StatefulSet
   * called MongoDB because of its image — is dashed, and says how it was
   * worked out. A map that draws a guess the same as a fact is a map that will
   * be believed at the wrong moment.
   *
   * It only reads. Clicking anything opens the same pane the tables open, and
   * whatever can be done to an object is done from there.
   * ---------------------------------------------------------------------- */
  var MAP_MODES = [['topology', 'Topology'], ['physical', 'Physical'], ['graph', 'Dependencies']];
  var MAP_RESOURCE = {
    Pod: 'pods', Deployment: 'deployments', StatefulSet: 'statefulsets', DaemonSet: 'daemonsets',
    ReplicaSet: 'replicasets', Job: 'jobs', CronJob: 'cronjobs', Service: 'services', Ingress: 'ingresses',
    NetworkPolicy: 'networkpolicies', PersistentVolumeClaim: 'persistentvolumeclaims',
    PersistentVolume: 'persistentvolumes', StorageClass: 'storageclasses', CSIDriver: 'csidrivers', Node: 'nodes',
  };
  var MAP_CAT = {
    Pod: 'wk', Deployment: 'wk', StatefulSet: 'wk', DaemonSet: 'wk', ReplicaSet: 'wk', Job: 'wk', CronJob: 'wk',
    Service: 'nw', Ingress: 'nw', NetworkPolicy: 'nw',
    PersistentVolumeClaim: 'st', PersistentVolume: 'st', StorageClass: 'st', CSIDriver: 'st',
    Node: 'nd', Pool: 'nd', Zone: 'nd',
  };
  var MAP_WORKLOADS = ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job', 'CronJob'];
  /** A workload by any name: the six kinds, or whatever custom resource an operator makes pods from. */
  function mapIsWorkload(node) { return Boolean(node) && (MAP_WORKLOADS.indexOf(node.kind) >= 0 || node.custom === true); }
  var MAP_CW = 170;
  var MAP_CH = 40;
  var MAP_ROW = 48;
  var MAP_COLS = { ingress: 16, service: 214, workload: 448, pod: 646, claim: 844, volume: 1042, klass: 1240 };

  /** Which cluster and namespace a map was read from: one of another namespace is not this one's. */
  function mapKey() { return (state.context || '') + '/' + (state.namespace || ''); }

  /** What the person has folded, picked and zoomed. It rides on the view, so it comes back with it. */
  function mapUi() {
    var view = state.view;
    if (!view.ui) view.ui = {};
    if (!view.ui.open) view.ui.open = {};
    if (!view.ui.more) view.ui.more = {};
    return view.ui;
  }

  function mapIndexOf(data) {
    var ix = { byId: {}, out: {}, inn: {}, system: {}, units: null };
    (data.nodes || []).forEach(function (node) { ix.byId[node.id] = node; });
    (data.edges || []).forEach(function (edge) {
      var out = ix.out[edge.type] || (ix.out[edge.type] = {});
      (out[edge.from] || (out[edge.from] = [])).push(edge);
      var inn = ix.inn[edge.type] || (ix.inn[edge.type] = {});
      (inn[edge.to] || (inn[edge.to] = [])).push(edge);
    });
    (data.namespaces || []).forEach(function (ns) { if (ns.system) ix.system[ns.name] = true; });
    return ix;
  }

  /** The things an edge of this type leads to from here. */
  function mapTo(id, type) {
    var ix = state.mapIndex;
    return (((ix.out[type] || {})[id]) || []).map(function (edge) { return ix.byId[edge.to]; }).filter(Boolean);
  }

  /** The things an edge of this type arrives from. */
  function mapFrom(id, type) {
    var ix = state.mapIndex;
    return (((ix.inn[type] || {})[id]) || []).map(function (edge) { return ix.byId[edge.from]; }).filter(Boolean);
  }

  function mapUnique(list) {
    var seen = {};
    return list.filter(function (node) {
      if (!node || seen[node.id]) return false;
      seen[node.id] = true;
      return true;
    });
  }

  /** A workload's pods — through its jobs, when it is a CronJob. */
  function mapPodsOf(id) {
    var pods = [];
    mapTo(id, 'owns').forEach(function (node) {
      if (node.kind === 'Pod') pods.push(node);
      else pods = pods.concat(mapPodsOf(node.id));
    });
    return pods;
  }

  function mapWorst(list) {
    var worst = 'idle';
    var rank = { idle: 0, ok: 1, warn: 2, bad: 3 };
    list.forEach(function (node) { if (node && rank[node.health] > rank[worst]) worst = node.health; });
    return worst;
  }

  function mapMem(b) {
    if (!b) return '';
    var g = b / 1073741824;
    if (g >= 1) return (g >= 10 ? Math.round(g) : Math.round(g * 10) / 10) + 'Gi';
    return Math.round(b / 1048576) + 'Mi';
  }

  function mapCpu(m) {
    if (!m) return '';
    return m >= 1000 ? String(Math.round(m / 100) / 10) : m + 'm';
  }

  /** A cloud's node name is mostly its domain. The first label is the part people say. */
  function mapShort(name) { return String(name || '').split('.')[0]; }

  function mapPlural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  /** The second line of a card: the one fact about this kind that is worth the room. */
  function mapLine(node) {
    if (node.kind === 'Pod') {
      return node.status + (node.restarts ? ' · ↻' + node.restarts : '') + (node.node ? ' · ' + mapShort(node.node) : '');
    }
    if (mapIsWorkload(node)) return node.kind + (node.status ? ' · ' + node.status : '');
    if (node.kind === 'PersistentVolumeClaim') return node.status + (node.capacity ? ' · ' + node.capacity : '');
    if (node.kind === 'PersistentVolume') {
      return (node.capacity || node.status) + (node.attachedTo ? ' · on ' + mapShort(node.attachedTo) : node.local ? ' · local' : '');
    }
    if (node.kind === 'Node') return node.status + (node.instance ? ' · ' + node.instance : '');
    return node.status || node.kind;
  }

  /** What hovering says: the whole name, and the few facts the card had no room for. */
  function mapTip(node) {
    var lines = [node.kind + ' · ' + (node.namespace ? node.namespace + '/' : '') + node.name];
    if (node.status) lines.push(node.status);
    if (node.kind === 'Pod' || mapIsWorkload(node)) {
      var asks = [mapCpu(node.cpuReq), mapMem(node.memReq)].filter(Boolean).join(' · ');
      var caps = [mapCpu(node.cpuLim), mapMem(node.memLim)].filter(Boolean).join(' · ');
      if (asks) lines.push('requests ' + asks + (node.kind === 'Pod' ? '' : ' per pod'));
      if (caps) lines.push('limits ' + caps + (node.kind === 'Pod' ? '' : ' per pod'));
      if (node.cpuUsed != null) lines.push('in use ' + [mapCpu(node.cpuUsed), mapMem(node.memUsed)].filter(Boolean).join(' · '));
      if (node.node) lines.push('on ' + node.node);
      if (node.images && node.images[0]) lines.push(node.images[0] + (node.images.length > 1 ? ' +' + (node.images.length - 1) : ''));
      if (node.custom) lines.push('made by an operator; known here through its pods');
    }
    if (node.kind === 'PersistentVolume') lines.push([node.capacity, node.modes, node.className, node.reclaim].filter(Boolean).join(' · '));
    if (node.kind === 'StorageClass') lines.push([node.provisioner, node.reclaim, node.binding].filter(Boolean).join(' · '));
    if (node.kind === 'Ingress' && node.hosts) lines.push(node.hosts.join(', '));
    return lines.join('\n');
  }

  function mapCard(node, x, y, o) {
    o = o || {};
    var ui = mapUi();
    // What the cluster has complained about it lately — and, for a workload, about its pods — as a number in the corner.
    var warned = o.more ? 0 : warnedCount(node);
    var cls = 'mcard c-' + (MAP_CAT[node.kind] || 'wk') + ' h-' + (o.health || node.health || 'ok') +
      (ui.sel && ui.sel === node.id && !o.more ? ' sel' : '') + (o.cls ? ' ' + o.cls : '');
    return '<button class="' + cls + '" style="left:' + x + 'px;top:' + y + 'px' +
      (o.w ? ';width:' + o.w + 'px' : '') + (o.h ? ';height:' + o.h + 'px' : '') + '"' +
      (o.more ? ' data-map-more="' + esc(o.more) + '"' : ' data-map-id="' + esc(node.id) + '"') +
      ' title="' + esc(o.title || mapTip(node)) + (warned && node.warning ? '\n\n⚠ ' + esc(node.warning) : '') + '">' +
      '<i class="mdot"></i><span class="mtext"><b>' + esc(o.name || node.name) + '</b><small>' +
      (o.html || esc(o.line != null ? o.line : mapLine(node))) + '</small></span>' +
      (warned ? '<span class="mwarn">' + (warned > 99 ? '99+' : warned) + '</span>' : '') + '</button>';
  }

  /** A line that leaves sideways, turns once, and arrives sideways. */
  function mapElbow(x1, y1, x2, y2, nearSource) {
    if (y1 === y2) return 'M' + x1 + ' ' + y1 + 'H' + x2;
    var mx = nearSource ? x1 + 12 : x2 - 12;
    return 'M' + x1 + ' ' + y1 + 'H' + mx + 'V' + y2 + 'H' + x2;
  }

  function mapPath(d, cls, a, b) {
    var sel = mapUi().sel;
    return '<path class="medge' + (cls ? ' ' + cls : '') + (sel && (a === sel || b === sel) ? ' on' : '') + '"' +
      (a ? ' data-a="' + esc(a) + '"' : '') + (b ? ' data-b="' + esc(b) + '"' : '') + ' d="' + d + '"/>';
  }

  /**
   * What a namespace is made of, as the things a person would name.
   *
   * A unit is a workload nobody else owns, with its pods — a CronJob with its
   * jobs' pods, a Deployment without its ReplicaSets — or a pod that nothing
   * owns at all. Finished pods are left out: last night's backup is not part of
   * what is running.
   */
  function mapUnits() {
    var ix = state.mapIndex;
    if (ix.units) return ix.units;
    var units = {};
    var put = function (ns, unit) { (units[ns] || (units[ns] = [])).push(unit); };
    state.map.nodes.forEach(function (node) {
      if (mapIsWorkload(node)) {
        if (mapFrom(node.id, 'owns').length) return;
        put(node.namespace, {
          root: node,
          pods: mapPodsOf(node.id).filter(function (pod) { return !pod.finished; }),
          services: mapFrom(node.id, 'routes'),
        });
      } else if (node.kind === 'Pod' && !node.owner && !node.finished && !node.mirror) {
        put(node.namespace, { root: node, bare: true, pods: [node], services: mapFrom(node.id, 'routes') });
      }
    });
    Object.keys(units).forEach(function (ns) {
      units[ns].sort(function (a, b) { return a.root.name < b.root.name ? -1 : 1; });
    });
    ix.units = units;
    return units;
  }

  function mapUnitText(unit) {
    if (unit.text != null) return unit.text;
    var words = [unit.root.name, unit.root.kind, unit.root.namespace, unit.root.tech || ''];
    unit.pods.forEach(function (pod) {
      words.push(pod.name, pod.node);
      mapTo(pod.id, 'mounts').forEach(function (claim) { words.push(claim.name, claim.className); });
    });
    unit.services.forEach(function (service) { words.push(service.name); });
    unit.text = words.join(' ').toLowerCase();
    return unit.text;
  }

  /** Whether the cluster has complained lately about a unit or anything of it. */
  function mapUnitWarned(unit) {
    if (warnedCount(unit.root)) return true;
    return unit.pods.some(function (pod) { return stillSaid(pod) > 0; });
  }

  function mapUnitBad(unit) {
    if (unit.root.health === 'warn' || unit.root.health === 'bad') return true;
    return unit.pods.some(function (pod) {
      return pod.health === 'warn' || pod.health === 'bad' ||
        mapTo(pod.id, 'mounts').some(function (claim) { return claim.health !== 'ok'; });
    });
  }

  /* ---- Topology -------------------------------------------------------- */

  /**
   * Seven columns, read left to right the way a request travels and then the
   * way its data does: ingress, service, workload, pods, claim, volume, class.
   * A namespace is a band; a band folds; and a workload with more than three
   * pods is one card that says how many until somebody asks to see them.
   */
  function mapTopology() {
    var data = state.map;
    var ui = mapUi();
    var text = state.search;
    var units = mapUnits();
    var html = '';
    var edges = '';
    var where = {};
    var total = 0;
    Object.keys(units).forEach(function (ns) { total += units[ns].length; });
    var small = total <= 40;

    var heads = [['ingress', 'Ingress', 'nw'], ['service', 'Service', 'nw'], ['workload', 'Workload', 'wk'],
      ['pod', 'Pods', 'wk'], ['claim', 'Claim (PVC)', 'st'], ['volume', 'Volume (PV)', 'st'], ['klass', 'Storage class', 'st']];
    var head = '';
    heads.forEach(function (entry) {
      head += '<div class="mlabel" style="left:' + MAP_COLS[entry[0]] + 'px;top:9px"><i class="msq c-' + entry[2] + '"></i>' + entry[1] + '</div>';
    });

    var spaces = (data.namespaces || []).slice().sort(function (a, b) {
      return a.system === b.system ? (a.name < b.name ? -1 : 1) : a.system ? 1 : -1;
    });
    var y = 8;
    var drawn = 0;
    var mid = MAP_CH / 2;
    var right = MAP_CW;

    spaces.forEach(function (ns) {
      var mine = (units[ns.name] || []).filter(function (unit) {
        if (text && ns.name.toLowerCase().indexOf(text) < 0 && mapUnitText(unit).indexOf(text) < 0) return false;
        if (ui.bad && !mapUnitBad(unit) && !mapUnitWarned(unit)) return false;
        return true;
      });
      if (!mine.length) return;
      drawn += 1;
      var open = text || ui.bad ? true : ui.open[ns.name] != null ? ui.open[ns.name] : small && !ns.system;
      var pods = 0;
      var troubled = 0;
      var warnedHere = 0;
      var techs = {};
      mine.forEach(function (unit) {
        pods += unit.pods.length;
        if (mapUnitBad(unit)) troubled += 1;
        if (mapUnitWarned(unit)) warnedHere += 1;
        if (unit.root.tech) techs[unit.root.tech] = true;
      });
      var top = y;
      html += '<button class="mband-h" aria-expanded="' + (open ? 'true' : 'false') + '" data-map-ns="' + esc(ns.name) + '" style="top:' + (y + 5) + 'px">' +
        '<span class="twist">' + (open ? '▾' : '▸') + '</span><b>' + esc(ns.name) + '</b>' +
        '<span>' + mapPlural(mine.length, 'workload') + ' · ' + mapPlural(pods, 'pod') + '</span>' +
        Object.keys(techs).map(function (tech) { return '<span class="mtag inf">' + esc(tech) + '</span>'; }).join('') +
        (troubled ? '<span class="mtag bad">' + troubled + ' not well</span>' : '') +
        (warnedHere ? '<span class="mtag warn" title="Workloads the cluster has raised warnings about lately">' + warnedHere + ' with warnings</span>' : '') + '</button>';
      y += 32;

      if (open) {
        var classUse = {};
        var classFrom = {};
        var useClass = function (name, cy, id) {
          if (!name) return;
          (classUse[name] || (classUse[name] = [])).push(cy);
          if (id) classFrom[name + '@' + Math.abs(cy)] = id;
        };
        mine.forEach(function (unit) {
          var root = unit.root;
          var folded = unit.pods.length > 3 && !ui.more[root.id];
          var rows = [];
          if (folded) {
            var allClaims = [];
            unit.pods.forEach(function (pod) { allClaims = allClaims.concat(mapTo(pod.id, 'mounts')); });
            rows.push({ stack: unit.pods, claims: mapUnique(allClaims) });
          } else {
            unit.pods.forEach(function (pod) {
              var claims = mapTo(pod.id, 'mounts');
              if (!claims.length) rows.push({ pod: pod, from: pod });
              claims.forEach(function (claim, at) { rows.push({ pod: at === 0 ? pod : null, from: pod, claim: claim }); });
            });
          }
          var services = ui.net === false ? [] : unit.services;
          var ingresses = [];
          services.forEach(function (service) { ingresses = ingresses.concat(mapFrom(service.id, 'exposes')); });
          ingresses = mapUnique(ingresses);

          var podX = MAP_COLS.pod;
          var rootX = unit.bare ? podX : MAP_COLS.workload;
          var rootY = y;
          if (!unit.bare) {
            html += mapCard(root, rootX, rootY, root.tech ? {
              html: esc(String(root.status).replace(' ready', '')) + ' · <span class="mtag inf" title="Read off the image name">' +
                esc(root.tech + (root.techVersion ? ' ' + root.techVersion : '')) + '</span>',
            } : null);
            where[root.id] = { x: rootX, y: rootY };
          }

          var firstRow = {};
          rows.forEach(function (row, at) { if (row.pod) firstRow[row.pod.id] = at; });
          rows.forEach(function (row, at) {
            var ry = y + at * MAP_ROW;
            var cy = ry + mid;
            if (row.stack) {
              html += mapCard(root, podX, ry, {
                more: root.id, cls: 'stack', health: mapWorst(row.stack), name: '× ' + row.stack.length + ' pods',
                line: 'on ' + mapPlural(mapUnique(row.stack.map(function (pod) { return state.mapIndex.byId['Node//' + pod.node]; })).length, 'node') + ' · show them',
                title: 'Show each pod of ' + root.name,
              });
              edges += mapPath(mapElbow(rootX + right, rootY + mid, podX, cy), '', root.id, null);
              if (row.claims.length && ui.storage !== false) {
                var volumes = [];
                row.claims.forEach(function (claim) { volumes = volumes.concat(mapTo(claim.id, 'binds')); });
                html += mapCard(root, MAP_COLS.claim, ry, {
                  more: root.id, cls: 'stack c-st', health: mapWorst(row.claims), name: '× ' + row.claims.length + ' claims', line: 'show them',
                });
                edges += mapPath(mapElbow(podX + right, cy, MAP_COLS.claim, cy), '');
                if (volumes.length) {
                  html += mapCard(root, MAP_COLS.volume, ry, {
                    more: root.id, cls: 'stack c-st', health: mapWorst(volumes), name: '× ' + volumes.length + ' volumes', line: 'show them',
                  });
                  edges += mapPath(mapElbow(MAP_COLS.claim + right, cy, MAP_COLS.volume, cy), '');
                }
                var seen = {};
                (volumes.length ? volumes : row.claims).forEach(function (entry) {
                  if (entry.className && !seen[entry.className]) { seen[entry.className] = true; useClass(entry.className, cy); }
                });
              }
              return;
            }
            if (row.pod) {
              if (!unit.bare) {
                html += mapCard(row.pod, podX, ry);
                edges += mapPath(mapElbow(rootX + right, rootY + mid, podX, cy), '', root.id, row.pod.id);
              } else {
                html += mapCard(row.pod, podX, ry);
                where[row.pod.id] = { x: podX, y: ry };
              }
            }
            if (row.claim && ui.storage !== false) {
              html += mapCard(row.claim, MAP_COLS.claim, ry);
              // A second claim hangs off the pod's own row, which is `at` rows up.
              var fromY = y + firstRow[row.from.id] * MAP_ROW + mid;
              edges += mapPath(mapElbow(podX + right, fromY, MAP_COLS.claim, cy), '', row.from.id, row.claim.id);
              var volume = mapTo(row.claim.id, 'binds')[0];
              if (volume) {
                html += mapCard(volume, MAP_COLS.volume, ry);
                edges += mapPath(mapElbow(MAP_COLS.claim + right, cy, MAP_COLS.volume, cy), '', row.claim.id, volume.id);
                useClass(volume.className, cy, volume.id);
              } else useClass(row.claim.className, -cy, row.claim.id);
            }
          });

          services.forEach(function (service, at) {
            var sy = y + at * MAP_ROW;
            html += mapCard(service, MAP_COLS.service, sy);
            if (!where[service.id]) where[service.id] = { x: MAP_COLS.service, y: sy };
            edges += mapPath(mapElbow(MAP_COLS.service + right, sy + mid, rootX, rootY + mid), '', service.id, root.id);
          });
          ingresses.forEach(function (ingress, at) {
            var iy = y + at * MAP_ROW;
            html += mapCard(ingress, MAP_COLS.ingress, iy);
            mapTo(ingress.id, 'exposes').forEach(function (service) {
              var at2 = services.indexOf(service);
              if (at2 < 0) return;
              edges += mapPath(mapElbow(MAP_COLS.ingress + right, iy + mid, MAP_COLS.service, y + at2 * MAP_ROW + mid), '', ingress.id, service.id);
            });
          });
          var tall = Math.max(rows.length, services.length, ingresses.length, 1) * MAP_ROW;
          if (!folded && unit.pods.length > 3) {
            // What was unfolded can be folded again, from where its pods end.
            html += '<button class="mfold" data-map-more="' + esc(root.id) + '" style="left:' + podX + 'px;top:' + (y + rows.length * MAP_ROW - 6) + 'px">▴ fold these ' + unit.pods.length + ' pods</button>';
            tall = Math.max(tall, rows.length * MAP_ROW + 14);
          }
          y += tall + 8;
        });

        /*
         * What belongs to nothing. A service whose selector matches no pod is
         * very often the bug somebody is looking for, and a claim no pod mounts
         * is a disk being paid for; neither hangs off a workload, so neither
         * would otherwise be drawn at all.
         */
        var strays = state.map.nodes.filter(function (node) {
          if (node.namespace !== ns.name) return false;
          if (text && node.name.toLowerCase().indexOf(text) < 0 && ns.name.toLowerCase().indexOf(text) < 0) return false;
          if (node.kind === 'Service') return ui.net !== false && node.selects === 0;
          if (node.kind === 'PersistentVolumeClaim') return ui.storage !== false && !ui.bad && !mapFrom(node.id, 'mounts').length;
          return false;
        });
        strays.forEach(function (node) {
          var cy = y + mid;
          if (node.kind === 'Service') {
            html += mapCard(node, MAP_COLS.service, y, { health: 'warn', line: 'selects no pods' });
            mapFrom(node.id, 'exposes').forEach(function (ingress) {
              html += mapCard(ingress, MAP_COLS.ingress, y);
              edges += mapPath(mapElbow(MAP_COLS.ingress + right, cy, MAP_COLS.service, cy), '', ingress.id, node.id);
            });
          } else {
            html += mapCard(node, MAP_COLS.claim, y, { line: node.status + (node.capacity ? ' · ' + node.capacity : '') + ' · not mounted' });
            var held = mapTo(node.id, 'binds')[0];
            if (held) {
              html += mapCard(held, MAP_COLS.volume, y);
              edges += mapPath(mapElbow(MAP_COLS.claim + right, cy, MAP_COLS.volume, cy), '', node.id, held.id);
              useClass(held.className, cy, held.id);
            } else useClass(node.className, -cy, node.id);
          }
          y += MAP_ROW;
        });
        if (strays.length) y += 8;

        /*
         * One card per class per band, level with the volumes it provisions.
         * A class is cluster-wide, and drawn once it would be the far end of a
         * line from every band on the page.
         */
        var lastY = -1000;
        Object.keys(classUse).sort(function (a, b) {
          return Math.abs(classUse[a][0]) - Math.abs(classUse[b][0]);
        }).forEach(function (name) {
          var ys = classUse[name].map(Math.abs);
          var cy = Math.round((Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2);
          var ky = Math.max(cy - mid, lastY + MAP_ROW);
          lastY = ky;
          var klass = state.mapIndex.byId['StorageClass//' + name] ||
            { id: 'StorageClass//' + name, kind: 'StorageClass', name: name, namespace: '', status: '', health: 'ok' };
          html += mapCard(klass, MAP_COLS.klass, ky);
          classUse[name].forEach(function (from) {
            // Negative: a claim with no volume yet, which reaches its class from one column further back.
            var fx = from < 0 ? MAP_COLS.claim + right : MAP_COLS.volume + right;
            edges += mapPath(mapElbow(fx, Math.abs(from), MAP_COLS.klass, ky + mid, from >= 0), from < 0 ? 'inf' : '', classFrom[name + '@' + Math.abs(from)] || null, klass.id);
          });
          y = Math.max(y, ky + MAP_ROW + 8);
        });
      }
      html = '<div class="mband' + (troubled ? ' troubled' : '') + '" style="top:' + top + 'px;height:' + (y - top) + 'px;width:' + (MAP_COLS.klass + MAP_CW + 8) + 'px"></div>' + html;
      y += 10;
    });

    /*
     * What is only inferred, last and over the top: a workload that names a
     * service. Both ends sit either side of the same gutter, so the curve lives
     * in it and crosses nothing.
     */
    (data.edges || []).forEach(function (edge) {
      if (edge.type !== 'uses') return;
      var from = where[edge.from];
      var to = where[edge.to];
      if (!from || !to) return;
      var x1 = from.x;
      var y1 = from.y + mid + 8;
      var x2 = to.x + right;
      var y2 = to.y + mid + 8;
      edges += mapPath('M' + x1 + ' ' + y1 + 'C' + (x1 - 44) + ' ' + y1 + ',' + (x2 + 44) + ' ' + y2 + ',' + x2 + ' ' + y2, 'inf uses', edge.from, edge.to);
    });

    if (!drawn) {
      return { w: 600, h: 120, html: '<div class="note" style="position:absolute;left:16px;top:40px">' +
        (text || ui.bad ? 'Nothing matches. ' + (ui.bad ? 'Nothing here is failing.' : '') : 'There is nothing running here.') + '</div>', edges: '' };
    }
    return { w: MAP_COLS.klass + MAP_CW + 24, h: y + 16, html: html, edges: edges, head: head };
  }

  /* ---- Physical -------------------------------------------------------- */

  function mapBar(part, whole, used) {
    var pct = whole ? Math.min(100, Math.round((part / whole) * 100)) : 0;
    // The bar is what was promised; the tick on it is what is actually in use. The gap between the two is the story.
    var tick = used != null && whole ? '<b style="left:' + Math.min(100, Math.round((used / whole) * 100)) + '%"></b>' : '';
    return { pct: pct, html: '<span class="mbar"><i class="' + (pct >= 90 ? 'hot' : pct >= 75 ? 'warm' : '') + '" style="width:' + pct + '%"></i>' + tick + '</span>' };
  }

  function mapTile(pod, ui, text) {
    var claims = mapTo(pod.id, 'mounts');
    var off = (text && (pod.name + ' ' + pod.namespace + ' ' + pod.owner).toLowerCase().indexOf(text) < 0) ||
      (ui.bad && pod.health !== 'warn' && pod.health !== 'bad' && !stillSaid(pod));
    var size = [mapCpu(pod.cpuReq), mapMem(pod.memReq)].filter(Boolean).join(' · ');
    return '<button class="mtile h-' + pod.health + (ui.hl && pod.owner === ui.hl ? ' hl' : '') + (ui.sel === pod.id ? ' sel' : '') +
      (off ? ' off' : '') + '" data-map-id="' + esc(pod.id) + '" title="' + esc(mapTip(pod)) + '">' +
      '<i class="mdot"></i><span class="mtext"><b>' + esc(pod.name) + '</b><small>' +
      esc(pod.health === 'ok' ? pod.namespace + (size ? ' · ' + size : '') : pod.status + (pod.restarts ? ' · ' + mapPlural(pod.restarts, 'restart') : '')) +
      '</small></span>' + (stillSaid(pod) ? '<span class="mwarn is-inline" title="' + esc(pod.warning || '') + '">' + (stillSaid(pod) > 99 ? '99+' : stillSaid(pod)) + '</span>' : '') +
      (claims.length ? '<i class="mplug" title="Mounts ' + esc(claims.map(function (c) { return c.name; }).join(', ')) + '"></i>' : '') +
      '</button>';
  }

  /**
   * Which machines are on the page.
   *
   * Nineteen nodes are a wall, and the question is usually about three of them:
   * the pool the databases are on, or the one node that is misbehaving. So any

  /**

  /**
   * Machines as boxes, with what runs on each one inside it.
   *
   * The disks are the part worth being careful about. A cloud volume is not on
   * the node: it is in the provider's storage and attached over the network,
   * and it follows the pod when the pod moves. So volumes get a lane of their
   * own underneath, joined to their pods by a dotted line, rather than being
   * drawn inside a machine they would survive.
   */
  function mapPhysical() {
    var data = state.map;
    var ix = state.mapIndex;
    var ui = mapUi();
    var text = state.search;
    var every = data.nodes.filter(function (node) { return node.kind === 'Node'; });
    var showEmpty = mapShowsEmpty();
    var machines = every.filter(function (node) {
      if (!mapNodeShown(node, ui)) return false;
      return showEmpty || mapFrom(node.id, 'runs-on').some(function (pod) { return !pod.finished; });
    });
    var chosen = {};
    machines.forEach(function (node) { chosen[node.name] = true; });
    var narrowed = Object.keys(ui.off || {}).length > 0;
    // The same machines, shelved by who makes them or by where they are: the second is the question a zone outage asks.
    var byZone = ui.by === 'zone';
    var pools = {};
    machines.forEach(function (node) {
      var key = byZone ? node.zone || '' : node.pool || '';
      (pools[key] || (pools[key] = [])).push(node);
    });

    // With one namespace picked, only its pods were read: the bars are its share of the node, not the node's load.
    var asked = data.scoped ? 'Here: ' : 'Requested: ';
    var askedWhy = data.scoped ? 'What the pods of this namespace ask of the node. The other namespaces were not read.' : 'What the pods on this node were promised';
    // Any number of pools can be lit; once one is, the others step back rather than leave.
    var lit = ui.pools || {};
    var anyLit = Object.keys(lit).length > 0;
    var html = '<div class="mphys"><div class="mpools">';
    if (!machines.length) {
      html += '<div class="note">No node is shown. ' + (narrowed ? 'Every one of them is unticked under Nodes.' :
        'None of them runs anything from this namespace — turn Empty nodes on to see them anyway.') + '</div>';
    }
    Object.keys(pools).sort().forEach(function (pool) {
      var zones = {};
      pools[pool].forEach(function (node) { var other = byZone ? node.pool : node.zone; if (other) zones[other] = true; });
      // A pool can be picked like anything else on the page: the frame around it lights up, and stays lit.
      html += (byZone
        ? '<section class="mpool"><h5>' + (pool ? 'Zone · ' + esc(pool) : 'Nodes without a zone')
        : '<section class="mpool' + (lit['p:' + pool] ? ' sel' : anyLit ? ' quiet' : '') + '"><h5 class="mpool-h" data-map-pool="p:' + esc(pool) +
          '" title="Light this node pool, and see what can be done to it">' + (pool ? 'Node pool · ' + esc(pool) : 'Nodes without a pool')) +
        '<span>' + mapPlural(pools[pool].length, 'node') + '</span>' +
        Object.keys(zones).sort().map(function (zone) { return '<span class="mtag">' + esc(zone) + '</span>'; }).join('') +
        '</h5><div class="mnodes">';
      pools[pool].sort(function (a, b) { return a.name < b.name ? -1 : 1; }).forEach(function (node) {
        var pods = mapFrom(node.id, 'runs-on').filter(function (pod) { return !pod.finished; });
        var furniture = [];
        var own = [];
        pods.forEach(function (pod) {
          var owner = ix.byId[pod.owner];
          if (ix.system[pod.namespace] || pod.mirror || (owner && owner.kind === 'DaemonSet')) furniture.push(pod);
          else own.push(pod);
        });
        // The ones with a disk go last, so their lines leave from the bottom of the box.
        own.sort(function (a, b) {
          var da = mapTo(a.id, 'mounts').length ? 1 : 0;
          var db = mapTo(b.id, 'mounts').length ? 1 : 0;
          return da !== db ? da - db : a.name < b.name ? -1 : 1;
        });
        var cpu = mapBar(node.cpuReq, node.cpuAlloc, node.cpuUsed);
        var mem = mapBar(node.memReq, node.memAlloc, node.memUsed);
        var cpuSays = mapCpu(node.cpuReq) + ' requested of ' + mapCpu(node.cpuAlloc) + (node.cpuUsed != null ? ', ' + mapCpu(node.cpuUsed) + ' in use' : '');
        var memSays = mapMem(node.memReq) + ' requested of ' + mapMem(node.memAlloc) + (node.memUsed != null ? ', ' + mapMem(node.memUsed) + ' in use' : '');
        var used = node.cpuUsed != null
          ? '<span>in use ' + mapBar(node.cpuUsed, node.cpuAlloc).pct + '%</span><span>in use ' + mapBar(node.memUsed, node.memAlloc).pct + '%</span>'
          : '';
        var cordoned = /cordoned/.test(node.status);
        var inHand = mapDraining && mapDraining.names[mapDraining.at] === node.name;
        html += '<div class="mnode h-' + node.health + (cordoned ? ' cordoned' : '') + (inHand ? ' draining' : '') + '">' +
          '<button class="mnode-h' + (ui.sel === node.id ? ' sel' : '') + '" data-map-id="' + esc(node.id) + '" title="' + esc(node.name) + '">' +
          '<span class="mnode-t"><i class="mdot"></i><b>' + esc(mapShort(node.name)) + '</b><small>' +
          esc([node.status, node.instance, byZone ? node.pool : node.zone].filter(Boolean).join(' · ')) + '</small>' +
          '<span class="mnode-tags">' + (node.capacity === 'spot' ? '<span class="mtag warn" title="A spot machine: the cloud can take it back at short notice">spot</span>' : '') +
          (node.taintList && node.taintList.length ? '<span class="mtag" title="' + esc(node.taintList.join('\n')) + '">' + mapPlural(node.taintList.length, 'taint') + '</span>' : '') +
          (stillSaid(node) ? '<span class="mtag bad" title="' + esc(node.warning || '') + '">' + mapPlural(stillSaid(node), 'warning') + '</span>' : '') +
          '<span class="mtag" title="Pods running on it">' + pods.length + '</span></span></span>' +
          '<span class="mbars" title="' + esc(askedWhy + '\nCPU: ' + cpuSays + '\nMemory: ' + memSays) + '"><span>' + asked + 'CPU ' + cpu.pct + '%</span><span>' + asked + 'memory ' + mem.pct + '%</span>' +
          cpu.html + mem.html + used + '</span></button><div class="mtiles">' +
          (ui.sys ? furniture : []).concat(own).map(function (pod) { return mapTile(pod, ui, text); }).join('') +
          (!ui.sys && furniture.length
            ? '<button class="mtile sys h-' + mapWorst(furniture) + '" data-map-sys="1" title="DaemonSets and system namespaces. Show them">' +
              '<i class="mdot"></i><span class="mtext"><b>+ ' + mapPlural(furniture.length, 'system pod') + '</b><small>show them</small></span></button>'
            : '') +
          (!pods.length ? '<span class="dim" style="padding:2px 4px">nothing running</span>' : '') +
          '</div></div>';
      });
      html += '</div></section>';
    });
    html += '</div>';

    var waiting = data.nodes.filter(function (node) { return node.kind === 'Pod' && !node.node && !node.finished; });
    if (waiting.length) {
      html += '<section class="mpool warn"><h5>Not scheduled<span>' + waiting.length + '</span>' +
        '<span class="dim" style="text-transform:none;letter-spacing:0">no node has taken these</span></h5><div class="mtiles wide">' +
        waiting.map(function (pod) { return mapTile(pod, ui, text); }).join('') + '</div></section>';
    }

    var volumes = data.nodes.filter(function (node) {
      if (node.kind !== 'PersistentVolume') return false;

      return !narrowed || chosen[node.attachedTo] || chosen[node.pinnedTo];

    var lanes = {};
    volumes.forEach(function (volume) { (lanes[volume.className || ''] || (lanes[volume.className || ''] = [])).push(volume); });
    Object.keys(lanes).sort().forEach(function (name) {
      var klass = ix.byId['StorageClass//' + name];
      var local = lanes[name].every(function (volume) { return volume.local; });
      html += '<section class="mlane"><h5>Storage' + (name ? ' · ' + esc(name) : ' · no class') +
        (klass && klass.provisioner ? '<span class="mtag mono">' + esc(klass.provisioner) + '</span>' : '') +
        '<span class="dim" style="text-transform:none;letter-spacing:0">' +
        (local ? 'Local volumes: the data is on one node and stays there.' : 'Remote volumes, attached over the network. They are not on any node’s disk.') +
        '</span></h5><div class="mvols">' +
        lanes[name].sort(function (a, b) { return a.attachedTo < b.attachedTo ? -1 : 1; }).map(function (volume) {
          var claim = mapFrom(volume.id, 'binds')[0];
          var users = claim ? mapFrom(claim.id, 'mounts') : [];
          var lit = ui.hl && users.some(function (pod) { return pod.owner === ui.hl; });
          return '<button class="mtile mvol h-' + volume.health + (lit ? ' hl' : '') + (ui.sel === volume.id ? ' sel' : '') +
            '" data-map-id="' + esc(volume.id) + '" title="' + esc(volume.name) + '"><span class="mtext"><b>' +
            esc(claim ? claim.name : volume.name) + '</b><small>' + esc(claim ? claim.namespace : 'not claimed') + ' · ' +
            esc([volume.capacity, volume.modes].filter(Boolean).join(' · ')) + '</small><small>' +
            esc(volume.attachedTo ? 'attached to ' + mapShort(volume.attachedTo) : volume.local ? 'local to ' + mapShort(volume.pinnedTo) : 'not attached') +
            '</small></span></button>';
        }).join('') + '</div></section>';
    });
    var unbound = data.nodes.filter(function (node) { return node.kind === 'PersistentVolumeClaim' && node.health !== 'ok'; });
    if (unbound.length) {
      html += '<section class="mpool warn"><h5>Claims without a volume<span>' + unbound.length + '</span></h5><div class="mvols">' +
        unbound.map(function (claim) {
          return '<button class="mtile mvol h-' + claim.health + '" data-map-id="' + esc(claim.id) + '"><i class="mdot"></i><span class="mtext"><b>' +
            esc(claim.name) + '</b><small>' + esc(claim.namespace + ' · ' + claim.status) + '</small></span></button>';
        }).join('') + '</div></section>';

    return { flow: true, html: html + '</div>' };
  }

  /** Where an element is inside the canvas, in the canvas's own unscaled pixels. */
  function mapOffset(el, root) {
    var x = 0;
    var y = 0;
    var at = el;
    while (at && at !== root) { x += at.offsetLeft; y += at.offsetTop; at = at.offsetParent; }
    return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
  }

  function mapVolumeLine(inner, tile, card, cls) {
    var a = mapOffset(tile, inner);
    var b = mapOffset(card, inner);
