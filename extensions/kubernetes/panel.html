    var edges = [{ at: nav.getBoundingClientRect().width, which: 'nav' }];
    if (aside) edges.push({ at: body.getBoundingClientRect().width - aside.getBoundingClientRect().width, which: 'detail' });

    edges.forEach(function (edge) {
      var grip = document.createElement('div');
      grip.className = 'grip';
      grip.dataset.grip = edge.which;
      grip.style.left = edge.at + 'px';
      body.appendChild(grip);
    });
  }

  document.addEventListener('mousedown', function (event) {
    var grip = event.target.closest('.grip');
    if (!grip) return;
    event.preventDefault();
    grip.classList.add('is-held');

    var body = $('body');
    var which = grip.dataset.grip;
    var whole = body.getBoundingClientRect();

    var move = function (moved) {
      if (which === 'nav') {
        // Never so narrow that its own headings stop fitting, never past half.
        state.navWidth = Math.round(Math.max(120, Math.min(whole.width * 0.5, moved.clientX - whole.left)));
      } else {
        state.detailWidth = Math.round(Math.max(260, Math.min(whole.width - state.navWidth - 200, whole.right - moved.clientX)));
      }
      applyColumns();
      var edge = which === 'nav' ? state.navWidth : whole.width - state.detailWidth;
      grip.style.left = edge + 'px';
    };
    var up = function () {
      grip.classList.remove('is-held');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      drawGrips();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  /**
   * The three columns, and what happens when there is not room for them.
   *
   * The widths are in pixels because they were dragged in pixels, and a dragged
   * width that shifted when the window did would be a width nobody could set.
   * But two fixed columns in a window narrower than their sum leave the table —
   * the thing the panel is *for* — with nothing, and what a person sees is a
   * navigation, a detail pane, and no list between them.
   *
   * So the sides give way before the middle does: each is capped at what is
   * there, and the table keeps a floor as long as there is one to keep.
   */
  var TABLE_FLOOR = 180;

  function applyColumns() {
    var body = $('body');
    var room = body.clientWidth || window.innerWidth || 0;
    var detail = body.classList.contains('with-detail');

    var nav = Math.max(0, Math.min(state.navWidth, room - TABLE_FLOOR));
    var aside = 0;
    if (detail) {
      // Given most of the room when asked: this is where the reading is done.
      var wanted = state.paneBig ? Math.max(state.detailWidth, Math.round(room * 0.62)) : state.detailWidth;
      aside = Math.max(0, Math.min(wanted, room - nav - TABLE_FLOOR));
      // Narrower than the two of them plus a floor: the navigation goes first,
      // because the detail pane is what was asked for and the nav is a menu.
      if (aside < 160) {
        nav = Math.max(0, Math.min(nav, room - TABLE_FLOOR - 160));
        aside = Math.max(0, Math.min(state.detailWidth, room - nav - TABLE_FLOOR));
      }
    }

    body.style.gridTemplateColumns = detail
      ? nav + 'px minmax(0, 1fr) ' + aside + 'px'
      : nav + 'px minmax(0, 1fr)';
  }

  function drawDetail(force) {
    /*
     * Never over somebody's typing. The detail pane is rebuilt wholesale, and a
     * refresh landing mid-edit would take the text out from under them — which
     * is the sort of thing that makes people stop trusting an editor.
     *
     * `force` is for the one redraw that is *asked for* while editing: pressing
     * Edit itself, which swaps the painted manifest for the textarea before
     * anything has been typed into it. Without the distinction the button would
     * be blocked by the guard that exists to protect what it has not written
     * yet.
     */
    if (holdingEdit() && !force) return;
    if (!force && state.selected && selectingIn(document.querySelector('aside .detail-body'))) { heldBack.detail = true; return; }
    var chosen = state.selected;
    // Where the reader was, if this is the same thing on the same tab drawn again.
    var bodyWas = document.querySelector('aside .detail-body');
    var paneKey = chosen ? chosen.uid + '|' + state.detail.tab : '';
    var paneTop = bodyWas && paneKey && drawDetail.key === paneKey ? bodyWas.scrollTop : 0;
    drawDetail.key = paneKey;
    if (paneTop) setTimeout(function () { var body = document.querySelector('aside .detail-body'); if (body && drawDetail.key === paneKey && !body.scrollTop) body.scrollTop = paneTop; }, 0);
    $('body').className = 'body' + (chosen ? ' with-detail' : '');
    applyColumns();
    var existing = document.querySelector('aside');
    if (!chosen) { if (existing) existing.remove(); return; }

    var aside = existing || document.createElement('aside');
    if (!existing) { $('body').appendChild(aside); aside.classList.add('pane-in'); }
    aside.style.setProperty('--pane-scale', String(state.paneScale));

    /*
     * A release is asked different questions than an object is. Not "what does
     * it look like now" but "what changed, what was it configured with, and can
     * I put it back" — so it gets its own tabs rather than empty versions of
     * these.
     */
    var release = chosen.kind === 'Release';
    var tabs = release ? ['revisions', 'values', 'manifest', 'notes'] : chosen.kind === 'Event' ? ['overview', 'yaml'] : ['overview', 'yaml', 'events'];
    // An edit left on a tab is said on the tab, so it is not found by accident a day later.
    var unsaved = {
      yaml: draftFor(chosen) != null,
      configure: Boolean(state.configs[configKey(chosen)] && configChanges(state.configs[configKey(chosen)]).length),
    };
    var warned = warningsKnown();
    /*
     * A workload is two questions a plain object is not: which pods is it
     * actually running, and what was it before this. Both have to be asked of
     * other objects — the pods it selects, the revisions it owns — which is why
     * a table of workloads cannot answer either, and why they are here.
     */
    if (!release && chosen.configurable) tabs.splice(1, 0, 'configure');
    if (!release && chosen.selector) tabs.splice(1, 0, 'pods');
    if (!release && chosen.ownsJobs) tabs.splice(1, 0, 'jobs');
    if (!release && chosen.revisioned) tabs.splice(chosen.selector ? 2 : 1, 0, 'rollout');
    if (release && ['revisions', 'values', 'manifest', 'notes'].indexOf(state.detail.tab) < 0) {
      state.detail.tab = 'revisions';
    }
    if (!release && tabs.indexOf(state.detail.tab) < 0) {
      state.detail.tab = 'overview';
    }

    /*
     * What somebody is typing to Claude survives the pane being redrawn.
     *
     * The pane is rebuilt on every quiet refresh — ten seconds — and on every
     * change of a forward, and the question box went with it: half a sentence
     * and the cursor, gone while it was being written. Kept for the same
     * object only; a question about another pod is not this one's.
     */
    var finding = document.getElementById('pane-find');
    var findKept = finding && document.activeElement === finding ? { from: finding.selectionStart, to: finding.selectionEnd } : null;
    var asking = document.getElementById('question');
    var kept = asking && state.questionFor === chosen.uid
      ? { text: asking.value, focused: document.activeElement === asking, from: asking.selectionStart, to: asking.selectionEnd }
      : null;
    state.questionFor = chosen.uid;

    aside.innerHTML =
      '<div class="detail-head">' +
        /*
         * The pane's own controls, in one corner: back to what was open before,
         * the text smaller or larger, the pane given most of the room, and shut.
         * The size is the reader's to choose — a description is read at arm's
         * length by one person and across a desk by another.
         */
        '<div class="pane-tools">' +
          (state.view.type === 'map' && mapTrail.length
            ? '<button class="pane-tool" data-pane="back" title="Back to what was open before" aria-label="Back">←</button>' : '') +
          (release || chosen.kind === 'Event' ? '' : '<button class="pane-tool" data-do="pane-kubectl" title="Copy the kubectl command that reads this" aria-label="Copy kubectl command">&gt;_</button>') +
          '<button class="pane-tool" data-pane="smaller" title="Smaller text" aria-label="Smaller text"' + (state.paneScale <= 0.86 ? ' disabled' : '') + '>A−</button>' +
          '<button class="pane-tool" data-pane="bigger" title="Larger text" aria-label="Larger text"' + (state.paneScale >= 1.59 ? ' disabled' : '') + '>A+</button>' +
          '<button class="pane-tool' + (state.paneBig ? ' on' : '') + '" data-pane="wide" title="' + (state.paneBig ? 'Back to its usual width' : 'Give it most of the room') + '" aria-label="Wider">⤢</button>' +
          // A pane that opens on a click has to close on one. Escape closes it too.
          '<button class="pane-tool detail-close" data-do="close-detail" title="Close (Esc)" aria-label="Close">×</button>' +
        '</div>' +
        '<div class="pane-title"><span class="kind-badge c-' + (MAP_CAT[chosen.kind] || 'wk') + '">' + esc(release ? 'Release' : chosen.kind) + '</span>' +
          (chosen.reading ? '<span class="pane-reading spin" title="Reading it from the cluster">◐</span>' : '') + '</div>' +
        // An event's own name is a hash; what it is called by anyone is its reason.
        '<h3 class="pane-name">' + esc(chosen.kind === 'Event' ? (chosen.status || chosen.name) : chosen.name) + '</h3>' +
        '<small class="pane-sub">' +
          (!release && chosen.status ? '<span class="pill p-' + esc(chosen.health || 'idle') + '">' + esc(chosen.status) + '</span>' : '') +
          (release ? esc(chosen.chart + ' ' + chosen.chartVersion) + ' · revision ' + esc(chosen.revision) : '') +
          (chosen.namespace ? '<span>' + esc(chosen.namespace) + '</span>' : '') + '<span>' + ageHtml(chosen) + ' old</span></small>' +
        '<div class="detail-actions">' + actionsFor(chosen) + mapPaneLinks(chosen) + '</div>' +
        detailForwards(chosen) +
        (state.find.open
          ? '<div class="pane-find"><input id="pane-find" placeholder="Find in this tab" spellcheck="false" value="' + esc(state.find.text) + '" />' +
            '<span class="dim" id="pane-find-count"></span>' +
            '<button class="pane-tool" data-do="find-prev" title="Previous (⇧↵)" aria-label="Previous">↑</button>' +
            '<button class="pane-tool" data-do="find-next" title="Next (↵)" aria-label="Next">↓</button>' +
            '<button class="pane-tool" data-do="find-close" title="Close (Esc)" aria-label="Close find">×</button></div>'
          : '') +
        '<div class="ask">' +
          '<input id="question" placeholder="' + (chosen.kind === 'Event' ? 'Ask Claude why this happened' : 'Ask Claude something about this') + '" />' +
          '<button class="btn go" data-do="ask">Ask</button>' +
        '</div>' +
      '</div>' +
      '<div class="tabs">' + tabs.map(function (tab) {
        return '<button data-tab="' + tab + '" class="' + (state.detail.tab === tab ? 'on' : '') + '">' +
          (tab === 'yaml' ? 'YAML' : tab[0].toUpperCase() + tab.slice(1)) +
          (unsaved[tab] ? '<span class="tab-unsaved" title="Edited, not applied">●</span>' : '') +
          (tab === 'events' && warned ? '<span class="tab-count" title="' + warned + ' warning' + (warned === 1 ? '' : 's') + '">' + warned + '</span>' : '') +
          '</button>';
      }).join('') +
        '<span class="spacer"></span>' +
        // The manifest has its own Copy on its own bar, and a form is not something to copy.
        (state.detail.tab === 'yaml' || state.detail.tab === 'configure' ? '' :
          '<button class="btn" data-do="copy-detail" title="Copy what this tab is showing">Copy</button>') +
        (release && state.detail.tab === 'values'
          ? '<span class="spacer"></span><button class="btn' + (state.helmAll ? ' on' : '') +
            '" data-do="values-all" title="Every value the chart used, defaults included">All</button>'
          : '') +
      '</div>' +
      '<div class="detail-body" id="detail-body">' + detailBody(chosen) + '</div>';

    // The row of tabs scrolls when the pane is narrow: the one that is open is never the one out of sight.
    var lit = aside.querySelector('.tabs button.on');
    var strip = aside.querySelector('.tabs');
    if (lit && strip) {
      // Measured against the strip itself: offsetLeft is from whatever ancestor is positioned, which is not it.
      var at = lit.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft;
      if (at < strip.scrollLeft || at + lit.offsetWidth > strip.scrollLeft + strip.clientWidth - 60) strip.scrollLeft = Math.max(0, at - 40);
    }

    applyCan(aside);
    // An image is read from its end: the tag is what changes, and a long registry pushed it out of the field.
    var images = aside.querySelectorAll('[data-config="image"]');
    for (var im = 0; im < images.length; im += 1) images[im].scrollLeft = images[im].scrollWidth;
    if (findKept) {
      var findAgain = document.getElementById('pane-find');
      if (findAgain) { findAgain.focus(); try { findAgain.setSelectionRange(findKept.from, findKept.to); } catch (error) { /* nothing to place */ } }
    }
    findApply(false);

    if (kept && kept.text) {
      var again = document.getElementById('question');
      again.value = kept.text;
      if (kept.focused) {
        again.focus();
        try { again.setSelectionRange(kept.from, kept.to); } catch (error) { /* a caret where there is none */ }
      }
    }
  }

  function actionsFor(row) {
    var buttons = [];
    if (row.kind === 'Event') return eventActions(row);
    if (row.kind === 'Release') {
      return '<button class="btn" data-do="helm-diff" title="What this revision put in the cluster">Manifest</button>' +
        '<span class="gap"></span><button class="btn bad" data-do="helm-uninstall">Uninstall…</button>';
    }
    if (row.kind === 'Pod') {
      buttons.push('<button class="btn" data-do="logs">Logs</button>');
      buttons.push('<button class="btn" data-do="shell">Shell</button>');
    }
    if (row.scalable) buttons.push('<button class="btn" data-do="scale">Scale…</button>');
    if (row.restartable) buttons.push('<button class="btn" data-do="restart">Restart</button>');
    /*
     * The button that has no substitute. A Deployment halfway through replacing
     * its pods with an image that does not start is stopped by this and by
     * nothing else — scaling to zero would take down the half still serving.
     */
    if (row.pausable) {
      buttons.push('<button class="btn' + (row.paused ? ' on' : '') + '" data-do="pause" ' +
        'title="' + (row.paused ? 'Let the rollout carry on' : 'Hold the rollout where it is') + '">' +
        (row.paused ? 'Resume' : 'Pause') + '</button>');
    }
    if (row.triggerable) buttons.push('<button class="btn" data-do="trigger" title="Make a job from it now, off schedule">Run now</button>');
    if (row.suspendable) {
      buttons.push('<button class="btn' + (row.suspended ? ' on' : '') + '" data-do="suspend">' +
        (row.suspended ? 'Resume' : 'Suspend') + '</button>');
    }
    // A pod that is not running has nothing to forward to; everything else lets kubectl pick one that is.
    if (row.forwardKind && (row.forwardKind !== 'pod' || row.status === 'Running')) {
      var mine = forwardsOf(row).length;
      buttons.push('<button class="btn" data-do="forward" title="Reach a port of it from this machine">Forward…' + (mine ? ' <span class="dim">(' + mine + ')</span>' : '') + '</button>');
    }
    var removing = [];
    if (row.kind === 'Node') {
      buttons.push('<button class="btn" data-do="cordon">' + (row.schedulable ? 'Cordon' : 'Uncordon') + '</button>');
      removing.push('<button class="btn bad" data-do="drain">Drain…</button>');
    }
    removing.push('<button class="btn bad" data-do="delete">Delete…</button>');
    /*
     * Always the same shape: what reads and operates on the left, in the same
     * order on every kind, and what takes something away together at the far
     * right behind one gap. Two gaps left Drain floating in the middle of a
     * node's row, a different place from every other destructive button.
     */
    return buttons.join('') + '<span class="gap"></span>' + removing.join('');
  }

  /**
   * The pods a workload is actually running.
   *
   * Not a count — the pods themselves, with what is wrong with each. "3/5 ready"
   * tells you to go and look; this is the looking, and each row opens that pod
   * where its log and its shell are, which is where the answer was always going
   * to be.
   */
  function podsBody(row) {
    var pods = state.detailData.pods;
    if (!pods) return '<pre>reading…</pre>';
    if (!pods.length) return '<div class="dim">It is running no pods at all.</div>';
    var restarts = pods.reduce(function (sum, pod) { return sum + (Number(pod.restarts) || 0); }, 0);
    var unwell = pods.filter(function (pod) { return pod.health === 'bad'; }).length;
    return '<p class="all-well">' + pods.length + (pods.length === 1 ? ' pod' : ' pods') +
        (unwell ? ' · <span class="bad-text">' + unwell + ' unhealthy</span>' : ' · all healthy') +
        (restarts ? ' · ' + restarts + ' restarts between them' : '') + '</p>' +
      '<table><tbody>' + pods.map(function (pod) {
        return '<tr class="is-link" tabindex="0" role="link" data-open="' + esc(pod.name) + '" data-open-kind="pods"' +
            ' data-open-namespace="' + esc(pod.namespace || '') + '">' +
          '<td><span class="dot ' + esc(pod.health) + '"></span></td>' +
          '<td class="grow">' + esc(pod.name) + warnMark(assign({ kind: 'Pod' }, pod)) + '</td>' +
          '<td class="dim">' + esc(pod.status) + '</td>' +
          '<td class="dim">' + esc(pod.ready || '') + '</td>' +
          '<td class="' + (Number(pod.restarts) ? 'warn-text' : 'dim') + '">' +
            (Number(pod.restarts) ? esc(pod.restarts) + '×' : '') + '</td>' +
          '<td class="dim">' + esc(pod.node || '') + '</td>' +
          '<td class="dim age">' + ageHtml(pod) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /**
   * The runs a cron job has actually had.
   *
   * A schedule and a "last run 4h ago" say it fired; they do not say whether the
   * thing it fired worked, which is the only reason anybody opens a cron job.
   * Matched by owner uid rather than by the name the controller builds, because
   * two cron jobs in a namespace can produce names that only a uid tells apart.
   */
  function jobsBody(row) {
    var jobs = state.detailData.jobs;
    if (!jobs) return '<pre>reading…</pre>';
    if (!jobs.length) return '<div class="dim">It has not run yet — nothing it made is still around.</div>';
    var failed = jobs.filter(function (job) { return job.health === 'bad'; }).length;
    return '<p class="all-well">' + jobs.length + (jobs.length === 1 ? ' run kept' : ' runs kept') +
        (failed ? ' · <span class="bad-text">' + failed + ' failed</span>' : ' · none failed') + '</p>' +
      '<table><tbody>' + jobs.map(function (job) {
        return '<tr class="is-link" tabindex="0" role="link" data-open="' + esc(job.name) + '" data-open-kind="jobs"' +
            ' data-open-namespace="' + esc(job.namespace || '') + '">' +
          '<td><span class="dot ' + esc(job.health) + '"></span></td>' +
          '<td class="grow">' + esc(job.name) + '</td>' +
          '<td class="dim">' + esc(job.status) + '</td>' +
          '<td class="dim">' + esc(job.duration || '') + '</td>' +
          '<td class="dim age">' + ageHtml(job) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /**
   * What this workload used to be, and the way back.
   *
   * `rollout history` prints a table whose one interesting column is almost
   * always empty, so this shows the revisions themselves: which is running, what
   * images each one ran, and how long ago it was made. The images are the part
   * that makes a rollback a decision rather than a guess — going back one
   * revision means going back to the tag named on that row.
   */
  function rolloutBody(row) {
    var got = state.detailData.rollout;
    if (!got) return '<pre>reading…</pre>';
    if (typeof got === 'string') return '<div class="dim">' + esc(got) + '</div>';
    if (!got.rows.length) return '<div class="dim">No revisions are kept for this one.</div>';
    /*
     * A rollback reads as "undo" and is not: it puts the whole template back.
     * So before the button, the difference — what the pods would run after,
     * against what they run now — for anybody who wants to know what "revision
     * 7" was before going back to it.
     */
    var running = got.rows.filter(function (rev) { return rev.current; })[0];
    var comparing = state.detailData.compare;
    var other = comparing == null ? null : got.rows.filter(function (rev) { return rev.revision === comparing; })[0];
    var compared = '';
    if (other && running) {
      var change = lineDiff(running.spec || '', other.spec || '');
      compared = '<section class="block"><h4 class="block-head">Going back to revision ' + other.revision + ' would change<span class="spacer"></span>' +
        '<span class="dim">' + esc(linesText(change)) + '</span></h4>' +
        (change.added || change.removed ? '<div class="diff">' + diffHtml(change) + '</div>'
          : '<div class="dim">Nothing in what its pods run. It differs only in what is not part of the template.</div>') + '</section>';
    }
    return (row.paused ? '<p class="all-well warn-text">Its rollout is paused — nothing is replacing anything.</p>' : '') +
      '<table><tbody>' + got.rows.map(function (rev) {
        return '<tr>' +
          '<td class="dim">' + (rev.current ? '<b>' + rev.revision + '</b>' : rev.revision) + '</td>' +
          '<td class="grow"><div>' + esc(rev.images.join(', ') || rev.name) + '</div>' +
            (rev.cause ? '<div class="dim">' + esc(rev.cause) + '</div>' : '') + '</td>' +
          '<td class="dim age">' + ageHtml(rev) + '</td>' +
          '<td class="rev-tools">' + (rev.current
            ? '<span class="dim">running</span>'
            : (rev.spec && running && running.spec ? '<button class="btn' + (comparing === rev.revision ? ' on' : '') + '" data-compare="' + rev.revision + '" title="What going back to it would change">Compare</button>' : '') +
              '<button class="btn" data-undo="' + rev.revision + '"' + cannot('patch') + '>Roll back</button>') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>' + compared;
  }


  /* ------------------------------------------------------------------ *
   * Configuring a workload.
   *
   * The YAML tab can already change anything, and that is exactly its problem:
   * everything a person actually wants to change about a running workload —
   * which image, how many, how much memory, what is in the environment — is
   * four hundred lines down a document that also contains a status, a set of
   * managed fields and every default the API server filled in. Finding the one
   * line is the work, and a mistyped indent two lines away is an outage.
   *
   * So the same four things get a form. What leaves here is not the object: it
   * is a patch of what you changed, which is the difference between saying
   * "this image" and re-asserting every field in the manifest as it looked when
   * the panel last read it.
   * ------------------------------------------------------------------ */

  /** Where the pod template is. A cron job keeps its one level deeper. */
  function templatePath(kind) {
    return kind === 'CronJob'
      ? ['spec', 'jobTemplate', 'spec', 'template', 'spec']
      : ['spec', 'template', 'spec'];
  }

  function dig(object, path) {
    return path.reduce(function (at, key) { return at == null ? at : at[key]; }, object);
  }

  /** Where an environment variable comes from, when it does not come from a value. */
  function envSource(from) {
    if (!from) return null;
    if (from.secretKeyRef) return 'secret ' + from.secretKeyRef.name + ' · ' + from.secretKeyRef.key;
    if (from.configMapKeyRef) return 'config map ' + from.configMapKeyRef.name + ' · ' + from.configMapKeyRef.key;
    if (from.fieldRef) return 'the pod · ' + from.fieldRef.fieldPath;
    if (from.resourceFieldRef) return 'the container · ' + from.resourceFieldRef.resource;
    return 'somewhere else';
  }

  /**
   * The editable shape of a workload: the few fields a form can honestly offer.
   *
   * Honestly is the word that matters. Everything here is a field you can set
   * and read back; nothing in it is a summary of something more complicated,
   * because a form that simplifies is a form that silently drops what it did
   * not understand.
   */
  function configOf(object, kind) {
    var pod = dig(object, templatePath(kind)) || {};
    var read = function (list, init) {
      return (list || []).map(function (container) {
        var resources = container.resources || {};
        return {
          name: container.name,
          init: init,
          image: container.image || '',
          requests: {
            cpu: (resources.requests || {}).cpu || '',
            memory: (resources.requests || {}).memory || '',
          },
          limits: {
            cpu: (resources.limits || {}).cpu || '',
            memory: (resources.limits || {}).memory || '',
          },
          env: (container.env || []).map(function (entry) {
            return { name: entry.name, value: entry.value == null ? '' : String(entry.value), from: envSource(entry.valueFrom) };
          }),
        };
      });
    };
    return {
      // A daemon set has as many as there are nodes, and a cron job has none.
      replicas: kind === 'DaemonSet' || kind === 'CronJob'
        ? null
        : ((object.spec || {}).replicas == null ? 0 : object.spec.replicas),
      containers: read(pod.containers, false).concat(read(pod.initContainers, true)),
    };
  }

  function copyOf(value) { return JSON.parse(JSON.stringify(value)); }

  /** The draft for this object, kept across redraws and across tabs. */
  function configKey(row) { return (state.context || '') + '\n' + row.kind + '/' + (row.namespace || '') + '/' + row.name; }

  /**
   * Kept against the object, so it is still here after a look at another one.
   * When the object has been read again since, the draft is measured against
   * what the cluster has now — and if somebody else changed it meanwhile, the
   * form says so rather than quietly listing their change as one of yours.
   */
  function ensureConfig(row, object) {
    var key = configKey(row);
    var kept = state.configs[key];
    if (kept && kept.object !== object) {
      var live = configOf(object, row.kind);
      var names = function (config) { return config.containers.map(function (c) { return c.name; }).join('\n'); };
      if (names(live) !== names(kept.draft)) kept = null;
      else {
        if (JSON.stringify(live) !== JSON.stringify(kept.live)) {
          if (configChanges(kept).length) kept.moved = true;
          kept.draft = configRebase(kept.draft, kept.live, live);
        }
        kept.live = live;
        kept.object = object;
      }
    }
    if (!kept) {
      var fresh = configOf(object, row.kind);
      kept = { key: key, kind: row.kind, namespace: row.namespace || '', name: row.name, live: fresh, draft: copyOf(fresh), object: object };
    }
    state.configs[key] = kept;
    state.config = kept;
    return kept;
  }

  /**
   * What was edited stays edited; what was not is what the cluster has now.
   *
   * The draft is a copy of the whole form, so a field nobody touched held the
   * value it had when the form was opened — and after an autoscaler moved the
   * replicas from 3 to 5, the form offered "5 → 3" as if somebody had asked.
   */
  function configRebase(draft, was, now) {
    var out = copyOf(draft);
    if (same(draft.replicas, was.replicas)) out.replicas = now.replicas;
    out.containers.forEach(function (container, at) {
      var before = was.containers[at];
      var after = now.containers[at];
      if (!before || !after) return;
      if (same(container.image, before.image)) container.image = after.image;
      ['requests', 'limits'].forEach(function (which) {
        ['cpu', 'memory'].forEach(function (what) {
          if (same(container[which][what], before[which][what])) container[which][what] = after[which][what];
        });
      });
      if (JSON.stringify(container.env) === JSON.stringify(before.env)) container.env = copyOf(after.env);
    });
    return out;
  }

  var QUANTITY = /^\d+(\.\d+)?([eE]\d+)?(m|k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?$/;
  var QUANTITY_UNITS = { m: 0.001, k: 1e3, M: 1e6, G: 1e9, T: 1e12, P: 1e15, E: 1e18,
    Ki: 1024, Mi: 1048576, Gi: 1073741824, Ti: 1099511627776, Pi: 1125899906842624, Ei: 1152921504606846976 };
  function quantity(text) {
    var match = QUANTITY.exec(String(text));
    if (!match) return NaN;
    return parseFloat(text) * (match[3] ? QUANTITY_UNITS[match[3]] : 1);
  }

  /**
   * What the server would refuse, said before it is asked.
   *
   * The dry run is still the judge. This is for the things a form can see by
   * itself — `500x` is not an amount, a request above its limit, a variable
   * with no name — next to the field, while it is still being typed.
   */
  function configProblems(config) {
    var out = [];
    if (config.draft.replicas === '') out.push({ key: 'undefined|replicas', text: 'replicas is empty: say how many' });
    config.draft.containers.forEach(function (container, at) {
      var of = ' of ' + container.name;
      if (!String(container.image).trim()) out.push({ key: at + '|image', text: 'image' + of + ' is empty' });
      else if (/\s/.test(String(container.image).trim())) out.push({ key: at + '|image', text: 'image' + of + ' has a space in it' });
      ['cpu', 'memory'].forEach(function (what) {
        var request = String(container.requests[what]).trim();
        var limit = String(container.limits[what]).trim();
        if (request && !QUANTITY.test(request)) out.push({ key: at + '|requests.' + what, text: what + ' request' + of + ': ' + request + ' is not an amount' });
        if (limit && !QUANTITY.test(limit)) out.push({ key: at + '|limits.' + what, text: what + ' limit' + of + ': ' + limit + ' is not an amount' });
        if (request && limit && quantity(request) > quantity(limit)) {
          out.push({ key: at + '|requests.' + what, text: what + ' request' + of + ' (' + request + ') is above its limit (' + limit + ')' });
        }
      });
      var seen = {};
      container.env.forEach(function (entry, i) {
        var name = String(entry.name);
        if (!name) { if (entry.value) out.push({ key: at + '|env-name|' + i, text: 'a variable' + of + ' has a value and no name' }); return; }
        if (!/^[-._a-zA-Z][-._a-zA-Z0-9]*$/.test(name)) out.push({ key: at + '|env-name|' + i, text: name + of + ' is not a name a variable can have' });
        if (seen[name]) out.push({ key: at + '|env-name|' + i, text: name + of + ' is there twice' });
        seen[name] = true;
      });
    });
    return out;
  }

  /** Not wrong, and worth saying: what the map knows that the form cannot see in the object. */
  function configHintsHtml(config, row) {
    var known = mapKnown(row);
    if (!known || !known.hpa || (known.hpaOn || []).indexOf('cpu') < 0) return '';
    var without = config.draft.containers.filter(function (container) { return !container.init && !String(container.requests.cpu).trim(); })
      .map(function (container) { return container.name; });
    if (!without.length) return '';
    return '<div class="edit-note is-bad" role="note"><div class="edit-note-text">' +
      esc(known.hpa + ' scales this on CPU as a share of what is requested, and ' + without.join(', ') + ' request' + (without.length === 1 ? 's' : '') +
        ' none — so it cannot measure it and never scales. Set a CPU request below.') + '</div></div>';
  }

  function configWrong(problems) {
    var keys = {};
    problems.forEach(function (problem) { keys[problem.key] = problem.text; });
    return keys;
  }

  /**
   * Who will put this back.
   *
   * An object installed by Helm, synced by Argo CD or made by another object
   * can be edited here, and the edit will hold until its owner next looks.
   * That is worth knowing before typing, not in the question after it.
   */
  function managedNote() {
    var data = state.detailData;
    var meta = data.object && typeof data.object === 'object' ? data.object.metadata || {} : null;
    var text = typeof data.yaml === 'string' ? data.yaml : '';
    var pick = function (key) {
      if (meta) return (meta.annotations || {})[key] || (meta.labels || {})[key] || '';
      var found = new RegExp('^\\s+' + key.replace(/[.\/]/g, '\\$&') + ':\\s*["\']?([^"\'\\s]+)', 'm').exec(text);
      return found ? found[1] : '';
    };
    var notes = [];
    var owner = meta ? (meta.ownerReferences || [])[0] : null;
    if (!meta) {
      var owned = /^ {2}ownerReferences:\n(?: {2}- .*\n| {4}.*\n)*/m.exec(text);
      if (owned) owner = { kind: (/kind:\s*(\S+)/.exec(owned[0]) || [])[1], name: (/name:\s*(\S+)/.exec(owned[0]) || [])[1] };
    }
    if (owner && owner.kind) notes.push(owner.kind + ' ' + owner.name + ' made this and keeps it as it wants it. Change that one instead.');
    var argo = pick('argocd.argoproj.io/instance') || pick('argocd.argoproj.io/tracking-id').split(':')[0];
    if (argo) notes.push('Argo CD manages this, as part of the application ' + argo + '. If it syncs by itself, an edit here is put back the way Git says.');
    var helm = pick('meta.helm.sh/release-name');
    if (helm) notes.push('Helm installed this, as part of the release ' + helm + '. The next upgrade of that release puts it back the way the chart says.');
    if (!notes.length) return '';
    return '<div class="edit-note is-owned" role="note"><div class="edit-note-text">' + notes.map(esc).join('\n') + '</div></div>';
  }

  /**
   * Whether the cluster would refuse, known before the button is pressed.
   *
   * Asked once per kind and namespace when something is opened. A button the
   * account cannot use is drawn switched off and says why; one the cluster
   * gave no answer about is left alone, because not knowing is not a no.
   */
  function canKey(row) { return (row.resource || row.kind) + '|' + (row.namespace || ''); }
  function askCan(row) {
    if (!row || row.kind === 'Release' || row.kind === 'Event') return;
    var key = canKey(row);
    if (state.can[key]) return;
    state.can[key] = { asked: true };
    var at = { context: state.context, kind: row.resource || navFor(row.kind) || row.kind };
    if (row.namespace) at.namespace = row.namespace;
    call('kube.can', at).then(function (answer) {
      state.can[key] = { patch: answer.patch, delete: answer.delete };
      if ((answer.patch === false || answer.delete === false) && state.selected === row) { if (holdingEdit()) redrawEditor(); else drawDetail(); }
    }).catch(function () { /* not known, and so not held against anything */ });
  }
  /** The attributes that switch a button off, or nothing. */
  function cannot(verb) {
    var row = state.selected;
    var known = row && state.can[canKey(row)];
    if (!known || known[verb] !== false) return '';
    return ' disabled data-cannot="1" title="This account may not ' + (verb === 'delete' ? 'delete' : 'change') + ' ' + esc(row.kind) +
      (row.namespace ? ' in ' + esc(row.namespace) : '') + '. The cluster said so."';
  }
  var CAN_VERB = { delete: 'delete', scale: 'patch', restart: 'patch', pause: 'patch', suspend: 'patch', cordon: 'patch',
    'yaml-edit': 'patch', 'config-apply': 'patch', 'config-check': 'patch', 'yaml-apply': 'patch' };
  /** Applied to whatever was just drawn, so no button has to know about it. */
  function applyCan(root) {
    var row = state.selected;
    var known = row && state.can[canKey(row)];
    if (!known) return;
    var buttons = root.querySelectorAll('[data-do]');
    for (var i = 0; i < buttons.length; i += 1) {
      var verb = CAN_VERB[buttons[i].dataset.do];
      if (!verb || known[verb] !== false) continue;
      buttons[i].disabled = true;
      buttons[i].dataset.cannot = '1';
      buttons[i].title = 'This account may not ' + (verb === 'delete' ? 'delete' : 'change') + ' ' + row.kind + (row.namespace ? ' in ' + row.namespace : '') + '. The cluster said so.';
    }
  }

  /** What the server last said about an edit, kept on the page until the next keystroke. */
  function editNoteHtml() {
    var note = state.editNote;
    if (!note) return '';
    return '<div class="edit-note' + (note.bad ? ' is-bad' : '') + '" role="status">' +
      '<div class="edit-note-text">' + esc(note.text) + '</div>' +
      '<div class="edit-note-tools">' +
      (note.line ? '<button class="btn" data-do="yaml-goto" title="Put the caret there">Go to line ' + note.line + '</button>' : '') +
      (note.left ? '<button class="btn bad" data-do="yaml-replace" title="Send the manifest whole: what is not in the text is taken off the object">Replace…</button>' : '') +
      (note.moved ? '<button class="btn" data-do="yaml-theirs" title="What is different in the cluster now, against what you started from">See what changed</button>' +
        '<button class="btn" data-do="yaml-take" title="Drop your edit and start again from what the cluster has now">Take the cluster\u2019s</button>' +
        '<button class="btn go" data-do="yaml-force" title="Apply your text over what the cluster has now">Apply mine anyway</button>' : '') +
      '<button class="btn" data-do="note-close" title="Dismiss" aria-label="Dismiss">×</button>' +
      '</div></div>';
  }

  function applyLabel(what) {
    if (state.applying === 'apply' && what === 'apply') return '<span class="spin">◐</span> Applying…';
    if (state.applying === 'check' && what === 'check') return '<span class="spin">◐</span> Asking…';
    return what === 'apply' ? 'Apply' : 'Dry run';
  }

  function revertLabel() {
    return state.revertArmed && Date.now() - state.revertArmed < 4000 ? 'Discard the edit?' : 'Revert';
  }

  /** A number if it is one, and the thing itself if it is not — for comparing. */
  function same(a, b) { return String(a == null ? '' : a) === String(b == null ? '' : b); }

  /**
   * What is different, said the way a person would say it.
   *
   * This is both the count on the bar and the list in the dialog that asks
   * whether to go ahead, and it is the same list on purpose: the question you
   * are answering has to be the thing you were looking at.
   */
  function configChanges(config) {
    var live = config.live;
    var draft = config.draft;
    var out = [];
    if (draft.replicas != null && !same(draft.replicas, live.replicas)) {
      out.push('replicas: ' + live.replicas + ' → ' + draft.replicas);
    }
    draft.containers.forEach(function (now, at) {
      var was = live.containers[at];
      var of = ' of ' + now.name;
      if (!same(now.image, was.image)) out.push('image' + of + ': ' + (was.image || 'none') + ' → ' + (now.image || 'none'));
      ['requests', 'limits'].forEach(function (which) {
        ['cpu', 'memory'].forEach(function (what) {
          if (same(now[which][what], was[which][what])) return;
          out.push(what + ' ' + which.slice(0, -1) + of + ': ' +
            (was[which][what] || 'none') + ' → ' + (now[which][what] || 'none'));
        });
      });
      var byName = {};
      was.env.forEach(function (entry) { byName[entry.name] = entry; });
      var kept = {};
      now.env.forEach(function (entry) {
        kept[entry.name] = true;
        var before = byName[entry.name];
        if (!before) { out.push(entry.name + of + ': new, ' + (entry.value || 'empty')); return; }
        if (before.from || same(entry.value, before.value)) return;
        out.push(entry.name + of + ': ' + (before.value || 'empty') + ' → ' + (entry.value || 'empty'));
      });
      was.env.forEach(function (entry) {
        if (!kept[entry.name]) out.push(entry.name + of + ': removed');
      });
    });
    return out;
  }

  /**
   * The patch. Strategic merge, which is the one that knows a list of
   * containers is keyed by name — so naming one container changes that one and
   * leaves the others alone. Removing an environment variable has to be spelled
   * out, because merging a list that no longer mentions it would not remove it.
   */
  function configPatch(config) {
    var live = config.live;
    var draft = config.draft;
    var patch = {};
    if (draft.replicas != null && !same(draft.replicas, live.replicas)) {
      patch.spec = { replicas: Number(draft.replicas) };
    }
    var groups = { containers: [], initContainers: [] };
    draft.containers.forEach(function (now, at) {
      var was = live.containers[at];
      var change = {};
      if (!same(now.image, was.image)) change.image = now.image;

      var resources = {};
      ['requests', 'limits'].forEach(function (which) {
        var part = {};
        ['cpu', 'memory'].forEach(function (what) {
          if (same(now[which][what], was[which][what])) return;
          // Emptied means "take it off", and null is how a merge patch says that.
          part[what] = now[which][what] ? now[which][what] : null;
        });
        if (Object.keys(part).length) resources[which] = part;
      });
      if (Object.keys(resources).length) change.resources = resources;

      var env = [];
      var byName = {};
      was.env.forEach(function (entry) { byName[entry.name] = entry; });
      var kept = {};
      now.env.forEach(function (entry) {
        if (!entry.name) return;
        kept[entry.name] = true;
        var before = byName[entry.name];
        // One that comes from a secret or a config map is shown, not edited.
        if (before && before.from) return;
        if (before && same(entry.value, before.value)) return;
        env.push({ name: entry.name, value: String(entry.value == null ? '' : entry.value) });
      });
      was.env.forEach(function (entry) {
        if (!kept[entry.name]) env.push({ name: entry.name, $patch: 'delete' });
      });
      if (env.length) change.env = env;

      if (!Object.keys(change).length) return;
      change.name = now.name;
      groups[now.init ? 'initContainers' : 'containers'].push(change);
    });

    if (groups.containers.length || groups.initContainers.length) {
      var pod = {};
      if (groups.containers.length) pod.containers = groups.containers;
      if (groups.initContainers.length) pod.initContainers = groups.initContainers;
      // Wrapped in whatever path this kind keeps its template at, so a cron
      // job's extra level costs nothing but the path.
      patch = deepen(patch, templatePath(config.kind), pod);
    }
    return patch;
  }

  /** `{a: {b: {c: value}}}` from `['a','b','c']`, merged onto what is there. */
  function deepen(onto, path, value) {
    var out = assign({}, onto || {});
    if (!path.length) return value;
    out[path[0]] = deepen(out[path[0]], path.slice(1), value);
    return out;
  }

  function containerCard(container, at) {
    var field = function (label, what, value, placeholder) {
      var wrong = configWrongNow[at + '|' + what];
      return '<label class="config-field"><span>' + esc(label) + '</span>' +
        '<input data-config="' + what + '" data-at="' + at + '" value="' + esc(value) + '" ' +
        (wrong ? 'class="is-wrong" title="' + esc(wrong) + '" ' : '') +
        'placeholder="' + esc(placeholder || '') + '" spellcheck="false" /></label>';
    };
    var env = container.env.map(function (entry, i) {
      // By its name only: PASSWORD, TOKEN, SECRET, a KEY. The value is on a screen somebody else may be looking at.
      var hush = /pass(word)?|secret|token|credential|private|api_?key|access_?key|_key$/i.test(entry.name) && entry.value !== '' && !shownEnv[at + '|' + entry.name];
      if (entry.from) {
        return '<div class="config-env is-from">' +
          '<span class="env-name">' + esc(entry.name) + '</span>' +
          '<span class="dim">from ' + esc(entry.from) + '</span>' +
          '<button class="btn" data-config-drop="' + at + '" data-env="' + i + '" title="Remove this variable">✕</button>' +
          '</div>';
      }
      return '<div class="config-env">' +
        '<input class="env-name" data-config="env-name" data-at="' + at + '" data-env="' + i + '" ' +
          'value="' + esc(entry.name) + '" spellcheck="false" />' +
        '<input data-config="env-value" data-at="' + at + '" data-env="' + i + '" ' +
          (hush ? 'type="password" autocomplete="off" title="Covered because of its name. Click the eye to see it." ' : '') +
          'value="' + esc(entry.value) + '" spellcheck="false" />' +
        (hush || shownEnv[at + '|' + entry.name] ? '<button class="btn env-eye" data-env-eye="' + esc(at + '|' + entry.name) + '" title="' + (hush ? 'Show it' : 'Cover it') + '" aria-label="Show or cover the value">' + (hush ? '◉' : '◎') + '</button>' : '<span></span>') +
        '<button class="btn" data-config-drop="' + at + '" data-env="' + i + '" title="Remove this variable">✕</button>' +
        '</div>';
    }).join('');

    return '<section class="block config-container">' +
      '<h4 class="block-head">' + esc(container.name) +
        (container.init ? ' <span class="dim">init</span>' : '') + '</h4>' +
      '<div class="config-grid">' +
        field('Image', 'image', container.image, 'repository:tag') +
      '</div>' +
      '<div class="config-grid config-four">' +
        field('CPU request', 'requests.cpu', container.requests.cpu, 'none') +
        field('CPU limit', 'limits.cpu', container.limits.cpu, 'none') +
        field('Memory request', 'requests.memory', container.requests.memory, 'none') +
        field('Memory limit', 'limits.memory', container.limits.memory, 'none') +
      '</div>' +
      '<div class="config-envs">' + (env || '<div class="dim">No environment variables set here.</div>') +
        '<button class="btn" data-config-add="' + at + '">+ Variable</button>' +
      '</div>' +
      '</section>';
  }

  function configureBody(row) {
    var object = state.detailData.object;
    if (object == null) return '<pre>reading…</pre>';
    if (typeof object === 'string') return '<div class="error">' + esc(object) + '</div>';

    var config = ensureConfig(row, object);
    var changes = configChanges(config);
    var problems = configProblems(config);
    var draft = config.draft;
    var off = !changes.length || problems.length || state.applying;
    configWrongNow = configWrong(problems);

    return '<div class="yaml-tools is-stuck">' +
      '<button class="btn go" data-do="config-apply" title="Save these changes to the cluster (⌘S)"' +
        (off ? ' disabled' : '') + '>' + applyLabel('apply') + '</button>' +
      '<button class="btn" data-do="config-check" title="Ask the server whether this is legal, and change nothing (⌘↵)"' +
        (off ? ' disabled' : '') + '>' + applyLabel('check') + '</button>' +
      '<button class="btn" data-do="config-revert"' + (changes.length && !state.applying ? '' : ' disabled') + '>' + revertLabel() + '</button>' +
      '<span class="dim" id="config-count">' + esc(configCountText(changes)) + '</span>' +
      '</div>' +
      editNoteHtml() + managedNote() +
      '<div id="config-hints">' + configHintsHtml(config, row) + '</div>' +
      (config.moved ? '<div class="edit-note" role="status"><div class="edit-note-text">This was changed in the cluster after you started. ' +
        'What is listed below is measured against what it has now.</div></div>' : '') +
      '<ul class="config-problems" id="config-problems">' + problems.map(function (p) { return '<li>' + esc(p.text) + '</li>'; }).join('') + '</ul>' +
      (draft.replicas == null ? '' :
        '<section class="block"><h4 class="block-head">Replicas' + (mapKnown(row) && mapKnown(row).hpa
          ? '<span class="dim block-note">' + esc(mapKnown(row).hpa + ' keeps it between ' + mapKnown(row).hpaRange.replace('–', ' and ') + '; a number set here lasts until it next acts') + '</span>' : '') + '</h4>' +
        '<div class="config-grid config-narrow">' +
          '<label class="config-field"><span>How many</span>' +
          '<input type="number" min="0" data-config="replicas" value="' + esc(String(draft.replicas)) + '" /></label>' +
        '</div></section>') +
      draft.containers.map(containerCard).join('') +
      '<section class="block" id="config-pending"' + (changes.length ? '' : ' hidden') + '><h4 class="block-head">Not applied yet</h4>' +
        '<ul class="config-diff" id="config-diff">' + configDiffHtml(changes) + '</ul></section>';
  }

  var configWrongNow = {};
  /** Covered values somebody asked to see, by container and name. Forgotten with the pane. */
  var shownEnv = {};
  document.addEventListener('click', function (event) {
    var eye = event.target.closest && event.target.closest('[data-env-eye]');
    if (!eye) return;
    var key = eye.dataset.envEye;
    if (shownEnv[key]) delete shownEnv[key]; else shownEnv[key] = true;
    redrawEditor();
  });

  function configDiffHtml(changes) {
    return changes.map(function (line) { return '<li>' + esc(line) + '</li>'; }).join('');
  }

  function configCountText(changes) {
    if (!changes.length) return 'as it is in the cluster';
    return changes.length === 1 ? '1 change, not applied' : changes.length + ' changes, not applied';
  }

  /**
   * A keystroke goes into the draft and nowhere near the DOM.
   *
   * Redrawing on every character would take the cursor out of the field being
   * typed in, so only the count is written back — the rest of the form is
   * already showing what was typed, because the person typed it.
   */
  function editConfig(field) {
    var config = state.config;
    if (!config) return;
    var value = field.value;
    var what = field.dataset.config;
    if (what === 'replicas') {
      // Emptied is not zero: it is nothing yet, and it is said to be wrong rather than sent as "stop everything".
      config.draft.replicas = value === '' ? '' : Math.max(0, Number(value) || 0);
    } else {
      var container = config.draft.containers[Number(field.dataset.at)];
      if (!container) return;
      if (what === 'image') container.image = value;
      else if (what === 'env-name' || what === 'env-value') {
        var entry = container.env[Number(field.dataset.env)];
        if (!entry) return;
        if (what === 'env-name') entry.name = value; else entry.value = value;
      } else {
        var parts = what.split('.');
        if (container[parts[0]]) container[parts[0]][parts[1]] = value;
      }
    }
    state.revertArmed = 0;
    rememberSoon();
    if (state.editNote) { state.editNote = null; var note = document.querySelector('.edit-note'); if (note) note.remove(); }
    configShow();
  }

  /**
   * The parts of the form that follow from the fields, written in place: the
   * count, the list of what is not applied, what is wrong, and which buttons
   * can be pressed. The fields themselves are never rewritten under a caret.
   */
  function configShow() {
    var config = state.config;
    if (!config) return;
    var changes = configChanges(config);
    var problems = configProblems(config);
    // Nothing to protect once it matches the cluster again.
    state.editing = changes.length > 0;
    var count = document.getElementById('config-count');
    if (count) count.textContent = configCountText(changes);
    var list = document.getElementById('config-diff');
    if (list) list.innerHTML = configDiffHtml(changes);
    var pending = document.getElementById('config-pending');
    if (pending) pending.hidden = !changes.length;
    var hints = document.getElementById('config-hints');
    if (hints && state.selected) hints.innerHTML = configHintsHtml(config, state.selected);
    var wrong = document.getElementById('config-problems');
    if (wrong) wrong.innerHTML = problems.map(function (p) { return '<li>' + esc(p.text) + '</li>'; }).join('');
    configWrongNow = configWrong(problems);
    var fields = document.querySelectorAll('[data-config]');
    for (var i = 0; i < fields.length; i += 1) {
      var f = fields[i];
      var key = f.dataset.at + '|' + f.dataset.config + (f.dataset.env == null ? '' : '|' + f.dataset.env);
      f.classList.toggle('is-wrong', Boolean(configWrongNow[key]));
      f.title = configWrongNow[key] || '';
    }
    ['config-apply', 'config-check'].forEach(function (name) {
      var button = document.querySelector('[data-do="' + name + '"]');
      if (button && !button.dataset.cannot) button.disabled = !changes.length || problems.length > 0 || Boolean(state.applying);
    });
    var revert = document.querySelector('[data-do="config-revert"]');
    if (revert) { revert.disabled = !changes.length; revert.textContent = revertLabel(); revert.dataset.armed = state.revertArmed ? 1 : 0; }
    drawCrumb();
    var dot = document.querySelector('.tabs [data-tab="configure"] .tab-unsaved');
    var tab = document.querySelector('.tabs [data-tab="configure"]');
    if (tab && changes.length && !dot) tab.insertAdjacentHTML('beforeend', '<span class="tab-unsaved" title="Edited, not applied">●</span>');
    if (dot && !changes.length) dot.remove();
  }

  /** Send it, after the server has said it is legal. */
  function applyConfig(checkOnly) {
    var config = state.config;
    var row = state.selected;
    if (!config || !row) return;
    var changes = configChanges(config);
    if (!changes.length || state.applying) return;
    var problems = configProblems(config);
    if (problems.length) { say(problems[0].text, true); return; }
    var patch = configPatch(config);
    var at = { context: state.context, kind: row.kind, name: row.name, patch: patch, summary: changes };
    if (row.namespace) at.namespace = row.namespace;

    // Whoever the answer comes back to, it is about this object: the pane may be on another by then.
    var mine = function () { return state.selected === row && state.config === config; };
    var settle = function (note) {
      if (!mine()) { if (note) say(row.name + ': ' + note.text, note.bad); return; }
      state.applying = null;
      state.editNote = note;
      redrawEditor();
    };
    state.applying = checkOnly ? 'check' : 'apply';
    state.editNote = null;
    state.revertArmed = 0;
    redrawEditor();
    call('kube.configure', assign({ dryRun: true }, at)).then(function (dry) {
      if (checkOnly) {
        settle({ text: 'The server accepted it. Nothing was changed.' + (dry.text ? '\n' + dry.text : '') });
        return null;
      }
      return call('kube.configure', at).then(function (done) {
        say(done.text || 'Changed.');
        recordApplied(row, 'Configure', { lines: changes });
        delete state.configs[config.key];
        drawCrumb();
        if (!mine()) return null;
        state.applying = null;
        state.editNote = { text: 'Applied. ' + (done.text || '') };
        state.editing = false;
        state.config = null;
        state.detailData.object = null;
        state.detailData.yaml = null;
        state.detailData.editable = null;
        drawDetail(true);
        loadDetail();
        setTimeout(function () { load(true); }, 900);
        return null;
      });
    }).catch(function (error) {
      var text = String(error.message || error);
      // Cancelling the question is an answer: the form goes back to how it was, with nothing in red.
      settle(/the person said no/.test(text) ? null : { text: text, bad: true });
    });
  }


  /* ------------------------------------------------------------------ *
   * YAML, coloured.
   *
   * This is the app's own highlighter, transliterated. Not a second one: a
   * hand-rolled highlighter that is wrong about a block scalar is worse than
   * none, because it lies about the one thing YAML is genuinely hard to read
   * for, and this panel cannot reach the app's editor to borrow it — it is a
   * sandboxed frame in an origin of its own.
   *
   * So the rules are copied rather than reinvented, and a test compares the two
   * on real kubectl output line by line. If they ever drift, that test fails
   * rather than somebody noticing a wrong colour six months later.
   * ------------------------------------------------------------------ */

  var BLOCK_OPENER = /:\s*[|>][-+]?\d*\s*(#.*)?$/;

  /** Where the colon that separates a key from a value is, or -1. */
  function keyColon(text) {
    var quote = null;
    for (var i = 0; i < text.length; i += 1) {
      var ch = text[i];
      if (quote) {
        if (ch === '\\') { i += 1; continue; }
        if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'") { quote = ch; continue; }
      // A comment before any colon means the line was never a pair.
      if (ch === '#' && (i === 0 || /\s/.test(text[i - 1]))) return -1;
      if (ch === ':' && (i + 1 === text.length || /\s/.test(text[i + 1]))) return i;
    }
    return -1;
  }

  function splitTrailingComment(value) {
    var quote = null;
    for (var i = 0; i < value.length; i += 1) {
      var ch = value[i];
      if (quote) { if (ch === quote) quote = null; continue; }
      if (ch === '"' || ch === "'") quote = ch;
      else if (ch === '#' && (i === 0 || /\s/.test(value[i - 1]))) return [value.slice(0, i), value.slice(i + 1)];
    }
    return [value];
  }

  /** What a plain value plainly is — by its shape, not by what it means. */
  function scalarClass(body) {
    if (/^(true|false|yes|no|on|off|null|~)$/i.test(body)) return 'y-const';
    if (/^-?\d[\d_]*(\.\d+)?([eE][-+]?\d+)?$/.test(body)) return 'y-num';
    if (/^[&*]/.test(body)) return 'y-anchor';
    if (/^[|>]/.test(body)) return 'y-block';
    return 'y-str';
  }

  /** `[a, b]` and `{k: v}` — the one place a line holds more than one value. */
  function flowTokens(body) {
    var spans = [];
    var start = 0;
    var token = '';
    var quote = null;

    var flush = function (end) {
      var trimmed = token.trim();
      if (trimmed) {
        var from = start + token.indexOf(trimmed);
        var at = keyColon(trimmed);
        if (at > 0) {
          spans.push({ from: from, to: from + trimmed.slice(0, at).replace(/\s+$/, '').length, cls: 'y-key' });
          spans.push({ from: from + at, to: from + at + 1, cls: 'y-punct' });
          var value = trimmed.slice(at + 1);
          var lead = value.length - value.replace(/^\s+/, '').length;
          var rest = value.trim();
          if (rest) spans.push({ from: from + at + 1 + lead, to: from + trimmed.length, cls: scalarClass(rest) });
        } else {
          spans.push({ from: from, to: from + trimmed.length, cls: scalarClass(trimmed) });
        }
      }
      token = '';
      start = end;
    };

    for (var i = 0; i < body.length; i += 1) {
      var ch = body[i];
      if (quote) {
        token += ch;
        if (ch === '\\') { token += body[i + 1] || ''; i += 1; }
        else if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'") { quote = ch; token += ch; continue; }
      if ('[]{},'.indexOf(ch) >= 0) {
        flush(i);
        spans.push({ from: i, to: i + 1, cls: 'y-punct' });
        start = i + 1;
        continue;
      }
      if (!token) start = i;
      token += ch;
    }
    flush(body.length);
    return spans;
  }

  function valueSpans(body, offset) {
    if (!body) return [];
    if (body.indexOf('#') === 0) return [{ from: offset, to: offset + body.length, cls: 'y-comment' }];

    var split = splitTrailingComment(body);
    var head = split[0];
    var spans = split.length === 1 ? [] : [{ from: offset + head.length, to: offset + body.length, cls: 'y-comment' }];

    var lead = head.length - head.replace(/^\s+/, '').length;
    var value = head.trim();
    var from = offset + lead;
    if (!value) return spans;

    // A tag says what the value *is* — `!Ref`, `!!str` — and is not part of it.
    var tagged = /^(!!?[^\s]*)\s*(.*)$/.exec(value);
    if (tagged) {
      spans.unshift({ from: from, to: from + tagged[1].length, cls: 'y-tag' });
      if (tagged[2]) {
        var after = value.indexOf(tagged[2], tagged[1].length);
        spans.push({ from: from + after, to: from + after + tagged[2].length, cls: scalarClass(tagged[2]) });
      }
      return spans;
    }

    if (/^[[{]/.test(value)) {
      return flowTokens(value).map(function (span) {
        return { from: from + span.from, to: from + span.to, cls: span.cls };
      }).concat(spans);
    }
    return [{ from: from, to: from + value.length, cls: scalarClass(value) }].concat(spans);
  }

  /** The coloured stretches of one line, given whether a block scalar is open. */
  function yamlSpans(text, inBlock) {
    if (inBlock || !text.trim()) return [];
    var trimmed = text.trim();
    var indent = text.length - text.replace(/^\s+/, '').length;
    var end = text.replace(/\s+$/, '').length;

    if (trimmed.indexOf('#') === 0) return [{ from: indent, to: end, cls: 'y-comment' }];
    if (trimmed === '---' || trimmed === '...' || trimmed.indexOf('--- ') === 0 || trimmed.indexOf('%') === 0) {
      return [{ from: indent, to: end, cls: 'y-doc' }];
    }

    var isItem = trimmed.indexOf('- ') === 0 || trimmed === '-';
    var inner = isItem ? trimmed.slice(1).trim() : trimmed;
    // A line that is neither an item nor a pair is raw, and is left alone.
    if (!isItem && keyColon(inner) <= 0) return [];

    var spans = [];
    var at = indent;
    if (isItem) {
      spans.push({ from: at, to: at + 1, cls: 'y-dash' });
      at += 1;
      while (at < text.length && /\s/.test(text[at])) at += 1;
    }

    var rest = text.slice(at, end);
    var colon = keyColon(rest);
    if (colon > 0) {
      spans.push({ from: at, to: at + rest.slice(0, colon).replace(/\s+$/, '').length, cls: 'y-key' });
      spans.push({ from: at + colon, to: at + colon + 1, cls: 'y-colon' });
      at += colon + 1;
      while (at < end && /\s/.test(text[at])) at += 1;
    }
    return spans.concat(valueSpans(text.slice(at, end), at));
  }

  /** Whether this line opens a block scalar, so the next lines are left plain. */
  function opensYamlBlock(text) {
    var trimmed = text.trim();
    var inner = trimmed.indexOf('- ') === 0 || trimmed === '-' ? trimmed.slice(1).trim() : trimmed;
    return keyColon(inner) > 0 && BLOCK_OPENER.test(inner);
  }

  /**
   * A whole YAML document as coloured HTML.
   *
   * Block scalars are the reason this is not a per-line map: everything inside
   * one is text, however much it looks like YAML, and a highlighter that colours
   * an embedded config file as if it were the manifest is exactly the lie worth
   * avoiding. A block ends at the first line indented no further than the key
   * that opened it.
   */
  function yamlHtml(text) {
    var lines = String(text == null ? '' : text).split('\n');
    var blockAt = -1;
    return lines.map(function (line) {
      var indent = line.length - line.replace(/^\s+/, '').length;
      if (blockAt >= 0 && (!line.trim() || indent > blockAt)) return colour(line, yamlSpans(line, true));
      blockAt = -1;
      var spans = yamlSpans(line, false);
      if (opensYamlBlock(line)) blockAt = indent;
      return colour(line, spans);
    }).join('\n');
  }

  /** One line, with its spans painted and everything between them left plain. */
  function colour(line, spans) {
    if (!spans.length) return esc(line);
    var ordered = spans.slice().sort(function (a, b) { return a.from - b.from; });
    var out = '';
    var at = 0;
    for (var i = 0; i < ordered.length; i += 1) {
      var span = ordered[i];
      if (span.from < at || span.to <= span.from) continue;
      out += esc(line.slice(at, span.from));
      out += '<span class="' + span.cls + '">' + esc(line.slice(span.from, span.to)) + '</span>';
      at = span.to;
    }
    return out + esc(line.slice(at));
  }


  /**
   * What this object is, said in the order somebody wants it.
   *
   * The old one put a definition list, then labels, then the whole of `describe`
   * in one undifferentiated block of grey text — which is everything the object
   * knows, in the order kubectl happens to print it, and finding the one line
   * that matters in it is the work. This is the same material in named blocks,
   * each of which can be taken on its own: what it is, what is running in it,
   * what it is labelled, and then the long text underneath for when the answer
   * is not in the short version.
   */
  function overviewBody(row) {
    if (row.kind === 'Event') return eventPane(row);
    var known = mapInfo(row);
    // With the map's own account of it above, the cluster's long description is one click away rather than in the way.
    var drawn = Boolean(known) && state.view.type === 'map';
    return chartsFor(row) + known + factsBlock(row, drawn) + containersBlock(row) + labelsBlock(row) +
      (drawn ? '<details class="pane-fold" data-pane-fold="describe"' + (state.describeOpen ? ' open' : '') + '><summary>Described by the cluster</summary>' + describeBlock() + '</details>' : describeBlock());
  }

  /** A named section with its own Copy — nobody wants the whole drawer. */
  function block(title, inner, extra) {
    return '<section class="block"><h4 class="block-head">' + esc(title) +
      '<span class="spacer"></span>' + (extra || '') +
      '<button class="btn" data-copy-block="' + esc(title) + '">Copy</button></h4>' + inner + '</section>';
  }

  function factsBlock(row, known) {
    /*
      * The flags that say what the buttons above may do are not facts about the
      * object; they are already on screen, as buttons. So are the three that say
      * what state those buttons are in — a Deployment with a Pause button over it
      * does not also need a line reading "paused false".
      */
    // Nor is what the top of the pane already says — its name, where it is, how old, how it is — said again under it;
    // and what the map has drawn above as a machine is not listed a second time as a row of facts.
    var skip = ['name', 'namespace', 'age', 'status'].concat(known && row.kind === 'Node' ? ['version', 'instance', 'zone', 'nodeGroup', 'pool'] : [])
      .concat(['uid', 'labels', 'containers', 'forwardable', 'health', 'scalable', 'restartable', 'createdAt',
      'kind', 'selector', 'revisioned', 'pausable', 'suspendable', 'triggerable', 'ownsJobs', 'owner',
      'configurable', 'paused', 'suspended', 'schedulable', 'forwardKind', 'forwardPorts', 'reading']);
    var facts = Object.keys(row).filter(function (key) {
      // The flags that say what the buttons above may do are not facts about the
      // object; they are already on screen, as buttons.
      // A yes/no is a flag for the buttons, never a fact anybody reads here.
      return skip.indexOf(key) < 0 && row[key] !== '' && row[key] != null && typeof row[key] !== 'object' && typeof row[key] !== 'boolean';
    });
    if (!facts.length) return '';
    return block('Summary', '<dl class="facts">' + facts.map(function (key) {
      var value = plainValue(row[key]);
      var tone = key === 'status' ? ' class="' + esc(row.health || '') + '-text"' : '';
      return '<dt>' + esc(HEADINGS[key] || key) + '</dt><dd' + tone + '>' + (key === 'age' ? ageHtml(row, value) : esc(value)) + '</dd>';
    }).join('') + '</dl>');
  }

  /**
   * A value as a person reads it: kubectl's `<none>` is a dash, and a size the
   * API gives in kibibytes — a node's 3927668Ki — is given in the unit it is
   * thought of in.
   */
  function plainValue(value) {
    var text = String(value);
    if (text === '<none>' || text === '<unset>') return '—';
    var size = /^(\d+)(Ki|Mi)$/.exec(text);
    if (size) {
      var mib = Number(size[1]) / (size[2] === 'Ki' ? 1024 : 1);
      if (mib >= 1024) return (mib / 1024).toFixed(1).replace(/\.0$/, '') + ' GiB';
      if (size[2] === 'Ki' && mib >= 1) return Math.round(mib) + ' MiB';
    }
    return text;
  }

  /**
   * The containers, which is what a pod actually is.
   *
   * A pod's own row says "2/3 ready" and stops there; which of the three, and
   * what it is running, was only ever in the describe text further down. Each
   * one names its image and offers its log directly — the log of the container
   * that is failing is the answer nine times in ten.
   */
  function containersBlock(row) {
    var containers = row.containers || [];
    if (!containers.length) return '';
    var isPod = row.kind === 'Pod';
    return block('Containers', '<div class="containers">' + containers.map(function (container) {
      var name = container.name || String(container);
      return '<div class="container-row">' +
        '<div class="container-name">' + esc(name) +
          (container.init ? '<span class="dim"> · init</span>' : '') + '</div>' +
        (isPod ? '<button class="btn" data-container-log="' + esc(name) + '">Log</button>' : '<span></span>') +
        (container.image ? '<div class="container-image dim">' + esc(container.image) + '</div>' : '') +
        '</div>';
    }).join('') + '</div>');
  }

  function labelsBlock(row) {
    var keys = Object.keys(row.labels || {});
    if (!keys.length) return '';
    return block('Labels', '<div class="chips">' + keys.map(function (key) {
      return '<span class="chip"><b>' + esc(key) + '</b><i>=</i>' + esc(row.labels[key]) + '</span>';
    }).join('') + '</div>');
  }

  function describeBlock() {
    var loaded = state.detailData.describe;
    if (typeof loaded === 'string' && /\(NotFound\)|\bnot found\b/i.test(loaded) && loaded.length < 400) {
      return '<div class="edit-note is-bad" role="status"><div class="edit-note-text">This is no longer in the cluster. It was deleted, or replaced by another of the same kind.\n' +
        esc(loaded.trim()) + '</div><div class="edit-note-tools"><button class="btn" data-do="close-detail">Close</button></div></div>';
    }
    return block('Described by the cluster',
      '<pre class="describe">' + (loaded == null ? 'reading…' : describeHtml(loaded)) + '</pre>');
  }

  /**
   * `kubectl describe`, with its structure showing.
   *
   * It is not YAML and colouring it as YAML would be a lie — it is a report with
   * `Key:  value` lines, indented sections, and an events table at the bottom.
   * Only three things are marked: the field names, so the eye can run down the
   * left; the section headings; and the word Warning, because that is the line
   * somebody opened this to find.
   */
  function describeHtml(text) {
    return String(text || '').split('\n').map(function (line) {
      if (/^\s*Warning\b/.test(line)) return '<span class="warn-text">' + esc(line) + '</span>';
      if (/^[A-Z][^:]*:\s*$/.test(line)) return '<span class="y-doc">' + esc(line) + '</span>';
      var pair = /^(\s*)([A-Za-z][\w .\/-]*?):(\s+)(.*)$/.exec(line);
      if (!pair) return esc(line);
      return esc(pair[1]) + '<span class="y-key">' + esc(pair[2]) + '</span>' +
        '<span class="y-colon">:</span>' + esc(pair[3]) + esc(pair[4]);
    }).join('\n');
  }


  /**
   * Read coloured, edited plain, and the bar says which you are in.
   *
   * A textarea cannot hold coloured text, and the alternatives — a
   * contenteditable pretending to be one, or a whole editor — are how a panel
   * that shows a manifest turns into a project that maintains an editor. So
   * the manifest is painted until somebody says they want to change it.
   *
   * What is edited is not quite what is read: the cluster's own fields — its
   * status, its resourceVersion, what it last applied — are left out, because
   * sent back they are either refused or asserted. See editableYaml.
   */
  /**
   * A Secret with its values covered.
   *
   * The tab used to paint them the moment it was opened, on a screen that may
   * be shared — and in base64, which hides nothing. Each value is replaced by
   * its length; the keys, which are what is usually being checked, stay.
   */
  function maskSecret(text) {
    var inData = false;
    var out = [];
    String(text).split('\n').forEach(function (line) {
      if (/^\S/.test(line)) { inData = /^(data|stringData):/.test(line); out.push(line); return; }
      if (!inData) { out.push(line); return; }
      var pair = /^( {2}[^\s:][^:]*):\s*(.*)$/.exec(line);
      // Deeper lines are the body of a block value: gone with it.
      if (!pair) return;
      // A block value's first line is only its marker: no length to give.
      out.push(pair[1] + ': ' + (pair[2] && !/^[|>]/.test(pair[2]) ? '•••••• (' + pair[2].replace(/^["\']|["\']$/g, '').length + ' characters)' : '••••••'));
    });
    return out.join('\n');
  }
  function hidesValues(row) { return row.kind === 'Secret' && !state.showSecret; }

  function yamlBody(row) {
    var draft = draftFor(row);
    // Typing that survived a trip to another tab, or to another object, comes back with the editor open.
    // Not a Secret's: its editor is its values, and they are shown when somebody asks, not when a tab is opened.
    var covered = row.kind === 'Secret' && !state.showSecret;
    if (draft != null && !covered) state.editingYaml = true;
    if (covered) state.editingYaml = false;
    var editing = state.editingYaml;
    var base = baseFor(row);
    var body = draft == null ? base : draft;
    var diff = editing && draft != null ? lineDiff(base, draft) : null;
    var busy = Boolean(state.applying);
    var changed = diff && (diff.added || diff.removed);
    var showDiff = editing && state.yamlView === 'diff';
    var theirs = editing && state.yamlView === 'theirs' && state.detailData.theirs != null;

    var tools = editing
      ? '<button class="btn go" data-do="yaml-apply" title="Save this manifest to the cluster (⌘S)"' + (busy || !changed ? ' disabled' : '') + '>' + applyLabel('apply') + '</button>' +
        '<button class="btn" data-do="yaml-check" title="Ask the server whether this is legal, and change nothing (⌘↵)"' + (busy ? ' disabled' : '') + '>' + applyLabel('check') + '</button>' +
        '<button class="btn' + (showDiff ? ' on' : '') + '" data-do="yaml-diff" title="What you changed, against what the cluster had (⌘D)"' + (changed ? '' : ' disabled') + '>Changes</button>' +
        '<button class="btn" data-do="yaml-revert" title="' + (changed ? 'Throw the edit away' : 'Leave the editor (Esc)') + '" data-armed="' + (state.revertArmed ? 1 : 0) + '"' + (busy ? ' disabled' : '') + '>' + (changed ? revertLabel() : 'Done') + '</button>'
      : row.kind === 'Event' ? '' : (row.kind === 'Secret'
        ? '<button class="btn' + (state.showSecret ? ' on' : '') + '" data-do="secret-show" title="' + (state.showSecret ? 'Cover the values again' : 'Show the values on this screen') + '">' + (state.showSecret ? 'Hide values' : 'Show values') + '</button>' : '') +
        '<button class="btn" data-do="yaml-edit" title="' + (hidesValues(row) ? 'Editing shows the values. ' : '') + 'Change this manifest and apply it to the cluster"' + (state.applying === 'open' ? ' disabled' : '') + '>' +
        (state.applying === 'open' ? '<span class="spin">◐</span> Reading…' : 'Edit') + '</button>';

    return '<div class="yaml-tools is-stuck">' + tools +
      (!editing && row.kind !== 'Secret' && state.detailData.editable != null && state.detailData.editable !== state.detailData.yaml
        ? '<button class="btn' + (state.yamlClean ? ' on' : '') + '" data-do="yaml-clean" title="Leave out what the cluster writes: status, managed fields, what was last applied">Without status</button>' : '') +
      '<span class="dim" id="yaml-state">' + (editing ? (changed ? 'edited · ' + linesText(diff) : 'nothing changed yet') : state.yamlClean && row.kind !== 'Secret' ? 'as somebody would write it' : 'as it is in the cluster') + '</span>' +
      '<span class="spacer"></span>' +
      (editing && !showDiff && !theirs ? '<span class="dim" id="yaml-pos"></span>' +
        '<button class="btn' + (state.yamlWrap ? ' on' : '') + '" data-do="yaml-wrap" title="Wrap long lines instead of scrolling sideways">Wrap</button>' : '') +
      '<button class="btn" data-do="yaml-save" title="Save this text to a file on this machine">Save…</button>' +
      '<button class="btn" data-do="copy-detail" title="Copy the whole manifest">Copy</button>' +
      '</div>' +
      editNoteHtml() + (editing ? managedNote() : '') +
      (covered && draft != null ? '<div class="edit-note" role="note"><div class="edit-note-text">An edit of this Secret is kept and not applied. Edit shows it, with the values.</div></div>' : '') +
      (theirs
        ? '<div class="diff-title dim">What changed in the cluster since you started <button class="btn" data-do="yaml-diff-close">Back to the edit</button></div>' +
          '<div class="diff">' + (diffHtml(lineDiff(base, state.detailData.theirs)) || '<div class="dim">Nothing you would see in this text.</div>') + '</div>'
        : showDiff
          ? '<div class="diff-title dim">Yours against the cluster\u2019s. Click a line to go to it. <button class="btn" data-do="yaml-diff-close">Back to the edit</button>' +
            '<button class="btn" data-do="yaml-diff-copy" title="Copy the changes as a diff">Copy diff</button></div>' +
            '<div class="diff">' + diffHtml(diff) + '</div>'
          : editing
            ? '<textarea id="yaml-edit" spellcheck="false" autocapitalize="off" autocomplete="off" class="' + (state.yamlWrap ? 'is-wrapped' : '') + '" wrap="' + (state.yamlWrap ? 'soft' : 'off') + '"' + (busy ? ' readonly' : '') + '>' + esc(body) + '</textarea>'
            // A Secret is painted from the text without what was last applied, which is the values over again.
            : '<pre class="yaml">' + yamlHtml(row.kind === 'Secret'
              ? (hidesValues(row) ? maskSecret(base) : base) : state.yamlClean && state.detailData.editable != null ? state.detailData.editable : state.detailData.yaml) + '</pre>');
  }

  /* ------------------------------------------------------------------ *
   * Events: what the cluster has been saying about this one.
   * ------------------------------------------------------------------ */

  /** Whether this is something that makes other things and names them after itself. */
  function makesThings(row) {
    return Boolean(row.selector || row.ownsJobs || /^(Deployment|StatefulSet|DaemonSet|ReplicaSet|Job|CronJob)$/.test(row.kind));
  }

  /** Warnings known without asking again: from the events if they are read, else from the description's own table. */
  function warningsKnown() {
    var events = state.detailData.events;
    if (events) return events.filter(function (event) { return event.type === 'Warning' && !eventOver(event); }).length;
    // Before the events are read, the map's count is the one that knows which of them are over.
    var known = mapKnown(state.selected);
    var text = state.detailData.describe;
    var said = typeof text === 'string' ? text.split('\n').filter(function (line) { return /^\s+Warning\s/.test(line); }).length : 0;
    if (!known) return said;
    // The map is a few minutes old at worst. Of something that is not well, the description may know more.
    var unwell = state.selected && (state.selected.health === 'bad' || state.selected.health === 'warn');
    return unwell && !state.cleared[known.id] ? Math.max(warnedCount(known), said) : warnedCount(known);
  }

  function eventCard(event, withObject) {
    var warn = event.type === 'Warning';
    var first = event.firstAt && event.firstAt !== event.at ? Date.parse(event.firstAt) : NaN;
