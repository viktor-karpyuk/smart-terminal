   * The workloads that are not what they were asked to be.
   *
   * A pod count says how many are running. It does not say that a Deployment
   * asked for five and has three — which is the thing somebody gets paged
   * about, and the thing a wall of green pods hides.
   */
  function incompleteOf(data) {
    var health = data.workloads;
    if (!health) return '';
    if (!health.shortCount) {
      return '<div class="panel-block"><h4>Workloads</h4>' +
        '<p class="all-well">All ' + health.total + ' are at the number they asked for.</p></div>';
    }
    return '<div class="panel-block"><h4>Not at their number' +
      '<span class="dim"> · ' + health.shortCount + ' of ' + health.total + '</span></h4>' +
      '<table><tbody>' + health.short.map(function (row) {
        return '<tr class="clickable" data-goto="' + esc(row.kind) + '">' +
          '<td class="name"><span class="dot ' + (row.ready ? 'warn' : 'bad') + '"></span>' + esc(row.name) + '</td>' +
          '<td class="dim">' + esc(row.kind) + '</td>' +
          '<td class="dim">' + esc(row.namespace) + '</td>' +
          '<td class="' + (row.ready ? 'warn-text' : 'bad-text') + '">' + row.ready + '/' + row.wanted + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  /**
   * Pressure, when there is any.
   *
   * `Ready` is the condition everybody watches and the last one to turn: disk
   * and memory pressure show up first, and a node under them is already
   * refusing pods and evicting things while still calling itself ready. It is
   * absent when there is none, because a permanent green line saying "no
   * pressure" is a line people stop reading.
   */
  function pressureOf(data) {
    var rows = data.pressure || [];
    if (!rows.length) return '';
    return '<div class="pressure">' + rows.map(function (row) {
      return '<div><b>' + esc(row.condition) + '</b> on ' + esc(row.node) +
        '<span class="dim"> — ' + esc(row.message) + '</span></div>';
    }).join('') + '</div>';
  }

  /**
   * The warnings, gathered by what they are.
   *
   * Forty lines of FailedScheduling are one problem, and a list of forty shows
   * them as forty. How many kinds of thing are wrong is the number somebody
   * came for.
   */
  function reasonsOf(data) {
    var rows = data.reasons || [];
    if (!rows.length) return '';
    return '<div class="panel-block"><h4>What the cluster is complaining about</h4>' +
      '<table><tbody>' + rows.map(function (row) {
        return '<tr><td class="warn-text">' + esc(row.reason) + '</td>' +
          '<td class="dim">' + many(row.count) + '×</td>' +
          '<td class="dim">' + esc(row.newest) + '</td>' +
          '<td class="grow dim">' + esc(String(row.example || '').slice(0, 120)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  var STAT_TITLES = { cpu: 'CPU', memory: 'Memory', disk: 'Disk' };

  /**
   * One resource, expanded.
   *
   * The overview answers "is anything wrong"; this answers "wrong where". The
   * same three facts as the gauge, the shape over time at whatever range is
   * chosen, every node ranked by it, and the workloads actually consuming it —
   * which between them is the whole of what somebody does after noticing a bar
   * is longer than they expected.
   */
  function drawStats() {
    var data = state.overview;
    var focus = state.view.focus;
    if (!data) { $('table').innerHTML = state.loading ? '' : '<div class="note">Nothing loaded.</div>'; return; }

    var tabs = ['cpu', 'memory', 'disk'].map(function (which) {
      return '<button class="btn' + (focus === which ? ' on' : '') + '" data-stat="' + which + '">' +
        STAT_TITLES[which] + '</button>';
    }).join('');

    var key = 'cluster@' + state.prom.minutes;
    var got = state.prom.series[key] || {};
    var series = focus === 'memory' ? got.memory : focus === 'cpu' ? got.cpu : null;
    var format = focus === 'cpu' ? fromCores : bytes;

    var ranges = [60, 360, 1440].map(function (minutes) {
      return '<button class="btn' + (state.prom.minutes === minutes ? ' on' : '') + '" data-range="' + minutes + '">' +
        (minutes < 1440 ? minutes / 60 + 'h' : minutes / 1440 + 'd') + '</button>';
    }).join('');

    var head = '<div class="stat-head"><div class="stat-tabs">' + tabs + '</div>' +
      (focus === 'disk' ? '' : '<div class="chart-range">' + ranges + '</div>') + '</div>';

    var over = series
      ? '<div class="charts one">' + chart(series, format, STAT_TITLES[focus], true) + '</div>'
      : focus === 'disk'
        ? '<p class="note">Disk is measured now rather than over time — the node exporter reports what is there, not a history of it.</p>'
        : '<p class="note">No Prometheus in this cluster, so there is no history to draw.</p>';

    $('table').innerHTML = head + statNumbers(data, focus) + over +
      '<div class="split">' + statNodes(data, focus) + statConsumers(data, focus) + '</div>';
  }

  /** The three facts, said as numbers rather than as a bar. */
  function statNumbers(data, focus) {
    var cap = (data.capacity || {})[focus];
    if (focus === 'disk') {
      if (!state.disk) return '';
      var vols = data.volumes || {};
      return '<div class="cards">' +
        card(gigs(state.disk.total), 'on the nodes') +
        card(gigs(state.disk.used), Math.round((state.disk.used / state.disk.total) * 100) + '% used',
          state.disk.used / state.disk.total > 0.85 ? 'bad' : '') +
        card(vols.count || 0, 'volumes') +
        card(gigs(vols.claimed || 0), 'claimed by them') +
        card(vols.pending || 0, 'pending', vols.pending ? 'bad' : '') +
        '</div>';
    }
    if (!cap) return '';
    var format = focus === 'cpu' ? fromMillicores : gigs;
    return '<div class="cards">' +
      card(format(cap.allocatable), 'the nodes can give') +
      card(format(cap.requested), Math.round((cap.requested / cap.allocatable) * 100) + '% promised to pods') +
      card(format(cap.used), Math.round((cap.used / cap.allocatable) * 100) + '% actually used',
        cap.used > cap.requested ? 'warn' : '') +
      card(format(cap.limit), 'the ceiling, if every pod took it') +
      '</div>';
  }

  function card(value, label, tone) {
    return '<div class="card ' + (tone || '') + '"><b>' + esc(value) + '</b><span>' + esc(label) + '</span></div>';
  }

  /** Every node ranked by the one resource being looked at. */
  function statNodes(data, focus) {
    var nodes = (data.nodeUsage || []).slice();
    var of = function (node) {
      if (focus === 'cpu') return node.cpuAllocatable ? node.cpu / node.cpuAllocatable : 0;
      if (focus === 'memory') return node.memoryAllocatable ? node.memory / node.memoryAllocatable : 0;
      return node.diskTotal ? node.disk / node.diskTotal : 0;
    };
    var amount = function (node) {
      if (focus === 'cpu') return fromMillicores(node.cpu) + ' of ' + fromMillicores(node.cpuAllocatable);
      if (focus === 'memory') return gigs(node.memory) + ' of ' + gigs(node.memoryAllocatable);
      return node.diskTotal ? gigs(node.disk) + ' of ' + gigs(node.diskTotal) : 'not measured';
    };
    nodes.sort(function (a, b) { return of(b) - of(a); });
    if (!nodes.length) return '';

    return '<div class="panel-block"><h4>Every node<span class="dim"> · by ' + STAT_TITLES[focus].toLowerCase() + '</span></h4>' +
      nodes.map(function (node) {
        var pct = of(node) * 100;
        return '<div class="meter" data-node="' + esc(node.name) + '" title="' + esc(node.name) + '">' +
          '<span class="meter-name' + (node.ready ? '' : ' bad-text') + '">' +
            esc(node.name.replace(/\.(compute|ec2)\.internal.*$/, '')) + '</span>' +
          '<span class="meter-track wide"><i style="width:' + pct.toFixed(1) + '%" class="' + heat(pct) + '"></i></span>' +
          '<span class="meter-num">' + Math.round(pct) + '%</span>' +
          '<span class="meter-num dim">' + esc(amount(node)) + '</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  /** And what is consuming it, measured. */
  function statConsumers(data, focus) {
    if (focus === 'disk') {
      var vols = data.volumes;
      return '<div class="panel-block"><h4>Volumes</h4>' +
        '<p class="all-well">' + (vols ? vols.count + ' claims, ' + gigs(vols.claimed) + ' claimed' +
          (vols.pending ? ', ' + vols.pending + ' still waiting for a volume' : ', all bound') : 'none') + '</p>' +
        '<button class="btn" data-kind="persistentvolumeclaims">See them all</button></div>';
    }
    var busy = (data.busiest || {})[focus] || [];
    if (!busy.length) return '';
    var most = busy[0][focus] || 1;
    var format = focus === 'cpu' ? fromMillicores : gigs;
    return '<div class="panel-block"><h4>Using the most<span class="dim"> · right now</span></h4>' +
      busy.map(function (row) {
        return '<div class="meter" title="' + esc(row.namespace + '/' + row.name) + '">' +
          '<span class="meter-name">' + esc(row.name) + '</span>' +
          '<span class="meter-track wide"><i style="width:' + ((row[focus] / most) * 100).toFixed(1) + '%"></i></span>' +
          '<span class="meter-num">' + format(row[focus]) + '</span>' +
          '<span class="meter-num dim">' + esc(row.namespace) + '</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  /**
   * What to do about the failures that are not really failures.
   *
   * The three that everybody hits are an expired token, a cluster that is not
   * reachable from here, and kubectl not being installed at all — and none of
   * them are worth a red box on their own, because each has an obvious next
   * step that the message itself does not mention.
   */
  function advice(message) {
    var text = String(message || '');
    if (/Unauthorized|credentials|expired|no such host|refused|timeout|timed out|exec plugin|getting credentials/i.test(text)) {
      return '<div class="note">This looks like the cluster not letting us in rather than something being wrong with it. ' +
        'A token may have expired, or this context may need a VPN. Open the terminal button above and run ' +
        '<code>kubectl get ns</code> there — whatever it asks you for, ask it once and this panel works again.</div>';
    }
    if (/not installed|ENOENT/i.test(text)) {
      return '<div class="note">kubectl is not on the PATH this app can see. Install it, or add it to your shell profile ' +
        'and restart Smart Terminal.</div>';
    }
    return '';
  }

  /* ---------------------------------------------------------------------- *
   * The detail pane.
   * ---------------------------------------------------------------------- */
  /**
   * The lines between the columns, and dragging them.
   *
   * The navigation and the detail pane were fixed widths, which is fine until
   * the thing you are reading is a name that does not fit or a description that
   * wants the room. Both edges move now, and the middle takes what is left.
   *
   * Absolutely positioned rather than made grid children: a grid column of its
   * own would have to be threaded through both of the layouts below, and the
   * only thing a handle needs to know is where the edge it drags currently is.
   */
  function drawGrips() {
    var body = $('body');
    var nav = body.querySelector('nav');
    var aside = body.querySelector('aside');
    [].forEach.call(body.querySelectorAll('.grip'), function (old) { old.remove(); });
    if (!nav) return;

    var edges = [{ at: nav.getBoundingClientRect().width, which: 'nav' }];
    if (aside) edges.push({ at: body.getBoundingClientRect().width - aside.getBoundingClientRect().width, which: 'detail' });

    edges.forEach(function (edge) {
      var grip = document.createElement('div');
      grip.className = 'grip';
      grip.dataset.grip = edge.which;
      grip.style.left = edge.at + 'px';
      body.appendChild(grip);
    });
  }

  document.addEventListener('mousedown', function (event) {
    var grip = event.target.closest('.grip');
    if (!grip) return;
    event.preventDefault();
    grip.classList.add('is-held');

    var body = $('body');
    var which = grip.dataset.grip;
    var whole = body.getBoundingClientRect();

    var move = function (moved) {
      if (which === 'nav') {
        // Never so narrow that its own headings stop fitting, never past half.
        state.navWidth = Math.round(Math.max(120, Math.min(whole.width * 0.5, moved.clientX - whole.left)));
      } else {
        state.detailWidth = Math.round(Math.max(260, Math.min(whole.width - state.navWidth - 200, whole.right - moved.clientX)));
      }
      applyColumns();
      var edge = which === 'nav' ? state.navWidth : whole.width - state.detailWidth;
      grip.style.left = edge + 'px';
    };
    var up = function () {
      grip.classList.remove('is-held');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      drawGrips();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  function applyColumns() {
    var body = $('body');
    body.style.gridTemplateColumns = body.classList.contains('with-detail')
      ? state.navWidth + 'px 1fr ' + state.detailWidth + 'px'
      : state.navWidth + 'px 1fr';
  }

  function drawDetail(force) {
    /*
     * Never over somebody's typing. The detail pane is rebuilt wholesale, and a
     * refresh landing mid-edit would take the text out from under them — which
     * is the sort of thing that makes people stop trusting an editor.
     *
     * `force` is for the one redraw that is *asked for* while editing: pressing
     * Edit itself, which swaps the painted manifest for the textarea before
     * anything has been typed into it. Without the distinction the button would
     * be blocked by the guard that exists to protect what it has not written
     * yet.
     */
    if (state.editing && !force) return;
    var chosen = state.selected;
    $('body').className = 'body' + (chosen ? ' with-detail' : '');
    applyColumns();
    var existing = document.querySelector('aside');
    if (!chosen) { if (existing) existing.remove(); return; }

    var aside = existing || document.createElement('aside');
    if (!existing) $('body').appendChild(aside);

    /*
     * A release is asked different questions than an object is. Not "what does
     * it look like now" but "what changed, what was it configured with, and can
     * I put it back" — so it gets its own tabs rather than empty versions of
     * these.
     */
    var release = chosen.kind === 'Release';
    var tabs = release ? ['revisions', 'values', 'manifest', 'notes'] : ['overview', 'yaml', 'events'];
    /*
     * A workload is two questions a plain object is not: which pods is it
     * actually running, and what was it before this. Both have to be asked of
     * other objects — the pods it selects, the revisions it owns — which is why
     * a table of workloads cannot answer either, and why they are here.
     */
    if (!release && chosen.selector) tabs.splice(1, 0, 'pods');
    if (!release && chosen.ownsJobs) tabs.splice(1, 0, 'jobs');
    if (!release && chosen.revisioned) tabs.splice(chosen.selector ? 2 : 1, 0, 'rollout');
    if (release && ['revisions', 'values', 'manifest', 'notes'].indexOf(state.detail.tab) < 0) {
      state.detail.tab = 'revisions';
    }
    if (!release && tabs.indexOf(state.detail.tab) < 0) {
      state.detail.tab = 'overview';
    }

    aside.innerHTML =
      '<div class="detail-head">' +
        '<h3>' + esc(chosen.name) + '</h3>' +
        '<small>' +
          (release
            ? esc(chosen.chart + ' ' + chosen.chartVersion) + ' · revision ' + esc(chosen.revision)
            : esc(chosen.kind)) +
          (chosen.namespace ? ' · ' + esc(chosen.namespace) : '') + ' · ' + esc(chosen.age) + ' old</small>' +
        '<div class="detail-actions">' + actionsFor(chosen) + '</div>' +
        '<div class="ask">' +
          '<input id="question" placeholder="Ask Claude something about this" />' +
          '<button class="btn go" data-do="ask">Ask</button>' +
        '</div>' +
      '</div>' +
      '<div class="tabs">' + tabs.map(function (tab) {
        return '<button data-tab="' + tab + '" class="' + (state.detail.tab === tab ? 'on' : '') + '">' +
          (tab === 'yaml' ? 'YAML' : tab[0].toUpperCase() + tab.slice(1)) + '</button>';
      }).join('') +
        '<span class="spacer"></span>' +
        '<button class="btn" data-do="copy-detail" title="Copy what this tab is showing">Copy</button>' +
        (release && state.detail.tab === 'values'
          ? '<span class="spacer"></span><button class="btn' + (state.helmAll ? ' on' : '') +
            '" data-do="values-all" title="Every value the chart used, defaults included">All</button>'
          : '') +
      '</div>' +
      '<div class="detail-body" id="detail-body">' + detailBody(chosen) + '</div>';
  }

  function actionsFor(row) {
    var buttons = [];
    if (row.kind === 'Release') {
      return '<button class="btn" data-do="helm-diff" title="What this revision put in the cluster">Manifest</button>' +
        '<span class="gap"></span><button class="btn bad" data-do="helm-uninstall">Uninstall…</button>';
    }
    if (row.kind === 'Pod') {
      buttons.push('<button class="btn" data-do="logs">Logs</button>');
      buttons.push('<button class="btn" data-do="shell">Shell</button>');
    }
    if (row.scalable) buttons.push('<button class="btn" data-do="scale">Scale…</button>');
    if (row.restartable) buttons.push('<button class="btn" data-do="restart">Restart</button>');
    /*
     * The button that has no substitute. A Deployment halfway through replacing
     * its pods with an image that does not start is stopped by this and by
     * nothing else — scaling to zero would take down the half still serving.
     */
    if (row.pausable) {
      buttons.push('<button class="btn' + (row.paused ? ' on' : '') + '" data-do="pause" ' +
        'title="' + (row.paused ? 'Let the rollout carry on' : 'Hold the rollout where it is') + '">' +
        (row.paused ? 'Resume' : 'Pause') + '</button>');
    }
    if (row.triggerable) buttons.push('<button class="btn" data-do="trigger" title="Make a job from it now, off schedule">Run now</button>');
    if (row.suspendable) {
      buttons.push('<button class="btn' + (row.suspended ? ' on' : '') + '" data-do="suspend">' +
        (row.suspended ? 'Resume' : 'Suspend') + '</button>');
    }
    if ((row.forwardable || []).length) buttons.push('<button class="btn" data-do="forward">Forward…</button>');
    if (row.kind === 'Node') {
      buttons.push('<button class="btn" data-do="cordon">' + (row.schedulable ? 'Cordon' : 'Uncordon') + '</button>');
      buttons.push('<span class="gap"></span><button class="btn bad" data-do="drain">Drain…</button>');
    }
    // A gap between what reads and what removes, so the last button is not the
    // next one along from Restart.
    buttons.push('<span class="gap"></span><button class="btn bad" data-do="delete">Delete</button>');
    return buttons.join('');
  }

  /**
   * The pods a workload is actually running.
   *
   * Not a count — the pods themselves, with what is wrong with each. "3/5 ready"
   * tells you to go and look; this is the looking, and each row opens that pod
   * where its log and its shell are, which is where the answer was always going
   * to be.
   */
  function podsBody(row) {
    var pods = state.detailData.pods;
    if (!pods) return '<pre>reading…</pre>';
    if (!pods.length) return '<div class="dim">It is running no pods at all.</div>';
    var restarts = pods.reduce(function (sum, pod) { return sum + (Number(pod.restarts) || 0); }, 0);
    var unwell = pods.filter(function (pod) { return pod.health === 'bad'; }).length;
    return '<p class="all-well">' + pods.length + (pods.length === 1 ? ' pod' : ' pods') +
        (unwell ? ' · <span class="bad-text">' + unwell + ' unhealthy</span>' : ' · all healthy') +
        (restarts ? ' · ' + restarts + ' restarts between them' : '') + '</p>' +
      '<table><tbody>' + pods.map(function (pod) {
        return '<tr class="is-link" data-open="' + esc(pod.name) + '" data-open-kind="pods"' +
            ' data-open-namespace="' + esc(pod.namespace || '') + '">' +
          '<td><span class="dot ' + esc(pod.health) + '"></span></td>' +
          '<td class="grow">' + esc(pod.name) + '</td>' +
          '<td class="dim">' + esc(pod.status) + '</td>' +
          '<td class="dim">' + esc(pod.ready || '') + '</td>' +
          '<td class="' + (Number(pod.restarts) ? 'warn-text' : 'dim') + '">' +
            (Number(pod.restarts) ? esc(pod.restarts) + '×' : '') + '</td>' +
          '<td class="dim">' + esc(pod.node || '') + '</td>' +
          '<td class="dim">' + esc(pod.age) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /**
   * The runs a cron job has actually had.
   *
   * A schedule and a "last run 4h ago" say it fired; they do not say whether the
   * thing it fired worked, which is the only reason anybody opens a cron job.
   * Matched by owner uid rather than by the name the controller builds, because
   * two cron jobs in a namespace can produce names that only a uid tells apart.
   */
  function jobsBody(row) {
    var jobs = state.detailData.jobs;
    if (!jobs) return '<pre>reading…</pre>';
    if (!jobs.length) return '<div class="dim">It has not run yet — nothing it made is still around.</div>';
    var failed = jobs.filter(function (job) { return job.health === 'bad'; }).length;
    return '<p class="all-well">' + jobs.length + (jobs.length === 1 ? ' run kept' : ' runs kept') +
        (failed ? ' · <span class="bad-text">' + failed + ' failed</span>' : ' · none failed') + '</p>' +
      '<table><tbody>' + jobs.map(function (job) {
        return '<tr class="is-link" data-open="' + esc(job.name) + '" data-open-kind="jobs"' +
            ' data-open-namespace="' + esc(job.namespace || '') + '">' +
          '<td><span class="dot ' + esc(job.health) + '"></span></td>' +
          '<td class="grow">' + esc(job.name) + '</td>' +
          '<td class="dim">' + esc(job.status) + '</td>' +
          '<td class="dim">' + esc(job.duration || '') + '</td>' +
          '<td class="dim">' + esc(job.age) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /**
   * What this workload used to be, and the way back.
   *
   * `rollout history` prints a table whose one interesting column is almost
   * always empty, so this shows the revisions themselves: which is running, what
   * images each one ran, and how long ago it was made. The images are the part
   * that makes a rollback a decision rather than a guess — going back one
   * revision means going back to the tag named on that row.
   */
  function rolloutBody(row) {
    var got = state.detailData.rollout;
    if (!got) return '<pre>reading…</pre>';
    if (typeof got === 'string') return '<div class="dim">' + esc(got) + '</div>';
    if (!got.rows.length) return '<div class="dim">No revisions are kept for this one.</div>';
    return (row.paused ? '<p class="all-well warn-text">Its rollout is paused — nothing is replacing anything.</p>' : '') +
      '<table><tbody>' + got.rows.map(function (rev) {
        return '<tr>' +
          '<td class="dim">' + (rev.current ? '<b>' + rev.revision + '</b>' : rev.revision) + '</td>' +
          '<td class="grow"><div>' + esc(rev.images.join(', ') || rev.name) + '</div>' +
            (rev.cause ? '<div class="dim">' + esc(rev.cause) + '</div>' : '') + '</td>' +
          '<td class="dim">' + esc(rev.age) + '</td>' +
          '<td>' + (rev.current
            ? '<span class="dim">running</span>'
            : '<button class="btn" data-undo="' + rev.revision + '">Roll back</button>') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
  }


  /* ------------------------------------------------------------------ *
   * YAML, coloured.
   *
   * This is the app's own highlighter, transliterated. Not a second one: a
   * hand-rolled highlighter that is wrong about a block scalar is worse than
   * none, because it lies about the one thing YAML is genuinely hard to read
   * for, and this panel cannot reach the app's editor to borrow it — it is a
   * sandboxed frame in an origin of its own.
   *
   * So the rules are copied rather than reinvented, and a test compares the two
   * on real kubectl output line by line. If they ever drift, that test fails
   * rather than somebody noticing a wrong colour six months later.
   * ------------------------------------------------------------------ */

  var BLOCK_OPENER = /:\s*[|>][-+]?\d*\s*(#.*)?$/;

  /** Where the colon that separates a key from a value is, or -1. */
  function keyColon(text) {
    var quote = null;
    for (var i = 0; i < text.length; i += 1) {
      var ch = text[i];
      if (quote) {
        if (ch === '\\') { i += 1; continue; }
        if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'") { quote = ch; continue; }
      // A comment before any colon means the line was never a pair.
      if (ch === '#' && (i === 0 || /\s/.test(text[i - 1]))) return -1;
      if (ch === ':' && (i + 1 === text.length || /\s/.test(text[i + 1]))) return i;
    }
    return -1;
  }

  function splitTrailingComment(value) {
    var quote = null;
    for (var i = 0; i < value.length; i += 1) {
      var ch = value[i];
      if (quote) { if (ch === quote) quote = null; continue; }
      if (ch === '"' || ch === "'") quote = ch;
      else if (ch === '#' && (i === 0 || /\s/.test(value[i - 1]))) return [value.slice(0, i), value.slice(i + 1)];
    }
    return [value];
  }

  /** What a plain value plainly is — by its shape, not by what it means. */
  function scalarClass(body) {
    if (/^(true|false|yes|no|on|off|null|~)$/i.test(body)) return 'y-const';
    if (/^-?\d[\d_]*(\.\d+)?([eE][-+]?\d+)?$/.test(body)) return 'y-num';
    if (/^[&*]/.test(body)) return 'y-anchor';
    if (/^[|>]/.test(body)) return 'y-block';
    return 'y-str';
  }

  /** `[a, b]` and `{k: v}` — the one place a line holds more than one value. */
  function flowTokens(body) {
    var spans = [];
    var start = 0;
    var token = '';
    var quote = null;

    var flush = function (end) {
      var trimmed = token.trim();
      if (trimmed) {
        var from = start + token.indexOf(trimmed);
        var at = keyColon(trimmed);
        if (at > 0) {
          spans.push({ from: from, to: from + trimmed.slice(0, at).replace(/\s+$/, '').length, cls: 'y-key' });
          spans.push({ from: from + at, to: from + at + 1, cls: 'y-punct' });
          var value = trimmed.slice(at + 1);
          var lead = value.length - value.replace(/^\s+/, '').length;
          var rest = value.trim();
          if (rest) spans.push({ from: from + at + 1 + lead, to: from + trimmed.length, cls: scalarClass(rest) });
        } else {
          spans.push({ from: from, to: from + trimmed.length, cls: scalarClass(trimmed) });
        }
      }
      token = '';
      start = end;
    };

    for (var i = 0; i < body.length; i += 1) {
      var ch = body[i];
      if (quote) {
        token += ch;
        if (ch === '\\') { token += body[i + 1] || ''; i += 1; }
        else if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'") { quote = ch; token += ch; continue; }
      if ('[]{},'.indexOf(ch) >= 0) {
        flush(i);
        spans.push({ from: i, to: i + 1, cls: 'y-punct' });
        start = i + 1;
        continue;
      }
      if (!token) start = i;
      token += ch;
    }
    flush(body.length);
    return spans;
  }

  function valueSpans(body, offset) {
    if (!body) return [];
    if (body.indexOf('#') === 0) return [{ from: offset, to: offset + body.length, cls: 'y-comment' }];

    var split = splitTrailingComment(body);
    var head = split[0];
    var spans = split.length === 1 ? [] : [{ from: offset + head.length, to: offset + body.length, cls: 'y-comment' }];

    var lead = head.length - head.replace(/^\s+/, '').length;
    var value = head.trim();
    var from = offset + lead;
    if (!value) return spans;

    // A tag says what the value *is* — `!Ref`, `!!str` — and is not part of it.
    var tagged = /^(!!?[^\s]*)\s*(.*)$/.exec(value);
    if (tagged) {
      spans.unshift({ from: from, to: from + tagged[1].length, cls: 'y-tag' });
      if (tagged[2]) {
        var after = value.indexOf(tagged[2], tagged[1].length);
        spans.push({ from: from + after, to: from + after + tagged[2].length, cls: scalarClass(tagged[2]) });
      }
      return spans;
    }

    if (/^[[{]/.test(value)) {
      return flowTokens(value).map(function (span) {
        return { from: from + span.from, to: from + span.to, cls: span.cls };
      }).concat(spans);
    }
    return [{ from: from, to: from + value.length, cls: scalarClass(value) }].concat(spans);
  }

  /** The coloured stretches of one line, given whether a block scalar is open. */
  function yamlSpans(text, inBlock) {
    if (inBlock || !text.trim()) return [];
    var trimmed = text.trim();
    var indent = text.length - text.replace(/^\s+/, '').length;
    var end = text.replace(/\s+$/, '').length;

    if (trimmed.indexOf('#') === 0) return [{ from: indent, to: end, cls: 'y-comment' }];
    if (trimmed === '---' || trimmed === '...' || trimmed.indexOf('--- ') === 0 || trimmed.indexOf('%') === 0) {
      return [{ from: indent, to: end, cls: 'y-doc' }];
    }

    var isItem = trimmed.indexOf('- ') === 0 || trimmed === '-';
    var inner = isItem ? trimmed.slice(1).trim() : trimmed;
    // A line that is neither an item nor a pair is raw, and is left alone.
    if (!isItem && keyColon(inner) <= 0) return [];

    var spans = [];
    var at = indent;
    if (isItem) {
      spans.push({ from: at, to: at + 1, cls: 'y-dash' });
      at += 1;
      while (at < text.length && /\s/.test(text[at])) at += 1;
    }

    var rest = text.slice(at, end);
    var colon = keyColon(rest);
    if (colon > 0) {
      spans.push({ from: at, to: at + rest.slice(0, colon).replace(/\s+$/, '').length, cls: 'y-key' });
      spans.push({ from: at + colon, to: at + colon + 1, cls: 'y-colon' });
      at += colon + 1;
      while (at < end && /\s/.test(text[at])) at += 1;
    }
    return spans.concat(valueSpans(text.slice(at, end), at));
  }

  /** Whether this line opens a block scalar, so the next lines are left plain. */
  function opensYamlBlock(text) {
    var trimmed = text.trim();
    var inner = trimmed.indexOf('- ') === 0 || trimmed === '-' ? trimmed.slice(1).trim() : trimmed;
    return keyColon(inner) > 0 && BLOCK_OPENER.test(inner);
  }

  /**
   * A whole YAML document as coloured HTML.
   *
   * Block scalars are the reason this is not a per-line map: everything inside
   * one is text, however much it looks like YAML, and a highlighter that colours
   * an embedded config file as if it were the manifest is exactly the lie worth
   * avoiding. A block ends at the first line indented no further than the key
   * that opened it.
   */
  function yamlHtml(text) {
    var lines = String(text == null ? '' : text).split('\n');
    var blockAt = -1;
    return lines.map(function (line) {
      var indent = line.length - line.replace(/^\s+/, '').length;
      if (blockAt >= 0 && (!line.trim() || indent > blockAt)) return colour(line, yamlSpans(line, true));
      blockAt = -1;
      var spans = yamlSpans(line, false);
      if (opensYamlBlock(line)) blockAt = indent;
      return colour(line, spans);
    }).join('\n');
  }

  /** One line, with its spans painted and everything between them left plain. */
  function colour(line, spans) {
    if (!spans.length) return esc(line);
    var ordered = spans.slice().sort(function (a, b) { return a.from - b.from; });
    var out = '';
    var at = 0;
    for (var i = 0; i < ordered.length; i += 1) {
      var span = ordered[i];
      if (span.from < at || span.to <= span.from) continue;
      out += esc(line.slice(at, span.from));
      out += '<span class="' + span.cls + '">' + esc(line.slice(span.from, span.to)) + '</span>';
      at = span.to;
    }
    return out + esc(line.slice(at));
  }


  /**
   * What this object is, said in the order somebody wants it.
   *
   * The old one put a definition list, then labels, then the whole of `describe`
   * in one undifferentiated block of grey text — which is everything the object
   * knows, in the order kubectl happens to print it, and finding the one line
   * that matters in it is the work. This is the same material in named blocks,
   * each of which can be taken on its own: what it is, what is running in it,
   * what it is labelled, and then the long text underneath for when the answer
   * is not in the short version.
   */
  function overviewBody(row) {
    return chartsFor(row) + factsBlock(row) + containersBlock(row) + labelsBlock(row) + describeBlock();
  }

  /** A named section with its own Copy — nobody wants the whole drawer. */
  function block(title, inner, extra) {
    return '<section class="block"><h4 class="block-head">' + esc(title) +
      '<span class="spacer"></span>' + (extra || '') +
      '<button class="btn" data-copy-block="' + esc(title) + '">Copy</button></h4>' + inner + '</section>';
  }

  function factsBlock(row) {
    var skip = ['uid', 'labels', 'containers', 'forwardable', 'health', 'scalable', 'restartable', 'createdAt',
      'kind', 'selector', 'revisioned', 'pausable', 'suspendable', 'triggerable', 'ownsJobs', 'owner'];
    var facts = Object.keys(row).filter(function (key) {
      // The flags that say what the buttons above may do are not facts about the
      // object; they are already on screen, as buttons.
      return skip.indexOf(key) < 0 && row[key] !== '' && row[key] != null && typeof row[key] !== 'object';
    });
    if (!facts.length) return '';
    return block('Summary', '<dl class="facts">' + facts.map(function (key) {
      var value = String(row[key]);
      var tone = key === 'status' ? ' class="' + esc(row.health || '') + '-text"' : '';
      return '<dt>' + esc(HEADINGS[key] || key) + '</dt><dd' + tone + '>' + esc(value) + '</dd>';
    }).join('') + '</dl>');
  }

  /**
   * The containers, which is what a pod actually is.
   *
   * A pod's own row says "2/3 ready" and stops there; which of the three, and
   * what it is running, was only ever in the describe text further down. Each
   * one names its image and offers its log directly — the log of the container
   * that is failing is the answer nine times in ten.
   */
  function containersBlock(row) {
    var containers = row.containers || [];
    if (!containers.length) return '';
    var isPod = row.kind === 'Pod';
    return block('Containers', '<table class="containers"><tbody>' + containers.map(function (container) {
      var name = container.name || String(container);
      return '<tr>' +
        '<td class="grow">' + esc(name) +
          (container.init ? '<span class="dim"> · init</span>' : '') + '</td>' +
        '<td class="dim">' + esc(container.image || '') + '</td>' +
        (isPod ? '<td><button class="btn" data-container-log="' + esc(name) + '">Log</button></td>' : '') +
        '</tr>';
    }).join('') + '</tbody></table>');
  }

  function labelsBlock(row) {
    var keys = Object.keys(row.labels || {});
    if (!keys.length) return '';
    return block('Labels', '<div class="chips">' + keys.map(function (key) {
      return '<span class="chip"><b>' + esc(key) + '</b><i>=</i>' + esc(row.labels[key]) + '</span>';
    }).join('') + '</div>');
  }

  function describeBlock() {
    var loaded = state.detailData.describe;
    return block('Described by the cluster',
      '<pre class="describe">' + (loaded == null ? 'reading…' : describeHtml(loaded)) + '</pre>');
  }

  /**
   * `kubectl describe`, with its structure showing.
   *
   * It is not YAML and colouring it as YAML would be a lie — it is a report with
   * `Key:  value` lines, indented sections, and an events table at the bottom.
   * Only three things are marked: the field names, so the eye can run down the
   * left; the section headings; and the word Warning, because that is the line
   * somebody opened this to find.
   */
  function describeHtml(text) {
    return String(text || '').split('\n').map(function (line) {
      if (/^\s*Warning\b/.test(line)) return '<span class="warn-text">' + esc(line) + '</span>';
      if (/^[A-Z][^:]*:\s*$/.test(line)) return '<span class="y-doc">' + esc(line) + '</span>';
      var pair = /^(\s*)([A-Za-z][\w .\/-]*?):(\s+)(.*)$/.exec(line);
      if (!pair) return esc(line);
      return esc(pair[1]) + '<span class="y-key">' + esc(pair[2]) + '</span>' +
        '<span class="y-colon">:</span>' + esc(pair[3]) + esc(pair[4]);
    }).join('\n');
  }


  function detailBody(row) {
    var tab = state.detail.tab;
    if (row.kind === 'Release') return releaseBody(row, tab);
    if (tab === 'overview') return overviewBody(row);
    if (tab === 'yaml') {
      if (state.detailData.yaml == null) return '<pre>reading…</pre>';
      var draft = draftFor(row);
      /*
       * Editable, and plainly so. No syntax colouring: this frame cannot reach
       * the app's editor, and a hand-rolled highlighter that is wrong about a
       * block scalar is worse than none — it would be lying about the one thing
       * YAML is hard to read for.
       */
      var body = draft == null ? state.detailData.yaml : draft;
      // Typing that survived a trip to Events comes back with the editor open;
      // painting it read-only would look like the edit had been thrown away.
      if (draft != null) state.editingYaml = true;
      /*
       * Read coloured, edited plain, and the button says which you are in.
       *
       * A textarea cannot hold coloured text, and the alternatives — a
       * contenteditable pretending to be one, or a whole editor — are how a
       * panel that shows a manifest turns into a project that maintains an
       * editor. So the manifest is painted until somebody says they want to
       * change it, which is the state it is in almost all of the time.
       */
      return '<div class="yaml-tools">' +
        (state.editingYaml
          ? '<button class="btn" data-do="yaml-apply">Apply</button>' +
            '<button class="btn" data-do="yaml-check" title="Ask the server whether this is legal, and change nothing">Dry run</button>' +
            '<button class="btn" data-do="yaml-revert">Revert</button>'
          : '<button class="btn" data-do="yaml-edit">Edit</button>') +
        '<span class="dim" id="yaml-state">' + (draft == null ? 'as it is in the cluster' : 'edited') + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn" data-do="copy-detail" title="Copy the whole manifest">Copy</button>' +
        '</div>' +
        (state.editingYaml
          ? '<textarea id="yaml-edit" spellcheck="false">' + esc(body) + '</textarea>'
          : '<pre class="yaml">' + yamlHtml(body) + '</pre>');
    }
    if (tab === 'pods') return podsBody(row);
    if (tab === 'jobs') return jobsBody(row);
    if (tab === 'rollout') return rolloutBody(row);
    if (tab === 'events') {
      var events = state.detailData.events;
      if (!events) return '<pre>reading…</pre>';
      if (!events.length) return '<div class="dim">Nothing has been said about this one.</div>';
      return '<table><tbody>' + events.map(function (event) {
        return '<tr><td class="dim">' + esc(event.age) + '</td>' +
          '<td class="' + (event.type === 'Warning' ? 'warn-text' : 'dim') + '">' + esc(event.status) + '</td>' +
          '<td class="grow dim">' + esc(event.message) + '</td></tr>';
      }).join('') + '</tbody></table>';
    }
    return '';
  }

  /**
   * A release's history, its values, and what it actually installed.
   *
   * The revisions are the point. Every row is a state this release has been in,
   * and the one thing you want at three in the morning is to put it back into
   * one of them — so every row that is not the current one carries the button
   * that does it, rather than making you find a menu.
   */
  function releaseBody(row, tab) {
    if (tab === 'revisions') {
      var rows = state.detailData.history;
      if (!rows) return '<pre>reading…</pre>';
      if (!rows.length) return '<div class="dim">No history. Helm keeps a limited number of revisions.</div>';
      return '<table><tbody>' + rows.map(function (entry) {
        return '<tr>' +
          '<td class="name"><span class="dot ' + esc(entry.health) + '"></span>' + entry.revision + '</td>' +
          '<td class="dim">' + esc(entry.age) + '</td>' +
          '<td class="dim">' + esc(entry.chart) + '</td>' +
          '<td class="grow dim">' + esc(entry.description) + '</td>' +
          '<td>' + (entry.current
            ? '<span class="dim">now</span>'
            : '<button class="btn" data-rollback="' + entry.revision + '">Roll back</button>') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
    }
    if (tab === 'values') {
      var yaml = state.detailData.values;
      if (yaml == null) return '<pre>reading…</pre>';
      return '<pre class="wrapless">' + esc(yaml.trim() || 'This release overrode nothing; it is running the chart\u2019s defaults.') + '</pre>';
    }
    if (tab === 'manifest') {
      return '<pre class="wrapless">' + esc(state.detailData.helmManifest == null ? 'reading…' : state.detailData.helmManifest) + '</pre>';
    }
    return '<pre>' + esc(state.detailData.notes == null ? 'reading…' : (state.detailData.notes.trim() || 'This chart left no notes.')) + '</pre>';
  }

  /**
   * A workload's own rollback, and a click on one of its pods.
   *
   * Separate from Helm's `data-rollback` on purpose: rolling a Deployment back
   * is `rollout undo`, which is a different tool doing a different thing to a
   * different object, and one handler pretending they are the same is how the
   * wrong one gets called on the wrong row.
   */
  document.addEventListener('click', function (event) {
    var undo = event.target.closest('[data-undo]');
    if (undo && state.selected) {
      var subject = state.selected;
      var to = Number(undo.dataset.undo);
      call('kube.rollback', {
        context: state.context, kind: subject.kind, namespace: subject.namespace, name: subject.name, revision: to,
      }).then(function (result) {
        say(result.text || ('Rolled ' + subject.name + ' back to revision ' + to + '.'));
        state.detailData.rollout = null;
        drawDetail();
        loadDetail();
        setTimeout(function () { load(true); }, 1200);
      }).catch(function (error) { say(String(error.message || error), true); });
      return;
    }

    /*
     * Copy one block rather than the drawer.
     *
     * The drawer's Copy takes everything, which is right when you want the lot
     * and useless when you want the six labels. Each block offers its own, and
     * takes the text as it reads on screen rather than a second rendering of the
     * same data that could disagree with the first.
     */
    var copy = event.target.closest('[data-copy-block]');
    if (copy) {
      var section = copy.closest('.block');
      var content = section && section.querySelector(':scope > *:not(.block-head)');
      if (!content) return;
      var text = readable(content);
      host.emit('copy', { text: text });
      say('Copied ' + copy.dataset.copyBlock.toLowerCase() + '.');
      return;
    }

    var log = event.target.closest('[data-container-log]');
    if (log && state.selected) { openLog(state.selected, log.dataset.containerLog); return; }

    var open = event.target.closest('[data-open]');
    if (open) {
      // Open it where its own log, shell and events are, which is the whole
      // reason for having clicked it.
      state.namespace = open.dataset.openNamespace || state.namespace;
      var pick = document.getElementById('namespace');
      if (pick) pick.value = state.namespace;
      show({ type: 'kind', name: open.dataset.openKind }, { wanted: open.dataset.open });
      return;
    }

    var back = event.target.closest('[data-rollback]');
    if (back && state.selected) {
      var to = Number(back.dataset.rollback);
      var release = state.selected;
      call('helm.rollback', { context: state.context, namespace: release.namespace, name: release.name, revision: to })
        .then(function (result) {
          say(result.text || ('Rolled ' + release.name + ' back to revision ' + to + '.'));
          state.detailData.history = null;
          drawDetail();
          loadDetail();
          setTimeout(function () { load(true); }, 1200);
        })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }
    var tab = event.target.closest('[data-tab]');
    if (tab) {
      // Whatever was typed stays typed; it is kept against the object, so it is
      // still here on the way back.
      state.editing = false;
      state.detail.tab = tab.dataset.tab;
      drawDetail();
      loadDetail();
      return;
    }
    var action = event.target.closest('[data-do]');
    if (action) act(action.dataset.do);
  });


  function loadDetail() {
    var row = state.selected;
    if (!row) return;
    if (row.kind === 'Release') return loadReleaseDetail(row);
    var at = { context: state.context, kind: row.kind, name: row.name };
    if (row.namespace) at.namespace = row.namespace;

    if (state.detail.tab === 'overview') loadCharts(row);
    if (state.detail.tab === 'overview' && state.detailData.describe == null) {
      call('kube.describe', at).then(function (result) {
        if (state.selected === row) { state.detailData.describe = result.text || ''; drawDetail(); }
      }).catch(function (error) {
        if (state.selected === row) { state.detailData.describe = String(error.message || error); drawDetail(); }
      });
    }
    if (state.detail.tab === 'yaml' && state.detailData.yaml == null) {
      call('kube.manifest', at).then(function (result) {
        if (state.selected === row) { state.detailData.yaml = result.yaml || ''; drawDetail(); }
      }).catch(function (error) {
        if (state.selected === row) { state.detailData.yaml = String(error.message || error); drawDetail(); }
      });
    }
    if (state.detail.tab === 'pods' && !state.detailData.pods) {
      // The same `get pods --selector` a person would type, with the selector
      // the workload itself names.
      call('kube.list', {
        context: state.context, kind: 'pods', namespace: row.namespace, selector: row.selector,
      }).then(function (result) {
        if (state.selected === row) { state.detailData.pods = result.rows || []; drawDetail(); }
      }).catch(function () {
        if (state.selected === row) { state.detailData.pods = []; drawDetail(); }
      });
    }
    if (state.detail.tab === 'jobs' && !state.detailData.jobs) {
      call('kube.list', { context: state.context, kind: 'jobs', namespace: row.namespace })
        .then(function (result) {
          if (state.selected !== row) return;
          state.detailData.jobs = (result.rows || []).filter(function (job) { return job.owner === row.uid; });
          drawDetail();
        })
        .catch(function () { if (state.selected === row) { state.detailData.jobs = []; drawDetail(); } });
    }
    if (state.detail.tab === 'rollout' && !state.detailData.rollout) {
      call('kube.history', at).then(function (result) {
        if (state.selected === row) { state.detailData.rollout = { rows: result.rows || [], current: result.current }; drawDetail(); }
      }).catch(function (error) {
        if (state.selected === row) { state.detailData.rollout = String(error.message || error); drawDetail(); }
      });
    }
    if (state.detail.tab === 'events' && !state.detailData.events) {
      call('kube.events', at).then(function (result) {
        if (state.selected === row) { state.detailData.events = result.rows || []; drawDetail(); }
      }).catch(function () {
        if (state.selected === row) { state.detailData.events = []; drawDetail(); }
      });
    }
  }

  /** The four questions a release answers, each fetched the first time it is asked. */
  function loadReleaseDetail(row) {
    var at = { context: state.context, namespace: row.namespace, name: row.name };
    var keep = function (key, value) {
      if (state.selected !== row) return;
      state.detailData[key] = value;
      drawDetail();
    };
    var failed = function (key) {
      return function (error) { keep(key, String(error.message || error)); };
    };

    if (state.detail.tab === 'revisions' && !state.detailData.history) {
      call('helm.history', at).then(function (r) { keep('history', r.rows || []); }).catch(function (error) {
        keep('history', []);
        say(String(error.message || error), true);
      });
    }
    if (state.detail.tab === 'values' && state.detailData.values == null) {
      call('helm.values', assign({ all: Boolean(state.helmAll) }, at))
        .then(function (r) { keep('values', r.yaml || ''); })
        .catch(failed('values'));
    }
    if (state.detail.tab === 'manifest' && state.detailData.helmManifest == null) {
      call('helm.manifest', at).then(function (r) { keep('helmManifest', r.yaml || ''); }).catch(failed('helmManifest'));
    }
    if (state.detail.tab === 'notes' && state.detailData.notes == null) {
      call('helm.notes', at).then(function (r) { keep('notes', r.text || ''); }).catch(failed('notes'));
    }
  }

  /* ---------------------------------------------------------------------- *
   * Logs, at the bottom, as many as you like.
   *
   * A tab per log rather than one viewer, because the question that actually
   * gets asked is comparative — this pod restarted and that one did not, and
   * both logs have to be on screen to see why. Each tab owns its own stream, so
   * two can be followed at once and closing one does not touch the other.
   * ---------------------------------------------------------------------- */
  /**
   * How many lines a log keeps.
   *
   * Two thousand rather than five, and the reason is measured: appending one
   * line to a `<pre>` costs what laying out the whole `<pre>` costs, which is
   * 1.8ms at a thousand lines, 3.5ms at two thousand and 13ms at five. A pod
   * that talks ten times a second turns that last one into an eighth of a core
   * spent re-laying out text nobody is reading. Two thousand lines is far more
   * scrollback than a log viewer beside a table is for, and Copy takes what is
   * there whatever the number.
   */
  var LOG_CAP = 2000;

  function openLog(row, container) {
    for (var i = 0; i < state.logs.length; i += 1) {
      var open = state.logs[i];
      if (open.name === row.name && open.namespace === row.namespace && open.context === state.context) {
        state.logAt = i;
        state.dockOpen = true;
        // Already open, but on another container — this asked for a particular one.
        if (container && open.container !== container) {
          open.container = container;
          open.lines = [];
          open.drawn = 0;
          drawDock();
          readLog(open, false);
          return;
        }
        drawDock();
        return;
      }
    }
    var containers = (row.containers || []).filter(function (c) { return !c.init; });
    state.logs.push({
      id: null, name: row.name, namespace: row.namespace, context: state.context,
      containers: row.containers || [], container: container || (containers[0] || row.containers[0] || {}).name || null,
      lines: [], pending: '', drawn: 0, following: false, wrap: true, search: '', loading: false,
    });
    state.logAt = state.logs.length - 1;
    state.dockOpen = true;
    drawDock();
    readLog(state.logs[state.logAt], false);
  }

  function currentLog() { return state.logs[state.logAt] || null; }

  /**
   * A dock tab for something that is not a log but reads like one.
   *
   * A drain prints a line per pod as it evicts it and then sits there when a
   * disruption budget will not let the last one go — which is exactly the shape
   * the log dock is already for.
   */
  function openStreamTab(title, id) {
    state.logs.push({
      id: id, name: title, namespace: '', context: state.context, oneOff: true,
      containers: [], container: null,
      lines: [], pending: '', drawn: 0, following: true, wrap: true, search: '', loading: false,
    });
    state.logAt = state.logs.length - 1;
    state.dockOpen = true;
    drawDock();
  }

  function closeLog(at) {
    var log = state.logs[at];
    if (!log) return;
    if (log.id) call('kube.stopFollow', { id: log.id }).catch(function () {});
    state.logs.splice(at, 1);
    state.logAt = Math.max(0, Math.min(state.logAt, state.logs.length - 1));
    drawDock();
  }

  function readLog(log, previous) {
    log.showingPrevious = Boolean(previous);
    log.loading = true;
    log.following = false;
    if (log.id) { call('kube.stopFollow', { id: log.id }).catch(function () {}); log.id = null; }
    drawDock();
    call('kube.logs', {
      context: log.context, namespace: log.namespace, pod: log.name,
      container: log.container || undefined, tail: 1000, previous: previous || false,
    }).then(function (result) {
      log.loading = false;
      var text = String(result.text || '');
      log.lines = text ? text.split('\n').map(function (line) { return { text: line }; }) : [];
      log.pending = '';
      if (previous && !text.trim()) say('That container has no previous run to show.');
      drawDock(true);
    }).catch(function (error) {
      log.loading = false;
      log.lines = [{ text: String(error.message || error), err: true }];
      drawDock();
    });
  }

  function followLog(log) {
    if (log.following) {
      if (log.id) call('kube.stopFollow', { id: log.id }).catch(function () {});
      log.id = null;
      log.following = false;
      drawDock();
      return;
    }
    log.following = true;
    log.showingPrevious = false;
    log.lines = [];
    log.pending = '';
    drawDock();
    call('kube.follow', {
      context: log.context, namespace: log.namespace, pod: log.name,
      container: log.container || undefined, tail: 200,
    }).then(function (result) { log.id = result.id; })
      .catch(function (error) {
        log.following = false;
        say(String(error.message || error), true);
        drawDock();
      });
  }

  function shownLines(log) {
    if (!log.search) return log.lines;
    var term = log.search.toLowerCase();
    return log.lines.filter(function (line) { return line.text.toLowerCase().indexOf(term) >= 0; });
  }

  /** One line of a log, as it appears. */
  function lineHtml(line, term) {
    return '<span class="log-line' + (line.err ? ' err' : '') + '">' + markUp(line.text, term) + '</span>';
  }

  /** The search term, marked where it was found. Everything else is escaped first. */
  function markUp(text, term) {
    var safe = esc(text);
    if (!term) return safe;
    var needle = esc(term);
    var out = '';
    var rest = safe;
    var at = rest.toLowerCase().indexOf(needle.toLowerCase());
    while (at >= 0) {
      out += rest.slice(0, at) + '<span class="hit">' + rest.slice(at, at + needle.length) + '</span>';
      rest = rest.slice(at + needle.length);
      at = rest.toLowerCase().indexOf(needle.toLowerCase());
    }
    return out + rest;
  }

  function drawDock(toBottom) {
    var slot = document.getElementById('dock-slot');
    if (!state.logs.length) {
      slot.innerHTML = '';
      document.getElementById('app').classList.remove('dock-full');
      return;
    }

    var log = currentLog();
    var tabs = state.logs.map(function (entry, at) {
      return '<span class="dock-tab' + (at === state.logAt ? ' on' : '') + '" data-log="' + at + '">' +
        '<span class="dot ' + (entry.following ? 'ok' : 'idle') + '"></span>' +
        '<span class="what" title="' + esc(entry.namespace + '/' + entry.name) + '">' + esc(entry.name) + '</span>' +
        '<button class="x" data-close="' + at + '">✕</button></span>';
    }).join('');

    // A drain shares the dock with the logs because it reads like one, but it is
    // not a pod: Follow and Previous would call `kubectl logs` on a pod named
    // "drain ip-10-0-1-2", which is nothing.
    var isLog = log.namespace !== null && log.namespace !== undefined && !log.oneOff;
    var containers = (log.containers || []).length > 1
      ? '<select id="log-container">' + log.containers.map(function (container) {
          return '<option value="' + esc(container.name) + '"' + (container.name === log.container ? ' selected' : '') +
            '>' + esc(container.name) + (container.init ? ' (init)' : '') + '</option>';
        }).join('') + '</select>'
      : '';

    var shown = shownLines(log);
    var count = log.search ? shown.length + ' of ' + log.lines.length : '';

    var tools = (isLog ? containers : '') +
      '<input id="log-search" placeholder="Search this log" value="' + esc(log.search) + '" />' +
      (count ? '<span class="dim" id="log-count">' + esc(count) + '</span>' : '') +
      (isLog
        ? '<button class="btn' + (log.following ? ' on' : '') + '" data-do="follow">' +
          (log.following ? 'Following' : 'Follow') + '</button>' +
          '<button class="btn" data-do="previous" title="The log of the run that stopped">Previous</button>'
        : '') +
      '<button class="btn' + (log.wrap ? ' on' : '') + '" data-do="wrap">Wrap</button>' +
      '<button class="btn" data-do="copy-log">Copy</button>' +
      '<button class="btn" data-do="save-log" title="Save this log to a file">Download</button>' +
      (isLog ? '<button class="btn" data-do="ask-log" title="Open a Claude session about this pod">Ask Claude</button>' : '') +
      '<button class="btn' + (state.dockFull ? ' on' : '') + '" data-do="dock-full" title="' +
        (state.dockFull ? 'Give the table its room back' : 'Fit the log to the window') + '">' +
        (state.dockFull ? '⤡' : '⤢') + '</button>' +
      '<button class="btn" data-do="dock" title="' + (state.dockOpen ? 'Put the log away' : 'Bring the log back') +
        '">' + (state.dockOpen ? '▾' : '▴') + '</button>';

    var body = log.loading
      ? '<div class="dim">reading…</div>'
      : !shown.length
        ? '<div class="dim">' + (log.search ? 'Nothing in this log matches.' : 'Nothing in the log.') + '</div>'
        : '<pre id="log-lines" class="' + (log.wrap ? '' : 'wrapless') + '">' +
          shown.map(function (line) { return lineHtml(line, log.search); }).join('\n') + '</pre>';

    // Whatever else happens below, this is what the DOM will hold.
    log.drawn = log.loading ? 0 : log.lines.length;

    // Read before the redraw, because the redraw is what destroys it.
    var old = document.getElementById('dock-body');
    var wasAt = old ? old.scrollTop : 0;
    var wasAtBottom = old ? old.scrollHeight - old.scrollTop - old.clientHeight < 40 : true;

    /*
     * Full height is the grid's business, not this element's: the row above
     * gives up its space and this one takes it. Which is why the class goes on
     * the app and not only on the dock.
     */
    var full = state.dockOpen && state.dockFull;
    document.getElementById('app').classList.toggle('dock-full', full);

    slot.innerHTML = '<div class="dock' + (full ? ' is-full' : '') + '" style="' +
      (state.dockOpen && !full ? 'height:' + state.dock + 'px' : '') + '">' +
      '<div class="dock-grip" id="dock-grip"></div>' +
      '<div class="dock-tabs">' + tabs + '<span class="dock-tools">' + tools + '</span></div>' +
      (state.dockOpen ? '<div class="dock-body" id="dock-body">' + body + '</div>' : '') +
      '</div>';

    /*
     * Where the reader was, kept.
     *
     * A followed log redraws whenever anything else does — a search, a wrap, the
     * table refreshing underneath — and jumping to the bottom every time is what
     * makes a log impossible to read: you scroll up to the line that matters and
     * it throws you back down a second later. So the tail is only followed when
     * the reader was already at it. Scrolled up, they stay where they were.
     */
    if (state.dockOpen) {
      var pane = document.getElementById('dock-body');
      if (pane) pane.scrollTop = toBottom || (log.following && wasAtBottom) ? pane.scrollHeight : wasAt;
    }
  }

  /**
   * A log that is being followed, added to rather than drawn again.
   *
   * Redrawing is what a viewer does when the thing being viewed changed; a line
   * arriving has not changed anything, it has been added. The difference is not
   * academic: rebuilding five thousand lines takes about seventy milliseconds,
   * and a chatty pod sends ten chunks a second — which is more time than there
   * is. Appending costs what the one line deserves.
   *
   * `drawn` is how many of the log's lines are in the DOM already. Returns
   * false when there is nothing to append to, and the caller draws properly.
   */
  var pendingDraw = 0;

  function appendLines(log) {
    var pre = document.getElementById('log-lines');
    if (!pre || !state.dockOpen || state.logs[state.logAt] !== log) return false;
    if ((log.drawn || 0) >= log.lines.length) return true;

    var added = log.lines.slice(log.drawn || 0);
    log.drawn = log.lines.length;
    if (log.search) {
      var term = log.search.toLowerCase();
      added = added.filter(function (line) { return line.text.toLowerCase().indexOf(term) >= 0; });
    }

    var pane = document.getElementById('dock-body');
    // Whether to follow the tail is decided *before* adding to it.
    var atBottom = pane ? pane.scrollHeight - pane.scrollTop - pane.clientHeight < 40 : true;

    if (added.length) {
      var html = added.map(function (line) { return lineHtml(line, log.search); }).join('\n');
      pre.insertAdjacentHTML('beforeend', (pre.childNodes.length ? '\n' : '') + html);
      // The cap, kept in the DOM as well as in the array.
      var over = pre.childElementCount - LOG_CAP;
      for (var i = 0; i < over; i += 1) if (pre.firstChild) pre.removeChild(pre.firstChild);
    }

    if (log.search) {
      var count = document.getElementById('log-count');
      if (count) count.textContent = shownLines(log).length + ' of ' + log.lines.length;
    }
    if (atBottom && pane) pane.scrollTop = pane.scrollHeight;
    return true;
  }

  document.addEventListener('click', function (event) {
    var close = event.target.closest('[data-close]');
    if (close) { closeLog(Number(close.dataset.close)); return; }
    var tab = event.target.closest('[data-log]');
    if (tab) { state.logAt = Number(tab.dataset.log); drawDock(true); }
  });

  document.addEventListener('input', function (event) {
    if (event.target.id === 'yaml-edit') {
      var was = state.editing;
      state.editing = true;
      // Kept as it is typed, so a redraw restores it rather than losing it.
      state.draft = { uid: state.selected ? state.selected.uid : null, text: event.target.value };
      if (!was) {
        var mark = document.getElementById('yaml-state');
        if (mark) mark.textContent = 'edited';
      }
      return;
    }
    if (event.target.id !== 'log-search') return;
    var log = currentLog();
    if (!log) return;
    log.search = event.target.value;
    var at = event.target.selectionStart;
    drawDock();
    var field = document.getElementById('log-search');
    if (field) { field.focus(); field.setSelectionRange(at, at); }
  });

  document.addEventListener('change', function (event) {
    if (event.target.id !== 'log-container') return;
    var log = currentLog();
    if (!log) return;
    log.container = event.target.value;
    if (log.following) { followLog(log); followLog(log); }
    else readLog(log, false);
  });

  /* Dragging the dock taller. Bounded, so it can neither vanish nor take the whole panel. */
  /**
   * The right-click menu inside a log.
   *
   * The same gesture a terminal answers, for the same reason: this reads like
   * one, so it should behave like one. The selection is read as the menu opens,
   * before the click that opens it can clear it — and Copy only appears when
   * there is something to copy, because a Copy that copies nothing teaches
   * people not to trust the menu.
   */
  document.addEventListener('contextmenu', function (event) {
    var body = event.target.closest('.dock-body');
    if (!body) return;
    event.preventDefault();
    var log = currentLog();
    if (!log) return;
    var selected = String(window.getSelection() || '');
    var shown = shownLines(log);

    closeRowMenu();
    var menu = document.createElement('div');
    menu.className = 'row-menu';
    menu.innerHTML =
      (selected
        ? '<button class="btn" data-log-menu="selection">Copy selection<span class="dim"> · ' +
          selected.split('\n').length + ' line' + (selected.indexOf('\n') >= 0 ? 's' : '') + '</span></button>'
        : '<button class="btn" disabled>Copy selection<span class="dim"> · nothing selected</span></button>') +
      '<button class="btn" data-log-menu="all">Copy the whole log<span class="dim"> · ' + shown.length + ' lines</span></button>' +
      '<button class="btn" data-log-menu="save">Save to a file…</button>';
    document.body.appendChild(menu);

    var below = window.innerHeight - event.clientY > menu.offsetHeight + 8;
    menu.style.left = Math.max(6, Math.min(event.clientX, window.innerWidth - menu.offsetWidth - 6)) + 'px';
    menu.style.top = (below ? event.clientY + 2 : event.clientY - menu.offsetHeight - 2) + 'px';

    menu.addEventListener('click', function (click) {
      var button = click.target.closest('[data-log-menu]');
      if (!button) return;
      var whole = shown.map(function (line) { return line.text; }).join('\n');
      if (button.dataset.logMenu === 'selection') {
        host.emit('copy', { text: selected });
        say('Copied ' + selected.split('\n').length + ' lines.');
      } else if (button.dataset.logMenu === 'all') {
        host.emit('copy', { text: whole });
        say('Copied ' + shown.length + ' lines.');
      } else {
        host.emit('save', { name: log.name + '.log', text: whole });
      }
      closeRowMenu();
    });
    setTimeout(function () { document.addEventListener('click', closeRowMenu, { once: true }); }, 0);
  });

  /**
   * Reading a value off the chart.
   *
   * The points are on the element, so this is arithmetic rather than another
   * question to Prometheus — and it is what turns a shape into a measurement:
   * "it was two cores at ten past four" is the sentence somebody is trying to
   * say when they point at a bump.
   */
  document.addEventListener('mousemove', function (event) {
    var chart = event.target.closest('.chart');
    if (!chart) {
      [].forEach.call(document.querySelectorAll('.chart.is-read'), function (one) {
        one.classList.remove('is-read');
        one.querySelector('.chart-cursor').setAttribute('x1', -10);
        one.querySelector('.chart-cursor').setAttribute('x2', -10);
        var head = one.querySelector('.chart-value');
        if (head && one.dataset.last) head.textContent = one.dataset.last;
        var when = one.querySelector('.chart-when');
        if (when && one.dataset.over) when.textContent = one.dataset.over;
      });
      return;
    }
    var points;
    try { points = JSON.parse(chart.dataset.points); } catch (e) { return; }
    if (!points.length) return;

    var svg = chart.querySelector('svg');
    var box = svg.getBoundingClientRect();
    var share = Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
    var at = Math.round(share * (points.length - 1));
    var point = points[at];

    var head = chart.querySelector('.chart-value');
    var when = chart.querySelector('.chart-when');
    if (!chart.dataset.last) { chart.dataset.last = head.textContent; chart.dataset.over = when.textContent; }
    chart.classList.add('is-read');
    head.textContent = chart.dataset.unit === 'Memory' ? bytes(point[1]) : fromCores(point[1]);
    when.textContent = new Date(point[0]).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

    var cursor = chart.querySelector('.chart-cursor');
    var x = (at / (points.length - 1)) * 240;
    cursor.setAttribute('x1', x);
    cursor.setAttribute('x2', x);
  });

  /**
   * Following a statistic to what it is about.
   *
   * Every number on the overview is a question — how many nodes, what is
   * failing, where is the CPU — and the answer is a view this panel already
   * draws. Clicking goes there rather than leaving somebody to find it, which
   * is the difference between a dashboard and a poster.
   */
  document.addEventListener('click', function (event) {
    var stat = event.target.closest('[data-stat]');
    if (stat) { show({ type: 'stats', focus: stat.dataset.stat }); return; }

    var back = event.target.closest('[data-view=overview]');
    if (back) { show({ type: 'overview' }); return; }

    var card = event.target.closest('[data-go]');
    if (card) {
      // What the number was about, carried into the table it opens.
      show({ type: 'kind', name: card.dataset.go }, {
        only: card.dataset.only,
        sort: card.dataset.sort ? { column: card.dataset.sort, dir: -1 } : null,
      });
      return;
    }

    var namespace = event.target.closest('[data-namespace]');
    if (namespace) {
      var pick = document.getElementById('namespace');
      state.namespace = namespace.dataset.namespace;
      if (pick) pick.value = state.namespace;
      show({ type: 'kind', name: 'pods' });
      return;
    }

    var node = event.target.closest('[data-node]');
    if (node) { show({ type: 'kind', name: 'nodes' }, { wanted: node.dataset.node }); return; }

    var range = event.target.closest('[data-range]');
    if (!range) return;
    state.prom.minutes = Number(range.dataset.range);
    loadCharts(state.selected);
    draw();
  });

  document.addEventListener('mousedown', function (event) {
    /*
     * The strip is part of the handle.
     *
     * A line a few pixels tall is a small target and an unlikely place to try,
     * so the bar under it drags as well — every window manager on earth lets you
     * move a thing by its title bar. Anything in the strip that does something
     * of its own keeps doing it.
     */
    var onStrip = event.target.closest('.dock-tabs') &&
      !event.target.closest('button, input, select, .dock-tab, a');
    var grip = event.target.closest('#dock-grip') || (onStrip ? document.getElementById('dock-grip') : null);
    if (!grip) return;
    event.preventDefault();
    grip.classList.add('is-held');
    /*
     * Dragging out of full height rather than refusing to move.
     *
     * Filling the window is a height the grid decides, so the pixels the drag
     * starts from have to be measured rather than remembered — and full height
     * has to be given up in the same breath, or the inline height the drag sets
     * would be overruled by the class and the dock would sit there ignoring the
     * pointer.
     */
    var dock = document.querySelector('.dock');
    var startY = event.clientY;
    var startHeight = state.dockFull && dock ? dock.getBoundingClientRect().height : state.dock;
    if (state.dockFull) {
      state.dockFull = false;
      drawDock();
      dock = document.querySelector('.dock');
    }
    var move = function (moved) {
      state.dock = Math.max(90, Math.min(window.innerHeight - 190, startHeight + (startY - moved.clientY)));
      // Re-queried every move: a following log redraws the dock underneath us.
      var live = document.querySelector('.dock');
      if (live) live.style.height = state.dock + 'px';
    };
    var up = function () {
      var held = document.getElementById('dock-grip');
      if (held) held.classList.remove('is-held');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  host.on('stream', function (payload) {
    if (payload.id === state.watch.id) {
      if (payload.done) {
        /*
         * The API server closes a watch every few minutes; that is normal and
         * not an error. What is not safe is assuming nothing happened while it
         * was down, so the table is read again and the watch reopened.
         */
        state.watch.id = null;
        if (state.showing && state.view.type === 'kind') load(true);
        return;
      }
      if (payload.events) applyWatch(payload.events);
      return;
    }

    for (var i = 0; i < state.logs.length; i += 1) {
      var log = state.logs[i];
      if (log.id !== payload.id) continue;
      if (payload.done) {
        log.following = false;
        log.id = null;
        if (log.pending) { log.lines.push({ text: log.pending }); log.pending = ''; }
        log.lines.push({ text: '— the log ended —' });
        drawDock();
        return;
      }
      /*
       * A chunk rarely ends on a line break, so its tail is half a line. That
       * half is held here rather than pushed, so what is in `lines` is always
       * whole lines — which is what makes appending sound: nothing already
       * drawn is ever revised, so nothing already drawn has to be found again.
       */
      var text = (log.pending || '') + String(payload.text || '');
      var parts = text.split('\n');
      log.pending = parts.pop();
      for (var n = 0; n < parts.length; n += 1) {
        log.lines.push({ text: parts[n], err: payload.stream === 'err' });
      }
      if (log.lines.length > LOG_CAP) {
        var cut = log.lines.length - LOG_CAP;
        log.lines.splice(0, cut);
        log.drawn = Math.max(0, (log.drawn || 0) - cut);
      }
      if (i !== state.logAt) return;
      /*
       * Once per frame at most. Chunks arrive in bursts — a pod that logs a
       * request logs four lines about it — and drawing each one separately is
       * three quarters of the work thrown away. It also means a frame nobody
       * is looking at does nothing at all: an animation frame in a hidden
       * document is never called.
       */
      if (!pendingDraw) {
        pendingDraw = requestAnimationFrame(function () {
          pendingDraw = 0;
          var current = currentLog();
          if (current && !appendLines(current)) drawDock();
        });
      }
      return;
    }

    // A port-forward talking. The line that matters is the first one.
    for (var f = 0; f < state.forwards.length; f += 1) {
      var forward = state.forwards[f];
      if (forward.id !== payload.id) continue;
      if (payload.done) { state.forwards.splice(f, 1); drawBar(); return; }
      var match = /Forwarding from (?:127\.0\.0\.1|\[::1\]):(\d+)/.exec(String(payload.text || ''));
      if (match) { forward.local = Number(match[1]); forward.up = true; drawBar(); }
      else if (payload.stream === 'err' && String(payload.text).trim()) {
        forward.error = String(payload.text).trim().split('\n')[0];
        drawBar();
      }
      return;
    }
  });

  /* ---------------------------------------------------------------------- *
   * Doing things.
   * ---------------------------------------------------------------------- */
  /**
   * What is on screen, as text somebody would want to paste.
   *
   * `innerText` alone is nearly right, and wrong in the one place it matters: a
   * description list puts every label on its own line and every value on the
   * next, so a copied overview comes out as a column of alternating words. The
   * pairs are joined; everything else is taken as it reads.
   */
  function readable(root) {
    /*
     * The root may be the thing itself rather than a box of things — the drawer
     * hands over a whole tab, a block's Copy hands over its one table or its one
     * list. Both have to read the same, so the shape is decided per node and the
     * root is just another node.
     */
    var mine = pieceText(root);
    if (mine != null) return mine.trim();
    var out = [];
    for (var i = 0; i < root.children.length; i += 1) {
      var node = root.children[i];
      var text = pieceText(node);
      out.push(text == null ? node.innerText : text);
    }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  /** One element as text, when its shape says how to read it. */
  function pieceText(node) {
    if (node.tagName === 'DL') {
      var out = [];
      var terms = node.querySelectorAll('dt');
      for (var n = 0; n < terms.length; n += 1) {
        var value = terms[n].nextElementSibling;
        out.push(terms[n].textContent + ': ' + (value ? value.textContent : ''));
      }
      return out.join('\n');
    }
    if (node.tagName === 'TABLE') {
      /*
       * A table read as a table: columns separated, one row per line, and no
       * buttons. Copying the containers block used to hand back the word "Log"
       * after every image, because that is what is on the row — and a copy is of
       * the thing said, not of the things offered.
       */
      var lines = [];
      var rows = node.querySelectorAll('tr');
      for (var r = 0; r < rows.length; r += 1) lines.push(cellsOf(rows[r]).join('\t'));
      return lines.join('\n');
    }
    return null;
  }

  /** One row's cells as text, leaving out the ones that are only controls. */
  function cellsOf(row) {
    var cells = row.children;
    var text = [];
    for (var i = 0; i < cells.length; i += 1) {
      var cell = cells[i];
      if (cell.querySelector('button, input')) continue;
      var value = cell.textContent.trim();
      if (value) text.push(value);
    }
    return text;
  }

  function act(what) {
    /*
     * Copying, which every part of this has to allow.
     *
     * A panel is a sandboxed frame in an origin of its own, so it cannot write
     * to the clipboard itself — it asks the app, which is the same door
     * everything else goes through. What is copied is what is on screen: the
     * text of the tab, or the table as its columns, rather than a second
     * rendering of the same data that could disagree with the first.
     */
    if (what === 'copy-detail') {
      var body = document.querySelector('.detail-body');
      var head = document.querySelector('.detail-head h3');
      if (!body) return;
      var text = (head ? head.textContent + '\n\n' : '') + readable(body);
      host.emit('copy', { text: text });
      say('Copied ' + text.split('\n').length + ' lines.');
      return;
    }
    if (what === 'copy-table') {
      var rows = visible();
      if (!rows.length) return;
      var columns = (state.table.columns || []).filter(function (c) { return !(c === 'namespace' && state.namespace); });
      var lines = [columns.map(function (c) { return HEADINGS[c] || c; }).join('\t')];
      for (var i = 0; i < rows.length; i += 1) {
        lines.push(columns.map(function (c) { return rows[i][c] == null ? '' : String(rows[i][c]); }).join('\t'));
      }
      host.emit('copy', { text: lines.join('\n') });
      say('Copied ' + rows.length + ' rows.');
      return;
    }

    if (what === 'pick-none') { state.picked = []; drawTable(); drawPicked(); return; }
    if (what === 'pick-delete' || what === 'pick-restart') {
      var chosen = pickedRows();
      if (!chosen.length) return;
      /*
       * One question for the whole lot, naming the count — asking five times is
       * how the fifth one gets waved through — and then one call each, because
       * `delete` with several names either all works or reports which did not,
       * and knowing which did not is the point.
       */
