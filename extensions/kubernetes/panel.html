      '<button class="btn" data-subtab-menu="bottom">Open below</button>' +
      '<button class="btn" data-subtab-menu="duplicate">Duplicate</button>' +
      (many ? '<button class="btn" data-subtab-menu="close">Close</button>' +
        '<button class="btn" data-subtab-menu="others">Close the others</button>' : '');
    document.body.appendChild(menu);
    menu.style.left = Math.max(6, Math.min(near.clientX, window.innerWidth - menu.offsetWidth - 6)) + 'px';
    menu.style.top = (near.clientY + 2) + 'px';
    menu.addEventListener('click', function (click) {
      var button = click.target.closest('[data-subtab-menu]');
      if (!button) return;
      var what = button.dataset.subtabMenu;
      closeRowMenu();
      if (what === 'right' || what === 'bottom') openBeside(at, what);
      else if (what === 'duplicate') newTab(assign({}, placeOf(at)));
      else if (what === 'close') closeTab(at);
      else if (what === 'others') {
        var keep = placeOf(at);
        putAway();
        state.tabs = null;
        state.tabAt = 0;
        takeOut(keep, null);
        drawTabs();
      }
    });
    setTimeout(function () { document.addEventListener('click', closeRowMenu, { once: true }); }, 0);
  }

  /** Keep what is in front with its subtab before anything else is shown. */
  function putAway() {
    if (!state.tabs) state.tabs = [{ place: null, table: null }];
    var tab = state.tabs[state.tabAt];
    tab.place = placeNow();
    tab.table = state.view.type === 'kind' || state.view.type === 'helm' ? state.table : null;
  }

  /** Take a place out and look at it. */
  function takeOut(place, table) {
    place = place || { view: { type: 'overview' } };
    stopWatch();
    state.picked = [];
    state.view = place.view || { type: 'overview' };
    state.only = place.only || null;
    state.sort = place.sort || { column: null, dir: 1 };
    state.namespace = place.namespace || '';
    state.search = place.search || '';
    $('search').value = state.search;
    leaveDetail();
    state.detailData = {};
    state.wanted = place.selected && place.selected.name ? place.selected.name : null;
    state.detail = { tab: place.selected && place.selected.tab ? place.selected.tab : 'overview' };
    state.table = table || null;
    if (state.view.type === 'kind') {
      var group = groupHolding(state.view.name);
      if (group) openGroups()[group] = true;
    }
    drawTop();
    drawNav();
    remember();
    load(Boolean(table));
  }

  function switchTab(at) {
    if (!state.tabs || at === state.tabAt || !state.tabs[at]) return;
    putAway();
    state.tabAt = at;
    takeOut(state.tabs[at].place, state.tabs[at].table);
  }

  /** A new subtab: the place given, or this one without its selection. */
  function newTab(place) {
    putAway();
    var here = placeNow();
    var start = place || { view: here.view, namespace: here.namespace, sort: here.sort, only: here.only, search: here.search, selected: null };
    state.tabs.push({ place: start, table: null });
    state.tabAt = state.tabs.length - 1;
    takeOut(start, null);
  }

  function closeTab(at) {
    if (!state.tabs || state.tabs.length < 2 || !state.tabs[at]) return;
    if (at !== state.tabAt) {
      putAway();
      state.tabs.splice(at, 1);
      if (at < state.tabAt) state.tabAt -= 1;
      if (state.tabs.length < 2) state.tabs = null, state.tabAt = 0;
      remember();
      return;
    }
    state.tabs.splice(at, 1);
    state.tabAt = Math.min(at, state.tabs.length - 1);
    var next = state.tabs[state.tabAt];
    if (state.tabs.length < 2) { state.tabs = null; state.tabAt = 0; }
    takeOut(next.place, next.table);
  }

  /** Where a click on this element would go, for opening it in a subtab of its own instead. */
  function placeFor(el) {
    var ns = state.namespace;
    if (el.dataset.kind) return { view: { type: 'kind', name: el.dataset.kind }, namespace: ns };
    if (el.dataset.go) return { view: { type: 'kind', name: el.dataset.go }, namespace: ns, only: el.dataset.only || null, sort: el.dataset.sort ? { column: el.dataset.sort, dir: -1 } : null };
    if (el.dataset.namespace != null && el.hasAttribute('data-namespace')) return { view: { type: 'kind', name: 'pods' }, namespace: el.dataset.namespace };
    if (el.dataset.view === 'overview') return { view: { type: 'overview' } };
    if (el.dataset.view === 'helm') return { view: { type: 'helm' }, namespace: ns };
    return null;
  }

  /** Where we are, as every call below needs it. */
  function where() {
    var at = { context: state.context };
    if (state.namespace) at.namespace = state.namespace;
    else at.allNamespaces = true;
    return at;
  }

  /* ---------------------------------------------------------------------- *
   * The navigation, built from what the cluster says it has.
   *
   * Not a fixed list: half of a real cluster is CRDs somebody's operator
   * installed, and a menu that cannot show them is a menu that is wrong about
   * the cluster it is pointed at. Equally, a cluster without Ingresses does not
   * get an Ingresses entry that answers "the server doesn't have a resource
   * type".
   * ---------------------------------------------------------------------- */
  var GROUPS = [
    { title: 'Cluster', items: ['nodes', 'namespaces', 'events'] },
    { title: 'Workloads', items: ['pods', 'deployments', 'statefulsets', 'daemonsets', 'replicasets', 'jobs', 'cronjobs'] },
    { title: 'Config', items: ['configmaps', 'secrets', 'horizontalpodautoscalers', 'resourcequotas'] },
    { title: 'Network', items: ['services', 'ingresses', 'endpoints', 'networkpolicies'] },
    { title: 'Storage', items: ['persistentvolumeclaims', 'persistentvolumes', 'storageclasses'] },
    { title: 'Access', items: ['serviceaccounts', 'roles', 'rolebindings', 'clusterroles', 'clusterrolebindings'] },
  ];
  var LABELS = {
    nodes: 'Nodes', namespaces: 'Namespaces', events: 'Events',
    pods: 'Pods', deployments: 'Deployments', statefulsets: 'Stateful Sets',
    daemonsets: 'Daemon Sets', replicasets: 'Replica Sets', jobs: 'Jobs', cronjobs: 'Cron Jobs',
    configmaps: 'Config Maps', secrets: 'Secrets',
    horizontalpodautoscalers: 'Autoscalers', resourcequotas: 'Quotas',
    services: 'Services', ingresses: 'Ingresses', endpoints: 'Endpoints', networkpolicies: 'Network Policies',
    persistentvolumeclaims: 'Volume Claims', persistentvolumes: 'Volumes', storageclasses: 'Storage Classes',
    serviceaccounts: 'Service Accounts', roles: 'Roles', rolebindings: 'Role Bindings',
    clusterroles: 'Cluster Roles', clusterrolebindings: 'Cluster Role Bindings',
  };

  function known(name) {
    for (var i = 0; i < state.resources.length; i += 1) {
      if (state.resources[i].name === name) return state.resources[i];
    }
    return null;
  }

  function customResources() {
    var out = [];
    for (var i = 0; i < state.resources.length; i += 1) {
      var resource = state.resources[i];
      if (resource.builtIn) continue;
      out.push(resource);
    }
    out.sort(function (a, b) { return (a.group + a.kind).localeCompare(b.group + b.kind); });
    return out;
  }

  /**
   * Which groups are open.
   *
   * Folded by default except the one holding what is on screen, which is what
   * makes a navigation with a hundred custom resources in it usable: a cluster
   * with Elastic, Argo, Karpenter and Kong installed has more kinds than fit on
   * a screen, and scrolling past six headings to reach Pods is worse than
   * clicking one.
   */
  function openGroups() {
    if (!state.groups) state.groups = { Workloads: true };
    return state.groups;
  }

  function groupHolding(name) {
    for (var g = 0; g < GROUPS.length; g += 1) {
      if (GROUPS[g].items.indexOf(name) >= 0) return GROUPS[g].title;
    }
    return known(name) && !known(name).builtIn ? 'Custom Resources' : null;
  }

  function drawNav() {
    var html = '<button class="' + (state.view.type === 'overview' ? 'on' : '') + '"' + (state.view.type === 'overview' ? ' aria-current="page"' : '') + ' data-view="overview">Overview</button>' +
      '<button class="' + (state.view.type === 'map' ? 'on' : '') + '" data-view="map" title="The cluster drawn as what is joined to what">Map</button>';

    var open = openGroups();
    var heading = function (title, count) {
      return '<button class="nav-group' + (open[title] ? ' is-open' : '') + '" aria-expanded="' + (open[title] ? 'true' : 'false') + '" data-group="' + esc(title) + '">' +
        '<span class="twist">' + (open[title] ? '▾' : '▸') + '</span><span class="group-title">' + esc(title) + '</span>' +
        (count ? '<span class="count">' + count + '</span>' : '') + '</button>';
    };

    for (var g = 0; g < GROUPS.length; g += 1) {
      var group = GROUPS[g];
      var rows = '';
      var held = 0;
      for (var i = 0; i < group.items.length; i += 1) {
        var name = group.items[i];
        var resource = known(name);
        // Nothing this cluster does not have. An entry that can only answer
        // "the server doesn't have that resource type" is worse than no entry.
        if (!resource && state.resources.length) continue;
        held += 1;
        if (!open[group.title]) continue;
        var on = state.view.type === 'kind' && state.view.name === name;
        var count = state.counts[name];
        rows += '<button class="nav-item' + (on ? ' on' : '') + '" data-kind="' + esc(name) + '">' +
          esc(LABELS[name] || name) +
          (count == null ? '' : '<span class="count">' + count + '</span>') +
          '</button>';
      }
      if (held) html += heading(group.title, held) + rows;
    }

    /*
     * Helm, when there is a Helm. Plenty of clusters have none, and a section
     * that can only ever say "no releases" is a section in the way — so this
     * appears once `helm list` has actually found something.
     */
    if (state.helm.releases > 0) {
      var onHelm = state.view.type === 'helm';
      html += heading('Helm', state.helm.releases);
      if (open['Helm']) {
        html += '<button class="nav-item' + (onHelm ? ' on' : '') + '" data-view="helm">Releases</button>';
      }
    }

    var custom = customResources();
    if (custom.length) {
      html += heading('Custom Resources', custom.length);
      if (open['Custom Resources']) {
        var lastGroup = null;
        for (var c = 0; c < custom.length; c += 1) {
          var item = custom[c];
          if (item.group !== lastGroup) {
            html += '<h4 class="nav-sub">' + esc(item.group) + '</h4>';
            lastGroup = item.group;
          }
          var chosen = state.view.type === 'kind' && state.view.name === item.name;
          html += '<button class="nav-item' + (chosen ? ' on' : '') + '" data-kind="' + esc(item.name) +
            '" title="' + esc(item.apiVersion) + '">' + esc(item.kind) + '</button>';
        }
      }
    }
    $('nav').innerHTML = html;
  }

  $('nav').addEventListener('click', function (event) {
    var button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.group) {
      var open = openGroups();
      open[button.dataset.group] = !open[button.dataset.group];
      drawNav();
    } else if (button.dataset.view === 'overview') {
      show({ type: 'overview' });
    } else if (button.dataset.view === 'map') {
      // Back to the way it was last drawn, rather than to the first of the three.
      if (state.view.type !== 'map') show(state.lastMap || { type: 'map', mode: 'topology' });
    } else if (button.dataset.view === 'helm') {
      show({ type: 'helm' });
    } else if (button.dataset.kind) {
      show({ type: 'kind', name: button.dataset.kind });
    }
  });

  /* ---------------------------------------------------------------------- *
   * Loading.
   * ---------------------------------------------------------------------- */
  function show(view, extras) {
    extras = extras || {};
    stopWatch();
    state.picked = [];
    state.only = extras.only || null;
    if (state.view.type === 'map') state.lastMap = state.view;
    state.view = view;
    // You cannot be looking at something inside a folded group.
    if (view.type === 'kind') {
      var group = groupHolding(view.name);
      if (group) openGroups()[group] = true;
    }
    leaveDetail();
    state.search = extras.search || '';
    $('search').value = state.search;
    state.sort = extras.sort || { column: null, dir: 1 };
    state.wanted = extras.wanted || null;
    state.wantedTab = extras.wantedTab || null;
    state.wantedNamespace = extras.wantedNamespace || null;
    remember();
    drawNav();
    load();
  }

  var loadToken = 0;
  /** Seconds, minutes or hours since `then`, as short as it can be said. */
  function sinceText(then) {
    var s = Math.max(0, Math.floor((Date.now() - then) / 1000));
    if (s < 1) return 'just now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + pad2(s % 60) + 's ago';
    return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm ago';
  }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  /*
   * Ages that keep counting.
   *
   * The cluster says when a thing was made; how old that makes it is a fact
   * about now, and "41s" read once and left on screen is wrong a second later.
   * So an age is drawn from its timestamp, marked with it, and one timer moves
   * every age on screen along — seconds while a thing is under an hour old,
   * which is when the seconds are what you are watching, kubectl's units after.
   */
  function ageText(then, now) {
    var seconds = Math.max(0, Math.floor(((now || Date.now()) - then) / 1000));
    if (seconds < 60) return seconds + 's';
    var minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + 'm' + pad2(seconds % 60) + 's';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours < 10 ? hours + 'h' + minutes % 60 + 'm' : hours + 'h';
    var days = Math.floor(hours / 24);
    if (days < 10) return days + 'd' + hours % 24 + 'h';
    if (days < 365) return days + 'd';
    return Math.floor(days / 365) + 'y' + days % 365 + 'd';
  }

  /** When this row's age counts from: an event's last time, otherwise when it was made (or a release last changed). */
  function bornAt(row) {
    var stamp = row && (row.at || row.createdAt || row.updated);
    var then = stamp ? Date.parse(stamp) : NaN;
    return isNaN(then) ? null : then;
  }

  /** An age that keeps itself current. `fallback` is what the cluster said, for a row with no timestamp. */
  function ageHtml(row, fallback) {
    var then = bornAt(row);
    if (then == null) return esc(fallback == null ? (row && row.age) || '' : fallback);
    return '<span class="since" data-since="' + then + '">' + esc(ageText(then)) + '</span>';
  }

  function tickAges() {
    if (state.showing === false || document.hidden) return;
    // Text that changes under a selection moves the selection; somebody copying waits for nobody.
    var picked = window.getSelection && window.getSelection();
    if (picked && !picked.isCollapsed) return;
    var now = Date.now();
    var ages = document.querySelectorAll('.since[data-since]');
    for (var i = 0; i < ages.length; i += 1) {
      var text = ageText(Number(ages[i].dataset.since), now);
      if (ages[i].textContent !== text) ages[i].textContent = text;
    }
    drawFresh();
  }

  /**
   * How fresh what is on screen is. A table that updates itself says so, and
   * says when it stopped managing to — otherwise a dashboard that lost its
   * connection an hour ago looks exactly like one that is live.
   */
  function drawFresh() {
    var reload = $('reload');
    if (reload) reload.classList.toggle('is-busy', Boolean(state.busy));
    var fresh = $('fresh');
    if (!fresh) return;
    fresh.classList.toggle('is-stale', Boolean(state.stale));
    if (state.stale) {
      fresh.textContent = 'refresh failed';
      fresh.title = state.stale + (state.updatedAt ? '\n\nWhat is shown is from ' + sinceText(state.updatedAt) + '. Refresh to try again.' : '');
    } else if (state.updatedAt) {
      fresh.textContent = (state.watch.id ? 'watching · ' : '') + sinceText(state.updatedAt);
      fresh.title = state.watch.id
        ? 'Changes arrive as they happen; read in full ' + sinceText(state.updatedAt)
        : 'Read ' + sinceText(state.updatedAt) + (state.live ? '; Live reads it again by itself' : '');
    } else {
      fresh.textContent = '';
      fresh.title = '';
    }
  }
  setInterval(tickAges, 1000);

  /**
   * The map, read before it is asked for.
   *
   * It is the slowest thing here — every node, pod, workload, service and
   * volume, six seconds on a real cluster — and it was only started when
   * somebody clicked Map, who then watched it load. So it is read behind
   * whatever the panel opens on, kept per cluster and namespace, and shown at
   * once from what was kept while it is read again. The header says how old
   * what is on screen is, as it does for everything else.
   */
  var mapCache = {};
  var mapFetching = {};
  function mapKeep(key, result, text) {
    mapCache[key] = { result: result, text: text, at: Date.now() };
    var keys = Object.keys(mapCache);
    if (keys.length > 4) delete mapCache[keys[0]];
  }
  function mapPrefetch() {
    var key = mapKey();
    if (!state.context || state.view.type === 'map' || mapFetching[key]) return;
    if (mapCache[key] && Date.now() - mapCache[key].at < 5 * 60 * 1000) return;
    mapFetching[key] = true;
    call('kube.topology', where()).then(function (result) {
      delete mapFetching[key];
      mapKeep(key, result, JSON.stringify([result.nodes, result.edges, result.findings, result.missing]));
      // The form may be waiting to know whether an autoscaler is watching what it edits.
      if (state.view.type === 'kind' && key === mapKey()) { drawTable(); if (state.selected && !holdingEdit()) drawDetail(); }
      if (state.view.type === 'overview' && state.overview) drawOverview();
    }).catch(function () { delete mapFetching[key]; });
  }
  /** What the map knows about a row of a table, if the map has been read. */
  function mapKnown(row) {
    if (!row) return null;
    var id = row.kind + '/' + (row.namespace || '') + '/' + row.name;
    if (state.mapIndex && state.mapFor === mapKey() && state.mapIndex.byId[id]) return state.mapIndex.byId[id];
    var kept = mapCache[mapKey()] || mapCache[(state.context || '') + '/'];
    if (!kept) return null;
    if (!kept.byId) { kept.byId = {}; (kept.result.nodes || []).forEach(function (node) { kept.byId[node.id] = node; }); }
    return kept.byId[id] || null;
  }

  function load(quiet) {
    var mine = (loadToken += 1);
    state.busy = true;
    drawFresh();
    var started = Date.now();
    if (state.view.type === 'map' && (!state.map || state.mapFor !== mapKey()) && mapCache[mapKey()]) {
      var kept = mapCache[mapKey()];
      state.map = kept.result;
      state.mapIndex = mapIndexOf(kept.result);
      state.mapText = kept.text;
      state.mapFor = mapKey();
      state.updatedAt = kept.at;
    }
    if (!quiet) { state.loading = true; state.error = null; draw(); }

    var request = state.view.type === 'overview'
      ? call('kube.summary', { context: state.context })
      : state.view.type === 'map'
        ? call('kube.topology', where())
      : state.view.type === 'helm'
        ? call('helm.releases', helmWhere()).then(asHelmTable)
        : state.view.name === 'events'
          ? call('kube.events', where())
          : call('kube.list', assign({ kind: state.view.name }, scopeFor(state.view.name)));

    request.then(function (result) {
      state.busy = false;
      state.tookMs = Date.now() - started;
      // An answer to a question nobody is asking any more. Dropping it is the
      // whole of what keeps a fast click from being overtaken by a slow one.
      if (mine !== loadToken) return;
      state.loading = false;
      state.error = null;
      state.stale = null;
      state.updatedAt = Date.now();
      drawFresh();
      /*
       * Where it is, said again on every load and not only when somebody
       * navigates.
       *
       * A panel rebuilt before its first navigation has nothing to be put back
       * to, and starts at the overview — which is right, and is also
       * indistinguishable from the restore having failed. Saying it here means
       * there is no window at all in which this panel has not said where it is.
       */
      remember();
      if (state.view.type === 'overview') {
        state.overview = result;
        // The disk numbers are Prometheus', and arrive after this. Until they
        // do, the last ones stand — see applyDisk.
        applyDisk();
        loadCharts(null);
        loadDisk();
      }
      else if (state.view.type === 'map') {
        /*
         * The same cluster as last time is the same map: kept as it is, so the
         * page under somebody's hand is not rebuilt every time the cluster is
         * asked and says nothing happened.
         */
        var text = JSON.stringify([result.nodes, result.edges, result.findings, result.missing]);
        if (!state.map || state.mapFor !== mapKey() || state.mapText !== text) {
          state.map = result;
          state.mapIndex = mapIndexOf(result);
          state.mapText = text;
        }
        state.mapFor = mapKey();
        mapKeep(mapKey(), result, text);
        if (state.selected) mapRefreshSelected();
        if (state.selected && state.detail.tab === 'events') loadEvents(true);
      }
      else {
        /*
         * What was folded in afterwards is carried over until it is read again:
         * CPU, memory and the zone arrive a moment after the rows, and every
         * refresh used to blank the three columns — and undo a sort on them —
         * until they did.
         */
        var before = state.table;
        if (before && before.rows && result.rows && (before.columns || []).some(function (c) { return c === 'cpu' || c === 'zone'; })) {
          var old = {};
          before.rows.forEach(function (row) { old[row.uid] = row; });
          result.rows.forEach(function (row) {
            var was = old[row.uid];
            if (was) { row.cpu = was.cpu; row.memory = was.memory; row.zone = was.zone; }
          });
          ['zone', 'cpu', 'memory'].forEach(function (column) {
            if (before.columns.indexOf(column) < 0 || result.columns.indexOf(column) >= 0) return;
            var after = column === 'zone' ? result.columns.indexOf('node') + 1 : result.columns.indexOf('age');
            result.columns.splice(after <= 0 && column !== 'zone' ? result.columns.length : after, 0, column);
          });
        }
        state.table = result;
        if (state.view.name) state.counts[state.view.name] = (result.rows || []).length;
        // The pane, if one is open, is about one of these rows — and this is a
        // new set of them. See refreshSelection.
        refreshSelection();
        if (state.selected && state.detail.tab === 'events') loadEvents(true);
      }
      draw(quiet ? { keepDock: true } : null);
      if (state.view.type !== 'map') mapPrefetch();
      /*
       * Somebody clicked a node on the overview and this is the table it was
       * on. Opening it is what they were asking for.
       */
      if (state.wanted && state.view.type === 'map') {
        // Rebuilt with the pane open on something the map drew: open it again.
        var again = state.view.ui && state.view.ui.sel;
        state.wanted = null;
        if (again && !state.selected) mapSelect(again, state.detail.tab);
      }
      else if (state.wanted && state.table) {
        var inNamespace = state.wantedNamespace;
        var found = state.table.rows.filter(function (row) { return row.name === state.wanted && (!inNamespace || row.namespace === inNamespace); })[0];
        var onTab = state.wantedTab;
        state.wantedName = state.wanted;
        state.wanted = null;
        state.wantedTab = null;
        state.wantedNamespace = null;
        if (!found && state.view.type === 'kind') say(state.wantedName + ' is not in this list. It may be gone, or in another namespace.', true);
        if (found) {
          select(found.uid);
          if (onTab) { var goTo = document.querySelector('.tabs [data-tab="' + onTab + '"]'); if (goTo) goTo.click(); }
        }
      }
      if (state.view.name === 'pods' || state.view.name === 'nodes') withMetrics(mine, state.view.name);
      if (state.view.name === 'pods') withZones(mine);
      if (state.view.type === 'kind') startWatch(state.view.name);
    }).catch(function (error) {
      state.busy = false;
      state.tookMs = Date.now() - started;
      if (mine !== loadToken) { drawFresh(); return; }
      state.loading = false;
      /*
       * A refresh that failed behind a table that is already there leaves the
       * table there. One dropped connection used to swap forty good rows for a
       * red sentence, which is less true than the rows were; now the rows stay
       * and the header says they are no longer being kept up to date.
       */
      var shown = state.view.type === 'overview' ? state.overview : state.view.type === 'map' ? state.map : state.table;
      if (quiet && shown) {
        state.stale = String(error.message || error);
        drawFresh();
        return;
      }
      state.error = String(error.message || error);
      drawFresh();
      draw();
    });
  }

  /**
   * What each row is actually using, folded in afterwards.
   *
   * Afterwards, and never as a condition of drawing: `kubectl top` needs
   * metrics-server, plenty of clusters do not have it, and a table that waits
   * for it would be a table that never appears on those. So the rows arrive,
   * and two columns turn up a moment later if the cluster can answer.
   */
  function withMetrics(token, what) {
    call('kube.top', assign({ what: what }, scopeFor(what))).then(function (result) {
      if (token !== loadToken || !state.table) return;
      var found = result.metrics || {};
      var any = false;
      state.table.rows.forEach(function (row) {
        var hit = found[row.namespace + '/' + row.name] || found['/' + row.name];
        if (!hit) return;
        any = true;
        row.cpu = hit.cpu;
        row.memory = hit.memory;
      });
      if (!any) return;
      // Before Age, which is the column people scan last.
      if (state.table.columns.indexOf('cpu') < 0) {
        var at = state.table.columns.indexOf('age');
        state.table.columns.splice(at < 0 ? state.table.columns.length : at, 0, 'cpu', 'memory');
      }
      drawTable();
    }).catch(function () { /* no metrics-server; the table is the table */ });
  }

  /**
   * Which zone each pod is in, beside the node it is on.
   *
   * A pod does not say: its node does, in a label. So the nodes are read once
   * and kept for a few minutes — they change far less often than pods are
   * listed — and the column turns up a moment after the rows, as the metrics
   * do. Where nodes may not be read, or carry no zone, there is no column.
   */
  var zonesByContext = {};
  function withZones(token) {
    var forThis = state.context;
    var kept = zonesByContext[forThis];
    var known = kept && Date.now() - kept.at < 300000
      ? Promise.resolve(kept.map)
      : call('kube.list', { kind: 'nodes', context: forThis }).then(function (result) {
        var map = {};
        (result.rows || []).forEach(function (node) { if (node.zone) map[node.name] = node.zone; });
        zonesByContext[forThis] = { at: Date.now(), map: map };
        return map;
      });
    known.then(function (map) {
      if (token !== loadToken || !state.table || forThis !== state.context) return;
      // A machine added since the nodes were read: read them again, once, rather than leave its pods with no zone.
      var unknown = Object.keys(map).length && state.table.rows.some(function (row) { return row.node && !map[row.node]; });
      if (unknown && kept && Date.now() - kept.at > 20000) { delete zonesByContext[forThis]; withZones(token); return; }
      if (!Object.keys(map).length) return;
      state.zones = map;
      if (state.table.columns.indexOf('zone') < 0) {
        var at = state.table.columns.indexOf('node');
        state.table.columns.splice(at < 0 ? state.table.columns.length : at + 1, 0, 'zone');
      }
      drawTable();
    }).catch(function () { /* nodes are not ours to read here; the table is the table */ });
  }

  /** A release lives in a namespace, but "all namespaces" is the useful default. */
  function helmWhere() {
    var at = { context: state.context };
    if (state.namespace) at.namespace = state.namespace;
    return at;
  }

  /**
   * Releases as a table, in the shape every other table here has.
   *
   * `kind: 'Release'` on every row is what the detail pane branches on: a
   * release is not a Kubernetes object and its tabs are different questions —
   * what changed, what were the values, put it back.
   */
  function asHelmTable(result) {
    state.helm.releases = (result.rows || []).length;
    state.helm.checked = true;
    return {
      kind: 'Release',
      columns: ['name', 'namespace', 'chart', 'chartVersion', 'appVersion', 'revision', 'status', 'age'],
      rows: (result.rows || []).map(function (row) { return assign({ kind: 'Release' }, row); }),
    };
  }

  /**
   * Whether this cluster has any releases at all.
   *
   * Asked once, quietly, and never on the refresh timer: `helm list -A` reads a
   * secret in every namespace and takes eight seconds on a real cluster. It
   * decides whether the Helm heading exists, which is not a question worth
   * asking again every ten seconds.
   */
  function lookForHelm() {
    if (state.helm.checked) return;
    state.helm.checked = true;
    call('helm.releases', { context: state.context })
      .then(function (result) {
        state.helm.releases = (result.rows || []).length;
        drawNav();
      })
      .catch(function () { /* no helm, or no releases: the heading stays away */ });
  }

  function assign(target, extra) {
    for (var key in extra) if (Object.prototype.hasOwnProperty.call(extra, key)) target[key] = extra[key];
    return target;
  }

  /** A cluster-scoped kind ignores the namespace picker; asking for one is an error. */
  function scopeFor(name) {
    var resource = known(name);
    if (resource && !resource.namespaced) return { context: state.context };
    return where();
  }

  /**
   * Which cluster this tab is for.
   *
   * Normally the app said so when it opened the tab. Opened from Extensions
   * instead, nobody has said — and then kubeconfig's own current context is the
   * only sensible answer, the same one a bare `kubectl` would use.
   */
  function start() {
    recoverForwards();
    if (state.context) return loadForContext();
    return call('kube.contexts').then(function (result) {
      var first = (result.contexts || [])[0];
      state.context = result.current || (first && first.name) || null;
      if (!state.context) throw new Error('There are no clusters in kubeconfig.');
      // Nobody said which cluster; say which one this turned out to be, so the app does not open it twice.
      host.emit('adoptedCluster', { context: state.context });
      return loadForContext();
    });
  }

  function loadForContext() {
    stopWatch();
    state.resources = [];
    state.namespaces = [];
    state.counts = {};
    state.helm = { checked: false, releases: 0 };
    state.prom = { checked: false, found: null, series: {}, minutes: state.prom.minutes };
    state.disk = null;
    state.diskByHost = null;
    drawNav();
    drawTop();

    var forThis = state.context;
    return Promise.all([
      call('kube.resources', { context: state.context }).catch(function () { return { resources: [] }; }),
      call('kube.list', { kind: 'namespaces', context: state.context }).catch(function () { return { rows: [] }; }),
    ]).then(function (answers) {
      if (forThis !== state.context) return;
      state.resources = answers[0].resources || [];
      state.namespaces = (answers[1].rows || []).map(function (row) { return row.name; });
      drawNav();
      drawTop();
      load();
      lookForHelm();
      lookForPrometheus();
    });
  }

  /* ---------------------------------------------------------------------- *
   * Charts.
   *
   * `kubectl top` says what a thing is using now; this says what it has been
   * doing, which is the question actually being asked when somebody opens a
   * pod that got killed twenty minutes ago. It comes from the cluster's own
   * Prometheus through the API server, so there is nothing to install and
   * nothing to keep alive — and a cluster without one simply has no charts.
   * ---------------------------------------------------------------------- */
  function lookForPrometheus() {
    if (state.prom.checked) return;
    state.prom.checked = true;
    call('kube.prometheus', { context: state.context })
      .then(function (result) {
        state.prom.found = result.found || null;
        if (state.prom.found && state.selected) loadCharts(state.selected);
      })
      .catch(function () { /* no Prometheus: no charts, and nothing to apologise for */ });
  }

  /** A PromQL label value. Names cannot contain these; a value from elsewhere might. */
  function label(value) {
    return String(value == null ? '' : value).replace(/["\\\n]/g, '');
  }

  /** What to ask about the thing on screen. Null when it is not a thing with a shape in Prometheus. */
  function queriesFor(row) {
    if (!row) {
      return {
        cpu: 'sum(rate(container_cpu_usage_seconds_total{container!=""}[5m]))',
        memory: 'sum(container_memory_working_set_bytes{container!=""})',
      };
    }
    if (row.kind === 'Pod') {
      var pod = '{namespace="' + label(row.namespace) + '",pod="' + label(row.name) + '",container!=""}';
      return {
        cpu: 'sum(rate(container_cpu_usage_seconds_total' + pod + '[5m]))',
        memory: 'sum(container_memory_working_set_bytes' + pod + ')',
      };
    }
    if (row.kind === 'Node') {
      var node = '{node="' + label(row.name) + '",container!=""}';
      return {
        cpu: 'sum(rate(container_cpu_usage_seconds_total' + node + '[5m]))',
        memory: 'sum(container_memory_working_set_bytes' + node + ')',
      };
    }
    return null;
  }

  /** How many subjects' charts to keep. Past this, the oldest is forgotten. */
  var CHART_MEMORY = 40;

  /**
   * How full the disks are, which nothing else in the cluster will tell you.
   *
   * The API server knows how much disk a node *has* and nothing about how much
   * is left; only the node exporter measures that. Matched back to nodes by
   * their internal address, which is what the exporter labels its series with.
   */
  /**
   * Put the last disk reading back on the nodes.
   *
   * Every refresh replaces `state.overview` wholesale, and the payload it
   * replaces it with has no disk on it: disk comes from Prometheus, separately
   * and a moment later. So without this the bars vanish on every cycle and come
   * back when the query answers — a flicker that reads as the metric being
   * broken rather than as it being late. Matching is by the node's own address,
   * which is what node-exporter labels its series with, so a node that has gone
   * away simply finds nothing and shows nothing.
   */
  function applyDisk() {
    var byHost = state.diskByHost;
    if (!byHost || !state.overview) return;
    (state.overview.nodeUsage || []).forEach(function (node) {
      var found = byHost[node.ip];
      if (!found || !found.size) return;
      node.disk = found.size - found.avail;
      node.diskTotal = found.size;
    });
  }

  function loadDisk() {
    var prom = state.prom.found;
    if (!prom || !state.overview) return;
    var ask = function (query) {
      return call('kube.promNow', {
        context: state.context, namespace: prom.namespace, service: prom.name, query: query,
      }).then(function (r) { return r.values || []; }).catch(function () { return []; });
    };

    Promise.all([
      ask('node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}'),
      ask('node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}'),
    ]).then(function (answers) {
      var byHost = {};
      var total = 0;
      var free = 0;
      answers[0].forEach(function (one) {
        var host = String(one.labels.instance || '').split(':')[0];
        byHost[host] = { size: one.value, avail: 0 };
        total += one.value;
      });
      answers[1].forEach(function (one) {
        var host = String(one.labels.instance || '').split(':')[0];
        if (byHost[host]) byHost[host].avail = one.value;
        free += one.value;
      });
      /*
       * Nothing came back — Prometheus was slow, or the query failed, or the
       * exporter is restarting. That is not the same as "the disks are empty",
       * so the previous reading is left alone rather than replaced with none.
       */
      if (!total) return;

      state.disk = { total: total, used: total - free, at: Date.now() };
      state.diskByHost = byHost;
      applyDisk();
      if (state.view.type === 'overview' || state.view.type === 'stats') draw();
    });
  }

  function loadCharts(row) {
    var prom = state.prom.found;
    var wanted = queriesFor(row);
    if (!prom || !wanted) return;
    // Keyed by the range as well: an hour and a day are different questions
    // about the same thing, and one must not be served from the other's answer.
    var key = (row ? row.uid : 'cluster') + '@' + state.prom.minutes;
    if (state.prom.series[key]) return;

    /*
     * Bounded, because this is keyed by object and a person going down a list
     * of two hundred pods would otherwise be holding two hundred sets of
     * points, none of which they will look at again. The cluster's own is never
     * dropped: it is the one that is always on screen.
     */
    var keys = Object.keys(state.prom.series);
    if (keys.length >= CHART_MEMORY) {
      for (var n = 0; n < keys.length - CHART_MEMORY + 1; n += 1) {
        if (keys[n] !== 'cluster') delete state.prom.series[keys[n]];
      }
    }
    state.prom.series[key] = { loading: true };

    Promise.all(['cpu', 'memory'].map(function (which) {
      return call('kube.promQuery', {
        context: state.context, namespace: prom.namespace, service: prom.name,
        query: wanted[which], minutes: state.prom.minutes,
      }).then(function (r) { return r.empty ? null : (r.series[0] || null); }).catch(function () { return null; });
    })).then(function (answers) {
      state.prom.series[key] = { cpu: answers[0], memory: answers[1] };
      if (row ? state.selected === row : state.view.type === 'overview') draw();
    });
  }

  /*
   * Two units, two names, and the names say which.
   *
   * Prometheus counts CPU in cores and Kubernetes counts it in thousandths of
   * one, and both numbers land on this screen. When both formatters were called
   * `cores` the later one won and the chart printed `1.2673684232019298m` —
   * a whole core described as a thousandth of one.
   */
  function fromCores(value) {
    return value >= 1 ? value.toFixed(2) + ' cores' : Math.round(value * 1000) + 'm';
  }

  function fromMillicores(m) {
    return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' cores' : Math.round(m) + 'm';
  }

  /** Bytes, in the unit a person would have said. */
  function bytes(value) {
    var units = ['B', 'Ki', 'Mi', 'Gi', 'Ti'];
    var at = 0;
    while (value >= 1024 && at < units.length - 1) { value /= 1024; at += 1; }
    return (value >= 100 || at === 0 ? Math.round(value) : value.toFixed(1)) + units[at];
  }

  /**
   * One series, as a line.
   *
   * Drawn by hand in SVG rather than with a charting library, and not only
   * because this frame cannot load one: what is wanted here is a shape and a
   * last value, and two hundred kilobytes of axis logic would buy nothing. The
   * scale starts at zero so the height of the line means something — a chart
   * that crops its own baseline turns a two-percent wobble into a cliff.
   */
  function chart(series, format, title, big) {
    if (!series || !series.points.length) return '';
    var points = series.points;
    var top = 0;
    for (var i = 0; i < points.length; i += 1) top = Math.max(top, points[i][1]);
    if (top <= 0) top = 1;

    var W = 240;
    var H = big ? 150 : 46;
    var first = points[0][0];
    var span = Math.max(1, points[points.length - 1][0] - first);
    var path = points.map(function (point, at) {
      var x = ((point[0] - first) / span) * W;
      var y = H - (point[1] / top) * (H - 4) - 2;
      return (at ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');

    var last = points[points.length - 1][1];
    var span = state.prom.minutes;
    var over = span < 1440 ? 'last ' + span / 60 + ' hours' : span === 1440 ? 'last day' : 'last ' + span / 1440 + ' days';
    /*
     * The points ride along on the element, so hovering can answer "what was it
     * at that moment" without asking anything again. A chart you cannot
     * interrogate is a picture.
     */
    return '<div class="chart' + (big ? ' is-big' : '') + '" data-points="' + esc(JSON.stringify(points)) + '" data-unit="' + esc(title) + '">' +
      '<div class="chart-head"><span>' + esc(title) + '</span><b class="chart-value">' + esc(format(last)) + '</b></div>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<path d="' + path + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" class="chart-fill" />' +
      '<path d="' + path + '" class="chart-line" />' +
      '<line class="chart-cursor" y1="0" y2="' + H + '" x1="-10" x2="-10" />' +
      '</svg>' +
      '<div class="chart-foot"><span>peak ' + esc(format(top)) + '</span><span class="chart-when">' + esc(over) + '</span></div>' +
      '</div>';
  }

  /** Both charts for one subject, or nothing at all. */
  function chartsFor(row) {
    var key = (row ? row.uid : 'cluster') + '@' + state.prom.minutes;
    var got = state.prom.series[key];
    if (!got || got.loading) return '';
    var html = chart(got.cpu, fromCores, 'CPU') + chart(got.memory, bytes, 'Memory');
    if (!html) return '';
    // How far back, offered where the charts are rather than in a settings
    // menu: it is a question about what you are looking at.
    var ranges = [60, 360, 1440].map(function (minutes) {
      return '<button class="btn' + (state.prom.minutes === minutes ? ' on' : '') + '" data-range="' + minutes + '">' +
        (minutes < 1440 ? minutes / 60 + 'h' : minutes / 1440 + 'd') + '</button>';
    }).join('');
    return '<div class="chart-range">' + ranges + '</div><div class="charts">' + html + '</div>';
  }

  /* ---------------------------------------------------------------------- *
   * Watching, instead of asking again.
   *
   * A table used to be a photograph taken every ten seconds; this makes it a
   * thing that changes when the cluster does. The API server tells us what
   * changed and nothing else, so a pod going into CrashLoopBackOff costs one
   * row rather than four megabytes.
   *
   * The first picture still comes from an ordinary `get`, because a list is
   * fast and finite and a watch is neither. This takes over from there.
   * ---------------------------------------------------------------------- */
  function startWatch(kind) {
    var at = scopeFor(kind);
    // What this watch is *of*: the kind and the scope both. Comparing only the
    // kind would have kept a watch pointed at the namespace you just left.
    var what = kind + '\u0000' + (at.namespace || (at.allNamespaces ? '*' : ''));
    // Already watching exactly that: the resync that just ran is not a reason
    // to drop the connection and open another one.
    if (state.watch.id && state.watch.of === what) return;
    stopWatch();
    if (!state.showing) return;
    var mine = (state.watch.token += 1);
    call('kube.watch', assign({ kind: kind, as: titleOf(kind) }, at))
      .then(function (result) {
        // The view moved on while this was starting; the stream belongs to
        // nothing now and would otherwise stay open for ever.
        if (mine !== state.watch.token) {
          call('kube.stopWatch', { id: result.id }).catch(function () {});
          return;
        }
        state.watch.id = result.id;
        drawFresh();
        state.watch.kind = kind;
        state.watch.of = what;
      })
      .catch(function () { /* a kind that cannot be watched is still a table */ });
  }

  function stopWatch() {
    state.watch.token += 1;
    if (state.watch.id) call('kube.stopWatch', { id: state.watch.id }).catch(function () {});
    state.watch.id = null;
    state.watch.kind = null;
    state.watch.of = null;
  }

  /**
   * What the cluster just said, folded into the table.
   *
   * Upserting by uid, because ADDED for something already known is what a
   * reconnect looks like and there is nothing to gain from treating it as new.
   * Redrawing is left to an animation frame: a rollout produces dozens of these
   * in a second, and the table only has to be right once per frame.
   */
  function applyWatch(events) {
    if (!state.table) return;
    var changed = false;
    for (var i = 0; i < events.length; i += 1) {
      var event = events[i];
      if (event.type === 'ERROR') {
        // The watch has fallen behind the cluster's history. Nothing to
        // reconcile — read the whole thing again.
        stopWatch();
        load(true);
        return;
      }
      if (!event.row) continue;
      var at = -1;
      for (var n = 0; n < state.table.rows.length; n += 1) {
        if (state.table.rows[n].uid === event.row.uid) at = n;
      }
      if (event.type === 'DELETED') {
        if (at >= 0) {
          var goneRow = state.table.rows[at];
          state.table.rows.splice(at, 1);
          changed = true;
          // The one the pane is open on: it says so, rather than going on reading Running for ever.
          if (state.selected && state.selected.uid === goneRow.uid) {
            state.selected.status = 'Deleted';
            state.selected.health = 'idle';
            state.selected.gone = true;
            state.watch.pane = true;
          }
        }
      } else if (at >= 0) {
        /*
         * Carried across, because the API server does not know about them: CPU
         * and memory come from `kubectl top`, are folded in afterwards, and
         * were being wiped by the first watch event about the row — so a busy
         * pod's two columns went blank a second after they arrived, on exactly
         * the pods that change most.
         */
        var was = state.table.rows[at];
        state.table.rows[at] = assign(event.row, { cpu: was.cpu, memory: was.memory });
        changed = true;
      } else {
        state.table.rows.push(event.row);
        changed = true;
      }
    }
    if (!changed) return;
    if (state.view.name) state.counts[state.view.name] = state.table.rows.length;
    // The cluster said something about the row the pane is open on: that is the
    // one case where a watch event has to reach the drawer as well as the table.
    // Kept on the state rather than in the closure: several batches can land
    // before the frame runs, and it is the whole lot that decides.
    if (refreshSelection()) state.watch.pane = true;
    if (!state.watch.draw) {
      state.watch.draw = requestAnimationFrame(function () {
        state.watch.draw = 0;
        // Never over an editor, and never while a question is open.
        if (state.editing || document.getElementById('prompt')) return;
        // A button is being pressed: rebuilt now, it would never get its click.
        if (drawHeld) { drawOwed = { options: { keepDock: true } }; return; }
        var pane = state.watch.pane;
        state.watch.pane = false;
        drawTable();
        drawCrumb();
        drawNav();
        // Only when something it shows actually moved: rebuilding the drawer
        // takes the reader back to the top of whatever they were reading.
        if (pane) drawDetail();
      });
    }
  }

  /* ---------------------------------------------------------------------- *
   * Which cluster.
   *
   * Chosen from the header, where the cluster is named, rather than from a
   * list down the side of the app. Choosing one points this tab at it; the
   * arrow on a row, or the command key, opens it in a tab of its own, which is
   * still how two clusters are looked at together.
   *
   * The tab is not pointed elsewhere while it is holding something that
   * belongs to the cluster it is on — an edit that is kept, a port held open,
   * a log being followed. Then the other cluster gets its own tab, and says so.
   * ---------------------------------------------------------------------- */
  var clusters = { names: null, current: null, reach: {}, askedAt: 0, asking: 0, error: null, on: 0, filter: '', stale: false };

  /** What tells two contexts with the same short name apart: the region of an EKS ARN, or that it is the alias. */
  function clusterNote(name, names) {
    var short = shortContext(name);
    var clash = names.some(function (other) { return other !== name && shortContext(other) === short; });
    if (!clash) return '';
    var eks = /^arn:aws:eks:([^:]+):/.exec(name);
    if (eks) return eks[1];
    return name === short ? 'alias' : '';
  }

  /** Answered, said no, did not answer, not asked yet: four things, and the third is not the second. */
  function clusterDot(name) {
    var reach = clusters.reach[name];
    if (!reach) return 'unknown';
    if (reach.up) return 'ok';
    return reach.slow ? 'warn' : 'bad';
  }

  function readClusters(fresh) {
    clusters.error = null;
    return call('kube.contexts', fresh ? { fresh: true } : {}).then(function (result) {
      clusters.names = (result.contexts || []).map(function (one) { return one.name; });
      if (clusters.current !== (result.current || null)) { var drawn = document.querySelector('#cluster-menu .cl-list'); if (drawn) drawn.dataset.rows = '\u0000'; }
      clusters.current = result.current || null;
      // The app keeps its own count of the ones not answering, on its button: asked to look again too.
      if (fresh) host.emit('clustersCheck', {});
      clusters.stale = false;
      // Until somebody has moved, the mark sits on the cluster this tab is on.
      if (!clusters.moved) clusters.on = Math.max(0, clustersShown().indexOf(state.context));
      drawClusterList();
      askClusters(fresh);
    }, function (error) {
      clusters.error = String(error.message || error);
      drawClusterList();
    });
  }

  /** Each one asked whether it answers; a minute old is recent enough for a dot. */
  function askClusters(again) {
    if (!again && Date.now() - clusters.askedAt < 60000) return;
    clusters.askedAt = Date.now();
    (clusters.names || []).forEach(function (name) {
      clusters.asking += 1;
      call('kube.reachable', { context: name }).then(function (answer) {
        clusters.reach[name] = { up: Boolean(answer.up), slow: Boolean(answer.slow), error: answer.error || null };
      }, function (error) {
        clusters.reach[name] = { up: false, slow: false, error: String(error.message || error) };
      }).then(function () {
        clusters.asking -= 1;
        drawClusterList();
      });
    });
    drawClusterList();
  }

  function clustersShown() {
    var words = clusters.filter.trim().toLowerCase();
    return (clusters.names || []).filter(function (name) { return !words || name.toLowerCase().indexOf(words) >= 0; });
  }

  var ICON_NEW_TAB = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2.5"/></svg>';
  var ICON_MORE = '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.5" cy="8" r="1.2"/></svg>';

  function drawClusterList() {
    var menu = document.getElementById('cluster-menu');
    if (!menu) return;
    var list = menu.querySelector('.cl-list');
    var shown = clustersShown();
    if (clusters.on >= shown.length) clusters.on = Math.max(0, shown.length - 1);
    var names = clusters.names || [];
    if (clusters.error || !clusters.names || !shown.length) list.dataset.rows = '\u0000';
    if (clusters.error) list.innerHTML = '<div class="cl-empty">' + esc(clusters.error) + '</div>';
    else if (!clusters.names) list.innerHTML = '<div class="cl-empty">Reading kubeconfig…</div>';
    else if (!names.length) list.innerHTML = '<div class="cl-empty">No clusters in kubeconfig. Add one below.</div>';
    else if (!shown.length) list.innerHTML = '<div class="cl-empty">Nothing called that.</div>';
    else if (list.dataset.rows === shown.join('\n')) {
      /*
       * The same rows as are there: only what changed about them is touched.
       * Each cluster answers in its own time in the seconds after the list
       * opens, and rebuilding it under a pointer that was about to press, or
       * under a button that had the focus, loses the press and the focus.
       */
      var rows = list.querySelectorAll('.cl-row');
      shown.forEach(function (name, at) {
        var row = rows[at];
        var reach = clusters.reach[name];
        row.classList.toggle('on', at === clusters.on);
        row.querySelector('.cl-dot').className = 'cl-dot is-' + clusterDot(name);
        row.title = name + (reach && reach.error ? '\n' + reach.error : '');
      });
    } else {
      list.dataset.rows = shown.join('\n');
      list.innerHTML = shown.map(function (name, at) {
        var reach = clusters.reach[name];
        var note = clusterNote(name, names);
        var here = name === state.context;
        var tip = name + (reach && reach.error ? '\n' + reach.error : '');
        return '<div class="cl-row' + (at === clusters.on ? ' on' : '') + (here ? ' here' : '') + '" role="option" aria-selected="' + (here ? 'true' : 'false') + '" data-cluster="' + esc(name) + '" title="' + esc(tip) + '">' +
          '<span class="cl-dot is-' + clusterDot(name) + '"></span>' +
          '<span class="cl-label">' + esc(shortContext(name)) + '</span>' +
          (note ? '<span class="cl-note">' + esc(note) + '</span>' : '') +
          (name === clusters.current ? '<span class="cl-badge" title="What a plain kubectl uses">default</span>' : '') +
          '<span class="cl-check">' + (here ? '✓' : '') + '</span>' +
          '<button class="cl-tool" data-cluster-tab="1" title="Open in a tab of its own" aria-label="Open ' + esc(shortContext(name)) + ' in a tab of its own">' + ICON_NEW_TAB + '</button>' +
          '<button class="cl-tool" data-cluster-more="1" title="Check it, make it the default, remove it…" aria-label="More for ' + esc(shortContext(name)) + '">' + ICON_MORE + '</button>' +
          '</div>';
      }).join('');
      var on = list.querySelector('.cl-row.on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
    }
    var again = menu.querySelector('[data-cluster-again] span');
    if (again) again.textContent = clusters.asking > 0 ? 'Asking each one…' : 'Check again';
  }

  function closeClusterMenu() {
    var menu = document.getElementById('cluster-menu');
    if (!menu) return false;
    menu.remove();
    $('cluster').setAttribute('aria-expanded', 'false');
    return true;
  }

  function openClusterMenu() {
    if (closeClusterMenu()) return;
    closeRowMenu();
    var button = $('cluster');
    var at = button.getBoundingClientRect();
    var menu = document.createElement('div');
    menu.id = 'cluster-menu';
    menu.className = 'cluster-menu';
    menu.innerHTML =
      '<input type="text" placeholder="Find a cluster…" aria-label="Find a cluster" spellcheck="false" />' +
      '<div class="cl-list" role="listbox" aria-label="Clusters"></div>' +
      '<div class="cl-foot">' +
        '<button data-cluster-again="1" title="Read kubeconfig again and ask each cluster whether it answers"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 3v2.6h-2.6"/></svg><span>Check again</span></button>' +
        '<span class="spacer"></span>' +
        '<button data-cluster-add="1" title="Put another cluster in kubeconfig"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg><span>Add a cluster…</span></button>' +
      '</div>';
    document.body.appendChild(menu);
    menu.style.left = Math.max(8, Math.min(at.left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
    menu.style.top = (at.bottom + 4) + 'px';
    button.setAttribute('aria-expanded', 'true');
    clusters.filter = '';
    clusters.moved = false;
    var shown = clusters.names || [];
    clusters.on = Math.max(0, shown.indexOf(state.context));
    drawClusterList();
    readClusters(clusters.stale);

    var input = menu.querySelector('input');
    input.focus();
    input.addEventListener('input', function () {
      clusters.filter = input.value;
      clusters.moved = true;
      clusters.on = 0;
      drawClusterList();
    });
    menu.addEventListener('keydown', function (event) {
      var rows = clustersShown();
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!rows.length) return;
        clusters.moved = true;
        clusters.on = (clusters.on + (event.key === 'ArrowDown' ? 1 : rows.length - 1)) % rows.length;
        drawClusterList();
      } else if (event.key === 'Enter') {
        // On one of the two small buttons Enter is that button's.
        if (event.target.closest && event.target.closest('button')) return;
        event.preventDefault();
        if (rows[clusters.on]) chooseCluster(rows[clusters.on], event.metaKey || event.ctrlKey);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        closeClusterMenu();
        button.focus();
      }
    });
    menu.addEventListener('mousemove', function (event) {
      var row = event.target.closest && event.target.closest('.cl-row');
      if (!row) return;
      var at = clustersShown().indexOf(row.dataset.cluster);
      if (at < 0 || at === clusters.on) return;
      // Only the mark is moved: the row under the pointer must still be the row that is pressed.
      var was = menu.querySelector('.cl-row.on');
      if (was) was.classList.remove('on');
      row.classList.add('on');
      clusters.moved = true;
      clusters.on = at;
    });
    menu.addEventListener('click', function (event) {
      var target = event.target;
      if (target.closest('[data-cluster-again]')) { readClusters(true); return; }
      if (target.closest('[data-cluster-add]')) { closeClusterMenu(); addClusterSheet(); return; }
      var row = target.closest('.cl-row');
      if (!row) return;
      var name = row.dataset.cluster;
      if (target.closest('[data-cluster-more]')) {
        var where = target.closest('[data-cluster-more]').getBoundingClientRect();
        closeClusterMenu();
        host.emit('clusterMenu', { context: name, x: where.left, y: where.bottom + 2 });
        return;
      }
      chooseCluster(name, Boolean(target.closest('[data-cluster-tab]')) || event.metaKey || event.ctrlKey);
    });
  }

  /** What this tab is holding that belongs to the cluster it is on, in words; or nothing. */
  function heldHere() {
    // A pool being drained is driven from here, node by node: pointed elsewhere, it would stop half way.
    if (mapDraining) return 'a drain in progress';
    var edits = pendingEdits().length;
    if (edits) return edits === 1 ? 'an edit kept' : edits + ' edits kept';
    if (state.forwards && state.forwards.length) return state.forwards.length === 1 ? 'a port held open' : state.forwards.length + ' ports held open';
    var following = (state.logs || []).filter(function (log) { return log.following; }).length;
    if (following) return 'a log being followed';
    return '';
  }

  function chooseCluster(name, newTab) {
    closeClusterMenu();
    if (!name || (name === state.context && !newTab)) return;
    var held = newTab ? '' : heldHere();
    if (held) {
      say(shortContext(state.context || '') + ' has ' + held + ' in this tab, so ' + shortContext(name) + ' opened in a tab of its own.');
      newTab = true;
    }
    host.emit('openCluster', { context: name, newTab: Boolean(newTab) });
  }

  /* ---------------------------------------------------------------------- *
   * Another cluster in kubeconfig.
   *
   * Each cloud has one command that does this with the login already on the
   * machine, and that command is what is run — in a terminal, where it can ask
   * for whatever it asks for and where what it said stays readable. The app
   * builds the line from these fields and shows it before running it; what is
   * drawn here is the same line, so the question is not a surprise.
   * ---------------------------------------------------------------------- */
  var NEW_CLUSTER = {
    eks: { title: 'Amazon EKS', fields: [['name', 'Cluster name', 'kubrik-k8s'], ['region', 'Region', 'sa-east-1'], ['profile', 'AWS profile', 'optional']],
      line: function (v) { return 'aws eks update-kubeconfig --name ' + v.name + ' --region ' + v.region + (v.profile ? ' --profile ' + v.profile : ''); } },
    doks: { title: 'DigitalOcean', fields: [['name', 'Cluster name', 'my-cluster']],
      line: function (v) { return 'doctl kubernetes cluster kubeconfig save ' + v.name; } },
    gke: { title: 'Google GKE', fields: [['name', 'Cluster name', 'prod'], ['region', 'Location', 'southamerica-east1'], ['project', 'Project', 'optional']],
      line: function (v) { return 'gcloud container clusters get-credentials ' + v.name + ' --location ' + v.region + (v.project ? ' --project ' + v.project : ''); } },
    aks: { title: 'Azure AKS', fields: [['name', 'Cluster name', 'prod'], ['group', 'Resource group', 'my-group']],
      line: function (v) { return 'az aks get-credentials --name ' + v.name + ' --resource-group ' + v.group; } },
  };
  var newCluster = { provider: 'eks', values: {} };

  function addClusterSheet() {
    var box = sheet('Add a cluster', '');
    var body = box.querySelector('.sheet-body');
    box.querySelector('.sheet-box').style.width = 'min(520px, 92vw)';

    function wanted() {
      var kind = NEW_CLUSTER[newCluster.provider];
      var out = { provider: newCluster.provider };
      kind.fields.forEach(function (field) { out[field[0]] = String(newCluster.values[field[0]] || '').trim(); });
      return out;
    }
    function missing() {
      var kind = NEW_CLUSTER[newCluster.provider];
      var values = wanted();
      return kind.fields.filter(function (field) { return field[2] !== 'optional' && !values[field[0]]; }).map(function (field) { return field[1].toLowerCase(); });
    }
    function drawLine() {
      var line = body.querySelector('.add-line');
      var lacks = missing();
      line.classList.toggle('is-short', lacks.length > 0);
      line.textContent = lacks.length ? 'Needs the ' + lacks.join(' and the ') + '.' : NEW_CLUSTER[newCluster.provider].line(wanted());
      body.querySelector('[data-add-run]').disabled = lacks.length > 0;
      body.querySelector('[data-add-copy]').disabled = lacks.length > 0;
    }
    function draw() {
      var kind = NEW_CLUSTER[newCluster.provider];
      body.innerHTML =
        '<div class="dim sheet-sub">Puts a context in your kubeconfig with the cloud’s own command, using the login you already have there. Nothing is created in the cloud.</div>' +
        '<div class="add-cluster"><label for="add-provider">Where it runs</label><select id="add-provider">' +
        Object.keys(NEW_CLUSTER).map(function (id) { return '<option value="' + id + '"' + (id === newCluster.provider ? ' selected' : '') + '>' + NEW_CLUSTER[id].title + '</option>'; }).join('') +
        '</select>' +
        kind.fields.map(function (field) {
          return '<label for="add-' + field[0] + '">' + esc(field[1]) + '</label><input id="add-' + field[0] + '" data-add-field="' + field[0] + '" spellcheck="false" autocomplete="off" placeholder="' + esc(field[2]) + '" value="' + esc(newCluster.values[field[0]] || '') + '" />';
        }).join('') +
        '</div><div class="add-line"></div>' +
        '<div class="sheet-foot"><button class="btn go" data-add-run="1">Run in a terminal</button><button class="btn" data-add-copy="1">Copy the command</button>' +
        '<span class="dim">It is in the list once the command has finished.</span></div>';
      drawLine();
    }
    draw();
    var first = body.querySelector('[data-add-field]');
    if (first) first.focus();

    body.addEventListener('change', function (event) {
      if (event.target.id !== 'add-provider') return;
      newCluster.provider = event.target.value;
      draw();
      var input = body.querySelector('[data-add-field]');
      if (input) input.focus();
    });
    body.addEventListener('input', function (event) {
      var field = event.target.dataset && event.target.dataset.addField;
      if (!field) return;
      newCluster.values[field] = event.target.value;
      drawLine();
    });
    function run() {
      if (missing().length) return;
      call('kube.addCluster', wanted()).then(function () {
        clusters.stale = true;
        box.remove();
        say('Running it in a terminal. Open the cluster list again when it has finished.');
      }, function (error) { say(String(error.message || error), true); });
    }
    body.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && event.target.dataset && event.target.dataset.addField) { event.preventDefault(); run(); }
    });
    body.addEventListener('click', function (event) {
      if (event.target.closest('[data-add-run]')) run();
      else if (event.target.closest('[data-add-copy]') && !missing().length) {
        host.emit('copy', { text: NEW_CLUSTER[newCluster.provider].line(wanted()) });
        say('Copied the command.');
      }
    });
  }

  /* ---------------------------------------------------------------------- *
   * The header.
   * ---------------------------------------------------------------------- */
  function drawTop() {
    var head = $('cluster');
    head.querySelector('.cl-name').textContent = shortContext(state.context || '') || 'Choose a cluster';
    head.title = (state.context ? state.context + '\n' : '') + 'Choose the cluster this tab is on';

    var namespaces = ['<option value="">All namespaces</option>'].concat(
      state.namespaces.map(function (name) {
        return '<option value="' + esc(name) + '"' + (name === state.namespace ? ' selected' : '') + '>' + esc(name) + '</option>';
      }),
    ).join('');
    $('namespace').innerHTML = namespaces;
    $('live').className = 'btn with-icon' + (state.live ? ' on' : '');
    $('live').setAttribute('aria-pressed', state.live ? 'true' : 'false');
    drawFresh();
  }

  /**
   * An EKS context is an ARN and a GKE one is four fields joined by underscores;
   * neither fits in a picker. The last meaningful part is what people call the
   * cluster, and the whole thing stays in the tooltip.
   */
  function shortContext(name) {
    var text = String(name || '');
    if (text.indexOf('arn:') === 0) {
      var cut = text.lastIndexOf('/');
      return cut >= 0 ? text.slice(cut + 1) : text;
    }
    // `gke_my-project_southamerica-east1-a_prod` — four fields joined by
    // underscores, of which the last is the only one anybody says out loud.
    if (text.indexOf('gke_') === 0) {
      var parts = text.split('_');
      return parts[parts.length - 1] || text;
    }
    return text;
  }

  $('namespace').addEventListener('change', function (event) {
    state.namespace = event.target.value;
    leaveDetail();
    remember();
    load();
  });
  // On the map, Enter in the filter goes to the first thing that matches and opens it.
  $('search').addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || state.view.type !== 'map' || !state.map || !state.search) return;
    var found = state.map.nodes.filter(function (node) { return node.name.toLowerCase().indexOf(state.search) >= 0; });
    var rank = function (node) { return (node.name.toLowerCase() === state.search ? 0 : 2) + (mapIsWorkload(node) ? 0 : 1); };
    found.sort(function (a, b) { return rank(a) - rank(b); });
    if (found[0]) { mapTrail = []; mapFollow(found[0].id); }
    else say('Nothing on the map is called that.', true);
  });
  // Enter in the question sends it: it is a line of text with a button beside it.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || !event.target || event.target.id !== 'question' || event.isComposing) return;
    event.preventDefault();
    act('ask');
  });
  $('search').addEventListener('input', function (event) {
    state.search = event.target.value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      remember();
      // The table or the map, and what counts them. Not the pane and not the logs: neither is filtered by this.
      if (state.view.type === 'kind' || state.view.type === 'helm') { drawCrumb(); drawTable(); drawPicked(); }
      else draw({ keepDock: true });
    }, 110);
  });
  var searchTimer = 0;
  // In place: what is there stays there until the new answer replaces it, and
  // the arrow turning is what says it is being asked.
  $('reload').addEventListener('click', function () {
    if (state.error || !(state.view.type === 'overview' ? state.overview : state.view.type === 'map' ? state.map : state.table)) load();
    else load(true);
  });
  $('live').addEventListener('click', function () {
    state.live = !state.live;
    drawTop();
  });
  $('terminal').addEventListener('click', function () {
    call('kube.terminal', { context: state.context, namespace: state.namespace })
      .then(function () { say('A terminal opened, with k aliased to this cluster.'); })
      .catch(function (error) { say(String(error.message || error), true); });
  });

  /* ---------------------------------------------------------------------- *
   * Drawing.
   * ---------------------------------------------------------------------- */
  /**
   * Everything, from the state.
   *
   * `keepDock` for the refresh that happens on a timer: nothing it reads has
   * anything to do with the logs at the bottom, and rebuilding those takes a
   * selection out of a log somebody is in the middle of copying from. Which is
   * why the timer used to stop altogether while a log was followed — and a
   * dashboard that stops being true because you opened a log is the wrong trade.
   */
  /*
   * Nothing is redrawn under a held button.
   *
   * A click is a press and a release on the same element. A table kept true by
   * a watch, or a map by its refresh, can rebuild that element between the two,
   * and then the browser sends no click: the button looks pressed and nothing
   * happens. The draw is owed instead, and paid when the pointer is let go.
   */
  var drawHeld = false;
  var drawOwed = null;
  function drawLetGo() {
    if (!drawHeld) return;
    drawHeld = false;
    if (!drawOwed) return;
    var owed = drawOwed;
    drawOwed = null;
    // After the click this release is about to become, not before it.
    setTimeout(function () { draw(owed.options); }, 0);
  }
  document.addEventListener('pointerdown', function (event) { if (event.button === 0) drawHeld = true; }, true);
  document.addEventListener('pointerup', drawLetGo, true);
  document.addEventListener('pointercancel', drawLetGo, true);
  window.addEventListener('blur', drawLetGo);

  function draw(options) {
    // A draw that would have left the dock alone and one that would not: owed together, the dock is drawn.
    if (drawHeld) { drawOwed = { options: drawOwed && !drawOwed.options ? null : options }; return; }
    drawCrumb();
    if (state.view.type === 'overview') drawOverview();
    else if (state.view.type === 'stats') drawStats();
    else if (state.view.type === 'map') drawMap();
    else drawTable();
    drawDetail();
    if (!options || !options.keepDock) drawDock();
    drawPicked();
    drawBar();
    drawGrips();
  }

  function drawCrumb() {
    var bits = [];
    if (state.view.type === 'stats') {
      bits.push('<button class="link" data-view="overview">Overview</button>');
      bits.push('<strong>' + esc(STAT_TITLES[state.view.focus] || state.view.focus) + '</strong>');
    } else if (state.view.type === 'overview') bits.push('<strong>Overview</strong>');
    else if (state.view.type === 'map') {
      bits.push('<strong>Map</strong>');
      if (state.map && state.mapFor === mapKey()) {
        var tally = { Node: 0, Pod: 0, bad: 0 };
        (state.map.nodes || []).forEach(function (node) {
          if (tally[node.kind] != null) tally[node.kind] += 1;
          if (node.kind === 'Pod' && node.health === 'bad') tally.bad += 1;
        });
        bits.push(tally.Node + ' nodes');
        bits.push(tally.Pod + ' pods');
        if (tally.bad) bits.push('<span class="bad-text">' + tally.bad + ' failing</span>');
      }
    }
    else if (state.view.type === 'helm') bits.push('<strong>Helm releases</strong>');
    else bits.push('<strong>' + esc(LABELS[state.view.name] || titleOf(state.view.name)) + '</strong>');
    var listing = state.view.type !== 'overview' && state.view.type !== 'stats' && state.view.type !== 'map';
    if (state.view.type !== 'stats') bits.push(esc(state.namespace || 'all namespaces'));
    if (state.table && listing) {
      var total = (state.table.rows || []).length;
      var shown = visible().length;
      bits.push(shown === total ? total + ' items' : shown + ' of ' + total);
    }
    /*
     * Why the list is short, and the way out of it.
     *
     * Clicking "pods failing" on the overview opens the pods with only the
     * failing ones in it — which is exactly right, and used to look identical
     * to a table that had lost most of its rows: "3 of 171" and no word about
     * a filter anywhere. The filter says its own name now, and takes it off.
     */
    if (state.view.type === 'kind' && state.view.name === 'events' && state.only !== 'bad' && state.table &&
        (state.table.rows || []).some(function (row) { return row.health === 'bad'; })) {
      bits.push('<button class="link" data-do="only-bad" title="Leave out what is only being reported">warnings only</button>');
    }
    if (state.only === 'bad' && listing) {
      bits.push('<button class="link" data-do="show-all" title="Show all of them again">' +
        (state.view.name === 'events' ? 'warnings only ✕' : 'only the ones that are failing ✕') + '</button>');
    }
    /*
     * Edits are kept against their objects, which is only a kindness if they
     * can be found again: the ones not applied are counted here, wherever the
     * panel is, and the count is the way back to each.
     */
    // What the rows on show are being complained about, in one number, and the way to put all of it aside.
    if (listing && state.table && state.view.name !== 'events') {
      var warnedRows = 0;
      var warnedSum = 0;
      visible().forEach(function (row) { var n = warnedCount(mapKnown(row)); if (n) { warnedRows += 1; warnedSum += n; } });
      if (warnedSum) {
        bits.push('<button class="link" data-do="warnings-clear-shown" title="Put aside the warnings of the ' + warnedRows + ' shown here that have any. Nothing is deleted in the cluster, and anything said again is counted again.">' +
          warnedSum + ' warning' + (warnedSum === 1 ? '' : 's') + ' · clear</button>');
      }
    }
    var pending = pendingEdits();
    if (pending.length) {
      bits.push('<button class="link pending-edits" data-pending="1" title="Edits that have not been applied to the cluster">' +
        '<span class="tab-unsaved">●</span> ' + pending.length + ' edit' + (pending.length === 1 ? '' : 's') + ' not applied ▾</button>');
    }
    if (state.history.length) {
      bits.push('<button class="link" data-history="1" title="What was applied to the cluster from this panel">' + state.history.length + ' applied ▾</button>');
    }
    if (state.loading) bits.push('<span class="spin">◐</span>');
    $('crumb').innerHTML =
      bits.join('<span class="dim"> · </span>') +
      (state.table && listing ? '' : '<span class="spacer"></span>') +
      '<button class="link keys-link" data-keys="1" title="Keys (?)">⌨</button>' +
      (state.table && listing
        ? '<span class="spacer keys-first"></span><button class="btn" data-do="copy-table" ' +
          'title="Copy this table, as text">Copy table</button>'
        : '');
  }

  function titleOf(name) {
    var resource = known(name);
    return resource ? resource.kind : name;
  }

  function visible() {
    var rows = (state.table && state.table.rows) || [];
    // A card asked for a subset — the failing ones — and said so.
    if (state.only === 'bad') rows = rows.filter(function (row) { return row.health === 'bad'; });
    if (state.search) {
      var term = state.search;
      rows = rows.filter(function (row) {
        // Every part guarded: a node has no namespace, and the word "undefined"
        // in the haystack is a search term that matches every row there is.
        var hay = row.name + ' ' + (row.namespace || '') + ' ' + (row.status || '') + ' ' +
          (row.message || '') + ' ' + (row.nodegroup || '');
        // And whatever else the table is showing of it: a node's name, an address, a zone.
        var shown = (state.table && state.table.columns) || [];
        for (var c = 0; c < shown.length; c += 1) {
          var part = row[shown[c]];
          if (part != null && typeof part !== 'object' && shown[c] !== 'age') hay += ' ' + part;
        }
        return hay.toLowerCase().indexOf(term) >= 0;
      });
    }
    if (state.sort.column) {
      var column = state.sort.column;
      var dir = state.sort.dir;
      rows = rows.slice().sort(function (a, b) {
        // By time, not by text: "41s" against "1d18h" as strings is no order at all.
        if (column === 'age') {
          var young = bornAt(a), old = bornAt(b);
          if (young != null && old != null) return (old - young) * dir;
        }
        var left = sortKey(a, column);
        var right = sortKey(b, column);
        var order = typeof left === 'number' && typeof right === 'number'
          ? left - right
          : String(left == null ? '' : left).localeCompare(String(right == null ? '' : right), undefined, { numeric: true });
        // The same in this column: by name, so the order does not shuffle between two draws.
        if (!order) order = String(a.name || '').localeCompare(String(b.name || ''), undefined, { numeric: true }) * dir;
        return order * dir;
      });
    }
    return rows;
  }

  /**
   * What a column is ordered by, which is not always what it prints: "10/10"
   * before "2/3" and "100m" before "12m" are orders of the letters, not of the
   * things.
   */
  function sortKey(row, column) {
    var value = row[column];
    if (value == null || value === '') return column === 'cpu' || column === 'memory' || column === 'ready' ? -1 : '';
    if (typeof value === 'number') return value;
    var text = String(value);
    if (column === 'ready') {
      var parts = /^(\d+)\/(\d+)/.exec(text);
