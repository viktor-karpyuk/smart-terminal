      var aboutNode = mapKnown(about) || { id: about.kind + '/' + (about.namespace || '') + '/' + about.name };
      if (what === 'warnings-clear') clearWarnings(aboutNode); else unclearWarnings(aboutNode);
      if (state.view.type === 'map') drawMap(); else drawTable();
      drawDetail();
      return;
    }
    if (what === 'events-wide') {
      state.eventsWide = !state.eventsWide;
      state.detailData.events = null;
      state.detailData.eventsAt = 0;
      loadEvents();
      return;
    }
    if (what === 'events-refresh') { loadEvents(); return; }
    if (what === 'event-copy') { copyText((row.status ? row.status + ': ' : '') + (row.message || ''), 'the message'); return; }

    if (what === 'drain') {
      call('kube.drain', { context: state.context, name: row.name })
        .then(function (result) {
          openStreamTab('drain ' + row.name, result.id);
          say('Draining ' + row.name + '. Its progress is at the bottom.');
        })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }

    if (what === 'values-all') {
      state.helmAll = !state.helmAll;
      state.detailData.values = null;
      drawDetail();
      loadDetail();
      return;
    }
    if (what === 'helm-diff') {
      state.detail.tab = 'manifest';
      drawDetail();
      loadDetail();
      return;
    }
    if (what === 'helm-uninstall') {
      call('helm.uninstall', { context: state.context, namespace: row.namespace, name: row.name })
        .then(function (result) {
          say(result.text || ('Uninstalled ' + row.name + '.'));
          if (state.selected === row) { state.selected = null; draw(); }
          setTimeout(function () { load(true); }, 1200);
        })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }
    if (what === 'yaml-revert') {
      /*
       * Twice, when there is something to lose. Revert sat one button from
       * Apply and threw away an afternoon's edit on one click with nothing to
       * take it back; now the first click asks, on the button itself, and the
       * question goes away by itself.
       */
      if (draftFor(row) != null && !(state.revertArmed && Date.now() - state.revertArmed < 4000)) {
        state.revertArmed = Date.now();
        redrawEditor();
        setTimeout(function () {
          if (state.revertArmed && Date.now() - state.revertArmed >= 3900) { state.revertArmed = 0; if (state.selected === row && state.editingYaml) redrawEditor(); }
        }, 4000);
        return;
      }
      dropDraft(row);
      stopEditing();
      rememberSoon();
      state.detailData.theirs = null;
      drawDetail(true);
      drawCrumb();
      return;
    }
    if (what === 'yaml-check' || what === 'yaml-apply') {
      // From the draft and not from the box: the changes may be what is on screen, and then there is no box.
      var field = document.getElementById('yaml-edit');
      var written = field ? field.value : draftFor(row);
      if (written == null) written = baseFor(row);
      applyYaml(written, what === 'yaml-check');
      return;
    }

    if (what === 'close-detail') {
      closeDetail();
      return;
    }
    if (what === 'config-revert') {
      if (!state.config) return;
      if (!(state.revertArmed && Date.now() - state.revertArmed < 4000)) {
        state.revertArmed = Date.now();
        configShow();
        var armedFor = state.config;
        setTimeout(function () {
          if (state.revertArmed && Date.now() - state.revertArmed >= 3900) { state.revertArmed = 0; if (state.config === armedFor) configShow(); }
        }, 4000);
        return;
      }
      state.revertArmed = 0;
      state.config.draft = copyOf(state.config.live);
      state.config.moved = false;
      rememberSoon();
      state.editing = false;
      state.editNote = null;
      drawDetail(true);
      return;
    }
    if (what === 'config-check' || what === 'config-apply') {
      applyConfig(what === 'config-check');
      return;
    }

    if (what === 'shell') {
      call('kube.shell', {
        context: state.context, namespace: row.namespace, pod: row.name,
        container: row.containers && row.containers.length === 1 ? row.containers[0].name : undefined,
      }).then(function () { say('A terminal opened inside ' + row.name + '.'); })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }

    if (what === 'ask') {
      var input = document.getElementById('question');
      var asked = input ? input.value.trim() : '';
      // Twice in a second is a double press, not two questions.
      if (act.askedAt && Date.now() - act.askedAt < 1500) return;
      act.askedAt = Date.now();
      // An event is not something to describe; the thing it is about is, with what the event said as the question.
      if (row.kind === 'Event') {
        askAbout({ kind: row.objectKind, name: row.objectName, namespace: row.namespace },
          (asked ? asked + ' — ' : 'Why did this happen, and what fixes it? ') + 'The event: ' + row.status + ': ' + row.message);
        if (input) input.value = '';
        return;
      }
      askAbout(assign({ kind: row.kind, name: row.name, namespace: row.namespace }, {}), asked);
      if (input) input.value = '';
      return;
    }

    if (what === 'scale') {
      var scaler = mapKnown(row);
      askFor('Scale ' + row.name + ' to how many?' + (scaler && scaler.hpa
        ? '\n\nThe autoscaler ' + scaler.hpa + ' keeps it between ' + scaler.hpaRange.replace('–', ' and ') + ': a number set here lasts until it next acts.' : ''),
        String(row.replicas == null ? 1 : row.replicas))
        .then(function (wanted) {
          if (wanted == null) return;
          // "three", "-1" and an empty box are not a number of replicas, and were sent as one.
          if (!/^\d+$/.test(String(wanted).trim())) { say('"' + wanted + '" is not a number of replicas.', true); return; }
          run(call('kube.scale', assign({ replicas: Number(wanted) }, at)), 'Scaled ' + row.name + ' to ' + wanted + '.');
        });
      return;
    }
    if (what === 'restart') {
      run(call('kube.restart', at), 'Rolling ' + row.name + '.');
      return;
    }
    if (what === 'pause') {
      var holding = row.paused !== true;
      run(call('kube.pause', { context: state.context, namespace: row.namespace, name: row.name, on: holding }),
        holding ? 'Held the rollout of ' + row.name + '.' : 'Let ' + row.name + ' carry on.');
      return;
    }
    if (what === 'suspend') {
      var stopping = row.suspended !== true;
      run(call('kube.suspend', { context: state.context, kind: row.kind, namespace: row.namespace, name: row.name, on: stopping }),
        stopping ? 'Suspended ' + row.name + '.' : 'Resumed ' + row.name + '.');
      return;
    }
    if (what === 'trigger') {
      call('kube.trigger', { context: state.context, namespace: row.namespace, name: row.name })
        .then(function (result) {
          say('Started ' + (result.name || 'a job') + '.');
          setTimeout(function () { load(true); }, 1200);
        })
        .catch(function (error) { say(String(error.message || error), true); });
      return;
    }
    if (what === 'cordon') {
      run(call('kube.cordon', { context: state.context, name: row.name, on: row.schedulable !== false }),
        row.schedulable !== false ? 'Cordoned ' + row.name + '.' : 'Uncordoned ' + row.name + '.');
      return;
    }
    if (what === 'delete') {
      // The pane goes when the object does, not when the question is asked: a Cancel keeps it.
      run(call('kube.remove', at), 'Deleting ' + row.name + '.', function () {
        dropDraft(row);
        delete state.configs[configKey(row)];
        if (state.selected && state.selected.uid === row.uid) { stopEditing(); state.config = null; state.selected = null; remember(); draw(); }
      });
      return;
    }
    if (what === 'forward') {
      forwardDialog(row).then(function (choice) {
        if (choice) forward(row, choice.remote, choice.local, choice.open);
      });
    }
  }

  /**
   * Send an edited manifest, after asking the server whether it is legal.
   *
   * Always the dry run first, even when the button said Apply. The server
   * validates it against the real schemas and the real admission webhooks and
   * then throws it away, which is the whole difference between learning about a
   * bad indent and learning about an outage. Only if that passes does the real
   * one go.
   */
  /**
   * What was typed, kept as it is typed.
   *
   * Against the object rather than in the box, so nothing that rebuilds the
   * box loses it — and measured against what the edit started from, so text
   * typed back to how it was is no longer an edit, and the bar says so.
   */
  var applySitting = 0;
  var yamlCount = 0;
  function yamlTyped(box) {
    var row = state.selected;
    if (!row) return;
    var base = baseFor(row);
    var text = box.value;
    if (text === base) delete state.drafts[row.uid];
    else {
      state.drafts[row.uid] = { text: text, base: base, name: row.name, kind: row.kind, namespace: row.namespace || '' };
      // Not every object ever touched: the oldest go first.
      var held = Object.keys(state.drafts);
      if (held.length > 20) delete state.drafts[held[0]];
    }
    state.editing = text !== base;
    rememberSoon();
    state.revertArmed = 0;
    if (state.editNote) { state.editNote = null; var note = document.querySelector('.edit-note'); if (note) note.remove(); }
    yamlWhere();
    // The count of changed lines is a diff, and a diff on every key is felt on a long manifest: once the typing pauses.
    clearTimeout(yamlCount);
    yamlCount = setTimeout(yamlShow, 160);
  }

  /** The bar, written in place: never the box. */
  function yamlShow() {
    var row = state.selected;
    var mark = document.getElementById('yaml-state');
    if (!row || !mark) return;
    var draft = draftFor(row);
    var diff = draft == null ? null : lineDiff(baseFor(row), draft);
    var changed = Boolean(diff && (diff.added || diff.removed));
    mark.textContent = changed ? 'edited · ' + linesText(diff) : 'nothing changed yet';
    var set = function (name, off) { var b = document.querySelector('[data-do="' + name + '"]'); if (b) b.disabled = off; return b; };
    var apply = document.querySelector('[data-do="yaml-apply"]');
    if (!apply || !apply.dataset.cannot) set('yaml-apply', !changed || Boolean(state.applying));
    set('yaml-diff', !changed);
    var revert = set('yaml-revert', Boolean(state.applying));
    if (revert) { revert.textContent = changed ? revertLabel() : 'Done'; revert.title = changed ? 'Throw the edit away' : 'Leave the editor (Esc)'; revert.dataset.armed = state.revertArmed ? 1 : 0; }
    drawCrumb();
    var tab = document.querySelector('.tabs [data-tab="yaml"]');
    var dot = tab && tab.querySelector('.tab-unsaved');
    if (tab && changed && !dot) tab.insertAdjacentHTML('beforeend', '<span class="tab-unsaved" title="Edited, not applied">●</span>');
    if (dot && !changed) dot.remove();
  }

  /**
   * The keys an editor has, in a box that is not one.
   *
   * Tab leaves a textarea, which in YAML — where the indent is the syntax — is
   * the wrong thing for it to do. So Tab and Shift-Tab move the selected lines
   * by two spaces, Enter keeps the indent of the line it leaves (and goes one
   * deeper after a key that opens a block), and ⌘S is Apply because that is
   * what a hand does when it means "save". Each goes through execCommand
   * where that still works, so ⌘Z takes it back like any other typing.
   */
  function yamlInsert(box, from, to, text, selectFrom, selectTo) {
    box.focus();
    box.setSelectionRange(from, to);
    var done = false;
    try { done = document.execCommand('insertText', false, text); } catch (error) { done = false; }
    if (!done) { box.setRangeText(text, from, to, 'end'); yamlTyped(box); }
    if (selectFrom != null) box.setSelectionRange(selectFrom, selectTo == null ? selectFrom : selectTo);
  }

  document.addEventListener('keydown', function (event) {
    var box = event.target;
    var command = event.metaKey || event.ctrlKey;
    if (command && event.key === 's' && state.selected && (state.detail.tab === 'yaml' || state.detail.tab === 'configure')) {
      // ⌘S anywhere in the pane: the app's own Save has nothing of this frame's to save.
      var saveWith = document.querySelector('[data-do="' + (state.detail.tab === 'configure' ? 'config-apply' : 'yaml-apply') + '"]');
      // The key is the button: switched off — nothing changed, something wrong, not allowed — it does nothing.
      if (state.detail.tab === 'configure' || state.editingYaml) {
        event.preventDefault();
        if (saveWith && !saveWith.disabled) act(saveWith.dataset.do);
        return;
      }
    }
    if (command && event.key === 'Enter' && state.selected) {
      if (state.detail.tab === 'configure' && event.target.closest && event.target.closest('[data-config]')) { event.preventDefault(); act('config-check'); return; }
      if (state.editingYaml && state.detail.tab === 'yaml') { event.preventDefault(); act('yaml-check'); return; }
    }
    if (command && event.key === 'd' && state.editingYaml && state.detail.tab === 'yaml') { event.preventDefault(); act('yaml-diff'); return; }
    if (!box || box.id !== 'yaml-edit' || box.readOnly) return;

    if (event.key === 'Escape') {
      // With nothing changed, Escape leaves the editor and not the pane. With something changed it does nothing at all.
      event.stopPropagation();
      if (draftFor(state.selected) == null) { event.preventDefault(); act('yaml-revert'); }
      return;
    }
    var value = box.value;
    var from = box.selectionStart;
    var to = box.selectionEnd;
    if (event.key === 'Tab' && !command && !event.altKey) {
      event.preventDefault();
      var lineFrom = value.lastIndexOf('\n', from - 1) + 1;
      if (from === to && !event.shiftKey) { yamlInsert(box, from, to, '  '); return; }
      var lineTo = value.indexOf('\n', to > from && value[to - 1] === '\n' ? to - 1 : to);
      if (lineTo < 0) lineTo = value.length;
      var block = value.slice(lineFrom, lineTo).split('\n');
      var firstShift = 0;
      var moved = block.map(function (line, at) {
        if (!event.shiftKey) { if (at === 0) firstShift = 2; return line.trim() ? '  ' + line : line; }
        var cut = /^ {1,2}/.exec(line);
        if (at === 0) firstShift = cut ? -cut[0].length : 0;
        return cut ? line.slice(cut[0].length) : line;
      }).join('\n');
      var grew = moved.length - (lineTo - lineFrom);
      yamlInsert(box, lineFrom, lineTo, moved, Math.max(lineFrom, from + firstShift), from === to ? Math.max(lineFrom, from + firstShift) : to + grew);
      return;
    }
    if (event.key === 'Enter' && !command && !event.altKey && !event.isComposing && state.find.open && state.find.text &&
        to > from && value.slice(from, to).toLowerCase() === state.find.text.toLowerCase()) {
      // Find put the caret here to show its match. Enter is still "next" — it was replacing the match with a new line.
      event.preventDefault();
      state.find.at += event.shiftKey ? -1 : 1;
      findApply(true);
      return;
    }
    if (event.key === 'Enter' && !command && !event.shiftKey && !event.altKey && !event.isComposing) {
      event.preventDefault();
      var start = value.lastIndexOf('\n', from - 1) + 1;
      var line = value.slice(start, from);
      var indent = /^ */.exec(line)[0];
      // After `key:` or a block opener the next line is inside it. After `- key: value` it lines up under the key.
      if (/:\s*([|>][-+]?\d*)?\s*$/.test(line) && line.trim() !== '') indent += '  ';
      else if (/^ *- /.test(line)) indent += '  ';
      yamlInsert(box, from, to, '\n' + indent);
      return;
    }
    if (event.key === 'Backspace' && from === to && !command && !event.altKey) {
      // In the indent, a backspace takes one level, as the Tab that put it there did.
      var begin = value.lastIndexOf('\n', from - 1) + 1;
      var lead = value.slice(begin, from);
      if (lead.length >= 2 && /^ +$/.test(lead) && lead.length % 2 === 0) { event.preventDefault(); yamlInsert(box, from - 2, from, ''); }
    }
  }, true);

  ['keyup', 'click', 'select', 'focusin'].forEach(function (name) {
    document.addEventListener(name, function (event) { if (event.target && event.target.id === 'yaml-edit') yamlWhere(); });
  });

  /** A line of the changes is a place in the edit. */
  document.addEventListener('click', function (event) {
    var line = event.target.closest && event.target.closest('.diff-line[data-line]');
    if (!line || state.yamlView !== 'diff' || String(window.getSelection() || '')) return;
    yamlGoTo(Number(line.dataset.line));
  });

  /**
   * Send an edited manifest: has it moved, is it legal, then for real.
   *
   * First the cluster's copy is read again and held against the one the edit
   * started from. The text sent carries no resourceVersion — one that is a
   * minute old is refused on any object a controller touches — so this is
   * where somebody else's change is noticed, and it is shown rather than only
   * announced. Then the dry run, always, even when the button said Apply: the
   * server checks it against the real schemas and the real admission webhooks
   * and throws it away, which is the difference between learning about a bad
   * indent and learning about an outage. Only then the real one.
   */
  function applyYaml(text, checkOnly, force, replace) {
    var row = state.selected;
    if (!row || state.applying) return;
    var base = baseFor(row);
    var diff = lineDiff(base, text);
    if (!checkOnly && !diff.added && !diff.removed) { state.editNote = { text: 'Nothing is different from what the cluster has.' }; redrawEditor(); return; }
    var where = { context: state.context, kind: row.kind, name: row.name };
    if (row.namespace) where.namespace = row.namespace;
    // Left and come back to, the editor is a new sitting: an answer to the old one does not close it or take its text.
    var sitting = (applySitting += 1);
    var mine = function () { return state.selected === row && sitting === applySitting; };
    var settle = function (note) {
      if (!mine()) { if (note) say(row.name + ': ' + note.text, note.bad); return; }
      state.applying = null;
      state.editNote = note;
      redrawEditor();
      if (note && note.line) yamlGoTo(note.line);
    };

    state.applying = checkOnly ? 'check' : 'apply';
    state.editNote = null;
    state.revertArmed = 0;
    redrawEditor();

    var moved = checkOnly || force
      ? Promise.resolve(null)
      : call('kube.manifest', where).then(function (now) { return now.editable != null && now.editable !== base ? now.editable : null; });

    moved.then(function (theirs) {
      if (theirs != null) {
        if (mine()) state.detailData.theirs = theirs;
        var other = lineDiff(base, theirs);
        settle({ text: 'This was changed in the cluster while you were editing (' + linesText(other) + '). Nothing has been applied.', bad: true, moved: true });
        return null;
      }
      var send = { context: state.context, yaml: text, kind: row.kind, name: row.name, added: diff.added, removed: diff.removed };
      if (row.namespace) send.namespace = row.namespace;
      if (replace) send.replace = true;
      return call('kube.apply', assign({ dryRun: true }, send)).then(function (dry) {
        if (checkOnly) {
          settle({ text: 'The server accepted it. Nothing was changed.' + (dry.text ? '\n' + dry.text : '') });
          return null;
        }
        return call('kube.apply', send).then(function (done) {
          // Only the edit that was sent: text typed since, in a later sitting, is another edit and stays.
          if (draftFor(row) === text) dropDraft(row);
          recordApplied(row, replace ? 'YAML, replaced' : 'YAML', { before: base, after: text, added: diff.added, removed: diff.removed });
          say(done.text || 'Applied.');
          var finish = function (left, now) {
            if (!mine()) {
              if (left.length) say(row.name + ': applied, but ' + left.length + ' line' + (left.length === 1 ? '' : 's') + ' you removed ' + (left.length === 1 ? 'is' : 'are') + ' still there. Open its YAML to see.', true);
              return;
            }
            stopEditing();
            drawCrumb();
            state.detailData.theirs = null;
            state.detailData.object = null;
            if (left.length) {
              /*
               * It said "configured" and the lines are still there. Said, with
               * the lines, and the edit left open on what remains — measured
               * now against what the cluster has, so the bar counts exactly
               * what did not happen.
               */
              state.detailData.editable = now;
              state.drafts[row.uid] = { text: text, base: now, name: row.name, kind: row.kind, namespace: row.namespace || '' };
              state.editingYaml = true;
              state.editing = true;
              state.editNote = {
                bad: true, left: !replace,
                text: (replace ? 'Replaced, and ' : 'Applied, but ') + left.length + ' line' + (left.length === 1 ? '' : 's') + ' you removed ' + (left.length === 1 ? 'is' : 'are') + ' still there:\n' +
                  left.slice(0, 6).join('\n') + (left.length > 6 ? '\n…' : '') + '\n\n' +
                  (replace ? 'The cluster put them back itself: they are defaults, or something else manages them.'
                    : 'Apply only takes off what an earlier apply put there, and this was not made that way. Replace sends the manifest whole, and what is not in it goes.'),
              };
              drawDetail(true);
              setTimeout(function () { load(true); }, 900);
              return;
            }
            // Said where the edit was, and left there: a toast is gone by the time the eye is back from the button.
            state.editNote = { text: (replace ? 'Replaced. ' : 'Applied. ') + (done.text || '') };
            state.detailData.yaml = null;
            state.detailData.editable = null;
            drawDetail(true);
            loadDetail();
            setTimeout(function () { load(true); }, 900);
          };
          var gone = {};
          diff.ops.forEach(function (entry) { if (entry.op === '-' && entry.text.trim()) gone[entry.text] = true; });
          if (!Object.keys(gone).length) { finish([], null); return null; }
          // Read back: did what was taken out actually go?
          return call('kube.manifest', where).then(function (now) {
            var after = now.editable == null ? '' : now.editable;
            var left = lineDiff(text, after).ops.filter(function (entry) { return entry.op === '+' && gone[entry.text]; }).map(function (entry) { return entry.text; });
            finish(left, after);
            return null;
          }).catch(function () { finish([], null); return null; });
        });
      });
    }).catch(function (error) {
      // The server's own words. Ours would be a worse version of
      // "error validating data: unknown field spec.replicaz".
      var words = String(error.message || error);
      if (/the person said no/.test(words)) { settle(null); return; }
      var line = /\bline (\d+)\b/.exec(words);
      settle({ text: words, bad: true, line: line ? Number(line[1]) : null });
    });
  }

  /**
   * Hand the whole story of one object to Claude.
   *
   * The panel says which object and what was asked about it; the app gathers
   * the description, the warnings and the log — including the log of the
   * container that died — and opens a session with all of it already there.
   */
  /**
   * Hand one object to the session this tab already has.
   *
   * It is the same session every time on purpose. Debugging a cluster is not one
   * question about one object — it is a pod, then the service in front of it,
   * then the deployment behind it — and four sessions that each know one of
   * those cannot be asked what they have in common.
   */
  function askAbout(what, question) {
    say('Gathering everything about ' + what.name + '…');
    call('kube.ask', assign({ context: state.context, question: question || undefined }, what))
      .then(function () { say('Everything about ' + what.name + ' went to the Claude session below.'); })
      .catch(function (error) { say(String(error.message || error), true); });
  }

  function run(promise, done, then) {
    var subject = state.selected;
    promise.then(function () {
      if (then) then();
      if (subject) recordApplied(subject, 'Action', { lines: [done] });
      drawCrumb();
      say(done);
      // A change is not visible until the cluster agrees it happened.
      setTimeout(function () { load(true); }, 900);
    }).catch(function (error) { say(String(error.message || error), true); });
  }

  /**
   * Forward a port of this object to this machine.
   *
   * The forward itself is kept by the app, not by this frame: it outlives the
   * frame being rebuilt, and it is started again on the same local port when
   * its connection drops, so whatever was pointed at it keeps working.
   */
  function forward(row, remote, local, open) {
    call('kube.forward', {
      context: row.context || state.context, namespace: row.namespace,
      kind: row.forwardKind || 'pod', name: row.name,
      remote: remote, local: local,
    }).then(function (result) {
      var record = result.forward || { id: result.id, name: row.name, kind: row.forwardKind, remote: remote, asked: local, port: null, state: 'starting' };
      if (open) state.openWhenUp[record.id] = true;
      keepForward(record);
    }).catch(function (error) { say(String(error.message || error), true); });
  }

  /** Put a forward's latest word into the list, and act on it. */
  function keepForward(record) {
    var at = -1;
    for (var i = 0; i < state.forwards.length; i += 1) if (state.forwards[i].id === record.id) at = i;
    var before = at >= 0 ? state.forwards[at].state + ':' + state.forwards[at].port : null;
    if (at >= 0) state.forwards[at] = record; else state.forwards.push(record);
    if (before !== record.state + ':' + record.port) {
      drawTableSoon();
      // The selected object's own pills say the same thing the strip does.
      if (before !== null && state.selected && forwardsOf(state.selected).some(function (one) { return one.id === record.id; })) drawDetailButtonsSoon();
    }
    if (record.state === 'up' && state.openWhenUp[record.id]) {
      delete state.openWhenUp[record.id];
      openForward(record.id);
    }
    drawBar();
    // Only a forward appearing changes the count on the button; a state change does not need the pane redrawn.
    if (at < 0 && state.selected) drawDetailButtonsSoon();
  }

  var tableTimer = 0;
  /** The name column shows forwards; redrawn when one starts, comes up, drops or ends — not per line kubectl prints. */
  function drawTableSoon() {
    if (tableTimer) return;
    tableTimer = setTimeout(function () {
      tableTimer = 0;
      if (drawHeld) { drawTableSoon(); return; }
      if (state.table) drawTable();
    }, 120);
  }

  /** `⇄ :54321` beside a name that is reachable from here right now. */
  function forwardMark(row) {
    if (!row || !row.forwardKind) return '';
    var live = forwardsOf(row).filter(function (one) { return one.state === 'up' || one.state === 'reconnecting'; });
    if (!live.length) return '';
    var retrying = live.some(function (one) { return one.state === 'reconnecting'; });
    var ports = live.filter(function (one) { return one.port; }).map(function (one) { return ':' + one.port; });
    return '<span class="fw-mark' + (retrying ? ' retry' : '') + '" title="' +
      esc(live.map(function (one) { return 'localhost:' + (one.port || '…') + ' → ' + one.remote + (one.state === 'reconnecting' ? ' (reconnecting)' : ''); }).join('\n')) +
      '">⇄ ' + esc(ports.join(' ') || '…') + '</span>';
  }

  /** This object's forwards, in its own pane, with the same controls as the strip. */
  function detailForwards(row) {
    var mine = forwardsOf(row);
    if (!mine.length) return '';
    return '<div class="detail-forwards"><span>Forwarding</span>' + mine.map(pillFor).join('') + '</div>';
  }

  /** The forwards pointed at one object. */
  function forwardsOf(row) {
    return state.forwards.filter(function (one) {
      // By kind too: a Service and a Deployment both called `api` are two different things to forward to.
      return one.name === row.name && (one.kind || 'pod') === (row.forwardKind || 'pod') &&
        (one.namespace || '') === (row.namespace || '') && (!one.context || one.context === state.context);
    });
  }

  function openForward(id) {
    call('kube.openForward', { id: id }).catch(function (error) { say(String(error.message || error), true); });
  }

  /** The ones this panel already had, after its frame was rebuilt or it was opened again. */
  function recoverForwards() {
    call('kube.forwards').then(function (result) {
      state.forwards = (result.forwards || []).filter(function (one) { return one.state !== 'failed'; });
      drawBar();
    }).catch(function () { /* nothing held; an empty strip is the truth */ });
  }

  var buttonsTimer = 0;
  function drawDetailButtonsSoon() {
    if (buttonsTimer) return;
    buttonsTimer = setTimeout(function () { buttonsTimer = 0; if (state.selected) drawDetail(); }, 250);
  }

  /**
   * One form: which port inside, which port here, and whether to open it.
   *
   * The ports it declares are offered with their names, because "http 8080"
   * and "metrics 9090" say which one you want and two numbers do not. Any other
   * number can be typed — a container listening on a port it never declared is
   * ordinary, and the person usually knows it.
   */
  function forwardDialog(row) {
    return new Promise(function (resolve) {
      var existing = document.getElementById('prompt');
      if (existing) existing.remove();
      var ports = row.forwardPorts || (row.forwardable || []).map(function (port) { return { port: port, name: '' }; });
      var first = ports.length ? ports[0].port : '';
      /*
       * Here, below 1024 is a port only root may take on Linux — so 80 inside
       * is offered as 8080 here, 443 as 8443. Anything else keeps its number,
       * which is the one people expect to type into a browser.
       */
      var here = function (port) { port = Number(port); return port && port < 1024 ? port + 8000 : port || ''; };
      var through = row.forwardKind === 'pod' ? '' :
        '<div class="dim" style="margin:-4px 0 10px;font-size:11px">kubectl picks one of its pods, and picks again if that one goes — the forward follows it.</div>';

      var box = document.createElement('div');
      box.id = 'prompt';
      box.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,0.45);z-index:9';
      box.innerHTML = '<form style="background:var(--bg-panel);border:1px solid var(--border-strong);' +
        'border-radius:var(--radius);padding:14px 16px;min-width:320px;max-width:82vw">' +
        '<div style="margin-bottom:8px"><strong>Forward a port of ' + esc(row.name) + '</strong> <span class="dim">' + esc(row.namespace || '') + ' · ' + esc(shortContext(state.context || '')) + '</span></div>' +
        through +
        (ports.length
          ? '<div class="dim" style="font-size:11px">It declares</div><div class="fw-ports">' + ports.map(function (port) {
              return '<span class="fw-port" data-port="' + port.port + '">' + port.port +
                (port.name ? ' <span class="dim">' + esc(port.name) + '</span>' : '') +
                (port.container && ports.length > 1 ? ' <span class="dim">· ' + esc(port.container) + '</span>' : '') + '</span>';
            }).join('') + '</div>'
          : '<div class="dim" style="font-size:11px;margin-bottom:8px">It declares no ports. Type the one the application listens on.</div>') +
        '<label class="fw-row"><span>Port inside</span><input type="number" id="fw-remote" min="1" max="65535" value="' + esc(String(first)) + '" required></label>' +
        '<label class="fw-row"><span>Port here</span><span><input type="number" id="fw-local" min="0" max="65535" value="' + esc(String(here(first))) + '"> <span class="dim" style="font-size:11px">0 or empty: any free one</span></span></label>' +
        '<label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="fw-open"> Open it in the browser when it is up</label>' +
        '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px">' +
        '<button type="button" class="btn" id="prompt-no">Cancel</button>' +
        '<button type="button" class="btn go" id="prompt-yes">Forward</button></div></form>';
      document.body.appendChild(box);

      var remote = document.getElementById('fw-remote');
      var local = document.getElementById('fw-local');
      var mark = function () {
        box.querySelectorAll('.fw-port').forEach(function (chip) { chip.classList.toggle('on', chip.dataset.port === remote.value); });
      };
      // The local port follows the remote one until somebody changes it on purpose.
      var localTouched = false;
      local.addEventListener('input', function () { localTouched = true; });
      remote.addEventListener('input', function () { if (!localTouched) local.value = here(remote.value); mark(); });
      box.querySelectorAll('.fw-port').forEach(function (chip) {
        chip.addEventListener('click', function () {
          remote.value = chip.dataset.port;
          if (!localTouched) local.value = here(chip.dataset.port);
          mark();
        });
      });
      mark();
      remote.focus();
      remote.select();

      var close = function (value) {
        if (!box.parentNode) return;
        box.remove();
        resolve(value);
      };
      var submit = function () {
        var r = Number(remote.value);
        var l = local.value === '' ? 0 : Number(local.value);
        if (!Number.isInteger(r) || r < 1 || r > 65535) { remote.focus(); return; }
        if (!Number.isInteger(l) || l < 0 || l > 65535) { local.focus(); return; }
        close({ remote: r, local: l, open: document.getElementById('fw-open').checked });
      };
      // Not a form submit: the frame is sandboxed without allow-forms, so a submit never fires.
      onAnswer(box, submit, function () { close(null); });
    });
  }

  /**
   * Enter and the button answer a dialog; Escape and Cancel close it.
   *
   * Wired by hand because this frame's sandbox is `allow-scripts` alone, and
   * without `allow-forms` the browser drops a form submission before any
   * `submit` event exists — so a dialog built on one looked right and did
   * nothing at all when OK or Enter was pressed. Scale and Forward both were.
   */
  function onAnswer(box, yes, no) {
    box.querySelector('#prompt-yes').addEventListener('click', yes);
    box.querySelector('#prompt-no').addEventListener('click', no);
    box.addEventListener('keydown', function (event) {
      // Stopped here: the panel's own Escape closes the detail pane, and one key should close one thing.
      if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); no(); }
      else if (event.key === 'Enter' && event.target.tagName === 'INPUT') { event.preventDefault(); yes(); }
    });
  }

  /**
   * What is ticked, and what can be done to all of it at once.
   *
   * It lives in the same strip as the port-forwards because it is the same kind
   * of thing: something that is going on, that you can end. And the count is in
   * every sentence, because "delete these" with an unread number beside it is
   * how the wrong number of things get deleted.
   */
  function drawPicked() {
    var bar = document.getElementById('picked');
    if (!state.picked.length) { bar.innerHTML = ''; return; }
    var rows = pickedRows();
    if (!rows.length) { bar.innerHTML = ''; return; }
    var kind = rows[0].kind || 'object';
    var restartable = rows.every(function (row) { return row.restartable; });
    // While the lot is being done, the bar says so and offers nothing: a second press was a second batch.
    if (state.bulkBusy) {
      bar.innerHTML = '<span role="status"><span class="spin" aria-hidden="true">◐</span> ' + esc(state.bulkBusy) + '</span>';
      return;
    }
    var hidden = state.picked.length - rows.length;
    bar.innerHTML = '<span>' + rows.length + ' ' + esc(kind) + (rows.length === 1 ? '' : 's') + ' ticked' +
      (hidden > 0 ? ' <span class="dim" title="Ticked, and not in what is shown now. They are left alone.">· ' + hidden + ' more not shown</span>' : '') + '</span>' +
      (restartable ? '<button class="btn" data-do="pick-restart">Restart them…</button>' : '') +
      '<button class="btn bad" data-do="pick-delete">Delete them…</button>' +
      '<button class="btn" data-do="pick-none">Clear</button>';
  }

  function pickedRows() {
    // Of the rows on show: one ticked and then filtered away is not something to delete by a button that says "them".
    return visible().slice(0, CAP).filter(function (row) { return state.picked.indexOf(row.uid) >= 0; });
  }

  /**
   * Every forward this panel holds, and where each stands.
   *
   * The address is the thing people want, so it is the thing drawn largest:
   * clicked, it is copied. The cluster is named only when it is not the one on
   * screen, because a forward into production is still open while you are
   * looking at staging.
   */
  function drawBar() {
    if (!state.forwards.length) { $('bar').innerHTML = ''; return; }
    $('bar').innerHTML = '<span class="dim">Forwarding</span>' + state.forwards.map(pillFor).join('');
  }

  function pillFor(forward) {
    var target = esc(forward.kind && forward.kind !== 'pod' ? forward.kind + '/' + forward.name : forward.name) + ':' + forward.remote;
    var where = forward.context && forward.context !== state.context ? ' <span class="dim">(' + esc(shortContext(forward.context)) + ')</span>' : '';
    var tip = (forward.namespace ? forward.namespace + ' · ' : '') + shortContext(forward.context || '') + (forward.warning ? '\n' + forward.warning : '');
    var label;
    var cls = '';
    if (forward.state === 'up') {
      cls = ' up';
      label = '<span class="addr" data-copy-forward="' + esc(forward.id) + '" title="Copy the address">localhost:' + forward.port + '</span> → ' + target + where +
        (forward.warning ? ' <span class="warn-text" title="' + esc(forward.warning) + '">⚠</span>' : '') +
        '<button class="btn" data-open-forward="' + esc(forward.id) + '" title="Open http://localhost:' + forward.port + ' in the browser">↗</button>';
    } else if (forward.state === 'reconnecting') {
      cls = ' retry';
      label = '<span class="spin">↻</span> ' + (forward.port ? 'localhost:' + forward.port + ' → ' : '') + target + where +
        ' <span class="dim" title="' + esc(forward.error || '') + '">reconnecting</span>';
    } else if (forward.state === 'failed') {
      cls = ' failed';
      label = target + where + ' <span class="bad-text">' + esc(forward.error || 'stopped') + '</span>' +
        '<button class="btn" data-retry-forward="' + esc(forward.id) + '" title="Forward it again">Try again</button>';
    } else {
      label = 'starting ' + target + where + '…';
    }
    return '<span class="pill' + cls + '" title="' + esc(tip) + '">' + label +
      '<button class="btn" data-stop="' + esc(forward.id) + '" title="' + (forward.state === 'failed' ? 'Dismiss' : 'Stop forwarding') + '">✕</button></span>';
  }

  // The strip and the detail pane draw the same pills; one listener serves both.
  document.addEventListener('click', function (event) {
    if (!event.target.closest || !event.target.closest('#bar, .detail-forwards')) return;
    var retry = event.target.closest('[data-retry-forward]');
    if (retry) {
      var failed = state.forwards.filter(function (one) { return one.id === retry.dataset.retryForward; })[0];
      if (!failed) return;
      state.forwards = state.forwards.filter(function (one) { return one.id !== failed.id; });
      drawBar();
      // The port it had, so whatever pointed at it works again — unless that port was the trouble.
      var taken = /already in use/i.test(failed.error || '');
      forward({ context: failed.context, namespace: failed.namespace, name: failed.name, forwardKind: failed.kind }, failed.remote, taken ? 0 : (failed.port || failed.asked || 0), false);
      return;
    }
    var open = event.target.closest('[data-open-forward]');
    if (open) { openForward(open.dataset.openForward); return; }
    var copy = event.target.closest('[data-copy-forward]');
    if (copy) {
      var held = state.forwards.filter(function (one) { return one.id === copy.dataset.copyForward; })[0];
      if (held && held.port) { host.emit('copy', { text: 'localhost:' + held.port }); say('Copied localhost:' + held.port + '.'); }
      return;
    }
    var button = event.target.closest('[data-stop]');
    if (!button) return;
    var id = button.dataset.stop;
    var gone = state.forwards.filter(function (one) { return one.id === id; })[0];
    // A failed one is already stopped; dismissing it asks nothing of the app.
    if (!gone || gone.state !== 'failed') call('kube.stopForward', { id: id }).catch(function () {});
    delete state.openWhenUp[id];
    state.forwards = state.forwards.filter(function (forward) { return forward.id !== id; });
    drawBar();
    drawTableSoon();
    if (state.selected) drawDetailButtonsSoon();
  });

  /**
   * Asking for one value, without `prompt`.
   *
   * A sandboxed frame is not allowed to open a modal, and should not be: a
   * panel that can stop the app dead is a panel that can hold it hostage. So
   * the question is drawn, and answered by resolving — the caller waits on a
   * promise instead of on the browser, and cancelling resolves with null rather
   * than leaving anybody hanging.
   */
  function askFor(question, initial) {
    return new Promise(function (resolve) {
      var existing = document.getElementById('prompt');
      if (existing) existing.remove();

      var box = document.createElement('div');
      box.id = 'prompt';
      box.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,0.45);z-index:9';
      box.innerHTML = '<form style="background:var(--bg-panel);border:1px solid var(--border-strong);' +
        'border-radius:var(--radius);padding:14px 16px;min-width:280px;max-width:82vw">' +
        '<div style="margin-bottom:9px;white-space:pre-wrap">' + esc(question) + '</div>' +
        '<input id="prompt-value" value="' + esc(initial) + '" style="width:100%;font:inherit;color:var(--text);' +
        'background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px" />' +
        '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:11px">' +
        '<button type="button" class="btn" id="prompt-no">Cancel</button>' +
        '<button type="button" class="btn go" id="prompt-yes">OK</button></div></form>';
      document.body.appendChild(box);

      var field = document.getElementById('prompt-value');
      field.focus();
      field.select();

      var close = function (value) {
        if (!box.parentNode) return;
        box.remove();
        resolve(value);
      };
      onAnswer(box, function () { close(field.value); }, function () { close(null); });
    });
  }

  /* ---------------------------------------------------------------------- *
   * Copying, from wherever the pointer is.
   *
   * A row's name, the value in one cell, the whole row, or the command that
   * gets the same object from a terminal — by right-clicking it, the gesture
   * a table answers everywhere else. And anywhere else in the panel, whatever
   * is selected. The frame has no clipboard of its own, so every one of these
   * goes through the app.
   * ---------------------------------------------------------------------- */
  function copyText(text, what) {
    host.emit('copy', { text: text });
    say('Copied ' + (what || (text.length > 60 ? text.split('\n').length + ' line' + (text.indexOf('\n') >= 0 ? 's' : '') : text)) + '.');
  }

  function menuAt(items, near) {
    closeRowMenu();
    var menu = document.createElement('div');
    menu.className = 'row-menu';
    menu.innerHTML = items.map(function (item, at) {
      if (item === '-') return '<hr class="menu-rule" />';
      return '<button class="btn" data-menu-item="' + at + '"' + (item.disabled ? ' disabled' : '') + '>' + esc(item.label) +
        (item.hint ? '<span class="menu-hint">' + esc(item.hint) + '</span>' : '') + '</button>';
    }).join('');
    document.body.appendChild(menu);
    var below = window.innerHeight - near.clientY > menu.offsetHeight + 8;
    menu.style.left = Math.max(6, Math.min(near.clientX, window.innerWidth - menu.offsetWidth - 6)) + 'px';
    menu.style.top = Math.max(6, below ? near.clientY + 2 : near.clientY - menu.offsetHeight - 2) + 'px';
    menu.addEventListener('click', function (click) {
      var button = click.target.closest('[data-menu-item]');
      if (!button) return;
      var item = items[Number(button.dataset.menuItem)];
      closeRowMenu();
      if (item && item.run) item.run();
    });
    setTimeout(function () { document.addEventListener('click', closeRowMenu, { once: true }); }, 0);
  }

  /** The kubectl line that reads this object, aimed at the same cluster this panel is. */
  function kubectlFor(row) {
    var kind = (row.kind || titleOf(state.view.name) || '').toLowerCase();
    return 'kubectl --context ' + shellWord(state.context || '') +
      (row.namespace ? ' -n ' + shellWord(row.namespace) : '') + ' get ' + shellWord(kind) + ' ' + shellWord(row.name) + ' -o yaml';
  }
  function shellWord(value) {
    value = String(value);
    return /^[\w@%+=:,./-]+$/.test(value) ? value : "'" + value.replace(/'/g, "'\\''") + "'";
  }

  document.addEventListener('contextmenu', function (event) {
    // The log answers for itself (see above), and a field keeps its own menu.
    if (event.target.closest('.dock-body, #subtabs, input, textarea, select')) return;
    var selected = String(window.getSelection() || '');
    var tr = event.target.closest('#table tbody tr[data-uid]');
    var row = null;
    if (tr && state.table) {
      row = (state.table.rows || []).filter(function (one) { return one.uid === tr.dataset.uid; })[0] || null;
    }
    if (!row && !selected) return;
    event.preventDefault();

    var items = [];
    if (selected) items.push({ label: 'Copy selection', hint: selected.length > 40 ? selected.split('\n').length + ' lines' : '', run: function () { copyText(selected); } });
    if (row) {
      if (items.length) items.push('-');
      items.push({ label: 'Copy name', hint: row.name, run: function () { copyText(row.name); } });
      if (row.namespace) items.push({ label: 'Copy namespace/name', run: function () { copyText(row.namespace + '/' + row.name); } });
      var td = event.target.closest('td');
      var cells = tr.children;
      var index = Array.prototype.indexOf.call(cells, td);
      var heading = index >= 0 ? document.querySelectorAll('#table thead th')[index] : null;
      var value = td && !td.classList.contains('name') && !td.querySelector('button, input') ? td.textContent.trim() : '';
      if (value && heading) {
        items.push({ label: 'Copy ' + heading.textContent.replace(/[↑↓]/g, '').trim().toLowerCase(), hint: value, run: function () { copyText(value); } });
      }
      items.push({ label: 'Copy row', run: function () { copyText(cellsOf(tr).join('\t'), 'the row'); } });
      items.push({ label: 'Copy kubectl command', hint: 'get -o yaml', run: function () { copyText(kubectlFor(row), 'the kubectl command'); } });
      items.push('-');
      items.push({ label: 'Open', run: function () { select(row.uid); } });
      if (row.kind === 'Pod') items.push({ label: 'Show log', run: function () { openLog(row); } });
    }
    menuAt(items, event);
  });

  // The name at the top of the detail pane copies itself: it is the thing most often wanted from it.
  document.addEventListener('click', function (event) {
    var name = event.target.closest('.detail-head h3');
    if (!name || !state.selected || String(window.getSelection() || '')) return;
    copyText(state.selected.name);
  });

  /* ---------------------------------------------------------------------- *
   * Keys, the timer, and starting up.
   * ---------------------------------------------------------------------- */
  document.addEventListener('keydown', function (event) {
    /*
     * Copy whatever is selected, wherever it is.
     *
     * The buttons cover the things worth copying whole; this covers everything
     * else — half a log line, one field of a description, a pod's name out of a
     * table. A frame in an origin of its own cannot reach the clipboard, so the
     * app is asked, and the selection is read before anything can clear it.
     */
    if ((event.metaKey || event.ctrlKey) && event.key === 'c') {
      var selected = String(window.getSelection() || '');
      if (selected) {
        event.preventDefault();
        host.emit('copy', { text: selected });
        say('Copied ' + selected.split('\n').length + ' line' + (selected.indexOf('\n') >= 0 ? 's' : '') + '.');
      }
      return;
    }
    if (event.key === 'Escape' && document.querySelector('.row-menu')) {
      // A menu is the nearest thing open: it goes, and what was selected before it comes back.
      dismissMenu();
      event.preventDefault();
      return;
    }
    if (event.key === 'Escape' && event.target && event.target.id === 'search') {
      // In the filter, Escape is about the filter: empty it, then leave it.
      if (event.target.value) { event.target.value = ''; event.target.dispatchEvent(new Event('input', { bubbles: true })); }
      else event.target.blur();
      return;
    }
    if (event.key === 'Escape') {
      // The question closes itself; this is only for what is behind it.
      if (state.selected && state.detail.tab === 'yaml' && state.editingYaml && state.yamlView !== 'edit' && !document.getElementById('prompt')) {
        act('yaml-diff-close');
        return;
      }
      if (document.getElementById('prompt') || state.editing || state.applying) return;
      // Looking at the changes, Escape goes back to the edit; in an editor nothing was typed into, out of it.
      if (state.selected && state.detail.tab === 'yaml' && state.editingYaml) {
        if (state.yamlView !== 'edit') act('yaml-diff-close'); else act('yaml-revert');
        return;
      }
      // The same close the × does, so both leave the panel in one state.
      closeDetail();
      return;
    }
    /*
     * The panel's own keys never reach into somebody's typing. `/` jumped to
     * the filter from the image field of Configure — so `registry.io/app` could
     * not be typed — and ↓ in the YAML editor moved to the next row and threw
     * the edit away. Anything a person is typing into keeps its keys.
     */
    var typing = event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName || '') || (event.target && event.target.isContentEditable);
    if (typing) return;
    // Nothing behind a question, a sheet or a form answers to keys meant for it.
    if (document.getElementById('prompt') || document.getElementById('sheet') || document.getElementById('map-form') || document.getElementById('cluster-menu')) return;
    if (event.key === '/') {
      event.preventDefault();
      $('search').focus();
      return;
    }
    if (event.key === '?') { event.preventDefault(); showKeys(); return; }
    if (state.selected && !event.metaKey && !event.ctrlKey && !event.altKey) {
      var paneTabs = document.querySelectorAll('aside .tabs [data-tab]');
      if (/^[1-9]$/.test(event.key) && paneTabs[Number(event.key) - 1]) { event.preventDefault(); paneTabs[Number(event.key) - 1].click(); return; }
      if (event.key === 'e' && document.querySelector('aside .tabs [data-tab="yaml"]')) {
        event.preventDefault();
        if (state.detail.tab !== 'yaml') document.querySelector('aside .tabs [data-tab="yaml"]').click();
        // The manifest may still be on its way: the editor opens when it is here.
        var tries = 0;
        var openEditor = function () {
          var edit = document.querySelector('[data-do="yaml-edit"]');
          if (edit && !edit.disabled && state.detailData.yaml != null) { act('yaml-edit'); return; }
          if (!state.editingYaml && (tries += 1) < 40) setTimeout(openEditor, 100);
        };
        openEditor();
        return;
      }
    }
    if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && state.table) {
      var rows = visible();
      if (!rows.length) return;
      var at = -1;
      for (var i = 0; i < rows.length; i += 1) if (state.selected && rows[i].uid === state.selected.uid) at = i;
      var next = event.key === 'ArrowDown' ? Math.min(rows.length - 1, at + 1) : Math.max(0, at - 1);
      event.preventDefault();
      select(rows[next].uid);
    }
  });

  /**
   * Refreshing, paced by how long refreshing actually takes.
   *
   * This used to be an interval: every ten seconds, ask again. On a cluster on
   * another continent a `pods --all-namespaces` takes four to seven seconds and
   * returns four megabytes, so ten seconds meant asking again before the last
   * answer had arrived — and because a quiet refresh never set the flag the
   * interval checked, they stacked up rather than skipping. A slow cluster got
   * two or three of them in flight at once, which is the sort of thing an API
   * server rate-limits you for.
   *
   * So: wait after the answer, not after the question, and wait longer when the
   * cluster is slow. A cluster that answers in half a second is polled every
   * ten; one that takes six is polled every eighteen, which is the same
   * *fraction* of its time rather than the same clock.
   */
  function scheduleRefresh() {
    var took = state.tookMs || 0;
    var wait = Math.max(state.everyMs, Math.min(60000, took * 3));
    /*
     * With a watch open this is no longer the way the table stays true — it is
     * the safety net under it. A watch can miss the second between the list and
     * itself, and a table that is quietly wrong is worse than one that is
     * slowly right, so it is still read from time to time. Rarely.
     */
    if (state.watch.id) wait = Math.max(wait, 120000);
    // The map is the whole cluster read at once. It is kept current, not kept busy.
    if (state.view.type === 'map') wait = Math.max(wait, 45000);
    setTimeout(function () {
      scheduleRefresh();
      // `showing` is the app saying whether this tab is in front; `hidden` is
      // the browser saying whether the window is. Either one means nobody is
      // looking, and a cluster nobody is looking at is not worth asking.
      if (!state.live || state.busy || state.loading || document.hidden || state.showing === false) return;
      // Never while a question is open: it would redraw the thing behind it.
      // A followed log is no longer a reason to stop — a quiet refresh leaves
      // the dock alone, so there is nothing of the reader's for it to disturb.
      if (document.getElementById('prompt')) return;
      load(true);
    }, wait);
  }
  scheduleRefresh();

  /**
   * Whether this tab is in front.
   *
   * Coming back to a panel that has been sitting behind another tab, the first
   * thing worth doing is finding out what changed while it was away — so it
   * refreshes on the way in rather than waiting out the rest of its timer.
   */
  host.on('showing', function (payload) {
    var was = state.showing;
    state.showing = !payload || payload.showing !== false;
    if (!state.showing) {
      // A table nobody is looking at does not need to be kept true, and a watch
      // is a connection held open against a cluster.
      stopWatch();
      return;
    }
    // Its first look: everything it needs, now that somebody wants it.
    if (!state.started) { begin(); return; }
    // Coming back: find out what changed while it was away, rather than
    // waiting out the rest of a timer.
    if (was === false && state.live && !state.busy) load(true);
  });

  window.addEventListener('resize', function () {
    // The edges move with the window, so the columns are recalculated against
    // the room there is now, and the handles are told where they ended up.
    applyColumns();
    drawGrips();
  });

  $('cluster').addEventListener('click', openClusterMenu);
  // A press anywhere else, or outside the frame altogether, puts the list away.
  document.addEventListener('mousedown', function (event) {
    if (!document.getElementById('cluster-menu')) return;
    if (event.target.closest && (event.target.closest('#cluster-menu') || event.target.closest('#cluster'))) return;
    closeClusterMenu();
  });
  window.addEventListener('blur', closeClusterMenu);
  // Escape puts it away wherever the focus has got to, and gives the focus back to what opened it.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape' || !document.getElementById('cluster-menu')) return;
    event.preventDefault();
    event.stopPropagation();
    closeClusterMenu();
    $('cluster').focus();
  }, true);
  // The app changed kubeconfig — a context removed, another made the default.
  host.on('clusters', function () {
    clusters.stale = true;
    if (document.getElementById('cluster-menu')) readClusters(true);
  });


  /* ---------------------------------------------------------------------- *
   * The keyboard, for everything that is pressed.
   *
   * A row that opens something, a heading that sorts, a card that leads
   * somewhere: each is a thing to press, and Enter or Space presses whatever
   * has the focus. One listener, so a new clickable thing needs only a
   * tabindex and a role to be reachable.
   * ---------------------------------------------------------------------- */
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var target = event.target;
    if (!target || !target.matches || !target.matches('[tabindex][role="link"], [tabindex][role="button"], [tabindex][role="tab"], th[tabindex]')) return;
    event.preventDefault();
    target.click();
  });

  /**
   * Menus and sheets, as they appear.
   *
   * Every menu here is a box of buttons put on the page by whoever opens it,
   * and there are a dozen of them. Rather than teach each one, the page is
   * watched: a menu that arrives is given its role, kept on screen, its first
   * item focused and its arrows wired; a sheet is made modal for the Tab key.
   * When either goes, the focus returns to what opened it.
   */
  function withinView(box) {
    var at = box.getBoundingClientRect();
    if (at.bottom > window.innerHeight - 6) box.style.top = Math.max(6, window.innerHeight - at.height - 6) + 'px';
    if (at.top < 6) box.style.top = '6px';
    if (at.right > window.innerWidth - 6) box.style.left = Math.max(6, window.innerWidth - at.width - 6) + 'px';
  }
  var overlayOpener = null;
  new MutationObserver(function (changes) {
    changes.forEach(function (change) {
      Array.prototype.forEach.call(change.addedNodes, function (node) {
        if (node.nodeType !== 1) return;
        if (node.classList.contains('row-menu')) {
          var opener = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
          node.setAttribute('role', 'menu');
          Array.prototype.forEach.call(node.querySelectorAll('button'), function (item) { item.setAttribute('role', 'menuitem'); });
          // Placed by whoever made it, a moment from now; then pulled back inside the frame if it fell out.
          setTimeout(function () {
            if (!node.isConnected) return;
            withinView(node);
            // Opened from the keyboard, the keyboard goes into it. Opened by the pointer, the focus is left alone.
            if (opener && opener.matches && opener.matches(':focus-visible')) {
              overlayOpener = opener;
              var first = node.querySelector('button:not([disabled])');
              if (first) first.focus();
            }
          }, 0);
          node.addEventListener('keydown', function (event) {
            if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp' && event.key !== 'Home' && event.key !== 'End') return;
            var items = Array.prototype.filter.call(node.querySelectorAll('button'), function (item) { return !item.disabled; });
            if (!items.length) return;
            event.preventDefault();
            var at = items.indexOf(document.activeElement);
            var next = event.key === 'Home' ? 0 : event.key === 'End' ? items.length - 1
              : (at + (event.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
            items[at < 0 && event.key === 'ArrowUp' ? items.length - 1 : next].focus();
          });
        }
        if (node.id === 'sheet' || node.id === 'prompt') {
          var from = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
          var card = node.querySelector('[role="dialog"]') || node.firstElementChild || node;
          card.setAttribute('role', 'dialog');
          card.setAttribute('aria-modal', 'true');
          node.sheetOpener = from;
          node.addEventListener('keydown', function (event) {
            if (event.key !== 'Tab') return;
            var stops = Array.prototype.filter.call(node.querySelectorAll('button, input, select, textarea, [tabindex]'), function (one) {
              return !one.disabled && one.tabIndex >= 0 && one.offsetParent !== null;
            });
            if (!stops.length) return;
            var first = stops[0];
            var last = stops[stops.length - 1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          });
        }
      });
      Array.prototype.forEach.call(change.removedNodes, function (node) {
        if (node.nodeType !== 1) return;
        var back = node.classList.contains('row-menu') ? overlayOpener : (node.id === 'sheet' || node.id === 'prompt') ? node.sheetOpener : null;
        if (node.classList.contains('row-menu')) overlayOpener = null;
        // Only if the focus fell out with it; somebody who has moved on is not pulled back.
        if (back && back.isConnected && (document.activeElement === document.body || !document.activeElement)) back.focus();
      });
    });
  }).observe(document.body, { childList: true });

  /** A menu put away without choosing: what was selected before it comes back. */
  function dismissMenu() {
    if (!document.querySelector('.row-menu')) return false;
    var before = menuRow ? menuWas : state.selected;
    var hadRow = Boolean(menuRow);
    closeRowMenu();
    if (hadRow) { state.selected = before; draw({ keepDock: true }); }
    return true;
  }
  // A menu is fixed to the window; what it was opened on is not. Scrolled, resized or left, it goes.
  document.addEventListener('scroll', function (event) {
    if (event.target && event.target.closest && event.target.closest('.row-menu, #cluster-menu')) return;
    dismissMenu();
  }, { passive: true, capture: true });
  window.addEventListener('resize', function () { dismissMenu(); closeClusterMenu(); });
  window.addEventListener('blur', dismissMenu);

  host.on('theme', function () { /* the app rebuilds the frame; nothing to do here */ });

  host.on('context', function (payload) {
    // The app says which cluster this tab is for. Without one — opened from
    // Extensions rather than from the sidebar — kubeconfig's own current
    // context is the only sensible default.
    if (payload && payload.context) state.context = payload.context;
    if (payload && payload.showing === false) state.showing = false;
    // Where this panel was before the frame was rebuilt, if it was anywhere.
    if (payload) resume(payload.resume);
    /*
     * A tab that is not in front does not go and read a cluster.
     *
     * These stay mounted so a followed log survives a tab switch, which means
     * five restored cluster tabs would otherwise all start at once — fifteen
     * kubectl processes and fifteen credential plugins racing at launch, some
     * of them against clusters that will take twenty seconds to time out.
     * Nothing happens here until somebody looks.
     */
    if (state.showing) begin();
  });

  /** Everything this tab needs, the first time it is looked at. */
  function begin() {
    state.started = true;
    start().catch(function (error) {
      state.error = String(error.message || error);
      state.loading = false;
      draw();
    });
  }

  $('subtabs').addEventListener('click', function (event) {
    var close = event.target.closest('[data-subtab-close]');
    if (close) { event.stopPropagation(); closeTab(Number(close.dataset.subtabClose)); return; }
    if (event.target.closest('[data-subtab-new]')) { newTab(null); return; }
    var split = event.target.closest('[data-subtab-split]');
    if (split) { openBeside(state.tabAt, split.dataset.subtabSplit); return; }
    var tab = event.target.closest('[data-subtab]');
    if (tab) switchTab(Number(tab.dataset.subtab));
  });
  $('subtabs').addEventListener('contextmenu', function (event) {
    var tab = event.target.closest('[data-subtab]');
    if (!tab) return;
    event.preventDefault();
    subtabMenu(Number(tab.dataset.subtab), event);
  });
  // The middle button closes a subtab, as it closes a tab everywhere else.
  $('subtabs').addEventListener('auxclick', function (event) {
    var tab = event.target.closest('[data-subtab]');
    if (tab && event.button === 1) { event.preventDefault(); closeTab(Number(tab.dataset.subtab)); }
  });

  /*
   * ⌘-click (or the middle button) on anything that goes somewhere opens it in
   * a new subtab and leaves this one where it is. Caught before the ordinary
   * handlers, which would otherwise take this subtab there as well.
   */
  function openElsewhere(event) {
    var el = event.target.closest('[data-kind], [data-go], [data-namespace], [data-view=overview], [data-view=helm]');
    if (!el || el.closest('#subtabs')) return false;
    var place = placeFor(el);
    if (!place) return false;
    event.preventDefault();
    event.stopPropagation();
    newTab(place);
    return true;
  }
  document.addEventListener('click', function (event) {
    if (event.metaKey || event.ctrlKey) openElsewhere(event);
  }, true);
  document.addEventListener('auxclick', function (event) {
    if (event.button === 1) openElsewhere(event);
  }, true);

  drawTabs();
  draw();
  host.ready();
</script>
