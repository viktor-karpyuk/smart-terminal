<style>
  /*
   * A dashboard for a cluster, drawn in a frame that has no idea what a cluster
   * is. Everything it knows arrives through `host.call`, and everything it looks
   * like comes from the app's own tokens — so it is the app's light or dark, its
   * accent and its radius, without knowing which of them it is in.
   */
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; height: 100%; min-height: 0; }

  .top {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    background: var(--bg-panel); flex-wrap: wrap;
  }
  .top select, .top input {
    font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px 7px; max-width: 260px;
  }
  .top select:focus, .top input:focus { outline: none; border-color: var(--accent); }
  #search { flex: 1; min-width: 120px; max-width: none; }
  .spacer { flex: 1; }

  .btn {
    padding: 4px 9px; border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text-dim); white-space: nowrap;
  }
  .btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-elevated); }
  .btn.on { color: var(--accent); border-color: var(--accent); }
  .btn.go { color: var(--accent); border-color: var(--accent); }
  /*
   * A button that takes something away looks like one before the pointer is on
   * it. It only turned red on hover, which is exactly too late: Delete, Drain
   * and Uninstall sat in a row looking like Logs, and the difference between
   * them showed up at the moment somebody was already committing to a click.
   */
  .btn.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
  .btn.bad:hover { color: var(--danger); border-color: var(--danger); background: rgba(247, 118, 142, 0.10); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  .gap { flex: 1; min-width: 8px; }

  /* The columns are set from script, so they can be dragged. The values here
     are only what they start at. */
  /* `overflow: hidden` is what keeps the overview inside its own row. Squeezed
     to nothing — by a log dragged to the top of the panel, or by one filling
     the window — the crumb still wants its thirty-odd pixels, and `.body` is
     positioned, so it paints them straight over the log's tabs. Clipped, the
     row that has no height shows nothing. */
  .body { display: grid; grid-template-columns: 178px 1fr; min-height: 0; overflow: hidden; }
  .body.with-detail { grid-template-columns: 178px 1fr 34%; }

  /* The line between two columns, wide enough to grab and quiet until you do —
     the same handle the log drawer has, standing up. */
  .grip {
    position: absolute; top: 0; bottom: 0; width: 7px; margin-left: -4px;
    cursor: col-resize; z-index: 3;
  }
  .grip:hover, .grip.is-held { background: var(--accent-soft); }

  nav {
    overflow-y: auto; border-right: 1px solid var(--border);
    padding: 6px 0 20px; background: var(--bg-panel);
  }
  nav h4, .nav-group {
    margin: 10px 0 2px; font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint);
  }
  nav h4 { margin-left: 10px; }
  .nav-sub { margin: 7px 0 2px 22px !important; opacity: 0.75; }
  nav button {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    padding: 4px 10px; color: var(--text-dim); font-size: 12px;
  }
  .nav-group { padding: 4px 10px; }
  .nav-group:hover { color: var(--text); }
  .nav-group.is-open { color: var(--text-dim); }
  /* Big enough to read as a state rather than as punctuation: this is the one
     mark that says whether a group is open, so it is the size of the text it
     sits beside, not the size of a bullet. */
  .twist { display: inline-block; width: 12px; font-size: 12px; line-height: 1; opacity: 0.85; }
  .nav-item { padding-left: 25px; }
  nav button:hover { background: var(--bg-elevated); color: var(--text); }
  nav button.on { background: var(--accent-soft); color: var(--accent); }
  nav .count { margin-left: auto; font-size: 10px; color: var(--text-faint); }
  nav button.on .count { color: var(--accent); }

  main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  .crumb {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
  }
  .crumb strong { color: var(--text); font-weight: 550; font-size: 12px; }
  .scroll { overflow: auto; min-height: 0; }

  table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  th.tick, td.tick { width: 24px; padding-right: 0; }
  td.tick input, th.tick input { cursor: pointer; margin: 0; vertical-align: middle; }
  th.more, td.more { width: 22px; padding: 0; text-align: center; }
  td.more button { color: var(--text-faint); padding: 2px 4px; border-radius: var(--radius); opacity: 0; }
  tbody tr:hover td.more button, tbody tr.on td.more button { opacity: 1; }
  td.more button:hover { color: var(--text); background: var(--bg-elevated); }
  .row-menu {
    position: fixed; z-index: 8; display: flex; flex-direction: column; gap: 2px; padding: 4px;
    background: var(--bg-elevated); border: 1px solid var(--border-strong);
    border-radius: var(--radius); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
  }
  .row-menu .btn { border-color: transparent; text-align: left; }
  .row-menu .btn:hover { border-color: var(--border); }

  th {
    position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 550;
    padding: 5px 9px; background: var(--bg-panel); color: var(--text-faint);
    border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .arrow { opacity: 0.55; margin-left: 3px; }
  td { padding: 4px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.grow { white-space: normal; word-break: break-word; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg-elevated); }
  tbody tr.on { background: var(--accent-soft); }
  .name { color: var(--text); }
  .dim { color: var(--text-dim); }
  .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace; font-size: 10.5px; }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--git-new); }
  .dot.bad { background: var(--danger); }
  .dot.idle { background: var(--text-faint); }
  .bad-text { color: var(--danger); }
  .warn-text { color: var(--git-new); }

  aside {
    border-left: 1px solid var(--border); background: var(--bg-panel);
    display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0;
  }
  .detail-head { padding: 8px 10px 6px; border-bottom: 1px solid var(--border); }
  .detail-head h3 { margin: 0 0 2px; font-size: 12.5px; font-weight: 550; word-break: break-all; }
  .detail-head small { color: var(--text-dim); font-size: 10.5px; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .tabs { display: flex; gap: 2px; padding: 5px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tabs button { padding: 3px 8px; border-radius: var(--radius); color: var(--text-dim); font-size: 11px; }
  .tabs button:hover { background: var(--bg-elevated); color: var(--text); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); }
  .detail-body { overflow: auto; padding: 9px 10px 16px; min-height: 0; }

  pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.55; color: var(--text-dim);
  }
  pre.wrapless { white-space: pre; word-break: normal; }
  /* Full strength, not the dimmed grey the rest of the prose uses: a log is
     read line by line, often at speed, and dim text is the wrong trade there. */
  .dock-body pre { color: var(--text); }
  .log-line.err { color: var(--danger); }

  .yaml-tools { display: flex; align-items: center; gap: 5px; margin-bottom: 7px; flex-wrap: wrap; }
  .yaml-tools .dim { font-size: 10.5px; }
  #yaml-edit {
    width: 100%; min-height: 320px; height: calc(100% - 34px); resize: vertical;
    font-family: "JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.55; tab-size: 2;
    color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 8px;
    white-space: pre; overflow-wrap: normal; overflow-x: auto;
  }
  #yaml-edit:focus { outline: none; border-color: var(--accent); }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11px; }
  .facts dt { color: var(--text-faint); }
  .facts dd { margin: 0; color: var(--text); word-break: break-word; }

  /*
   * Two charts of the same size, always. Side by side while there is room for
   * both, stacked when there is not — never one wide and one narrow, which is
   * what a row of three flexing items gave: the reader compares their shapes,
   * and two different widths make the same shape look like two.
   */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 0 0 12px; }
  .chart {
    flex: 1 1 220px; min-width: 190px;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 9px 5px;
    background: var(--bg-panel);
  }
  .chart-range { display: flex; gap: 4px; justify-content: flex-end; margin: 0 0 6px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 10.5px; color: var(--text-faint); }
  .chart-head b { font-size: 13px; font-weight: 550; color: var(--text); }
  .chart svg { display: block; width: 100%; height: 46px; margin: 3px 0 2px; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .chart-fill { fill: var(--accent-soft); stroke: none; }
  .chart-foot { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-faint); }
  .chart.is-read { border-color: var(--accent); }
  .chart.is-read .chart-when { color: var(--accent); }
  .chart-cursor { stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0.7; }
  .chart-range { display: flex; align-items: flex-start; gap: 4px; }
  .chart-range .btn { padding: 2px 7px; font-size: 10.5px; }

  /* On the overview the charts sit under the cards, so they take that padding. */
  #table > .charts { padding: 0 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; padding: 12px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; background: var(--bg-panel); }
  .card b { display: block; font-size: 21px; font-weight: 500; line-height: 1.2; }
  .card span { font-size: 10.5px; color: var(--text-faint); }
  .card.bad b { color: var(--danger); }
  .card.warn b { color: var(--git-new); }

  /* Capacity: one bar carrying two facts, promised behind and used in front. */
  .gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; padding: 0 12px 12px; }
  .gauge { border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; background: var(--bg-panel); }
  .gauge-head { display: flex; align-items: baseline; gap: 5px; font-size: 10.5px; color: var(--text-faint); }
  .gauge-head span:first-child { flex: 1; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .gauge-head b { font-size: 15px; font-weight: 550; color: var(--text); }
  .gauge-bar {
    position: relative; height: 9px; margin: 7px 0 6px; border-radius: 99px;
    background: var(--bg-input); overflow: hidden;
  }
  .gauge-bar span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; }
  .gauge-req { background: var(--accent-soft); }
  .gauge-use { background: var(--accent); height: 4px !important; top: 2.5px !important; }
  .gauge-use.is-over { background: var(--git-new); }
  .gauge-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--text-faint); }
  .gauge-foot i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: baseline; }
  .key-req { background: var(--accent-soft); }
  .key-use { background: var(--accent); }
  .key-use.is-over { background: var(--git-new); }

  /* Two blocks side by side where there is room, stacked where there is not. */
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; padding: 0 12px 12px; }
  .panel-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px 7px; background: var(--bg-panel); }
  .panel-block h4 {
    margin: 0 0 7px; font-size: 9.5px; font-weight: 600; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .panel-block h4 .dim { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .panel-block table { font-size: 11px; }
  .panel-block td { border-bottom: 0; padding: 2px 8px 2px 0; }

  .meter { display: flex; align-items: center; gap: 7px; font-size: 11px; padding: 2px 0; }
  .meter-name { flex: 0 0 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
  .meter-track { flex: 1; height: 6px; border-radius: 99px; background: var(--bg-input); overflow: hidden; }
  .meter-track.wide { flex: 2; }
  .meter-track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .meter-track i.is-warn { background: var(--git-new); }
  .meter-track i.is-bad { background: var(--danger); }
  .meter-num { flex: 0 0 auto; min-width: 34px; text-align: right; color: var(--text-dim); font-size: 10.5px; }
  .meter-legend { display: flex; gap: 7px; font-size: 9.5px; color: var(--text-faint); padding-top: 3px; }
  .meter-legend span:nth-child(1) { flex: 0 0 34%; }
  .meter-legend span:nth-child(2), .meter-legend span:nth-child(4), .meter-legend span:nth-child(6) { flex: 1; }
  /* Inside a half-width block the names must give way to the numbers. */
  .half .meter-name { flex: 0 0 44%; }
  .half .meter-num { min-width: 44px; }

  .halves { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .half h5 { margin: 0 0 4px; font-size: 9.5px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.07em; }
  .all-well { margin: 2px 0 4px; font-size: 11.5px; color: var(--text-dim); }
  tbody tr.clickable { cursor: default; }

  /* Pressure: rare, and worth the room when it is there. */
  .pressure {
    margin: 0 12px 12px; padding: 8px 11px; font-size: 11.5px;
    border: 1px solid var(--danger); border-radius: var(--radius);
    background: rgba(247, 118, 142, 0.08); color: var(--text);
  }
  .pressure b { color: var(--danger); font-weight: 600; }

  /*
   * The same ink as the app's editor, so the same manifest is the same colours
   * wherever it is read. Copied rather than shared because this frame has an
   * origin of its own and cannot reach the app's stylesheet; a test compares the
   * rules that produce the spans, which is the half that can be wrong quietly.
   */
  .y-key { color: #7aa2f7; }
  .y-str { color: #9ece6a; }
  .y-num { color: #ff9e64; }
  .y-const, .y-anchor { color: #bb9af7; }
  .y-tag, .y-block { color: #e0af68; }
  .y-punct, .y-colon, .y-dash { color: #7b849c; }
  .y-comment { color: #565f89; font-style: italic; }
  .y-doc { color: #565f89; }

  /* A manifest is read far more often than it is edited: give it room. */
  pre.yaml, #yaml-edit {
    font-size: 11.5px; line-height: 1.55; tab-size: 2;
  }
  pre.yaml { margin: 0; padding: 10px 12px; white-space: pre; overflow: auto; }

  .containers { width: 100%; font-size: 11px; }
  .containers td { padding: 2px 0; }
  .containers td.dim { padding-left: 10px; word-break: break-all; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    font-size: 10.5px; padding: 1px 6px; border-radius: var(--radius);
    background: var(--bg-input); color: var(--text); white-space: nowrap;
  }
  .chip b { font-weight: 500; color: var(--text-faint); }
  /* Not decoration: it is what makes a copied chip a label selector. */
  .chip i { font-style: normal; color: var(--text-faint); opacity: .6; margin: 0 2px; }

  pre.describe { margin: 0; font-size: 11px; line-height: 1.5; white-space: pre-wrap; }

  /* A block of text with a heading and a way to take a copy of just that. */
  .block { margin: 12px 0 0; }
  .block-head {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 4px; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .block-head .spacer { flex: 1; }
  /*
   * Visible without hovering. A copy button that only appears under the pointer
   * is a copy button nobody knows is there, which is the opposite of what one is
   * for; it is quiet until wanted rather than hidden until found.
   */
  .block-head .btn {
    text-transform: none; letter-spacing: 0; padding: 1px 6px; font-size: 10.5px;
    opacity: .55; transition: opacity .12s;
  }
  .block:hover .block-head .btn, .block-head .btn:hover, .block-head .btn:focus { opacity: 1; }

  tr.is-link { cursor: pointer; }
  tr.is-link:hover { background: var(--bg-elevated); }

  /* Anything that goes somewhere says so before it is clicked. */
  .card.is-link, .gauge.is-link { cursor: pointer; }
  .card.is-link:hover, .gauge.is-link:hover { border-color: var(--accent); }
  .meter[data-node], .meter[data-namespace] { cursor: pointer; border-radius: var(--radius); }
  .meter[data-node]:hover, .meter[data-namespace]:hover { background: var(--bg-elevated); }
  .link { color: var(--accent); padding: 0; font: inherit; }
  .link:hover { text-decoration: underline; }

  .stat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; }
  .stat-tabs { display: flex; gap: 4px; }
  .stat-tabs .btn.on { color: var(--accent); border-color: var(--accent); }
  .charts.one { padding: 0 12px; grid-template-columns: 1fr; }
  .chart.is-big svg { height: 150px; }

  .note { padding: 22px 16px; color: var(--text-dim); font-size: 12px; line-height: 1.6; max-width: 60ch; }
  .note code { font-family: "JetBrains Mono", Menlo, ui-monospace, monospace; font-size: 11px; color: var(--text); }
  .error { color: var(--danger); }

  .cluster-name {
    font-weight: 550; color: var(--text); padding: 3px 0 3px 2px;
    max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Three rows, because there are three children: the grip you drag it by, the
     tabs, and the log. Two rows put the log in an implicit row that sized
     itself to a thousand lines and painted over the tabs. */
  .dock {
    display: grid; grid-template-rows: auto auto minmax(0, 1fr);
    border-top: 1px solid var(--border); background: var(--bg-panel);
  }
  /* A handle you can see and can hit.
     It was five transparent pixels with nothing to say it was a handle, sitting
     above the dock's own top edge where the eye reads them as the gap between
     two things. So people found no way to resize the log and concluded there
     was none. It is taller now, it draws a line to be grabbed by, it lights up
     under the pointer, and it is positioned so that nothing overlapping it can
     take the click. The tab strip below drags it too — see the mousedown. */
  .dock-grip {
    position: relative; z-index: 4;
    height: 9px; margin-top: -5px; cursor: ns-resize; background: transparent;
  }
  .dock-grip::after {
    content: ''; display: block; width: 42px; height: 3px; margin: 3px auto 0;
    border-radius: 2px; background: var(--border);
  }
  .dock-grip:hover::after, .dock-grip.is-held::after { background: var(--accent); }
  .dock-tabs { cursor: ns-resize; }
  .dock-tabs > *, .dock-tools > * { cursor: default; }
  .dock-tabs button, .dock-tabs .btn { cursor: pointer; }
  .dock-tabs input, .dock-tabs select { cursor: text; }

  /* Filling the window: the table's row goes to nothing and the dock's takes
     what is left, so the log is as tall as the panel rather than as tall as
     some number of pixels somebody dragged to. */
  #app.dock-full { grid-template-rows: auto 0 minmax(0, 1fr) auto auto; }
  #dock-slot { min-height: 0; }
  .dock.is-full { height: 100%; }
  .dock-tabs { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .dock-tab {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 8px;
    border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-dim); font-size: 11px;
    max-width: 230px;
  }
  .dock-tab.on { border-color: var(--accent); color: var(--accent); }
  .dock-tab .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-tab .x { opacity: 0.6; padding: 0 2px; }
  .dock-tab .x:hover { opacity: 1; color: var(--danger); }
  .dock-tools { display: flex; align-items: center; gap: 5px; margin-left: auto; }
  .dock-tools input, .dock-tools select {
    font: inherit; font-size: 11px; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 2px 6px; max-width: 170px;
  }
  .dock-tools input:focus, .dock-tools select:focus { outline: none; border-color: var(--accent); }
  .dock-body { overflow: auto; padding: 7px 10px 10px; min-height: 0; }
  .hit { background: var(--accent-soft); color: var(--accent); }

  .bar {
    display: flex; align-items: center; gap: 7px; padding: 5px 10px;
    border-top: 1px solid var(--border); background: var(--bg-panel);
    font-size: 11px; color: var(--text-dim); flex-wrap: wrap;
  }
  .bar:empty { display: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px;
    border: 1px solid var(--border); border-radius: 99px; font-size: 10.5px;
  }
  .ask {
    display: flex; gap: 6px; align-items: center; margin-top: 7px;
  }
  .ask input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 7px; }
  .ask input:focus { outline: none; border-color: var(--accent); }
  .spin { display: inline-block; animation: turn 0.9s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
</style>

<div id="app">
  <header class="top">
    <span id="cluster" class="cluster-name"></span>
    <select id="namespace" title="Which namespace"></select>
    <input id="search" placeholder="Filter by name, namespace or status" />
    <button class="btn" id="terminal" title="Open a terminal aimed at this cluster and namespace">Terminal</button>
    <button class="btn" id="live" title="Refresh on a timer">Live</button>
    <button class="btn" id="reload" title="Refresh now">Refresh</button>
  </header>

  <div class="body" id="body" style="position: relative">
    <nav id="nav"></nav>
    <main>
      <div class="crumb" id="crumb"></div>
      <div class="scroll" id="table"></div>
    </main>
  </div>

  <div id="dock-slot"></div>
  <div class="bar" id="picked"></div>
  <div class="bar" id="bar"></div>
</div>

<script>
  /* ---------------------------------------------------------------------- *
   * The state. One object, because every draw is a function of it — there is
   * no second copy of the truth anywhere in this file.
   * ---------------------------------------------------------------------- */
  var state = {
    context: null,
    namespaces: [], namespace: '',
    resources: [], resourcesFor: null,
    view: { type: 'overview' },
    table: null, loading: false, error: null, counts: {},
    search: '', sort: { column: null, dir: 1 },
    selected: null, detail: { tab: 'overview' }, detailData: {},
    live: true, everyMs: 10000,
    /*
     * The logs open at the bottom. A list, not a field, because the question
     * "why did this one restart when that one did?" is asked by looking at both
     * — and a viewer that can only hold one turns that into clicking back and
     * forth from memory.
     */
    logs: [], logAt: 0, dock: 240, dockOpen: true, dockFull: false,
    forwards: [],
    /** Whether a request is in the air, and how long the last one took. */
    busy: false, tookMs: 0, showing: true, started: false,
    /** Whether a caret is in the YAML box, and what has been typed into it. */
    editing: false, draft: null,
    /** Whether this cluster has releases, asked once rather than on a timer. */
    helm: { checked: false, releases: 0 },
    /** Which rows are ticked, by uid. Ticking is not the same act as opening. */
    picked: [],
    /** A subset a card asked for, and a row a click on the overview wants opened. */
    only: null, wanted: null,
    /** How wide the two columns that can be dragged are. */
    navWidth: 178, detailWidth: 380,
    /** The open watch, if any: what it is watching and whether a redraw is due. */
    watch: { id: null, kind: null, of: null, token: 0, draw: 0 },
    /**
     * How full the nodes' own disks are, when anything is measuring them, and
     * the same per node address — kept across refreshes so a slow answer reads
     * as late rather than as the metric having gone away.
     */
    disk: null, diskByHost: null,
    /** Where this cluster's Prometheus is, and what it has said so far. */
    prom: { checked: false, found: null, series: {}, minutes: 60 },
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /**
   * One call to the app, with its two kinds of failure flattened into one.
   *
   * A rejected promise means the app refused; an `ok: false` means kubectl did.
   * Both are the same thing to draw, and telling them apart at every call site
   * would be twelve copies of the same three lines.
   */
  function call(name, args) {
    return host.call(name, args).then(function (result) {
      if (result && result.ok === false) throw new Error(result.error || 'it did not say why');
      return result || {};
    });
  }

  function say(text, bad) { host.emit('notify', { text: text, kind: bad ? 'bad' : 'ok' }); }

  /** Where we are, as every call below needs it. */
  function where() {
    var at = { context: state.context };
    if (state.namespace) at.namespace = state.namespace;
    else at.allNamespaces = true;
    return at;
  }

  /* ---------------------------------------------------------------------- *
   * The navigation, built from what the cluster says it has.
   *
   * Not a fixed list: half of a real cluster is CRDs somebody's operator
   * installed, and a menu that cannot show them is a menu that is wrong about
   * the cluster it is pointed at. Equally, a cluster without Ingresses does not
   * get an Ingresses entry that answers "the server doesn't have a resource
   * type".
   * ---------------------------------------------------------------------- */
  var GROUPS = [
    { title: 'Cluster', items: ['nodes', 'namespaces', 'events'] },
    { title: 'Workloads', items: ['pods', 'deployments', 'statefulsets', 'daemonsets', 'replicasets', 'jobs', 'cronjobs'] },
    { title: 'Config', items: ['configmaps', 'secrets', 'horizontalpodautoscalers', 'resourcequotas'] },
    { title: 'Network', items: ['services', 'ingresses', 'endpoints', 'networkpolicies'] },
    { title: 'Storage', items: ['persistentvolumeclaims', 'persistentvolumes', 'storageclasses'] },
    { title: 'Access', items: ['serviceaccounts', 'roles', 'rolebindings', 'clusterroles', 'clusterrolebindings'] },
  ];
  var LABELS = {
    nodes: 'Nodes', namespaces: 'Namespaces', events: 'Events',
    pods: 'Pods', deployments: 'Deployments', statefulsets: 'Stateful Sets',
    daemonsets: 'Daemon Sets', replicasets: 'Replica Sets', jobs: 'Jobs', cronjobs: 'Cron Jobs',
    configmaps: 'Config Maps', secrets: 'Secrets',
    horizontalpodautoscalers: 'Autoscalers', resourcequotas: 'Quotas',
    services: 'Services', ingresses: 'Ingresses', endpoints: 'Endpoints', networkpolicies: 'Network Policies',
    persistentvolumeclaims: 'Volume Claims', persistentvolumes: 'Volumes', storageclasses: 'Storage Classes',
    serviceaccounts: 'Service Accounts', roles: 'Roles', rolebindings: 'Role Bindings',
    clusterroles: 'Cluster Roles', clusterrolebindings: 'Cluster Role Bindings',
  };

  function known(name) {
    for (var i = 0; i < state.resources.length; i += 1) {
      if (state.resources[i].name === name) return state.resources[i];
    }
    return null;
  }

  function customResources() {
    var out = [];
    for (var i = 0; i < state.resources.length; i += 1) {
      var resource = state.resources[i];
      if (resource.builtIn) continue;
      out.push(resource);
    }
    out.sort(function (a, b) { return (a.group + a.kind).localeCompare(b.group + b.kind); });
    return out;
  }

  /**
   * Which groups are open.
   *
   * Folded by default except the one holding what is on screen, which is what
   * makes a navigation with a hundred custom resources in it usable: a cluster
   * with Elastic, Argo, Karpenter and Kong installed has more kinds than fit on
   * a screen, and scrolling past six headings to reach Pods is worse than
   * clicking one.
   */
  function openGroups() {
    if (!state.groups) state.groups = { Workloads: true };
    return state.groups;
  }

  function groupHolding(name) {
    for (var g = 0; g < GROUPS.length; g += 1) {
      if (GROUPS[g].items.indexOf(name) >= 0) return GROUPS[g].title;
    }
    return known(name) && !known(name).builtIn ? 'Custom Resources' : null;
  }

  function drawNav() {
    var html = '<button class="' + (state.view.type === 'overview' ? 'on' : '') + '" data-view="overview">Overview</button>';

    var open = openGroups();
    var heading = function (title, count) {
      return '<button class="nav-group' + (open[title] ? ' is-open' : '') + '" data-group="' + esc(title) + '">' +
        '<span class="twist">' + (open[title] ? '▾' : '▸') + '</span>' + esc(title) +
        (count ? '<span class="count">' + count + '</span>' : '') + '</button>';
    };

    for (var g = 0; g < GROUPS.length; g += 1) {
      var group = GROUPS[g];
      var rows = '';
      var held = 0;
      for (var i = 0; i < group.items.length; i += 1) {
        var name = group.items[i];
        var resource = known(name);
        // Nothing this cluster does not have. An entry that can only answer
        // "the server doesn't have that resource type" is worse than no entry.
        if (!resource && state.resources.length) continue;
        held += 1;
        if (!open[group.title]) continue;
        var on = state.view.type === 'kind' && state.view.name === name;
        var count = state.counts[name];
        rows += '<button class="nav-item' + (on ? ' on' : '') + '" data-kind="' + esc(name) + '">' +
          esc(LABELS[name] || name) +
          (count == null ? '' : '<span class="count">' + count + '</span>') +
          '</button>';
      }
      if (held) html += heading(group.title, held) + rows;
    }

    /*
     * Helm, when there is a Helm. Plenty of clusters have none, and a section
     * that can only ever say "no releases" is a section in the way — so this
     * appears once `helm list` has actually found something.
     */
    if (state.helm.releases > 0) {
      var onHelm = state.view.type === 'helm';
      html += heading('Helm', state.helm.releases);
      if (open['Helm']) {
        html += '<button class="nav-item' + (onHelm ? ' on' : '') + '" data-view="helm">Releases</button>';
      }
    }

    var custom = customResources();
    if (custom.length) {
      html += heading('Custom Resources', custom.length);
      if (open['Custom Resources']) {
        var lastGroup = null;
        for (var c = 0; c < custom.length; c += 1) {
          var item = custom[c];
          if (item.group !== lastGroup) {
            html += '<h4 class="nav-sub">' + esc(item.group) + '</h4>';
            lastGroup = item.group;
          }
          var chosen = state.view.type === 'kind' && state.view.name === item.name;
          html += '<button class="nav-item' + (chosen ? ' on' : '') + '" data-kind="' + esc(item.name) +
            '" title="' + esc(item.apiVersion) + '">' + esc(item.kind) + '</button>';
        }
      }
    }
    $('nav').innerHTML = html;
  }

  $('nav').addEventListener('click', function (event) {
    var button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.group) {
      var open = openGroups();
      open[button.dataset.group] = !open[button.dataset.group];
      drawNav();
    } else if (button.dataset.view === 'overview') {
      show({ type: 'overview' });
    } else if (button.dataset.view === 'helm') {
      show({ type: 'helm' });
    } else if (button.dataset.kind) {
      show({ type: 'kind', name: button.dataset.kind });
    }
  });

  /* ---------------------------------------------------------------------- *
   * Loading.
   * ---------------------------------------------------------------------- */
  function show(view, extras) {
    extras = extras || {};
    stopWatch();
    state.picked = [];
    state.only = extras.only || null;
    state.view = view;
    // You cannot be looking at something inside a folded group.
    if (view.type === 'kind') {
      var group = groupHolding(view.name);
      if (group) openGroups()[group] = true;
    }
    state.selected = null;
    state.search = '';
    $('search').value = '';
    state.sort = extras.sort || { column: null, dir: 1 };
    state.wanted = extras.wanted || null;
    drawNav();
    load();
  }

  var loadToken = 0;
  function load(quiet) {
    var mine = (loadToken += 1);
    state.busy = true;
    var started = Date.now();
    if (!quiet) { state.loading = true; state.error = null; draw(); }

    var request = state.view.type === 'overview'
      ? call('kube.summary', { context: state.context })
      : state.view.type === 'helm'
        ? call('helm.releases', helmWhere()).then(asHelmTable)
        : state.view.name === 'events'
          ? call('kube.events', where())
          : call('kube.list', assign({ kind: state.view.name }, scopeFor(state.view.name)));

    request.then(function (result) {
      state.busy = false;
      state.tookMs = Date.now() - started;
      // An answer to a question nobody is asking any more. Dropping it is the
      // whole of what keeps a fast click from being overtaken by a slow one.
      if (mine !== loadToken) return;
      state.loading = false;
      state.error = null;
      if (state.view.type === 'overview') {
        state.overview = result;
        // The disk numbers are Prometheus', and arrive after this. Until they
        // do, the last ones stand — see applyDisk.
        applyDisk();
        loadCharts(null);
        loadDisk();
      }
      else {
        state.table = result;
        if (state.view.name) state.counts[state.view.name] = (result.rows || []).length;
      }
      draw();
      /*
       * Somebody clicked a node on the overview and this is the table it was
       * on. Opening it is what they were asking for.
       */
      if (state.wanted && state.table) {
        var found = state.table.rows.filter(function (row) { return row.name === state.wanted; })[0];
        state.wanted = null;
        if (found) select(found.uid);
      }
      if (state.view.name === 'pods' || state.view.name === 'nodes') withMetrics(mine, state.view.name);
      if (state.view.type === 'kind') startWatch(state.view.name);
    }).catch(function (error) {
      state.busy = false;
      state.tookMs = Date.now() - started;
      if (mine !== loadToken) return;
      state.loading = false;
      state.error = String(error.message || error);
      draw();
    });
  }

  /**
   * What each row is actually using, folded in afterwards.
   *
   * Afterwards, and never as a condition of drawing: `kubectl top` needs
   * metrics-server, plenty of clusters do not have it, and a table that waits
   * for it would be a table that never appears on those. So the rows arrive,
   * and two columns turn up a moment later if the cluster can answer.
   */
  function withMetrics(token, what) {
    call('kube.top', assign({ what: what }, scopeFor(what))).then(function (result) {
      if (token !== loadToken || !state.table) return;
      var found = result.metrics || {};
      var any = false;
      state.table.rows.forEach(function (row) {
        var hit = found[row.namespace + '/' + row.name] || found['/' + row.name];
        if (!hit) return;
        any = true;
        row.cpu = hit.cpu;
        row.memory = hit.memory;
      });
      if (!any) return;
      // Before Age, which is the column people scan last.
      var at = state.table.columns.indexOf('age');
      state.table.columns.splice(at < 0 ? state.table.columns.length : at, 0, 'cpu', 'memory');
      drawTable();
    }).catch(function () { /* no metrics-server; the table is the table */ });
  }

  /** A release lives in a namespace, but "all namespaces" is the useful default. */
  function helmWhere() {
    var at = { context: state.context };
    if (state.namespace) at.namespace = state.namespace;
    return at;
  }

  /**
   * Releases as a table, in the shape every other table here has.
   *
   * `kind: 'Release'` on every row is what the detail pane branches on: a
   * release is not a Kubernetes object and its tabs are different questions —
   * what changed, what were the values, put it back.
   */
  function asHelmTable(result) {
    state.helm.releases = (result.rows || []).length;
    state.helm.checked = true;
    return {
      kind: 'Release',
      columns: ['name', 'namespace', 'chart', 'chartVersion', 'appVersion', 'revision', 'status', 'age'],
      rows: (result.rows || []).map(function (row) { return assign({ kind: 'Release' }, row); }),
    };
  }

  /**
   * Whether this cluster has any releases at all.
   *
   * Asked once, quietly, and never on the refresh timer: `helm list -A` reads a
   * secret in every namespace and takes eight seconds on a real cluster. It
   * decides whether the Helm heading exists, which is not a question worth
   * asking again every ten seconds.
   */
  function lookForHelm() {
    if (state.helm.checked) return;
    state.helm.checked = true;
    call('helm.releases', { context: state.context })
      .then(function (result) {
        state.helm.releases = (result.rows || []).length;
        drawNav();
      })
      .catch(function () { /* no helm, or no releases: the heading stays away */ });
  }

  function assign(target, extra) {
    for (var key in extra) if (Object.prototype.hasOwnProperty.call(extra, key)) target[key] = extra[key];
    return target;
  }

  /** A cluster-scoped kind ignores the namespace picker; asking for one is an error. */
  function scopeFor(name) {
    var resource = known(name);
    if (resource && !resource.namespaced) return { context: state.context };
    return where();
  }

  /**
   * Which cluster this tab is for.
   *
   * Normally the app said so when it opened the tab. Opened from Extensions
   * instead, nobody has said — and then kubeconfig's own current context is the
   * only sensible answer, the same one a bare `kubectl` would use.
   */
  function start() {
    if (state.context) return loadForContext();
    return call('kube.contexts').then(function (result) {
      var first = (result.contexts || [])[0];
      state.context = result.current || (first && first.name) || null;
      if (!state.context) throw new Error('There are no clusters in kubeconfig.');
      return loadForContext();
    });
  }

  function loadForContext() {
    stopWatch();
    state.resources = [];
    state.namespaces = [];
    state.counts = {};
    state.helm = { checked: false, releases: 0 };
    state.prom = { checked: false, found: null, series: {}, minutes: state.prom.minutes };
    state.disk = null;
    state.diskByHost = null;
    drawNav();
    drawTop();

    var forThis = state.context;
    return Promise.all([
      call('kube.resources', { context: state.context }).catch(function () { return { resources: [] }; }),
      call('kube.list', { kind: 'namespaces', context: state.context }).catch(function () { return { rows: [] }; }),
    ]).then(function (answers) {
      if (forThis !== state.context) return;
      state.resources = answers[0].resources || [];
      state.namespaces = (answers[1].rows || []).map(function (row) { return row.name; });
      drawNav();
      drawTop();
      load();
      lookForHelm();
      lookForPrometheus();
    });
  }

  /* ---------------------------------------------------------------------- *
   * Charts.
   *
   * `kubectl top` says what a thing is using now; this says what it has been
   * doing, which is the question actually being asked when somebody opens a
   * pod that got killed twenty minutes ago. It comes from the cluster's own
   * Prometheus through the API server, so there is nothing to install and
   * nothing to keep alive — and a cluster without one simply has no charts.
   * ---------------------------------------------------------------------- */
  function lookForPrometheus() {
    if (state.prom.checked) return;
    state.prom.checked = true;
    call('kube.prometheus', { context: state.context })
      .then(function (result) {
        state.prom.found = result.found || null;
        if (state.prom.found && state.selected) loadCharts(state.selected);
      })
      .catch(function () { /* no Prometheus: no charts, and nothing to apologise for */ });
  }

  /** A PromQL label value. Names cannot contain these; a value from elsewhere might. */
  function label(value) {
    return String(value == null ? '' : value).replace(/["\\\n]/g, '');
  }

  /** What to ask about the thing on screen. Null when it is not a thing with a shape in Prometheus. */
  function queriesFor(row) {
    if (!row) {
      return {
        cpu: 'sum(rate(container_cpu_usage_seconds_total{container!=""}[5m]))',
        memory: 'sum(container_memory_working_set_bytes{container!=""})',
      };
    }
    if (row.kind === 'Pod') {
      var pod = '{namespace="' + label(row.namespace) + '",pod="' + label(row.name) + '",container!=""}';
      return {
        cpu: 'sum(rate(container_cpu_usage_seconds_total' + pod + '[5m]))',
        memory: 'sum(container_memory_working_set_bytes' + pod + ')',
      };
    }
    if (row.kind === 'Node') {
      var node = '{node="' + label(row.name) + '",container!=""}';
      return {
        cpu: 'sum(rate(container_cpu_usage_seconds_total' + node + '[5m]))',
        memory: 'sum(container_memory_working_set_bytes' + node + ')',
      };
    }
    return null;
  }

  /** How many subjects' charts to keep. Past this, the oldest is forgotten. */
  var CHART_MEMORY = 40;

  /**
   * How full the disks are, which nothing else in the cluster will tell you.
   *
   * The API server knows how much disk a node *has* and nothing about how much
   * is left; only the node exporter measures that. Matched back to nodes by
   * their internal address, which is what the exporter labels its series with.
   */
  /**
   * Put the last disk reading back on the nodes.
   *
   * Every refresh replaces `state.overview` wholesale, and the payload it
   * replaces it with has no disk on it: disk comes from Prometheus, separately
   * and a moment later. So without this the bars vanish on every cycle and come
   * back when the query answers — a flicker that reads as the metric being
   * broken rather than as it being late. Matching is by the node's own address,
   * which is what node-exporter labels its series with, so a node that has gone
   * away simply finds nothing and shows nothing.
   */
  function applyDisk() {
    var byHost = state.diskByHost;
    if (!byHost || !state.overview) return;
    (state.overview.nodeUsage || []).forEach(function (node) {
      var found = byHost[node.ip];
      if (!found || !found.size) return;
      node.disk = found.size - found.avail;
      node.diskTotal = found.size;
    });
  }

  function loadDisk() {
    var prom = state.prom.found;
    if (!prom || !state.overview) return;
    var ask = function (query) {
      return call('kube.promNow', {
        context: state.context, namespace: prom.namespace, service: prom.name, query: query,
      }).then(function (r) { return r.values || []; }).catch(function () { return []; });
    };

    Promise.all([
      ask('node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}'),
      ask('node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}'),
    ]).then(function (answers) {
      var byHost = {};
      var total = 0;
      var free = 0;
      answers[0].forEach(function (one) {
        var host = String(one.labels.instance || '').split(':')[0];
        byHost[host] = { size: one.value, avail: 0 };
        total += one.value;
      });
      answers[1].forEach(function (one) {
        var host = String(one.labels.instance || '').split(':')[0];
        if (byHost[host]) byHost[host].avail = one.value;
        free += one.value;
      });
      /*
       * Nothing came back — Prometheus was slow, or the query failed, or the
       * exporter is restarting. That is not the same as "the disks are empty",
       * so the previous reading is left alone rather than replaced with none.
       */
      if (!total) return;

      state.disk = { total: total, used: total - free, at: Date.now() };
      state.diskByHost = byHost;
      applyDisk();
      if (state.view.type === 'overview' || state.view.type === 'stats') draw();
    });
  }

  function loadCharts(row) {
    var prom = state.prom.found;
    var wanted = queriesFor(row);
    if (!prom || !wanted) return;
    // Keyed by the range as well: an hour and a day are different questions
    // about the same thing, and one must not be served from the other's answer.
    var key = (row ? row.uid : 'cluster') + '@' + state.prom.minutes;
    if (state.prom.series[key]) return;

    /*
     * Bounded, because this is keyed by object and a person going down a list
     * of two hundred pods would otherwise be holding two hundred sets of
     * points, none of which they will look at again. The cluster's own is never
     * dropped: it is the one that is always on screen.
     */
    var keys = Object.keys(state.prom.series);
    if (keys.length >= CHART_MEMORY) {
      for (var n = 0; n < keys.length - CHART_MEMORY + 1; n += 1) {
        if (keys[n] !== 'cluster') delete state.prom.series[keys[n]];
      }
    }
    state.prom.series[key] = { loading: true };

    Promise.all(['cpu', 'memory'].map(function (which) {
      return call('kube.promQuery', {
        context: state.context, namespace: prom.namespace, service: prom.name,
        query: wanted[which], minutes: state.prom.minutes,
      }).then(function (r) { return r.empty ? null : (r.series[0] || null); }).catch(function () { return null; });
    })).then(function (answers) {
      state.prom.series[key] = { cpu: answers[0], memory: answers[1] };
      if (row ? state.selected === row : state.view.type === 'overview') draw();
    });
  }

  /*
   * Two units, two names, and the names say which.
   *
   * Prometheus counts CPU in cores and Kubernetes counts it in thousandths of
   * one, and both numbers land on this screen. When both formatters were called
   * `cores` the later one won and the chart printed `1.2673684232019298m` —
   * a whole core described as a thousandth of one.
   */
  function fromCores(value) {
    return value >= 1 ? value.toFixed(2) + ' cores' : Math.round(value * 1000) + 'm';
  }

  function fromMillicores(m) {
    return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' cores' : Math.round(m) + 'm';
  }

  /** Bytes, in the unit a person would have said. */
  function bytes(value) {
    var units = ['B', 'Ki', 'Mi', 'Gi', 'Ti'];
    var at = 0;
    while (value >= 1024 && at < units.length - 1) { value /= 1024; at += 1; }
    return (value >= 100 || at === 0 ? Math.round(value) : value.toFixed(1)) + units[at];
  }

  /**
   * One series, as a line.
   *
   * Drawn by hand in SVG rather than with a charting library, and not only
   * because this frame cannot load one: what is wanted here is a shape and a
   * last value, and two hundred kilobytes of axis logic would buy nothing. The
   * scale starts at zero so the height of the line means something — a chart
   * that crops its own baseline turns a two-percent wobble into a cliff.
   */
  function chart(series, format, title, big) {
    if (!series || !series.points.length) return '';
    var points = series.points;
    var top = 0;
    for (var i = 0; i < points.length; i += 1) top = Math.max(top, points[i][1]);
    if (top <= 0) top = 1;

    var W = 240;
    var H = big ? 150 : 46;
    var first = points[0][0];
    var span = Math.max(1, points[points.length - 1][0] - first);
    var path = points.map(function (point, at) {
      var x = ((point[0] - first) / span) * W;
      var y = H - (point[1] / top) * (H - 4) - 2;
      return (at ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');

    var last = points[points.length - 1][1];
    var span = state.prom.minutes;
    var over = span < 1440 ? 'last ' + span / 60 + ' hours' : span === 1440 ? 'last day' : 'last ' + span / 1440 + ' days';
    /*
     * The points ride along on the element, so hovering can answer "what was it
     * at that moment" without asking anything again. A chart you cannot
     * interrogate is a picture.
     */
    return '<div class="chart' + (big ? ' is-big' : '') + '" data-points="' + esc(JSON.stringify(points)) + '" data-unit="' + esc(title) + '">' +
      '<div class="chart-head"><span>' + esc(title) + '</span><b class="chart-value">' + esc(format(last)) + '</b></div>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<path d="' + path + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" class="chart-fill" />' +
      '<path d="' + path + '" class="chart-line" />' +
      '<line class="chart-cursor" y1="0" y2="' + H + '" x1="-10" x2="-10" />' +
      '</svg>' +
      '<div class="chart-foot"><span>peak ' + esc(format(top)) + '</span><span class="chart-when">' + esc(over) + '</span></div>' +
      '</div>';
  }

  /** Both charts for one subject, or nothing at all. */
  function chartsFor(row) {
    var key = (row ? row.uid : 'cluster') + '@' + state.prom.minutes;
    var got = state.prom.series[key];
    if (!got || got.loading) return '';
    var html = chart(got.cpu, fromCores, 'CPU') + chart(got.memory, bytes, 'Memory');
    if (!html) return '';
    // How far back, offered where the charts are rather than in a settings
    // menu: it is a question about what you are looking at.
    var ranges = [60, 360, 1440].map(function (minutes) {
      return '<button class="btn' + (state.prom.minutes === minutes ? ' on' : '') + '" data-range="' + minutes + '">' +
        (minutes < 1440 ? minutes / 60 + 'h' : minutes / 1440 + 'd') + '</button>';
    }).join('');
    return '<div class="chart-range">' + ranges + '</div><div class="charts">' + html + '</div>';
  }

  /* ---------------------------------------------------------------------- *
   * Watching, instead of asking again.
   *
   * A table used to be a photograph taken every ten seconds; this makes it a
   * thing that changes when the cluster does. The API server tells us what
   * changed and nothing else, so a pod going into CrashLoopBackOff costs one
   * row rather than four megabytes.
   *
   * The first picture still comes from an ordinary `get`, because a list is
   * fast and finite and a watch is neither. This takes over from there.
   * ---------------------------------------------------------------------- */
  function startWatch(kind) {
    var at = scopeFor(kind);
    // What this watch is *of*: the kind and the scope both. Comparing only the
    // kind would have kept a watch pointed at the namespace you just left.
    var what = kind + '\u0000' + (at.namespace || (at.allNamespaces ? '*' : ''));
    // Already watching exactly that: the resync that just ran is not a reason
    // to drop the connection and open another one.
    if (state.watch.id && state.watch.of === what) return;
    stopWatch();
    if (!state.showing) return;
    var mine = (state.watch.token += 1);
    call('kube.watch', assign({ kind: kind, as: titleOf(kind) }, at))
      .then(function (result) {
        // The view moved on while this was starting; the stream belongs to
        // nothing now and would otherwise stay open for ever.
        if (mine !== state.watch.token) {
          call('kube.stopWatch', { id: result.id }).catch(function () {});
          return;
        }
        state.watch.id = result.id;
        state.watch.kind = kind;
        state.watch.of = what;
      })
      .catch(function () { /* a kind that cannot be watched is still a table */ });
  }

  function stopWatch() {
    state.watch.token += 1;
    if (state.watch.id) call('kube.stopWatch', { id: state.watch.id }).catch(function () {});
    state.watch.id = null;
    state.watch.kind = null;
    state.watch.of = null;
  }

  /**
   * What the cluster just said, folded into the table.
   *
   * Upserting by uid, because ADDED for something already known is what a
   * reconnect looks like and there is nothing to gain from treating it as new.
   * Redrawing is left to an animation frame: a rollout produces dozens of these
   * in a second, and the table only has to be right once per frame.
   */
  function applyWatch(events) {
    if (!state.table) return;
    var changed = false;
    for (var i = 0; i < events.length; i += 1) {
      var event = events[i];
      if (event.type === 'ERROR') {
        // The watch has fallen behind the cluster's history. Nothing to
        // reconcile — read the whole thing again.
        stopWatch();
        load(true);
        return;
      }
      if (!event.row) continue;
      var at = -1;
      for (var n = 0; n < state.table.rows.length; n += 1) {
        if (state.table.rows[n].uid === event.row.uid) at = n;
      }
      if (event.type === 'DELETED') {
        if (at >= 0) { state.table.rows.splice(at, 1); changed = true; }
      } else if (at >= 0) {
        /*
         * Carried across, because the API server does not know about them: CPU
         * and memory come from `kubectl top`, are folded in afterwards, and
         * were being wiped by the first watch event about the row — so a busy
         * pod's two columns went blank a second after they arrived, on exactly
         * the pods that change most.
         */
        var was = state.table.rows[at];
        state.table.rows[at] = assign(event.row, { cpu: was.cpu, memory: was.memory });
        changed = true;
      } else {
        state.table.rows.push(event.row);
        changed = true;
      }
    }
    if (!changed) return;
    if (state.view.name) state.counts[state.view.name] = state.table.rows.length;
    if (!state.watch.draw) {
      state.watch.draw = requestAnimationFrame(function () {
        state.watch.draw = 0;
        // Never over an editor, and never while a question is open.
        if (state.editing || document.getElementById('prompt')) return;
        drawTable();
        drawCrumb();
        drawNav();
      });
    }
  }

  /* ---------------------------------------------------------------------- *
   * The header.
   * ---------------------------------------------------------------------- */
  function drawTop() {
    var head = $('cluster');
    head.textContent = shortContext(state.context || '');
    head.title = state.context || '';

    var namespaces = ['<option value="">All namespaces</option>'].concat(
      state.namespaces.map(function (name) {
        return '<option value="' + esc(name) + '"' + (name === state.namespace ? ' selected' : '') + '>' + esc(name) + '</option>';
      }),
    ).join('');
    $('namespace').innerHTML = namespaces;
    $('live').className = 'btn' + (state.live ? ' on' : '');
  }

  /**
   * An EKS context is an ARN and a GKE one is four fields joined by underscores;
   * neither fits in a picker. The last meaningful part is what people call the
   * cluster, and the whole thing stays in the tooltip.
   */
  function shortContext(name) {
    var text = String(name || '');
    if (text.indexOf('arn:') === 0) {
      var cut = text.lastIndexOf('/');
      return cut >= 0 ? text.slice(cut + 1) : text;
    }
    return text;
  }

  $('namespace').addEventListener('change', function (event) {
    state.namespace = event.target.value;
    state.selected = null;
    load();
  });
  $('search').addEventListener('input', function (event) {
    state.search = event.target.value.trim().toLowerCase();
    draw();
  });
  $('reload').addEventListener('click', function () { load(); });
  $('live').addEventListener('click', function () {
    state.live = !state.live;
    drawTop();
  });
  $('terminal').addEventListener('click', function () {
    call('kube.terminal', { context: state.context, namespace: state.namespace })
      .then(function () { say('A terminal opened, with k aliased to this cluster.'); })
      .catch(function (error) { say(String(error.message || error), true); });
  });

  /* ---------------------------------------------------------------------- *
   * Drawing.
   * ---------------------------------------------------------------------- */
  function draw() {
    drawCrumb();
    if (state.view.type === 'overview') drawOverview();
    else if (state.view.type === 'stats') drawStats();
    else drawTable();
    drawDetail();
    drawDock();
    drawPicked();
    drawBar();
    drawGrips();
  }

  function drawCrumb() {
    var bits = [];
    if (state.view.type === 'stats') {
      bits.push('<button class="link" data-view="overview">Overview</button>');
      bits.push('<strong>' + esc(STAT_TITLES[state.view.focus] || state.view.focus) + '</strong>');
    } else if (state.view.type === 'overview') bits.push('<strong>Overview</strong>');
    else if (state.view.type === 'helm') bits.push('<strong>Helm releases</strong>');
    else bits.push('<strong>' + esc(LABELS[state.view.name] || titleOf(state.view.name)) + '</strong>');
    var listing = state.view.type !== 'overview' && state.view.type !== 'stats';
    if (state.view.type !== 'stats') bits.push(esc(state.namespace || 'all namespaces'));
    if (state.table && listing) {
      var total = (state.table.rows || []).length;
      var shown = visible().length;
      bits.push(shown === total ? total + ' items' : shown + ' of ' + total);
    }
    if (state.loading) bits.push('<span class="spin">◐</span>');
    $('crumb').innerHTML =
      bits.join('<span class="dim"> · </span>') +
      (state.table && listing
        ? '<span class="spacer"></span><button class="btn" data-do="copy-table" ' +
          'title="Copy this table, as text">Copy table</button>'
        : '');
  }

  function titleOf(name) {
    var resource = known(name);
    return resource ? resource.kind : name;
  }

  function visible() {
    var rows = (state.table && state.table.rows) || [];
    // A card asked for a subset — the failing ones — and said so.
    if (state.only === 'bad') rows = rows.filter(function (row) { return row.health === 'bad'; });
    if (state.search) {
      var term = state.search;
      rows = rows.filter(function (row) {
        return (row.name + ' ' + row.namespace + ' ' + (row.status || '') + ' ' + (row.message || '')).toLowerCase().indexOf(term) >= 0;
      });
    }
    if (state.sort.column) {
      var column = state.sort.column;
      var dir = state.sort.dir;
      rows = rows.slice().sort(function (a, b) {
        var left = a[column];
        var right = b[column];
        if (typeof left === 'number' && typeof right === 'number') return (left - right) * dir;
        return String(left == null ? '' : left).localeCompare(String(right == null ? '' : right)) * dir;
      });
    }
    return rows;
  }

  var HEADINGS = {
    name: 'Name', namespace: 'Namespace', ready: 'Ready', status: 'Status', restarts: 'Restarts',
    node: 'Node', age: 'Age', upToDate: 'Up to date', available: 'Available', type: 'Type',
    clusterIP: 'Cluster IP', external: 'External', ports: 'Ports', class: 'Class', hosts: 'Hosts',
    address: 'Address', roles: 'Roles', version: 'Version', instance: 'Instance', zone: 'Zone',
    capacity: 'Capacity', keys: 'Keys', schedule: 'Schedule', active: 'Active', lastRun: 'Last run',
    duration: 'Duration', message: 'Message', count: 'Count', object: 'Object',
    cpu: 'CPU', memory: 'Memory',
    chart: 'Chart', chartVersion: 'Version', appVersion: 'App', revision: 'Rev',
  };

  /** How many rows are drawn at once. Past this, scrolling costs more than it is worth. */
  var CAP = 700;

  function drawTable() {
    closeRowMenu();
    if (state.error) {
      $('table').innerHTML = '<div class="note error">' + esc(state.error) + '</div>' + advice(state.error);
      return;
    }
    if (!state.table) {
      $('table').innerHTML = state.loading
        ? ''
        : '<div class="note">' + (state.started ? 'Nothing loaded.' : 'Waiting to be looked at.') + '</div>';
      return;
    }

    var rows = visible();
    if (!rows.length) {
      $('table').innerHTML = '<div class="note">' +
        (state.search ? 'Nothing matches “' + esc(state.search) + '”.' : 'There is nothing here.') + '</div>';
      return;
    }

    var columns = (state.table.columns || []).filter(function (column) {
      // The namespace column says nothing when every row is in the same one.
      return !(column === 'namespace' && state.namespace);
    });

    var head = '<tr><th class="tick"><input type="checkbox" id="tick-all"' +
      (state.picked.length && state.picked.length === rows.length ? ' checked' : '') + ' /></th>' +
      columns.map(function (column) {
      var arrow = state.sort.column === column ? '<span class="arrow">' + (state.sort.dir > 0 ? '↑' : '↓') + '</span>' : '';
      return '<th data-column="' + esc(column) + '">' + esc(HEADINGS[column] || column) + arrow + '</th>';
    }).join('') + '<th class="more"></th></tr>';

    var body = '';
    var drawn = Math.min(rows.length, CAP);
    for (var i = 0; i < drawn; i += 1) {
      var row = rows[i];
      var on = state.selected && state.selected.uid === row.uid;
      body += '<tr data-uid="' + esc(row.uid) + '" class="' + (on ? 'on' : '') + '">';
      body += '<td class="tick"><input type="checkbox" data-tick="' + esc(row.uid) + '"' +
        (state.picked.indexOf(row.uid) >= 0 ? ' checked' : '') + ' /></td>';
      for (var c = 0; c < columns.length; c += 1) body += cell(row, columns[c]);
      // What you can do to this one, without opening it first.
      body += '<td class="more"><button data-more="' + esc(row.uid) + '" aria-label="What can be done">⋮</button></td>';
      body += '</tr>';
    }

    $('table').innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
      (rows.length > drawn ? '<div class="note">Showing the first ' + drawn + ' of ' + rows.length + '. Filter to narrow it.</div>' : '');
  }

  function cell(row, column) {
    var value = row[column];
    if (column === 'name') {
      return '<td class="name"><span class="dot ' + esc(row.health || 'idle') + '"></span>' + esc(value) + '</td>';
    }
    if (column === 'status') {
      var klass = row.health === 'bad' ? 'bad-text' : row.health === 'warn' ? 'warn-text' : 'dim';
      return '<td class="' + klass + '">' + esc(value) + '</td>';
    }
    if (column === 'restarts') {
      var text = esc(value) + (row.restartNote ? ' <span class="dim">(' + esc(row.restartNote) + ')</span>' : '');
      return '<td class="' + (value > 0 ? 'warn-text' : 'dim') + '">' + text + '</td>';
    }
    if (column === 'message') return '<td class="grow dim">' + esc(value) + '</td>';
    if (column === 'ports' || column === 'clusterIP' || column === 'address') {
      return '<td class="dim mono">' + esc(value) + '</td>';
    }
    return '<td class="dim">' + esc(value == null ? '' : value) + '</td>';
  }

  $('table').addEventListener('click', function (event) {
    /*
     * A tick is not a selection. Clicking a row opens it; ticking rows says
     * which ones an action is about, and the two must not be the same gesture
     * or ticking the fifth thing to delete would open it instead.
     */
    var more = event.target.closest('[data-more]');
    if (more) {
      event.stopPropagation();
      openRowMenu(more.dataset.more, more);
      return;
    }
    var tick = event.target.closest('[data-tick]');
    if (tick) {
      event.stopPropagation();
      var uid = tick.dataset.tick;
      var at = state.picked.indexOf(uid);
      if (at >= 0) state.picked.splice(at, 1);
      else state.picked.push(uid);
      drawPicked();
      return;
    }
    if (event.target.id === 'tick-all') {
      event.stopPropagation();
      var all = visible().map(function (row) { return row.uid; });
      state.picked = state.picked.length === all.length ? [] : all;
      drawTable();
      drawPicked();
      return;
    }
    var heading = event.target.closest('th');
    if (heading) {
      var column = heading.dataset.column;
      state.sort = state.sort.column === column
        ? { column: column, dir: -state.sort.dir }
        : { column: column, dir: 1 };
      drawTable();
      return;
    }
    var row = event.target.closest('tr[data-uid]');
    if (!row) return;
    select(row.dataset.uid);
  });

  /**
   * What has been typed into this object's YAML, if anything.
   *
   * Kept against the object rather than the tab, so switching to Events and
   * back finds the text still there. Nothing is ever asked about losing it,
   * because nothing loses it: it goes when the edit is applied, when it is
   * reverted on purpose, or when a different object is selected — and that last
   * one is the only case where the text stops meaning anything.
   */
  function draftFor(row) {
    var draft = state.draft;
    return draft && row && draft.uid === row.uid ? draft.text : null;
  }

  function stopEditing() {
    state.draft = null;
    state.editing = false;
    state.editingYaml = false;
  }

  /**
   * The same things the detail pane offers, without opening it.
   *
   * It selects the row on the way, because every one of these acts on "the
   * selected thing" — and because after a delete or a restart, that is the
   * thing you want in front of you anyway.
   */
  function openRowMenu(uid, near) {
    closeRowMenu();
    var rows = (state.table && state.table.rows) || [];
    var row = null;
    for (var i = 0; i < rows.length; i += 1) if (rows[i].uid === uid) row = rows[i];
    if (!row) return;
    state.selected = row;

    var box = document.createElement('div');
    box.className = 'row-menu';
    box.innerHTML = actionsFor(row);
    document.body.appendChild(box);

    var at = near.getBoundingClientRect();
    // Above the button when there is no room below it.
    var below = window.innerHeight - at.bottom > box.offsetHeight + 8;
    box.style.left = Math.max(6, Math.min(at.right - box.offsetWidth, window.innerWidth - box.offsetWidth - 6)) + 'px';
    box.style.top = (below ? at.bottom + 4 : at.top - box.offsetHeight - 4) + 'px';

    // One click anywhere closes it, including the one that chose something.
    setTimeout(function () { document.addEventListener('click', closeRowMenu, { once: true }); }, 0);
  }

  function closeRowMenu() {
    var open = document.querySelector('.row-menu');
    if (open) open.remove();
  }

  function select(uid) {
    stopEditing();
    var rows = (state.table && state.table.rows) || [];
    var found = null;
    for (var i = 0; i < rows.length; i += 1) if (rows[i].uid === uid) found = rows[i];
    if (!found) return;
    // Events are not objects you open; the thing they are about is.
    if (found.kind === 'Event') {
      say(found.message || found.status || 'nothing more to say');
      return;
    }
    state.selected = found;
    state.detail = { tab: 'overview' };
    state.detailData = {};
    draw();
    loadDetail();
  }

  /* ---------------------------------------------------------------------- *
   * The overview: what is on fire, if anything.
   * ---------------------------------------------------------------------- */
  function drawOverview() {
    if (state.error) {
      $('table').innerHTML = '<div class="note error">' + esc(state.error) + '</div>' + advice(state.error);
      return;
    }
    var data = state.overview;
    if (!data) { $('table').innerHTML = state.loading ? '' : '<div class="note">Nothing loaded.</div>'; return; }

    /*
     * Every one of these is a question with an answer somewhere else, so every
     * one of them goes there. A number you cannot click is a number you have to
     * go and look up by hand, which is what a dashboard is supposed to save.
     */
    var cards = [
      { value: data.nodes, label: 'nodes', bad: data.nodesUnhealthy > 0, go: 'nodes' },
      { value: data.podsRunning + ' / ' + data.pods, label: 'pods running', go: 'pods' },
      { value: data.podsFailing, label: 'pods failing', bad: data.podsFailing > 0, go: 'pods', only: 'bad' },
      { value: data.restarts, label: 'restarts', warn: data.restarts > 0, go: 'pods', sort: 'restarts' },
      { value: data.warnings, label: 'warning events', warn: data.warnings > 0, go: 'events' },
    ].map(function (card) {
      return '<div class="card is-link ' + (card.bad ? 'bad' : card.warn ? 'warn' : '') + '"' +
        ' data-go="' + esc(card.go) + '"' +
        (card.only ? ' data-only="' + esc(card.only) + '"' : '') +
        (card.sort ? ' data-sort="' + esc(card.sort) + '"' : '') +
        '><b>' + esc(card.value) + '</b><span>' + esc(card.label) + '</span></div>';
    }).join('');

    var trouble = '';
    if ((data.trouble || []).length) {
      trouble = '<div class="crumb"><strong>Not well</strong></div><table><tbody>' +
        data.trouble.map(function (row) {
          return '<tr><td class="name"><span class="dot bad"></span>' + esc(row.name) + '</td>' +
            '<td class="dim">' + esc(row.kind) + '</td>' +
            '<td class="dim">' + esc(row.namespace) + '</td>' +
            '<td class="bad-text">' + esc(row.status) + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else {
      trouble = '<div class="note">Nothing is failing, and nothing has raised a warning recently.</div>';
    }

    var recent = '';
    if ((data.recent || []).length) {
      recent = '<div class="crumb"><strong>Recent warnings</strong></div><table><tbody>' +
        data.recent.slice(0, 20).map(function (row) {
          return '<tr><td class="dim">' + esc(row.age) + '</td>' +
            '<td class="warn-text">' + esc(row.status) + '</td>' +
            '<td class="dim">' + esc(row.object) + '</td>' +
            '<td class="grow dim">' + esc(row.message) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    $('table').innerHTML =
      '<div class="cards">' + cards + '</div>' +
      capacityOf(data) +
      chartsFor(null) +
      pressureOf(data) +
      '<div class="split">' + nodesOf(data) + busiestOf(data) + '</div>' +
      '<div class="split">' + whereOf(data) + incompleteOf(data) + '</div>' +
      reasonsOf(data) +
      trouble +
      recent;
  }

  /** Bytes at cluster scale, where MiB is noise. */
  function gigs(b) {
    if (b >= 1099511627776) return (b / 1099511627776).toFixed(1) + ' TiB';
    if (b >= 1073741824) return (b / 1073741824).toFixed(b >= 10737418240 ? 0 : 1) + ' GiB';
    return Math.round(b / 1048576) + ' MiB';
  }
  /** 668523 → 668k. The magnitude is the information. */
  function many(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'k';
    return String(n);
  }

  /**
   * Two bars that say the thing five numbers never did.
   *
   * *Allocatable* is what the nodes will hand out. *Requested* is what the
   * scheduler has already promised, and it — not usage — is what decides
   * whether the next pod fits. *Used* is what is actually being consumed. The
   * gap between the last two is the whole story: promised and idle means the
   * requests were written without measuring, and used above promised means the
   * cluster is running on room nobody reserved.
   */
  function capacityOf(data) {
    var cap = data.capacity;
    if (!cap || !cap.cpu.allocatable) return '';

    var bar = function (title, of, format) {
      var pct = function (n) { return Math.max(0, Math.min(100, (n / of.allocatable) * 100)); };
      var over = of.used > of.requested;
      return '<div class="gauge is-link" data-stat="' + title.toLowerCase() + '">' +
        '<div class="gauge-head"><span>' + title + '</span>' +
          '<b>' + format(of.used) + '</b><span class="dim"> used of ' + format(of.allocatable) + '</span></div>' +
        '<div class="gauge-bar">' +
          '<span class="gauge-req" style="width:' + pct(of.requested).toFixed(1) + '%"></span>' +
          '<span class="gauge-use' + (over ? ' is-over' : '') + '" style="width:' + pct(of.used).toFixed(1) + '%"></span>' +
        '</div>' +
        '<div class="gauge-foot">' +
          '<span><i class="key-req"></i>' + format(of.requested) + ' promised to pods · ' +
            Math.round((of.requested / of.allocatable) * 100) + '%</span>' +
          '<span><i class="key-use' + (over ? ' is-over' : '') + '"></i>' +
            Math.round((of.used / of.allocatable) * 100) + '% in use</span>' +
        '</div>' +
        '</div>';
    };

    var gauges = bar('CPU', cap.cpu, fromMillicores) + bar('Memory', cap.memory, gigs);

    /*
     * Disk, when the node exporter is there to measure it. Node disk and volume
     * storage are two different pools — an attached volume is not the node's —
     * so the claims are said beside it rather than added into it.
     */
    if (state.disk && state.disk.total) {
      var used = state.disk.used;
      var pct = (used / state.disk.total) * 100;
      var vols = data.volumes;
      gauges += '<div class="gauge is-link" data-stat="disk">' +
        '<div class="gauge-head"><span>Disk</span><b>' + gigs(used) + '</b>' +
          '<span class="dim"> used of ' + gigs(state.disk.total) + '</span></div>' +
        '<div class="gauge-bar"><span class="gauge-use ' + (pct >= 85 ? 'is-over' : '') + '" style="width:' +
          pct.toFixed(1) + '%"></span></div>' +
        '<div class="gauge-foot"><span>' + Math.round(pct) + '% of the nodes\u2019 own disks</span>' +
          (vols ? '<span>' + vols.count + ' volumes · ' + gigs(vols.claimed) +
            (vols.pending ? ' · <b class="warn-text">' + vols.pending + ' pending</b>' : '') + '</span>' : '') +
        '</div></div>';
    }
    return '<div class="gauges">' + gauges + '</div>';
  }

  /**
   * Every node, hottest first.
   *
   * A cluster at sixty percent with one node at ninety-seven is not a cluster
   * at sixty percent — it is a cluster with one node about to start evicting
   * things, and an average is exactly what hides that.
   */
  function nodesOf(data) {
    var nodes = data.nodeUsage || [];
    if (!nodes.length) return '';
    return '<div class="panel-block"><h4>Nodes<span class="dim"> · busiest first</span></h4>' +
      nodes.map(function (node) {
        var cpu = node.cpuAllocatable ? (node.cpu / node.cpuAllocatable) * 100 : 0;
        var mem = node.memoryAllocatable ? (node.memory / node.memoryAllocatable) * 100 : 0;
        var short = node.name.replace(/\.(compute\.internal|ec2\.internal).*$/, '');
        return '<div class="meter" data-node="' + esc(node.name) + '" title="' + esc(node.name) + '">' +
          '<span class="meter-name' + (node.ready ? '' : ' bad-text') + '">' + esc(short) +
            (node.schedulable ? '' : ' <span class="dim">cordoned</span>') + '</span>' +
          '<span class="meter-track"><i style="width:' + cpu.toFixed(1) + '%" class="' + heat(cpu) + '"></i></span>' +
          '<span class="meter-num">' + Math.round(cpu) + '%</span>' +
          '<span class="meter-track"><i style="width:' + mem.toFixed(1) + '%" class="' + heat(mem) + '"></i></span>' +
          '<span class="meter-num">' + Math.round(mem) + '%</span>' +
          (node.diskTotal
            ? '<span class="meter-track"><i style="width:' + ((node.disk / node.diskTotal) * 100).toFixed(1) +
                '%" class="' + heat((node.disk / node.diskTotal) * 100) + '"></i></span>' +
              '<span class="meter-num">' + Math.round((node.disk / node.diskTotal) * 100) + '%</span>'
            : '') +
          '</div>';
      }).join('') +
      '<div class="meter-legend"><span></span><span>CPU</span><span></span><span>memory</span><span></span>' +
        (nodes[0] && nodes[0].diskTotal ? '<span>disk</span><span></span>' : '') + '</div>' +
      '</div>';
  }

  /** Green up to two thirds, amber to the edge, red past it. */
  function heat(pct) { return pct >= 90 ? 'is-bad' : pct >= 66 ? 'is-warn' : ''; }

  /**
   * Where the room is going, by namespace.
   *
   * Ordered by what has been promised rather than by what is used: the
   * namespace holding a third of the cluster's CPU without touching it is the
   * one worth finding, and by usage it looks like the quietest thing there.
   */
  function whereOf(data) {
    var rows = data.namespaces || [];
    if (!rows.length) return '';
    var most = rows[0].cpu || 1;
    return '<div class="panel-block"><h4>Where the CPU is promised<span class="dim"> · by namespace</span></h4>' +
      rows.map(function (row) {
        return '<div class="meter" data-namespace="' + esc(row.namespace) + '">' +
          '<span class="meter-name">' + esc(row.namespace) + '</span>' +
          '<span class="meter-track wide"><i style="width:' + ((row.cpu / most) * 100).toFixed(1) + '%"></i></span>' +
          '<span class="meter-num">' + fromMillicores(row.cpu) + '</span>' +
          '<span class="meter-num dim">' + row.pods + 'p</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  /**
   * What is actually burning the cluster right now.
   *
   * Not what anything asked for — what it is using. Requests say what the
   * scheduler believes; this says where the afternoon went, and on a real
   * cluster the two are nowhere near each other.
   */
  function busiestOf(data) {
    var busy = data.busiest;
    if (!busy || (!busy.cpu.length && !busy.memory.length)) return '';
    var column = function (title, rows, most, format, field) {
      return '<div class="half"><h5>' + title + '</h5>' + rows.map(function (row) {
        return '<div class="meter" title="' + esc(row.namespace + '/' + row.name) + '">' +
          '<span class="meter-name">' + esc(row.name) + '</span>' +
          '<span class="meter-track"><i style="width:' + ((row[field] / (most || 1)) * 100).toFixed(1) + '%"></i></span>' +
          '<span class="meter-num">' + format(row[field]) + '</span>' +
          '</div>';
      }).join('') + '</div>';
    };
    return '<div class="panel-block"><h4>Busiest right now<span class="dim"> · measured, not requested</span></h4>' +
      '<div class="halves">' +
        column('CPU', busy.cpu, busy.cpu[0] && busy.cpu[0].cpu, fromMillicores, 'cpu') +
        column('Memory', busy.memory, busy.memory[0] && busy.memory[0].memory, gigs, 'memory') +
      '</div></div>';
  }

  /**
