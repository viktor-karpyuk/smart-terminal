    var y1 = a.y + a.h;
    var x2 = b.x + b.w / 2;
    var y2 = b.y;
    var bend = Math.max(30, (y2 - y1) / 2);
    return '<path class="medge vol' + cls + '" d="M' + x1 + ' ' + y1 + 'C' + x1 + ' ' + (y1 + bend) + ',' + x2 + ' ' + (y2 - bend) + ',' + x2 + ' ' + y2 + '"/>';
  }

  /**
   * The lines of whatever is under the pointer on the physical map: a pod's to
   * its disks, a disk's to its pods. They are not drawn all the time — forty of
   * them explain nothing — so pointing is how one is asked for.
   */
  function mapHoverVolumes(id) {
    var inner = document.getElementById('map-inner');
    var lines = document.getElementById('map-lines');
    if (!inner || !lines) return;
    var held = lines.querySelector('#map-hover');
    if (held) held.remove();
    var node = id && state.mapIndex.byId[id];
    if (!node) return;
    var pairs = [];
    if (node.kind === 'Pod') {
      mapTo(node.id, 'mounts').forEach(function (claim) { mapTo(claim.id, 'binds').forEach(function (volume) { pairs.push([node.id, volume.id]); }); });
    } else if (node.kind === 'PersistentVolume') {
      mapFrom(node.id, 'binds').forEach(function (claim) { mapFrom(claim.id, 'mounts').forEach(function (pod) { pairs.push([pod.id, node.id]); }); });
    }
    var paths = '';
    pairs.forEach(function (pair) {
      var tile = inner.querySelector('.mtile[data-map-id="' + CSS.escape(pair[0]) + '"]');
      var card = inner.querySelector('.mvol[data-map-id="' + CSS.escape(pair[1]) + '"]');
      if (tile && card) paths += mapVolumeLine(inner, tile, card, ' on hov');
    });

  }

  /**
   * The dotted lines from pods to their volumes, measured once the boxes are
   * where the browser put them. With many volumes only the highlighted
   * workload's are drawn: forty lines across a page explain nothing.
   */
  function mapPhysicalLines(inner) {
    var ui = mapUi();
    var cards = inner.querySelectorAll('.mvol[data-map-id^="PersistentVolume//"]');
    var all = cards.length <= 8;
    var paths = '';
    for (var i = 0; i < cards.length; i += 1) {
      var volume = state.mapIndex.byId[cards[i].dataset.mapId];
      var claim = volume && mapFrom(volume.id, 'binds')[0];
      var pods = claim ? mapFrom(claim.id, 'mounts') : [];
      for (var p = 0; p < pods.length; p += 1) {
        var lit = (ui.hl && pods[p].owner === ui.hl) || ui.sel === pods[p].id || ui.sel === volume.id;
        if (!all && !lit) continue;
        var tile = inner.querySelector('.mtile[data-map-id="' + CSS.escape(pods[p].id) + '"]');
        if (!tile) continue;
        paths += mapVolumeLine(inner, tile, cards[i], lit ? ' on' : '');
      }
    }

  }

  /* ---- Dependencies ---------------------------------------------------- */

  /** What can be the centre of the picture: anything with pods of its own. */
  function mapFocusable(node) {
    return Boolean(node) && (mapIsWorkload(node) || (node.kind === 'Pod' && !node.owner && !node.mirror));
  }

  function mapFocus() {
    var ix = state.mapIndex;
    var chosen = ix.byId[state.view.focus];
    if (mapFocusable(chosen)) return chosen;
    var roots = [];
    var units = mapUnits();
    Object.keys(units).forEach(function (ns) { units[ns].forEach(function (unit) { if (!unit.bare) roots.push(unit.root); }); });
    var rank = function (node) {
      return (node.tech ? 0 : 4) + (node.health === 'bad' ? 0 : node.health === 'warn' ? 1 : 2) + (ix.system[node.namespace] ? 8 : 0);
    };
    roots.sort(function (a, b) { return rank(a) - rank(b); });
    return roots[0] || null;
  }

  /**
   * What the picture is centred on: one workload, or all of them.

   * All of them is the question "what does this namespace stand on" — every
   * node, zone and storage class under any of its workloads, on one page, with
   * the ones they all share marked.

    var wanted = state.view.focus;
    if (wanted !== '*' && !Array.isArray(wanted)) { var one = mapFocus(); return one ? [one] : []; }
    var roots = mapRoots();
    if (wanted === '*') return roots;
    var picked = roots.filter(function (root) { return wanted.indexOf(root.id) >= 0; });
    // Every one of them gone from the cluster since they were picked: back to one, rather than an empty page.
    if (!picked.length) { var fallback = mapFocus(); return fallback ? [fallback] : []; }
    return picked;
  }

  /** Every workload that could be in the middle, namespace by namespace. */
  function mapRoots() {
    var units = mapUnits();
    var roots = [];
    Object.keys(units).sort().forEach(function (ns) { units[ns].forEach(function (unit) { if (!unit.bare) roots.push(unit.root); }); });
    return roots;
  }

  /**
   * The list the workloads are picked from.
   *
   * Ticks rather than a single choice, because the useful question is often
   * about a handful — the three services that make up one product, the two
   * databases — and neither "one" nor "all of them" answers it. What is typed
   * in the filter box narrows the list, which is the only way through a
   * namespace with eighty workloads in it.
   */
  function mapFocusMenu(focuses) {
    var roots = mapRoots();
    var chosen = {};
    focuses.forEach(function (entry) { chosen[entry.id] = true; });
    var everything = focuses.length === roots.length && roots.length > 1;
    var label = everything ? 'All ' + roots.length + ' workloads'
      : focuses.length === 1 ? (focuses[0].tech ? focuses[0].tech + ' · ' : '') + focuses[0].name
        : focuses.length + ' workloads';
    var html = '<span class="map-drop"><button class="btn on" data-map-menu="focus" title="Whose dependencies to draw">' + esc(label) + ' ▾</button>';
    if (mapMenuOpen !== 'focus') return html + '</span>';

    html += '<div class="map-menu"><div class="map-row"><button class="link" data-map-pick-all="1">All ' + roots.length + '</button>' +
      '<span class="dim">' + (text ? 'filtered by “' + esc(text) + '”' : 'Tick the ones to draw together') + '</span></div>';
    var last = null;
    roots.forEach(function (root) {
      if (text && (root.name + ' ' + root.namespace + ' ' + (root.tech || '')).toLowerCase().indexOf(text) < 0) return;
      if (root.namespace !== last) {
        last = root.namespace;
        /*
         * A namespace is ticked as one: its heading is a tick for everything
         * under it, half-filled when only some are in. Forty names in `prod`
         * were forty clicks.
         */
        var inNs = roots.filter(function (other) { return other.namespace === root.namespace; });
        var ticked = inNs.filter(function (other) { return chosen[other.id]; }).length;
        html += '<div class="map-row map-head in"><button class="map-tick' + (ticked === inNs.length ? ' on' : ticked ? ' some' : '') + '" data-map-pick-ns="' + esc(root.namespace) + '" ' +
          'title="' + (ticked === inNs.length ? 'Take all of ' : 'Tick all of ') + esc(root.namespace) + '">' +
          '<i>' + (ticked === inNs.length ? '✓' : ticked ? '–' : '') + '</i><span>' + esc(root.namespace) + '</span><small>' + ticked + '/' + inNs.length + '</small></button>' +
          '<button class="link" data-map-pick-ns-only="' + esc(root.namespace) + '" title="Draw this namespace alone">only</button></div>';
      }
      html += '<div class="map-row in"><button class="map-tick' + (chosen[root.id] ? ' on' : '') + '" data-map-pick="' + esc(root.id) + '" title="' + esc(root.name) + '">' +
        '<i>' + (chosen[root.id] ? '✓' : '') + '</i><span>' + esc(root.name) + '</span><small>' + esc(root.tech || root.kind) + '</small></button>' +
        '<button class="link" data-map-pick-only="' + esc(root.id) + '" title="Draw this one alone">only</button></div>';
    });
    return html + '</div></span>';
  }

  /**
   * What goes if this goes.
   *
   * Worked out from where things are and how many of them there are — never
   * measured, and it says so. It does not know that a database needs a
   * majority; it knows which pods would be gone and how many would be left.
   */
  function mapFailure(key, focusIds, focusPods) {
    var data = state.map;
    var ix = state.mapIndex;
    var target = key.split('//');
    var kind = target[0];
    var name = target[1];
    var lostNodes = {};
    var lostPods = {};
    var lostVolumes = [];
    if (kind === 'Node' || kind === 'Zone' || kind === 'Pool') {
      data.nodes.forEach(function (node) {
        if (node.kind !== 'Node') return;
        if (kind === 'Node' ? node.name === name : kind === 'Zone' ? node.zone === name : (node.pool || '(no pool)') === name) lostNodes[node.name] = true;
      });
      data.nodes.forEach(function (node) {
        if (node.kind === 'Pod' && lostNodes[node.node] && !node.finished) lostPods[node.id] = node;
        if (node.kind === 'PersistentVolume' && (lostNodes[node.attachedTo] || lostNodes[node.pinnedTo])) lostVolumes.push(node);
      });
    } else {
      data.nodes.forEach(function (node) {
        if (node.kind !== 'PersistentVolume' || node.className !== name) return;
        lostVolumes.push(node);
        mapFrom(node.id, 'binds').forEach(function (claim) {
          mapFrom(claim.id, 'mounts').forEach(function (pod) { lostPods[pod.id] = pod; });
        });
      });
    }

    var mine = focusPods.filter(function (pod) { return lostPods[pod.id]; });
    var left = focusPods.filter(function (pod) { return !lostPods[pod.id] && pod.ready; }).length;
    var what = kind === 'StorageClass' ? 'lose their disk' : 'are lost';
    var own = !mine.length
      ? 'None of its pods are affected.'
      : mine.length + ' of ' + focusPods.length + ' pods ' + what + ': ' + mine.slice(0, 3).map(function (pod) { return pod.name; }).join(', ') +
        (mine.length > 3 ? ' and ' + (mine.length - 3) + ' more' : '') + '. ' +
        (left ? left + ' ready ' + (left === 1 ? 'pod is' : 'pods are') + ' left.' : 'Nothing ready is left: it is down until they come back.');

    var owners = {};
    Object.keys(lostPods).forEach(function (id) {
      var pod = lostPods[id];
      if (!pod.owner || focusIds[pod.owner] || focusIds[pod.id]) return;
      (owners[pod.owner] || (owners[pod.owner] = [])).push(pod);
    });
    var down = [];
    var thinner = 0;
    Object.keys(owners).forEach(function (id) {
      var owner = ix.byId[id];
      if (!owner || owner.kind === 'DaemonSet') return;
      var still = mapPodsOf(id).filter(function (pod) { return !lostPods[pod.id] && pod.ready; }).length;
      if (still) thinner += 1; else down.push(owner.name);
    });
    var others = !down.length && !thinner
      ? 'Nothing else is affected.'
      : (down.length ? mapPlural(down.length, 'other workload') + ' left with no ready pod: ' + down.slice(0, 4).join(', ') +
          (down.length > 4 ? ' and ' + (down.length - 4) + ' more' : '') + '. ' : '') +
        (thinner ? mapPlural(thinner, 'workload') + ' lose some replicas and stay up.' : '');

    var local = lostVolumes.filter(function (volume) { return volume.local; }).length;
    var remote = lostVolumes.length - local;
    var disks = kind === 'StorageClass'
      ? mapPlural(lostVolumes.length, 'volume') + ' provisioned by this class. Kubernetes sees no second copy of them.'
      : !lostVolumes.length
        ? 'No volumes are attached there.'
        : (remote ? mapPlural(remote, 'volume') + ' detach and re-attach wherever the pods are rescheduled' +
            (kind === 'Zone' ? ' — if the volumes are zonal, only once the zone is back. ' : '. ') : '') +
          (local ? mapPlural(local, 'local volume') + ' stay with the lost node: that data is unreachable.' : '');
    return { own: own, others: others, disks: disks, pods: lostPods, nodes: lostNodes };
  }

  /**
   * One workload in the middle, and everything it stands on fanned out from it.
   *
   * To the left, what reaches it. To the right, in two rows: where it runs —
   * pods, nodes, pools, zones — and where its data is — claims, volumes, class,
   * driver. Anything every replica depends on is marked, because that is the
   * thing whose failure takes all of them.
   */
  function mapGraph() {
    var data = state.map;
    var ix = state.mapIndex;
    var ui = mapUi();
    var focuses = mapFocuses();
    var focus = focuses[0];
    if (!focus) return { w: 600, h: 120, html: '<div class="note" style="position:absolute;left:16px;top:16px">There is no workload here to look at.</div>', edges: '' };
    var many = focuses.length > 1;
    var focusIds = {};
    focuses.forEach(function (entry) { focusIds[entry.id] = true; });

    var W = 160;
    var X = [16, 204, 392, 580, 768, 956, 1144, 1332];
    var mid = MAP_CH / 2;
    var pods = [];
    // Which of the workloads in the middle each pod belongs to — through its jobs, when that is a CronJob.
    var podOf = {};
    focuses.forEach(function (entry) {
      (entry.kind === 'Pod' ? [entry] : mapPodsOf(entry.id).filter(function (pod) { return !pod.finished; })).forEach(function (pod) {
        podOf[pod.id] = entry.id;
        pods.push(pod);
      });
    });
    var machines = mapUnique(pods.map(function (pod) { return ix.byId['Node//' + pod.node]; }));
    var pseudo = function (kind, name, line) { return { id: kind + '//' + name, kind: kind, name: name, namespace: '', status: line, health: 'ok' }; };
    var poolNames = {};
    var zoneNames = {};
    machines.forEach(function (node) {
      (poolNames[node.pool || '(no pool)'] || (poolNames[node.pool || '(no pool)'] = [])).push(node);
      if (node.zone) (zoneNames[node.zone] || (zoneNames[node.zone] = [])).push(node);
    });
    var claims = [];
    pods.forEach(function (pod) { claims = claims.concat(mapTo(pod.id, 'mounts')); });
    claims = mapUnique(claims);
    var volumes = [];
    claims.forEach(function (claim) { volumes = volumes.concat(mapTo(claim.id, 'binds')); });
    volumes = mapUnique(volumes);
    var classes = [];
    volumes.forEach(function (volume) { classes = classes.concat(mapTo(volume.id, 'class')); });
    claims.forEach(function (claim) { classes = classes.concat(mapTo(claim.id, 'class')); });
    classes = mapUnique(classes);
    var drivers = [];
    classes.forEach(function (klass) { drivers = drivers.concat(mapTo(klass.id, 'driver')); });
    drivers = mapUnique(drivers);
    var services = [];
    focuses.forEach(function (entry) { services = services.concat(mapFrom(entry.id, 'routes')); });
    services = mapUnique(services);
    var users = [];
    services.forEach(function (service) {
      (((ix.inn.uses || {})[service.id]) || []).forEach(function (edge) {
        // One of the workloads in the middle using another is already on the page, as itself.
        if (ix.byId[edge.from] && !focusIds[edge.from]) users.push({ node: ix.byId[edge.from], to: service, via: edge.via, inferred: true });
      });
      mapFrom(service.id, 'exposes').forEach(function (ingress) { users.push({ node: ingress, to: service }); });
    });
    var needs = many ? [] : (((ix.out.uses || {})[focus.id]) || []).map(function (edge) {
      var service = ix.byId[edge.to];
      var behind = service ? mapTo(service.id, 'routes')[0] : null;
      return service ? { node: behind || service, via: edge.via, through: service.name } : null;
    }).filter(Boolean);
    var policies = many ? [] : mapFrom(focus.id, 'policy');

    var replicated = pods.length >= 2;
    var sim = ui.sim ? mapFailure(ui.sim, focusIds, pods) : null;
    var hit = function (node) {
      if (!sim) return false;
      if (node.id === ui.sim) return true;
      if (node.kind === 'Pod') return Boolean(sim.pods[node.id]);
      if (node.kind === 'Node') return Boolean(sim.nodes[node.name]);
      if (node.kind === 'Pool') return ui.sim === node.id;
      if (node.kind === 'PersistentVolume') return ui.sim === 'StorageClass//' + node.className || Boolean(sim.nodes[node.attachedTo]);
      return false;
    };

    var html = '';
    var edges = '';
    var where = {};
    var put = function (node, col, y, o) {
      o = o || {};
      o.w = W;
      if (hit(node)) o.cls = (o.cls ? o.cls + ' ' : '') + 'mhit';
      if (state.search && (node.name + ' ' + node.kind + ' ' + (node.namespace || '')).toLowerCase().indexOf(state.search) < 0) o.cls = (o.cls ? o.cls + ' ' : '') + 'off';
      html += mapCard(node, X[col], y, o);
      where[node.id] = { x: X[col], y: y, h: o.h || MAP_CH };
    };
    var link = function (a, b, cls, nearSource) {
      var from = where[a];
      var to = where[b];
      if (!from || !to) return;
      edges += mapPath(mapElbow(from.x + W, from.y + from.h / 2, to.x, to.y + to.h / 2, nearSource), cls || '', a, b);
    };
    var label = function (col, y, words) { html += '<div class="mlabel" style="left:' + X[col] + 'px;top:' + y + 'px">' + words + '</div>'; };
    /** A column of cards, folded past eight so one big Deployment does not become the whole page. */
    var column = function (list, col, y, key, each) {
      var shown = list.length > 8 && !ui.more[key] ? list.slice(0, 7) : list;
      shown.forEach(function (node, at) { put(node, col, y + at * MAP_ROW, each ? each(node) : null); });
      if (shown.length < list.length) {
        html += mapCard(focus, X[col], y + shown.length * MAP_ROW, { more: key, cls: 'stack', w: W, health: mapWorst(list.slice(7)), name: '+ ' + (list.length - 7) + ' more', line: 'show them' });
        return shown.length + 1;
      }
      if (list.length > 8) {
        html += '<button class="mfold" data-map-more="' + esc(key) + '" style="left:' + X[col] + 'px;top:' + (y + shown.length * MAP_ROW - 6) + 'px">▴ show fewer</button>';
      }
      return shown.length;
    };
    var spof = function (count, words) { return replicated && count === 1 ? { cls: 'spof', line: words } : null; };

    var y0 = 34;
    label(0, 10, 'Reaches it · ' + users.length);
    label(1, 10, 'Services · ' + services.length);
    label(2, 10, many ? 'Workloads · ' + focuses.length : 'Focus');
    label(3, 10, 'Pods · ' + pods.length);
    label(4, 10, 'Nodes · ' + machines.length);
    label(5, 10, 'Pools · ' + Object.keys(poolNames).length);
    label(6, 10, (machines[0] && machines[0].zoneKind === 'region' ? 'Region' : 'Zone') + ' · ' + Object.keys(zoneNames).length);

    var rows = [];
    if (many) {
      rows.push(column(focuses, 2, y0, 'g:focus', function (entry) {
        return entry.tech ? { html: esc(entry.status) + ' · <span class="mtag inf" title="Read off the image name">' + esc(entry.tech) + '</span>' } : null;
      }));
    } else put(focus, 2, y0, {
      cls: 'focus', h: 56,
      html: esc(focus.kind + (focus.status ? ' · ' + focus.status : '')) + '<br>' + esc(focus.namespace) +
        (focus.tech ? ' <span class="mtag inf" title="Read off the image name">' + esc(focus.tech + (focus.techVersion ? ' ' + focus.techVersion : '')) + '</span>' : ''),
    });
    if (!many) rows.push(2);
    rows.push(column(mapUnique(users.map(function (user) { return user.node; })), 0, y0, 'g:users', function (node) {
      var user = users.filter(function (entry) { return entry.node === node; })[0];
      return user.inferred ? { cls: 'inf', line: 'inferred · ' + user.via } : null;
    }));
    rows.push(column(services, 1, y0, 'g:services'));
    users.forEach(function (user) { link(user.node.id, user.to.id, user.inferred ? 'inf' : ''); });
    services.forEach(function (service) {
      mapTo(service.id, 'routes').forEach(function (target) { if (focusIds[target.id]) link(service.id, target.id, '', true); });
    });

    rows.push(column(pods, 3, y0, 'g:pods', function (pod) {
      return { line: pod.status + (pod.role ? ' · ' + pod.role : '') + (pod.restarts ? ' · ' + mapPlural(pod.restarts, 'restart') : '') };
    }));
    pods.forEach(function (pod) { if (podOf[pod.id] !== pod.id) link(podOf[pod.id], pod.id); });
    rows.push(column(machines, 4, y0, 'g:nodes', function (node) {
      return spof(machines.length, many ? 'every pod here is on it' : 'every replica is here') || { name: mapShort(node.name) };
    }));
    pods.forEach(function (pod) { link(pod.id, 'Node//' + pod.node); });
    var pools = Object.keys(poolNames).map(function (name) { return pseudo('Pool', name, mapPlural(poolNames[name].length, 'node')); });
    rows.push(column(pools, 5, y0, 'g:pools', function () { return spof(pools.length, many ? 'every pod here is on it' : 'every replica is here'); }));
    machines.forEach(function (node) { link(node.id, 'Pool//' + (node.pool || '(no pool)')); });
    var zones = Object.keys(zoneNames).map(function (name) { return pseudo('Zone', name, mapPlural(zoneNames[name].length, 'node')); });
    rows.push(column(zones, 6, y0, 'g:zones', function () { return spof(zones.length, many ? 'every pod here is on it' : 'every replica is here'); }));
    machines.forEach(function (node) { if (node.zone) link('Pool//' + (node.pool || '(no pool)'), 'Zone//' + node.zone); });

    // Under the focus: what it needs that is not a machine or a disk.
    var under = many ? y0 : y0 + 56 + 26;
    if (needs.length) {
      label(2, under - 18, 'Uses · inferred');
      needs.forEach(function (need, at) {
        html += mapCard(need.node, X[2], under + at * MAP_ROW, { w: W, cls: 'inf', line: need.via + ' → ' + need.through });
      });
      under += needs.length * MAP_ROW + 26;
    }
    if (policies.length || focus.pdb) {
      label(2, under - 18, 'Policies');
      policies.forEach(function (policy, at) { html += mapCard(policy, X[2], under + at * MAP_ROW, { w: W }); });
      under += policies.length * MAP_ROW;
      if (focus.pdb) {
        html += '<div class="mcard c-nw h-ok" style="left:' + X[2] + 'px;top:' + under + 'px;width:' + W + 'px;cursor:default"><i class="mdot"></i>' +
          '<span class="mtext"><b>' + esc(focus.pdb) + '</b><small>PodDisruptionBudget</small></span></div>';
        under += MAP_ROW;
      }
    }

    var y1 = Math.max(y0 + Math.max.apply(null, rows) * MAP_ROW, claims.length ? 0 : under) + 34;
    var bottom = y1 - 34;
    if (claims.length) {
      label(4, y1 - 24, 'Claims · ' + claims.length);
      label(5, y1 - 24, 'Volumes · ' + volumes.length);
      label(6, y1 - 24, 'Storage class · ' + classes.length);
      if (drivers.length) label(7, y1 - 24, 'Driver');
      var lower = [];
      lower.push(column(claims, 4, y1, 'g:claims'));
      lower.push(column(volumes, 5, y1, 'g:volumes'));
      lower.push(column(classes, 6, y1, 'g:classes', function () { return spof(classes.length, 'every volume is here'); }));
      lower.push(column(drivers, 7, y1, 'g:drivers'));
      pods.forEach(function (pod) { mapTo(pod.id, 'mounts').forEach(function (claim) { link(pod.id, claim.id); }); });
      claims.forEach(function (claim) {
        mapTo(claim.id, 'binds').forEach(function (volume) { link(claim.id, volume.id); });
        mapTo(claim.id, 'class').forEach(function (klass) { link(claim.id, klass.id, 'inf'); });
      });
      volumes.forEach(function (volume) { mapTo(volume.id, 'class').forEach(function (klass) { link(volume.id, klass.id, '', true); }); });
      classes.forEach(function (klass) { mapTo(klass.id, 'driver').forEach(function (driver) { link(klass.id, driver.id); }); });
      bottom = y1 + Math.max.apply(null, lower) * MAP_ROW;
    }
    bottom = Math.max(bottom, under) + 20;

    /* What is fragile, and what would go with what. */
    var findings = [];
    focuses.forEach(function (entry) {
      ((data.findings || {})[entry.id] || []).forEach(function (finding) {
        findings.push(many ? assign(assign({}, finding), { title: entry.name + ': ' + finding.title }) : finding);
      });
    });
    // What is broken now, then what everything shares, then the rest — across all of them.
    var order = { now: 0, spof: 1, risk: 2 };
    if (many) findings.sort(function (a, b) { return order[a.level] - order[b.level]; });
    var hidden = Math.max(0, findings.length - 14);
    if (hidden) findings = findings.slice(0, 14);
    var tags = { now: ['bad', 'happening now'], spof: ['warn', 'single point of failure'], risk: ['', 'risk'] };
    var boxW = 520;
    html += '<div class="mbox" style="left:16px;top:' + bottom + 'px;width:' + boxW + 'px"><b>Risks' + (findings.length ? ' · ' + (findings.length + hidden) : '') + '</b>' +
      (findings.length ? ' <button class="link" data-map-plan="review" title="Hand these to Claude, to say what to change and how">Review with Claude</button>' : '') +
      (findings.length ? findings.map(function (finding) {
        var tag = tags[finding.level] || tags.risk;
        return '<div class="mfind"><span class="mtag ' + tag[0] + '">' + tag[1] + '</span> <b>' + esc(finding.title) + '</b><p>' +
          esc(finding.text) + ' <span class="mtag">' + esc(finding.source) + '</span></p></div>';
      }).join('') + (hidden ? '<div class="mfind"><p>And ' + hidden + ' more. Pick one workload to see all of its own.</p></div>' : '')
        : '<p class="dim">Nothing stands out from where ' + (many ? 'they run and how they are' : 'it runs and how it is') + ' spread.</p>') +
      (!many && focus.tech ? '<div class="mfind"><p>What happens inside ' + esc(focus.tech) + ' — which member is primary, replication lag — is not in the Kubernetes API. ' +
        (focus.exporter ? 'An exporter runs beside it; its numbers are in Prometheus.' : 'It needs an exporter scraped by Prometheus.') +
        ' Nothing here asks for database credentials.</p></div>' : '') + '</div>';

    var targets = machines.map(function (node) { return [node.id, mapShort(node.name)]; }).slice(0, 8)
      .concat(pools.map(function (pool) { return [pool.id, pool.name]; }))
      .concat(zones.map(function (zone) { return [zone.id, zone.name]; }))
      .concat(classes.map(function (klass) { return [klass.id, klass.name]; }));
    html += '<div class="mbox" style="left:' + (16 + boxW + 16) + 'px;top:' + bottom + 'px;width:' + (X[7] + W - boxW - 32) + 'px">' +
      '<b>What goes with it, if this fails?</b> <span class="mtag inf">reasoned from placement, not measured</span>' +
      (data.scoped ? ' <span class="mtag warn" title="Pick All namespaces to see what else would go">only ' + esc(state.namespace) + ' was read</span>' : '') +
      '<div class="msim-pick">' + (targets.length ? targets.map(function (target) {
        return '<button class="btn' + (ui.sim === target[0] ? ' on' : '') + '" data-map-sim="' + esc(target[0]) + '">' + esc(target[1]) + '</button>';
      }).join('') : '<span class="dim">Its pods are not on any node yet.</span>') + '</div>' +
      (sim ? '<div class="msim"><div><small>' + esc(many ? 'These workloads' : focus.name) + '</small>' + esc(sim.own) + '</div><div><small>Other workloads</small>' +
        esc(sim.others) + '</div><div><small>Data</small>' + esc(sim.disks) + '</div></div>'
        : (targets.length ? '<p class="dim">Pick a node, a pool, a zone or a storage class.</p>' : '')) + '</div>';

    return { w: X[7] + W + 24, h: bottom + 40, html: html, edges: edges, tall: true };
  }

  /* ---- What the map knows about one thing, for the pane ----------------- */

  /*
   * The pane used to open on `kubectl describe`: everything, in the order the
   * API happens to hold it. What somebody opens a database to find out is
   * shorter than that and is not in one place — where its pods are, what disk
   * is behind each, what reaches it, what would take it down. The map has
   * already worked all of that out, so the pane says it first, and every name
   * in it is a way to the next thing.
   */
  var mapTrail = [];

  function mapGo(node, extra) {
    if (!node) return '';
    return '<button class="mgo h-' + esc(node.health || 'ok') + '" data-map-go="' + esc(node.id) + '" title="' + esc(mapTip(node)) + '">' +
      '<i class="mdot"></i><span class="mtext"><b>' + esc(node.kind === 'Node' ? mapShort(node.name) : node.name) + '</b>' +
      (extra ? '<small>' + esc(extra) + '</small>' : '') + '</span></button>';
  }

  function mapStats(list) {
    return '<div class="mglance">' + list.filter(Boolean).map(function (entry) {
      return '<div class="mstat ' + (entry[2] || '') + '"><b>' + esc(entry[0]) + '</b><span>' + esc(entry[1]) + '</span></div>';
    }).join('') + '</div>';
  }

  function mapMeter(label, part, whole, words) {
    if (!whole) return '';
    var bar = mapBar(part, whole);
    return '<div class="mmeter"><span>' + esc(label) + '</span>' + bar.html + '<small>' + esc(words) + '</small></div>';
  }

  function mapList(nodes, each, limit) {
    var shown = nodes.slice(0, limit || 30);
    return '<div class="mgos">' + shown.map(function (node) { return mapGo(node, each ? each(node) : ''); }).join('') +
      (nodes.length > shown.length ? '<span class="dim">and ' + (nodes.length - shown.length) + ' more</span>' : '') + '</div>';
  }

  /** A pod to its disk: claim, volume, class, each a step that can be followed. */
  function mapStorageRows(claims) {
    return claims.map(function (claim) {
      var volume = mapTo(claim.id, 'binds')[0];
      var klass = volume ? mapTo(volume.id, 'class')[0] : mapTo(claim.id, 'class')[0];
      return '<div class="mchain">' + mapGo(claim, claim.capacity) + '<i>›</i>' +
        (volume ? mapGo(volume, volume.attachedTo ? 'on ' + mapShort(volume.attachedTo) : volume.local ? 'local' : 'not attached') : '<span class="dim">no volume yet</span>') +
        (klass ? '<i>›</i>' + mapGo(klass, klass.provisioner) : '') + '</div>';
    }).join('');
  }

  /* ---------------------------------------------------------------------- *
   * Warnings that are over.
   *
   * The cluster goes on repeating what it said for about an hour, whether or
   * not it is still true, and a number in red on a row that has been healthy
   * for fifty minutes teaches people not to look at numbers in red. So there
   * are two ways out of the count. One is the cluster's own evidence: a pod
   * that became ready after it was last complained about got over it, and the
   * map reader counts that apart. The other is the reader's: "Clear" puts what
   * has been said about one thing aside as of now. Nothing is deleted from the
   * cluster, and anything said again afterwards is counted again.
   * ---------------------------------------------------------------------- */
  function mapNow() {
    if (state.map && state.mapFor === mapKey()) return state.map;
    return (mapCache[mapKey()] || mapCache[(state.context || '') + '/'] || {}).result || null;
  }
  /** Anything the map drew, by its id; indexed once per reading of the map. */
  function mapNode(id) {
    var data = mapNow();
    if (!data) return null;
    if (!data.byIdAll) { data.byIdAll = {}; (data.nodes || []).forEach(function (one) { data.byIdAll[one.id] = one; }); }
    return data.byIdAll[id] || null;
  }
  /** The pods each workload made, worked out once per reading of the map. */
  function podsOf(id) {
    var data = mapNow();
    if (!data) return [];
    if (!data.podsOf) {
      data.podsOf = {};
      (data.nodes || []).forEach(function (node) {
        if (node.kind === 'Pod' && node.owner) (data.podsOf[node.owner] || (data.podsOf[node.owner] = [])).push(node);
      });
    }
    return data.podsOf[id] || [];
  }
  function stillSaid(node) {
    if (!node || !node.warnings) return 0;
    var since = state.cleared[node.id] || 0;
    if (!since) return node.warnings;
    // A map read by an older reader has the count and not the times: then the latest one decides for all.
    if (!node.warnTimes) return (Date.parse(node.warnedAt) || 0) > since ? node.warnings : 0;
    return node.warnTimes.filter(function (at) { return (Date.parse(at) || 0) > since; }).length;
  }
  /** What is being complained about now: its own, and for a workload its pods'. */
  function warnedCount(node) {
    if (!node) return 0;
    var count = stillSaid(node);
    if (node.podWarnings) podsOf(node.id).forEach(function (pod) { count += stillSaid(pod); });
    return count;
  }
  /** What was complained about and is over: got over by the pod, or put aside here. */
  function warnedPast(node) {
    if (!node) return 0;
    var all = (node.warnings || 0) + (node.podWarnings || 0) + (node.warningsPast || 0);
    return Math.max(0, all - warnedCount(node));
  }
  function clearWarnings(node) {

    });
    var only = one ? '' : ' disabled title="Light one pool only for this"';
    return '<div class="map-acts"><b>' + esc(lit.names.map(function (name) { return name || 'no pool'; }).join(', ')) + '</b>' +
      '<span class="dim">' + mapPlural(lit.nodes.length, 'node') + (Object.keys(types).length ? ' · ' + esc(Object.keys(types).join(', ')) : '') +
      (state.map.scoped ? '' : ' · ' + mapPlural(room.pods, 'pod') + ' · CPU ' + mapBar(room.cpu, room.cpuAll).pct + '% · memory ' + mapBar(room.mem, room.memAll).pct + '% requested') +
      (shut ? ' · ' + shut + ' cordoned' : '') + '</span><span class="sep"></span>' +
      '<button class="btn" data-map-act="cordon" title="Stop new pods landing on these nodes. What runs there keeps running.">Cordon</button>' +
      '<button class="btn" data-map-act="uncordon" title="Let pods be scheduled on these nodes again">Uncordon</button>' +
      '<button class="btn bad" data-map-act="drain" title="Move everything off these nodes, one node at a time, asking before each">Drain…</button>' +
      '<span class="sep"></span><span class="dim">With Claude</span>' +
      '<button class="btn" data-map-plan="migrate"' + only + '>Move to another machine type…</button>' +
      '<button class="btn" data-map-plan="resize"' + only + '>Resize…</button>' +
      '<button class="btn" data-map-plan="remove"' + only + '>Remove…</button>' +
      '<button class="btn" data-map-plan="ask"' + only + '>Ask about it…</button>' +
      (mapDraining ? '<span class="spacer"></span><span class="mtag warn">draining ' + esc(mapDraining.pool) + ': node ' + (mapDraining.at + 1) + ' of ' + mapDraining.names.length +
        '</span><button class="btn" data-map-act="stop-drain" title="Finish the node in hand and go no further">Stop after this node</button>' : '') +
      '</div>';
  }

  /** A pool being drained, a node at a time: which nodes, and how far it has got. */
  var mapDraining = null;

  function mapDrainNext() {
    var job = mapDraining;
    if (!job) return;
    if (job.at >= job.names.length || job.stop) {
      say(job.stop ? 'Stopped after ' + job.at + ' of ' + job.names.length + ' nodes of ' + job.pool + '.' : 'Every node of ' + job.pool + ' has been drained.');
      mapDraining = null;
      load(true);
      return;
    }
    var name = job.names[job.at];
    // Asked about one node at a time, by the app: a yes to the first is not a yes to the sixth.
    call('kube.drain', { context: state.context, name: name, step: (job.at + 1) + ' of ' + job.names.length, pool: job.pool })
      .then(function (result) {
        job.id = result.id;
        openStreamTab('drain ' + mapShort(name), result.id);
        mapRedraw();
      })
      .catch(function (error) {
        mapDraining = null;
        say(String(error.message || error), true);
        mapRedraw();
      });
  }

  /** A stream ended. If it was the drain in hand, the next node — or a stop, when that one did not go cleanly. */
  function mapStreamEnded(payload) {
    var job = mapDraining;
    if (!job || job.id !== payload.id) return;
    if (payload.code) {
      say('Draining ' + mapShort(job.names[job.at]) + ' did not finish, so the rest of ' + job.pool + ' was left alone. Its output is in the dock.', true);
      mapDraining = null;
      load(true);
      return;
    }
    job.at += 1;
    job.id = null;
    load(true);
    mapDrainNext();
  }

  /** Draw the map again though nothing about the data moved: something beside it did. */
  function mapRedraw() {
    var view = document.getElementById('map-view');
    if (view) view.dataset.drawn = '';
    // Through `draw`, so that it too waits for a held button to be let go.
    if (state.view.type === 'map') draw({ keepDock: true });
  }

  function mapAct(what) {
    if (what === 'stop-drain') { if (mapDraining) mapDraining.stop = true; say('It will stop once the node in hand is done.'); return; }
    var lit = mapLitPools();
    var names = lit.nodes.map(function (node) { return node.name; });
    var label = lit.names.map(function (name) { return name || 'no pool'; }).join(', ');
    if (!names.length) return;
    if (what === 'cordon' || what === 'uncordon') {
      run(call('kube.cordonMany', { context: state.context, names: names, on: what === 'cordon', pool: label }),
        (what === 'cordon' ? 'Cordoned ' : 'Uncordoned ') + mapPlural(names.length, 'node') + ' of ' + label + '.');
      return;
    }
    if (what === 'drain') {
      if (mapDraining) { say('A drain of ' + mapDraining.pool + ' is already under way.', true); return; }
      mapDraining = { names: names.sort(), at: 0, pool: label, id: null, stop: false };
      mapDrainNext();
    }
  }

  /* The form a change is described in. It sits over the panel rather than in the
     map, so the map being redrawn underneath does not take what was typed. */
  var MAP_PLANS = {
    'new': { title: 'A new node group', go: 'Plan it with Claude',
      lead: 'Claude gets what you write here and what the cluster looks like, and adds the group where your node groups are defined. It asks before it applies anything.' },
    migrate: { title: 'Move this pool to another machine type', go: 'Plan it with Claude',
      lead: 'A new group on the new machines is made beside this one, the workloads are moved across a node at a time, and the old one is retired. Claude does each step only after you agree to it.' },
    resize: { title: 'Resize this node group', go: 'Plan it with Claude',
      lead: 'Growing adds nodes. Shrinking drains the ones that will go first, rather than letting them be taken from under running pods.' },
    remove: { title: 'Remove this node group', go: 'Plan it with Claude',
      lead: 'Everything on it is moved elsewhere first, and it is removed only when it runs nothing but DaemonSets — on a separate yes.' },
    ask: { title: 'Ask Claude', go: 'Ask',
      lead: 'Claude is handed what the map knows — the pools, what runs on them, what is fragile — together with your question.' },
  };

  function mapCloseForm() {
    var form = document.getElementById('map-form');
    if (form) form.remove();
  }

  function mapOpenForm(op) {
    mapCloseForm();
    var plan = MAP_PLANS[op];
    if (!plan) return;
    var lit = mapLitPools();
    var pool = lit.names.length === 1 ? lit.names[0] : '';
    var types = {};
    var pools = {};
    state.map.nodes.forEach(function (node) {
      if (node.kind !== 'Node') return;
      if (node.instance) types[node.instance] = true;
      pools[node.pool || ''] = true;
    });
    var field = function (id, label, attrs, hint) {
      return '<label class="mfield"><span>' + label + '</span><input id="mf-' + id + '" ' + (attrs || '') + ' />' + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
    };
    var sizes = '<div class="mfield-row">' + field('min', 'Minimum', 'type="number" min="0" placeholder="as now"') +
      field('desired', 'Desired', 'type="number" min="0" placeholder="as now"') + field('max', 'Maximum', 'type="number" min="0" placeholder="as now"') + '</div>';
    var machine = field('machine', op === 'migrate' ? 'New machine type' : 'Machine type', 'list="mf-types" placeholder="for example ' + esc(Object.keys(types)[0] || 't3.large') + '"') +
      '<datalist id="mf-types">' + Object.keys(types).sort().map(function (type) { return '<option value="' + esc(type) + '">'; }).join('') + '</datalist>';
    var body = '';
    if (op === 'new') {
      body = field('name', 'Name', 'placeholder="for example prod-apps-large"') + machine + sizes +
        '<div class="mfield-row"><label class="mfield"><span>Capacity</span><select id="mf-capacity"><option value="">as its neighbours</option><option value="on-demand">on-demand</option><option value="spot">spot</option></select></label>' +
        '<label class="mfield"><span>Modelled on</span><select id="mf-like"><option value="">none</option>' +
        Object.keys(pools).sort().filter(Boolean).map(function (name) { return '<option' + (name === pool ? ' selected' : '') + '>' + esc(name) + '</option>'; }).join('') + '</select></label></div>' +
        field('zones', 'Zones', 'placeholder="the same as the pool it is modelled on"') +
        field('labels', 'Labels', 'placeholder="key=value, key=value"') + field('taints', 'Taints', 'placeholder="key=value:NoSchedule"');
    } else if (op === 'migrate') {
      body = machine + field('name', 'Name of the new group', 'placeholder="' + esc(pool) + '-v2"') +
        '<label class="mcheck"><input type="checkbox" id="mf-keep" checked /><span>Keep the old pool, cordoned and empty, until I say to remove it</span></label>';
    } else if (op === 'resize') {
      body = sizes;
    }
    if (op !== 'ask') {
      body += '<label class="mfield"><span>Change it in</span><select id="mf-via"><option value="terraform">Terraform, where the node groups are defined</option>' +
        '<option value="cli">The cloud’s own CLI — Terraform will no longer match</option></select></label>';
    }
    body += '<label class="mfield"><span>' + (op === 'ask' ? 'Your question' : 'Anything else Claude should know') + '</span><textarea id="mf-question" rows="' + (op === 'ask' ? 4 : 2) +
      '" maxlength="600" placeholder="' + (op === 'ask' ? 'Would these workloads fit on fewer, larger nodes?' : 'Optional') + '"></textarea></label>';

    var form = document.createElement('div');
    form.id = 'map-form';
    form.className = 'map-form';
    form.dataset.op = op;
    form.dataset.pool = pool;
    form.innerHTML = '<div class="map-form-card" role="dialog" aria-label="' + esc(plan.title) + '"><h3>' + esc(plan.title) + (pool ? ' <small>' + esc(pool) + '</small>' : '') + '</h3>' +
      '<p class="dim">' + plan.lead + '</p>' + body +
      '<div class="map-form-foot"><button class="btn" data-map-form="cancel">Cancel</button><button class="btn go" data-map-form="send">' + plan.go + '</button></div></div>';
    $('body').appendChild(form);
    var first = form.querySelector('input, textarea');
    if (first) first.focus();
  }

  /** Hand the change to Claude. The panel sends what was asked; the app reads the cluster and writes the brief. */
  function mapSendPlan(op, extra) {
    var value = function (id) { var el = document.getElementById('mf-' + id); return el ? el.value : ''; };
    var form = document.getElementById('map-form');
    var request = assign({ context: state.context, op: op }, extra || {});
    if (form) {
      var keep = document.getElementById('mf-keep');
      assign(request, {
        pool: form.dataset.pool, name: value('name'), machine: value('machine'), min: value('min'), desired: value('desired'), max: value('max'),
        capacity: value('capacity'), like: value('like'), zones: value('zones'), labels: value('labels'), taints: value('taints'),
        via: value('via') || 'terraform', keep: keep ? keep.checked : true, question: value('question'),
      });
      if ((op === 'migrate' || op === 'new') && !request.machine.trim()) { say('Say which machine type.', true); return; }
      if (op === 'ask' && !request.question.trim()) { say('Type the question first.', true); return; }
    }
    // What the picture was about goes along: a question asked over three workloads is a question about those three.
    if (state.view.mode === 'graph') request.workloads = mapFocuses().map(function (entry) { return entry.id; });
    mapCloseForm();
    say('Reading the cluster for Claude…');
    call('kube.askPlan', request)
      .then(function () { say('It went to the Claude session below. Nothing is changed until you agree to each step there.'); })
      .catch(function (error) { say(String(error.message || error), true); });
  }

  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-map-form]');
    if (!button) return;
    var form = document.getElementById('map-form');
    if (button.dataset.mapForm === 'cancel' || !form) { mapCloseForm(); return; }
    mapSendPlan(form.dataset.op);
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && document.getElementById('map-form')) { event.stopPropagation(); mapCloseForm(); }
  }, true);

  /* ---- Drawing, and what a click does ---------------------------------- */

  var mapScroll = {};
  var mapZoomNow = 1;
  var mapShown = '';
  var mapBring = false;
  var mapWheel = 0;
  var mapWheelFrame = 0;
  /** Rows and descriptions already read from the map, by card: what a second click shows without waiting. */
  var mapRows = {};
  var mapDescribed = {};
  var mapCacheFor = '';

  /**
   * Draw the map, and leave an open list where the reader had it.
   *
   * A tick in the list of workloads or of nodes redraws the map, and the list
   * is part of what is redrawn — so it came back at its top, and ticking the
   * fortieth name meant scrolling to it again after every tick. Its scroll is
   * read before and put back after, and it does not drop in a second time.
   */
  function drawMap() {
    var open = document.querySelector('#table .map-menu');
    var at = open ? { top: open.scrollTop, right: open.classList.contains('right') } : null;
    drawMapNow();
    var again = at ? document.querySelector('#table .map-menu') : null;
    if (again && again.classList.contains('right') === at.right) {
      again.style.animation = 'none';
      again.scrollTop = at.top;
    }
  }

  function drawMapNow() {
    var box = $('table');
    if (state.error && !state.map) {
      box.innerHTML = '<div class="note error">' + esc(state.error) + '</div>' + advice(state.error);
      return;
    }
    if (!state.map || state.mapFor !== mapKey()) {
      box.innerHTML = state.loading
        ? waiting() + '<div class="note dim">Nodes, pods, workloads, services, volumes and storage classes, read together. A large cluster takes a few seconds.</div>'
        : '<div class="note">Nothing loaded.</div>';
      return;
    }

    var ui = mapUi();
    var mode = state.view.mode || 'topology';
    var old = document.getElementById('map-view');
    /*
     * `draw` is called for a great many reasons that are not the map's — the
     * pane loading a tab, a forward coming up, a log arriving. Rebuilding five
     * hundred cards for each would be slow and, worse, would take the page out
     * from under a drag. So what was drawn is remembered, and drawn again only
     * when the data, the view, the filter or the room for it has changed.
     */
    var drawn = [state.map.at, JSON.stringify(state.view), state.search, box.clientWidth, mapMenuOpen,
      mapDraining ? mapDraining.at + (mapDraining.stop ? 's' : '') : ''].join('|');
    if (old && old.dataset.drawn === drawn) return;
    if (old && old.dataset.mode) mapScroll[old.dataset.mode] = { x: old.scrollLeft, y: old.scrollTop };

    var scene = mode === 'physical' ? mapPhysical() : mode === 'graph' ? mapGraph() : mapTopology();
    var zoom = (ui.z || {})[mode] || 1;
    var picked = state.mapIndex.byId[ui.sel];
    var toggle = function (key, on, label, title) {
      return '<button class="btn' + (on ? ' on' : '') + '" aria-pressed="' + (on ? 'true' : 'false') + '" data-map-toggle="' + key + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + label + '</button>';
    };
    var bar = '<span class="map-seg" role="group" aria-label="How to draw it">' + MAP_MODES.map(function (entry) {
      return '<button class="' + (mode === entry[0] ? 'on' : '') + '" data-map-mode="' + entry[0] + '">' + entry[1] + '</button>';
    }).join('') + '</span><span class="sep"></span>';
    if (mode === 'topology') {
      bar += toggle('net', ui.net !== false, 'Network') + toggle('storage', ui.storage !== false, 'Storage') +
        toggle('bad', ui.bad, 'Only problems') +
        '<button class="btn" data-map-fold="open">Unfold all</button><button class="btn" data-map-fold="shut">Fold all</button>';
    } else if (mode === 'physical') {
      bar += '<button class="btn" data-map-plan="new" title="Describe a new node group and have Claude add it">+ Node group…</button>' +
        '<span class="map-seg" role="group" aria-label="Shelve the nodes by"><button class="' + (ui.by !== 'zone' ? 'on' : '') + '" data-map-by="pool">By pool</button>' +
        '<button class="' + (ui.by === 'zone' ? 'on' : '') + '" data-map-by="zone">By zone</button></span>' +
        mapNodesMenu() + toggle('empty', mapShowsEmpty(), 'Empty nodes', 'Nodes with none of these pods on them') +
        toggle('sys', ui.sys, 'System pods', 'DaemonSets and system namespaces') + toggle('bad', ui.bad, 'Only problems') +
        (Object.keys(ui.pools || {}).length
          ? '<button class="btn on" data-map-toggle="pools" title="Stop highlighting node pools">' + mapPlural(Object.keys(ui.pools).length, 'pool') + ' lit ✕</button>' : '') +
        (ui.hl && state.mapIndex.byId[ui.hl]
          ? '<button class="btn on" data-map-toggle="hl" title="Stop highlighting">' + esc(state.mapIndex.byId[ui.hl].name) + ' ✕</button>' : '');
    } else {
      bar += mapFocusMenu(mapFocuses());
    }
    var target = picked && picked.kind === 'Pod' && picked.owner ? state.mapIndex.byId[picked.owner] : picked;
    var middle = mode === 'graph' ? mapFocuses() : [];
    if (mapFocusable(target) && !(middle.length === 1 && middle[0] === target)) {
      bar += '<button class="btn" data-map-focus-on="' + esc(target.id) + '" title="Draw what ' + esc(target.name) + ' depends on">Dependencies of ' + esc(target.name) + '</button>';
    }
    bar += '<span class="spacer"></span>' + mapLegend() + '<button class="btn with-icon" data-map-plan="' + (mode === 'graph' ? 'review' : 'ask') + '" title="' +
      (mode === 'graph' ? 'Have Claude review how these workloads are placed and what would take them down' : 'Ask Claude about what is on this map') + '">' +
      (mode === 'graph' ? 'Review with Claude' : 'Ask Claude…') + '</button>' +
      '<span class="mtag" title="Stated by the Kubernetes API">API</span>' +
      '<span class="mtag inf" title="Worked out: from an image name, or a service named in a pod template">inferred</span>' +
      (state.map.metrics ? '<span class="mtag" title="Usage comes from metrics-server">metrics</span>' : '') +
      '<span class="sep"></span><span class="map-zoom"><button class="btn icon" data-map-zoom="out" aria-label="Zoom out">−</button>' +
      '<span class="dim" id="map-zoom" style="min-width:34px;text-align:center">' + Math.round(zoom * 100) + '%</span>' +
      '<button class="btn icon" data-map-zoom="in" aria-label="Zoom in">+</button><button class="btn" data-map-zoom="fit">Fit</button></span>';

    var missing = (state.map.missing || []).map(function (gap) { return gap.what; });
    var inner = scene.flow
      ? '<div class="map-inner flow" id="map-inner">' + scene.html + '<svg class="msvg" id="map-lines"></svg></div>'
      : '<div class="map-inner" id="map-inner" style="width:' + scene.w + 'px;height:' + scene.h + 'px">' +
        '<svg class="msvg" width="' + scene.w + '" height="' + scene.h + '">' + scene.edges + '</svg>' + scene.html + '</div>';

    box.innerHTML = '<div class="map"><div class="map-bar">' + bar + '</div>' +
      '<div>' + (missing.length ? '<div class="map-note">Not drawn, because the cluster would not list them: ' + esc(missing.join('; ')) + '.</div>' : '') +
      (mode === 'physical' && ui.by !== 'zone' ? mapPoolBar() : '') +
      // A drain in hand is said, and can be stopped, from whichever way the map is being looked at.
      (mapDraining && !(mode === 'physical' && ui.by !== 'zone' && mapLitPools().names.length)
        ? '<div class="map-acts"><span class="mtag warn">draining ' + esc(mapDraining.pool) + ': node ' + (mapDraining.at + 1) + ' of ' + mapDraining.names.length +
          '</span><button class="btn" data-map-act="stop-drain" title="Finish the node in hand and go no further">Stop after this node</button></div>' : '') +
      '</div>' +
      '<div class="map-view" id="map-view" data-mode="' + mode + '">' +
      /*
       * The column headings ride at the top of the pane: forty rows down, "which
       * column is this" should still have an answer. Outside the scaled canvas,
       * because a thing that sticks inside a scaled box only follows the scroll
       * by the scale's share of it — at 80% it drifts off the top a fifth as
       * fast as the page moves.
       */
      (scene.head ? '<div class="mhead" id="map-head"><div class="mhead-in" id="map-head-in">' + scene.head + '</div></div>' : '') +
      '<div class="map-size" id="map-size">' + inner + '</div></div></div>';

    var view = document.getElementById('map-view');
    var canvas = document.getElementById('map-inner');
    if (scene.flow) {
      // Laid out by the browser at the width there is, then measured for its lines.
      canvas.style.width = Math.max(980, Math.floor((view.clientWidth - 2) / zoom)) + 'px';
      var lines = document.getElementById('map-lines');
      lines.setAttribute('width', canvas.offsetWidth);
      lines.setAttribute('height', canvas.offsetHeight);
      lines.innerHTML = mapPhysicalLines(canvas);
    }
    /*
     * Until somebody zooms, a drawing a little wider than the pane is shrunk to
     * fit it — but never so far that it stops being readable; past that it
     * scrolls, and Fit is one click away.
     */
    if (!scene.flow && !(ui.z || {})[mode]) {
      zoom = Math.max(0.75, Math.min(1, Math.floor(((view.clientWidth - 12) / canvas.offsetWidth) * 20) / 20));
      document.getElementById('map-zoom').textContent = Math.round(zoom * 100) + '%';
    }
    mapZoomNow = zoom;
    canvas.style.transform = 'scale(' + zoom + ')';
    var size = document.getElementById('map-size');
    size.style.width = Math.ceil(canvas.offsetWidth * zoom) + 'px';
    size.style.height = Math.ceil(canvas.offsetHeight * zoom) + 'px';
    var heading = document.getElementById('map-head');
    if (heading) {
      heading.style.width = size.style.width;
      heading.style.height = Math.round(30 * zoom) + 'px';
      document.getElementById('map-head-in').style.transform = 'scale(' + zoom + ')';
    }
    view.dataset.drawn = drawn;
    var kept = mapScroll[mode];
    if (kept) { view.scrollLeft = kept.x; view.scrollTop = kept.y; }
    // A view arriving is shown arriving; a refresh of the one already there is not.
    if (mapShown !== mode) canvas.classList.add('map-fresh');
    mapShown = mode;
    if (mapBring) {
      mapBring = false;
      var chosen = ui.sel && view.querySelector('[data-map-id="' + CSS.escape(ui.sel) + '"]');
      if (chosen) chosen.scrollIntoView({ block: 'center', inline: 'center' });
    }
  }

  /**
   * Open the pane on something the map drew.
   *
   * The pane is the tables' pane and wants a table's row, so the row is asked
   * for — one object, by name. Which also means the pane shows what the cluster
   * says now rather than what the map was told a while ago.
   */
  function mapSelect(id, keepTab) {
    var node = state.mapIndex && state.mapIndex.byId[id];
    var ui = mapUi();
    ui.sel = id;
    if (node && node.kind === 'Pod' && node.owner) ui.hl = node.owner;
    else if (mapIsWorkload(node)) ui.hl = node.id;
    var resource = node && (MAP_RESOURCE[node.kind] || node.resource);
    if (!resource) { remember(); draw(); return; }

    /*
     * Open at once, on what is already known.
     *
     * Asking the cluster for the row first meant every click waited on kubectl —
     * a second or two on a cluster whose login is a cloud CLI — with nothing on
     * screen to say the click had landed. The map already knows the name, the
     * kind and the status, which is enough to open the pane; a row seen before
     * is kept and shown as it was. The real one is asked for behind it and
     * folded in when it arrives, the same way a table's refresh is.
     */
    if (mapCacheFor !== mapKey()) { mapRows = {}; mapDescribed = {}; mapCacheFor = mapKey(); }
    var row = mapRows[id] || {
      uid: node.uid || id, name: node.name, namespace: node.namespace, kind: node.kind,
      status: node.status, health: node.health, createdAt: node.createdAt, age: '', labels: {},
      // Shown on what the map knows until the cluster has been asked: the pane says so with a turning mark.
      reading: true,
    };
    mapRows[id] = row;
    // A long afternoon of clicking is not a reason to hold every row that was ever opened.
    if (Object.keys(mapRows).length > 300) { mapRows = {}; mapRows[id] = row; mapDescribed = {}; }
    sayKept(row.uid);
    stopEditing();
    letConfigGo();
    state.selected = row;
    state.detail = { tab: keepTab || 'overview' };
    // The description read last time stands in until this time's has been read.
    var before = mapDescribed[row.uid];
    state.detailData = before == null ? {} : { describe: before };
    remember();
    draw();
    loadDetail();

    var at = { context: state.context, kind: node.kind, name: node.name };
    var args = { kind: resource, context: state.context, fieldSelector: 'metadata.name=' + node.name };
    if (node.namespace) { args.namespace = node.namespace; at.namespace = node.namespace; }
    call('kube.list', args).then(function (result) {
      var fresh = (result.rows || [])[0];

    var out = {};
    var inn = {};
    var all = view.querySelectorAll('.medge[data-a], .medge[data-b]');
    for (var i = 0; i < all.length; i += 1) {
      var from = all[i].dataset.a;
      var to = all[i].dataset.b;
      if (from) (out[from] || (out[from] = [])).push(all[i]);
      if (to) (inn[to] || (inn[to] = [])).push(all[i]);

  $('table').addEventListener('mouseover', function (event) {

    mapHovered = id;

    if (!view) return;
    mapUnlight(view);
    if (state.view.mode === 'physical') { mapHoverVolumes(id); return; }
    if (!id) return;
    /*
     * Not only the lines that touch it: everything upstream of it and
     * everything downstream. Pointing at a pod lights the ingress that reaches
     * it and the storage class its disk came from, which is the whole of what
     * the page is for.

    var index = mapEdgeIndex(view);

    var count = 0;
    var walk = function (start, table, end) {
      var queue = [start];
      var done = {};

        var at = queue.shift();
        if (done[at]) continue;
        done[at] = true;
        seen[at] = true;

  /** Bytes at cluster scale, where MiB is noise. */
  function gigs(b) {

    return Math.round(b / 1048576) + ' MiB';

  /**
   * Two bars that say the thing five numbers never did.
   *
   * *Allocatable* is what the nodes will hand out. *Requested* is what the
   * scheduler has already promised, and it — not usage — is what decides
   * whether the next pod fits. *Used* is what is actually being consumed. The
   * gap between the last two is the whole story: promised and idle means the
   * requests were written without measuring, and used above promised means the
   * cluster is running on room nobody reserved.

  function capacityOf(data) {

    var bar = function (title, of, format) {

      var over = of.used > of.requested;
      return '<div tabindex="0" role="link" class="gauge is-link" data-stat="' + title.toLowerCase() + '">' +
        '<div class="gauge-head"><span>' + title + '</span>' +
          '<b>' + format(of.used) + '</b><span class="dim"> used of ' + format(of.allocatable) + '</span></div>' +
        '<div class="gauge-bar">' +
          '<span class="gauge-req" style="width:' + pct(of.requested).toFixed(1) + '%"></span>' +
          '<span class="gauge-use' + (over ? ' is-over' : '') + '" style="width:' + pct(of.used).toFixed(1) + '%"></span>' +
        '</div>' +
        '<div class="gauge-foot">' +
          '<span><i class="key-req"></i>' + format(of.requested) + ' promised to pods · ' +
            Math.round((of.requested / of.allocatable) * 100) + '%</span>' +
          '<span><i class="key-use' + (over ? ' is-over' : '') + '"></i>' +
            Math.round((of.used / of.allocatable) * 100) + '% in use</span>' +
        '</div>' +
        '</div>';
    };

    var gauges = bar('CPU', cap.cpu, fromMillicores) + bar('Memory', cap.memory, gigs);

    /*
     * Disk, when the node exporter is there to measure it. Node disk and volume
     * storage are two different pools — an attached volume is not the node's —
     * so the claims are said beside it rather than added into it.
     */
    if (state.disk && state.disk.total) {
      var used = state.disk.used;
      var pct = (used / state.disk.total) * 100;
      var vols = data.volumes;
      gauges += '<div tabindex="0" role="link" class="gauge is-link" data-stat="disk">' +
        '<div class="gauge-head"><span>Disk</span><b>' + gigs(used) + '</b>' +
          '<span class="dim"> used of ' + gigs(state.disk.total) + '</span></div>' +
        '<div class="gauge-bar"><span class="gauge-use ' + (pct >= 85 ? 'is-over' : '') + '" style="width:' +
          pct.toFixed(1) + '%"></span></div>' +
        '<div class="gauge-foot"><span>' + Math.round(pct) + '% of the nodes\u2019 own disks</span>' +
          (vols ? '<span>' + vols.count + ' volumes · ' + gigs(vols.claimed) +
            (vols.pending ? ' · <b class="warn-text">' + vols.pending + ' pending</b>' : '') + '</span>' : '') +
        '</div></div>';
    }
    return '<div class="gauges">' + gauges + '</div>';
  }

  /**
   * Every node, hottest first.
   *
   * A cluster at sixty percent with one node at ninety-seven is not a cluster
   * at sixty percent — it is a cluster with one node about to start evicting
   * things, and an average is exactly what hides that.
   */
  function nodesOf(data) {
    var nodes = data.nodeUsage || [];
    if (!nodes.length) return '';
    return '<div class="panel-block"><h4>Nodes<span class="dim"> · busiest first</span></h4>' +
      nodes.map(function (node) {
        var cpu = node.cpuAllocatable ? (node.cpu / node.cpuAllocatable) * 100 : 0;
        var mem = node.memoryAllocatable ? (node.memory / node.memoryAllocatable) * 100 : 0;
        var short = node.name.replace(/\.(compute\.internal|ec2\.internal).*$/, '');
        return '<div class="meter" data-node="' + esc(node.name) + '" title="' + esc(node.name) + '">' +
          '<span class="meter-name' + (node.ready ? '' : ' bad-text') + '">' + esc(short) +
            (node.schedulable ? '' : ' <span class="dim">cordoned</span>') + '</span>' +
          '<span class="meter-track"><i style="width:' + cpu.toFixed(1) + '%" class="' + heat(cpu) + '"></i></span>' +
          '<span class="meter-num">' + Math.round(cpu) + '%</span>' +
          '<span class="meter-track"><i style="width:' + mem.toFixed(1) + '%" class="' + heat(mem) + '"></i></span>' +
          '<span class="meter-num">' + Math.round(mem) + '%</span>' +
          (node.diskTotal
            ? '<span class="meter-track"><i style="width:' + ((node.disk / node.diskTotal) * 100).toFixed(1) +
                '%" class="' + heat((node.disk / node.diskTotal) * 100) + '"></i></span>' +
              '<span class="meter-num">' + Math.round((node.disk / node.diskTotal) * 100) + '%</span>'
            : '') +
          '</div>';
      }).join('') +
      '<div class="meter-legend"><span></span><span>CPU</span><span></span><span>memory</span><span></span>' +
        (nodes[0] && nodes[0].diskTotal ? '<span>disk</span><span></span>' : '') + '</div>' +
      '</div>';
  }

  /** Green up to two thirds, amber to the edge, red past it. */
  function heat(pct) { return pct >= 90 ? 'is-bad' : pct >= 66 ? 'is-warn' : ''; }

  /**
   * Where the room is going, by namespace.
   *
   * Ordered by what has been promised rather than by what is used: the
   * namespace holding a third of the cluster's CPU without touching it is the
   * one worth finding, and by usage it looks like the quietest thing there.
   */
  function whereOf(data) {
    var rows = data.namespaces || [];
    if (!rows.length) return '';
    var most = rows[0].cpu || 1;
    return '<div class="panel-block"><h4>Where the CPU is promised<span class="dim"> · by namespace</span></h4>' +
      rows.map(function (row) {
        return '<div class="meter" data-namespace="' + esc(row.namespace) + '">' +
          '<span class="meter-name">' + esc(row.namespace) + '</span>' +
          '<span class="meter-track wide"><i style="width:' + ((row.cpu / most) * 100).toFixed(1) + '%"></i></span>' +
          '<span class="meter-num">' + fromMillicores(row.cpu) + '</span>' +
          '<span class="meter-num dim">' + row.pods + 'p</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  /**
   * What is actually burning the cluster right now.
   *
   * Not what anything asked for — what it is using. Requests say what the
   * scheduler believes; this says where the afternoon went, and on a real
   * cluster the two are nowhere near each other.
   */
  function busiestOf(data) {
    var busy = data.busiest;
    if (!busy || (!busy.cpu.length && !busy.memory.length)) return '';
    var column = function (title, rows, most, format, field) {
      return '<div class="half"><h5>' + title + '</h5>' + rows.map(function (row) {
        return '<div class="meter" title="' + esc(row.namespace + '/' + row.name) + '">' +
          '<span class="meter-name">' + esc(row.name) + '</span>' +
          '<span class="meter-track"><i style="width:' + ((row[field] / (most || 1)) * 100).toFixed(1) + '%"></i></span>' +
          '<span class="meter-num">' + format(row[field]) + '</span>' +
          '</div>';
      }).join('') + '</div>';
    };
    return '<div class="panel-block"><h4>Busiest right now<span class="dim"> · measured, not requested</span></h4>' +
      '<div class="halves">' +
        column('CPU', busy.cpu, busy.cpu[0] && busy.cpu[0].cpu, fromMillicores, 'cpu') +
        column('Memory', busy.memory, busy.memory[0] && busy.memory[0].memory, gigs, 'memory') +
      '</div></div>';
  }

  /**
   * The workloads that are not what they were asked to be.
   *
   * A pod count says how many are running. It does not say that a Deployment
   * asked for five and has three — which is the thing somebody gets paged
   * about, and the thing a wall of green pods hides.
   */
  function incompleteOf(data) {
    var health = data.workloads;
    if (!health) return '';
    if (!health.shortCount) {
      return '<div class="panel-block"><h4>Workloads</h4>' +
        '<p class="all-well">All ' + health.total + ' are at the number they asked for.</p></div>';
    }
    return '<div class="panel-block"><h4>Not at their number' +
      '<span class="dim"> · ' + health.shortCount + ' of ' + health.total + '</span></h4>' +
      '<table><tbody>' + health.short.map(function (row) {
        return '<tr class="clickable" data-goto="' + esc(row.kind) + '">' +
          '<td class="name"><span class="dot ' + (row.ready ? 'warn' : 'bad') + '"></span>' + esc(row.name) + '</td>' +
          '<td class="dim">' + esc(row.kind) + '</td>' +
          '<td class="dim">' + esc(row.namespace) + '</td>' +
          '<td class="' + (row.ready ? 'warn-text' : 'bad-text') + '">' + row.ready + '/' + row.wanted + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  /**
   * Pressure, when there is any.
   *
   * `Ready` is the condition everybody watches and the last one to turn: disk
   * and memory pressure show up first, and a node under them is already
   * refusing pods and evicting things while still calling itself ready. It is
   * absent when there is none, because a permanent green line saying "no
   * pressure" is a line people stop reading.
   */
  function pressureOf(data) {
    var rows = data.pressure || [];
    if (!rows.length) return '';
    return '<div class="pressure">' + rows.map(function (row) {
      return '<div><b>' + esc(row.condition) + '</b> on ' + esc(row.node) +
        '<span class="dim"> — ' + esc(row.message) + '</span></div>';
    }).join('') + '</div>';
  }

  /**
   * The warnings, gathered by what they are.
   *
   * Forty lines of FailedScheduling are one problem, and a list of forty shows
   * them as forty. How many kinds of thing are wrong is the number somebody
   * came for.
   */
  /**
   * What is wrong now that no pod status says.
   *
   * The cards above count failing pods; this is the rest of it, from the map
   * that is read behind the overview — an autoscaler with nothing to measure,
   * a budget that lets nothing go. Each is a workload that looks healthy and
   * is not doing what it was set up to do, and each line opens it.
   */
  function attentionOf() {
    var kept = mapCache[(state.context || '') + '/'] || mapCache[mapKey()];
    if (!kept || !kept.result || !kept.result.findings) return '';
    var rows = [];
    var byId = {};
    (kept.result.nodes || []).forEach(function (node) { byId[node.id] = node; });
    Object.keys(kept.result.findings).forEach(function (id) {
      kept.result.findings[id].forEach(function (finding) {
        // A failing pod is already counted above; this is for what is not.
        if (finding.level !== 'now' || /^API · pod status/.test(finding.source || '')) return;
        if (byId[id]) rows.push({ node: byId[id], finding: finding });
      });
    });
    if (!rows.length) return '';
    return '<div class="panel-block"><h4>Needs attention <span class="dim">· healthy to look at, and not doing what it was set up to do</span></h4>' +
      '<table><tbody>' + rows.slice(0, 12).map(function (row) {
        var nav = navFor(row.node.kind);
        return '<tr' + (nav ? ' class="is-link" tabindex="0" role="link" data-open="' + esc(row.node.name) + '" data-open-kind="' + esc(nav) + '" data-open-namespace="' + esc(row.node.namespace || '') + '"' : '') + '>' +
          '<td class="name"><span class="dot warn"></span>' + esc(row.node.name) + '</td>' +
          '<td class="dim">' + esc(row.node.namespace || '') + '</td>' +
          '<td class="warn-text">' + esc(row.finding.title) + '</td>' +
          '<td class="grow dim">' + esc(row.finding.text) + '</td></tr>';
      }).join('') + '</tbody></table>' + (rows.length > 12 ? '<div class="dim" style="padding:4px 2px">and ' + (rows.length - 12) + ' more, on the map under Only problems.</div>' : '') + '</div>';
  }

  document.addEventListener('click', function (event) {
    var reason = event.target.closest && event.target.closest('[data-reason]');
    if (reason) show({ type: 'kind', name: 'events' }, { search: reason.dataset.reason });
  });

  function reasonsOf(data) {
    var rows = data.reasons || [];
    if (!rows.length) return '';
    return '<div class="panel-block"><h4>What the cluster is complaining about</h4>' +
      '<table><tbody>' + rows.map(function (row) {
        return '<tr class="is-link" tabindex="0" role="link" data-reason="' + esc(row.reason) + '" title="The events that say ' + esc(row.reason) + '"><td class="warn-text">' + esc(row.reason) + '</td>' +
          '<td class="dim">' + many(row.count) + '×</td>' +
          '<td class="dim">' + esc(row.newest) + '</td>' +
          '<td class="grow dim">' + esc(String(row.example || '').slice(0, 120)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  var STAT_TITLES = { cpu: 'CPU', memory: 'Memory', disk: 'Disk' };

  /**
   * One resource, expanded.
   *
   * The overview answers "is anything wrong"; this answers "wrong where". The
   * same three facts as the gauge, the shape over time at whatever range is
   * chosen, every node ranked by it, and the workloads actually consuming it —
   * which between them is the whole of what somebody does after noticing a bar
   * is longer than they expected.
   */
  function drawStats() {
    var data = state.overview;
    var focus = state.view.focus;
    if (!data) { $('table').innerHTML = state.loading ? waiting() : '<div class="note">Nothing loaded.</div>'; return; }

    var tabs = ['cpu', 'memory', 'disk'].map(function (which) {
      return '<button class="btn' + (focus === which ? ' on' : '') + '" data-stat="' + which + '">' +
        STAT_TITLES[which] + '</button>';
    }).join('');

    var key = 'cluster@' + state.prom.minutes;
    var got = state.prom.series[key] || {};
    var series = focus === 'memory' ? got.memory : focus === 'cpu' ? got.cpu : null;
    var format = focus === 'cpu' ? fromCores : bytes;

    var ranges = [60, 360, 1440].map(function (minutes) {
      return '<button class="btn' + (state.prom.minutes === minutes ? ' on' : '') + '" data-range="' + minutes + '">' +
        (minutes < 1440 ? minutes / 60 + 'h' : minutes / 1440 + 'd') + '</button>';
    }).join('');

    var head = '<div class="stat-head"><div class="stat-tabs">' + tabs + '</div>' +
      (focus === 'disk' ? '' : '<div class="chart-range">' + ranges + '</div>') + '</div>';

    var over = series
      ? '<div class="charts one">' + chart(series, format, STAT_TITLES[focus], true) + '</div>'
      : focus === 'disk'
        ? '<p class="note">Disk is measured now rather than over time — the node exporter reports what is there, not a history of it.</p>'
        : '<p class="note">No Prometheus in this cluster, so there is no history to draw.</p>';

    $('table').innerHTML = head + statNumbers(data, focus) + over +
      '<div class="split">' + statNodes(data, focus) + statConsumers(data, focus) + '</div>';
  }

  /** The three facts, said as numbers rather than as a bar. */
  function statNumbers(data, focus) {
    var cap = (data.capacity || {})[focus];
    if (focus === 'disk') {
      if (!state.disk) return '';
      var vols = data.volumes || {};
      return '<div class="cards">' +
        card(gigs(state.disk.total), 'on the nodes') +
        card(gigs(state.disk.used), Math.round((state.disk.used / state.disk.total) * 100) + '% used',
          state.disk.used / state.disk.total > 0.85 ? 'bad' : '') +
        card(vols.count || 0, 'volumes') +
        card(gigs(vols.claimed || 0), 'claimed by them') +
        card(vols.pending || 0, 'pending', vols.pending ? 'bad' : '') +
        '</div>';
    }
    if (!cap) return '';
    var format = focus === 'cpu' ? fromMillicores : gigs;
    return '<div class="cards">' +
      card(format(cap.allocatable), 'the nodes can give') +
      card(format(cap.requested), Math.round((cap.requested / cap.allocatable) * 100) + '% promised to pods') +
      card(format(cap.used), Math.round((cap.used / cap.allocatable) * 100) + '% actually used',
        cap.used > cap.requested ? 'warn' : '') +
      card(format(cap.limit), 'the ceiling, if every pod took it') +
      '</div>';
  }

  function card(value, label, tone) {
    return '<div class="card ' + (tone || '') + '"><b>' + esc(value) + '</b><span>' + esc(label) + '</span></div>';
  }

  /** Every node ranked by the one resource being looked at. */
  function statNodes(data, focus) {
    var nodes = (data.nodeUsage || []).slice();
    var of = function (node) {
      if (focus === 'cpu') return node.cpuAllocatable ? node.cpu / node.cpuAllocatable : 0;
      if (focus === 'memory') return node.memoryAllocatable ? node.memory / node.memoryAllocatable : 0;
      return node.diskTotal ? node.disk / node.diskTotal : 0;
    };
    var amount = function (node) {
      if (focus === 'cpu') return fromMillicores(node.cpu) + ' of ' + fromMillicores(node.cpuAllocatable);
      if (focus === 'memory') return gigs(node.memory) + ' of ' + gigs(node.memoryAllocatable);
      return node.diskTotal ? gigs(node.disk) + ' of ' + gigs(node.diskTotal) : 'not measured';
    };
    nodes.sort(function (a, b) { return of(b) - of(a); });
    if (!nodes.length) return '';

    return '<div class="panel-block"><h4>Every node<span class="dim"> · by ' + STAT_TITLES[focus].toLowerCase() + '</span></h4>' +
      nodes.map(function (node) {
        var pct = of(node) * 100;
        return '<div class="meter" data-node="' + esc(node.name) + '" title="' + esc(node.name) + '">' +
          '<span class="meter-name' + (node.ready ? '' : ' bad-text') + '">' +
            esc(node.name.replace(/\.(compute|ec2)\.internal.*$/, '')) + '</span>' +
          '<span class="meter-track wide"><i style="width:' + pct.toFixed(1) + '%" class="' + heat(pct) + '"></i></span>' +
          '<span class="meter-num">' + Math.round(pct) + '%</span>' +
          '<span class="meter-num dim">' + esc(amount(node)) + '</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  /** And what is consuming it, measured. */
  function statConsumers(data, focus) {
    if (focus === 'disk') {
      var vols = data.volumes;
      return '<div class="panel-block"><h4>Volumes</h4>' +
        '<p class="all-well">' + (vols ? vols.count + ' claims, ' + gigs(vols.claimed) + ' claimed' +
          (vols.pending ? ', ' + vols.pending + ' still waiting for a volume' : ', all bound') : 'none') + '</p>' +
        '<button class="btn" data-kind="persistentvolumeclaims">See them all</button></div>';
    }
    var busy = (data.busiest || {})[focus] || [];
    if (!busy.length) return '';
    var most = busy[0][focus] || 1;
    var format = focus === 'cpu' ? fromMillicores : gigs;
    return '<div class="panel-block"><h4>Using the most<span class="dim"> · right now</span></h4>' +
      busy.map(function (row) {
        return '<div class="meter" title="' + esc(row.namespace + '/' + row.name) + '">' +
          '<span class="meter-name">' + esc(row.name) + '</span>' +
          '<span class="meter-track wide"><i style="width:' + ((row[focus] / most) * 100).toFixed(1) + '%"></i></span>' +
          '<span class="meter-num">' + format(row[focus]) + '</span>' +
          '<span class="meter-num dim">' + esc(row.namespace) + '</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  /**
   * What to do about the failures that are not really failures.
   *
   * The three that everybody hits are an expired token, a cluster that is not
   * reachable from here, and kubectl not being installed at all — and none of
   * them are worth a red box on their own, because each has an obvious next
   * step that the message itself does not mention.
   */
  function advice(message) {
    var text = String(message || '');
    if (/Unauthorized|credentials|expired|no such host|refused|timeout|timed out|exec plugin|getting credentials/i.test(text)) {
      return '<div class="note">This looks like the cluster not letting us in rather than something being wrong with it. ' +
        'A token may have expired, or this context may need a VPN. Open the terminal button above and run ' +
        '<code>kubectl get ns</code> there — whatever it asks you for, ask it once and this panel works again.</div>';
    }
    if (/not installed|ENOENT/i.test(text)) {
      return '<div class="note">kubectl is not on the PATH this app can see. Install it, or add it to your shell profile ' +
        'and restart Smart Terminal.</div>';
    }
    return '';
  }

  /* ---------------------------------------------------------------------- *
   * The detail pane.
   * ---------------------------------------------------------------------- */
  /**
   * The lines between the columns, and dragging them.
   *
   * The navigation and the detail pane were fixed widths, which is fine until
   * the thing you are reading is a name that does not fit or a description that
   * wants the room. Both edges move now, and the middle takes what is left.
   *
   * Absolutely positioned rather than made grid children: a grid column of its
   * own would have to be threaded through both of the layouts below, and the
   * only thing a handle needs to know is where the edge it drags currently is.
   */
  function drawGrips() {
    var body = $('body');
    var nav = body.querySelector('nav');
    var aside = body.querySelector('aside');
    [].forEach.call(body.querySelectorAll('.grip'), function (old) { old.remove(); });
    if (!nav) return;
