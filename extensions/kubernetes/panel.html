    var nav = withObject ? navFor(event.objectKind) : null;
    var meta = [];
    if (withObject) {
      meta.push((nav
        ? '<a class="event-open" data-open="' + esc(event.objectName) + '" data-open-kind="' + esc(nav) + '" data-open-namespace="' + esc(event.namespace || '') + '" title="Open it">' + esc(event.object) + '</a>'
        : esc(event.object)) +
        (event.related ? ' <span class="quiet" title="Found by its name, which starts with this one\u2019s. The API did not say so.">by name</span>' : ''));
    }
    if (event.from) meta.push('from ' + esc(event.from));
    if (!isNaN(first)) meta.push('first ' + esc(ageText(first)) + ' ago');
    var over = eventOver(event);
    if (over) { warn = false; meta.push(esc(over)); }
    return '<div class="event' + (warn ? ' is-warn' : '') + (over ? ' is-past' : '') + '">' +
      '<div class="event-head"><span class="dot ' + (warn ? 'bad' : 'idle') + '"></span>' +
        '<b>' + esc(event.status || event.type) + '</b>' +
        (event.count > 1 ? '<span class="event-count" title="Said ' + event.count + ' times">×' + event.count + '</span>' : '') +
        '<span class="spacer"></span><span class="dim">' + ageHtml(event) + ' ago</span></div>' +
      '<div class="event-text">' + esc(event.message) + '</div>' +
      (meta.length ? '<div class="event-meta dim">' + meta.join(' · ') + '</div>' : '') +
      '</div>';
  }

  /**
   * The same events, as problems with a beginning.
   *
   * A list newest-first answers "what was said last". This answers the other
   * question — what started when, and is it still going — by putting every
   * event about one thing for one reason on one line, drawn from when it was
   * first said to when it was last said, across the time the cluster remembers.
   */
  function eventTimeline(events, withObject) {
    var groups = {};
    var order = [];
    var now = Date.now();
    var from = now;
    events.forEach(function (event) {
      var key = event.object + '|' + event.status;
      var last = Date.parse(event.at) || now;
      var first = Date.parse(event.firstAt) || last;
      if (!groups[key]) { groups[key] = { event: event, first: first, last: last, count: 0, warn: false }; order.push(key); }
      var group = groups[key];
      group.first = Math.min(group.first, first);
      if (last >= group.last) { group.last = last; group.event = event; }
      group.count += Number(event.count) || 1;
      group.warn = group.warn || event.type === 'Warning';
      from = Math.min(from, first);
    });
    var span = Math.max(60000, now - from);
    order.sort(function (a, b) { return groups[a].first - groups[b].first; });
    return '<div class="timeline-scale dim"><span>' + esc(ageText(from)) + ' ago</span><span class="spacer"></span><span>now</span></div>' +
      '<div class="events">' + order.map(function (key) {
        var group = groups[key];
        var left = (group.first - from) / span * 100;
        var width = Math.max(1.5, (group.last - group.first) / span * 100);
        var going = now - group.last < 120000;
        return '<div class="event' + (group.warn ? ' is-warn' : '') + '">' +
          '<div class="event-head"><span class="dot ' + (group.warn ? 'bad' : 'idle') + '"></span><b>' + esc(group.event.status) + '</b>' +
            (group.count > 1 ? '<span class="event-count">×' + group.count + '</span>' : '') +
            (withObject ? '<span class="dim event-about">' + esc(group.event.object) + '</span>' : '') +
            '<span class="spacer"></span>' + (going ? '<span class="mtag bad">still going</span>' : '') + '</div>' +
          '<div class="timeline-track"><i class="' + (going ? 'is-going' : '') + '" style="left:' + left.toFixed(2) + '%;width:' + Math.min(100 - left, width).toFixed(2) + '%"></i></div>' +
          '<div class="event-meta dim">began ' + esc(ageText(group.first)) + ' ago' + (going ? '' : ' · last said ' + esc(ageText(group.last)) + ' ago') + '</div>' +
          '<div class="event-text">' + esc(group.event.message) + '</div></div>';
      }).join('') + '</div>';
  }

  function eventsBody(row) {
    var events = state.detailData.events;
    var failed = state.detailData.eventsError;
    var wide = makesThings(row);
    var everyWarning = (events || []).filter(function (event) { return event.type === 'Warning'; });
    var warnings = everyWarning.filter(function (event) { return !eventOver(event); });
    var over = everyWarning.length - warnings.length;
    var known = mapKnown(row);
    var shown = state.eventsOnly ? everyWarning : (events || []);
    var tools = '<div class="yaml-tools is-stuck">' +
      '<span class="dim">' + (events
        ? (warnings.length ? warnings.length + ' warning' + (warnings.length === 1 ? '' : 's') + ' · ' : '') + (over ? over + ' over · ' : '') + events.length + ' event' + (events.length === 1 ? '' : 's')
        : failed ? 'not read' : 'reading…') + '</span>' +
      '<button class="btn' + (state.eventsOnly ? ' on' : '') + '" data-do="events-only" title="Only what went wrong"' + (everyWarning.length || state.eventsOnly ? '' : ' disabled') + '>Warnings</button>' +
      (warnings.length ? '<button class="btn" data-do="warnings-clear" title="Put these warnings aside. Nothing is deleted in the cluster, and anything said again is counted again.">Clear</button>' : '') +
      (!warnings.length && wasCleared(known || { id: row.kind + '/' + (row.namespace || '') + '/' + row.name }) ? '<button class="btn" data-do="warnings-unclear" title="Count the cleared warnings again">Show again</button>' : '') +
      '<button class="btn' + (state.eventsGroup ? ' on' : '') + '" data-do="events-group" title="One line per problem, from when it began to when it was last said"' + (events && events.length ? '' : ' disabled') + '>Timeline</button>' +
      (wide ? '<button class="btn' + (state.eventsWide ? ' on' : '') + '" data-do="events-wide" ' +
        'title="Also the events of what it made — its pods, replica sets, jobs and claims — found by their names">What it made</button>' : '') +
      '<span class="spacer"></span>' +
      (state.detailData.eventsAt ? '<span class="dim">read <span class="since" data-since="' + state.detailData.eventsAt + '">' + esc(ageText(state.detailData.eventsAt)) + '</span> ago</span>' : '') +
      '<button class="btn" data-do="events-refresh" title="Ask again"' + (state.detailData.eventsBusy ? ' disabled' : '') + '>' +
        (state.detailData.eventsBusy ? '<span class="spin">◐</span>' : '↻') + '</button>' +
      '</div>';
    if (failed && !events) return tools + '<div class="edit-note is-bad"><div class="edit-note-text">' + esc(failed) + '</div></div>';
    if (!events) return tools + '<pre>reading…</pre>';
    if (!events.length) {
      return tools + '<div class="dim event-none">Nothing has been said about this one' + (wide && state.eventsWide ? ' or what it made' : '') +
        '. The cluster keeps events for about an hour.</div>';
    }
    if (!shown.length) return tools + '<div class="dim event-none">No warnings among them.</div>';
    return tools + (failed ? '<div class="edit-note is-bad"><div class="edit-note-text">Not read again: ' + esc(failed) + '</div></div>' : '') +
      (state.eventsGroup ? eventTimeline(shown, wide && state.eventsWide)
        : '<div class="events">' + shown.map(function (event) { return eventCard(event, wide && state.eventsWide); }).join('') + '</div>');
  }

  /** The name this panel lists a kind under — `pods` for Pod — if it lists it at all. */
  function navFor(kind) {
    for (var i = 0; i < state.resources.length; i += 1) {
      if (state.resources[i].kind === kind) return state.resources[i].name;
    }
    return null;
  }

  /**
   * An event, opened.
   *
   * In the table it is one clipped line, and the message is the whole point of
   * it. Here it is whole, with how often and since when, and with the one
   * thing somebody wants next: the object it is about.
   */
  function eventPane(row) {
    return block('What was said', '<div class="events">' + eventCard(row, true) + '</div>') +
      block('Summary', '<dl class="facts">' +
        [['About', row.object], ['Type', row.type], ['Reason', row.status], ['Times', row.count],
          ['Last', row.at ? new Date(row.at).toLocaleString() : ''], ['First', row.firstAt ? new Date(row.firstAt).toLocaleString() : ''],
          ['From', row.from], ['Namespace', row.namespace]]
          .filter(function (pair) { return pair[1] !== '' && pair[1] != null; })
          .map(function (pair) { return '<dt>' + esc(pair[0]) + '</dt><dd>' + esc(String(pair[1])) + '</dd>'; }).join('') + '</dl>');
  }

  function eventActions(row) {
    var nav = navFor(row.objectKind);
    return (nav ? '<button class="btn go" data-open="' + esc(row.objectName) + '" data-open-kind="' + esc(nav) + '" data-open-namespace="' + esc(row.namespace || '') + '" ' +
      'title="Open what this event is about">Open ' + esc(row.object) + '</button>' : '') +
      '<button class="btn" data-do="event-copy" title="Copy the reason and the message">Copy message</button>';
  }

  /**
   * Read the events, again if asked.
   *
   * Asked for when the tab opens, on its button, and behind every quiet
   * refresh while the tab is showing — an Events tab read once is a tab that
   * says "pulling image" for ten minutes after the pod is up.
   */
  function loadEvents(quiet) {
    var row = state.selected;
    if (!row || row.kind === 'Release' || row.kind === 'Event') return;
    var data = state.detailData;
    if (data.eventsBusy) return;
    if (quiet && data.eventsAt && Date.now() - data.eventsAt < 8000) return;
    var at = { context: state.context, kind: row.kind, name: row.name, related: makesThings(row) && state.eventsWide };
    if (row.namespace) at.namespace = row.namespace;
    data.eventsBusy = true;
    if (!quiet && state.detail.tab === 'events') drawDetail();
    call('kube.events', at).then(function (result) {
      data.eventsBusy = false;
      if (state.selected !== row || state.detailData !== data) return;
      var rows = result.rows || [];
      var same = quiet && data.events && JSON.stringify(rows.map(eventKey)) === JSON.stringify(data.events.map(eventKey));
      data.events = rows;
      data.eventsError = null;
      data.eventsAt = Date.now();
      if (!same || !quiet) drawDetail();
    }).catch(function (error) {
      data.eventsBusy = false;
      if (state.selected !== row || state.detailData !== data) return;
      data.eventsError = String(error.message || error);
      drawDetail();
    });
  }
  function eventKey(event) { return [event.uid, event.count, event.at]; }

  function detailBody(row) {
    var tab = state.detail.tab;
    if (row.kind === 'Release') return releaseBody(row, tab);
    if (tab === 'overview') return overviewBody(row);
    if (tab === 'yaml') {
      if (state.detailData.yaml == null) return '<pre>reading…</pre>';
      return yamlBody(row);
    }
    if (tab === 'configure') return configureBody(row);
    if (tab === 'pods') return podsBody(row);
    if (tab === 'jobs') return jobsBody(row);
    if (tab === 'rollout') return rolloutBody(row);
    if (tab === 'events') return eventsBody(row);
    return '';
  }

  /**
   * A release's history, its values, and what it actually installed.
   *
   * The revisions are the point. Every row is a state this release has been in,
   * and the one thing you want at three in the morning is to put it back into
   * one of them — so every row that is not the current one carries the button
   * that does it, rather than making you find a menu.
   */
  function releaseBody(row, tab) {
    if (tab === 'revisions') {
      var rows = state.detailData.history;
      if (!rows) return '<pre>reading…</pre>';
      if (!rows.length) return '<div class="dim">No history. Helm keeps a limited number of revisions.</div>';
      return '<table><tbody>' + rows.map(function (entry) {
        return '<tr>' +
          '<td class="name"><span class="dot ' + esc(entry.health) + '"></span>' + entry.revision + '</td>' +
          '<td class="dim age">' + ageHtml(entry) + '</td>' +
          '<td class="dim">' + esc(entry.chart) + '</td>' +
          '<td class="grow dim">' + esc(entry.description) + '</td>' +
          '<td>' + (entry.current
            ? '<span class="dim">now</span>'
            : '<button class="btn" data-rollback="' + entry.revision + '">Roll back</button>') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
    }
    if (tab === 'values') {
      var yaml = state.detailData.values;
      if (yaml == null) return '<pre>reading…</pre>';
      return '<pre class="wrapless">' + esc(yaml.trim() || 'This release overrode nothing; it is running the chart\u2019s defaults.') + '</pre>';
    }
    if (tab === 'manifest') {
      return '<pre class="wrapless">' + esc(state.detailData.helmManifest == null ? 'reading…' : state.detailData.helmManifest) + '</pre>';
    }
    return '<pre>' + esc(state.detailData.notes == null ? 'reading…' : (state.detailData.notes.trim() || 'This chart left no notes.')) + '</pre>';
  }

  /**
   * A workload's own rollback, and a click on one of its pods.
   *
   * Separate from Helm's `data-rollback` on purpose: rolling a Deployment back
   * is `rollout undo`, which is a different tool doing a different thing to a
   * different object, and one handler pretending they are the same is how the
   * wrong one gets called on the wrong row.
   */
  document.addEventListener('click', function (event) {
    var compare = event.target.closest('[data-compare]');
    if (compare && state.selected) {
      var which = Number(compare.dataset.compare);
      state.detailData.compare = state.detailData.compare === which ? null : which;
      drawDetail();
      return;
    }
    var undo = event.target.closest('[data-undo]');
    if (undo && state.selected) {
      var subject = state.selected;
      var to = Number(undo.dataset.undo);
      // Pressed once: a second click while the first is on its way is a second rollback.
      undo.disabled = true;
      call('kube.rollback', {
        context: state.context, kind: subject.kind, namespace: subject.namespace, name: subject.name, revision: to,
      }).then(function (result) {
        say(result.text || ('Rolled ' + subject.name + ' back to revision ' + to + '.'));
        recordApplied(subject, 'Rollback', { lines: ['Rolled back to revision ' + to + '.'] });
        drawCrumb();
        state.detailData.rollout = null;
        drawDetail();
        loadDetail();
        setTimeout(function () { load(true); }, 1200);
      }).catch(function (error) { undo.disabled = false; say(String(error.message || error), true); });
      return;
    }

    /*
     * Copy one block rather than the drawer.
     *
     * The drawer's Copy takes everything, which is right when you want the lot
     * and useless when you want the six labels. Each block offers its own, and
     * takes the text as it reads on screen rather than a second rendering of the
     * same data that could disagree with the first.
     */
    var copy = event.target.closest('[data-copy-block]');
    if (copy) {
      var section = copy.closest('.block');
      var content = section && section.querySelector(':scope > *:not(.block-head)');
      if (!content) return;
      var text = readable(content);
      host.emit('copy', { text: text });
      say('Copied ' + copy.dataset.copyBlock.toLowerCase() + '.');
      return;
    }

    var log = event.target.closest('[data-container-log]');
    if (log && state.selected) { openLog(state.selected, log.dataset.containerLog); return; }

    var open = event.target.closest('[data-open]');
    if (open) {
      // Open it where its own log, shell and events are, which is the whole
      // reason for having clicked it.
      state.namespace = open.dataset.openNamespace || state.namespace;
      var pick = document.getElementById('namespace');
      if (pick) pick.value = state.namespace;
      show({ type: 'kind', name: open.dataset.openKind }, { wanted: open.dataset.open });
      return;
    }

    var back = event.target.closest('[data-rollback]');
    if (back && state.selected) {
      var to = Number(back.dataset.rollback);
      var release = state.selected;
      back.disabled = true;
      call('helm.rollback', { context: state.context, namespace: release.namespace, name: release.name, revision: to })
        .then(function (result) {
          say(result.text || ('Rolled ' + release.name + ' back to revision ' + to + '.'));
          state.detailData.history = null;
          drawDetail();
          loadDetail();
          setTimeout(function () { load(true); }, 1200);
        })
        .catch(function (error) { back.disabled = false; say(String(error.message || error), true); });
      return;
    }
    var tab = event.target.closest('[data-tab]');
    if (tab) {
      // Whatever was typed stays typed; it is kept against the object, so it is
      // still here on the way back.
      state.editing = false;
      state.editNote = null;
      state.revertArmed = 0;
      state.yamlView = 'edit';
      state.detail.tab = tab.dataset.tab;
      remember();
      drawDetail(true);
      // Coming back to an edit is coming back to something a redraw must not take the caret out of.
      if (state.detail.tab === 'yaml') state.editing = draftFor(state.selected) != null;
      if (state.detail.tab === 'configure' && state.config) state.editing = configChanges(state.config).length > 0;
      loadDetail();
      // Already read: asked again on the way in, so the tab is not showing what was true when it was last open.
      if (state.detail.tab === 'events' && state.detailData.events) loadEvents(true);
      return;
    }
    var action = event.target.closest('[data-do]');
    if (action) act(action.dataset.do);
  });


  function loadDetail() {
    var row = state.selected;
    if (!row) return;
    if (row.kind === 'Release') return loadReleaseDetail(row);
    var at = { context: state.context, kind: row.kind, name: row.name };
    if (row.kind === 'Event' && state.detail.tab === 'overview') return;
    askCan(row);
    if (row.namespace) at.namespace = row.namespace;

    if (state.detail.tab === 'overview') loadCharts(row);
    // A workload's warnings are mostly about what it made, which its description does not list:
    // read behind the overview, so the Events tab can say there is something in it.
    if (state.detail.tab === 'overview' && makesThings(row) && !state.detailData.events && !state.detailData.eventsAt) loadEvents(true);
    if (state.detail.tab === 'overview' && state.detailData.describe == null) {
      call('kube.describe', at).then(function (result) {
        if (state.view.type === 'map') mapDescribed[row.uid] = result.text || '';
        if (state.selected === row) { state.detailData.describe = result.text || ''; drawDetail(); }
      }).catch(function (error) {
        if (state.selected === row) { state.detailData.describe = String(error.message || error); drawDetail(); }
      });
    }
    if (state.detail.tab === 'yaml' && state.detailData.yaml == null) {
      call('kube.manifest', at).then(function (result) {
        if (state.selected === row) { state.detailData.yaml = result.yaml || ''; state.detailData.editable = result.editable == null ? null : result.editable; drawDetail(true); }
      }).catch(function (error) {
        if (state.selected === row) { state.detailData.yaml = String(error.message || error); state.detailData.unread = true; drawDetail(true); }
      });
    }
    if (state.detail.tab === 'configure' && state.detailData.object == null) {
      call('kube.object', at).then(function (result) {
        if (state.selected === row) {
          state.detailData.object = result.object || {};
          // An edit that was left on it is an edit again: the form comes back guarded.
          var kept = state.configs[configKey(row)];
          drawDetail(true);
          if (kept) state.editing = configChanges(ensureConfig(row, state.detailData.object)).length > 0;
        }
      }).catch(function (error) {
        if (state.selected === row) { state.detailData.object = String(error.message || error); drawDetail(true); }
      });
    }
    if (state.detail.tab === 'pods' && !state.detailData.pods) {
      // The same `get pods --selector` a person would type, with the selector
      // the workload itself names.
      call('kube.list', {
        context: state.context, kind: 'pods', namespace: row.namespace, selector: row.selector,
      }).then(function (result) {
        if (state.selected === row) { state.detailData.pods = result.rows || []; drawDetail(); }
      }).catch(function () {
        if (state.selected === row) { state.detailData.pods = []; drawDetail(); }
      });
    }
    if (state.detail.tab === 'jobs' && !state.detailData.jobs) {
      call('kube.list', { context: state.context, kind: 'jobs', namespace: row.namespace })
        .then(function (result) {
          if (state.selected !== row) return;
          state.detailData.jobs = (result.rows || []).filter(function (job) { return job.owner === row.uid; });
          drawDetail();
        })
        .catch(function () { if (state.selected === row) { state.detailData.jobs = []; drawDetail(); } });
    }
    if (state.detail.tab === 'rollout' && !state.detailData.rollout) {
      call('kube.history', at).then(function (result) {
        if (state.selected === row) { state.detailData.rollout = { rows: result.rows || [], current: result.current }; drawDetail(); }
      }).catch(function (error) {
        if (state.selected === row) { state.detailData.rollout = String(error.message || error); drawDetail(); }
      });
    }
    if (state.detail.tab === 'events' && !state.detailData.events) loadEvents();
  }

  /** The four questions a release answers, each fetched the first time it is asked. */
  function loadReleaseDetail(row) {
    var at = { context: state.context, namespace: row.namespace, name: row.name };
    var keep = function (key, value) {
      if (state.selected !== row) return;
      state.detailData[key] = value;
      drawDetail();
    };
    var failed = function (key) {
      return function (error) { keep(key, String(error.message || error)); };
    };

    if (state.detail.tab === 'revisions' && !state.detailData.history) {
      call('helm.history', at).then(function (r) { keep('history', r.rows || []); }).catch(function (error) {
        keep('history', []);
        say(String(error.message || error), true);
      });
    }
    if (state.detail.tab === 'values' && state.detailData.values == null) {
      call('helm.values', assign({ all: Boolean(state.helmAll) }, at))
        .then(function (r) { keep('values', r.yaml || ''); })
        .catch(failed('values'));
    }
    if (state.detail.tab === 'manifest' && state.detailData.helmManifest == null) {
      call('helm.manifest', at).then(function (r) { keep('helmManifest', r.yaml || ''); }).catch(failed('helmManifest'));
    }
    if (state.detail.tab === 'notes' && state.detailData.notes == null) {
      call('helm.notes', at).then(function (r) { keep('notes', r.text || ''); }).catch(failed('notes'));
    }
  }

  /* ---------------------------------------------------------------------- *
   * Logs, at the bottom, as many as you like.
   *
   * A tab per log rather than one viewer, because the question that actually
   * gets asked is comparative — this pod restarted and that one did not, and
   * both logs have to be on screen to see why. Each tab owns its own stream, so
   * two can be followed at once and closing one does not touch the other.
   * ---------------------------------------------------------------------- */
  /**
   * How many lines a log keeps.
   *
   * Two thousand rather than five, and the reason is measured: appending one
   * line to a `<pre>` costs what laying out the whole `<pre>` costs, which is
   * 1.8ms at a thousand lines, 3.5ms at two thousand and 13ms at five. A pod
   * that talks ten times a second turns that last one into an eighth of a core
   * spent re-laying out text nobody is reading. Two thousand lines is far more
   * scrollback than a log viewer beside a table is for, and Copy takes what is
   * there whatever the number.
   */
  var LOG_CAP = 20000;
  /** How many lines back a log starts, as offered in the dock. */
  var LOG_TAILS = [200, 1000, 5000, 20000];

  function newLog(fields) {
    return assign({
      id: null, namespace: '', context: state.context, containers: [], container: null,
      lines: [], pending: '', drawn: 0, following: false, wrap: true, loading: false,
      // Search: what is typed, whether the rest is hidden, and which hit is current.
      search: '', filter: false, hit: 0,
      times: false, tail: 1000, unseen: 0,
    }, fields);
  }

  function openLog(row, container) {
    for (var i = 0; i < state.logs.length; i += 1) {
      var open = state.logs[i];
      if (open.name === row.name && open.namespace === row.namespace && open.context === state.context) {
        state.logAt = i;
        state.dockOpen = true;
        // Already open, but on another container — this asked for a particular one.
        if (container && open.container !== container) {
          open.container = container;
          restartLog(open);
          return;
        }
        drawDock();
        return;
      }
    }
    var all = row.containers || [];
    var containers = all.filter(function (c) { return !c.init; });
    state.logs.push(newLog({
      name: row.name, namespace: row.namespace,
      containers: all, container: container || (containers[0] || all[0] || {}).name || null,
    }));
    state.logAt = state.logs.length - 1;
    state.dockOpen = true;
    /*
     * Followed from the start. A log is opened to watch what a pod is doing, and
     * a still picture that has to be told to move was one more click every time
     * — the history comes with it anyway, as many lines back as the dock says.
     */
    followLog(state.logs[state.logAt]);
  }

  /** Read again with what changed — a container, the timestamps, how far back. */
  function restartLog(log) {
    if (log.following) { stopFollowing(log); followLog(log); }
    else readLog(log, log.showingPrevious);
  }

  function stopFollowing(log) {
    if (log.id) call('kube.stopFollow', { id: log.id }).catch(function () {});
    log.id = null;
    log.following = false;
    // Whatever is still on its way for this tab was asked for before this.
    log.token = (log.token || 0) + 1;
  }

  function currentLog() { return state.logs[state.logAt] || null; }

  /**
   * A dock tab for something that is not a log but reads like one.
   *
   * A drain prints a line per pod as it evicts it and then sits there when a
   * disruption budget will not let the last one go — which is exactly the shape
   * the log dock is already for.
   */
  function openStreamTab(title, id) {
    state.logs.push(newLog({ id: id, name: title, oneOff: true, following: true }));
    state.logAt = state.logs.length - 1;
    state.dockOpen = true;
    drawDock();
  }

  function closeLog(at) {
    var log = state.logs[at];
    if (!log) return;
    if (log.id) call('kube.stopFollow', { id: log.id }).catch(function () {});
    state.logs.splice(at, 1);
    // Closing a tab to the left of the open one must not change which one is
    // open: every index after it has moved down by one, including this one.
    if (at < state.logAt) state.logAt -= 1;
    state.logAt = Math.max(0, Math.min(state.logAt, state.logs.length - 1));
    drawDock();
  }

  function readLog(log, previous) {
    log.showingPrevious = Boolean(previous);
    log.loading = true;
    stopFollowing(log);
    var mine = (log.token = (log.token || 0) + 1);
    log.unseen = 0;
    drawDock();
    call('kube.logs', {
      context: log.context, namespace: log.namespace, pod: log.name,
      container: log.container || undefined, tail: log.tail, previous: previous || false, timestamps: log.times,
    }).then(function (result) {
      // Asked for something else since: this answer is about what is no longer shown.
      if (log.token !== mine) return;
      log.loading = false;
      var text = String(result.text || '');
      log.lines = text ? text.replace(/\n$/, '').split('\n').map(function (line) { return { text: line }; }) : [];
      log.pending = '';
      if (previous && !text.trim()) say('That container has no previous run to show.');
      drawDock(true);
    }).catch(function (error) {
      if (log.token !== mine) return;
      log.loading = false;
      log.lines = [{ text: String(error.message || error), err: true }];
      drawDock();
    });
  }

  function followLog(log) {
    if (log.following) { stopFollowing(log); drawDock(); return; }
    log.following = true;
    log.showingPrevious = false;
    // After a stream that ended, what it said stays: it is usually the reason it ended.
    if (log.ended && log.lines.length) log.lines.push({ text: '— following again —', note: true });
    else log.lines = [];
    log.ended = false;
    log.pending = '';
    log.unseen = 0;
    var mine = (log.token = (log.token || 0) + 1);
    drawDock(true);
    call('kube.follow', {
      context: log.context, namespace: log.namespace, pod: log.name,
      container: log.container || undefined, tail: log.tail, timestamps: log.times,
    }).then(function (result) {
      // Stopped, closed or pointed elsewhere before the stream had a name: it is stopped by that name now.
      if (log.token !== mine || !log.following || state.logs.indexOf(log) < 0) { call('kube.stopFollow', { id: result.id }).catch(function () {}); return; }
      log.id = result.id;
    })
      .catch(function (error) {
        if (log.token !== mine) return;
        log.following = false;
        say(String(error.message || error), true);
        drawDock();
      });
  }

  /* ---------------------------------------------------------------------- *
   * A line of a log, as it reads.
   *
   * Three things turn a wall of text into something that can be scanned: the
   * colours the program itself asked for (ANSI, which used to arrive as
   * `[32m` in the middle of every line), the level each line was logged at,
   * and the time it was logged, set back so it does not compete with the
   * message.
   * ---------------------------------------------------------------------- */
  var ANSI = /\x1b\[([0-9;]*)m/g;
  var ANSI_OTHER = /\x1b\[[0-9;?]*[A-Za-z]|\x1b\][^\x07]*\x07|\r/g;

  /** The text without any escape sequences: what is searched, copied and saved. */
  function plainLine(text) {
    return String(text).replace(ANSI, '').replace(ANSI_OTHER, '');
  }

  var LEVEL_WORD_BAD = /\b(ERROR|FATAL|PANIC|CRITICAL|CRIT|SEVERE|EMERG|Exception|Traceback)\b|^\s*(Caused by:|at [\w$.<>]+\()|^[EF]\d{4} /;
  var LEVEL_KEY_BAD = /\b(level|lvl|severity)["']?\s*[=:]\s*["']?(error|err|fatal|panic|crit|critical|emerg|alert)\b/i;
  var LEVEL_WORD_WARN = /\b(WARN|WARNING)\b|^W\d{4} /;
  var LEVEL_KEY_WARN = /\b(level|lvl|severity)["']?\s*[=:]\s*["']?(warn|warning)\b/i;
  var LEVEL_WORD_DEBUG = /\b(DEBUG|TRACE)\b/;
  var LEVEL_KEY_DEBUG = /\b(level|lvl|severity)["']?\s*[=:]\s*["']?(debug|trace)\b/i;

  /** The level a line was logged at, from the words loggers actually use. Case matters for the bare words: "no errors" is not an error. */
  function levelOf(plain) {
    var head = plain.length > 400 ? plain.slice(0, 400) : plain;
    if (LEVEL_WORD_BAD.test(head) || LEVEL_KEY_BAD.test(head)) return 'bad';
    if (LEVEL_WORD_WARN.test(head) || LEVEL_KEY_WARN.test(head)) return 'warn';
    if (LEVEL_WORD_DEBUG.test(head) || LEVEL_KEY_DEBUG.test(head)) return 'debug';
    return '';
  }

  var STAMP = /^(\d{4}-\d\d-\d\d[T ][\d:.,]+(?:Z|[+-]\d\d:?\d\d)?)(\s)/;

  /** ANSI SGR codes as classes: the sixteen colours, bold and dim. Backgrounds are left to the theme. */
  function ansiHtml(text, term) {
    if (text.indexOf('\x1b') < 0) return markUp(text.replace(/\r/g, ''), term);
    var out = '';
    var classes = {};
    var fg = null;
    var last = 0;
    var match;
    var flush = function (piece) {
      piece = piece.replace(ANSI_OTHER, '');
      if (!piece) return;
      var names = Object.keys(classes).filter(function (k) { return classes[k]; });
      if (fg != null) names.push('a-' + fg);
      out += names.length ? '<span class="' + names.join(' ') + '">' + markUp(piece, term) + '</span>' : markUp(piece, term);
    };
    ANSI.lastIndex = 0;
    while ((match = ANSI.exec(text))) {
      flush(text.slice(last, match.index));
      last = ANSI.lastIndex;
      var codes = match[1] ? match[1].split(';').map(Number) : [0];
      for (var i = 0; i < codes.length; i += 1) {
        var code = codes[i];
        if (code === 0) { classes = {}; fg = null; }
        else if (code === 1) classes['a-bold'] = true;
        else if (code === 2) classes['a-dim'] = true;
        else if (code === 3) classes['a-italic'] = true;
        else if (code === 4) classes['a-under'] = true;
        else if (code === 22) { classes['a-bold'] = false; classes['a-dim'] = false; }
        else if (code === 23) classes['a-italic'] = false;
        else if (code === 24) classes['a-under'] = false;
        else if (code >= 30 && code <= 37) fg = code - 30;
        else if (code >= 90 && code <= 97) fg = code - 90 + 8;
        else if (code === 39) fg = null;
        // 256-colour and true-colour foregrounds: skip their arguments.
        else if ((code === 38 || code === 48) && codes[i + 1] === 5) i += 2;
        else if ((code === 38 || code === 48) && codes[i + 1] === 2) i += 4;
      }
    }
    flush(text.slice(last));
    return out;
  }

  function shownLines(log) {
    if (!log.search || !log.filter) return log.lines;
    var term = log.search.toLowerCase();
    return log.lines.filter(function (line) { return plainLine(line.text).toLowerCase().indexOf(term) >= 0; });
  }

  /** How many lines of the log hold the search term. */
  function matchCount(log) {
    if (!log.search) return 0;
    var term = log.search.toLowerCase();
    var n = 0;
    for (var i = 0; i < log.lines.length; i += 1) if (plainLine(log.lines[i].text).toLowerCase().indexOf(term) >= 0) n += 1;
    return n;
  }

  /** One line of a log, as it appears. */
  function lineHtml(line, term) {
    if (line.plain == null) line.plain = plainLine(line.text);
    if (line.level == null) line.level = levelOf(line.plain);
    var text = line.text;
    var stamp = '';
    var at = STAMP.exec(text);
    if (at) {
      stamp = '<span class="log-ts">' + esc(at[1]) + '</span>' + at[2];
      text = text.slice(at[0].length);
    }
    var klass = 'log-line' + (line.err ? ' err' : '') + (line.level ? ' lvl-' + line.level : '') + (line.note ? ' log-note' : '');
    return '<span class="' + klass + '">' + stamp + ansiHtml(text, term) + '</span>';
  }

  /** The search term, marked where it was found. Everything else is escaped first. */
  function markUp(text, term) {
    if (!term) return esc(text);
    // Found in the text as it is, and escaped piece by piece: looked for in the
    // escaped form, "amp" and "quot" were found inside every & and ".
    var raw = String(text);
    var low = raw.toLowerCase();
    var needle = String(term).toLowerCase();
    var out = '';
    var from = 0;
    var at = low.indexOf(needle);
    while (at >= 0) {
      out += esc(raw.slice(from, at)) + '<mark class="hit">' + esc(raw.slice(at, at + needle.length)) + '</mark>';
      from = at + needle.length;
      at = low.indexOf(needle, from);
    }
    return out + esc(raw.slice(from));
  }

  /** Put the current hit in view and say which it is. `step` moves it first. */
  function showHit(log, step) {
    var hits = document.querySelectorAll('#log-lines .hit');
    var count = document.getElementById('log-count');
    if (!hits.length) {
      if (count) count.textContent = log.search ? 'no matches' : '';
      return;
    }
    var was = document.querySelector('#log-lines .hit.now');
    if (was) was.classList.remove('now');
    log.hit = ((log.hit || 0) + (step || 0) + hits.length) % hits.length;
    var now = hits[log.hit];
    now.classList.add('now');
    if (step) now.scrollIntoView({ block: 'center' });
    if (count) count.textContent = (log.hit + 1) + ' of ' + hits.length;
  }

  var LOG_ICONS = {
    wrap: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 4h12M2 8h9.5a2.5 2.5 0 0 1 0 5H8m1.5-1.8L8 13l1.5 1.8M2 12h3"/></svg>',
    times: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.3 1.6"/></svg>',
    clear: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M3.8 12.2l8.4-8.4"/></svg>',
    copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.8c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3h1.7"/></svg>',
    save: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 2.5v8m-3-3 3 3 3-3M3 12.5v1h10v-1"/></svg>',
    up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 10l4-4 4 4"/></svg>',
    down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>',
    filter: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2.5 3h11l-4.2 5v4.5l-2.6 1V8z"/></svg>',
  };

  function drawDock(toBottom) {
    var slot = document.getElementById('dock-slot');
    if (!state.logs.length) {
      slot.innerHTML = '';
      document.getElementById('app').classList.remove('dock-full');
      return;
    }

    var log = currentLog();
    var tabs = state.logs.map(function (entry, at) {
      return '<span class="dock-tab' + (at === state.logAt ? ' on' : '') + '" tabindex="0" role="tab" aria-selected="' + (at === state.logAt) + '" data-log="' + at + '">' +
        '<span class="dot ' + (entry.following ? 'ok' : 'idle') + '" title="' + (entry.following ? 'Following' : 'Not following') + '"></span>' +
        '<span class="what" title="' + esc((entry.namespace ? entry.namespace + '/' : '') + entry.name + (entry.container ? ' · ' + entry.container : '')) + '">' + esc(entry.name) + '</span>' +
        '<button class="x" data-close="' + at + '" title="Close this log" aria-label="Close">✕</button></span>';
    }).join('');

    // A drain shares the dock with the logs because it reads like one, but it is
    // not a pod: Follow and Previous would call `kubectl logs` on a pod named
    // "drain ip-10-0-1-2", which is nothing.
    var isLog = !log.oneOff;
    var containers = (log.containers || []).length > 1
      ? '<select id="log-container" title="Which container">' + log.containers.map(function (container) {
          return '<option value="' + esc(container.name) + '"' + (container.name === log.container ? ' selected' : '') +
            '>' + esc(container.name) + (container.init ? ' (init)' : '') + '</option>';
        }).join('') + '</select>'
      : '';
    var tails = '<select id="log-tail" title="How far back to start">' + LOG_TAILS.map(function (n) {
      return '<option value="' + n + '"' + (n === log.tail ? ' selected' : '') + '>last ' + (n >= 1000 ? n / 1000 + 'k' : n) + ' lines</option>';
    }).join('') + '</select>';

    var shown = shownLines(log);
    var count = log.search ? (log.filter ? shown.length + ' of ' + log.lines.length : matchCount(log) + ' lines match') : '';
    var icon = function (what, name, title, on) {
      return '<button class="btn icon' + (on ? ' on' : '') + '" data-do="' + what + '" title="' + esc(title) + '" aria-label="' + esc(title) + '">' + LOG_ICONS[name] + '</button>';
    };

    var tools = (isLog ? containers + tails : '') +
      '<span class="log-find">' +
        '<input id="log-search" placeholder="Search this log" value="' + esc(log.search) + '" title="Enter for the next match, ⇧Enter for the one before" />' +
        '<span class="dim" id="log-count">' + esc(count) + '</span>' +
        (log.search && !log.filter ? icon('log-prev', 'up', 'Previous match (⇧Enter)') + icon('log-next', 'down', 'Next match (Enter)') : '') +
        icon('log-filter', 'filter', log.filter ? 'Showing only the lines that match — show them all' : 'Show only the lines that match', log.filter) +
      '</span>' +
      (isLog
        ? '<button class="btn' + (log.following ? ' on' : '') + '" data-do="follow" title="' + (log.following ? 'Stop following' : 'Keep adding lines as they are written') + '">' +
          (log.following ? '● Following' : 'Follow') + '</button>' +
          '<button class="btn' + (log.showingPrevious ? ' on' : '') + '" data-do="previous" title="The log of the run that stopped — usually the one that says why">Previous</button>' +
          icon('log-times', 'times', log.times ? 'Hide when each line was written' : 'Show when each line was written', log.times)
        : '') +
      icon('wrap', 'wrap', log.wrap ? 'Stop wrapping long lines' : 'Wrap long lines', log.wrap) +
      icon('log-clear', 'clear', 'Clear what is shown (keeps following)') +
      icon('copy-log', 'copy', 'Copy ' + (log.search && log.filter ? 'the matching lines' : 'the whole log')) +
      icon('save-log', 'save', 'Save this log to a file') +
      (isLog ? '<button class="btn" data-do="ask-log" title="Open a Claude session about this pod, with this log">Ask Claude</button>' : '') +
      '<button class="btn icon' + (state.dockFull ? ' on' : '') + '" data-do="dock-full" title="' +
        (state.dockFull ? 'Give the table its room back' : 'Fit the log to the window') + '">' +
        (state.dockFull ? '⤡' : '⤢') + '</button>' +
      '<button class="btn icon" data-do="dock" title="' + (state.dockOpen ? 'Put the log away' : 'Bring the log back') +
        '">' + (state.dockOpen ? '▾' : '▴') + '</button>';

    var body = log.loading
      ? '<div class="dim">reading…</div>'
      : !shown.length
        ? '<div class="dim">' + (log.search && log.filter ? 'Nothing in this log matches.' : log.following ? 'Waiting for the first line…' : 'Nothing in the log.') + '</div>'
        : '<pre id="log-lines" class="' + (log.wrap ? '' : 'wrapless') + '">' +
          shown.map(function (line) { return lineHtml(line, log.search); }).join('\n') + '</pre>';

    // Whatever else happens below, this is what the DOM will hold.
    log.drawn = log.loading ? 0 : log.lines.length;

    // Read before the redraw, because the redraw is what destroys it.
    var old = document.getElementById('dock-body');
    var wasAt = old ? old.scrollTop : 0;
    var wasAtBottom = old ? old.scrollHeight - old.scrollTop - old.clientHeight < 40 : true;

    /*
     * Full height is the grid's business, not this element's: the row above
     * gives up its space and this one takes it. Which is why the class goes on
     * the app and not only on the dock.
     */
    var full = state.dockOpen && state.dockFull;
    document.getElementById('app').classList.toggle('dock-full', full);

    slot.innerHTML = '<div class="dock' + (full ? ' is-full' : '') + '" style="' +
      (state.dockOpen && !full ? 'height:' + state.dock + 'px' : '') + '">' +
      '<div class="dock-grip" id="dock-grip" title="Drag to resize"></div>' +
      '<div class="dock-tabs">' + tabs + '<span class="dock-tools">' + tools + '</span></div>' +
      (state.dockOpen ? '<div class="dock-body" id="dock-body">' + body + '</div>' +
        '<button class="log-latest" id="log-latest" data-do="log-latest"' + (log.unseen && log.following ? '' : ' hidden') + '>↓ ' +
        '<span id="log-unseen">' + log.unseen + '</span> new</button>' : '') +
      '</div>';

    /*
     * Where the reader was, kept.
     *
     * A followed log redraws whenever anything else does — a search, a wrap, the
     * table refreshing underneath — and jumping to the bottom every time is what
     * makes a log impossible to read: you scroll up to the line that matters and
     * it throws you back down a second later. So the tail is only followed when
     * the reader was already at it. Scrolled up, they stay where they were.
     */
    if (state.dockOpen) {
      var pane = document.getElementById('dock-body');
      if (pane) pane.scrollTop = toBottom || (log.following && wasAtBottom) ? pane.scrollHeight : wasAt;
      if (log.search && !log.filter) showHit(log, 0);
    }
  }

  /** A followed log's "new lines below" button, kept in step without a redraw. */
  function drawUnseen(log) {
    var button = document.getElementById('log-latest');
    if (!button) return;
    button.hidden = !(log.unseen && log.following);
    var n = document.getElementById('log-unseen');
    if (n) n.textContent = log.unseen;
  }

  /**
   * A log that is being followed, added to rather than drawn again.
   *
   * Redrawing is what a viewer does when the thing being viewed changed; a line
   * arriving has not changed anything, it has been added. The difference is not
   * academic: rebuilding five thousand lines takes about seventy milliseconds,
   * and a chatty pod sends ten chunks a second — which is more time than there
   * is. Appending costs what the one line deserves.
   *
   * `drawn` is how many of the log's lines are in the DOM already. Returns
   * false when there is nothing to append to, and the caller draws properly.
   */
  var pendingDraw = 0;

  function appendLines(log) {
    var pre = document.getElementById('log-lines');
    if (!pre || !state.dockOpen || state.logs[state.logAt] !== log) return false;
    if ((log.drawn || 0) >= log.lines.length) return true;

    var added = log.lines.slice(log.drawn || 0);
    log.drawn = log.lines.length;
    if (log.search && log.filter) {
      var term = log.search.toLowerCase();
      added = added.filter(function (line) { return plainLine(line.text).toLowerCase().indexOf(term) >= 0; });
    }

    var pane = document.getElementById('dock-body');
    // Whether to follow the tail is decided *before* adding to it.
    var atBottom = pane ? pane.scrollHeight - pane.scrollTop - pane.clientHeight < 40 : true;

    if (added.length) {
      var html = added.map(function (line) { return lineHtml(line, log.search); }).join('\n');
      pre.insertAdjacentHTML('beforeend', (pre.childNodes.length ? '\n' : '') + html);
      // The cap, kept in the DOM as well as in the array.
      var over = pre.childElementCount - LOG_CAP;
      for (var i = 0; i < over; i += 1) if (pre.firstChild) pre.removeChild(pre.firstChild);
      if (!atBottom) { log.unseen += added.length; drawUnseen(log); }
    }

    if (log.search) {
      var count = document.getElementById('log-count');
      if (count && log.filter) count.textContent = shownLines(log).length + ' of ' + log.lines.length;
    }
    if (atBottom && pane) pane.scrollTop = pane.scrollHeight;
    return true;
  }

  // Scrolling back down to the end is reading the new lines.
  document.addEventListener('scroll', function (event) {
    if (!event.target || event.target.id !== 'dock-body') return;
    var log = currentLog();
    var pane = event.target;
    if (log && log.unseen && pane.scrollHeight - pane.scrollTop - pane.clientHeight < 40) {
      log.unseen = 0;
      drawUnseen(log);
    }
  }, true);

  document.addEventListener('click', function (event) {
    var close = event.target.closest('[data-close]');
    if (close) { closeLog(Number(close.dataset.close)); return; }
    var tab = event.target.closest('[data-log]');
    if (tab) { state.logAt = Number(tab.dataset.log); drawDock(true); }
  });

  document.addEventListener('input', function (event) {
    if (event.target.id === 'yaml-edit') {
      yamlTyped(event.target);
      return;
    }
    if (event.target.id !== 'log-search') return;
    var log = currentLog();
    if (!log) return;
    log.search = event.target.value;
    log.hit = 0;
    var at = event.target.selectionStart;
    drawDock();
    var field = document.getElementById('log-search');
    if (field) { field.focus(); field.setSelectionRange(at, at); }
  });

  document.addEventListener('change', function (event) {
    if (event.target.id !== 'log-container' && event.target.id !== 'log-tail') return;
    var log = currentLog();
    if (!log) return;
    if (event.target.id === 'log-tail') log.tail = Number(event.target.value) || 1000;
    else log.container = event.target.value;
    restartLog(log);
  });

  // Enter walks the matches, as it does in every find bar; Escape lets go of the search.
  document.addEventListener('keydown', function (event) {
    if (event.target.id !== 'log-search') return;
    var log = currentLog();
    if (!log) return;
    if (event.key === 'Enter') {
      event.preventDefault();
      if (log.filter) return;
      showHit(log, event.shiftKey ? -1 : 1);
    } else if (event.key === 'Escape' && log.search) {
      event.preventDefault();
      event.stopPropagation();
      log.search = '';
      drawDock();
    }
  }, true);

  /* Dragging the dock taller. Bounded, so it can neither vanish nor take the whole panel. */
  /**
   * The right-click menu inside a log.
   *
   * The same gesture a terminal answers, for the same reason: this reads like
   * one, so it should behave like one. The selection is read as the menu opens,
   * before the click that opens it can clear it — and Copy only appears when
   * there is something to copy, because a Copy that copies nothing teaches
   * people not to trust the menu.
   */
  document.addEventListener('contextmenu', function (event) {
    var body = event.target.closest('.dock-body');
    if (!body) return;
    event.preventDefault();
    var log = currentLog();
    if (!log) return;
    var selected = String(window.getSelection() || '');
    var shown = shownLines(log);

    closeRowMenu();
    var menu = document.createElement('div');
    menu.className = 'row-menu';
    menu.innerHTML =
      (selected
        ? '<button class="btn" data-log-menu="selection">Copy selection<span class="dim"> · ' +
          selected.split('\n').length + ' line' + (selected.indexOf('\n') >= 0 ? 's' : '') + '</span></button>'
        : '<button class="btn" disabled>Copy selection<span class="dim"> · nothing selected</span></button>') +
      '<button class="btn" data-log-menu="all">Copy the whole log<span class="dim"> · ' + shown.length + ' lines</span></button>' +
      '<button class="btn" data-log-menu="save">Save to a file…</button>';
    document.body.appendChild(menu);

    var below = window.innerHeight - event.clientY > menu.offsetHeight + 8;
    menu.style.left = Math.max(6, Math.min(event.clientX, window.innerWidth - menu.offsetWidth - 6)) + 'px';
    menu.style.top = (below ? event.clientY + 2 : event.clientY - menu.offsetHeight - 2) + 'px';

    menu.addEventListener('click', function (click) {
      var button = click.target.closest('[data-log-menu]');
      if (!button) return;
      var whole = shown.map(function (line) { return plainLine(line.text); }).join('\n');
      if (button.dataset.logMenu === 'selection') {
        host.emit('copy', { text: selected });
        say('Copied ' + selected.split('\n').length + ' lines.');
      } else if (button.dataset.logMenu === 'all') {
        host.emit('copy', { text: whole });
        say('Copied ' + shown.length + ' lines.');
      } else {
        host.emit('save', { name: log.name + '.log', text: whole });
      }
      closeRowMenu();
    });
    setTimeout(function () { document.addEventListener('click', closeRowMenu, { once: true }); }, 0);
  });

  /**
   * Reading a value off the chart.
   *
   * The points are on the element, so this is arithmetic rather than another
   * question to Prometheus — and it is what turns a shape into a measurement:
   * "it was two cores at ten past four" is the sentence somebody is trying to
   * say when they point at a bump.
   */
  /** Whether any chart is currently being read, so the common case costs nothing. */
  var readingChart = false;

  document.addEventListener('mousemove', function (event) {
    var chart = event.target.closest('.chart');
    if (!chart) {
      // A mousemove fires sixty times a second over the whole panel, and
      // sweeping the document for a class that is almost never set is work paid
      // for on every one of them.
      if (!readingChart) return;
      readingChart = false;
      [].forEach.call(document.querySelectorAll('.chart.is-read'), function (one) {
        one.classList.remove('is-read');
        one.querySelector('.chart-cursor').setAttribute('x1', -10);
        one.querySelector('.chart-cursor').setAttribute('x2', -10);
        var head = one.querySelector('.chart-value');
        if (head && one.dataset.last) head.textContent = one.dataset.last;
        var when = one.querySelector('.chart-when');
        if (when && one.dataset.over) when.textContent = one.dataset.over;
      });
      return;
    }
    var points;
    try { points = JSON.parse(chart.dataset.points); } catch (e) { return; }
    if (!points.length) return;

    var svg = chart.querySelector('svg');
    var box = svg.getBoundingClientRect();
    var share = Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
    var at = Math.round(share * (points.length - 1));
    var point = points[at];

    var head = chart.querySelector('.chart-value');
    var when = chart.querySelector('.chart-when');
    if (!chart.dataset.last) { chart.dataset.last = head.textContent; chart.dataset.over = when.textContent; }
    chart.classList.add('is-read');
    readingChart = true;
    head.textContent = chart.dataset.unit === 'Memory' ? bytes(point[1]) : fromCores(point[1]);
    when.textContent = new Date(point[0]).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

    var cursor = chart.querySelector('.chart-cursor');
    var x = (at / (points.length - 1)) * 240;
    cursor.setAttribute('x1', x);
    cursor.setAttribute('x2', x);
  });

  /**
   * Following a statistic to what it is about.
   *
   * Every number on the overview is a question — how many nodes, what is
   * failing, where is the CPU — and the answer is a view this panel already
   * draws. Clicking goes there rather than leaving somebody to find it, which
   * is the difference between a dashboard and a poster.
   */
  /* Adding and removing a variable, which is the one edit that changes the shape
     of the form rather than the value of a field — so it redraws, and the redraw
     is forced past the guard that exists to protect what is being typed. */
  document.addEventListener('click', function (event) {
    var add = event.target.closest('[data-config-add]');
    if (add && state.config) {
      var container = state.config.draft.containers[Number(add.dataset.configAdd)];
      if (!container) return;
      container.env.push({ name: '', value: '', from: null });
      drawDetail(true);
      var fields = document.querySelectorAll('[data-config="env-name"][data-at="' + add.dataset.configAdd + '"]');
      if (fields.length) fields[fields.length - 1].focus();
      return;
    }
    var drop = event.target.closest('[data-config-drop]');
    if (drop && state.config) {
      var from = state.config.draft.containers[Number(drop.dataset.configDrop)];
      if (!from) return;
      from.env.splice(Number(drop.dataset.env), 1);
      state.editing = configChanges(state.config).length > 0;
      drawDetail(true);
      return;
    }
  });

  document.addEventListener('input', function (event) {
    var field = event.target.closest('[data-config]');
    if (field) editConfig(field);
  });

  document.addEventListener('click', function (event) {
    var stat = event.target.closest('[data-stat]');
    if (stat) { show({ type: 'stats', focus: stat.dataset.stat }); return; }

    var back = event.target.closest('[data-view=overview]');
    if (back) { show({ type: 'overview' }); return; }

    var card = event.target.closest('[data-go]');
    if (card) {
      // What the number was about, carried into the table it opens.
      show({ type: 'kind', name: card.dataset.go }, {
        only: card.dataset.only,
        sort: card.dataset.sort ? { column: card.dataset.sort, dir: -1 } : null,
      });
      return;
    }

    var namespace = event.target.closest('[data-namespace]');
    if (namespace) {
      var pick = document.getElementById('namespace');
      state.namespace = namespace.dataset.namespace;
      if (pick) pick.value = state.namespace;
      show({ type: 'kind', name: 'pods' });
      return;
    }

    var node = event.target.closest('[data-node]');
    if (node) { show({ type: 'kind', name: 'nodes' }, { wanted: node.dataset.node }); return; }

    /*
     * A kind, named by something that is not the navigation.
     *
     * "See them all" under the volumes on the Disk page carried `data-kind` and
     * nothing listened for it outside `nav`, so it was a button that did
     * nothing at all. Anything on the overview may name a kind now; the guard
     * is only there so a click in the navigation is not handled twice.
     */
    var kind = event.target.closest('[data-kind]');
    if (kind && !kind.closest('nav')) { show({ type: 'kind', name: kind.dataset.kind }); return; }

    var range = event.target.closest('[data-range]');
    if (!range) return;
    state.prom.minutes = Number(range.dataset.range);
    loadCharts(state.selected);
    draw();
  });

  document.addEventListener('mousedown', function (event) {
    /*
     * The strip is part of the handle.
     *
     * A line a few pixels tall is a small target and an unlikely place to try,
     * so the bar under it drags as well — every window manager on earth lets you
     * move a thing by its title bar. Anything in the strip that does something
     * of its own keeps doing it.
     */
    var onStrip = event.target.closest('.dock-tabs') &&
      !event.target.closest('button, input, select, .dock-tab, a');
    var grip = event.target.closest('#dock-grip') || (onStrip ? document.getElementById('dock-grip') : null);
    if (!grip) return;
    event.preventDefault();
    grip.classList.add('is-held');
    /*
     * Dragging out of full height rather than refusing to move.
     *
     * Filling the window is a height the grid decides, so the pixels the drag
     * starts from have to be measured rather than remembered — and full height
     * has to be given up in the same breath, or the inline height the drag sets
     * would be overruled by the class and the dock would sit there ignoring the
     * pointer.
     */
    var dock = document.querySelector('.dock');
    var startY = event.clientY;
    var startHeight = state.dockFull && dock ? dock.getBoundingClientRect().height : state.dock;
    if (state.dockFull) {
      state.dockFull = false;
      drawDock();
      dock = document.querySelector('.dock');
    }
    var move = function (moved) {
      state.dock = Math.max(90, Math.min(window.innerHeight - 190, startHeight + (startY - moved.clientY)));
      // Re-queried every move: a following log redraws the dock underneath us.
      var live = document.querySelector('.dock');
      if (live) live.style.height = state.dock + 'px';
    };
    var up = function () {
      var held = document.getElementById('dock-grip');
      if (held) held.classList.remove('is-held');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  host.on('stream', function (payload) {
    if (payload.id === state.watch.id) {
      if (payload.done) {
        /*
         * The API server closes a watch every few minutes; that is normal and
         * not an error. What is not safe is assuming nothing happened while it
         * was down, so the table is read again and the watch reopened.
         */
        state.watch.id = null;
        if (state.showing && state.view.type === 'kind') load(true);
        return;
      }
      if (payload.events) applyWatch(payload.events);
      return;
    }

    for (var i = 0; i < state.logs.length; i += 1) {
      var log = state.logs[i];
      if (log.id !== payload.id) continue;
      if (payload.done) {
        mapStreamEnded(payload);
        log.following = false;
        log.id = null;
        if (log.pending) { log.lines.push({ text: log.pending }); log.pending = ''; }
        log.ended = true;
        // Ended and failed are different things to read at the bottom of a log.
        log.lines.push({ text: payload.code ? '— stopped (exit ' + payload.code + ') —' : '— the log ended —', note: true, err: Boolean(payload.code) });
        drawDock();
        return;
      }
      /*
       * A chunk rarely ends on a line break, so its tail is half a line. That
       * half is held here rather than pushed, so what is in `lines` is always
       * whole lines — which is what makes appending sound: nothing already
       * drawn is ever revised, so nothing already drawn has to be found again.
       */
      var text = (log.pending || '') + String(payload.text || '');
      var parts = text.split('\n');
      log.pending = parts.pop();
      for (var n = 0; n < parts.length; n += 1) {
        log.lines.push({ text: parts[n], err: payload.stream === 'err' });
      }
      if (log.lines.length > LOG_CAP) {
        var cut = log.lines.length - LOG_CAP;
        log.lines.splice(0, cut);
        log.drawn = Math.max(0, (log.drawn || 0) - cut);
      }
      if (i !== state.logAt) return;
      /*
       * Once per frame at most. Chunks arrive in bursts — a pod that logs a
       * request logs four lines about it — and drawing each one separately is
       * three quarters of the work thrown away. It also means a frame nobody
       * is looking at does nothing at all: an animation frame in a hidden
       * document is never called.
       */
      if (!pendingDraw) {
        pendingDraw = requestAnimationFrame(function () {
          pendingDraw = 0;
          var current = currentLog();
          if (current && !appendLines(current)) drawDock();
        });
      }
      return;
    }

    // A forward saying where it stands. The app keeps the record; this is its latest word.
    if (payload.forward) {
      if (!payload.done) { keepForward(payload.forward); return; }
      delete state.openWhenUp[payload.id];
      /*
       * A forward that failed stays in the strip, saying why, until it is tried
       * again or dismissed. A toast that went away was how a port stopped
       * working without anybody knowing which one, or since when.
       */
      if (payload.forward.state === 'failed') keepForward(payload.forward);
      else {
        state.forwards = state.forwards.filter(function (one) { return one.id !== payload.id; });
        drawBar();
        drawTableSoon();
        if (state.selected) drawDetailButtonsSoon();
      }
      return;
    }
    for (var f = 0; f < state.forwards.length; f += 1) {
      if (state.forwards[f].id !== payload.id) continue;
      if (payload.done) { state.forwards.splice(f, 1); drawBar(); }
      return;
    }
  });

  /* ---------------------------------------------------------------------- *
   * Doing things.
   * ---------------------------------------------------------------------- */
  /**
   * What is on screen, as text somebody would want to paste.
   *
   * `innerText` alone is nearly right, and wrong in the one place it matters: a
   * description list puts every label on its own line and every value on the
   * next, so a copied overview comes out as a column of alternating words. The
   * pairs are joined; everything else is taken as it reads.
   */
  function readable(root) {
    /*
     * The root may be the thing itself rather than a box of things — the drawer
     * hands over a whole tab, a block's Copy hands over its one table or its one
     * list. Both have to read the same, so the shape is decided per node and the
     * root is just another node.
     */
    var mine = pieceText(root);
    if (mine != null) return mine.trim();
    var out = [];
    for (var i = 0; i < root.children.length; i += 1) {
      var node = root.children[i];
      var text = pieceText(node);
      out.push(text == null ? node.innerText : text);
    }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  /** One element as text, when its shape says how to read it. */
  function pieceText(node) {
    if (node.tagName === 'DL') {
      var out = [];
      var terms = node.querySelectorAll('dt');
      for (var n = 0; n < terms.length; n += 1) {
        var value = terms[n].nextElementSibling;
        out.push(terms[n].textContent + ': ' + (value ? value.textContent : ''));
      }
      return out.join('\n');
    }
    if (node.classList && node.classList.contains('containers')) {
      // Name and image, one container per line, as the table read before it; the Log button is not text.
      var found = [];
      node.querySelectorAll('.container-row').forEach(function (row) {
        var name = row.querySelector('.container-name');
        var image = row.querySelector('.container-image');
        found.push([name ? name.textContent.trim() : '', image ? image.textContent.trim() : ''].filter(Boolean).join('\t'));
      });
      return found.join('\n');
    }
    if (node.tagName === 'TABLE') {
      /*
       * A table read as a table: columns separated, one row per line, and no
       * buttons. Copying the containers block used to hand back the word "Log"
       * after every image, because that is what is on the row — and a copy is of
       * the thing said, not of the things offered.
       */
      var lines = [];
      var rows = node.querySelectorAll('tr');
      for (var r = 0; r < rows.length; r += 1) lines.push(cellsOf(rows[r]).join('\t'));
      return lines.join('\n');
    }
    return null;
  }

  /** One row's cells as text, leaving out the ones that are only controls. */
  function cellsOf(row) {
    var cells = row.children;
    var text = [];
    for (var i = 0; i < cells.length; i += 1) {
      var cell = cells[i];
      if (cell.querySelector('button, input')) continue;
      var value = cell.textContent.trim();
      if (value) text.push(value);
    }
    return text;
  }

  function act(what) {
    /*
     * Copying, which every part of this has to allow.
     *
     * A panel is a sandboxed frame in an origin of its own, so it cannot write
     * to the clipboard itself — it asks the app, which is the same door
     * everything else goes through. What is copied is what is on screen: the
     * text of the tab, or the table as its columns, rather than a second
     * rendering of the same data that could disagree with the first.
     */
    if (what === 'copy-detail') {
      var body = document.querySelector('.detail-body');
      var head = document.querySelector('.detail-head h3');
      if (!body) return;
      // A manifest is copied as the text it is — what is in the editor if one is open — and not as a bar of buttons above a box.
      if (state.detail.tab === 'yaml' && state.selected && state.detailData.yaml != null && state.selected.kind !== 'Release') {
        var manifest = state.editingYaml ? (draftFor(state.selected) == null ? baseFor(state.selected) : draftFor(state.selected))
          : hidesValues(state.selected) ? maskSecret(baseFor(state.selected)) : state.detailData.yaml;
        host.emit('copy', { text: manifest });
        say('Copied ' + manifest.split('\n').length + ' lines' + (state.editingYaml && draftFor(state.selected) != null ? ', with your edit.' : '.'));
        return;
      }
      var text = (head ? head.textContent + '\n\n' : '') + readable(body);
      host.emit('copy', { text: text });
      say('Copied ' + text.split('\n').length + ' lines.');
      return;
    }
    if (what === 'warnings-clear-shown') {
      var cleared = 0;
      visible().forEach(function (row) { var node = mapKnown(row); if (warnedCount(node)) { clearWarnings(node); cleared += 1; } });
      say('Cleared the warnings of ' + cleared + '. They are counted again if the cluster says them again.');
      draw();
      return;
    }
    if (what === 'copy-table') {
      var rows = visible();
      if (!rows.length) return;
      var columns = (state.table.columns || []).filter(function (c) { return !(c === 'namespace' && state.namespace); });
      var lines = [columns.map(function (c) { return HEADINGS[c] || c; }).join('\t')];
      for (var i = 0; i < rows.length; i += 1) {
        lines.push(columns.map(function (c) { return rows[i][c] == null ? '' : String(rows[i][c]); }).join('\t'));
      }
      host.emit('copy', { text: lines.join('\n') });
      say('Copied ' + rows.length + ' rows.');
      return;
    }

    if (what === 'find-next' || what === 'find-prev') { state.find.at += what === 'find-next' ? 1 : -1; findApply(true); return; }
    if (what === 'find-close') { findClose(); return; }

    if (what === 'only-bad') { state.only = 'bad'; remember(); drawCrumb(); drawTable(); return; }
    if (what === 'show-all') {
      state.only = null;
      remember();
      drawCrumb();
      drawTable();
      return;
    }

    if (what === 'pick-none') { state.picked = []; drawTable(); drawPicked(); return; }
    if (what === 'pick-delete' || what === 'pick-restart') {
      var chosen = pickedRows();
      if (!chosen.length) return;
      /*
       * One question for the whole lot, naming the count — asking five times is
       * how the fifth one gets waved through — and then one call each, because
       * `delete` with several names either all works or reports which did not,
       * and knowing which did not is the point.
       */
      var verb = what === 'pick-delete' ? 'kube.remove' : 'kube.restart';
      var first = chosen[0];
      /*
       * One batch, named: the app asks once for it and then lets the rest of
       * the same batch through. Each call used to be asked about on its own
       * after the first, which was five questions for five pods — and the
       * first one named the first pod's namespace even when the ticks spanned
       * three.
       */
      var batch = 'batch-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      var spread = chosen.map(function (row) { return row.namespace || ''; })
        .filter(function (ns, at, all) { return all.indexOf(ns) === at; }).length;
      if (state.bulkBusy) return;
      state.bulkBusy = (what === 'pick-delete' ? 'Deleting ' : 'Restarting ') + chosen.length + '…';
      drawPicked();
      var failed = [];
      var done = 0;
      var askOf = function (row) {
        return call(verb, { context: state.context, namespace: row.namespace, kind: row.kind, name: row.name, count: chosen.length, spread: spread, batch: batch });
      };
      var finish = function () {
        state.bulkBusy = '';
        state.picked = [];
        drawPicked();
        if (failed.length || done) {
          say(failed.length
            ? done + ' of ' + chosen.length + ' done. Failed: ' + failed.slice(0, 3).join('; ') + (failed.length > 3 ? ' and ' + (failed.length - 3) + ' more' : '')
            : 'All ' + chosen.length + ' done.', failed.length > 0);
          setTimeout(function () { load(true); }, 1200);
        }
      };
      // The first carries the question. Said no to, nothing else is asked of the cluster.
      askOf(first).then(function () { done += 1; }, function (error) {
        var why = String(error.message || error);
        if (/the person said no/.test(why)) { state.bulkBusy = ''; drawPicked(); return Promise.reject(null); }
        failed.push(first.name + ': ' + why);
      }).then(function () {
        // Then the rest, four at a time: forty kubectl processes at once is its own outage.
        var rest = chosen.slice(1);
        var next = 0;
        var worker = function () {
          if (next >= rest.length) return Promise.resolve();
          var row = rest[next];
          next += 1;
          return askOf(row).then(function () { done += 1; }, function (error) { failed.push(row.name + ': ' + String(error.message || error)); }).then(worker);
        };
        return Promise.all([worker(), worker(), worker(), worker()]);
      }).then(finish, function (stopped) { if (stopped !== null) finish(); });
      return;
    }

    var log = currentLog();
    if (log) {
      if (what === 'follow') { followLog(log); return; }
      if (what === 'previous') { readLog(log, true); return; }
      if (what === 'wrap') { log.wrap = !log.wrap; drawDock(); return; }
      if (what === 'log-next' || what === 'log-prev') { showHit(log, what === 'log-next' ? 1 : -1); return; }
      if (what === 'log-filter') { log.filter = !log.filter; log.hit = 0; drawDock(); return; }
      if (what === 'log-times') { log.times = !log.times; restartLog(log); return; }
      if (what === 'log-clear') { log.lines = []; log.pending = ''; log.unseen = 0; drawDock(); return; }
      if (what === 'log-latest') {
        var pane = document.getElementById('dock-body');
        if (pane) pane.scrollTop = pane.scrollHeight;
        log.unseen = 0;
        drawUnseen(log);
        return;
      }
      if (what === 'dock') { state.dockOpen = !state.dockOpen; drawDock(true); return; }
      // Filling the window is also a way of opening it — asking for a bigger log
      // while it is shut and getting nothing would be the wrong answer.
      if (what === 'dock-full') {
        state.dockFull = !state.dockFull;
        if (state.dockFull) state.dockOpen = true;
        drawDock(true);
        return;
      }
      if (what === 'save-log') {
        var whole = shownLines(log).map(function (line) { return plainLine(line.text); }).join('\n');
        host.emit('save', { name: log.name + (log.container ? '-' + log.container : '') + '.log', text: whole });
        return;
      }
      if (what === 'copy-log') {
        var text = shownLines(log).map(function (line) { return plainLine(line.text); }).join('\n');
        // A frame with no same-origin has no clipboard of its own, so the app
        // is asked to do it — the same door everything else goes through.
        host.emit('copy', { text: text });
        say('Copied ' + shownLines(log).length + ' lines.');
        return;
      }
      if (what === 'ask-log') {
        // Including *which* log is on screen: the previous container's is the
        // one that says why something died, and it is usually why you asked.
        askAbout(
          { kind: 'Pod', name: log.name, namespace: log.namespace, container: log.container, previous: Boolean(log.showingPrevious) },
          '',
        );
        return;
      }
    }

    var row = state.selected;
    if (!row) return;
    var at = { context: state.context, namespace: row.namespace, kind: row.kind, name: row.name };

    if (what === 'logs') { openLog(row); return; }
    if (what === 'yaml-edit') {
      /*
       * Turning on the editor, not editing. The manifest is painted until this
       * is pressed, which is what it is doing almost all of the time — and the
       * textarea it swaps in is plain, because a coloured one would mean
       * maintaining an editor inside a panel.
       */
      if (state.detailData.unread || state.applying) return;
      // The editor holds the real text: to edit a Secret is to have asked to see it.
      if (row.kind === 'Secret') state.showSecret = true;
      /*
       * Read again first. The manifest on screen was read when the tab was
       * opened, which may be a while ago, and an edit that starts from an old
       * copy is an edit that puts back whatever changed since.
       */
      var opening = row;
      var here = { context: state.context, kind: row.kind, name: row.name };
      if (row.namespace) here.namespace = row.namespace;
      var open = function () {
        if (state.selected !== opening) return;
        state.applying = null;
        state.editingYaml = true;
        state.yamlView = 'edit';
        drawDetail(true);
        var box = document.getElementById('yaml-edit');
        if (box) { box.focus(); box.setSelectionRange(0, 0); box.scrollTop = 0; yamlWhere(); }
      };
      state.applying = 'open';
      drawDetail(true);
      call('kube.manifest', here).then(function (result) {
        if (state.selected !== opening) return;
        state.detailData.yaml = result.yaml || '';
        state.detailData.editable = result.editable == null ? state.detailData.yaml : result.editable;
        open();
      }).catch(function (error) {
        if (state.selected !== opening) return;
        state.applying = null;
        state.editNote = { text: 'It could not be read again, so it is not safe to edit: ' + String(error.message || error), bad: true };
        drawDetail(true);
      });
      return;
    }
    if (what === 'yaml-diff' || what === 'yaml-diff-close') {
      // The text in the box is the draft already; the changes are another way of looking at it.
      state.yamlView = what === 'yaml-diff' && state.yamlView !== 'diff' && draftFor(row) != null ? 'diff' : 'edit';
      redrawEditor();
      if (state.yamlView === 'edit') { var back = document.getElementById('yaml-edit'); if (back) back.focus(); }
      return;
    }
    if (what === 'yaml-theirs') { state.yamlView = 'theirs'; drawDetail(true); return; }
    if (what === 'yaml-goto') { if (state.editNote && state.editNote.line) yamlGoTo(state.editNote.line); return; }
    if (what === 'note-close') { state.editNote = null; redrawEditor(); return; }
    if (what === 'yaml-replace') {
      var whole = draftFor(row);
      if (whole != null) applyYaml(whole, false, true, true);
      return;
    }
    if (what === 'yaml-force') {
      var mineText = draftFor(row);
      if (mineText != null) applyYaml(mineText, false, true);
      return;
    }
    if (what === 'yaml-take') {
      dropDraft(row);
      stopEditing();
      state.detailData.yaml = null;
      state.detailData.editable = null;
      state.detailData.theirs = null;
      drawDetail(true);
      loadDetail();
      say('Your edit was dropped. This is what the cluster has now.');
      return;
    }
    if (what === 'yaml-save') {
      var saving = state.editingYaml ? (draftFor(row) == null ? baseFor(row) : draftFor(row)) : hidesValues(row) ? maskSecret(baseFor(row)) : state.detailData.yaml;
      if (saving == null || state.detailData.unread) return;
      host.emit('save', { name: [row.namespace, row.kind.toLowerCase(), row.name].filter(Boolean).join('-') + '.yaml', text: saving });
      return;
    }
    if (what === 'yaml-diff-copy') {
      var mineNow = draftFor(row);
      if (mineNow != null) copyText(diffText(lineDiff(baseFor(row), mineNow)), 'the changes');
      return;
    }
    if (what === 'yaml-wrap') { state.yamlWrap = !state.yamlWrap; redrawEditor(); return; }
    if (what === 'pane-kubectl') { copyText(kubectlFor(row), 'the kubectl line'); return; }
    if (what === 'yaml-clean') { state.yamlClean = !state.yamlClean; drawDetail(true); return; }
    if (what === 'secret-show') { state.showSecret = !state.showSecret; drawDetail(true); return; }
    if (what === 'events-group') { state.eventsGroup = !state.eventsGroup; drawDetail(); return; }
    if (what === 'events-only') { state.eventsOnly = !state.eventsOnly; drawDetail(); return; }
    if (what === 'warnings-clear' || what === 'warnings-unclear') {
      var about = state.selected;
      if (!about) return;
      // The map may not know it — a kind it does not draw — and the events in the pane are still its own.
