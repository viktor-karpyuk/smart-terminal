    var d = new Date(now);
    var tonight = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 22, 0, 0, 0).getTime();
    var tomorrow = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 8, 0, 0, 0).getTime();
    var out = [{ label: 'In 30 minutes', at: now + 30 * 60000 }];
    if (tonight - now > 45 * 60000) out.push({ label: 'Tonight 22:00', at: tonight });
    out.push({ label: 'Tomorrow 08:00', at: tomorrow });
    return out;
  }

  /** A time said the way a person says it: "in 12 min", "today 22:00", "Fri 08:00". */
  function whenWords(at, now) {
    var diff = at - now;
    if (diff < 0) return Math.round(-diff / 60000) < 1 ? 'just now' : Math.round(-diff / 60000) + ' min ago';
    if (diff < 90 * 60000) return 'in ' + Math.max(1, Math.round(diff / 60000)) + ' min';
    var d = new Date(at);
    var n = new Date(now);
    var clock = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (d.toDateString() === n.toDateString()) return 'today ' + clock;
    var next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
    if (d.toDateString() === next.toDateString()) return 'tomorrow ' + clock;
    return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + clock;

  /** The value of a datetime-local box ("2026-10-16T22:00") as a time, or null. */

    [].forEach.call(pal.list.querySelectorAll('[role="option"]'), function (li, i) { li.setAttribute('aria-selected', i === pal.at ? 'true' : 'false'); });

    var cur = $('pal-' + pal.at);
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  }

  function askPalette(text) {
    if (!pal) return;
    var q = String(text || '').trim();
    pal.q = q;
    pal.at = 0;
    clearTimeout(pal.timer);
    if (!q) { pal.jobs = null; pal.saved = null; pal.busy = false; drawPalette(); return; }
    pal.busy = true;
    var mine = pal;
    drawPalette();
    pal.timer = setTimeout(function () {
      api('search', { q: q }).then(function (data) {
        if (pal !== mine || mine.q !== q) return;
        mine.jobs = data.rows || []; mine.busy = false; mine.at = 0; drawPalette();
      }, function () {
        if (pal !== mine || mine.q !== q) return;
        mine.jobs = []; mine.busy = false; drawPalette();
      });
      // What the archive kept — errors, last lines, notes — is searched from three letters on.
      if (q.length >= 3) {
        tryApi('searchArchive', { q: q, limit: 6 }).then(function (data) {
          if (pal !== mine || mine.q !== q || !data) return;
          mine.saved = data.hits || []; drawPalette();
        });
      } else mine.saved = null;
    }, 150);
  }

  function paletteKey(event) {
    if (event.key === 'Escape') { event.preventDefault(); closePalette(); }
    else if (event.key === 'ArrowDown') { event.preventDefault(); if (pal.items.length) { pal.at = (pal.at + 1) % pal.items.length; markPalette(); } }
    else if (event.key === 'ArrowUp') { event.preventDefault(); if (pal.items.length) { pal.at = (pal.at - 1 + pal.items.length) % pal.items.length; markPalette(); } }
    else if (event.key === 'Home' && event.ctrlKey) { event.preventDefault(); pal.at = 0; markPalette(); }
    else if (event.key === 'Enter') { event.preventDefault(); choosePalette(event.metaKey || event.ctrlKey); }
    else if (event.key === 'Tab') event.preventDefault();
  }

  function choosePalette(withForm) {
    var item = pal && pal.items[pal.at];
    if (!item) return;
    closePalette();
    if (item.kind === 'tile') {
      var t = item.tile;
      if (withForm) { openForm(t.path, { values: t.lastParams || {} }); return; }
      if (!t.search) { quickRun(t); return; }
      // A job found by name: whether it can simply be run is asked of the app.
      api('launchPlan', { items: [{ path: t.path }] }).then(function (plan) {
        var it = (plan.items || [])[0];
        if (it && it.ok && it.ready && !(it.hasParams && (it.missing || []).length)) runJob(t.path, it.params && Object.keys(it.params).length ? it.params : undefined).then(loadLaunchpadSoon);
        else openForm(t.path, { values: (it && it.params) || {} });
      }, function () { openForm(t.path, {}); });
      return;
    }
    if (item.kind === 'hit') { openBuild(item.hit.path, item.hit.number); return; }
    if (item.kind === 'job') {
      if (item.row.kind === 'folder') openFolder(item.row.path); else openJob(item.row.path);
      if (!state.navInSidebar) reveal(item.row.kind === 'folder' ? item.row.path + '/x' : item.row.path);
      return;
    }
    var id = item.action.id;
    if (id === 'dashboard') go({ type: 'dashboard' });
    else if (id === 'queue') go({ type: 'queue' });
    else if (id === 'launches') go({ type: 'launches', path: '' });
    else if (id === 'launch') openPalette('launch');
    else if (id === 'wall') { go({ type: 'dashboard' }); setTimeout(openWall, 200); }
    else if (id === 'settings') openSetup(null);
    else if (id === 'refresh') loadEverything();
    else openSmart(id);
  }

  document.addEventListener('keydown', function (event) {
    var mod = event.metaKey || event.ctrlKey;
    // A dialog is closed by Escape wherever the focus has got to.
    if (event.key === 'Escape' && dlg && !pal) { event.preventDefault(); closeDialog(); return; }
    if (mod && event.shiftKey && (event.key === 'r' || event.key === 'R')) {
      event.preventDefault();
      if (pal) closePalette(); else openPalette('launch');
    } else if (mod && (event.key === 'k' || event.key === 'K')) {
      event.preventDefault();
      if (pal) closePalette(); else openPalette();
    } else if (mod && (event.key === 'f' || event.key === 'F') && state.page.type === 'build' && state.tab === 'log' && els.logSearch) {
      event.preventDefault();
      els.logSearch.focus();
      els.logSearch.select();
    }
  });

  host.on('jenkins', onEvent);
  host.on('showing', function (payload) {
    state.showing = !payload || payload.showing !== false;
    if (state.showing && state.started && state.server) refreshSoon();
  });
  /*
   * Nothing is asked of Jenkins until the app has said where this panel was:
   * starting first would draw the home page and then be told it had been on a
   * build, which is a flash at best and a lost place at worst.
   */
  /** Where the menu is: in the app's sidebar, or here down the left. Nothing is ever left without one. */
  function setChrome(inSidebar) {
    if (inSidebar === state.navInSidebar) return;
    state.navInSidebar = inSidebar;
    $('body').classList.toggle('nonav', inSidebar);
    if (inSidebar) { state.navOpen = false; $('body').classList.remove('nav'); }
    if (!state.started || !state.server) { if (state.started) drawBar(); return; }
    drawBar();
    if (!inSidebar) {
      // The tree was not kept up to date while it was hidden: it is read again from the top.
      state.nodes = {}; state.views = null;
      drawSide();
      loadEverything();
    }
  }
  host.on('chrome', function (payload) { setChrome(Boolean(payload && payload.navInSidebar)); });

  /**
   * The sidebar asked for a place: { server?, page: { type, path?, number?, kind?, name? } }.
   * A place that is not one this panel knows is ignored; one on another server
   * switches to it first. Before the panel has started it is only remembered.
   */
  function navigateTo(place) {
    var page = place && cleanPage(place.page);
    if (!page) return;
    var server = place && typeof place.server === 'string' ? place.server : null;
    if (!state.started) {
      // Not drawn yet, and the saved place has not been read: it must not be allowed to undo this.
      state.navPage = page;
      if (server) state.navServer = server;
      return;
    }
    if (server && server !== state.server && state.servers.some(function (one) { return one.id === server; })) {
      switchServer(server, page);
      if (page.type === 'setup') openSetup(null);
      else go(page);
      return;
    }
    if (page.type === 'setup') { openSetup(null); return; }
    go(page);
  }
  host.on('navigate', navigateTo);

  host.on('context', function (payload) {
    if (!state.started) resume(payload && payload.resume);
    if (payload && 'navInSidebar' in payload) setChrome(Boolean(payload.navInSidebar));
    if (payload && payload.showing === false) state.showing = false;
    start();
  });
  host.on('theme', function () { /* the app rebuilds the frame with the new tokens */ });
  host.ready();
  drawAll();
})();
</script>
