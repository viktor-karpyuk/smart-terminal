<style>
  /*
   * Jenkins, drawn in a frame that cannot reach the network or the disk.
   * Everything it knows arrives through `host.call('jenkins.*')` and everything
   * that changes arrives as a `jenkins` event — it never polls. What it looks
   * like comes from the app's tokens. The API token is kept by the app; nothing
   * in this document ever holds one.
   *
   * Every string that came from a server (a job's name, a commit message, a line
   * of a log) is put on the page with textContent. Nothing here builds markup
   * out of text, because the text belongs to other people.
   */
  html { font-size: 12px; }
  /* The app's faintest ink is for rules and marks: as text it is 2.9:1. Text that is meant to be read wears this, 4.9:1 and up on every surface in both themes. */
  :root { --ink3: color-mix(in srgb, var(--text-faint) 55%, var(--text)); }
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100%; min-height: 0; container-type: inline-size; }
  .top { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg-panel); min-height: 41px; min-width: 0; overflow-x: auto; scrollbar-width: none; ; flex-wrap: wrap; row-gap: 6px; }
  .top::-webkit-scrollbar { display: none; }
  .top > :not(.spacer) { flex: none; }
  .brand { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; margin-right: 4px; }
  .mark { display: inline-flex; flex: none; color: var(--accent); }
  .mark svg { display: block; }
  .hero { display: flex; align-items: center; gap: 14px; }
  .hero .mark { color: var(--accent); }
  .spacer { flex: 1; }
  .faint { color: var(--ink3); }
  .dim { color: var(--text-dim); }
  .ok { color: var(--ok); }
  .bad { color: var(--danger); }
  .warn { color: var(--warn, #d9a441); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; }
  .nowrap { white-space: nowrap; }

  #body { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 0; min-width: 0; width: 100%; }
  #body.solo { grid-template-columns: minmax(0, 1fr); }
  #side { display: flex; flex-direction: column; gap: 8px; min-height: 0; border-right: 1px solid var(--border); background: var(--bg-panel); padding: 10px 8px; }
  #tree { overflow: auto; min-height: 0; flex: 1; margin: 0 -2px; padding: 0 2px; }
  main#main { overflow: auto; min-height: 0; position: relative; }
  .navbtn { display: none; }
  #body.nonav { grid-template-columns: minmax(0, 1fr); }
  #body.nonav #side, #body.nonav .navbtn { display: none !important; }
  #body.nonav main#main { display: block !important; }
  table.lt td { vertical-align: middle; padding: 6px 10px; }
  table.lt tr.lr { cursor: pointer; }
  table.lt tr.lr:hover td { background: var(--bg-elevated); }
  table.lt tr.lr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.lt td.dc { width: 22px; padding-right: 0; } table.lt td.ac { width: 1%; white-space: nowrap; text-align: right; }
  table.lt td.lc { white-space: nowrap; } table.lt td.hc { width: 90px; }
  table.lt .star { opacity: 1; cursor: pointer; font-size: 1.1rem; }
  .hist.mini { height: 18px; gap: 2px; } .hist.mini i { width: 5px; cursor: default; }
  @container (max-width: 700px) {
    #body { grid-template-columns: minmax(0, 1fr); }
    #side { display: none; }
    #body.nav #side { display: flex; }
    #body.nav main#main { display: none; }
    .navbtn { display: inline-flex; }
    /* Room for the name first; the buttons go under it rather than squeezing it to nothing. */
    .line { flex-wrap: wrap; }
    .line .grow { flex: 1 1 calc(100% - 40px); }
  }

  .seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
  .seg button { flex: 1; white-space: nowrap; padding: 3px 8px; border-radius: calc(var(--radius, 8px) - 2px); color: var(--text-dim); }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--bg-elevated); color: var(--text); }

  .node { display: flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 6px; border-radius: calc(var(--radius, 8px) - 3px); cursor: pointer; color: var(--text); min-width: 0; }
  .node:hover { background: var(--bg-elevated); }
  .node.sel { background: var(--accent-soft); }
  .node .chev { width: 12px; flex: none; color: var(--ink3); text-align: center; font-size: 0.8rem; }
  .node .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .end { flex: none; color: var(--ink3); font-size: 0.9rem; }
  .node.head { cursor: default; color: var(--ink3); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 8px; }
  .node.head:hover { background: none; }
  .node .star { color: var(--ink3); padding: 0 2px; opacity: 0; }
  .node:hover .star, .node .star.on { opacity: 1; }
  .node .star.on { color: var(--warn, #d9a441); }
  .note { padding: 4px 8px; color: var(--ink3); font-size: 0.9rem; line-height: 1.45; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-faint); display: inline-block; }
  .dot.success { background: var(--ok); }
  .dot.failed { background: var(--danger); }
  .dot.unstable { background: var(--warn, #d9a441); }
  .dot.running, .dot.paused { background: var(--info, var(--accent)); }
  .dot.running { animation: pulse 1.4s ease-in-out infinite; }
  .dot.disabled, .dot.aborted, .dot.none, .dot.skipped { background: var(--text-faint); opacity: 0.6; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .glyph { font-family: ui-monospace, Menlo, monospace; width: 10px; flex: none; text-align: center; }
  .glyph.success { color: var(--ok); } .glyph.failed { color: var(--danger); } .glyph.unstable { color: var(--warn, #d9a441); }
  .glyph.running { color: var(--info, var(--accent)); } .glyph.aborted, .glyph.none { color: var(--ink3); }

  .page { padding: 14px 16px 40px; max-width: 1180px; display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 0; font-size: 1.333rem; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; min-width: 0; }
  h3 { margin: 0 0 6px; color: var(--ink3); font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }
  .lead { margin: 4px 0 0; color: var(--text-dim); line-height: 1.6; max-width: 76ch; }
  .crumbs { color: var(--ink3); display: flex; gap: 5px; flex-wrap: wrap; }
  .crumbs a { color: var(--text-dim); cursor: pointer; border-radius: 3px; }
  .crumbs a:hover { color: var(--text); text-decoration: underline; }

  .card { padding: 4px; border: 1px solid var(--border); border-radius: calc(var(--radius, 8px) + 2px); background: var(--bg-panel); }
  .card.pad { padding: 12px 14px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: calc(var(--radius, 8px) - 2px); min-width: 0; }
  .line:hover { background: var(--bg-elevated); }
  .line .grow { flex: 1; min-width: 0; }
  .line .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .t a, a.job { cursor: pointer; font-weight: 500; }
  .line .t a:hover, a.job:hover { text-decoration: underline; }
  .line .s { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cols { display: flex; gap: 12px; align-items: flex-start; }
  .cols > * { flex: 1 1 0; min-width: 0; }
  @container (max-width: 1100px) { .cols { flex-direction: column; } .cols > * { width: 100%; } }

  .btn { min-height: 26px; padding: 3px 11px; border: 1px solid var(--border-strong); border-radius: var(--radius); color: var(--text); background: transparent; font: inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--text-faint); background: var(--bg-elevated); }
  .btn.primary { color: var(--on-accent); border-color: var(--accent); background: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--text)); }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .btn.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: var(--accent-soft); }
  .btn.accent:hover { border-color: var(--accent); }
  .btn.small { min-height: 22px; padding: 1px 8px; }
  .btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-dim); white-space: nowrap; }
  .chip.okc { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .chip.badc { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .chip.warnc { color: var(--warn, #d9a441); border-color: color-mix(in srgb, var(--warn, #d9a441) 55%, var(--border)); background: color-mix(in srgb, var(--warn, #d9a441) 12%, transparent); }
  .chip.infoc { color: var(--info, var(--accent)); border-color: color-mix(in srgb, var(--info, var(--accent)) 55%, var(--border)); background: color-mix(in srgb, var(--info, var(--accent)) 12%, transparent); }

  label.field { display: flex; flex-direction: column; gap: 4px; }
  label.field > span { color: var(--ink3); font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }
  input[type="text"], input[type="password"], input[type="search"], select, textarea { min-height: 28px; padding: 5px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font: inherit; min-width: 0; }
  textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder { color: var(--ink3); }
  .check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .check input { width: 15px; height: 15px; accent-color: var(--accent); }
  .help { color: var(--ink3); line-height: 1.5; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

  .banner { padding: 9px 12px; border: 1px solid var(--border); border-left-width: 2px; border-radius: var(--radius, 8px); background: var(--bg-panel); line-height: 1.55; display: flex; gap: 10px; align-items: center; }
  .banner > .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .banner.good { border-left-color: var(--ok); }
  .banner.bad { border-left-color: var(--danger); }
  .banner.warn { border-left-color: var(--warn, #d9a441); }
  .empty { padding: 28px 18px; color: var(--ink3); text-align: center; line-height: 1.55; }
  .spin { color: var(--ink3); padding: 14px 4px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .prog { height: 4px; border-radius: 2px; background: var(--bg-elevated); overflow: hidden; position: relative; margin-top: 5px; }
  .prog b { position: absolute; top: 0; bottom: 0; width: 35%; background: var(--info, var(--accent)); border-radius: 2px; animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }

  .hist { display: flex; gap: 3px; align-items: flex-end; height: 28px; }
  .hist i { width: 8px; border-radius: 2px 2px 0 0; display: block; background: var(--text-faint); cursor: pointer; }
  .hist i.success { background: var(--ok); } .hist i.failed { background: var(--danger); } .hist i.unstable { background: var(--warn, #d9a441); }
  .hist i.running { background: var(--info, var(--accent)); animation: cellpulse 1.4s ease-in-out infinite; }

  .stages { display: flex; align-items: stretch; overflow-x: auto; }
  .stage { flex: 1 0 110px; padding: 7px 10px; border: 1px solid var(--border); border-right: 0; background: var(--bg-panel); }
  .stage:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .stage:last-child { border-right: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; }
  .stage.failed { background: color-mix(in srgb, var(--danger) 10%, var(--bg-panel)); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .stage small { display: block; color: var(--ink3); margin-top: 1px; }

  .tabs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .tab { padding: 4px 10px; border-radius: var(--radius); color: var(--text-dim); cursor: pointer; border: 1px solid transparent; background: transparent; font: inherit; }
  .tab:hover { color: var(--text); background: var(--bg-elevated); }
  .tab.on { color: var(--text); border-color: var(--border); background: var(--bg-elevated); }

  .log { position: relative; height: min(62vh, 640px); min-height: 220px; overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 0; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; line-height: 1.55; }
  .log .l { display: flex; padding: 0 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .log .l .ln { flex: none; width: 46px; padding-right: 10px; text-align: right; color: var(--ink3); user-select: none; -webkit-user-select: none; }
  .log .l.err { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .log .l.hit { background: color-mix(in srgb, var(--warn, #d9a441) 22%, transparent); }
  .log .l.cur { outline: 1px solid var(--warn, #d9a441); }
  .log .gap { padding: 2px 12px; color: var(--ink3); }
  .c31 { color: var(--danger); } .c32 { color: var(--ok); } .c33 { color: var(--warn, #d9a441); } .c34 { color: var(--info, var(--accent)); }
  .c35 { color: var(--violet, var(--accent)); } .c36 { color: var(--accent); } .c90 { color: var(--ink3); } .bold { font-weight: 700; }

  table.list { width: 100%; border-collapse: collapse; }
  table.list th { text-align: left; padding: 6px 10px; color: var(--ink3); font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.list td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  table.list tr:last-child td { border-bottom: 0; }

  .slots { display: flex; gap: 3px; margin-top: 6px; }
  .slots i { flex: 1; height: 6px; border-radius: 2px; background: var(--bg-elevated); max-width: 24px; }
  .slots i.u { background: var(--info, var(--accent)); }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .agent { padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-panel); }
  .agent.off { border-color: color-mix(in srgb, var(--warn, #d9a441) 50%, var(--border)); }
  .results { overflow: auto; min-height: 0; flex: 1; }

  /* keyboard focus: the tree, the tabs and the buttons all take it, and all show it */
  .node:focus-visible, .tab:focus-visible, .btn:focus-visible, .hist i:focus-visible, .seg button:focus-visible, a.job:focus-visible, .crumbs a:focus-visible, .star:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -2px; }
  .node.hit { background: var(--bg-elevated); }
  .node.cur { background: var(--accent-soft); }
  .prog.det b { position: static; display: block; width: 0; animation: none; transition: width 0.6s linear; }
  .desc { margin: 4px 0 0; color: var(--text-dim); line-height: 1.6; max-width: 76ch; white-space: pre-line; overflow-wrap: anywhere; }
  .desc.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .more { color: var(--accent); cursor: pointer; font-size: 0.95rem; }
  .runrow .stagename { color: var(--text-dim); }
  .bannerbtns { display: flex; gap: 6px; }
  .matrix { overflow-x: auto; border: 1px solid var(--border); border-radius: calc(var(--radius, 8px) + 2px); background: var(--bg-panel); }
  table.sm { border-collapse: separate; border-spacing: 0; width: 100%; min-width: max-content; }
  table.sm th { text-align: left; padding: 6px 10px; color: var(--text-dim); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: bottom; }
  table.sm th small { display: block; color: var(--ink3); font-weight: 400; }
  table.sm td, table.sm th.rh { padding: 3px; border-bottom: 1px solid var(--border); }
  table.sm tr:last-child td { border-bottom: 0; }
  table.sm .rh { position: sticky; left: 0; z-index: 1; background: var(--bg-panel); padding: 5px 10px; white-space: nowrap; border-right: 1px solid var(--border); text-align: left; font-weight: 400; cursor: pointer; }
  table.sm th.rh { vertical-align: middle; }
  table.sm .rh:hover { background: var(--bg-elevated); }
  td.sc { min-width: 92px; padding: 0; }
  td.sc > div { margin: 0; padding: 5px 8px; min-height: 34px; border-radius: calc(var(--radius, 8px) - 3px); cursor: pointer; }
  td.sc > div:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.sc > div:hover { filter: brightness(1.15); }
  td.sc.success > div { background: color-mix(in srgb, var(--ok) 16%, transparent); }
  td.sc.failed > div { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
  td.sc.unstable > div { background: color-mix(in srgb, var(--warn, #d9a441) 20%, transparent); }
  td.sc.aborted > div { background: color-mix(in srgb, var(--text-faint) 18%, transparent); }
  td.sc.running > div { background: color-mix(in srgb, var(--info, var(--accent)) 20%, transparent); animation: cellpulse 1.4s ease-in-out infinite; }
  td.sc.paused > div { background: color-mix(in srgb, var(--accent) 24%, transparent); outline: 1px dashed var(--accent); }
  td.sc.skipped > div { color: var(--ink3); background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--text-faint) 14%, transparent) 5px 6px); }
  td.sc.none > div { color: var(--ink3); cursor: default; }
  @keyframes cellpulse { 50% { opacity: 0.6; } }
  td.sc .slow { color: var(--warn, #d9a441); }
  td.sc .br { display: flex; gap: 5px; align-items: center; font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; white-space: nowrap; }
  .stage { position: relative; }
  .stage .sname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage .sbar { height: 3px; border-radius: 2px; background: var(--bg-elevated); margin-top: 5px; overflow: hidden; }
  .stage .sbar b { display: block; height: 100%; background: var(--ok); }
  .stage.failed .sbar b { background: var(--danger); } .stage.unstable .sbar b { background: var(--warn, #d9a441); }
  .stage.running { border-color: color-mix(in srgb, var(--info, var(--accent)) 55%, var(--border)); background: color-mix(in srgb, var(--info, var(--accent)) 8%, var(--bg-panel)); }
  .stage.running .sbar b { background: var(--info, var(--accent)); animation: cellpulse 1.4s ease-in-out infinite; }
  .stage-group { flex: 1 0 140px; display: flex; flex-direction: column; border: 1px solid var(--border); border-right: 0; background: var(--bg-panel); }
  .stage-group .stage { flex: 1; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; }
  .stage-group .stage:last-child { border-bottom: 0; }
  .stages > .stage-group:first-child { border-radius: var(--radius) 0 0 var(--radius); overflow: hidden; }
  .stages > .stage-group:last-child { border-right: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; overflow: hidden; }
  .stage.paused { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg-panel)); }
  .stage.skipped { opacity: 1; color: var(--ink3); background: repeating-linear-gradient(135deg, var(--bg-panel) 0 6px, color-mix(in srgb, var(--text-faint) 10%, var(--bg-panel)) 6px 7px); }
  .stage .br { font-size: 0.85rem; color: var(--text-dim); margin-top: 3px; display: flex; gap: 5px; align-items: center; }
  pre.example { margin: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  /* the dashboard */
  .dash { max-width: 1240px; }
  .dash.loading .dash-body { opacity: 0.6; transition: opacity 0.15s; }
  .dnotes { max-width: 100ch; }
  .dsec { margin-top: 6px; scroll-margin-top: 8px; }
  .dsec-head h3 { margin: 0; outline: none; }
  .dsec-head h3:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .dsec-head .faint { font-size: 0.95rem; }
  .xcard { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-left: 2px solid var(--danger); border-radius: var(--radius, 8px); background: var(--bg-panel); }
  .xcard.info { border-left-color: var(--accent); }
  .xcard.warn { border-left-color: var(--warn, #d9a441); }
  .xcard h4 { margin: 0; font-size: 1rem; font-weight: 600; }
  .xcard .xrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .xcard .xerr { margin-top: 4px; color: var(--text); overflow-wrap: anywhere; }

  function explainError(message) {
    var m = String(message == null ? '' : message);
    if (/ERR_CONNECTION_REFUSED|ECONNREFUSED/.test(m)) return 'Nothing answered at that address. Is Jenkins running, and is the port right?';
    if (/ERR_NAME_NOT_RESOLVED|ENOTFOUND/.test(m)) return 'That host name was not found. Check the spelling, or whether you need the VPN.';
    if (/ERR_CERT|CERT_|SELF_SIGNED|UNABLE_TO_VERIFY/.test(m)) return 'The certificate of that server is not trusted, so the connection was refused. A self-signed certificate has to be trusted by the system first.';
    if (/ERR_SSL|SSL_/.test(m)) return 'The secure connection failed. If this Jenkins is plain http, start the address with http://.';
    if (/ERR_CONNECTION_TIMED_OUT|ETIMEDOUT|did not answer within/.test(m)) return 'Jenkins took too long to answer. It may be down or behind a VPN you are not on.';
    if (/ERR_UNSAFE_PORT/.test(m)) return 'The app will not talk to that port. Use the one Jenkins is served on.';
    if (/ERR_INTERNET_DISCONNECTED|ERR_NETWORK_CHANGED/.test(m)) return 'This computer has no network right now.';
    if (/has nothing there/.test(m)) return 'Jenkins is not at that address. If it is served under a path such as /jenkins, include it.';
    return m;
  }
  function word(status) {
    return { success: 'passed', failed: 'failed', unstable: 'unstable', running: 'running', aborted: 'aborted', none: 'not built', disabled: 'disabled' }[status] || String(status || '');
  }
  function chipFor(status) {
    var cls = { success: 'okc', failed: 'badc', unstable: 'warnc', running: 'infoc' }[status] || '';
    return h('span', { class: 'chip ' + cls, text: word(status) });
  }
  function dot(status) { return h('span', { class: 'dot ' + (status || 'none') }); }
  function shown(row) { return row && row.running ? 'running' : (row && row.status) || 'none'; }
  function slot(path) { return String(path || '').split('/'); }

  /* ---------------------------------------------------------------- remember */

  /** Where this panel is, kept by the app across a rebuilt frame. Navigation only: never what Jenkins said. */
  /** The values typed into run forms, kept for next time — without anything whose name says it is a secret, and for the most recent jobs only. */
  function rememberableParams(all) {
    var out = {};
    Object.keys(all || {}).slice(-200).forEach(function (key) {
      var kept = {};
      Object.keys(all[key] || {}).forEach(function (name) { if (!/pass|secret|token|key|credential/i.test(name)) kept[name] = all[key][name]; });
      out[key] = kept;
    });
    return out;
  }

  function remember() {
    host.emit('remember', {
      server: state.server,
      mode: state.mode,
      open: Object.keys(state.open).filter(function (key) { return state.open[key]; }),
      // Only what a page is made of: the app's sidebar lights its row from this, and keeps nothing else.
      page: cleanPage(state.page) || { type: 'dashboard' },
      lastParams: rememberableParams(state.lastParams),
      dashRange: state.dash.range,
      dashScope: scopeArgs(state.dash.scope),
      dashMuted: Object.keys(state.dash.muted).slice(0, 200),
      dashHeat: state.dash.heatDays,
      dashCollapsed: state.dash.collapsed
    });
  }

  function resume(saved) {
    if (!saved || typeof saved !== 'object') return;
    if (saved.mode === 'tree' || saved.mode === 'views') state.mode = saved.mode;
    if (Array.isArray(saved.open)) saved.open.forEach(function (key) { state.open[key] = true; });
    var page = cleanPage(saved.page);
    if (page) state.page = page;
    if (saved.lastParams && typeof saved.lastParams === 'object') state.lastParams = saved.lastParams;
    if (RANGES.some(function (r) { return r.key === saved.dashRange; })) state.dash.range = saved.dashRange;
    if (saved.dashScope && typeof saved.dashScope === 'object') state.dash.scope = scopeArgs(saved.dashScope);
    if (Array.isArray(saved.dashMuted)) saved.dashMuted.forEach(function (id) { if (typeof id === 'string' && id.length < 200) state.dash.muted[id] = true; });
    if ([7, 14, 30, 90].indexOf(saved.dashHeat) >= 0) state.dash.heatDays = saved.dashHeat;
    if (saved.dashCollapsed && typeof saved.dashCollapsed === 'object') Object.keys(saved.dashCollapsed).slice(0, 30).forEach(function (k) { if (typeof saved.dashCollapsed[k] === 'boolean') state.dash.collapsed[k] = saved.dashCollapsed[k]; });
    state.wantedServer = saved.server || null;
  }

  /* ------------------------------------------------------------- navigation */

  function go(page) {
    closeLog();
    state.page = page;
    state.navOpen = false;
    state.job = null; state.jobError = null; state.form = null; state.stages = null;
    state.build = null; state.buildError = null; state.tab = 'log'; state.buildStages = null;
    state.list = null; state.listFilter = ''; state.listLimit = LIST_CHUNK;
    state.bx = null; state.why = null; state.presets = null; state.queueWhy = {}; closeDialog();
    state.dash.zoom = null; state.dash.fullRange = false; state.plan = null;
    remember();
    drawAll();
    dashHeartbeat(page.type === 'dashboard');
    if (page.type === 'dashboard') loadDashboard();
    else if (page.type === 'folder' || page.type === 'view') loadListing();
    else if (page.type === 'job') loadJob();
    else if (page.type === 'build') loadBuild(true);
    else if (page.type === 'queue') loadQueue();
    else if (page.type === 'launches') loadLaunches(false);
  }

  function openJob(path) { go({ type: 'job', path: path }); }
  function openFolder(path) { go({ type: 'folder', path: path }); }
  function openSmart(name) { go({ type: 'view', kind: 'smart', name: name }); }
  function openBuild(path, number) { go({ type: 'build', path: path, number: number }); }

  /** The folders above a path, opened one after another, so a search hit can be found in the tree. */
  function reveal(path) {
    var parts = slot(path);
    state.mode = 'tree';
    var chain = [];
    for (var i = 0; i < parts.length - 1; i += 1) chain.push('f:' + parts.slice(0, i + 1).join('/'));
    state.open.root = true;
    chain.forEach(function (key) { state.open[key] = true; });
    return chain.reduce(function (before, key) {
      return before.then(function () { return loadNode(key); });
    }, loadNode('root')).then(function () { remember(); drawSide(); });
  }

  /* ------------------------------------------------------------------- load */

  function overview() {
    return call('overview').then(function (data) {
      state.servers = data.servers || [];
      state.follows = data.follows || [];
      state.favorites = data.favorites || {};
      state.servers.forEach(function (one) { if (one.health) state.health[one.id] = one.health; });
      return data;
    });
  }

  function start() {
    if (state.started) return;
    state.started = true;
    overview().then(function () {
      state.loading = false;
      if (!state.servers.length) {
        state.page = { type: 'setup' };
        drawAll();
        return;
      }
      // Where the sidebar sent the panel wins over where it was last: it is what the person just did.
      var wanted = state.servers.filter(function (one) { return one.id === (state.navServer || state.wantedServer); })[0];
      state.server = (wanted || state.servers[0]).id;
      if (state.navPage) { state.page = state.navPage; state.navPage = null; }
      state.navServer = null;
      if (state.page.type === 'setup') state.page = { type: 'dashboard' };
      drawAll();
      loadEverything();
    }, function (error) {
      state.loading = false;
      state.error = error.message;
      drawAll();
    });
  }

  /** Everything the current server needs, in the order it is looked at. */
  function loadEverything() {
    var page = state.page;
    keepWatching();
    if (page.type === 'job') loadJob();
    else if (page.type === 'build') loadBuild(true);
    else if (page.type === 'queue') loadQueue();
    else if (page.type === 'launches') loadLaunches(false);
    else if (page.type === 'folder' || page.type === 'view') loadListing();
    else if (page.type === 'dashboard') { dashHeartbeat(true); loadDashboard(); }
    // With the menu in the app's sidebar this panel has no tree to fill.
    if (state.navInSidebar) return;
    if (state.mode === 'tree') {
      state.open.root = true;
      Object.keys(state.open).forEach(function (key) { if (state.open[key]) loadNode(key); });
    } else {
      loadViews();
      Object.keys(state.open).forEach(function (key) { if (state.open[key] && key !== 'root') loadNode(key); });
    }
  }

  /** A failure that says the server is not there, as opposed to one that says this user may not look. */
  function isOutage(message) {
    return /Could not reach|did not answer|ERR_|ECONN|ENOTFOUND|timed out/i.test(String(message || ''));
  }

  function loadHome() {
    var epoch = state.epoch;
    state.homeError = null;
    return api('home').then(function (data) {
      if (epoch !== state.epoch) return;
      state.home = data;
      state.health[state.server] = { ok: true, error: null };
      if (state.page.type === 'dashboard' && els.dashView && state.dash.data) drawDashboardBody();
      drawBar();
      drawSide();
    }, function (error) {
      if (epoch !== state.epoch) return;
      state.homeError = error.message;
      state.health[state.server] = { ok: false, error: error.message };
      drawBar();
      if (state.page.type === 'dashboard' && els.dashView && state.dash.data) drawDashboardBody();
      watchRecovery();
    });
  }

  function loadJob() {
    var path = state.page.path;
    var epoch = state.epoch;
    state.jobError = null;
    return api('job', { path: path }).then(function (job) {
      if (epoch !== state.epoch || state.page.type !== 'job' || state.page.path !== path) return;
      state.job = job;
      if (!applyFormWant(job) && !state.form) state.form = { open: false, values: {}, loaded: false };
      if (state.form && state.form.open) loadPlan(job);
      drawMain();
      loadStages(path);
      loadJobExtras(job);
      if (job.inQueue) {
        api('queue').then(function (data) {
          if (epoch !== state.epoch || state.page.type !== 'job' || state.page.path !== path) return;
          state.jobQueue = { path: path, items: (data.items || []).filter(function (item) { return item.path === path; }) };
          if (!typing()) drawMain();
        }, function () { /* the banner stands without its button */ });
      } else state.jobQueue = null;
    }, function (error) {
      if (epoch !== state.epoch || state.page.type !== 'job' || state.page.path !== path) return;
      state.jobError = error.message;
      drawMain();
    });
  }

  /** What the last runs of a pipeline did, stage by stage. Its absence is not an error: not every job is a pipeline. */
  function loadStages(path) {
    var epoch = state.epoch;
    var count = state.stageCount;
    if (!state.stages || state.stages.path !== path) state.stages = { path: path, data: null, loading: true, error: null };
    return api('stages', { path: path, count: count }).then(function (data) {
      if (epoch !== state.epoch || !state.stages || state.stages.path !== path || state.stageCount !== count) return;
      state.stages = { path: path, data: data, loading: false, error: null };
      if (state.page.type === 'job' && !typing()) drawMain();
    }, function (error) {
      if (epoch !== state.epoch || !state.stages || state.stages.path !== path) return;
      state.stages = { path: path, data: null, loading: false, error: error.message };
      if (state.page.type === 'job' && !typing()) drawMain();
    });
  }

  function loadQueue() {
    var epoch = state.epoch;
    state.queueError = null;
    return Promise.all([api('queue'), api('agents')]).then(function (all) {
      if (epoch !== state.epoch) return;
      state.queue = { items: all[0].items || [], agents: all[1].agents || [] };
      if (state.page.type === 'queue') drawMain();
    }, function (error) {
      if (epoch !== state.epoch) return;
      state.queueError = error.message;
      if (state.page.type === 'queue') drawMain();
    });
  }

  /** The jobs a list page is about: a folder's children, a smart view's, or a Jenkins view's. */
  function loadListing() {
    var page = state.page;
    var epoch = state.epoch;
    var key = listKey(page);
    if (!state.list || state.list.key !== key) state.list = { key: key, rows: null, loading: true, error: null };
    var ask;
    if (page.type === 'folder') ask = api('tree', { path: page.path });
    else if (page.kind === 'smart') ask = api('smart', { kind: page.name });
    else ask = api('viewJobs', { path: page.path });
    return ask.then(function (data) {
      if (epoch !== state.epoch || !state.list || state.list.key !== key) return;
      state.list = { key: key, rows: data.rows || [], total: typeof data.total === 'number' ? data.total : null, loading: false, error: null };
      state.health[state.server] = { ok: true, error: null };
      if (state.page.type === 'folder' || state.page.type === 'view') { drawListBody(); loadHistories(state.list.rows); }
    }, function (error) {
      if (epoch !== state.epoch || !state.list || state.list.key !== key) return;
      state.list = { key: key, rows: state.list.rows, loading: false, error: error.message };
      if (isOutage(error.message)) { state.health[state.server] = { ok: false, error: error.message }; drawBar(); watchRecovery(); }
      if (state.page.type === 'folder' || state.page.type === 'view') drawListBody();
    });
  }

  /**
   * The last ten builds of each job in a list, which the list's own call does
   * not carry. Only the first thirty jobs are asked about, a few at a time, and
   * each answer is drawn into its own cell: a folder of three hundred jobs is
   * not three hundred requests, and the table does not wait for any of them.
   */
  function loadHistories(rows) {
    var epoch = state.epoch;
    var wanted = rows.filter(function (row) { return row.kind === 'job' && !state.rowHistory[state.server + '|' + row.path]; }).slice(0, 30);
    var next = 0;
    function worker() {
      if (next >= wanted.length) return;
      var row = wanted[next];
      next += 1;
      var key = state.server + '|' + row.path;
      state.rowHistory[key] = { pending: true };
      api('job', { path: row.path }).then(function (job) {
        if (epoch !== state.epoch) { delete state.rowHistory[key]; return; }
        state.rowHistory[key] = { builds: (job.builds || []).slice(0, 10) };
        var cell = (els.listCells || {})[row.path];
        if (cell && cell.isConnected) replace(cell, miniBars(state.rowHistory[key].builds));
      }, function () { delete state.rowHistory[key]; }).then(worker, worker);
    }
    for (var i = 0; i < 4; i += 1) worker();
  }

  function loadViews() {
    if (state.views && (state.views.data || state.views.loading)) return Promise.resolve();
    var epoch = state.epoch;
    state.views = { loading: true, data: null, error: null };
    drawSide();
    return api('views').then(function (data) {
      if (epoch !== state.epoch) return;
      state.views = { loading: false, data: data, error: null };
      drawSide();
    }, function (error) {
      if (epoch !== state.epoch) return;
      state.views = { loading: false, data: null, error: error.message };
      drawSide();
    });
  }

  /** What a tree node holds, asked for the first time it opens and again whenever something changed. */
  function loadNode(key) {
    var epoch = state.epoch;
    var node = state.nodes[key] || (state.nodes[key] = { rows: null, loading: false, error: null });
    node.loading = !node.rows;
    node.error = null;
    var kind = key.slice(0, 2);
    var path = key.slice(2);
    var ask;
    if (key === 'root') ask = api('tree', { path: '' }).then(function (data) { return data.rows || []; });
    else if (kind === 'f:') ask = api('tree', { path: path }).then(function (data) { return data.rows || []; });
    else if (kind === 'j:') ask = api('job', { path: path }).then(function (job) { return (job.builds || []).slice(0, 8).map(function (b) { return assign({ leaf: true, path: job.path }, b); }); });
    else if (kind === 'v:') ask = api('viewJobs', { path: path }).then(function (data) { return data.rows || []; });
    else if (kind === 's:') ask = api('smart', { kind: path }).then(function (data) { return data.rows || []; });
    else return Promise.resolve();
    if (node.loading) drawSide();
    return ask.then(function (rows) {
      if (epoch !== state.epoch) return;
      node.rows = rows; node.loading = false; drawSide();
    }, function (error) {
      if (epoch !== state.epoch) return;
      node.loading = false; node.error = error.message; drawSide();
    });
  }

  function toggle(key) {
    if (state.open[key]) delete state.open[key];
    else {
      state.open[key] = true;
      if (!state.nodes[key] || !state.nodes[key].rows) loadNode(key);
    }
    remember();
    drawSide();
  }

  /** Something changed on the server: read again what is on screen, and only that. */
  function refreshSoon() {
    if (timers.refresh) return;
    // Events can come every few hundred milliseconds; what is on screen is read at most every three seconds.
    var wait = Math.max(400, 3000 - (Date.now() - (timers.lastRefresh || 0)));
    timers.refresh = setTimeout(function () {
      timers.refresh = null;
      timers.lastRefresh = Date.now();
      if (!state.server || !state.showing) return;
      if (!state.navInSidebar) Object.keys(state.open).forEach(function (key) { if (state.open[key] && state.nodes[key] && state.nodes[key].rows) loadNode(key); });
      var type = state.page.type;
      if (type === 'dashboard') loadDashboard(true);
      else if (type === 'folder' || type === 'view') loadListing();
      else if (type === 'queue') loadQueue();
      else if (type === 'job' && !typing()) loadJob();
      else if (type === 'build') loadBuild(false);
    }, wait);
  }

  /** A form being typed into is left alone: rebuilding it under the cursor is worse than a stale dot. */
  function typing() {
    var active = document.activeElement;
    return Boolean(active && active.closest && active.closest('[data-form]'));
  }

  /* -------------------------------------------------------------- the build */

  function loadBuild(first) {
    var page = state.page;
    var epoch = state.epoch;
    if (page.type !== 'build') return Promise.resolve();
    state.buildError = null;
    return api('build', { path: page.path, number: page.number }).then(function (build) {
      if (state.page.type !== 'build' || state.page.number !== page.number || state.page.path !== page.path) return;
      var wasRunning = state.build && state.build.running;
      state.build = build;
      if (first) {
        startLog(build);
        // Averages for the stage strip: what each stage usually takes, so the slow one stands out. A bonus, never a blocker.
        api('stages', { path: page.path, count: 10 }).then(function (data) {
          if (epoch !== state.epoch || state.page.type !== 'build' || state.page.path !== page.path) return;
          state.buildStages = { path: page.path, data: data };
          drawBuildHead();
        }, function () { /* the strip is fine without averages */ });
      }
      drawBuildHead();
      loadBuildExtras(build, Boolean(first), wasRunning);
      if (wasRunning && !build.running) say(page.path + ' #' + page.number + ' ' + word(build.status));
    }, function (error) {
      if (state.page.type !== 'build') return;
      state.buildError = error.message;
      drawMain();
    });
  }

  function closeLog() {
    if (state.log && state.log.id) {
      if (state.log.renew) clearInterval(state.log.renew);
      call('stopLog', { id: state.log.id }).then(null, function () { /* already over */ });
    }
    state.log = null;
  }

  function startLog(build) {
    closeLog();
    logSeq += 1;
    var log = {
      id: 'log-' + logSeq, n: 0, carry: '', lines: [], queue: [], draining: false, follow: true, query: '', hits: [], at: -1,
      firstError: null, trimmed: 0, started: false, ended: false, finishing: false, fg: null, bold: false, truncated: false, top: 0,
      note: null, local: Boolean(build.source === 'local' || build.gone || build.offline), wantStage: state.jumpStage, box: h('div', { class: 'log', tabindex: '0', role: 'log', 'aria-label': 'Console output' })
    };
    state.jumpStage = null;
    log.box.addEventListener('scroll', function () {
      log.top = log.box.scrollTop;
      var away = log.box.scrollHeight - log.box.scrollTop - log.box.clientHeight > 40;
      if (away === log.follow) { log.follow = !away; drawLogBar(); }
    });
    state.log = log;
    replace(log.box, h('div', { class: 'gap', text: 'Reading the console…' }));
    /*
     * The console is followed on a lease: the app lets go of it by itself if it
     * is not asked again within 90 seconds, so a panel that is closed, crashed
     * or never got to say stopLog cannot leave a console being read for hours.
     * While this one is open it asks again every 30.
     */
    var follow = function () { return api('followLog', { id: log.id, path: build.path, number: build.number, lease: 90 }); };
    follow().then(null, function (error) {
      replace(log.box, h('div', { class: 'gap bad', text: explainError(error.message) }));
    });
    log.renew = setInterval(function () {
      if (state.log !== log || log.ended) { clearInterval(log.renew); return; }
      // Hidden, nobody is reading it: the lease is left to run out, and renewed when the panel is shown again.
      if (!state.showing) return;
      follow().then(null, function () { /* the next one tries again; the log says if it ended */ });
    }, 30000);
    drawMain();
  }

  /*
   * What a terminal colours with, reduced to what this panel draws: the eight
   * Jenkins uses, their bright twins as the same colour, and bold. Everything
   * else — backgrounds, 256 and true colour — is read past without being
   * mistaken for a colour: `38;2;31;32;33` is one colour made of five numbers,
   * and taking each number for a code painted it red.
   */
  function applySgr(st, params) {
    var codes = (params || '0').split(';');
    for (var i = 0; i < codes.length; i += 1) {
      var n = codes[i] === '' ? 0 : Number(codes[i]);
      if (n === 38 || n === 48) {
        i += codes[i + 1] === '5' ? 2 : codes[i + 1] === '2' ? 4 : 0;
      } else if (n === 0) { st.fg = null; st.bold = false; }
      else if (n === 1) st.bold = true;
      else if (n === 22) st.bold = false;
      else if (n === 39) st.fg = null;
      else if (n >= 31 && n <= 36) st.fg = n;
      else if (n >= 91 && n <= 96) st.fg = n - 60;
      else if (n === 90) st.fg = 90;
    }
  }

  /** A line cut into pieces that share a colour: [{ text, fg, bold }]. `st` carries the colour from line to line. */
  function ansiSegments(text, st) {
    var pattern = /\u001b\[([0-9;]*)m/g;
    var at = 0;
    var found;
    var out = [];
    function put(piece) { if (piece) out.push({ text: piece, fg: st.fg, bold: st.bold }); }
    while ((found = pattern.exec(text))) {
      put(text.slice(at, found.index));
      at = found.index + found[0].length;
      applySgr(st, found[1]);
    }
    put(text.slice(at));
    return out;
  }

  function ansiInto(parent, text, st) {
    ansiSegments(text, st).forEach(function (one) {
      parent.appendChild(h('span', { text: one.text, class: (one.fg ? 'c' + one.fg : '') + (one.bold ? ' bold' : '') }));
    });
  }

  /** Cursor movement and window titles mean nothing in a list of lines. Colours are kept. */
  function cleanLogText(text) {
    return String(text)
      .replace(/\u001b\][^\u0007\u001b]*(?:\u0007|\u001b\\)/g, '')
      .replace(/\u001b\[[0-9;?]*[A-Za-ln-z]/g, '');
  }

  /** A line the way a terminal ends up showing it: what a `\r` returned to the start of is overwritten. */
  function foldReturns(line) {
    if (line.indexOf('\r') < 0) return line;
    var pieces = line.split('\r');
    for (var i = pieces.length - 1; i >= 0; i -= 1) if (pieces[i] !== '') return pieces[i];
    return '';
  }

  /**
   * New text from the console, joined to what was left over from the last
   * piece: the lines that are complete, and the rest to carry. A progress bar
   * that rewrites itself with `\r` is one line, not two hundred, and a `\r`
   * at the very end of a piece may be the first half of a `\r\n`.
   */

    return Object.keys(count).sort(function (a, b) { return (count[b] - count[a]) || (a < b ? -1 : 1); }).map(function (path) { return { path: path, runs: count[path] }; });
  }

  /** How long a window is, in the words of the person reading it. */
  function spanWords(ms) {
    var minutes = Math.round(ms / 60000);
    if (ms < 90000) return Math.max(1, Math.round(ms / 1000)) + ' s';
    if (minutes < 90) return minutes + ' min';
    var hours = ms / 3600000;
    if (hours < 36) return (hours < 10 ? Math.round(hours * 10) / 10 : Math.round(hours)) + ' h';
    return Math.round(hours / 24 * 10) / 10 + ' days';
  }

  /** What the quick-open offers besides jobs: where to go, in the words a person would type. */
  var PALETTE_ACTIONS = [
    { id: 'dashboard', label: 'Dashboard', hint: 'What needs you, what is running, and how it has been going', words: 'dashboard home needs overview statistics running time travel favorites' },
    { id: 'launch', label: 'Launch a job…', hint: 'Type a name and start it', words: 'launch run start deploy' },
    { id: 'wall', label: 'Wallboard', hint: 'A full-window view for a screen on the wall', words: 'wallboard wall tv screen display' },
    { id: 'launches', label: 'Launch history', hint: 'What was started from here, and again', words: 'launches history launched batches scheduled' },
    { id: 'queue', label: 'Queue & agents', hint: 'What is waiting and who can run it', words: 'queue agents nodes executors waiting' },
    { id: 'failing', label: 'Failing jobs', hint: 'Every job whose last build failed', words: 'failing failed broken red' },
    { id: 'running', label: 'Running builds', hint: 'Jobs building right now', words: 'running building active' },
    { id: 'unstable', label: 'Unstable jobs', hint: 'Passed with test failures', words: 'unstable yellow' },
    { id: 'stale', label: 'Stale jobs', hint: 'Not built for a month', words: 'stale old unused' },
    { id: 'disabled', label: 'Disabled jobs', hint: 'Switched off in Jenkins', words: 'disabled off' },
    { id: 'settings', label: 'Servers and settings', hint: 'Connect, edit or remove a Jenkins', words: 'settings servers setup connect token history archive import export' },
    { id: 'refresh', label: 'Read Jenkins again', hint: 'Refresh everything on this page', words: 'refresh reload again' }
  ];

  /** The actions that match what was typed: every word of it must start a word of the action; the label's own start ranks first. */
  function paletteActions(query) {
    var words = String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
    var out = [];
    PALETTE_ACTIONS.forEach(function (action, order) {
      var label = action.label.toLowerCase();
      var hay = (label + ' ' + action.words).split(/[^a-z0-9]+/).filter(Boolean);
      var every = words.every(function (w) { return hay.some(function (h) { return h.indexOf(w) === 0; }); });
      if (!every) return;
      out.push({ action: action, rank: words.length && label.indexOf(words[0]) === 0 ? 0 : 1, order: order });
    });
    out.sort(function (a, b) { return a.rank - b.rank || a.order - b.order; });
    return out.map(function (one) { return one.action; });
  }

  /**
   * Type-ahead in a list: where the cursor goes for what has been typed. Typing one
   * letter over and over walks the names that start with it; typing "tea" goes to
   * the first name that starts with "tea", looking from the row it is on.
   */
  function typeAheadFrom(labels, at, typed) {
    var text = String(typed || '').toLowerCase();
    if (!text || !labels.length) return -1;
    var same = text.split('').every(function (c) { return c === text[0]; });
    var needle = same ? text[0] : text;
    var begin = same ? at + 1 : Math.max(at, 0);
    for (var i = 0; i < labels.length; i += 1) {
      var k = (begin + i) % labels.length;
      if (String(labels[k] || '').toLowerCase().indexOf(needle) === 0) return k;
    }
    return -1;
  }

  /**
   * How a number moved against the period before it. The sign and the arrow
   * carry the direction, the words name what it is compared with, and `tone`
   * says whether the move is good — which depends on the number: more failures
   * is bad, a higher success rate is good.
   */
  function deltaOf(now, before, higherIsBetter, unit) {
    if (before === null || before === undefined || now === null || now === undefined || !isFinite(now) || !isFinite(before)) return null;
    var diff = now - before;
    if (Math.abs(diff) < 1e-9) return { arrow: '→', text: 'same as before', tone: 'flat' };
    var up = diff > 0;
    var size = unit === 'pp' ? (Math.round(Math.abs(diff) * 1000) / 10) + ' pp' : unit === 'ms' ? dur(Math.abs(diff)) : compact(Math.abs(diff));
    return { arrow: up ? '▲' : '▼', text: (up ? '+' : '−') + size, tone: (up === higherIsBetter) ? 'good' : 'bad' };
  }
  function ratePct(rate) {
    if (rate === null || rate === undefined || !isFinite(rate)) return '—';
    var pct = rate * 100;
    if (pct >= 99.95) return '100%';
    // Just short of perfect is said as such: 99.94 rounded to the whole is a hundred it did not reach.
    if (pct >= 99) return (Math.floor(pct * 10) / 10).toFixed(1) + '%';
    return (pct >= 10 ? pct.toFixed(0) : pct.toFixed(1)) + '%';
  }
  /** At most `n` points, each the largest of the ones it stands for: a sparkline of a busy hour must not lose the peak. */
  function downsample(values, n) {
    var list = values || [];
    if (list.length <= n) return list.slice();
    var out = [];
    for (var i = 0; i < n; i += 1) {
      var from = Math.floor((i * list.length) / n);
      var to = Math.max(from + 1, Math.floor(((i + 1) * list.length) / n));
      out.push(Math.max.apply(null, list.slice(from, to)));
    }
    return out;
  }
  /** Where the time cursor goes when a key moves it: one bucket, a tenth of the range with Shift, or an end. Clamped to what is on the chart. */
  function stepCursor(at, from, to, bucketMs, direction, big) {
    var step = big ? Math.max(bucketMs, Math.round((to - from) / 10)) : Math.max(1000, bucketMs);
    return Math.max(from, Math.min(to, at + direction * step));
  }
  /** A cell's strength, 0 (none) to 4, against the busiest. Zero is its own level: "nothing" is not "a little". */
  function heatLevel(value, max) {
    if (!(value > 0) || !(max > 0)) return 0;
    return Math.max(1, Math.min(4, Math.ceil((value / max) * 4)));
  }
  /** A run that has taken more than twice what it usually does is worth a look. */
  function isStuck(elapsed, estimated) {
    return estimated > 0 && elapsed > estimated * 2;
  }
  /** What fraction of an interval a position on a scale is, clamped. */
  function fractionOf(at, from, to) {
    return to > from ? Math.max(0, Math.min(1, (at - from) / (to - from))) : 0;
  }
  /** A pasted address that is a page inside Jenkins rather than Jenkins itself. */
  function urlHint(url) {
    var text = String(url || '');
    if (/\/(job|view|computer|manage|login|user|people)(\/|$|\?)/i.test(text)) return 'That looks like a page inside Jenkins. Use the address of Jenkins itself — the part before /job/, /view/ or /login.';
    return '';
  }

  /** Lines drawn into the console, all at once, and the oldest let go when there are more than are worth keeping. */
  function renderLines(log, raws) {
    var fragment = document.createDocumentFragment();
    raws.forEach(function (raw) {
      log.n += 1;
      var line = h('div', { class: 'l' });
      var body = h('span', { class: 'tx' });
      ansiInto(body, raw, log);
      // Counted from where the loaded part begins, a number would disagree with the console's own: it is left blank.
      line.appendChild(h('span', { class: 'ln', 'aria-hidden': 'true', text: log.truncated ? '' : log.n }));
      line.appendChild(body);
      var plain = body.textContent;
      if (ERROR_LINE.test(plain)) {
        line.classList.add('err');
        if (!log.firstError) log.firstError = line;
      }
      if (log.query && plain.toLowerCase().indexOf(log.query) >= 0) { line.classList.add('hit'); log.hits.push(line); }
      log.lines.push({ el: line, text: plain });
      fragment.appendChild(line);
    });
    log.box.appendChild(fragment);
    var excess = log.lines.length - LOG_LINES;
    if (excess > 0) {
      log.lines.splice(0, excess).forEach(function (gone) {
        if (gone.el === log.firstError) log.firstError = null;
        gone.el.remove();
      });
      log.trimmed += excess;
      if (log.hits.length) log.hits = log.hits.filter(function (el) { return el.parentNode; });
    }
    drawLogNote(log);
  }

  /** What is not on screen, said at the top of the console: a long build's start is gone, and so is its first error. */
  function drawLogNote(log) {
    var text = (log.truncated ? 'This console is large — the first ' + (log.skippedBytes ? Math.round(log.skippedBytes / 1024) + ' KB were' : 'part was') + ' not loaded. ' : '') +
      (log.trimmed ? log.trimmed + ' earlier lines were dropped to keep this fast.' : '');
    if (!text) return;
    if (!log.note) log.note = h('div', { class: 'gap trim' });
    log.note.textContent = text.trim();
    if (log.box.firstChild !== log.note) log.box.insertBefore(log.note, log.box.firstChild);
  }

  /** Lines are drawn a few hundred at a time, so a console of forty thousand never holds the panel still. */
  function drainLog(log) {
    if (state.log !== log) return;
    log.draining = false;
    var take = log.queue.splice(0, 500);
    if (take.length) renderLines(log, take);
    if (log.queue.length) { log.draining = true; setTimeout(function () { drainLog(log); }, 0); }
    else if (log.finishing && !log.ended) {
      log.ended = true;
      if (!log.n) replace(log.box, h('div', { class: 'gap', text: 'The console is empty.' }));
      loadBuild(false);
    }
    if (log.wantStage) jumpToStage(log);
    else if (log.follow) log.box.scrollTop = log.box.scrollHeight;
    drawLogBar();
  }

  /** Scroll the console to where a stage begins, once that line has arrived. A build still writing is looked at again as it grows. */
  function jumpToStage(log) {
    if (!log.wantStage || !log.box.isConnected) return;
    for (var i = 0; i < log.lines.length; i += 1) {
      if (lineIsStage(log.lines[i].text, log.wantStage)) {
        log.follow = false;
        log.lines[i].el.classList.add('hit', 'cur');
        centreIn(log.box, log.lines[i].el);
        log.wantStage = null;
        return;
      }
    }
    if (log.ended) { say('That stage is not in the part of the console that is kept.'); log.wantStage = null; }
  }

  function onLog(payload) {
    var log = state.log;
    if (!log || payload.id !== log.id) return;
    if (!log.started) { log.started = true; replace(log.box, null); log.note = null; }
    if (payload.error) {
      log.ended = true;
      log.box.appendChild(h('div', { class: 'gap bad', text: explainError(payload.error) }));
      drawLogBar();
      return;
    }
    if (payload.expired) {
      log.ended = true;
      log.box.appendChild(h('div', { class: 'gap', text: 'Stopped following: the console was not asked for in time. Open the build again to continue.' }));
      drawLogBar();
      return;
    }
    if (payload.truncated) log.truncated = true;
    if (payload.source === 'local') log.local = true;
    if (payload.skipped) log.skippedBytes = payload.skipped;
    var got = logLines(log.carry, payload.text || '');
    var lines = got.lines;
    log.carry = got.carry;
    if (!payload.more && log.carry) { lines.push(foldReturns(log.carry)); log.carry = ''; }
    // Only the last LOG_LINES could stay on screen anyway: the rest is counted, not drawn.
    var room = log.queue.length + lines.length - LOG_LINES;
    if (room > 0) {
      var fromQueue = Math.min(room, log.queue.length);
      log.queue.splice(0, fromQueue);
      var fromNew = room - fromQueue;
      lines = lines.slice(fromNew);
      log.n += room;
      log.trimmed += room;
    }
    log.queue = log.queue.concat(lines);
    if (!payload.more) log.finishing = true;
    if (!log.draining) drainLog(log);
  }

  function searchLog(text) {
    var log = state.log;
    if (!log) return;
    log.query = String(text || '').toLowerCase();
    log.hits = [];
    log.at = -1;
    log.lines.forEach(function (one) {
      var hit = Boolean(log.query) && one.text.toLowerCase().indexOf(log.query) >= 0;
      one.el.classList.toggle('hit', hit);
      one.el.classList.remove('cur');
      if (hit) log.hits.push(one.el);
    });
    if (log.hits.length) stepHit(1);
    else drawLogBar();
  }

  /** Centre a line in the console without moving the page around it, which scrollIntoView would. */
  function centreIn(box, line) {
    box.scrollTop = Math.max(0, line.offsetTop - box.clientHeight / 2 + line.offsetHeight / 2);
  }

  function stepHit(by) {
    var log = state.log;
    if (!log || !log.hits.length) return;
    if (log.hits[log.at]) log.hits[log.at].classList.remove('cur');
    log.at = (log.at + by + log.hits.length) % log.hits.length;
    log.follow = false;
    log.hits[log.at].classList.add('cur');
    centreIn(log.box, log.hits[log.at]);
    drawLogBar();
  }

  function jumpToError() {
    var log = state.log;
    if (!log || !log.firstError) { say(log && log.trimmed ? 'The first error is above what is kept on screen.' : 'There is no error line in this console (yet).'); return; }
    log.follow = false;
    centreIn(log.box, log.firstError);
    drawLogBar();
  }

  /* ------------------------------------------------------------- the actions */

  /** One thing at a time per key; a button that is waiting says so, and cannot be pressed twice. */
  function act(key, promise, done) {
    if (state.busy[key]) return Promise.resolve();
    state.busy[key] = true;
    redrawBusy();
    return Promise.resolve().then(promise).then(function (result) {
      state.busy[key] = false;
      redrawBusy();
      if (done) done(result);
    }, function (error) {
      state.busy[key] = false;
      if (!declined(error)) fail(error);
      redrawBusy();
    });
  }

  function isBusy(key) { return state.busy[key] ? true : null; }
  function setBusy(key, on) { if (on) state.busy[key] = true; else delete state.busy[key]; redrawBusy(); }

  /** The buttons that are waiting on something are drawn disabled; nothing else is touched. */
  function redrawBusy() {
    // On the settings page the buttons that open a file dialog are changed in place, whatever has the focus.
    if (state.page.type === 'setup') { syncTransferButtons(); return; }
    if (typing()) return;
    if (state.page.type === 'build') drawBuildHead();
    else if (state.page.type === 'job' || state.page.type === 'queue') drawMain();
    else if (state.page.type === 'folder' || state.page.type === 'view') drawListBody();
  }

  /*
   * Stopping a build, from wherever it is listed.
   *
   * "Stop" asks Jenkins nicely; the app asks the person first. After it was
   * sent the button says so and cannot be pressed twice, and a build that is
   * still running eight seconds later is one that ignored the request — only
   * then is "Kill" offered, because it ends the build without letting it clean
   * up. The person saying no is not a failure and is not reported as one; Jenkins
   * saying no — you may not stop this — is, in Jenkins' own words.
   */
  var STOP_PATIENCE_MS = 8000;
  function stopState(path, number) {
    var at = state.stopped[path + '#' + number];
    return { stopping: Boolean(at), canKill: Boolean(at) && Date.now() - at > STOP_PATIENCE_MS };
  }

  /** The person said no to the app's question: a choice, not an error. */
  function declined(error) { return /person said no|declin/i.test(String(error && error.message ? error.message : error)); }

  function stopBuild(path, number) {
    var key = path + '#' + number;
    return act('stop:' + key, function () {
      return api('stop', { path: path, number: number }).then(null, function (error) { if (declined(error)) return { declined: true }; throw error; });
    }, function (result) {
      if (result && result.declined) return;
      state.stopped[key] = Date.now();
      say('Asked Jenkins to stop ' + path + ' #' + number + '.');
      refreshSoon();
      // The moment the request has been ignored long enough to offer the harder one.
      setTimeout(redrawBusy, STOP_PATIENCE_MS + 500);
    });
  }

  function killBuild(path, number) {
    var key = path + '#' + number;
    return act('kill:' + key, function () {
      return api('stop', { path: path, number: number, hard: true }).then(null, function (error) { if (declined(error)) return { declined: true }; throw error; });
    }, function (result) {
      if (result && result.declined) return;
      say('Killed ' + path + ' #' + number + '.');
      refreshSoon();
    });
  }

  /** The button for one running build: Stop, then "Stopping…", then Kill if it comes to that. */
  function stopButton(path, number, small) {
    var key = path + '#' + number;
    var st = stopState(path, number);
    var size = small ? ' small' : '';
    var label = path + ' #' + number;
    if (st.canKill) {
      return h('button', {
        class: 'btn danger' + size, type: 'button', text: '☠ Kill', 'aria-label': 'Kill ' + label,
        title: 'It ignored the request to stop. Kill ends it without letting it clean up.',
        disabled: isBusy('kill:' + key), onclick: function (event) { event.stopPropagation(); killBuild(path, number); }
      });
    }
    return h('button', {
      class: 'btn danger' + size, type: 'button', text: st.stopping ? '■ Stopping…' : '■ Stop', 'aria-label': (st.stopping ? 'Stopping ' : 'Stop ') + label,
      title: st.stopping ? 'Jenkins was asked to stop it' : 'Stop this build',
      disabled: st.stopping ? true : isBusy('stop:' + key), onclick: function (event) { event.stopPropagation(); stopBuild(path, number); }
    });
  }

  /** Take a build that has not started out of the queue. */
  function cancelQueued(item, path) {
    return act('cancel' + item.id, function () { return api('cancelQueued', { id: item.id }); }, function () {
      say('Took ' + path + ' out of the queue.');
      if (state.page.type === 'job') loadJob();
      else if (state.page.type === 'queue') loadQueue();

    });
  }

  function runJob(path, params, after) {
    return act('run:' + path, function () { return api('run', { path: path, params: params || null }); }, function () {

  }

  function askClaude(path, number) {
    return act('ask:' + path + number, function () {
      return host.call('jenkins.ask', { server: state.server, path: path, number: number }).then(function (result) {
        if (result && result.ok === false) throw new Error(result.error || 'it did not say why');
      });
    }, function () { say('Claude has the build, the stages and the end of its console.'); });
  }

  /** Keep a finished build on this computer, or let go of the pin. The copy that was made on its own stays. */
  function saveBuild(build, on) {
    var key = build.path + '#' + build.number;
    return act('save:' + key, function () { return api('save', { path: build.path, number: build.number }); }, function () {
      say('Saved on this computer: ' + build.path + ' #' + build.number + '.');
      loadBuild(false);
    });
  }

  /** Remove what is kept of one build. The app asks first, and the question names it. */
  function forgetCopy(build) {
    var key = build.path + '#' + build.number;
    return act('forget:' + key, function () { return api('forget', { path: build.path, number: build.number }); }, function () {

  function setFavorite(path, on) {
    return api('favorite', { path: path, on: on }).then(function (data) {

  }

  function isFavorite(path) { return (state.favorites[state.server] || []).indexOf(path) >= 0; }

  function isFollowed(path, number) {

  }

  function setFollow(path, number, on) {

  /* ---------------------------------------------------------------- drawing */

  function drawAll() { drawBar(); drawSide(); drawMain(); }

  function banner(kind, text, button) {

  function drawBar() {

    var kids = [
      state.navInSidebar ? null : h('button', { class: 'btn small navbtn', title: 'Jobs', 'aria-label': 'Show the jobs', text: '☰', onclick: function () { state.navOpen = !state.navOpen; $('body').classList.toggle('nav', state.navOpen); } }),

      kids.push(h('button', { class: 'btn small' + (state.page.type === 'launches' ? ' on' : ''), text: 'Launches', onclick: function () { go({ type: 'launches', path: '' }); } }));

    }

  /** Another Jenkins is being looked at: everything about the last one is dropped, and so is any answer still on its way. */
  function forgetServer() {
    state.epoch += 1;
    state.nodes = {}; state.views = null; state.home = null; state.queue = null; state.runInfo = {};
    state.job = null; state.build = null; state.stopped = {};
    state.search = { q: '', rows: null, busy: false, cursor: 0 };
    if (els.q) els.q.value = '';
    // Everything about the other Jenkins goes: what a dashboard held, what was ticked, what was asked and not yet answered.
    state.dash = newDash(state.dash.range, state.dash);
    state.launch = { pad: null, mine: [], schedules: [], loaded: null, tab: null, batch: null };
    state.launches = null; state.plan = null; state.presets = null; state.promote = null; state.why = null; state.bx = null; state.form = null; state.formWant = null; state.queueWhy = {};

  function switchServer(id, page) {

  /* -- sidebar -- */

  /** The rows of the tree that can be walked to, in the order they are drawn. */

  /** The tree with a keyboard: arrows walk and fold it, Enter and Space open, letters jump to a name, * stars. */

    else if (event.key === 'ArrowUp') { event.preventDefault(); focusRow(rows[at - 1]); }
    else if (event.key === 'Home') { event.preventDefault(); focusRow(rows[0]); }
    else if (event.key === 'End') { event.preventDefault(); focusRow(rows[rows.length - 1]); }
    else if (event.key === 'ArrowRight') {

  function starFor(path) {

  function rowsFor(key, depth, out) {
    var node = state.nodes[key];
    if (!node || (!node.rows && node.loading)) { out.push(h('div', { class: 'note', style: 'padding-left:' + (6 + depth * 14) + 'px', text: 'Reading…' })); return; }
    if (node.error) { out.push(h('div', { class: 'note bad', style: 'padding-left:' + (6 + depth * 14) + 'px', text: explainError(node.error) })); return; }
    if (!node.rows) return;

  /** What a job's row says when it is hovered: where it is, and where it is up to. */
  function jobTip(row) {

  function treeItem(row, depth, out, flat) {

        key: 'b:' + row.path + '#' + row.number,

        onclick: function () { openBuild(row.path, row.number); }

      sel: (state.page.type === 'job' || state.page.type === 'build') && state.page.path === row.path,

  function viewItems(view, depth, out) {
    var key = 'v:' + view.path;

      key: key, open: Boolean(state.open[key]), lead: h('span', { class: 'glyph', 'aria-hidden': 'true', text: '🔒', title: 'Managed in Jenkins — read only' }),

  /** The parts of the sidebar that hold the cursor — the search box and the switch — are made once and never rebuilt. */
  function ensureSide() {

    els.q = h('input', {
      type: 'search', placeholder: 'Find a job…  ⌘K', 'aria-label': 'Find a job',
      oninput: function (event) { onSearch(event.target.value); },

    });

  function searchKey(event) {

  function setMode(mode) {

    remember();

  }

  function clearSearch() {

  function onSearch(text) {

  /* -- the page -- */

  /**
   * A redraw replaces what the keyboard was on. Where it was is written down by what it was
   * (its name, its label, its text, and which of the same it was) and put back on the same
   * thing in the new page, so a screen reader or a keyboard is not sent back to the top
   * every time something changes in the background.

  }
  function signatureOf(el) {
    var name = el.id || el.getAttribute('data-key') || el.getAttribute('data-sel') || el.getAttribute('data-param') || el.getAttribute('aria-label') || el.getAttribute('title') || el.getAttribute('placeholder') || (el.textContent || '').trim().slice(0, 40);

    var root = key.root ? document.getElementById(key.root) : document.body;
    if (!root) return;
    var same = candidatesFor(root).filter(function (c) { return signatureOf(c) === key.sig && c.offsetParent !== null; });
    var to = same[Math.min(key.index, same.length - 1)];

  function drawMain() { withFocus(drawMainNow); }

  function drawMainNow() {
    var main = $('main');
    var type = state.page.type;
    if (type !== 'build') els.buildView = null;
    if (type !== 'folder' && type !== 'view') els.listView = null;
    if (type !== 'dashboard') { if (els.dashView) stopWatching(); els.dashView = null; dashHeartbeat(false); }
    if (state.error) { replace(main, h('div', { class: 'page' }, banner('bad', state.error, h('button', { class: 'btn', text: 'Try again', onclick: retry })))); return; }
    if (state.loading) { replace(main, h('div', { class: 'spin', text: 'Reading…' })); return; }
    if (type === 'setup') return drawSetup(main);
    var failing = state.health[state.server] && state.health[state.server].ok === false ? state.health[state.server] : null;
    var kids = [];
    if (failing) kids.push(healthBanner(failing));
    if (type === 'job') kids.push(jobPage());
    else if (type === 'queue') kids.push(queuePage());
    else if (type === 'launches') kids.push(launchesPage());
    else if (type === 'build') { drawBuild(main, kids); return; }
    else if (type === 'folder' || type === 'view') { drawListing(main, kids); return; }
    else if (type === 'dashboard') { drawDashboard(main, kids); return; }
    replace(main, h('div', { class: 'page' }, kids));
  }

  /**
   * Why the server cannot be read, said as what it is: a Jenkins that is not
   * there is waited for, one that no longer accepts the token needs the token.
   */
  function healthBanner(health) {
    if (isCertError(health.error)) {
      var cur = state.servers.filter(function (one) { return one.id === state.server; })[0] || { name: 'this server' };
      return certificateCard({ server: state.server, name: cur.name, trust: function (fp) { return call('trustCertificate', { server: state.server, serverName: cur.name, fingerprint: fp }); }, onTrusted: retry,
        extra: h('button', { class: 'btn', type: 'button', text: 'Retry', onclick: retry }) });
    }
    var refused = /did not accept|wants a user|does not allow|login page/i.test(health.error || '');
    if (refused) {
      return h('div', { class: 'banner bad', role: 'alert', title: health.error },
        h('div', { class: 'grow', text: explainError(health.error) + ' The token may have expired or been revoked.' }),
        h('div', { class: 'bannerbtns' },
          h('button', { class: 'btn', text: 'Update the token', onclick: function () { openSetup(state.server); } }),
          h('button', { class: 'btn', text: 'Retry', onclick: retry })));
    }
    return h('div', { class: 'banner bad', role: 'alert', title: health.error },
      h('div', { class: 'grow', text: 'Jenkins is not answering. ' + explainError(health.error) + ' This tries again by itself every 20 seconds.' }),
      h('button', { class: 'btn', text: 'Retry now', onclick: retry }));
  }

  /** A server that is down is asked after, slowly, until it answers: nothing else would tell this panel it is back. */
  function watchRecovery() {
    var health = state.health[state.server];
    if (!health || health.ok !== false || timers.recover || !state.server) return;
    timers.recover = setTimeout(function () {
      timers.recover = null;
      var again = state.health[state.server];
      if (again && again.ok === false && state.showing && state.started) retry();
      watchRecovery();
    }, 20000);
  }

  function retry() {
    state.error = null;
    if (!state.started || !state.servers.length) { state.started = false; start(); return; }
    state.epoch += 1;
    // The tree stays as it was while it is read again: an outage is not a reason to close every folder.
    state.views = null;
    drawAll();
    loadEverything();
  }

  /* what needs you */

  function pill(text, cls) { return h('span', { class: 'chip ' + (cls || ''), text: text }); }

  /** A description from Jenkins, as text, folded when it is long. */

    var text = plainText(html);

    var long = text.length > 280 || text.split('\n').length > 6;

    var flip = function () { var folded = box.classList.toggle('clamp'); more.textContent = folded ? 'Show more' : 'Show less'; };

    more.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); flip(); } });

  function failingLine(row) {

      selBox(row.path),
      dot(shown(row)),
      h('div', { class: 'grow' },
        h('div', { class: 't' }, h('a', { class: 'job', role: 'link', tabindex: '0', title: row.path, text: row.path, onclick: function () { openJob(row.path); }, onkeydown: enterKey(function () { openJob(row.path); }) }), last ? h('span', { class: 'mono faint', text: '  #' + last.number }) : null),
        h('div', { class: 's' }, last ? [word(last.status), ' · ', agoEl(last.timestamp), row.health !== null && row.health !== undefined ? ' · health ' + row.health + '%' : ''] : 'never built')),

  /* --------------------------------------------------------------- the events */

  /**
   * What the app pushes. A change is a reason to read again, never data to
   * trust: the panel asks for what it shows, so there is one place that knows

  function onEvent(payload) {
    if (!payload || !state.started) return;
    if (payload.type === 'log') { onLog(payload); return; }
    if (payload.type === 'health') {
      var before = state.health[payload.server];
      state.health[payload.server] = { ok: payload.ok, error: payload.error };
      drawBar();
      watchRecovery();
      if (payload.server !== state.server) return;
      if (!typing()) drawMain();
      // Back after being away: everything on screen is from before, so all of it is read again.
      if (payload.ok && before && before.ok === false) retry();
      return;
    }
    if (payload.server && payload.server !== state.server) return;
    // A copy was made or removed: the badge of the build on screen, and nothing else, is read again.
    if (payload.type === 'batch') { onBatchEvent(payload); return; }
    if (payload.type === 'launch') { loadLaunchpadSoon(); return; }
    if (payload.type === 'schedule') { say(payload.state === 'missed' ? payload.path + ' was due while the app was closed: it was not started.' : payload.path + (payload.state === 'fired' ? ' was started by its schedule.' : ' could not be started' + (payload.error ? ': ' + payload.error : '.')), payload.state !== 'fired'); loadLaunchpadSoon(); return; }

  /* One second of elapsed time, drawn from what is already known — it asks nobody. */
  var tickCount = 0;
  setInterval(function () {
    tickCount += 1;
    var now = Date.now();
    var running = document.querySelectorAll('[data-since]');
    for (var i = 0; i < running.length; i += 1) running[i].textContent = dur(now - Number(running[i].getAttribute('data-since')));
    var bars = document.querySelectorAll('[data-bar]');
    for (var b = 0; b < bars.length; b += 1) {
      var from = bars[b].getAttribute('data-bar').split('|');
      var pct = progressOf(now - Number(from[0]), Number(from[1]));
      if (pct !== null) bars[b].style.width = pct + '%';
    }
    var upd = document.querySelectorAll('[data-upd]');
    for (var u = 0; u < upd.length; u += 1) {
      var secs = Math.max(0, Math.round((now - Number(upd[u].getAttribute('data-upd'))) / 1000));
      upd[u].textContent = secs < 5 ? 'updated just now' : 'updated ' + (secs < 90 ? secs + ' s' : Math.round(secs / 60) + ' min') + ' ago';
    }
    // Relative times only change a minute at a time.
    if (tickCount % 15 === 0) {
      var aged = document.querySelectorAll('[data-ago]');
      for (var a = 0; a < aged.length; a += 1) aged[a].textContent = ago(Number(aged[a].getAttribute('data-ago')), now);
    }

  var LAUNCH_WORDS = { waiting: 'waiting its turn', queued: 'in the queue', running: 'running', success: 'passed', failed: 'failed', unstable: 'unstable', aborted: 'aborted', error: 'could not start', lost: 'lost track of', skipped: 'not started' };
  var LAUNCH_GLYPHS = { waiting: '…', queued: '◔', running: '▶', success: '✓', failed: '✕', unstable: '!', aborted: '–', error: '✕', lost: '?', skipped: '–' };
  function launchWord(state) { return LAUNCH_WORDS[state] || String(state || ''); }
  function launchGlyph(state) { return LAUNCH_GLYPHS[state] || '·'; }
  /** Over, one way or another: nothing more will happen to this launch. */
  function launchOver(state) { return ['success', 'failed', 'unstable', 'aborted', 'error', 'lost', 'skipped'].indexOf(state) >= 0; }
  /** A launch that went wrong, for the colour of its line. */

  /** The times it is easy to want: soon, this evening, first thing tomorrow. Past ones are left out. */
