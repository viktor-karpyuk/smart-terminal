      if (!state.depths) return call('depths').then(function (d) { state.depths = d; }, function () {});
    });
  }

  function load() {
    var view = state.view;
    var promise;
    if (view === 'dashboard') promise = call('dashboard').then(function (r) { state.dashboard = r; state.auto = r.auto; });
    else if (view === 'repos') promise = call('repos').then(function (r) { state.repos = r.repos; });
    else if (view === 'prs') promise = call('prs', { repoId: state.repoId, states: state.prStates }).then(function (r) { state.prList = r; });
    else if (view === 'pr') promise = loadPrView();
    else if (view === 'settings') promise = Promise.all([call('guidelines', { repoId: null }), call('usage')]).then(function (r) { state.globalGuidelines = r[0].guidelines; state.usage = r[1].usage; });
    else if (view === 'import') promise = call('importInspect').then(function (r) { state.importInfo = r; });
    else if (view === 'bus') promise = call('bus').then(function (r) { state.bus = r; });
    else promise = Promise.resolve();
    return promise.then(draw, function (error) {
      if (view === 'pr') state.prError = error.message; else fail(error);
      draw();
    });
  }

  function loadPrView() {
    var repoId = state.repoId;
    var prId = state.prId;
    return call('pr', { repoId: repoId, prId: prId }).then(function (r) {
      // An answer about the PR that was open before this one is not about this one.
      if (state.view !== 'pr' || state.repoId !== repoId || state.prId !== prId) return;
      // New commits: the file list, its diffs and the file text read for the old head are all stale.
      var before = state.pr && state.pr.pr && state.pr.pr.headSha;
      var after = r && r.pr && r.pr.headSha;
      if (before && after && before !== after) {
        state.code = { files: null, file: state.code.file, lines: null, error: null, focusLine: null, noteAt: null };
        state.commits = { data: null, sha: null, files: null, file: null, lines: null, error: null };
      }
      state.pr = r;
      state.prError = null;
      if (state.prTab === 'code' && !state.code.files) loadFiles();
      if (state.prTab === 'commits' && !state.commits.data) loadCommits();
    });
  }

  /** Something about this PR changed on the other side: read it again, but not under someone's typing. */
  function scheduleReload() {
    clearTimeout(state.reloadTimer);
    state.reloadTimer = setTimeout(function () {
      var active = document.activeElement;
      if (active && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && active.type !== 'checkbox'))) {
        state.pendingReload = true;
        return;
      }
      load();
    }, 350);
  }
  document.addEventListener('focusout', function () {
    if (!state.pendingReload) return;
    setTimeout(function () {
      var active = document.activeElement;
      if (active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT')) return;
      state.pendingReload = false;
      load();
    }, 150);
  });

  function go(view, fields) {
    state.view = view;
    Object.keys(fields || {}).forEach(function (key) { state[key] = fields[key]; });
    if (view !== 'pr') { state.pr = null; state.prError = null; }
    if (view === 'pr') {
      // Drafts that belong to the PR that was open — a merge message, a decline reason, a new note — do not follow into another.
      if (state.edits.__pr !== state.repoId + '#' + state.prId) {
        Object.keys(state.edits).forEach(function (key) { if (/^(merge-|decline-|newnote-|follow-|rep-)/.test(key)) delete state.edits[key]; });
        state.edits.__pr = state.repoId + '#' + state.prId;
      }
      state.code = { files: null, file: null, lines: null, error: null, focusLine: null, noteAt: null };
      state.commits = { data: null, sha: null, files: null, file: null, lines: null, error: null };
      state.confirmRerun = null; state.decline = null; state.merge = null;
    }
    remember();
    draw();
    $('main').scrollTop = 0;
    load();
  }

  /* ------------------------------------------------------------------ *
   * Drawing
   * ------------------------------------------------------------------ */

  function runningList() {
    return Object.keys(state.activity).map(function (key) { return state.activity[key]; });
  }

  function drawTop() {
    var runs = runningList();
    var auto = state.auto;
    var autoText = !state.overview ? '' : !(state.overview.settings && state.overview.settings.autoEnabled)
      ? 'automatic off'
      : auto && auto.running ? 'sweeping…' : auto && auto.lastRunAt ? 'last sweep ' + when(auto.lastRunAt) : 'automatic on';
    var tabs = [['dashboard', 'Dashboard'], ['repos', 'Repositories'], ['bus', 'Coordination'], ['settings', 'Settings']];
    var html = '<span class="brand">Code Reviewer</span>';
    tabs.forEach(function (tab) {
      var on = state.view === tab[0] || (tab[0] === 'repos' && (state.view === 'prs' || state.view === 'repoForm' || state.view === 'import')) ||
        (tab[0] === 'dashboard' && state.view === 'pr' && state.backTo === 'dashboard') || (tab[0] === 'repos' && state.view === 'pr' && state.backTo !== 'dashboard');
      html += '<button class="tab' + (on ? ' on' : '') + '" data-act="nav" data-view="' + tab[0] + '">' + tab[1] + '</button>';
    });
    // The breadcrumb takes whatever room is left and gives it up first; without one, a spacer does its job.
    html += crumbs() || '<span class="spacer"></span>';
    if (runs.length) html += '<span class="chip accent" title="' + esc(runs.map(function (r) { return r.kind + ' · ' + (r.repoName || '') + ' #' + r.prId; }).join('\n')) + '"><span class="dot busy"></span>' + runs.length + ' running</span>';
    if (state.refreshResult && !state.busy['refresh-all']) {
      var rr = state.refreshResult;
      html += '<span class="' + (rr.failed.length ? 'warn' : 'faint') + '" title="' + esc(rr.failed.map(function (f) { return f.repoName + ': ' + f.message; }).join('\n')) + '">' + rr.read + ' read' + (rr.failed.length ? ' · ' + rr.failed.length + ' failed' : '') + '</span>';
    }
    html += '<span class="faint auto-state" title="' + esc(auto && auto.lastMessage || '') + '">' + esc(autoText) + '</span>';
    html += '<button class="btn small" data-act="refresh-all"' + busyAttr('refresh-all') + ' title="Read the open pull requests of every repository">' + (state.busy['refresh-all'] ? 'Refreshing' : 'Refresh all') + '</button>';
    $('top').innerHTML = html;
  }

  /** Where you are, when that is deeper than a tab: a repository's list, a pull request, a form. */
  function crumbs() {
    var parts = [];
    if (state.view === 'prs' && state.prList) parts.push('<span class="here">' + esc(state.prList.repo.name) + '</span>');
    if (state.view === 'repoForm') parts.push('<span class="here">' + (state.form && state.form.id ? 'Edit ' + esc(state.form.name) : 'New repository') + '</span>');
    if (state.view === 'import') parts.push('<span class="here">Import</span>');
    if (state.view === 'pr') {
      var name = state.pr && state.pr.repo ? state.pr.repo.name : '';
      if (name) parts.push('<button class="link" data-act="open-prs" data-repo="' + esc(state.repoId) + '">' + esc(name) + '</button>');
      parts.push('<span class="here">#' + esc(state.prId) + (state.pr && state.pr.pr ? ' ' + esc(state.pr.pr.title) : '') + '</span>');
    }
    return parts.length ? '<span class="crumbs">› ' + parts.join(' › ') + '</span>' : '';
  }

  function draw() {
    if (!state.started) return;
    drawTop();
    var main = $('main');
    var scroll = main.scrollTop;
    var html;
    try {
      if (state.view === 'dashboard') html = drawDashboard();
      else if (state.view === 'repos') html = drawRepos();
      else if (state.view === 'repoForm') html = drawRepoForm();
      else if (state.view === 'prs') html = drawPrList();
      else if (state.view === 'pr') html = drawPr();
      else if (state.view === 'settings') html = drawSettings();
      else if (state.view === 'import') html = drawImport();
      else if (state.view === 'bus') html = drawBus();
      else html = '';
    } catch (error) {
      html = '<div class="page"><div class="banner bad">This view could not be drawn: ' + esc(error && error.stack || error) + '</div></div>';
    }
    var active = document.activeElement;
    var focus = active && active.getAttribute && active.getAttribute('data-edit');
    var selection = focus ? { start: active.selectionStart, end: active.selectionEnd, direction: active.selectionDirection, scroll: active.scrollTop } : null;
    main.innerHTML = html;
    main.scrollTop = scroll;
    state.drawPending = false;
    if (focus) {
      // Keys carry file paths and comment ids: escaped, a quote in one does not break the selector.
      var again = main.querySelector('[data-edit="' + cssEscape(focus) + '"]');
      if (again) {
        again.focus();
        try { again.setSelectionRange(selection.start, selection.end, selection.direction || 'none'); } catch (e) { /* not a text field */ }
        again.scrollTop = selection.scroll;
      }
    }
  }

  function cssEscape(value) {
    return window.CSS && CSS.escape ? CSS.escape(value) : String(value).replace(/["\\]/g, '\\$&');
  }

  /** Someone is typing in the page: a redraw now would take the text field out from under them. */
  function typing() {
    var active = document.activeElement;
    return Boolean(active && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && /^(text|search|number|password|)$/.test(active.type))));
  }

  /**
   * A redraw nobody asked for — a run's progress, a count — waits while someone
   * types: the top bar is drawn now, the page when the field is left.
   */
  function drawQuietly() {
    if (!typing()) return draw();
    drawTop();
    state.drawPending = true;
  }

  function edit(key, fallback) {
    return Object.prototype.hasOwnProperty.call(state.edits, key) ? state.edits[key] : fallback == null ? '' : fallback;
  }

  function drawRuns(runs, withTitle) {
    if (!runs.length) return '';
    return runs.map(function (run) {
      var label = { review: 'Review', verify: 'Verification', final: 'Final pass', reply: 'Reply', fix: 'Fix' }[run.kind] || run.kind;
      return '<div class="run"><div class="row"><span class="dot busy"></span><strong>' + esc(label) + '</strong>' +
        (withTitle ? ' <span class="dim">' + esc(run.repoName) + ' #' + esc(run.prId) + ' · ' + esc(run.title) + '</span>' : ' <span class="dim">' + esc(run.title) + '</span>') +
        (run.auto ? ' <span class="chip">automatic</span>' : '') +
        (run.depth ? ' <span class="chip">' + esc(run.depth.toLowerCase()) + '</span>' : '') +
        (run.model ? ' <span class="chip">' + esc(run.model) + '</span>' : '') +
        '<span class="spacer"></span><span class="faint">' + esc(when(new Date(run.startedAt).toISOString())) + '</span>' +
        (withTitle ? ' <button class="btn small" data-act="open-pr" data-repo="' + esc(run.repoId) + '" data-pr="' + esc(run.prId) + '">Open</button>' : '') +
        ' <button class="btn small danger" data-act="cancel-run" data-key="' + esc(run.key) + '">Cancel</button></div>' +
        '<div class="lines">' + esc((run.lines || []).slice(-14).join('\n')) + '</div></div>';
    }).join('');
  }

  // ---- dashboard --------------------------------------------------------

  function drawDashboard() {
    var d = state.dashboard;
    if (!state.overview || !d) return '<div class="loading">Loading the board…</div>';
    if (!state.overview.repos.length) {
      return '<div class="page"><div class="empty"><h2>No repositories yet</h2>Add a repository with its local clone and a token, or bring your AI Code Reviewer history across.<div class="row" style="justify-content:center;margin-top:12px">' +
        '<button class="btn primary" data-act="repo-new">Add repository</button> <button class="btn" data-act="nav" data-view="import">Import from AI Code Reviewer</button></div></div></div>';
    }
    var f = state.dashFilter;
    var stats = [
      ['REVIEWING', d.stats.running, 'In progress'], ['', d.stats.open, 'Open PRs'], ['TO_PUBLISH', d.stats.toPublish, 'Ready to publish'],
      ['REPLIED', d.stats.replied, 'Replied to you'], ['TO_VERIFY', d.stats.toVerify, 'To verify'], ['UNREVIEWED', d.rows.filter(function (r) { return r.flags.indexOf('UNREVIEWED') >= 0; }).length, 'Not reviewed']
    ];
    var html = '<div class="page">';
    html += '<div class="stats">' + stats.map(function (s) {
      var on = s[0] && f.flags.indexOf(s[0]) >= 0;
      // What waits on you is coloured when there is some; a zero is quiet.
      var urgent = s[1] > 0 && (s[0] === 'TO_PUBLISH' || s[0] === 'REPLIED' || s[0] === 'TO_VERIFY' || s[0] === 'UNREVIEWED');
      return '<div class="stat' + (on ? ' on' : '') + '" data-act="dash-flag" data-flag="' + s[0] + '" title="' + (s[0] ? 'Show only these' : 'Show all') + '"><div class="n' + (urgent ? ' warn' : s[1] === 0 ? ' faint' : '') + '">' + s[1] + '</div><div class="l">' + s[2] + '</div></div>';
    }).join('') + '</div>';
    if (d.readErrors && d.readErrors.length) {
      html += fold('read-errors', '<span class="warn">⚠</span><strong>' + d.readErrors.length + ' repositor' + (d.readErrors.length === 1 ? 'y' : 'ies') + ' could not be read</strong>',
        esc(d.readErrors.map(function (e) { return e.repoName; }).join(', ')),
        '<table class="list">' + d.readErrors.map(function (e) {
          return '<tr><td><strong>' + esc(e.repoName) + '</strong></td><td>' + esc(e.message) + '<div class="faint mono" style="font-size:10.5px;margin-top:2px" title="' + esc(e.detail) + '">' + esc(String(e.detail).slice(0, 140)) + '</div></td><td class="faint">' + esc(when(e.at)) + '</td>' +
            '<td style="text-align:right"><button class="btn small" data-act="repo-edit" data-repo="' + esc(e.repoId) + '">Edit</button></td></tr>';
        }).join('') + '</table>', false, 'warn-fold');
    }

    var runs = runningList();
    if (runs.length) html += '<h3>Running now</h3>' + drawRuns(runs, true);

    var authors = {};
    d.rows.forEach(function (row) { authors[row.pr.author] = (authors[row.pr.author] || 0) + 1; });
    html += '<div class="row" style="margin:12px 0 6px">';
    html += '<input type="text" id="dash-search" placeholder="Search title, author, repository, #number" data-bind="dash-text" data-edit="dash-text" value="' + esc(f.text) + '" style="width:280px" title="Press / to search">';
    html += '<span class="chip click' + (f.mine ? ' on' : '') + '" data-act="dash-mine" title="PRs waiting on something only you can do">Mine</span>';
    ['UNREVIEWED', 'STALE', 'TO_PUBLISH', 'REPLIED', 'TO_VERIFY', 'AWAITING_THEM', 'APPROVED', 'CHANGES_REQUESTED', 'DRAFT'].forEach(function (flag) {
      html += '<span class="chip click' + (f.flags.indexOf(flag) >= 0 ? ' on' : '') + '" data-act="dash-flag" data-flag="' + flag + '">' + FLAG_LABELS[flag] + '</span>';
    });
    if (f.flags.length > 1) html += '<button class="btn small" data-act="dash-mode">' + (f.mode === 'ALL' ? 'All of them' : 'Any of them') + '</button>';
    html += '</div>';
    var authorNames = Object.keys(authors).sort();
    if (authorNames.length > 1) {
      html += '<div class="row" style="margin-bottom:8px"><span class="faint">Authors</span>' + authorNames.map(function (name) {
        return '<span class="chip click' + (f.authors.indexOf(name) >= 0 ? ' on' : '') + '" data-act="dash-author" data-author="' + esc(name) + '">' + esc(name) + ' ' + authors[name] + '</span>';
      }).join('') + '</div>';
    }
    var text = f.text.trim().toLowerCase();
    var rows = d.rows.filter(function (row) {
      if (f.mine && !row.mine) return false;
      if (f.authors.length && f.authors.indexOf(row.pr.author) < 0) return false;
      if (f.flags.length) {
        var has = f.flags.map(function (flag) { return flag === 'TO_PUBLISH' ? row.flags.indexOf('TO_PUBLISH') >= 0 || row.flags.indexOf('PARTIAL') >= 0 : row.flags.indexOf(flag) >= 0; });
        if (f.mode === 'ALL' ? has.indexOf(false) >= 0 : has.indexOf(true) < 0) return false;
      }
      if (text) {
        var hay = (row.pr.title + ' ' + row.pr.author + ' ' + row.repoName + ' #' + row.pr.id).toLowerCase();
        if (hay.indexOf(text) < 0) return false;
      }
      return true;
    });
    // Grouped by whose turn it is: what only you can do first, then what is running, then what waits on others.
    var groups = [
      ['mine', 'Needs you', rows.filter(function (r) { return r.rank === 0; })],
      ['running', 'In progress', rows.filter(function (r) { return r.rank === 1; })],
      ['others', 'Waiting on others', rows.filter(function (r) { return r.rank >= 2; })]
    ];
    if (!rows.length) html += '<div class="empty">No pull requests match.' + (f.flags.length || f.mine || f.authors.length || f.text ? ' <button class="link" data-act="dash-clear">Clear the filters</button>' : '') + '</div>';
    groups.forEach(function (g) {
      if (!g[2].length) return;
      html += fold('dash-' + g[0], '<strong>' + g[1] + '</strong><span class="count">' + g[2].length + '</span>', '', drawPrTable(g[2], true), g[0] !== 'others' || groups[0][2].length + groups[1][2].length === 0);
    });

    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:10px">';
    html += '<div><h3>Recent reviews</h3>' + (d.recent.length ? '<table class="list">' + d.recent.map(function (item) {
      return '<tr class="click" data-act="open-pr" data-repo="' + esc(item.repoId) + '" data-pr="' + item.prId + '"' + (item.error ? ' title="' + esc(item.error) + '"' : '') + '><td class="faint nowrap">' + esc(when(item.at)) + '</td><td>' + esc(item.repoName) + ' #' + item.prId + ' <span class="dim">' + esc(item.title) + '</span></td><td class="nowrap">' + statusChip(item.status) + (item.trigger === 'AUTO' ? ' <span class="chip">auto</span>' : '') + '</td><td class="faint nowrap num">' + (item.costUsd ? money(item.costUsd) : '—') + '</td></tr>';
    }).join('') + '</table>' : '<div class="faint">Nothing yet.</div>') + '</div>';
    html += '<div><h3>Usage</h3>' + drawUsage(d.usage) + '</div>';
    html += '</div></div>';
    return html;
  }

  function statusChip(status) {
    var cls = status === 'DONE' ? 'okc' : status === 'FAILED' ? 'badc' : status === 'RUNNING' ? 'accent' : '';
    var label = { DONE: 'done', FAILED: 'failed', RUNNING: 'running', CANCELLED: 'cancelled' }[status] || String(status || '').toLowerCase();
    return '<span class="chip ' + cls + '">' + esc(label) + '</span>';
  }

  function drawUsage(usage) {
    if (!usage) return '';
    function block(title, list) {
      var total = list.reduce(function (acc, row) { acc.runs += row.runs; acc.billable += row.billable; acc.cache += row.cache; acc.cost += row.costUsd; return acc; }, { runs: 0, billable: 0, cache: 0, cost: 0 });
      return '<div class="card"><div class="row"><strong>' + title + '</strong><span class="spacer"></span><span>' + money(total.cost) + '</span></div>' +
        '<div class="faint">' + total.runs + ' run(s) · ' + tokens(total.billable) + ' tokens in+out · ' + tokens(total.cache) + ' cache</div>' +
        (list.length ? '<div class="dim" style="margin-top:4px">' + list.map(function (row) { return esc(row.kind) + ' ' + row.runs + ' · ' + money(row.costUsd); }).join(' — ') + '</div>' : '') + '</div>';
    }
    return block('Last 5 hours', usage.fiveHours || []) + block('Last 7 days', usage.week || []) +
      '<div class="faint" style="margin-top:4px">API-price equivalent, not a charge: with a subscription what is consumed is tokens.</div>';
  }

  function drawPrTable(rows, withRepo) {
    if (!rows.length) return '<div class="empty">No pull requests match.</div>';
    var html = '<table class="list"><tr><th>Pull request</th><th>Age</th><th>Waiting for</th><th title="Published / found, and how many published ones are still open">Findings</th><th title="API-price equivalent of the reviews, not a charge">Cost</th></tr>';
    rows.forEach(function (row) {
      var pr = row.pr;
      var closed = pr.state !== 'OPEN';
      html += '<tr class="click' + (closed ? ' closed' : '') + '" data-act="open-pr" data-repo="' + esc(row.repoId) + '" data-pr="' + pr.id + '">' +
        '<td class="title-cell"><div class="t">#' + pr.id + ' ' + esc(pr.title) + '</div><div class="s">' + (withRepo ? '<span class="chip">' + esc(row.repoName) + '</span> ' : '') + esc(pr.author) + (pr.sourceBranch ? ' · <span class="mono">' + esc(pr.sourceBranch) + ' → ' + esc(pr.targetBranch) + '</span>' : '') +
        (row.pendingReturn ? ' · <span class="warn">' + row.pendingReturn + ' fix(es) to hand back</span>' : '') + '</div></td>' +
        '<td class="faint" title="' + esc(pr.createdOn) + '">' + (row.ageDays != null ? row.ageDays + 'd ' : '') + '<span class="' + (row.ageDays >= 14 ? 'bad' : row.ageDays >= 7 ? 'warn' : '') + '">' + ageMark(row.ageDays) + '</span></td>' +
        '<td><div class="row">' + row.flags.map(flagChip).join('') + '</div></td>' +
        '<td class="faint">' + (row.findings.total ? row.findings.published + '/' + row.findings.total + (row.findings.unresolved ? ' <span class="warn">· ' + row.findings.unresolved + ' open</span>' : '') : '') + '</td>' +
        '<td class="faint">' + (row.costUsd ? money(row.costUsd) : '') + '</td></tr>';
    });
    return html + '</table>';
  }

  // ---- repositories -------------------------------------------------------

  function drawRepos() {
    if (!state.repos) return '<div class="loading">Loading repositories…</div>';
    var html = '<div class="page"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Repositories</h2><span class="spacer"></span>' +
      '<button class="btn" data-act="nav" data-view="import">Import from AI Code Reviewer</button> <button class="btn primary" data-act="repo-new">Add repository</button></div>';
    if (!state.repos.length) return html + '<div class="empty">No repositories yet.</div></div>';
    var visible = state.repos.filter(function (repo) { return !repo.hidden; });
    var hidden = state.repos.filter(function (repo) { return repo.hidden; });
    html += '<div class="grid-cards">' + visible.map(repoCard).join('') + '</div>';
    if (hidden.length) html += '<h3>Hidden</h3><div class="grid-cards">' + hidden.map(repoCard).join('') + '</div>';
    return html + '</div>';
  }

  function repoCard(repo) {
    var debt = repo.debt.pendingReplies + repo.debt.unverified + repo.debt.unpublished;
    var total = Math.max(debt, 1);
    var home = String(repo.localPath).replace(/^\/Users\/[^/]+/, '~');
    // Without a token a private repository reads as "not found": say what is actually missing.
    var readError = repo.readError && !repo.hasToken ? { message: 'No token: a private repository cannot be read without one.', detail: repo.readError.detail } : repo.readError;
    var oldest = repo.oldestDays == null ? '' : repo.oldestDays < 1 ? 'today' : repo.oldestDays === 1 ? '1 day ago' : repo.oldestDays + ' days ago';
    return '<div class="card repo-card' + (repo.readError || !repo.cloneOk ? ' bad' : '') + '"><div class="repo-head"><strong class="repo-name" title="' + esc(repo.name) + '">' + esc(repo.name) + '</strong>' +
      '<button class="btn small" data-act="repo-edit" data-repo="' + esc(repo.id) + '">Edit</button></div><div class="row repo-chips"><span class="chip">' + (repo.provider === 'GITHUB' ? 'GitHub' : 'Bitbucket') + '</span>' +
      (repo.autoReview ? '<span class="chip accent" title="New commits are reviewed on their own">automatic</span>' : '') +
      (!repo.hasToken ? '<span class="chip mine" title="Without a token only public repositories can be read, and nothing can be published">no token</span>' : repo.tokenUnreadable ? '<span class="chip badc" title="The stored token cannot be decrypted on this machine: enter it again">token unreadable</span>' : '') +
      '</div>' +
      '<div class="faint mono" style="margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(repo.owner + '/' + repo.slug + '\n' + repo.localPath) + '">' + esc(repo.owner + '/' + repo.slug) + ' · ' + (repo.cloneOk ? '' : '<span class="bad">missing </span>') + esc(home) + '</div>' +
      (readError ? '<div class="bad" style="margin-top:4px" title="' + esc(readError.detail || '') + '">' + esc(readError.message) + (!repo.hasToken ? ' <button class="link" data-act="repo-edit" data-repo="' + esc(repo.id) + '">Add a token</button>' : '') + '</div>' : '') +
      (!repo.cloneOk ? '<div class="bad" style="margin-top:4px">The clone is not at ' + esc(home) + '.</div>' : '') +
      '<div class="row" style="margin-top:8px"><span>' + repo.open + ' open</span><span class="faint">· ' + repo.reviewed + ' reviewed</span>' +
      (repo.reviewed ? '<span class="faint">· ' + repo.findingsPerPr.toFixed(1) + ' findings/PR · ' + money(repo.costPerPr) + '/PR</span>' : '') + '</div>' +
      (debt ? '<div style="margin-top:6px" title="' + repo.debt.pendingReplies + ' replies · ' + repo.debt.unverified + ' unverified · ' + repo.debt.unpublished + ' unpublished"><div class="bar">' +
        '<span style="width:' + (repo.debt.pendingReplies / total * 100) + '%;background:var(--danger)"></span>' +
        '<span style="width:' + (repo.debt.unverified / total * 100) + '%;background:#d9a441"></span>' +
        '<span style="width:' + (repo.debt.unpublished / total * 100) + '%;background:var(--accent)"></span></div>' +
        '<div class="faint" style="font-size:11px;margin-top:2px">' + repo.debt.pendingReplies + ' to answer · ' + repo.debt.unverified + ' to verify · ' + repo.debt.unpublished + ' to publish</div></div>' : '') +
      (oldest ? '<div class="' + (repo.oldestDays > 14 ? 'bad' : 'faint') + '" style="margin-top:4px">Oldest open PR opened ' + oldest + '</div>' : '') +
      '<div class="row" style="margin-top:8px"><button class="btn small primary" data-act="open-prs" data-repo="' + esc(repo.id) + '">Pull requests</button>' +
      '<button class="btn small" data-act="repo-hide" data-repo="' + esc(repo.id) + '" data-hidden="' + (repo.hidden ? '0' : '1') + '">' + (repo.hidden ? 'Show' : 'Hide') + '</button>' +
      '<span class="spacer"></span><span class="faint">' + (repo.fetchedAt ? 'read ' + esc(when(repo.fetchedAt)) : 'never read') + '</span></div></div>';
  }

  function blankForm() {
    return { id: null, name: '', provider: 'BITBUCKET', owner: '', slug: '', localPath: '', token: '', projectKind: '', defaultDepth: '', defaultModel: '', autoReview: false, skipDrafts: true, skipTitles: 'DO NOT MERGE,WIP', skipAuthors: '', onlyTargets: '', replyMode: 'DRAFT', fixMode: 'MANUAL', hasToken: false };
  }

  function drawRepoForm() {
    var f = state.form;
    if (!f) return '<div class="loading">Loading…</div>';
    var editing = Boolean(f.id);
    var depths = state.depths ? state.depths.depths : [];
    var kinds = state.depths ? state.depths.kinds : [];
    function input(field, type, placeholder, disabled) {
      return '<input type="' + type + '" data-form="' + field + '" data-edit="form-' + field + '" value="' + esc(f[field]) + '" placeholder="' + esc(placeholder || '') + '"' + (disabled ? ' disabled' : '') + '>';
    }
    function select(field, options) {
      return '<select data-form="' + field + '">' + options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(f[field] || '') === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    }
    function radio(field, options) {
      return '<div class="radio">' + options.map(function (o) {
        return '<label><input type="radio" name="' + field + '" data-form="' + field + '" value="' + o[0] + '"' + (f[field] === o[0] ? ' checked' : '') + '><span><strong>' + esc(o[1]) + '</strong> <span class="faint">' + esc(o[2]) + '</span></span></label>';
      }).join('') + '</div>';
    }
    var html = '<div class="page form"><div class="row"><button class="btn small" data-act="nav" data-view="repos">← Repositories</button><h2 style="margin:0 0 0 6px">' + (editing ? 'Edit ' + esc(f.name) : 'Add a repository') + '</h2></div>';
    html += '<div class="field"><label>Local clone</label><div><div class="row">' + input('localPath', 'text', '/path/to/the/clone') +
      ' <button class="btn" data-act="form-pick">Choose…</button> <button class="btn" data-act="form-detect"' + busyAttr('form-detect') + '>Read remote</button></div>' +
      '<div class="help">Reviews read this working copy and never write to it. Its <span class="mono">origin</span> has to fetch without a password prompt — for Bitbucket that means SSH.</div></div></div>';
    html += '<div class="field"><label>Name</label><div>' + input('name', 'text', 'How it is called in the app') + '</div></div>';
    html += '<div class="field"><label>Provider</label><div>' + (editing ? '<span>' + (f.provider === 'GITHUB' ? 'GitHub' : 'Bitbucket') + '</span>' : select('provider', [['BITBUCKET', 'Bitbucket'], ['GITHUB', 'GitHub']])) + '</div></div>';
    html += '<div class="field"><label>' + (f.provider === 'BITBUCKET' ? 'Workspace' : 'Owner') + '</label><div>' + input('owner', 'text', '', editing) + '</div></div>';
    html += '<div class="field"><label>Repository slug</label><div>' + input('slug', 'text', '', editing) + (editing ? '<div class="help">Provider, owner and slug are fixed once created: the history belongs to that repository.</div>' : '') + '</div></div>';
    html += '<div class="field"><label>Token</label><div>' + input('token', 'password', editing && f.hasToken ? 'Leave blank to keep the stored token' : '') +
      '<div class="help">' + (f.provider === 'BITBUCKET'
        ? 'An Atlassian API token, sent as Bearer. Reading needs <span class="mono">read:pullrequest:bitbucket</span>; publishing, approving and merging need write.'
        : 'A personal access token with pull request read and write on this repository.') +
      ' Kept encrypted by the system keychain.</div><div class="row" style="margin-top:6px"><button class="btn" data-act="form-test"' + busyAttr('form-test') + '>Test</button>' +
      (state.formTest ? (state.formTest.ok ? '<span class="ok">' + state.formTest.count + ' open PR(s)</span> <span class="faint">' + esc((state.formTest.sample || []).slice(0, 3).join(' · ')) + '</span>' : '<span class="bad">' + esc(state.formTest.error) + '</span>') : '') + '</div></div></div>';

    html += '<div class="section"><h3>Review profile</h3>';
    html += '<div class="field"><label>Depth</label><div>' + select('defaultDepth', [['', 'Automatic — sized from the diff']].concat(depths.map(function (d) { return [d.id, d.label + ' — ' + d.blurb]; }))) + '</div></div>';
    html += '<div class="field"><label>Project kind</label><div>' + select('projectKind', [['', 'Automatic — from the files touched']].concat(kinds.map(function (k) { return [k.id, k.label]; }))) + '</div></div>';
    html += '<div class="field"><label>Model</label><div><input type="text" list="models" data-form="defaultModel" data-edit="form-defaultModel" value="' + esc(f.defaultModel) + '" placeholder="Automatic — the depth\'s model"><datalist id="models"><option value="haiku"><option value="sonnet"><option value="opus"><option value="fable"></datalist></div></div></div>';

    html += '<div class="section"><h3>Automatic review</h3><label class="check"><input type="checkbox" data-form="autoReview"' + (f.autoReview ? ' checked' : '') + '> Review new commits on open PRs on their own</label>' +
      '<div class="help faint" style="margin:4px 0 0 22px">Capped per cycle in Settings. A PR is reviewed once per commit, and nothing it finds is published without you.</div>';
    if (f.autoReview) {
      html += '<div class="field"><label>Skip drafts</label><div><label class="check"><input type="checkbox" data-form="skipDrafts"' + (f.skipDrafts ? ' checked' : '') + '> Draft PRs are not reviewed automatically</label></div></div>';
      html += '<div class="field"><label>Skip titles containing</label><div>' + input('skipTitles', 'text', 'DO NOT MERGE,WIP') + '<div class="help">Comma separated, any case.</div></div></div>';
      html += '<div class="field"><label>Skip authors</label><div>' + input('skipAuthors', 'text', 'dependabot,renovate') + '</div></div>';
      html += '<div class="field"><label>Only targets</label><div>' + input('onlyTargets', 'text', 'main,develop') + '<div class="help">Empty reviews PRs into any branch.</div></div></div>';
    }
    html += '</div>';

    html += '<div class="section"><h3>When someone answers a comment</h3>' + radio('replyMode', [['OFF', 'Only detect', 'the reply shows up; nothing is drafted'], ['DRAFT', 'Draft it and tell me', 'an answer is written for you to check and publish'], ['AUTO', 'Answer automatically', 'the drafted answer is published without asking']]);
    if (f.replyMode === 'AUTO') html += '<div class="banner bad">Automatic answers are published on the PR in your name without you reading them first.</div>';
    html += '</div>';
    html += '<div class="section"><h3>Fixing findings</h3>' + radio('fixMode', [['OFF', 'Off', 'no fix button'], ['MANUAL', 'On request', 'a fix starts when you press Fix'], ['AUTO', 'After every review', 'every open finding is fixed as soon as a review ends']]);
    if (f.fixMode === 'AUTO') html += '<div class="banner bad">Every finished review will spend a run per open finding. Commits stay in the workshop until you hand them back; nothing is pushed.</div>';
    html += '<div class="help faint">A fix is written and committed in a separate copy of the repository, never in your clone.</div></div>';

    if (editing) {
      html += '<div class="section"><h3>Conventions for this repository</h3>' + drawGuidelines(state.formGuidelines, f.id) + '</div>';
    }
    html += '<div class="row" style="margin-top:18px"><button class="btn primary" data-act="form-save"' + busyAttr('form-save') + '>' + (editing ? 'Save' : 'Add repository') + '</button><button class="btn" data-act="nav" data-view="repos">Cancel</button>' +
      (editing ? '<span class="spacer"></span><button class="btn danger" data-act="repo-delete"' + busyAttr('repo-delete') + '>Delete repository…</button>' : '') + '</div></div>';
    return html;
  }

  function drawGuidelines(list, repoId) {
    if (!list) return '<div class="faint">Loading…</div>';
    var scope = repoId || 'global';
    var html = '<div class="help faint" style="margin-bottom:6px">Decisions already taken, given to every review so they are not reported as problems. ' + (repoId ? 'This repository\'s rules win over the global ones.' : 'Global: every repository.') + '</div>';
    list.forEach(function (doc) {
      var key = 'guide-' + doc.id;
      var open = state.edits[key + '-open'];
      html += '<div class="card"><div class="row"><label class="check"><input type="checkbox" data-act="guide-toggle" data-id="' + esc(doc.id) + '"' + (doc.enabled ? ' checked' : '') + '></label><strong>' + esc(doc.name) + '</strong>' +
        (doc.source === 'CLAUDE_MD' ? '<span class="chip">CLAUDE.md</span>' : '') + (doc.stale ? '<span class="chip mine">file changed</span>' : '') +
        '<span class="faint">' + Math.round(doc.content.length / 100) / 10 + 'k chars</span><span class="spacer"></span>' +
        '<button class="btn small" data-act="guide-open" data-id="' + esc(doc.id) + '">' + (open ? 'Close' : 'Edit') + '</button>' +
        '<button class="btn small danger" data-act="guide-delete" data-id="' + esc(doc.id) + '" data-scope="' + esc(scope) + '">Delete</button></div>' +
        (open ? '<textarea rows="12" data-edit="' + key + '" style="margin-top:6px">' + esc(edit(key, doc.content)) + '</textarea><div class="row" style="margin-top:4px"><button class="btn small primary" data-act="guide-save" data-id="' + esc(doc.id) + '" data-scope="' + esc(scope) + '">Save</button></div>' : '') + '</div>';
    });
    var newKey = 'guide-new-' + scope;
    html += '<div class="card"><div class="row"><input type="text" placeholder="Name, e.g. Architecture" data-edit="' + newKey + '-name" value="' + esc(edit(newKey + '-name')) + '" style="flex:1"></div>' +
      '<textarea rows="5" placeholder="Paste or write the conventions" data-edit="' + newKey + '" style="margin-top:6px">' + esc(edit(newKey)) + '</textarea>' +
      '<div class="row" style="margin-top:4px"><button class="btn small primary" data-act="guide-add" data-scope="' + esc(scope) + '">Add</button>' +
      (repoId ? '<button class="btn small" data-act="guide-claude" data-repo="' + esc(repoId) + '">Import CLAUDE.md files</button>' : '') + '</div></div>';
    return html;
  }

  // ---- PR list ---------------------------------------------------------------

  function drawPrList() {
    var list = state.prList;
    if (!list) return '<div class="loading">Loading pull requests…</div>';
    var rows = list.rows.slice();
    var by = {
      OLDEST: function (a, b) { return String(a.pr.createdOn).localeCompare(String(b.pr.createdOn)); },
      NEWEST: function (a, b) { return String(b.pr.createdOn).localeCompare(String(a.pr.createdOn)); },
      STALE: function (a, b) { return String(a.pr.updatedOn).localeCompare(String(b.pr.updatedOn)); },
      ACTIVE: function (a, b) { return String(b.pr.updatedOn).localeCompare(String(a.pr.updatedOn)); }
    }[state.prSort];
    rows.sort(by);
    var html = '<div class="page"><div class="row" style="margin-bottom:8px"><button class="btn small" data-act="nav" data-view="repos">← Repositories</button><h2 style="margin:0 6px">' + esc(list.repo.name) + '</h2>' +
      '<span class="faint mono">' + esc(list.repo.owner + '/' + list.repo.slug) + '</span><span class="spacer"></span>' +
      '<span class="faint">' + (list.fetchedAt ? 'read ' + esc(when(list.fetchedAt)) : '') + '</span>' +
      '<button class="btn small" data-act="prs-refresh"' + busyAttr('prs-refresh') + '>Refresh</button>' +
      '<button class="btn small" data-act="repo-edit" data-repo="' + esc(list.repo.id) + '">Edit</button></div>';
    html += '<div class="row" style="margin-bottom:8px">';
    ['OPEN', 'MERGED', 'DECLINED'].forEach(function (s) {
      html += '<span class="chip click' + (state.prStates.indexOf(s) >= 0 ? ' on' : '') + '" data-act="prs-state" data-state="' + s + '">' + s.toLowerCase() + '</span>';
    });
    html += '<button class="btn small" data-act="prs-history"' + busyAttr('prs-history') + ' title="Merged and declined PRs are only fetched when asked for">Search history</button>';
    html += '<span class="spacer"></span><span class="faint">Sort</span><select data-bind="prs-sort">' + [['OLDEST', 'Oldest first'], ['NEWEST', 'Newest first'], ['STALE', 'Quiet longest'], ['ACTIVE', 'Recently active']].map(function (o) {
      return '<option value="' + o[0] + '"' + (state.prSort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select></div>';
    if (list.readError) html += '<div class="banner bad" title="' + esc(list.readError.detail) + '"><strong>The last read failed ' + esc(when(list.readError.at)) + '.</strong> ' + esc(list.readError.message) + '</div>';
    if (!list.fetchedAt && !rows.length) html += '<div class="empty">This repository has not been read yet. <button class="btn primary" data-act="prs-refresh">Read pull requests</button></div>';
    else html += drawPrTable(rows, false);
    return html + '</div>';
  }

  // ---- one PR ------------------------------------------------------------------

  function drawPr() {
    var v = state.pr;
    if (state.prError && !v) return '<div class="page"><button class="btn small" data-act="back">← Back</button><div class="banner bad">' + esc(state.prError) + '</div><button class="btn" data-act="pr-load">Load from the forge</button></div>';
    if (!v) return '<div class="loading">Loading the pull request…</div>';
    var pr = v.pr;
    var repo = v.repo;
    if (!pr) {
      return '<div class="page"><button class="btn small" data-act="back">← Back</button><div class="empty">PR #' + esc(state.prId) + ' is not loaded yet.<br><button class="btn primary" data-act="pr-load"' + busyAttr('pr-load') + '>Load from ' + (repo.provider === 'GITHUB' ? 'GitHub' : 'Bitbucket') + '</button></div></div>';
    }
    var open = pr.state === 'OPEN';
    var runs = v.running || [];
    var provider = repo.provider === 'GITHUB' ? 'GitHub' : 'Bitbucket';
    // Reading code wants the height: there the header folds to two lines, and the Review tab keeps the whole of it.
    var compact = state.prTab === 'code' || state.prTab === 'commits';
    var html = '<div class="prhead' + (compact ? ' compact' : '') + '"><div class="row">' +
      (compact ? '<strong class="pr-title" title="' + esc(pr.title) + '">#' + pr.id + ' ' + esc(pr.title) + '</strong>' : '') +
      '<span class="chip ' + (open ? 'okc' : pr.state === 'MERGED' ? 'accent' : 'badc') + '">' + esc(pr.state.toLowerCase()) + '</span>' +
      (pr.isDraft ? '<span class="chip">draft</span>' : '') +
      v.approvals.map(function (a) {
        return '<span class="chip ' + (a.state === 'APPROVED' ? 'okc' : 'badc') + '" title="' + esc(a.state === 'APPROVED' ? 'Approved' : 'Requested changes') + (a.byUs ? ' (you)' : '') + '">' + (a.state === 'APPROVED' ? '✓ ' : '✗ ') + esc(a.who) + '</span>';
      }).join('') +
      '<span class="spacer"></span>' +
      (pr.url ? '<button class="btn small" data-act="open-url" data-url="' + esc(pr.url) + '" title="Open the pull request on ' + provider + '">' + provider + ' ↗</button>' : '') +
      '<button class="btn small" data-act="shell" data-where="clone" title="A terminal in the local clone">Terminal</button>' +
      '<button class="btn small" data-act="ask" title="A Claude session briefed on this pull request">Ask Claude</button>' +
      '<button class="btn small" data-act="pr-load"' + busyAttr('pr-load') + ' title="Read the pull request, its stances and its thread again">Reload</button></div>' +
      (compact ? '' : '<h2>#' + pr.id + ' ' + esc(pr.title) + '</h2>') +
      '<div class="faint pr-meta">' + esc(pr.author) + (pr.sourceBranch ? ' · <span class="mono">' + esc(pr.sourceBranch) + ' → ' + esc(pr.targetBranch) + '</span>' : '') + (pr.headSha ? ' · head <span class="mono">' + sha7(pr.headSha) + '</span>' : '') +
      (pr.createdOn ? ' · opened ' + esc(when(pr.createdOn)) : '') + (pr.updatedOn ? ' · updated ' + esc(when(pr.updatedOn)) : '') + '</div>';
    html += drawNextStep(v, compact);
    if (open) html += drawActions(v);
    html += '</div>';
    var counts = {
      review: (v.findings || []).filter(function (f) { return !f.publishedId && !f.dismissedAt && !f.closedAt; }).length,
      conversation: v.threads.filter(function (t) { return t.state === 'NEEDS_ANSWER' || t.state === 'DRAFT_READY'; }).length,
      commits: 0
    };
    html += '<div class="subtabs">' + [['review', 'Review'], ['code', 'Code'], ['commits', 'Commits'], ['conversation', 'Conversation'], ['history', 'History']].map(function (t, i) {
      return '<button class="tab' + (state.prTab === t[0] ? ' on' : '') + '" data-act="pr-tab" data-tab="' + t[0] + '" title="' + (i + 1) + '">' + t[1] + (counts[t[0]] ? '<span class="count">' + counts[t[0]] + '</span>' : '') + '</button>';
    }).join('') + '<span class="spacer"></span>' + (runs.length ? '<span class="chip accent" style="align-self:center"><span class="dot busy"></span>' + runs.length + ' running</span>' : '') +
      '<span class="faint" style="align-self:center;font-size:11px"><span class="kbd">1</span>–<span class="kbd">5</span> tabs · <span class="kbd">Esc</span> back</span></div>';
    if (state.prTab === 'review') html += drawReviewTab(v);
    else if (state.prTab === 'code') html += drawCodeTab(v);
    else if (state.prTab === 'commits') html += drawCommitsTab(v);
    else if (state.prTab === 'conversation') html += drawConversationTab(v);
    else html += drawHistoryTab(v);
    return html;
  }

  /**
   * The one thing to do next, with the button that does it. Everything else on
   * the screen is still there; this is so nobody has to read the readiness list
   * and the merge gate to work out what that is.
   */
  var NEXT_ACTIONS = { 'run-review': 'Review', 'publish-all': 'Publish', 'tab-conversation': 'Open the conversation', verify: 'Verify', 'final-pass': 'Run the final pass', 'merge-open': 'Merge…', load: 'Load' };
  function drawNextStep(v, compact) {
    var step = v.nextStep;
    if (!step) return '';
    var icon = { act: '→', wait: '…', warn: '!', done: '✓' }[step.kind] || '→';
    var button = '';
    if (step.action && step.kind !== 'wait' && step.kind !== 'done') {
      var busyKey = { 'publish-all': 'publish-all', verify: 'verify', 'final-pass': 'final-pass', 'run-review': 'review' }[step.action];
      var attrs = step.action === 'tab-conversation' ? 'data-act="pr-tab" data-tab="conversation"' : 'data-act="' + step.action + '"';
      button = '<button class="btn ' + (compact ? 'small' : 'big') + ' ' + (step.kind === 'warn' ? '' : 'primary') + '" ' + attrs + (busyKey ? busyAttr(busyKey) : '') + '>' + esc(NEXT_ACTIONS[step.action] || 'Go') + '</button>';
    }
    return '<div class="next ' + esc(step.kind) + '"' + (compact && step.detail ? ' title="' + esc(step.detail) + '"' : '') + '><span class="icon">' + icon + '</span><div class="words"><strong>' + esc(step.title) + '</strong><span>' + esc(step.detail || '') + '</span></div>' + button + '</div>';
  }

  function drawActions(v) {
    var ours = v.approvals.filter(function (a) { return a.byUs; })[0];
    var publishedLive = (v.done ? v.findings : []).some(function (f) { return f.publishedId && !f.dismissedAt; });
    var html = '<div class="row" style="margin-top:10px">';
    html += '<span class="group-btns">';
    html += '<button class="btn small" data-act="verify"' + busyAttr('verify') + (publishedLive ? '' : ' disabled') + ' title="Judge each published comment against the new code and the answers">Verify</button>';
    html += '<button class="btn small" data-act="final-pass"' + busyAttr('final-pass') + (v.done ? '' : ' disabled') + ' title="The last look before merging: is there anything that must not go in?">Final pass</button>';
    html += '</span><span class="group-btns">';
    if (ours && ours.state === 'APPROVED') html += '<button class="btn small" data-act="stance" data-stance="unapprove"' + busyAttr('stance') + '>Withdraw approval</button>';
    else html += '<button class="btn small go" data-act="stance" data-stance="approve"' + busyAttr('stance') + '>Approve</button>';
    if (ours && ours.state === 'CHANGES_REQUESTED') html += '<button class="btn small" data-act="stance" data-stance="undoRequestChanges"' + busyAttr('stance') + '>Withdraw change request</button>';
    else html += '<button class="btn small" data-act="stance" data-stance="requestChanges"' + busyAttr('stance') + '>Request changes</button>';
    html += '</span>';
    var r = v.readiness;
    if (r) {
      var left = r.items.filter(function (i) { return !i.done; });
      html += '<span class="readiness" style="margin:0 0 0 4px" title="' + esc(left.map(function (i) { return '• ' + i.label + (i.detail ? ' (' + i.detail + ')' : ''); }).join('\n')) + '"><span class="bar"><span style="width:' + r.percent + '%;background:' + (r.percent === 100 ? 'var(--ok)' : r.percent > 60 ? 'var(--accent)' : '#d9a441') + '"></span></span><strong>' + r.percent + '%</strong>' +
        '<button class="link" data-act="fold" data-key="readiness" style="font-size:11px">' + (isOpen('readiness') ? 'hide' : left.length + ' left') + '</button></span>';
    }
    html += '<span class="spacer"></span><button class="btn small danger" data-act="decline-open">Decline…</button>';
    html += '<button class="btn small ' + (v.mergeBlocker ? '' : 'primary') + '" data-act="merge-open" title="' + esc(v.mergeBlocker || 'Nothing is pending') + '">' + (v.mergeBlocker ? 'Merge anyway…' : 'Merge…') + '</button></div>';
    if (r && isOpen('readiness')) {
      html += '<ul class="check-list">' + r.items.slice().sort(function (a, b) { return Number(a.done) - Number(b.done) || b.weight - a.weight; }).map(function (i) {
        return '<li class="' + (i.done ? 'done' : '') + '">' + esc(i.label) + (i.detail ? ' <span class="faint">' + esc(i.detail) + '</span>' : '') + ' <span class="faint">· ' + i.weight + '</span></li>';
      }).join('') + '</ul>';
    }
    if (state.decline) {
      html += '<div class="card" style="margin-top:8px"><strong>Decline #' + v.pr.id + '</strong><div class="faint">The reason is posted as a comment first; then the PR is closed.</div>' +
        '<textarea rows="3" data-edit="decline-reason" style="margin-top:6px">' + esc(edit('decline-reason')) + '</textarea><div class="row" style="margin-top:6px"><button class="btn danger" data-act="decline"' + busyAttr('decline') + '>Decline</button><button class="btn" data-act="decline-close">Cancel</button></div></div>';
    }
    if (state.merge) {
      var strategy = edit('merge-strategy', v.settings.mergeStrategy || 'MERGE_COMMIT');
      html += '<div class="card" style="margin-top:8px"><strong>Merge #' + v.pr.id + ' into ' + esc(v.pr.targetBranch) + '</strong>' +
        (v.mergeBlocker ? '<div class="banner warn">Merging with something still pending: ' + esc(v.mergeBlocker) + '</div>' : '') +
        '<div class="row" style="margin-top:6px"><span class="faint">Strategy</span><select data-edit-select="merge-strategy">' + [['MERGE_COMMIT', 'Merge commit'], ['SQUASH', 'Squash'], ['FAST_FORWARD', v.repo.provider === 'GITHUB' ? 'Rebase' : 'Fast forward']].map(function (o) {
          return '<option value="' + o[0] + '"' + (strategy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select>' + (v.repo.provider === 'BITBUCKET' ? '<label class="check"><input type="checkbox" data-edit-check="merge-close"' + (edit('merge-close', true) ? ' checked' : '') + '> Close the source branch</label>' : '') + '</div>' +
        '<textarea rows="4" data-edit="merge-message" style="margin-top:6px">' + esc(edit('merge-message', 'Merged in ' + v.pr.sourceBranch + ' (pull request #' + v.pr.id + ')\n\n' + v.pr.title)) + '</textarea>' +
        '<div class="row" style="margin-top:6px"><button class="btn primary" data-act="merge"' + busyAttr('merge') + '>Merge</button><button class="btn" data-act="merge-close">Cancel</button></div></div>';
    }
    return html;
  }

  /** A finding nobody has to act on any more: dismissed, closed, or verified fixed. */
  function findingDone(f) {
    return Boolean(f.dismissedAt || f.closedAt || (f.publishedId && (f.resolution === 'RESOLVED' || f.resolution === 'WONT_FIX')));
  }

  function findingStatus(f) {
    var res = f.resolution ? RESOLUTION_LABELS[f.resolution] : null;
    return (f.publishedId ? '<span class="chip okc">published</span>' : '') + (f.dismissedAt ? '<span class="chip">dismissed</span>' : '') + (f.closedAt && !f.dismissedAt ? '<span class="chip okc">closed</span>' : '') +
      (res ? '<span class="chip ' + res[1] + '" title="' + esc(f.resolutionNote || '') + '">' + res[0] + '</span>' : f.publishedId && !f.closedAt && !f.dismissedAt ? '<span class="chip mine">not verified</span>' : '');
  }

  function findingCard(f, v) {
    var settled = Boolean(f.publishedId || f.dismissedAt || f.closedAt);
    var fix = (v.fixes || []).filter(function (x) { return x.findingId === f.id; })[0];
    var fixing = (v.running || []).some(function (run) { return run.kind === 'fix' && run.findingId === f.id; });
    var fixOn = v.repo.fixMode !== 'OFF' && v.pr.state === 'OPEN';
    // What is finished folds to one line, so what is still open is what the eye lands on.
    if (findingDone(f) && !isOpen('f-' + f.id)) {
      return '<div class="finding-line" data-act="fold" data-key="f-' + esc(f.id) + '" title="Show the whole finding"><span class="sev ' + esc(f.severity) + '">' + esc(f.severity) + '</span><span class="t">' + esc(f.title) + '</span>' +
        (fix && fix.sha ? '<span class="chip okc">✔ ' + sha7(fix.sha) + '</span>' : '') + findingStatus(f) + '</div>';
    }
    var html = '<div class="finding' + (findingDone(f) ? ' settled' : '') + '"><div class="meta"><span class="sev ' + esc(f.severity) + '">' + esc(f.severity) + '</span>' +
      (f.category ? '<span class="chip">' + esc(CATEGORY_LABELS[f.category] || f.category) + '</span>' : '') +
      (f.askedBy ? '<span class="chip accent">asked by ' + esc(f.askedBy) + '</span>' : '') +
      (f.filePath ? '<button class="link mono" data-act="jump" data-file="' + esc(f.filePath) + '" data-line="' + (f.lineNo || '') + '" title="Open it in the diff">' + anchor(f.filePath, f.lineNo) + '</button>' : '') +
      '<span class="spacer"></span>' + findingStatus(f) +
      (findingDone(f) ? '<button class="more" data-act="fold" data-key="f-' + esc(f.id) + '">fold</button>' : '') +
      '</div><div class="ftitle">' + esc(f.title) + '</div>';
    var editing = state.edits['finding-open-' + f.id];
    if (editing) {
      html += '<input type="text" data-edit="finding-title-' + f.id + '" value="' + esc(edit('finding-title-' + f.id, f.title)) + '" style="width:100%;box-sizing:border-box">' +
        '<textarea rows="5" data-edit="finding-body-' + f.id + '" style="margin-top:4px">' + esc(edit('finding-body-' + f.id, f.body)) + '</textarea>' +
        '<div class="faint" style="margin-top:4px">How it could be fixed</div><textarea rows="3" data-edit="finding-sugg-' + f.id + '">' + esc(edit('finding-sugg-' + f.id, f.suggestion || '')) + '</textarea>' +
        '<div class="row" style="margin-top:4px"><button class="btn small primary" data-act="finding-save" data-id="' + esc(f.id) + '">Save</button><button class="btn small" data-act="finding-edit" data-id="' + esc(f.id) + '">Cancel</button></div>';
    } else {
      var text = md(f.body) + (f.suggestion ? '<div class="suggestion"><div class="faint">How it could be fixed</div>' + md(f.suggestion) + '</div>' : '');
      html += clamped('body-' + f.id, text, String(f.body).length + String(f.suggestion || '').length > 520);
    }
    html += verdictHtml(f.resolutionNote);
    if (f.publishError) html += '<div class="banner bad">Publishing failed: ' + esc(f.publishError) + '</div>';
    html += '<div class="row" style="margin-top:6px">';
    if (v.pr.state === 'OPEN' && !settled) {
      html += '<button class="btn small primary" data-act="publish-finding" data-id="' + esc(f.id) + '"' + busyAttr('publish-' + f.id) + ' title="Post it on the PR, on its file and line">' + (f.publishError ? 'Retry publish' : 'Publish') + '</button>';
      html += '<button class="btn small" data-act="dismiss" data-id="' + esc(f.id) + '" data-on="1" title="Keep it here and never post it">Dismiss</button>';
      if (!editing) html += '<button class="btn small" data-act="finding-edit" data-id="' + esc(f.id) + '">Edit</button>';
    }
    if (f.dismissedAt) html += '<button class="btn small" data-act="dismiss" data-id="' + esc(f.id) + '" data-on="0">Undo dismiss</button>';
    if (f.publishedUrl) html += '<button class="btn small" data-act="open-url" data-url="' + esc(f.publishedUrl) + '">View on PR ↗</button>';
    if (fixOn) {
      if (fixing) html += '<span class="chip accent"><span class="dot busy"></span>fixing</span>';
      else if (fix && fix.state === 'COMMITTED') {
        html += '<span class="chip okc" title="' + esc(fix.summary || '') + '">✔ ' + sha7(fix.sha) + (fix.returnedAt ? ' handed back' : ' in the workshop') + '</span>';
        if (!fix.replyId) html += '<button class="btn small" data-act="retry-fix-reply" data-id="' + esc(fix.id) + '"' + busyAttr('fixreply-' + fix.id) + ' title="' + esc(fix.replyError || '') + '">Answer the thread</button>';
      } else if (fix && fix.state === 'NOTHING' && !f.closedAt) {
        html += '<span class="chip" title="' + esc(fix.summary || '') + '">nothing to change</span><button class="btn small" data-act="fix" data-id="' + esc(f.id) + '">Try again</button>';
      } else if (fix && fix.state === 'FAILED' && !f.closedAt) {
        html += '<span class="chip badc" title="' + esc(fix.error || '') + '">fix failed</span><button class="btn small" data-act="fix" data-id="' + esc(f.id) + '">Retry fix</button>';
      } else if (!f.closedAt && !f.dismissedAt && f.resolution !== 'RESOLVED') {
        html += '<button class="btn small go" data-act="fix" data-id="' + esc(f.id) + '" title="Write the fix in a separate copy of the repository and commit it there">Fix</button>';
      }
    }
    html += '<span class="spacer"></span><button class="btn small" data-act="ask" data-finding="' + esc(f.id) + '" title="A Claude session briefed on this finding">Ask Claude</button></div>';
    if (fix && fix.state === 'NOTHING' && fix.summary) html += '<div class="faint" style="margin-top:4px">Fix: ' + esc(fix.summary) + '</div>';
    if (fix && fix.state === 'FAILED' && fix.error) html += '<div class="faint bad" style="margin-top:4px">Fix: ' + esc(fix.error.slice(0, 300)) + '</div>';
    return html + '</div>';
  }

  /**
   * The Review tab, in the order work is done: the findings first, then who else
   * asked for something, then how the review ran, the verdicts, the workshop and
   * the general comment — each folded to a line when there is nothing to do in it.
   */
  function drawReviewTab(v) {
    var review = v.review;
    var done = v.done;
    var open = v.pr.state === 'OPEN';
    var runs = (v.running || []).filter(function (run) { return run.kind !== 'fix' && run.kind !== 'reply'; });
    var reviewing = runs.some(function (run) { return run.kind === 'review'; });
    var html = '<div class="page">';
    if (runs.length) html += drawRuns(runs, false);

    // --- what the author says the PR is: open until there is a review to read instead
    var description = String(v.pr.description || '').trim();
    html += fold('pr-description', '<strong>Description</strong>', description ? esc(description.replace(/\s+/g, ' ').slice(0, 140)) : 'The author left no description.',
      description ? '<div class="md pr-description">' + md(description) + '</div>' : '<div class="faint">The author left no description.</div>', !done && Boolean(description), 'pr-description-fold');

    // --- findings
    var findings = v.findings || [];
    if (done || findings.length) {
      var waiting = findings.filter(function (f) { return !f.publishedId && !f.dismissedAt && !f.closedAt; });
      var notes = (v.notes || []).filter(function (n) { return !n.publishedId; });
      var openOnes = findings.filter(function (f) { return !findingDone(f); });
      var closedOnes = findings.filter(findingDone);
      var fixable = findings.filter(function (f) { return !f.closedAt && !f.dismissedAt && f.resolution !== 'RESOLVED'; });
      var filter = state.findingFilter || (openOnes.length ? 'open' : 'all');
      var shown = filter === 'open' ? openOnes : filter === 'publish' ? waiting : filter === 'closed' ? closedOnes : findings;
      html += '<div class="section-title"><h3>Findings</h3><span class="faint">' + findings.length + ' · ' + findings.filter(function (f) { return f.publishedId; }).length + ' published</span></div>';
      html += '<div class="row" style="margin-bottom:8px">' + [['open', 'Open', openOnes.length], ['publish', 'To publish', waiting.length], ['closed', 'Done', closedOnes.length], ['all', 'All', findings.length]].map(function (o) {
        return '<span class="chip click' + (filter === o[0] ? ' on' : '') + '" data-act="finding-filter" data-filter="' + o[0] + '">' + o[1] + ' ' + o[2] + '</span>';
      }).join('') + '<span class="spacer"></span>';
      if (open && (waiting.length || notes.length)) html += '<button class="btn small primary" data-act="publish-all"' + busyAttr('publish-all') + ' title="Every finding still waiting, then every note">Publish ' + (waiting.length + notes.length) + ' inline</button>';
      if (open && v.repo.fixMode !== 'OFF' && fixable.length > 1) html += '<button class="btn small go" data-act="fix-all"' + busyAttr('fix-all') + ' title="One after another, in the workshop">Fix all ' + fixable.length + '</button>';
      html += '</div>';
      if (!findings.length) html += '<div class="card faint">This review found nothing worth reporting.</div>';
      else if (!shown.length) html += '<div class="card faint">Nothing here. <button class="link" data-act="finding-filter" data-filter="all">Show all findings</button></div>';
      else html += shown.map(function (f) { return findingCard(f, v); }).join('');
    }

    // --- requests from others
    if (v.foreign && v.foreign.length && open) {
      var unanswered = v.foreign.filter(function (req) { return req.needsAnswer && !req.adoptedFindingId; }).length;
      html += fold('foreign', '<strong>Requests from others</strong><span class="count">' + v.foreign.length + '</span>' + (unanswered ? '<span class="chip mine">' + unanswered + ' unanswered</span>' : ''),
        esc(v.foreign.map(function (req) { return req.author; }).filter(function (a, i, all) { return all.indexOf(a) === i; }).join(', ')),
        v.foreign.map(function (req) {
          return '<div class="finding"><div class="meta"><strong>' + esc(req.author) + '</strong>' + (req.filePath ? '<button class="link mono" data-act="jump" data-file="' + esc(req.filePath) + '" data-line="' + (req.lineNo || '') + '">' + anchor(req.filePath, req.lineNo) + '</button>' : '') +
            '<span class="faint">' + esc(when(req.at)) + '</span>' + (req.needsAnswer ? '<span class="chip mine">unanswered</span>' : '') + '<span class="spacer"></span>' +
            (req.adoptedFindingId ? '<span class="chip accent">adopted</span>' : v.repo.fixMode !== 'OFF' && v.done ? '<button class="btn small go" data-act="adopt" data-comment="' + esc(req.commentId) + '"' + busyAttr('adopt-' + req.commentId) + ' title="Take it on as a finding and fix it; the answer goes in their thread">Fix it</button>' : '') + '</div>' +
            clamped('req-' + req.commentId, md(req.body), String(req.body).length > 520) + (req.entries.length ? '<div class="entries">' + req.entries.map(entryHtml).join('') + '</div>' : '') + '</div>';
        }).join(''), unanswered > 0);
    }

    // --- running a review
    if (open) {
      var p = state.reviewProfile;
      var depths = state.depths ? state.depths.depths : [];
      var kinds = state.depths ? state.depths.kinds : [];
      var profileLabel = (p.depth === 'AUTO' ? 'automatic depth' : (depths.filter(function (d) { return d.id === p.depth; })[0] || {}).label + ' depth') + ' · ' + (p.kind === 'AUTO' ? 'automatic kind' : (kinds.filter(function (k) { return k.id === p.kind; })[0] || {}).label);
      var body = '<div class="row"><span class="faint" style="width:44px">Depth</span>' + [{ id: 'AUTO', label: 'Auto', blurb: 'Sized from the diff' }].concat(depths).map(function (d) {
        return '<span class="chip click' + (p.depth === d.id ? ' on' : '') + '" data-act="profile" data-field="depth" data-value="' + d.id + '" title="' + esc(d.blurb || '') + '">' + esc(d.label) + (d.model ? ' · ' + d.model : '') + '</span>';
      }).join('') + '</div><div class="row" style="margin-top:6px"><span class="faint" style="width:44px">Kind</span>' + [{ id: 'AUTO', label: 'Auto' }].concat(kinds).map(function (k) {
        return '<span class="chip click' + (p.kind === k.id ? ' on' : '') + '" data-act="profile" data-field="kind" data-value="' + k.id + '">' + esc(k.label) + '</span>';
      }).join('') + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="run-review"' + (reviewing || state.busy.review ? ' disabled aria-busy="true"' : '') + '>' + (reviewing ? 'Reviewing' : done ? 'Review what is new' : 'Review') + '</button>' +
        (done ? '<button class="btn" data-act="run-review" data-full="1"' + (reviewing ? ' disabled' : '') + ' title="The whole branch, not only what arrived since the last review">Review everything again</button>' : '') +
        '<span class="faint">' + (v.repo.defaultDepth || v.repo.projectKind || v.repo.defaultModel ? 'Repository default: ' + esc([v.repo.defaultDepth, v.repo.projectKind, v.repo.defaultModel].filter(Boolean).join(' · ').toLowerCase()) : 'Nothing is published until you say so.') + '</span></div>';
      if (state.confirmRerun) {
        var c = state.confirmRerun;
        body += '<div class="banner warn">This commit was already reviewed ' + esc(when(c.createdAt)) + ': ' + c.findings + ' finding(s), ' + money(c.costUsd) + '. Nothing new arrived since, so another review looks at the same code again.' +
          '<div class="row" style="margin-top:6px"><button class="btn small primary" data-act="run-review" data-confirmed="1">Review it again</button><button class="btn small" data-act="rerun-cancel">Cancel</button></div></div>';
      }
      html += fold('run', '<strong>' + (done ? 'Review again' : 'Review this pull request') + '</strong>', esc(profileLabel), body, !done || Boolean(state.confirmRerun));
    }

    // --- how the last review went: the newest one that ended, failed or not — a failed re-review is news
    var last = (v.reviews || []).filter(function (r) { return r.status !== 'RUNNING'; })[0] || review;
    if (last) {
      var failed = last.status === 'FAILED' || last.status === 'CANCELLED';
      var summary = [last.depth ? last.depth.toLowerCase() : '', last.model, last.sinceSha ? 'only new commits' : '', when(last.finishedAt || last.createdAt), last.costUsd ? money(last.costUsd) : ''].filter(Boolean).join(' · ');
      html += fold('last-review', statusChip(last.status) + '<strong>Last review, of ' + sha7(last.headSha) + '</strong>' + (last.trigger === 'AUTO' ? '<span class="chip">automatic</span>' : ''), esc(summary),
        '<div class="faint">' + esc(summary) + (last.tokensIn ? ' · ' + tokens((last.tokensIn || 0) + (last.tokensOut || 0)) + ' tokens' : '') + (last.accountName ? ' · ' + esc(last.accountName) : '') + '</div>' +
        (last.planReason ? '<div class="faint" style="margin-top:3px">' + esc(last.planReason) + '</div>' : '') +
        (failed ? '<div class="banner bad">' + esc(last.error || 'It did not finish.') + '</div>' : '') +
        (last.deniedTools ? '<div class="banner warn">Ran with tools denied: ' + esc(last.deniedTools) + '</div>' : '') +
        (done && done.id !== last.id ? '<div class="faint" style="margin-top:4px">The findings above are from the last finished review, ' + esc(when(done.finishedAt)) + '.</div>' : ''), failed);
    } else if (!runs.length && !open) {
      html += '<div class="empty">Never reviewed.</div>';
    }
    if (done && done.resolutionSummary) {
      html += fold('verification', '<strong>Verification</strong><span class="faint">against ' + sha7(done.resolutionHead) + ' · ' + esc(when(done.resolutionAt)) + '</span>', esc(String(done.resolutionSummary).replace(/\s+/g, ' ').slice(0, 140)), md(done.resolutionSummary), false);
    }
    if (done && done.finalPassSummary) {
      html += fold('final-pass', '<strong>Final pass</strong>' + (done.finalPassBlockers ? '<span class="chip badc">' + done.finalPassBlockers + ' blocker(s)</span>' : '<span class="chip okc">nothing blocks</span>') + '<span class="faint">on ' + sha7(done.finalPassHead) + (v.finalPassDone ? '' : ' — the PR moved since') + '</span>',
        esc(String(done.finalPassSummary).replace(/\s+/g, ' ').slice(0, 140)), md(done.finalPassSummary), done.finalPassBlockers > 0 && v.finalPassDone, done.finalPassBlockers ? 'bad' : '');
    }

    // --- the workshop
    var ws = v.workshop;
    if (ws && (ws.exists || (v.fixes || []).length)) {
      var wsBody = '<div class="faint mono" style="font-size:11px">' + esc(ws.dir) + '</div>' +
        '<div class="row" style="margin-top:6px">' + (ws.pendingReturn ? '<button class="btn small primary" data-act="give-back"' + busyAttr('give-back') + ' title="Push the workshop commits into your clone, on ' + esc(v.pr.sourceBranch) + '. Your clone must not have that branch checked out.">Hand ' + ws.pendingReturn + ' back to the clone</button>' : '<span class="faint">Nothing waiting to be handed back.</span>') +
        (ws.exists ? '<button class="btn small" data-act="shell" data-where="workshop">Terminal in the workshop</button><span class="spacer"></span><button class="btn small danger" data-act="discard-workshop"' + busyAttr('discard') + '>Discard…</button>' : '') + '</div>' +
        ((v.fixes || []).length ? '<table class="list" style="margin-top:6px">' + v.fixes.slice(0, 20).map(function (fix) {
          var finding = findings.filter(function (f) { return f.id === fix.findingId; })[0];
          return '<tr><td>' + statusChip(fix.state === 'COMMITTED' ? 'DONE' : fix.state) + '</td><td>' + esc(finding ? finding.title : 'a finding from an earlier review') + (fix.summary ? '<div class="faint">' + esc(fix.summary.slice(0, 200)) + '</div>' : '') + (fix.error ? '<div class="bad">' + esc(fix.error.slice(0, 200)) + '</div>' : '') + '</td>' +
            '<td class="mono">' + sha7(fix.sha) + '</td><td class="faint">' + (fix.returnedAt ? 'handed back' : fix.state === 'COMMITTED' ? 'in the workshop' : '') + (fix.replyUrl ? ' · answered' : fix.replyError ? ' · <span class="bad">not answered</span>' : '') + '</td><td class="faint">' + esc(when(fix.createdAt)) + '</td></tr>';
        }).join('') + '</table>' : '');
      html += fold('workshop', '<strong>Fix workshop</strong>' + (ws.pendingReturn ? '<span class="chip mine">' + ws.pendingReturn + ' to hand back</span>' : ''), (v.fixes || []).length + ' fix attempt(s)', wsBody, ws.pendingReturn > 0);
    }

    // --- the general comment
    if (done && done.body != null) {
      var key = 'body-' + done.id;
      html += fold('general', '<strong>General comment</strong>' + (done.publishedUrl ? '<span class="chip okc">published</span>' : '<span class="chip">draft</span>'), done.publishedUrl ? 'Published. Open to post it again.' : 'One comment with every finding, as an alternative to publishing them inline.',
        '<textarea rows="10" data-edit="' + key + '">' + esc(edit(key, done.body)) + '</textarea><div class="row" style="margin-top:6px">' +
        (open ? '<button class="btn small primary" data-act="publish-review" data-id="' + esc(done.id) + '"' + busyAttr('publish-review') + '>' + (done.publishedUrl ? 'Publish again' : 'Publish comment') + '</button>' : '') +
        '<button class="btn small" data-act="save-body" data-id="' + esc(done.id) + '">Save draft</button>' +
        (done.publishedUrl ? '<button class="btn small" data-act="open-url" data-url="' + esc(done.publishedUrl) + '">View published ↗</button>' : '') + '</div>', false);
    }
    return html + '</div>';
  }

  function entryHtml(entry) {
    return message(entry.author, entry.at, entry.body, entry.ours);
  }

  /** What verification concluded about a finding, set apart from the finding itself. */
  function verdictHtml(note) {
    return note ? '<div class="verdict"><div class="verdict-label">Verification</div>' + md(note) + '</div>' : '';
  }

  /**
   * A published finding opens with its own title in bold, which the card has
   * already said above it: the second copy goes.
   */
  function withoutTitle(body, title) {
    var text = String(body || '');
    var first = text.split('\n')[0].trim();
    var bare = first.replace(/^#+\s*/, '').replace(/^\*\*(.*)\*\*$/, '$1').replace(/`/g, '').trim();
    return title && bare === String(title).replace(/`/g, '').trim() ? text.slice(text.indexOf('\n') + 1).replace(/^\s+/, '') : text;
  }

  // ---- code ----------------------------------------------------------------------

  function loadFiles(fetch) {
    // Every answer below writes into this PR's code state only: `go` replaces the object when the PR changes.
    var code = state.code;
    code.loading = true;
    call('viewed', { repoId: state.repoId, prId: state.prId }).then(function (r) { if (state.code !== code) return; code.viewed = r.files; draw(); }, function () {});
    return call('files', { repoId: state.repoId, prId: state.prId, fetch: Boolean(fetch) }).then(function (r) {
      if (state.code !== code) return;
      state.code.files = r.files;
      state.code.error = null;
