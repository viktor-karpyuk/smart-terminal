      if (!l) return '<td class="n ' + which + ' empty"></td><td class="m empty"></td><td class="c empty"></td>';
      var cls = l.kind === 'ADDED' ? ' add' : l.kind === 'REMOVED' ? ' del' : '';
      return numCell(l, which).replace('<td class="n ' + which + '"', '<td class="n ' + which + cls + '"') + '<td class="m' + cls + '">' + marker(l.kind) + '</td><td class="c' + cls + '">' + codeOf(l, which) + '</td>';
    };
    while (k < items.length) {
      var item = items[k];
      if (item.type === 'gap') { unknown(); html += opts.expandable ? gapRow(item) : ''; k++; continue; }
      if (item.type === 'hunk') { unknown(); html += hunkRow(item); k++; continue; }
      if (item.type === 'meta') { html += '<tr class="META"><td colspan="6">' + esc(item.text) + '</td></tr>'; k++; continue; }
      if (item.l.kind === 'CONTEXT') {
        var c = item.l;
        var focusC = state.code.focusLine && c.newNo === state.code.focusLine && opts.anchors;
        html += '<tr class="CONTEXT' + (c.expanded ? ' expanded' : '') + (focusC ? ' focus' : '') + '" data-new="' + c.newNo + '">' + side(c, 'old') + side(c, 'new') + '</tr>' + anchorRow(c.newNo);
        k++;
        continue;
      }
      var removed = [];
      var added = [];
      while (k < items.length && items[k].type === 'line' && items[k].l.kind === 'REMOVED') removed.push(items[k++].l);
      while (k < items.length && items[k].type === 'line' && items[k].l.kind === 'ADDED') added.push(items[k++].l);
      for (var r = 0; r < Math.max(removed.length, added.length); r++) {
        var right = added[r];
        var focusR = right && state.code.focusLine && right.newNo === state.code.focusLine && opts.anchors;
        html += '<tr class="pair' + (focusR ? ' focus' : '') + '"' + (right ? ' data-new="' + right.newNo + '"' : '') + '>' + side(removed[r], 'old') + side(right, 'new') + '</tr>';
        if (right) html += anchorRow(right.newNo);
      }
    }
    return html + '</table>';
  }

  /* ------------------------------------------------------------------ *
   * What hangs under a line: findings, notes, and the PR's threads
   * ------------------------------------------------------------------ */

  /** Initials in a colour of their own, the same for the same name everywhere. */
  var ICON_CMT = '<svg class="ico" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 2.5h10a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 13 11.5H8l-3.2 2.6c-.3.2-.8 0-.8-.4v-2.2H3A1.5 1.5 0 0 1 1.5 10V4A1.5 1.5 0 0 1 3 2.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

  function avatar(name, ours) {
    var text = String(name || '?');
    var parts = text.replace(/\(.*\)/, '').trim().split(/\s+/);
    var initials = ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    var hash = 0;
    for (var i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
    return '<span class="avatar' + (ours ? ' ours' : '') + '" style="--hue:' + (hash % 360) + '" title="' + esc(text) + '">' + esc(initials) + '</span>';
  }

  /** Every reply under a comment, in order, however deep. */
  function repliesUnder(commentId, comments) {
    var byParent = {};
    comments.forEach(function (c) { if (c.parentId && !c.deleted) (byParent[c.parentId] = byParent[c.parentId] || []).push(c); });
    var out = [];
    var walk = function (id) { (byParent[id] || []).sort(function (a, b) { return String(a.createdOn).localeCompare(String(b.createdOn)); }).forEach(function (c) { out.push(c); walk(c.commentId); }); };
    walk(commentId);
    return out;
  }

  function message(author, at, body, ours, extra) {
    return '<div class="cmt-msg">' + avatar(author, ours) + '<div class="cmt-main"><div class="cmt-who"><strong>' + esc(author) + '</strong>' + (ours ? '<span class="chip accent">you</span>' : '') +
      '<span class="faint">' + esc(when(at)) + '</span>' + (extra || '') + '</div>' + clamped('msg-' + author + at, md(body), String(body).length > 700) + '</div></div>';
  }

  /** The reply box of a thread: a button until it is wanted, then a box. Only on an open PR. */
  function replyBox(commentId, v) {
    if (v.pr.state !== 'OPEN' || !commentId) return '';
    var key = 'rep-' + commentId;
    if (state.edits[key] == null) return '<div class="cmt-reply"><button class="reply-open" data-act="reply-open" data-id="' + esc(commentId) + '">Reply…</button></div>';
    return '<div class="cmt-reply open"><textarea rows="3" data-edit="' + esc(key) + '" placeholder="Write a reply. It is posted on the pull request, in this thread.">' + esc(state.edits[key]) + '</textarea>' +
      '<div class="row" style="margin-top:6px"><button class="btn small primary" data-act="reply-send" data-id="' + esc(commentId) + '"' + busyAttr('reply-' + commentId) + '>Reply</button><button class="btn small" data-act="reply-cancel" data-id="' + esc(commentId) + '">Cancel</button><span class="faint">Markdown</span></div></div>';
  }

  /** A card that folds to its first line: a thread nobody is reading does not have to take the screen. */
  function card(key, cls, head, summary, body) {
    var folded = isOpen(key, false);
    return '<div class="cmt ' + cls + (folded ? ' folded' : '') + '"><div class="cmt-head" data-act="fold" data-key="' + esc(key) + '" title="' + (folded ? 'Unfold' : 'Fold') + '">' + head +
      (folded ? '<span class="cmt-summary">' + esc(summary) + '</span>' : '<span class="spacer"></span>') + '<span class="caret' + (folded ? '' : ' open') + '"></span></div>' + (folded ? '' : body) + '</div>';
  }

  function findingInCode(f, v) {
    var comments = v.comments || [];
    var root = f.publishedId ? comments.filter(function (c) { return c.commentId === f.publishedId; })[0] : null;
    var chain = f.publishedId ? repliesUnder(f.publishedId, comments) : [];
    var status = (f.publishedId ? '<span class="chip okc">published</span>' : f.dismissedAt ? '<span class="chip">dismissed</span>' : '<span class="chip mine">draft</span>') +
      (f.resolution && RESOLUTION_LABELS[f.resolution] ? '<span class="chip ' + RESOLUTION_LABELS[f.resolution][1] + '">' + RESOLUTION_LABELS[f.resolution][0] + '</span>' : '');
    var head = '<span class="sev ' + esc(f.severity) + '">' + esc(f.severity) + '</span>' + (f.category ? '<span class="chip">' + esc(CATEGORY_LABELS[f.category] || f.category) + '</span>' : '') +
      '<strong class="cmt-title">' + titleHtml(f.title) + '</strong>' + status + (chain.length ? '<span class="chip">' + chain.length + ' repl' + (chain.length === 1 ? 'y' : 'ies') + '</span>' : '');
    var body = '<div class="cmt-body">' + clamped('code-' + f.id, md(f.body), String(f.body).length > 700) +
      (f.suggestion ? '<div class="suggestion"><div class="faint">How it could be fixed</div>' + md(f.suggestion) + '</div>' : '') +
      verdictHtml(f.resolutionNote) + '</div>';
    if (root) body = '<div class="cmt-body faint" style="padding-bottom:0">Posted by ' + esc(root.author) + ' ' + esc(when(root.createdOn)) + (f.publishedUrl ? ' · <button class="link" data-act="open-url" data-url="' + esc(f.publishedUrl) + '">view on the PR ↗</button>' : '') + '</div>' + body;
    body += chain.map(function (c) { return message(c.author, c.createdOn, c.body, c.ours); }).join('');
    if (!f.publishedId && !f.dismissedAt && v.pr.state === 'OPEN') {
      body += '<div class="cmt-actions"><button class="btn small primary" data-act="publish-finding" data-id="' + esc(f.id) + '"' + busyAttr('publish-' + f.id) + '>Publish</button><button class="btn small" data-act="dismiss" data-id="' + esc(f.id) + '" data-on="1">Dismiss</button>' +
        (v.repo.fixMode !== 'OFF' ? '<button class="btn small go" data-act="fix" data-id="' + esc(f.id) + '">Fix</button>' : '') + '<span class="spacer"></span><button class="btn small" data-act="ask" data-finding="' + esc(f.id) + '">Ask Claude</button></div>';
    } else if (f.publishedId) {
      body += replyBox(f.publishedId, v);
    }
    return card('cf-' + f.id, 'finding-card sev-' + esc(f.severity), head, f.body.split('\n')[0], body);
  }

  function noteInCode(n, v) {
    var key = 'note-' + n.id;
    var head = '<span class="chip accent">note</span><strong class="cmt-title">Your note</strong>' + (n.publishedId ? '<span class="chip okc">published</span>' : '<span class="chip mine">not published</span>');
    var body = n.publishedId
      ? '<div class="cmt-body">' + md(n.body) + '</div>' + replyBox(n.publishedId, v)
      : '<div class="cmt-body"><textarea rows="3" data-edit="' + key + '" data-note="' + esc(n.id) + '">' + esc(edit(key, n.body)) + '</textarea></div>' +
        '<div class="cmt-actions"><button class="btn small primary" data-act="publish-note" data-id="' + esc(n.id) + '"' + busyAttr('note-' + n.id) + '>Publish</button><button class="btn small danger" data-act="delete-note" data-id="' + esc(n.id) + '">Delete</button></div>';
    return card('cn-' + n.id, 'note-card', head, n.body.split('\n')[0], body);
  }

  function threadInCode(root, v) {
    var chain = repliesUnder(root.commentId, v.comments || []);
    var head = avatar(root.author, root.ours) + '<strong class="cmt-title">' + esc(root.author) + '</strong><span class="faint">' + esc(when(root.createdOn)) + '</span>' +
      (chain.length ? '<span class="chip">' + chain.length + ' repl' + (chain.length === 1 ? 'y' : 'ies') + '</span>' : '');
    var body = '<div class="cmt-body">' + clamped('thr-' + root.commentId, md(root.body), String(root.body).length > 700) + '</div>' +
      chain.map(function (c) { return message(c.author, c.createdOn, c.body, c.ours); }).join('') + replyBox(root.commentId, v);
    return card('ct-' + root.commentId, 'thread-card' + (root.ours ? ' ours' : ''), head, String(root.body).split('\n')[0], body);
  }

  function noteComposer(file, line) {
    var key = 'newnote-' + file + '-' + (line || 'file');
    return '<div class="cmt note-card composing"><div class="cmt-head"><span class="chip accent">note</span><strong class="cmt-title">New note on ' + anchor(file, line) + '</strong><span class="spacer"></span></div>' +
      '<div class="cmt-body"><textarea rows="3" data-edit="' + esc(key) + '" placeholder="Kept here until you publish it.">' + esc(edit(key)) + '</textarea></div>' +
      '<div class="cmt-actions"><button class="btn small primary" data-act="add-note" data-file="' + esc(file) + '" data-line="' + (line || '') + '">Save note</button><button class="btn small" data-act="note-cancel">Cancel</button></div></div>';
  }

  /** A file's header: where it is, what happened to it, how much, and the view's controls. */
  function diffHeader(v, file) {
    var files = state.code.files || [];
    var index = files.map(function (f) { return f.path; }).indexOf(file);
    var info = files[index] || { added: 0, deleted: 0, status: 'M' };
    var cut = file.lastIndexOf('/');
    var status = { A: ['added', 'New file'], D: ['deleted', 'Deleted'], R: ['renamed', 'Renamed' + (info.from ? ' from ' + info.from : '')], C: ['renamed', 'Copied'], M: ['modified', 'Modified'] }[info.status] || ['modified', 'Modified'];
    var total = info.added + info.deleted;
    var boxes = '';
    for (var b = 0; b < 5; b++) {
      var green = total ? Math.round((info.added / total) * 5) : 0;
      boxes += '<i class="' + (b < green ? 'a' : total ? 'd' : '') + '"></i>';
    }
    var anchored = codeAnchors(v);
    var here = (v.findings || []).filter(function (f) { return f.filePath === file; }).length + (v.comments || []).filter(function (c) { return c.inlinePath === file && !c.parentId && !c.deleted; }).length;
    var viewed = (state.code.viewed || []).indexOf(file) >= 0;
    var layout = diffLayout();
    return '<div class="file-head">' +
      '<div class="file-row">' +
        '<button class="btn small" data-act="step-file" data-dir="-1"' + (index <= 0 ? ' disabled' : '') + ' title="Previous file ( [ )">‹</button>' +
        '<span class="status-badge ' + status[0] + '" title="' + esc(status[1]) + '">' + esc(info.status || 'M') + '</span>' +
        '<span class="file-path" title="' + esc(file) + '">' + (cut >= 0 ? '<span class="faint">' + esc(file.slice(0, cut + 1)) + '</span>' : '') + '<strong>' + esc(file.slice(cut + 1)) + '</strong></span>' +
        '<span class="stat-num added">+' + info.added + '</span><span class="stat-num removed">−' + info.deleted + '</span><span class="stat-boxes">' + boxes + '</span>' +
        '<span class="spacer"></span><span class="faint" style="white-space:nowrap;flex:none">' + (index + 1) + ' / ' + files.length + '</span>' +
        '<button class="btn small" data-act="step-file" data-dir="1"' + (index < 0 || index >= files.length - 1 ? ' disabled' : '') + ' title="Next file ( ] )">›</button>' +
      '</div>' +
      '<div class="file-row tools-row">' +
        (anchored.length ? '<span class="seg"><button class="btn small" data-act="step-finding" data-dir="-1" title="Previous finding ( p )">↑</button><span class="faint">' + anchored.length + ' finding' + (anchored.length === 1 ? '' : 's') + '</span><button class="btn small" data-act="step-finding" data-dir="1" title="Next finding ( n )">↓</button></span>' : '') +
        '<button class="btn small' + (state.code.hideComments ? '' : ' on') + '" data-act="toggle-comments" title="Show or hide the comments between the lines ( c )">' + ICON_CMT + here + '</button>' +
        '<span class="seg toggle"><button class="btn small' + (layout === 'unified' ? ' on' : '') + '" data-act="layout" data-layout="unified" title="One column">Unified</button><button class="btn small' + (layout === 'split' ? ' on' : '') + '" data-act="layout" data-layout="split" title="Old and new side by side">Split</button></span>' +
        '<button class="btn small' + (wrapLines() ? ' on' : '') + '" data-act="toggle-wrap" title="Wrap long lines, or scroll them sideways">Wrap</button>' +
        '<span class="seg"><button class="btn small" data-act="font" data-delta="-1" title="Smaller text">A−</button><span class="faint">' + diffFont() + '</span><button class="btn small" data-act="font" data-delta="1" title="Larger text">A+</button></span>' +
        '<span class="spacer"></span>' +
        '<button class="btn small" data-act="note-file" data-file="' + esc(file) + '" title="A note on the whole file. For a line, click its number.">+ Note</button>' +
        '<button class="btn small' + (viewed ? ' go' : '') + '" data-act="toggle-viewed" data-file="' + esc(file) + '" title="Mark this file as looked at and go to the next one not viewed ( Enter, or v ). The mark lives here, not on the forge — Bitbucket and GitHub keep their own, and neither offers a way to set it.">' + (viewed ? '✓ Viewed' : 'Viewed') + '</button>' +
      '</div></div>';
  }

  function drawDiff(v, file, lines) {
    var findings = (v.findings || []).filter(function (f) { return f.filePath === file; });
    var notes = (v.notes || []).filter(function (n) { return n.filePath === file; });
    var published = {};
    findings.forEach(function (f) { if (f.publishedId) published[f.publishedId] = true; });
    notes.forEach(function (n) { if (n.publishedId) published[n.publishedId] = true; });
    // A thread that is a finding's or a note's own comment is drawn inside that card, not twice.
    var threads = (v.comments || []).filter(function (c) { return c.inlinePath === file && !c.parentId && !c.deleted && !published[c.commentId]; });
    var group = function (list, key) { var m = {}; list.forEach(function (x) { if (x[key]) (m[x[key]] = m[x[key]] || []).push(x); }); return m; };
    var fByLine = group(findings, 'lineNo');
    var nByLine = group(notes, 'lineNo');
    var tByLine = group(threads, 'inlineLine');
    var present = {};
    lines.forEach(function (l) { if (l.newNo) present[l.newNo] = true; });
    var hide = state.code.hideComments;
    var dots = {};
    [findings, notes].forEach(function (list) { list.forEach(function (x) { if (x.lineNo) dots[x.lineNo] = (dots[x.lineNo] || 0) + 1; }); });
    threads.forEach(function (t) { if (t.inlineLine) dots[t.inlineLine] = (dots[t.inlineLine] || 0) + 1; });
    var anchors = function (newNo) {
      var cards = (fByLine[newNo] || []).map(function (f) { return findingInCode(f, v); })
        .concat((nByLine[newNo] || []).map(function (n) { return noteInCode(n, v); }))
        .concat((tByLine[newNo] || []).map(function (t) { return threadInCode(t, v); }));
      if (state.code.noteAt && state.code.noteAt.line === newNo) cards.push(noteComposer(file, newNo));
      if (hide && !(state.code.noteAt && state.code.noteAt.line === newNo)) return '';
      return cards.join('');
    };
    var html = diffHeader(v, file);
    // What has no line in this diff — the whole file, or a line the diff does not show — goes on top.
    var loose = findings.filter(function (f) { return !f.lineNo || !present[f.lineNo]; }).map(function (f) { return findingInCode(f, v); })
      .concat(notes.filter(function (n) { return !n.lineNo || !present[n.lineNo]; }).map(function (n) { return noteInCode(n, v); }))
      .concat(threads.filter(function (t) { return !t.inlineLine || !present[t.inlineLine]; }).map(function (t) { return threadInCode(t, v); }));
    if (state.code.noteAt && state.code.noteAt.line == null) loose.push(noteComposer(file, null));
    if (loose.length && !hide) html += '<div class="loose"><div class="faint loose-title">On the file, or on lines this diff does not show</div>' + loose.join('') + '</div>';
    var info = (state.code.files || []).filter(function (f) { return f.path === file; })[0];
    return html + diffTable(lines, { file: file, status: info && info.status, anchors: anchors, noteable: true, expandable: true, layout: diffLayout(), dots: hide ? dots : null });
  }

  // ---- commits ----------------------------------------------------------------------

  function loadCommits() {
    var commits = state.commits;
    return call('commits', { repoId: state.repoId, prId: state.prId }).then(function (r) {
      if (state.commits !== commits) return;
      commits.data = r; commits.error = null; draw();
    }, function (error) { if (state.commits !== commits) return; commits.error = error.message; draw(); });
  }

  function drawCommitsTab(v) {
    var c = state.commits;
    if (c.error) return '<div class="page"><div class="banner bad">' + esc(c.error) + '</div></div>';
    if (!c.data) return '<div class="loading">Reading commits…</div>';
    var d = c.data;
    var html = '<div class="split"' + splitStyle() + '><aside>';
    if (d.note) html += '<div class="banner warn" style="margin:8px;font-size:11.5px">' + esc(d.note) + '</div>';
    if (!d.commits.length && !d.local.length) html += '<div class="empty" style="padding:16px">No commits between <span class="mono">' + esc(state.pr && state.pr.pr ? state.pr.pr.targetBranch : 'the target') + '</span> and <span class="mono">' + esc(d.branch) + '</span>.</div>';
    if (d.local.length) {
      html += '<div class="group">In your clone, not on origin</div><div style="padding:4px 10px"><button class="btn small primary" data-act="push"' + busyAttr(prKey('push')) + '>Push to origin/' + esc(d.branch) + '</button></div>' +
        d.local.map(function (commit) { return commitItem(commit, true); }).join('');
    }
    html += '<div class="group">The pull request · ' + d.commits.length + '</div>';
    d.commits.forEach(function (commit, index) {
      if (d.sinceReview !== null && index === d.sinceReview) html += '<div class="group" style="color:var(--accent)">↑ ' + index + ' since the review</div>';
      html += commitItem(commit, false);
    });
    html += '</aside>' + gutter() + '<section>';
    if (!c.sha) html += '<div class="empty">Choose a commit.</div>';
    else {
      var commit = d.local.concat(d.commits).filter(function (x) { return x.sha === c.sha; })[0];
      html += '<div style="padding:8px 12px;border-bottom:1px solid var(--border)"><strong>' + esc(commit ? commit.subject : '') + '</strong><div class="faint mono">' + esc(c.sha) + ' · ' + esc(commit ? commit.author + ' · ' + commit.date : '') + '</div>' +
        (commit && commit.body ? '<div class="md" style="white-space:pre-wrap;margin-top:4px">' + esc(commit.body) + '</div>' : '') + '</div>';
      if (!c.files) html += '<div class="loading">Loading…</div>';
      else {
        html += '<div style="padding:6px 12px" class="row">' + c.files.map(function (file) {
          return '<span class="chip click' + (c.file === file.path ? ' on' : '') + '" data-act="commit-file" data-file="' + esc(file.path) + '">' + esc(file.path.split('/').pop()) + ' <span class="added">+' + file.added + '</span> <span class="removed">−' + file.deleted + '</span></span>';
        }).join('') + '</div>';
        if (c.file && c.lines) html += diffTable(c.lines, { file: c.file, layout: diffLayout() });
      }
    }
    return html + '</section></div>';
  }

  function commitItem(commit, local) {
    // Two lines: what the commit says, then who and when — the second is what tells a fixup from the work.
    return '<div class="item commit-item' + (state.commits.sha === commit.sha ? ' on' : '') + '" data-act="commit" data-sha="' + esc(commit.sha) + '">' +
      '<div class="commit-text"><span class="p" title="' + esc(commit.subject) + '">' + titleHtml(commit.subject) + '</span>' +
      '<span class="commit-meta"><span class="mono ' + (local ? 'warn' : '') + '">' + sha7(commit.sha) + '</span>' + (commit.author ? ' · ' + esc(commit.author) : '') + (commit.date ? ' · ' + esc(commit.date) : '') + '</span></div></div>';
  }

  // ---- conversation ------------------------------------------------------------------

  function drawConversationTab(v) {
    var threads = v.threads;
    var open = v.pr.state === 'OPEN';
    var pendingReplies = (v.replies || []).filter(function (r) { return r.status !== 'PUBLISHED' && !r.dismissedAt; });
    // Whose turn it is decides the filter: an answer owed or a fix to judge is yours; unverified and unpublished wait on the author or on you later.
    var yours = threads.filter(function (t) { return t.state === 'NEEDS_ANSWER' || t.state === 'DRAFT_READY' || t.state === 'NOT_FIXED'; });
    var waiting = threads.filter(function (t) { return t.state === 'UNVERIFIED' || t.state === 'UNPUBLISHED'; });
    var shut = threads.filter(function (t) { return t.state === 'OK'; });
    var left = threads.filter(function (t) { return t.state !== 'OK'; });
    var filter = state.threadFilter || (open && yours.length ? 'yours' : open && waiting.length ? 'waiting' : 'all');
    if (!open && (filter === 'yours' || filter === 'waiting')) filter = 'left';
    if (open && filter === 'left') filter = 'all';
    var shown = filter === 'yours' ? yours : filter === 'waiting' ? waiting : filter === 'left' ? left : filter === 'closed' ? shut : threads;
    var html = '<div class="page"><div class="section-title"><h3>Threads</h3><span class="faint">' + (threads.length - shut.length) + ' open of ' + threads.length + '</span></div>';
    html += '<div class="row" style="margin-bottom:8px">' + (open ? [['yours', 'Your turn', yours.length], ['waiting', 'Waiting', waiting.length]] : [['left', 'Left open', left.length]]).concat([['closed', 'Closed', shut.length], ['all', 'All', threads.length]]).map(function (o) {
      return '<span class="chip click' + (filter === o[0] ? ' on' : '') + '" data-act="thread-filter" data-filter="' + o[0] + '">' + o[1] + ' ' + o[2] + '</span>';
    }).join('') + '<span class="spacer"></span>';
    if (open && pendingReplies.length) html += '<button class="btn small primary" data-act="draft-all"' + busyAttr(prKey('draft-all')) + ' title="Claude drafts an answer to every reply from the code; nothing is published">Draft ' + pendingReplies.length + ' answer' + (pendingReplies.length === 1 ? '' : 's') + '</button><button class="btn small" data-act="dismiss-all-replies">Dismiss all replies</button>';
    html += '</div>';
    if (!threads.length) html += '<div class="empty">No findings, so no threads yet.</div>';
    else if (!shown.length) html += '<div class="card faint">Nothing here. <button class="link" data-act="thread-filter" data-filter="all">Show every thread</button></div>';
    shown.forEach(function (t) {
      var label = THREAD_LABELS[t.state] || [t.state, ''];
      // On a PR that is closed nobody's turn is coming: what was still open is only what was left open.
      if (!open && t.state !== 'OK') label = ['Left open', ''];
      var draft = t.draft;
      if (t.state === 'OK' && !isOpen('t-' + t.findingId)) {
        html += '<div class="finding-line sev-' + esc(t.severity) + '" data-act="fold" data-key="t-' + esc(t.findingId) + '" title="Show the thread"><span class="chip ' + label[1] + '">' + label[0] + '</span><span class="sev ' + esc(t.severity) + '">' + esc(t.severity) + '</span><span class="t">' + titleHtml(t.title) + '</span><span class="faint">' + t.entries.length + ' repl' + (t.entries.length === 1 ? 'y' : 'ies') + '</span></div>';
        return;
      }
      html += '<div class="finding sev-' + esc(t.severity) + (t.state === 'OK' ? ' settled' : '') + '"><div class="meta"><span class="chip ' + label[1] + '">' + label[0] + '</span><span class="sev ' + esc(t.severity) + '">' + esc(t.severity) + '</span>' +
        (t.filePath ? '<button class="link mono" data-act="jump" data-file="' + esc(t.filePath) + '" data-line="' + (t.lineNo || '') + '">' + anchor(t.filePath, t.lineNo) + '</button>' : '') +
        (t.askedBy ? '<span class="chip accent">asked by ' + esc(t.askedBy) + '</span>' : '') + '<span class="spacer"></span>' +
        (t.waitingDays != null ? '<span class="faint">waiting ' + t.waitingDays + 'd</span>' : '') + '</div>' +
        '<div class="ftitle">' + titleHtml(t.title) + '</div>' + clamped('q-' + t.findingId, md(withoutTitle(t.question, t.title)), String(t.question).length > 520) +
        verdictHtml(t.resolutionNote) +
        (t.entries.length ? '<div class="entries">' + t.entries.map(entryHtml).join('') + '</div>' : '');
      if (draft && draft.status !== 'PUBLISHED' && !draft.dismissedAt && open) {

        /*
         * Which answer is being drafted, by its id.

        html += '<div class="card" style="margin-top:6px"><div class="row"><strong>Answer to ' + esc(draft.theirAuthor) + '</strong>' + (draft.status === 'FAILED' ? '<span class="chip badc" title="' + esc(draft.error || '') + '">drafting failed</span>' : '') + '<span class="spacer"></span>' +
          (drafting ? '<span class="chip accent"><span class="dot busy"></span>drafting</span>' : '<button class="btn small" data-act="draft-reply" data-id="' + esc(draft.id) + '">' + (draft.body ? 'Draft again' : 'Draft with Claude') + '</button>') + '</div>' +
          '<textarea rows="4" data-edit="' + key + '" placeholder="Write the answer, or let Claude draft it from the code">' + esc(edit(key, draft.body || '')) + '</textarea>' +
          '<div class="row" style="margin-top:4px"><button class="btn small primary" data-act="publish-reply" data-id="' + esc(draft.id) + '"' + busyAttr('reply-' + draft.id) + '>Publish answer</button>' +
          '<button class="btn small" data-act="save-reply" data-id="' + esc(draft.id) + '">Save</button><button class="btn small" data-act="dismiss-reply" data-id="' + esc(draft.id) + '">Dismiss</button></div></div>';
      }
      html += '<div class="row" style="margin-top:6px">';
      // A question that was never asked cannot be settled in conversation: it is published or dismissed.
      if (open && t.state === 'UNPUBLISHED' && t.findingId) html += '<button class="btn small primary" data-act="publish-finding" data-id="' + esc(t.findingId) + '"' + busyAttr('publish-' + t.findingId) + '>Publish</button><button class="btn small" data-act="dismiss" data-id="' + esc(t.findingId) + '" data-on="1">Dismiss</button>';
      else if (open && t.state !== 'OK' && t.findingId) html += settleBox(t.findingId) + '<button class="btn small" data-act="close-thread" data-id="' + esc(t.findingId) + '" data-on="1" title="Close it without saying why. Settled… records the reason, which is what anybody reading this later needs.">Close thread</button>';

  // ---- history ----------------------------------------------------------------------

  function drawHistoryTab(v) {
    var events = [];
    if (v.pr.createdOn) events.push({ at: v.pr.createdOn, who: v.pr.author, kind: 'opened', text: 'Opened the pull request' + (v.pr.sourceBranch ? ': ' + v.pr.sourceBranch + ' → ' + v.pr.targetBranch : '') });
    (v.reviews || []).forEach(function (r) { events.push({ at: r.createdAt, who: r.trigger === 'AUTO' ? 'automatic' : 'you', kind: 'review', text: 'Review ' + (r.status || '').toLowerCase() + (r.sinceSha ? ' (incremental)' : '') + (r.costUsd ? ' · ' + money(r.costUsd) : '') + (r.error ? ' — ' + r.error.slice(0, 160) : '') }); });
    (v.publications || []).forEach(function (p) { events.push({ at: p.publishedAt, who: 'you', kind: 'published', text: p.reviewId ? 'General comment published' : 'Reply published: ' + String(p.body || '').replace(/\s+/g, ' ').slice(0, 160) }); });
    (v.comments || []).forEach(function (cm) { events.push({ at: cm.createdOn, who: cm.author, kind: cm.ours ? 'our comment' : cm.parentId ? 'reply' : 'comment', text: (cm.inlinePath ? cm.inlinePath + (cm.inlineLine ? ':' + cm.inlineLine : '') + ' — ' : '') + String(cm.body).replace(/\s+/g, ' ').slice(0, 220) }); });
    (v.notes || []).forEach(function (n) { events.push({ at: n.createdAt, who: 'you', kind: 'note', text: n.filePath + ' — ' + String(n.body).slice(0, 160) }); });
    (v.fixes || []).forEach(function (f) { events.push({ at: f.createdAt, who: 'fix', kind: 'fix ' + String(f.state).toLowerCase(), text: (f.sha ? f.sha.slice(0, 7) + ' ' : '') + (f.summary || f.error || '').slice(0, 200) }); });
    var authors = {};
    events.forEach(function (e) { authors[e.who] = true; });
    events = events.filter(function (e) { return e.at && !isNaN(parseTime(e.at)) && (!state.historyAuthor || e.who === state.historyAuthor); }).sort(function (a, b) { return parseTime(b.at) - parseTime(a.at); });
    var html = '<div class="page timeline"><div class="row"><span class="faint">Author</span><select data-bind="history-author"><option value="">Everyone</option>' + Object.keys(authors).sort().map(function (a) {
      return '<option' + (state.historyAuthor === a ? ' selected' : '') + '>' + esc(a) + '</option>';
    }).join('') + '</select></div>';
    var current = '';
    events.forEach(function (e) {
      // In the viewer's own clock: the stored times are UTC, and an evening belongs to its own day.
      var local = new Date(parseTime(e.at));
      var d = local.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
      if (d !== current) { current = d; html += '<div class="day">' + esc(d) + '</div>'; }
      html += '<div class="ev"><span class="faint mono">' + esc(local.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false })) + '</span><span class="dim">' + esc(e.who) + ' · ' + esc(e.kind) + '</span><span>' + esc(e.text) + '</span></div>';
    });
    if (!events.length) html += '<div class="empty">Nothing happened here yet.</div>';
    return html + '</div>';
  }

  /**

  /* ------------------------------------------------------------------ *

  function openPr(repoId, prId) {
    var same = state.view === 'pr' && state.repoId === repoId && state.prId === Number(prId);
    if (!same) { state.findingFilter = null; state.threadFilter = null; Object.keys(state.folds).forEach(function (key) { if (key !== 'readiness' && key.indexOf('dash-') !== 0 && key !== 'read-errors') delete state.folds[key]; }); }
    go('pr', { repoId: repoId, prId: Number(prId), prTab: same ? state.prTab : 'review', backTo: state.view === 'pr' ? state.backTo : state.view === 'prs' ? 'prs' : 'dashboard' });
  }

  /*
   * Keys, for the things done over and over: back out of a pull request, move
   * between its tabs, search the board. Never while typing.
   */
  document.addEventListener('keydown', function (event) {
    var target = event.target;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT')) {
      if (event.key === 'Escape') target.blur();
      return;
    }
    if (event.key === '?') { event.preventDefault(); toggleKeys(); return; }
    if (event.key === 'Escape' && $('keys')) { event.preventDefault(); toggleKeys(false); return; }
    if (state.view === 'pr') {
      if (event.key === 'Escape') { event.preventDefault(); actions.back(); return; }
      var tab = ['review', 'code', 'commits', 'conversation', 'history'][Number(event.key) - 1];
      if (tab) { event.preventDefault(); actions['pr-tab']({ getAttribute: function () { return tab; } }); return; }
    }
    if (state.view === 'pr' && state.prTab === 'code') {
      // A focused button or link takes its own Enter; this is for Enter with nothing in particular focused.
      if (event.key === 'Enter' && state.code.file && !(target && (target.tagName === 'BUTTON' || target.tagName === 'A' || target.isContentEditable))) {
        event.preventDefault(); viewedAndOn(state.code.file); return;
      }
      if (event.key === ']') { event.preventDefault(); stepFile(1); return; }
      if (event.key === '[') { event.preventDefault(); stepFile(-1); return; }
      if (event.key === 'n') { event.preventDefault(); stepFinding(1); return; }
      if (event.key === 'p') { event.preventDefault(); stepFinding(-1); return; }
      if (event.key === 'c') { event.preventDefault(); actions['toggle-comments'](); return; }
      if (event.key === 'v' && state.code.file) { event.preventDefault(); actions['toggle-viewed']({ getAttribute: function () { return state.code.file; } }); return; }
    }
    if (state.view === 'dashboard' && event.key === '/') {
      var search = $('dash-search');
      if (search) { event.preventDefault(); search.focus(); }
    }
  });

  /** Every shortcut on one card, so they can be found without reading the source. `?` opens and closes it. */
  var KEYS = [
    ['Anywhere', [['?', 'This list'], ['/', 'Search the board']]],

    commit: function (el) {
      var sha = el.getAttribute('data-sha');
      state.commits.sha = sha; state.commits.files = null; state.commits.file = null; state.commits.lines = null; draw();
      var commits = state.commits;
      call('commitFiles', { repoId: state.repoId, sha: sha }).then(function (r) {
        if (state.commits !== commits || commits.sha !== sha) return;
        state.commits.files = r.files; draw();
        if (r.files.length) actions['commit-file']({ getAttribute: function () { return r.files[0].path; } });
      }, fail);
    },
    'commit-file': function (el) {
      var file = el.getAttribute('data-file');
      var sha = state.commits.sha;
      state.commits.file = file; state.commits.lines = null; draw();
      var commits = state.commits;
      call('commitDiff', { repoId: state.repoId, sha: sha, file: file }).then(function (r) { if (state.commits === commits && commits.sha === sha && commits.file === file) { commits.lines = r.lines; draw(); } }, fail);
    },
    'draft-reply': function (el) { var id = el.getAttribute('data-id'); delete state.edits['reply-' + id]; act('draft-' + id, function () { return call('draftReply', { replyId: id }); }); },
    'draft-all': function () { act(prKey('draft-all'), function () { return call('draftAll', prArgs()); }, function (r) { say(r.drafted + ' drafted' + (r.failed ? ', ' + r.failed + ' failed' : '') + '.', r.failed > 0); }); },
    'save-reply': function (el) { var id = el.getAttribute('data-id'); call('saveReplyDraft', { replyId: id, body: edit('reply-' + id) }).then(function () { delete state.edits['reply-' + id]; say('Saved.'); }, fail); },
    'publish-reply': function (el) {
      var id = el.getAttribute('data-id');
      var draft = (state.pr.replies || []).filter(function (r) { return r.id === id; })[0];
      act('reply-' + id, function () { return call('publishReply', { replyId: id, body: edit('reply-' + id, draft && draft.body) }); }, function () { delete state.edits['reply-' + id]; say('Answer published.'); });
    },
    'dismiss-reply': function (el) { call('dismissReply', { replyId: el.getAttribute('data-id') }).catch(fail); },
    'dismiss-all-replies': function () { call('dismissAllReplies', prArgs()).catch(fail); },
    'settle-open': function (el) { state.edits['settle-' + el.getAttribute('data-id')] = ''; draw(); },
    'settle-close': function (el) { delete state.edits['settle-' + el.getAttribute('data-id')]; draw(); },
    settle: function (el) {
      var id = el.getAttribute('data-id');
      var on = el.getAttribute('data-on') !== '0';
      act('settle-' + id, function () {
        return call('settleFinding', { findingId: id, settled: on, note: on ? edit('settle-' + id, '') : '' });
      }, function () {
        delete state.edits['settle-' + id];
        say(on ? 'Settled. It no longer counts against this PR.' : 'Back on the list.');
        load();
      });
    },
    'close-thread': function (el) { call('closeFinding', { findingId: el.getAttribute('data-id'), closed: el.getAttribute('data-on') === '1' }).catch(fail); },
    'follow-open': function (el) {
      var id = el.getAttribute('data-id');
      call('followUpText', { findingId: id }).then(function (r) { state.edits['follow-' + id] = r.text; draw(); }, fail);
    },
    'follow-cancel': function (el) { delete state.edits['follow-' + el.getAttribute('data-id')]; draw(); },
    'follow-send': function (el) {
      var id = el.getAttribute('data-id');
      act('follow-' + id, function () { return call('followUp', { findingId: id, body: state.edits['follow-' + id] }); }, function () { delete state.edits['follow-' + id]; say('Reminder sent.'); });
    },
    'keys-close': function () { toggleKeys(false); },
    'keys-open': function () { toggleKeys(true); },
    'retry-start': function () { $('main').innerHTML = '<div class="loading">Loading…</div>'; start(); },
    // Through call(): the host answers a failure as {ok:false}, which a bare .catch never sees.
    shell: function (el) { call('shell', prArgs({ where: el.getAttribute('data-where') })).catch(fail); },
    ask: function (el) { call('ask', prArgs({ findingId: el.getAttribute('data-finding') || undefined })).catch(fail); },
    'use-me': function (el) {
      call('saveSettings', { settings: { me: el.getAttribute('data-name') } }).then(function (r) { state.settings = r.settings; if (state.overview) state.overview.settings = r.settings; say('Saved.'); draw(); }, fail);
    },
    'auto-now': function () { call('autoRunNow').then(function () { say('Sweeping.'); }, fail); },
    'import-pick': function (el) { state.importPick[el.getAttribute('data-id')] = el.checked; },
    'import-run': function () {
      var ids = state.importInfo.repos.filter(function (repo) { return state.importPick[repo.id] !== false && !repo.localOnly; }).map(function (repo) { return repo.id; });
      if (!ids.length) return say('Nothing selected.', true);
      act('import', function () { return call('importRun', { repoIds: ids }); }, function (r) { state.importReport = r.report; loadOverview().then(draw, fail); });
    }
  };

  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el || el.hasAttribute('disabled')) return;
    var name = el.getAttribute('data-act');
    if (el.tagName === 'INPUT' && el.type === 'checkbox' && name !== 'guide-toggle' && name !== 'import-pick' && name !== 'toggle-viewed') return;
    var handler = actions[name];
    if (!handler) return;
    if (el.tagName !== 'INPUT') event.preventDefault();
    handler(el);
  });

  document.addEventListener('input', function (event) {
    var el = event.target;
    var key = el.getAttribute('data-edit');
    if (key) state.edits[key] = el.value;
    var formField = el.getAttribute('data-form');
    if (formField && state.form && el.type !== 'radio' && el.type !== 'checkbox') state.form[formField] = el.value;
    // Mid-composition (a dead key, an IME) the text is not final, and a redraw would lose it.
    if (!event.isComposing) filterInput(el);
  });

  document.addEventListener('compositionend', function (event) { filterInput(event.target); });

  function filterInput(el) {
    if (el.getAttribute('data-bind') === 'dash-text') { state.dashFilter.text = el.value; draw(); }
    if (el.getAttribute('data-bind') === 'code-filter') { state.code.filter = el.value; draw(); }
  }

  document.addEventListener('focusout', function () {
    setTimeout(function () { if (state.drawPending && !typing()) draw(); }, 0);
  });

  document.addEventListener('change', function (event) {
    var el = event.target;
    var formField = el.getAttribute('data-form');
    if (formField && state.form) {
      if (el.type === 'checkbox') state.form[formField] = el.checked;
      else state.form[formField] = el.value;
      if (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT') draw();
    }
    var setting = el.getAttribute('data-setting');
    if (setting) {
      var value = el.type === 'checkbox' ? el.checked : el.value;
      var patch = {};
      patch[setting] = value;
      call('saveSettings', { settings: patch }).then(function (r) { state.settings = r.settings; if (state.overview) state.overview.settings = r.settings; delete state.edits['set-' + setting]; say('Saved.'); draw(); }, fail);
    }
    if (el.getAttribute('data-edit-select')) { state.edits[el.getAttribute('data-edit-select')] = el.value; }
    if (el.getAttribute('data-edit-check')) { state.edits[el.getAttribute('data-edit-check')] = el.checked; }
    if (el.getAttribute('data-bind') === 'prs-sort') { state.prSort = el.value; remember(); draw(); }
    if (el.getAttribute('data-bind') === 'history-author') { state.historyAuthor = el.value; draw(); }
  });

  /* ------------------------------------------------------------------ *
   * What the app tells the panel
   * ------------------------------------------------------------------ */

  var activityTimer = null;
  host.on('review', function (event) {
    if (!event) return;
    if (event.type === 'activity') {
      var run = event.run;
      if (run.done) delete state.activity[run.key]; else state.activity[run.key] = run;
      if (state.view === 'pr' && state.pr && run.repoId === state.repoId && run.prId === state.prId) {
        state.pr.running = runningList().filter(function (r) { return r.repoId === state.repoId && r.prId === state.prId; });
      }
      if (state.view === 'dashboard' && state.dashboard) state.dashboard.stats.running = runningList().length;
      if (!activityTimer) activityTimer = setTimeout(function () { activityTimer = null; drawQuietly(); }, 250);
      if (run.done) scheduleReload();
      return;
    }
    if (event.type === 'changed') {
      if (state.view === 'pr') { if (event.repoId === state.repoId && (event.prId == null || event.prId === state.prId)) scheduleReload(); }
      else if (state.view === 'prs') { if (event.repoId === state.repoId) scheduleReload(); }
      else if (state.view === 'dashboard' || state.view === 'repos') scheduleReload();
      return;
    }
    if (event.type === 'bus') { if (state.view === 'bus') scheduleReload(); return; }
    if (event.type === 'auto') { state.auto = event.status; drawTop(); if (state.view === 'dashboard' && !event.status.running) scheduleReload(); return; }
    if (event.type === 'repos' || event.type === 'settings') { loadOverview().then(function () { if (state.view !== 'repoForm') scheduleReload(); else draw(); }, fail); }
  });

  host.on('showing', function (payload) {
    state.showing = !payload || payload.showing !== false;
    if (state.showing && !state.started) start();
  });

  host.on('context', function (payload) {
    var saved = payload && payload.resume;
    if (saved) {
      if (saved.view && saved.view !== 'repoForm' && saved.view !== 'import') state.view = saved.view;
      if (saved.repoId) state.repoId = saved.repoId;
      if (saved.prId) state.prId = saved.prId;
      if (saved.prTab) state.prTab = saved.prTab;
      if (saved.prSort) state.prSort = saved.prSort;
      if (saved.dashFilter) state.dashFilter = saved.dashFilter;
      if (saved.codeFile && state.view === 'pr') state.code.file = saved.codeFile;
    }
    if (payload && payload.showing === false) state.showing = false;
    if (state.showing) start();
  });

  function start() {
    if (state.started) return;
    state.started = true;
    if ((state.view === 'pr' || state.view === 'prs') && !state.repoId) state.view = 'dashboard';
    loadOverview().then(function () { draw(); return load(); }).catch(function (error) {
      // Not started after all: the next time the panel is shown, it tries again.
      state.started = false;
      $('main').innerHTML = '<div class="page"><div class="banner bad">The Code Reviewer did not answer: ' + esc(error.message) + '</div><button class="btn" data-act="retry-start">Try again</button></div>';
    });
  }

  host.ready();
})();
</script>
