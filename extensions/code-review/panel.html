    var threads = (v.comments || []).filter(function (cm) { return cm.inlinePath === file && !cm.parentId && !cm.deleted; });
    var replies = {};
    (v.comments || []).forEach(function (cm) { if (cm.parentId) { (replies[cm.parentId] = replies[cm.parentId] || []).push(cm); } });
    var at = function (list, key) { var m = {}; list.forEach(function (x) { var n = x[key]; if (n) (m[n] = m[n] || []).push(x); }); return m; };
    var fByLine = at(findings, 'lineNo');
    var nByLine = at(notes, 'lineNo');
    var tByLine = at(threads, 'inlineLine');
    var shown = {};
    lines.forEach(function (l) { if (l.newNo) shown[l.newNo] = true; });
    var outside = findings.filter(function (f) { return !f.lineNo || !shown[f.lineNo]; });
    var outsideThreads = threads.filter(function (t) { return !t.inlineLine || !shown[t.inlineLine]; });
    var html = '<div style="padding:6px 10px;border-bottom:1px solid var(--border)" class="row"><strong class="mono">' + esc(file) + '</strong><span class="spacer"></span><span class="faint">Click a line number to leave a note</span>' +
      '<button class="btn small" data-act="note-file" data-file="' + esc(file) + '">Note on the file</button></div>';
    if (outside.length || outsideThreads.length) {
      html += '<div style="padding:6px 10px">' + outside.map(function (f) { return anchorBlock(f, 'finding', v); }).join('') + outsideThreads.map(function (t) { return threadBlock(t, replies); }).join('') + '</div>';
    }
    if (state.code.noteAt && state.code.noteAt.line == null) html += '<div style="padding:6px 10px">' + noteForm(file, null) + '</div>';
    html += '<table class="diff">';
    lines.forEach(function (l) {
      var focus = state.code.focusLine && l.newNo === state.code.focusLine;
      if (l.kind === 'HUNK' || l.kind === 'META') {
        if (l.kind === 'META' && !l.text) return;
        html += '<tr class="' + l.kind + '"><td colspan="3">' + esc(l.text) + '</td></tr>';
        return;
      }
      html += '<tr class="' + l.kind + (focus ? ' focus' : '') + '"' + (l.newNo ? ' data-new="' + l.newNo + '"' : '') + '><td class="n" ' + (l.newNo ? 'data-act="note-line" data-file="' + esc(file) + '" data-line="' + l.newNo + '"' : '') + '>' + (l.oldNo || '') + '</td>' +
        '<td class="n" ' + (l.newNo ? 'data-act="note-line" data-file="' + esc(file) + '" data-line="' + l.newNo + '"' : '') + '>' + (l.newNo || '') + '</td><td class="c">' + esc(l.text) + '</td></tr>';
      if (l.newNo) {
        var blocks = (fByLine[l.newNo] || []).map(function (f) { return anchorBlock(f, 'finding', v); })
          .concat((nByLine[l.newNo] || []).map(function (n) { return anchorBlock(n, 'note', v); }))
          .concat((tByLine[l.newNo] || []).filter(function (t) { return !findings.some(function (f) { return f.publishedId === t.commentId; }); }).map(function (t) { return threadBlock(t, replies); }));
        if (state.code.noteAt && state.code.noteAt.line === l.newNo) blocks.push(noteForm(file, l.newNo));
        if (blocks.length) html += '<tr class="anchor"><td colspan="3">' + blocks.join('') + '</td></tr>';
      }
    });
    return html + '</table>';
  }

  function anchorBlock(item, kind, v) {
    if (kind === 'finding') {
      return '<div class="finding"><div class="meta"><span class="sev ' + esc(item.severity) + '">' + esc(item.severity) + '</span><strong>' + esc(item.title) + '</strong><span class="spacer"></span>' +
        (item.publishedId ? '<span class="chip okc">published</span>' : item.dismissedAt ? '<span class="chip">dismissed</span>' : v.pr.state === 'OPEN' ? '<button class="btn small primary" data-act="publish-finding" data-id="' + esc(item.id) + '">Publish</button>' : '') + '</div>' + md(item.body) + '</div>';
    }
    var key = 'note-' + item.id;
    return '<div class="finding"><div class="meta"><span class="chip">note</span>' + (item.publishedId ? '<span class="chip okc">published</span>' : '') + '<span class="spacer"></span>' +
      (!item.publishedId ? '<button class="btn small primary" data-act="publish-note" data-id="' + esc(item.id) + '"' + busyAttr('note-' + item.id) + '>Publish</button><button class="btn small danger" data-act="delete-note" data-id="' + esc(item.id) + '">Delete</button>' : '') + '</div>' +
      (item.publishedId ? md(item.body) : '<textarea rows="3" data-edit="' + key + '" data-note="' + esc(item.id) + '">' + esc(edit(key, item.body)) + '</textarea>') + '</div>';
  }

  function threadBlock(comment, replies) {
    var chain = replies[comment.commentId] || [];
    return '<div class="finding"><div class="entry' + (comment.ours ? ' ours' : '') + '"><div class="who">' + esc(comment.author) + (comment.ours ? ' (us)' : '') + ' · ' + esc(when(comment.createdOn)) + '</div>' + md(comment.body) + '</div>' +
      (chain.length ? '<div class="entries">' + chain.map(function (r) { return entryHtml({ author: r.author, body: r.body, ours: r.ours, at: r.createdOn }); }).join('') + '</div>' : '') + '</div>';
  }

  function noteForm(file, line) {
    var key = 'newnote-' + file + '-' + (line || 'file');
    return '<div class="finding"><div class="faint">New note on ' + anchor(file, line) + ' — kept here until published</div><textarea rows="3" data-edit="' + esc(key) + '">' + esc(edit(key)) + '</textarea>' +
      '<div class="row" style="margin-top:4px"><button class="btn small primary" data-act="add-note" data-file="' + esc(file) + '" data-line="' + (line || '') + '">Save note</button><button class="btn small" data-act="note-cancel">Cancel</button></div></div>';
  }

  // ---- commits ----------------------------------------------------------------------

  function loadCommits() {
    return call('commits', { repoId: state.repoId, prId: state.prId }).then(function (r) { state.commits.data = r; state.commits.error = null; draw(); }, function (error) { state.commits.error = error.message; draw(); });
  }

  function drawCommitsTab(v) {
    var c = state.commits;
    if (c.error) return '<div class="page"><div class="banner bad">' + esc(c.error) + '</div></div>';
    if (!c.data) return '<div class="loading">Reading commits…</div>';
    var d = c.data;
    var html = '<div class="split"><aside>';
    if (d.local.length) {
      html += '<div class="group">In your clone, not on origin</div><div style="padding:4px 10px"><button class="btn small primary" data-act="push"' + busyAttr('push') + '>Push to origin/' + esc(d.branch) + '</button></div>' +
        d.local.map(function (commit) { return commitItem(commit, true); }).join('');
    }
    html += '<div class="group">The pull request · ' + d.commits.length + '</div>';
    d.commits.forEach(function (commit, index) {
      if (d.sinceReview !== null && index === d.sinceReview) html += '<div class="group" style="color:var(--accent)">↑ ' + index + ' since the review</div>';
      html += commitItem(commit, false);
    });
    html += '</aside><section>';
    if (!c.sha) html += '<div class="empty">Choose a commit.</div>';
    else {
      var commit = d.local.concat(d.commits).filter(function (x) { return x.sha === c.sha; })[0];
      html += '<div style="padding:8px 12px;border-bottom:1px solid var(--border)"><strong>' + esc(commit ? commit.subject : '') + '</strong><div class="faint mono">' + esc(c.sha) + ' · ' + esc(commit ? commit.author + ' · ' + commit.date : '') + '</div>' +
        (commit && commit.body ? '<div class="md" style="white-space:pre-wrap;margin-top:4px">' + esc(commit.body) + '</div>' : '') + '</div>';
      if (!c.files) html += '<div class="loading">Loading…</div>';
      else {
        html += '<div style="padding:6px 12px" class="row">' + c.files.map(function (file) {
          return '<span class="chip click' + (c.file === file.path ? ' on' : '') + '" data-act="commit-file" data-file="' + esc(file.path) + '">' + esc(file.path.split('/').pop()) + ' <span class="added">+' + file.added + '</span> <span class="removed">−' + file.deleted + '</span></span>';
        }).join('') + '</div>';
        if (c.file && c.lines) html += '<table class="diff">' + c.lines.map(function (l) {
          if (l.kind === 'META' && !l.text) return '';
          if (l.kind === 'HUNK' || l.kind === 'META') return '<tr class="' + l.kind + '"><td colspan="3">' + esc(l.text) + '</td></tr>';
          return '<tr class="' + l.kind + '"><td class="n">' + (l.oldNo || '') + '</td><td class="n">' + (l.newNo || '') + '</td><td class="c">' + esc(l.text) + '</td></tr>';
        }).join('') + '</table>';
      }
    }
    return html + '</section></div>';
  }

  function commitItem(commit, local) {
    return '<div class="item' + (state.commits.sha === commit.sha ? ' on' : '') + '" data-act="commit" data-sha="' + esc(commit.sha) + '"><span class="mono ' + (local ? 'warn' : 'faint') + '">' + sha7(commit.sha) + '</span><span class="p" style="direction:ltr" title="' + esc(commit.subject) + '">' + esc(commit.subject) + '</span></div>';
  }

  // ---- conversation ------------------------------------------------------------------

  function drawConversationTab(v) {
    var threads = v.threads;
    var open = v.pr.state === 'OPEN';
    var pendingReplies = (v.replies || []).filter(function (r) { return r.status !== 'PUBLISHED' && !r.dismissedAt; });
    var html = '<div class="page"><div class="row"><h3 style="margin:0">Threads</h3><span class="faint">' + threads.filter(function (t) { return t.state !== 'OK'; }).length + ' open of ' + threads.length + '</span><span class="spacer"></span>';
    if (open && pendingReplies.length) html += '<button class="btn small" data-act="draft-all"' + busyAttr('draft-all') + '>Draft all answers</button><button class="btn small" data-act="dismiss-all-replies">Dismiss all replies</button>';
    html += '</div>';
    if (!threads.length) html += '<div class="empty">No findings, so no threads yet.</div>';
    threads.forEach(function (t) {
      var label = THREAD_LABELS[t.state] || [t.state, ''];
      var draft = t.draft;
      html += '<div class="finding' + (t.state === 'OK' ? ' settled' : '') + '"><div class="meta"><span class="chip ' + label[1] + '">' + label[0] + '</span><span class="sev ' + esc(t.severity) + '">' + esc(t.severity) + '</span>' +
        (t.filePath ? '<button class="link mono" data-act="jump" data-file="' + esc(t.filePath) + '" data-line="' + (t.lineNo || '') + '">' + anchor(t.filePath, t.lineNo) + '</button>' : '') +
        (t.askedBy ? '<span class="chip accent">asked by ' + esc(t.askedBy) + '</span>' : '') + '<span class="spacer"></span>' +
        (t.waitingDays != null ? '<span class="faint">waiting ' + t.waitingDays + 'd</span>' : '') + '</div>' +
        '<div class="ftitle">' + esc(t.title) + '</div>' + md(t.question) +
        (t.resolutionNote ? '<div class="faint">Verdict: ' + esc(t.resolutionNote) + '</div>' : '') +
        (t.entries.length ? '<div class="entries">' + t.entries.map(entryHtml).join('') + '</div>' : '');
      if (draft && draft.status !== 'PUBLISHED' && !draft.dismissedAt && open) {
        var key = 'reply-' + draft.id;
        var drafting = (v.running || []).some(function (run) { return run.kind === 'reply' && run.title.indexOf(draft.theirAuthor) >= 0; }) || state.busy['draft-' + draft.id];
        html += '<div class="card" style="margin-top:6px"><div class="row"><strong>Answer to ' + esc(draft.theirAuthor) + '</strong>' + (draft.status === 'FAILED' ? '<span class="chip badc" title="' + esc(draft.error || '') + '">drafting failed</span>' : '') + '<span class="spacer"></span>' +
          (drafting ? '<span class="chip accent"><span class="dot busy"></span>drafting</span>' : '<button class="btn small" data-act="draft-reply" data-id="' + esc(draft.id) + '">' + (draft.body ? 'Draft again' : 'Draft with Claude') + '</button>') + '</div>' +
          '<textarea rows="4" data-edit="' + key + '" placeholder="Write the answer, or let Claude draft it from the code">' + esc(edit(key, draft.body || '')) + '</textarea>' +
          '<div class="row" style="margin-top:4px"><button class="btn small primary" data-act="publish-reply" data-id="' + esc(draft.id) + '"' + busyAttr('reply-' + draft.id) + '>Publish answer</button>' +
          '<button class="btn small" data-act="save-reply" data-id="' + esc(draft.id) + '">Save</button><button class="btn small" data-act="dismiss-reply" data-id="' + esc(draft.id) + '">Dismiss</button></div></div>';
      }
      html += '<div class="row" style="margin-top:6px">';
      if (open && t.state !== 'OK' && t.findingId) html += '<button class="btn small" data-act="close-thread" data-id="' + esc(t.findingId) + '" data-on="1" title="Settled in conversation: it waits for no change in the code">Close thread</button>';
      if (t.state === 'OK' && t.findingId) html += '<button class="btn small" data-act="close-thread" data-id="' + esc(t.findingId) + '" data-on="0">Reopen</button>';
      if (open && t.waitingDays != null && t.waitingDays >= (v.followUpDays || 3) && !draft) {
        var fkey = 'follow-' + t.findingId;
        if (state.edits[fkey] == null) html += '<button class="btn small" data-act="follow-open" data-id="' + esc(t.findingId) + '">Remind</button>';
      }
      if (t.publishedUrl) html += '<button class="btn small" data-act="open-url" data-url="' + esc(t.publishedUrl) + '">View on PR</button>';
      html += '</div>';
      var fk = 'follow-' + t.findingId;
      if (state.edits[fk] != null) {
        html += '<div class="card" style="margin-top:6px"><div class="faint">A reminder in the thread. Never sent on its own.</div><textarea rows="3" data-edit="' + fk + '">' + esc(state.edits[fk]) + '</textarea>' +
          '<div class="row" style="margin-top:4px"><button class="btn small primary" data-act="follow-send" data-id="' + esc(t.findingId) + '"' + busyAttr('follow-' + t.findingId) + '>Send reminder</button><button class="btn small" data-act="follow-cancel" data-id="' + esc(t.findingId) + '">Cancel</button></div></div>';
      }
      html += '</div>';
    });
    return html + '</div>';
  }

  // ---- history ----------------------------------------------------------------------

  function drawHistoryTab(v) {
    var events = [];
    (v.reviews || []).forEach(function (r) { events.push({ at: r.createdAt, who: r.trigger === 'AUTO' ? 'automatic' : 'you', kind: 'review', text: 'Review ' + (r.status || '').toLowerCase() + (r.sinceSha ? ' (incremental)' : '') + (r.costUsd ? ' · ' + money(r.costUsd) : '') + (r.error ? ' — ' + r.error.slice(0, 160) : '') }); });
    (v.publications || []).forEach(function (p) { events.push({ at: p.publishedAt, who: 'you', kind: 'published', text: 'General comment published' }); });
    (v.comments || []).forEach(function (cm) { events.push({ at: cm.createdOn, who: cm.author, kind: cm.ours ? 'our comment' : cm.parentId ? 'reply' : 'comment', text: (cm.inlinePath ? cm.inlinePath + (cm.inlineLine ? ':' + cm.inlineLine : '') + ' — ' : '') + String(cm.body).replace(/\s+/g, ' ').slice(0, 220) }); });
    (v.notes || []).forEach(function (n) { events.push({ at: n.createdAt, who: 'you', kind: 'note', text: n.filePath + ' — ' + String(n.body).slice(0, 160) }); });
    (v.fixes || []).forEach(function (f) { events.push({ at: f.createdAt, who: 'fix', kind: 'fix ' + String(f.state).toLowerCase(), text: (f.sha ? f.sha.slice(0, 7) + ' ' : '') + (f.summary || f.error || '').slice(0, 200) }); });
    var authors = {};
    events.forEach(function (e) { authors[e.who] = true; });
    events = events.filter(function (e) { return e.at && (!state.historyAuthor || e.who === state.historyAuthor); }).sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    var html = '<div class="page timeline"><div class="row"><span class="faint">Author</span><select data-bind="history-author"><option value="">Everyone</option>' + Object.keys(authors).sort().map(function (a) {
      return '<option' + (state.historyAuthor === a ? ' selected' : '') + '>' + esc(a) + '</option>';
    }).join('') + '</select></div>';
    var current = '';
    events.forEach(function (e) {
      var d = day(e.at);
      if (d !== current) { current = d; html += '<div class="day">' + esc(d) + '</div>'; }
      html += '<div class="ev"><span class="faint mono">' + esc(String(e.at).slice(11, 16)) + '</span><span class="dim">' + esc(e.who) + ' · ' + esc(e.kind) + '</span><span>' + esc(e.text) + '</span></div>';
    });
    if (!events.length) html += '<div class="empty">Nothing happened here yet.</div>';
    return html + '</div>';
  }

  // ---- settings & import ----------------------------------------------------------------

  function drawSettings() {
    var o = state.overview;
    if (!o) return '<div class="loading">Loading…</div>';
    var s = state.settings || o.settings;
    function val(field) { return s[field]; }
    var html = '<div class="page form"><h2>Settings</h2>';
    html += '<div class="field"><label>Claude account</label><div><select data-setting="profileId"><option value="">The default account</option>' + o.accounts.map(function (a) {
      return '<option value="' + esc(a.id) + '"' + (val('profileId') === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>';
    }).join('') + '</select><div class="help">Runs use this account first. When it hits its limit or is signed out, the next account is used, starting with its fallback.</div></div></div>';
    html += '<div class="field"><label>Review language</label><div><input type="text" data-setting="language" data-edit="set-language" value="' + esc(val('language')) + '"><div class="help">The language findings, answers and summaries are written in, e.g. español or English.</div></div></div>';
    html += '<div class="field"><label>Your name on the forge</label><div><input type="text" data-setting="me" data-edit="set-me" value="' + esc(val('me')) + '"><div class="help">So your own comments are not listed as requests from others.</div></div></div>';
    html += '<div class="field"><label>Notifications</label><div><label class="check"><input type="checkbox" data-setting="notify"' + (val('notify') ? ' checked' : '') + '> Tell me when a review is ready, someone replies, or a fix is written</label></div></div>';
    html += '<div class="section"><h3>Automatic mode</h3><div class="field"><label>Sweep</label><div><label class="check"><input type="checkbox" data-setting="autoEnabled"' + (val('autoEnabled') ? ' checked' : '') + '> Review, verify and draft on their own, for the repositories that ask for it</label></div></div>';
    html += '<div class="field"><label>Every</label><div class="row"><input type="number" min="1" data-setting="autoInterval" value="' + esc(val('autoInterval')) + '" style="width:80px"> minutes</div></div>';
    html += '<div class="field"><label>At most per cycle</label><div class="row"><input type="number" min="1" data-setting="autoMax" value="' + esc(val('autoMax')) + '" style="width:80px"> reviews and verifications<div class="help" style="width:100%">The spending cap of each sweep. Answers are drafted within the same cap, counted apart.</div></div></div>';
    html += '<div class="field"><label>Remind after</label><div class="row"><input type="number" min="1" data-setting="followUpDays" value="' + esc(val('followUpDays')) + '" style="width:80px"> days without an answer</div></div>';
    var auto = state.auto || o.auto;
    html += '<div class="row"><button class="btn" data-act="auto-now">Sweep now</button><span class="faint">' + esc(auto && auto.lastMessage ? (auto.lastRunAt ? when(auto.lastRunAt) + ': ' : '') + auto.lastMessage : 'No sweep yet.') + '</span></div></div>';
    html += '<div class="section"><h3>Global conventions</h3>' + drawGuidelines(state.globalGuidelines, null) + '</div>';
    html += '<div class="section"><h3>Usage</h3>' + drawUsage(state.usage) + '</div>';
    html += '<div class="section"><h3>History</h3><button class="btn" data-act="nav" data-view="import">Import from AI Code Reviewer</button></div>';
    return html + '</div>';
  }

  /**
   * The bus, read-only: who is writing where right now, what each has claimed,
   * the migration numbers handed out, and what was said. The fixes and the
   * sessions talk to each other through their own tools; this is where a person
   * sees it.
   */
  function drawBus() {
    var b = state.bus;
    if (!b) return '<div class="loading">Loading…</div>';
    var html = '<div class="page"><h2>Coordination</h2><p class="dim" style="margin-top:0">The fixes the reviewer writes and your Claude sessions share a bus: they see who else is writing in the same repository, claim files before editing them, leave each other messages and take migration numbers that nobody else will be given. Sessions join the first time they use a tool.</p>';
    html += '<h3>Writing now</h3>';
    if (!b.members.length) html += '<div class="faint">Nobody is on the bus right now.</div>';
    else html += '<table class="list"><tr><th>Who</th><th>Where</th><th>Claimed</th><th>Since</th></tr>' + b.members.map(function (m) {
      return '<tr><td><span class="chip ' + (m.kind === 'fix' ? 'accent' : '') + '">' + esc(m.kind) + '</span> ' + esc(m.label) + '</td><td>' + esc(m.where) + (m.branch ? ' <span class="faint mono">' + esc(m.branch) + '</span>' : '') + '</td>' +
        '<td class="mono" style="font-size:11px">' + (m.claims.length ? m.claims.map(esc).join('<br>') : '<span class="faint">—</span>') + '</td><td class="faint">' + esc(when(m.startedAt)) + '</td></tr>';
    }).join('') + '</table>';
    if (b.reservations.length) {
      html += '<h3>Migration numbers handed out</h3><table class="list"><tr><th>Number</th><th>Repository</th><th>To</th><th>When</th></tr>' + b.reservations.slice(0, 30).map(function (r) {
        return '<tr><td class="mono">' + esc(r.number) + '</td><td>' + esc(r.repoName || '') + (r.prId ? ' #' + r.prId : '') + '</td><td>' + esc(r.label || '') + '</td><td class="faint">' + esc(when(r.at)) + '</td></tr>';
      }).join('') + '</table>';
    }
    html += '<h3>Messages</h3>';
    if (!b.messages.length) html += '<div class="faint">Nothing said yet.</div>';
    b.messages.forEach(function (m) {
      html += '<div class="finding"><div class="meta"><span class="chip ' + (m.kind === 'warning' ? 'mine' : m.kind === 'question' ? 'accent' : '') + '">' + esc(m.kind) + '</span><strong>' + esc(m.fromLabel) + '</strong>' +
        '<span class="faint">to ' + esc(m.scope === 'ALL' ? 'everyone' : m.scope === 'REPO' ? (m.repoName || 'the repository') : (m.repoName || '') + (m.prId ? ' #' + m.prId : '')) + '</span>' +
        (m.subject ? '<span class="dim">· ' + esc(m.subject) + '</span>' : '') + '<span class="spacer"></span><span class="faint">' + esc(when(m.at)) + '</span></div>' + md(m.body) + '</div>';
    });
    return html + '</div>';
  }

  function drawImport() {
    var info = state.importInfo;
    var html = '<div class="page form"><div class="row"><button class="btn small" data-act="nav" data-view="repos">← Repositories</button><h2 style="margin:0 6px">Import from AI Code Reviewer</h2></div>';
    if (!info) return html + '<div class="loading">Looking for its database…</div></div>';
    if (!info.found) return html + '<div class="banner">No AI Code Reviewer database at <span class="mono">' + esc(info.dbFile) + '</span>.</div></div>';
    html += '<p class="dim">Repositories come across with their tokens, reviews, findings, threads, replies, fixes, approvals and conventions. Automatic modes arrive switched off. Nothing in AI Code Reviewer is changed, and importing twice adds nothing the second time.</p>';
    html += '<div class="faint mono">' + esc(info.dbFile) + '</div>';
    if (!info.keyFound) html += '<div class="banner warn">Its master key was not found, so tokens cannot be read: they have to be entered again.</div>';
    html += '<div class="faint" style="margin:6px 0">' + info.counts.reviews + ' reviews · ' + info.counts.findings + ' findings · ' + info.counts.replies + ' replies · ' + info.counts.fixes + ' fixes · ' + info.counts.guidelines + ' conventions</div>';
    html += '<table class="list"><tr><th></th><th>Repository</th><th>Clone</th><th>Token</th></tr>' + info.repos.map(function (repo) {
      var picked = state.importPick[repo.id] !== false && !repo.localOnly;
      return '<tr><td><input type="checkbox" data-act="import-pick" data-id="' + esc(repo.id) + '"' + (picked ? ' checked' : '') + (repo.localOnly ? ' disabled' : '') + '></td><td><strong>' + esc(repo.name) + '</strong><div class="faint mono">' + esc(repo.provider + ' · ' + repo.owner + '/' + repo.slug) + '</div>' + (repo.localOnly ? '<div class="faint">A local folder with no forge: not imported.</div>' : '') + '</td><td class="faint mono">' + esc(repo.localPath) + '</td><td>' + (repo.hasToken ? '✓' : '') + '</td></tr>';
    }).join('') + '</table>';
    html += '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="import-run"' + busyAttr('import') + '>Import selected</button></div>';
    var r = state.importReport;
    if (r) {
      html += '<div class="banner ok">Imported ' + r.repos + ' repositor' + (r.repos === 1 ? 'y' : 'ies') + ', ' + (r.rows.cr_review || 0) + ' reviews, ' + (r.rows.cr_finding || 0) + ' findings, ' + (r.rows.cr_reply_draft || 0) + ' replies, ' + (r.rows.cr_finding_fix || 0) + ' fixes' + (r.prefs ? ', ' + r.prefs + ' settings' : '') + '.' +
        (r.skippedRepos.length ? '\nSkipped: ' + r.skippedRepos.join('; ') : '') + (r.tokensUnreadable.length ? '\nTokens to enter again: ' + r.tokensUnreadable.join(', ') : '') + '</div>';
    }
    return html + '</div>';
  }

  /* ------------------------------------------------------------------ *
   * Actions
   * ------------------------------------------------------------------ */

  function openPr(repoId, prId) {
    go('pr', { repoId: repoId, prId: Number(prId), prTab: state.view === 'pr' && state.repoId === repoId && state.prId === Number(prId) ? state.prTab : 'review', backTo: state.view === 'pr' ? state.backTo : state.view });
  }

  function editRepo(repoId) {
    state.formTest = null;
    state.formGuidelines = null;
    if (!repoId) { state.form = blankForm(); go('repoForm'); return; }
    call('repo', { repoId: repoId }).then(function (r) {
      var repo = r.repo;
      state.form = {
        id: repo.id, name: repo.name, provider: repo.provider, owner: repo.owner, slug: repo.slug, localPath: repo.localPath, token: '',
        projectKind: repo.projectKind || '', defaultDepth: repo.defaultDepth || '', defaultModel: repo.defaultModel || '', autoReview: repo.autoReview,
        skipDrafts: repo.skipDrafts, skipTitles: repo.skipTitles, skipAuthors: repo.skipAuthors, onlyTargets: repo.onlyTargets,
        replyMode: repo.replyMode, fixMode: repo.fixMode, hasToken: repo.hasToken
      };
      go('repoForm');
      return loadFormGuidelines();
    }).catch(fail);
  }

  function loadFormGuidelines() {
    if (!state.form || !state.form.id) return Promise.resolve();
    return call('guidelines', { repoId: state.form.id }).then(function (r) { state.formGuidelines = r.guidelines; draw(); });
  }
  function reloadGuidelines(scope) {
    if (scope === 'global') return call('guidelines', { repoId: null }).then(function (r) { state.globalGuidelines = r.guidelines; draw(); });
    return loadFormGuidelines();
  }

  function formPayload() {
    var f = state.form;
    return {
      id: f.id || undefined, name: f.name, provider: f.provider, owner: f.owner, slug: f.slug, localPath: f.localPath, token: f.token,
      projectKind: f.projectKind || null, defaultDepth: f.defaultDepth || null, defaultModel: f.defaultModel || '', autoReview: f.autoReview,
      skipDrafts: f.skipDrafts, skipTitles: f.skipTitles, skipAuthors: f.skipAuthors, onlyTargets: f.onlyTargets, replyMode: f.replyMode, fixMode: f.fixMode
    };
  }

  function prArgs(extra) {
    var args = { repoId: state.repoId, prId: state.prId };
    Object.keys(extra || {}).forEach(function (key) { args[key] = extra[key]; });
    return args;
  }

  function runReview(el) {
    var full = el.getAttribute('data-full') === '1';
    var confirmed = el.getAttribute('data-confirmed') === '1';
    var p = state.reviewProfile;
    var start = function () {
      state.confirmRerun = null;
      act('review', function () {
        return call('review', prArgs({ depth: p.depth === 'AUTO' ? undefined : p.depth, kind: p.kind === 'AUTO' ? undefined : p.kind, forceFull: full }));
      }, function () { say('Review finished.'); });
    };
    if (full || confirmed) return start();
    call('rerunCheck', prArgs()).then(function (r) {
      if (r.existing) { state.confirmRerun = r.existing; draw(); } else start();
    }).catch(fail);
  }

  var actions = {
    nav: function (el) {
      var view = el.getAttribute('data-view');
      if (view === 'import') { state.importReport = null; state.importPick = {}; }
      go(view);
    },
    back: function () {
      if (state.backTo === 'dashboard') go('dashboard'); else go('prs', { repoId: state.repoId });
    },
    'refresh-all': function () { act('refresh-all', function () { return call('refreshAll'); }, function (r) { if (r.errors && r.errors.length) say(r.errors.join('\n'), true); load(); }); },
    'open-pr': function (el) { openPr(el.getAttribute('data-repo'), el.getAttribute('data-pr')); },
    'open-prs': function (el) { go('prs', { repoId: el.getAttribute('data-repo'), prStates: ['OPEN'] }); },
    'open-url': function (el) { call('openUrl', { url: el.getAttribute('data-url') }).catch(fail); },
    'cancel-run': function (el) { call('cancelRun', { key: el.getAttribute('data-key') }).catch(fail); },
    'dash-flag': function (el) {
      var flag = el.getAttribute('data-flag');
      var flags = state.dashFilter.flags;
      if (!flag) { state.dashFilter.flags = []; }
      else if (flags.indexOf(flag) >= 0) flags.splice(flags.indexOf(flag), 1); else flags.push(flag);
      remember(); draw();
    },
    'dash-mine': function () { state.dashFilter.mine = !state.dashFilter.mine; remember(); draw(); },
    'dash-mode': function () { state.dashFilter.mode = state.dashFilter.mode === 'ALL' ? 'ANY' : 'ALL'; remember(); draw(); },
    'dash-author': function (el) {
      var name = el.getAttribute('data-author');
      var list = state.dashFilter.authors;
      if (list.indexOf(name) >= 0) list.splice(list.indexOf(name), 1); else list.push(name);
      remember(); draw();
    },
    'repo-new': function () { editRepo(null); },
    'repo-edit': function (el) { editRepo(el.getAttribute('data-repo')); },
    'repo-hide': function (el) { call('hideRepo', { repoId: el.getAttribute('data-repo'), hidden: el.getAttribute('data-hidden') === '1' }).then(load, fail); },
    'repo-delete': function () {
      var f = state.form;
      act('repo-delete', function () { return call('deleteRepo', { repoId: f.id, repoName: f.name }); }, function () { say('Repository removed.'); go('repos'); });
    },
    'form-pick': function () {
      call('pickFolder').then(function (r) {
        if (!r.path) return;
        state.form.localPath = r.path;
        draw();
        actions['form-detect']();
      }).catch(fail);
    },
    'form-detect': function () {
      act('form-detect', function () { return call('detectRemote', { localPath: state.form.localPath }); }, function (r) {
        var f = state.form;
        if (!f.id && r.provider) { f.provider = r.provider; f.owner = r.owner; f.slug = r.slug; }
        if (!f.name) f.name = r.slug || r.name;
        if (!r.provider) say('The remote is not on GitHub or Bitbucket: ' + (r.url || 'no origin'), true);
        else if (r.provider === 'BITBUCKET' && !r.ssh) say('This clone fetches from Bitbucket over HTTPS, which no longer authenticates. Switch origin to SSH.', true);
      });
    },
    'form-test': function () {
      state.formTest = null;
      act('form-test', function () { return host.call('review.testRepo', { repo: formPayload() }); }, function (r) { state.formTest = r; });
    },
    'form-save': function () {
      act('form-save', function () { return call('saveRepo', { repo: formPayload() }); }, function (r) {
        say(state.form.id ? 'Saved.' : 'Repository added.');
        if (!state.form.id) go('prs', { repoId: r.repo.id, prStates: ['OPEN'] }); else go('repos');
      });
    },
    'guide-toggle': function (el) {
      var id = el.getAttribute('data-id');
      var list = (state.formGuidelines || []).concat(state.globalGuidelines || []);
      var doc = list.filter(function (d) { return d.id === id; })[0];
      if (!doc) return;
      call('saveGuideline', { guideline: Object.assign({}, doc, { enabled: el.checked }) }).then(function () { return reloadGuidelines(doc.repoId ? 'repo' : 'global'); }).catch(fail);
    },
    'guide-open': function (el) { var k = 'guide-' + el.getAttribute('data-id') + '-open'; state.edits[k] = !state.edits[k]; draw(); },
    'guide-save': function (el) {
      var id = el.getAttribute('data-id');
      var list = (state.formGuidelines || []).concat(state.globalGuidelines || []);
      var doc = list.filter(function (d) { return d.id === id; })[0];
      call('saveGuideline', { guideline: Object.assign({}, doc, { content: edit('guide-' + id, doc.content), source: doc.source === 'CLAUDE_MD' ? 'TYPED' : doc.source, linkedPath: null, linkedHash: null }) })
        .then(function () { delete state.edits['guide-' + id]; delete state.edits['guide-' + id + '-open']; return reloadGuidelines(el.getAttribute('data-scope') === 'global' ? 'global' : 'repo'); })
        .then(function () { say('Saved.'); }).catch(fail);
    },
    'guide-delete': function (el) {
      call('deleteGuideline', { id: el.getAttribute('data-id') }).then(function () { return reloadGuidelines(el.getAttribute('data-scope') === 'global' ? 'global' : 'repo'); }).catch(fail);
    },
    'guide-add': function (el) {
      var scope = el.getAttribute('data-scope');
      var key = 'guide-new-' + scope;
      call('saveGuideline', { guideline: { repoId: scope === 'global' ? null : scope, name: edit(key + '-name'), content: edit(key) } })
        .then(function () { delete state.edits[key]; delete state.edits[key + '-name']; return reloadGuidelines(scope === 'global' ? 'global' : 'repo'); }).catch(fail);
    },
    'guide-claude': function (el) {
      call('importClaudeMd', { repoId: el.getAttribute('data-repo') }).then(function (r) { say(r.found ? 'Found ' + r.found + ' CLAUDE.md file(s), ' + r.added + ' new.' : 'No CLAUDE.md in the clone.'); return loadFormGuidelines(); }).catch(fail);
    },
    'prs-refresh': function () { act('prs-refresh', function () { return call('refreshPrs', { repoId: state.repoId }); }, load); },
    'prs-history': function () {
      act('prs-history', function () { return call('searchHistory', { repoId: state.repoId }); }, function (r) {
        say(r.found + ' closed PR(s) found.');
        if (state.prStates.indexOf('MERGED') < 0) state.prStates.push('MERGED');
        if (state.prStates.indexOf('DECLINED') < 0) state.prStates.push('DECLINED');
        load();
      });
    },
    'prs-state': function (el) {
      var s = el.getAttribute('data-state');
      var list = state.prStates;
      if (list.indexOf(s) >= 0) { if (list.length > 1) list.splice(list.indexOf(s), 1); } else list.push(s);
      load();
    },
    'pr-load': function () { act('pr-load', function () { return call('loadPr', prArgs()); }, function (r) { if (r.commentsError) say('The thread could not be read: ' + r.commentsError, true); load(); }); },
    'pr-tab': function (el) {
      state.prTab = el.getAttribute('data-tab');
      remember();
      if (state.prTab === 'code' && !state.code.files) loadFiles();
      if (state.prTab === 'commits' && !state.commits.data) loadCommits();
      draw();
    },
    profile: function (el) { state.reviewProfile[el.getAttribute('data-field')] = el.getAttribute('data-value'); draw(); },
    'run-review': runReview,
    'rerun-cancel': function () { state.confirmRerun = null; draw(); },
    verify: function () { act('verify', function () { return call('verify', prArgs()); }, function (r) { say(r.mergeable ? 'Verified: every comment was addressed.' : 'Verified.'); }); },
    'final-pass': function () { act('final-pass', function () { return call('finalPass', prArgs()); }, function (r) { say(r.blockers ? r.blockers + ' blocker(s) found.' : 'Nothing blocks the merge.', r.blockers > 0); }); },
    stance: function (el) { act('stance', function () { return call(el.getAttribute('data-stance'), prArgs()); }, load); },
    'decline-open': function () { state.decline = true; state.merge = null; draw(); },
    'decline-close': function () { state.decline = null; draw(); },
    decline: function () {
      act('decline', function () { return call('decline', prArgs({ reason: edit('decline-reason'), repoName: state.pr.repo.name })); }, function () { state.decline = null; delete state.edits['decline-reason']; say('Declined.'); load(); });
    },
    'merge-open': function () { state.merge = true; state.decline = null; draw(); },
    'merge-close': function () { state.merge = null; draw(); },
    merge: function () {
      var v = state.pr;
      act('merge', function () {
        return call('merge', prArgs({
          message: edit('merge-message', 'Merged in ' + v.pr.sourceBranch + ' (pull request #' + v.pr.id + ')\n\n' + v.pr.title),
          strategy: edit('merge-strategy', v.settings.mergeStrategy || 'MERGE_COMMIT'),
          closeSourceBranch: edit('merge-close', true),
          repoName: v.repo.name, target: v.pr.targetBranch, skipping: v.mergeBlocker ? [v.mergeBlocker] : []
        }));
      }, function () { state.merge = null; say('Merged.'); load(); });
    },
    'publish-finding': function (el) { var id = el.getAttribute('data-id'); act('publish-' + id, function () { return call('publishFinding', { findingId: id }); }); },
    'publish-all': function () { act('publish-all', function () { return call('publishAll', prArgs()); }, function (r) { if (r.errors && r.errors.length) say(r.published + ' published; failed: ' + r.errors.join('; '), true); else say(r.published + ' published.'); }); },
    dismiss: function (el) { call('dismissFinding', { findingId: el.getAttribute('data-id'), dismissed: el.getAttribute('data-on') === '1' }).catch(fail); },
    'finding-edit': function (el) { var k = 'finding-open-' + el.getAttribute('data-id'); state.edits[k] = !state.edits[k]; draw(); },
    'finding-save': function (el) {
      var id = el.getAttribute('data-id');
      var f = state.pr.findings.filter(function (x) { return x.id === id; })[0];
      call('editFinding', { findingId: id, title: edit('finding-title-' + id, f.title), body: edit('finding-body-' + id, f.body), suggestion: edit('finding-sugg-' + id, f.suggestion || '') })
        .then(function () { ['open', 'title', 'body', 'sugg'].forEach(function (p) { delete state.edits['finding-' + p + '-' + id]; }); }).catch(fail);
    },
    fix: function (el) { var id = el.getAttribute('data-id'); call('fix', { findingId: id }).then(function (r) { say(r.fix && r.fix.sha ? 'Fix committed in the workshop: ' + r.fix.sha.slice(0, 7) : 'The fix changed nothing: ' + (r.fix && r.fix.summary || '')); }, fail); },
    'fix-all': function () { act('fix-all', function () { return call('fixAll', prArgs()); }, function (r) { say(r.committed + ' fix(es) committed.' + (r.errors.length ? ' ' + r.errors.length + ' failed.' : ''), r.errors.length > 0); }); },
    'retry-fix-reply': function (el) { var id = el.getAttribute('data-id'); act('fixreply-' + id, function () { return call('retryFixReply', { fixId: id }); }); },
    'give-back': function () { act('give-back', function () { return call('giveBack', prArgs()); }, function (r) { say(r.count + ' fix(es) handed back to your clone.'); }); },
    'discard-workshop': function () { act('discard', function () { return call('discardWorkshop', prArgs({ repoName: state.pr.repo.name })); }, function () { say('Workshop discarded.'); }); },
    push: function () {
      var d = state.commits.data;
      act('push', function () { return call('push', prArgs({ branch: d.branch, count: d.local.length })); }, function () { say('Pushed.'); state.commits.data = null; loadCommits(); });
    },
    adopt: function (el) {
      var id = el.getAttribute('data-comment');
      act('adopt-' + id, function () { return call('adopt', prArgs({ commentId: id })).then(function (r) { return call('fix', { findingId: r.finding.id }); }); }, function (r) { say(r.fix && r.fix.sha ? 'Fix committed; the answer went in their thread.' : 'The fix changed nothing.'); });
    },
    'publish-review': function (el) {
      var id = el.getAttribute('data-id');
      act('publish-review', function () { return call('publishReview', { reviewId: id, body: edit('body-' + id, state.pr.done.body) }); }, function () { delete state.edits['body-' + id]; say('Published.'); });
    },
    'save-body': function (el) { var id = el.getAttribute('data-id'); call('saveReviewBody', { reviewId: id, body: edit('body-' + id, state.pr.done.body) }).then(function () { delete state.edits['body-' + id]; say('Saved.'); load(); }, fail); },
    jump: function (el) {
      var file = el.getAttribute('data-file');
      var line = Number(el.getAttribute('data-line')) || null;
      state.prTab = 'code';
      remember();
      if (!state.code.files) { loadFiles().then(function () { openFile(file, line); }); draw(); } else openFile(file, line);
    },
    file: function (el) { openFile(el.getAttribute('data-file')); },
    'code-fetch': function () { state.code.files = null; state.code.file = null; draw(); loadFiles(true); },
    'note-line': function (el) { state.code.noteAt = { line: Number(el.getAttribute('data-line')) }; draw(); },
    'note-file': function () { state.code.noteAt = { line: null }; draw(); },
    'note-cancel': function () { state.code.noteAt = null; draw(); },
    'add-note': function (el) {
      var file = el.getAttribute('data-file');
      var line = Number(el.getAttribute('data-line')) || null;
      var key = 'newnote-' + file + '-' + (line || 'file');
      call('addNote', prArgs({ file: file, line: line, body: edit(key) })).then(function () { delete state.edits[key]; state.code.noteAt = null; }).catch(fail);
    },
    'publish-note': function (el) {
      var id = el.getAttribute('data-id');
      var body = state.edits['note-' + id];
      act('note-' + id, function () { return (body != null ? call('updateNote', { noteId: id, body: body }) : Promise.resolve()).then(function () { return call('publishNote', { noteId: id }); }); }, function () { delete state.edits['note-' + id]; });
    },
    'delete-note': function (el) { call('deleteNote', { noteId: el.getAttribute('data-id') }).catch(fail); },
    commit: function (el) {
      var sha = el.getAttribute('data-sha');
      state.commits.sha = sha; state.commits.files = null; state.commits.file = null; state.commits.lines = null; draw();
      call('commitFiles', { repoId: state.repoId, sha: sha }).then(function (r) {
        if (state.commits.sha !== sha) return;
        state.commits.files = r.files; draw();
        if (r.files.length) actions['commit-file']({ getAttribute: function () { return r.files[0].path; } });
      }, fail);
    },
    'commit-file': function (el) {
      var file = el.getAttribute('data-file');
      var sha = state.commits.sha;
      state.commits.file = file; state.commits.lines = null; draw();
      call('commitDiff', { repoId: state.repoId, sha: sha, file: file }).then(function (r) { if (state.commits.file === file) { state.commits.lines = r.lines; draw(); } }, fail);
    },
    'draft-reply': function (el) { var id = el.getAttribute('data-id'); delete state.edits['reply-' + id]; act('draft-' + id, function () { return call('draftReply', { replyId: id }); }); },
    'draft-all': function () { act('draft-all', function () { return call('draftAll', prArgs()); }, function (r) { say(r.drafted + ' drafted' + (r.failed ? ', ' + r.failed + ' failed' : '') + '.', r.failed > 0); }); },
    'save-reply': function (el) { var id = el.getAttribute('data-id'); call('saveReplyDraft', { replyId: id, body: edit('reply-' + id) }).then(function () { delete state.edits['reply-' + id]; say('Saved.'); }, fail); },
    'publish-reply': function (el) {
      var id = el.getAttribute('data-id');
      var draft = (state.pr.replies || []).filter(function (r) { return r.id === id; })[0];
      act('reply-' + id, function () { return call('publishReply', { replyId: id, body: edit('reply-' + id, draft && draft.body) }); }, function () { delete state.edits['reply-' + id]; say('Answer published.'); });
    },
    'dismiss-reply': function (el) { call('dismissReply', { replyId: el.getAttribute('data-id') }).catch(fail); },
    'dismiss-all-replies': function () { call('dismissAllReplies', prArgs()).catch(fail); },
    'close-thread': function (el) { call('closeFinding', { findingId: el.getAttribute('data-id'), closed: el.getAttribute('data-on') === '1' }).catch(fail); },
    'follow-open': function (el) {
      var id = el.getAttribute('data-id');
      call('followUpText', { findingId: id }).then(function (r) { state.edits['follow-' + id] = r.text; draw(); }, fail);
    },
    'follow-cancel': function (el) { delete state.edits['follow-' + el.getAttribute('data-id')]; draw(); },
    'follow-send': function (el) {
      var id = el.getAttribute('data-id');
      act('follow-' + id, function () { return call('followUp', { findingId: id, body: state.edits['follow-' + id] }); }, function () { delete state.edits['follow-' + id]; say('Reminder sent.'); });
    },
    shell: function (el) { host.call('review.shell', prArgs({ where: el.getAttribute('data-where') })).catch(fail); },
    ask: function (el) { host.call('review.ask', prArgs({ findingId: el.getAttribute('data-finding') || undefined })).catch(fail); },
    'auto-now': function () { call('autoRunNow').then(function () { say('Sweeping.'); }, fail); },
    'import-pick': function (el) { state.importPick[el.getAttribute('data-id')] = el.checked; },
    'import-run': function () {
      var ids = state.importInfo.repos.filter(function (repo) { return state.importPick[repo.id] !== false && !repo.localOnly; }).map(function (repo) { return repo.id; });
      if (!ids.length) return say('Nothing selected.', true);
      act('import', function () { return call('importRun', { repoIds: ids }); }, function (r) { state.importReport = r.report; loadOverview().then(draw); });
    }
  };

  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el || el.hasAttribute('disabled')) return;
    var name = el.getAttribute('data-act');
    if (el.tagName === 'INPUT' && el.type === 'checkbox' && name !== 'guide-toggle' && name !== 'import-pick') return;
    var handler = actions[name];
    if (!handler) return;
    if (el.tagName !== 'INPUT') event.preventDefault();
    handler(el);
  });

  document.addEventListener('input', function (event) {
    var el = event.target;
    var key = el.getAttribute('data-edit');
    if (key) state.edits[key] = el.value;
    var formField = el.getAttribute('data-form');
    if (formField && state.form && el.type !== 'radio' && el.type !== 'checkbox') state.form[formField] = el.value;
    if (el.getAttribute('data-bind') === 'dash-text') { state.dashFilter.text = el.value; draw(); }
  });

  document.addEventListener('change', function (event) {
    var el = event.target;
    var formField = el.getAttribute('data-form');
    if (formField && state.form) {
      if (el.type === 'checkbox') state.form[formField] = el.checked;
      else state.form[formField] = el.value;
      if (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT') draw();
    }
    var setting = el.getAttribute('data-setting');
    if (setting) {
      var value = el.type === 'checkbox' ? el.checked : el.value;
      var patch = {};
      patch[setting] = value;
      call('saveSettings', { settings: patch }).then(function (r) { state.settings = r.settings; if (state.overview) state.overview.settings = r.settings; delete state.edits['set-' + setting]; say('Saved.'); draw(); }, fail);
    }
    if (el.getAttribute('data-edit-select')) { state.edits[el.getAttribute('data-edit-select')] = el.value; }
    if (el.getAttribute('data-edit-check')) { state.edits[el.getAttribute('data-edit-check')] = el.checked; }
    if (el.getAttribute('data-bind') === 'prs-sort') { state.prSort = el.value; remember(); draw(); }
    if (el.getAttribute('data-bind') === 'history-author') { state.historyAuthor = el.value; draw(); }
  });

  /* ------------------------------------------------------------------ *
   * What the app tells the panel
   * ------------------------------------------------------------------ */

  var activityTimer = null;
  host.on('review', function (event) {
    if (!event) return;
    if (event.type === 'activity') {
      var run = event.run;
      if (run.done) delete state.activity[run.key]; else state.activity[run.key] = run;
      if (state.view === 'pr' && state.pr && run.repoId === state.repoId && run.prId === state.prId) {
        state.pr.running = runningList().filter(function (r) { return r.repoId === state.repoId && r.prId === state.prId; });
      }
      if (state.view === 'dashboard' && state.dashboard) state.dashboard.stats.running = runningList().length;
      if (!activityTimer) activityTimer = setTimeout(function () { activityTimer = null; draw(); }, 250);
      if (run.done) scheduleReload();
      return;
    }
    if (event.type === 'changed') {
      if (state.view === 'pr') { if (event.repoId === state.repoId && (event.prId == null || event.prId === state.prId)) scheduleReload(); }
      else if (state.view === 'prs') { if (event.repoId === state.repoId) scheduleReload(); }
      else if (state.view === 'dashboard' || state.view === 'repos') scheduleReload();
      return;
    }
    if (event.type === 'bus') { if (state.view === 'bus') scheduleReload(); return; }
    if (event.type === 'auto') { state.auto = event.status; drawTop(); if (state.view === 'dashboard' && !event.status.running) scheduleReload(); return; }
    if (event.type === 'repos' || event.type === 'settings') { loadOverview().then(function () { if (state.view !== 'repoForm') scheduleReload(); else draw(); }); }
  });

  host.on('showing', function (payload) {
    state.showing = !payload || payload.showing !== false;
    if (state.showing && !state.started) start();
  });

  host.on('context', function (payload) {
    var saved = payload && payload.resume;
    if (saved) {
      if (saved.view && saved.view !== 'repoForm' && saved.view !== 'import') state.view = saved.view;
      if (saved.repoId) state.repoId = saved.repoId;
      if (saved.prId) state.prId = saved.prId;
      if (saved.prTab) state.prTab = saved.prTab;
      if (saved.prSort) state.prSort = saved.prSort;
      if (saved.dashFilter) state.dashFilter = saved.dashFilter;
    }
    if (payload && payload.showing === false) state.showing = false;
    if (state.showing) start();
  });

  function start() {
    if (state.started) return;
    state.started = true;
    if ((state.view === 'pr' || state.view === 'prs') && !state.repoId) state.view = 'dashboard';
    loadOverview().then(function () { draw(); return load(); }).catch(function (error) {
      $('main').innerHTML = '<div class="page"><div class="banner bad">The Code Reviewer did not answer: ' + esc(error.message) + '</div></div>';
    });
  }

  host.ready();
})();
</script>
