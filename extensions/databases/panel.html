<style>
  /*
   * Databases, drawn in a frame that cannot reach the network or the disk.
   * Everything it knows arrives through `host.call('db.*')` as rows of text;
   * no password is ever sent here, and nothing a server says is read as markup.
   */
  html { font-size: 12px; }
  #app { display: grid; grid-template-columns: auto 5px minmax(0, 1fr); height: 100%; min-height: 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .faint { color: var(--text-faint); }
  .dim { color: var(--text-dim); }
  .bad { color: var(--danger); }
  .okc { color: var(--ok); }
  .spacer { flex: 1; }
  [hidden] { display: none !important; }

  /* ── the tree ── */
  #side { display: flex; flex-direction: column; min-width: 180px; min-height: 0; background: var(--bg-panel); border-right: 1px solid var(--border); }
  .side-head { display: flex; align-items: center; gap: 6px; min-height: 41px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--border); }
  .side-head b { font-weight: 600; }
  #split { cursor: col-resize; margin-left: -3px; z-index: 2; }
  #split:hover { background: var(--accent-soft); }
  .side-filter { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .side-filter input { width: 100%; }
  #tree { flex: 1; overflow: auto; padding: 4px 0 20px; min-height: 0; }
  .tr { display: flex; align-items: center; gap: 5px; height: 23px; padding-right: 6px; white-space: nowrap; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .tr:hover { background: var(--bg-elevated); }
  .tr.on { background: var(--accent-soft); }
  .tr .tw { width: 12px; flex: none; color: var(--text-dim); font-size: 15px; line-height: 1; text-align: center; }
  .tr .tw.open { transform: rotate(90deg); }
  .tr .lb { overflow: hidden; text-overflow: ellipsis; }
  .tr .ct { color: var(--text-faint); font-size: 0.875rem; }
  .tr .more { margin-left: auto; visibility: hidden; padding: 0 5px; border-radius: 4px; color: var(--text-dim); }
  .tr:hover .more { visibility: visible; }
  .tr .more:hover { background: var(--border); color: var(--text); }
  .tr.grp .lb { color: var(--text-dim); }
  .tr.sys .lb { color: var(--text-faint); }
  .tr.note { cursor: default; color: var(--text-faint); }
  .tr.note:hover { background: none; }
  .tr.err { color: var(--danger); height: auto; min-height: 23px; white-space: normal; align-items: flex-start; padding-top: 3px; padding-bottom: 3px; line-height: 1.4; }
  .ic { width: 15px; flex: none; text-align: center; font-size: 11px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; color: var(--text-faint); }
  .ic.t { color: var(--info, #5aa2e0); }
  .ic.v { color: var(--violet, #a78bfa); }
  .ic.f { color: var(--warn, #d9a441); }
  .ic.d { color: var(--ok); }
  .eng { flex: none; padding: 0 4px; border-radius: 4px; font: 700 9px/15px ui-monospace, Menlo, monospace; border: 1px solid var(--border-strong); color: var(--text-dim); }
  .eng.postgres { color: var(--info, #5aa2e0); border-color: color-mix(in srgb, var(--info, #5aa2e0) 50%, var(--border)); }
  .eng.mysql { color: var(--warn, #d9a441); border-color: color-mix(in srgb, var(--warn, #d9a441) 50%, var(--border)); }
  .eng.sqlite { color: var(--violet, #a78bfa); border-color: color-mix(in srgb, var(--violet, #a78bfa) 50%, var(--border)); }
  .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--border-strong); }
  .dot.live { background: var(--ok); }
  .tag { flex: none; padding: 0 5px; border-radius: 999px; font-size: 0.8rem; line-height: 15px; border: 1px solid var(--border); color: var(--text-dim); }
  .tag.prod { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); background: color-mix(in srgb, var(--danger) 12%, transparent); font-weight: 700; }
  .tag.ro { color: var(--warn, #d9a441); border-color: color-mix(in srgb, var(--warn, #d9a441) 55%, var(--border)); }
  .tag.tx { color: var(--warn, #d9a441); border-color: var(--warn, #d9a441); background: color-mix(in srgb, var(--warn, #d9a441) 14%, transparent); font-weight: 600; }
  .tag.tx.failed { color: var(--danger); border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  /* ── tabs ── */
  #work { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  #tabs { display: flex; align-items: stretch; min-height: 41px; border-bottom: 1px solid var(--border); background: var(--bg-panel); overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; border-right: 1px solid var(--border); color: var(--text-dim); cursor: pointer; white-space: nowrap; flex: none; max-width: 240px; user-select: none; -webkit-user-select: none; }
  .tab:hover { color: var(--text); background: var(--bg-elevated); }
  .tab.on { color: var(--text); background: var(--bg); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .nm { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { padding: 0 5px; border-radius: 4px; color: var(--text-faint); }
  .tab .x:hover { background: var(--border); color: var(--text); }
  .tab.plus { padding: 0 12px; font-size: 1.2rem; border-right: 0; }
  #main { position: relative; min-height: 0; min-width: 0; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }

  /* ── common ── */
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); min-height: 38px; flex: none; flex-wrap: wrap; }
  .crumbs { display: flex; align-items: center; gap: 5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; }
  .crumbs b { color: var(--text); font-weight: 600; }
  .btn { min-height: 25px; padding: 2px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); color: var(--text); background: transparent; font: inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--text-faint); background: var(--bg-elevated); }
  .btn.primary { color: var(--on-accent); border-color: var(--accent); background: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--text)); }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .btn.quiet { border-color: transparent; color: var(--text-dim); }
  .btn.quiet:hover { color: var(--text); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { padding: 3px 11px; color: var(--text-dim); border-right: 1px solid var(--border-strong); }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--text); background: var(--bg-elevated); }
  .seg button.on { color: var(--text); background: var(--accent-soft); }
  input[type="text"], input[type="password"], input[type="number"], select { min-height: 26px; padding: 3px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input::placeholder { color: var(--text-faint); }
  .banner { margin: 10px; padding: 9px 12px; border: 1px solid var(--border); border-left: 2px solid var(--danger); border-radius: var(--radius); background: var(--bg-panel); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; flex: none; }
  .banner.info { border-left-color: var(--accent); }
  .banner .row { display: flex; gap: 8px; margin-top: 8px; }
  .empty { padding: 36px 20px; color: var(--text-faint); text-align: center; line-height: 1.6; }
  .scroll { flex: 1; overflow: auto; min-height: 0; }

  /* ── the grid ── */
  .gridwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .gridbox { flex: 1; overflow: auto; min-height: 0; }
  table.grid { border-collapse: separate; border-spacing: 0; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; }
  table.grid th, table.grid td { padding: 3px 9px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  table.grid th { position: sticky; top: 0; z-index: 1; background: var(--bg-panel); font-weight: 600; cursor: default; user-select: none; -webkit-user-select: none; }
  table.grid th.sortable { cursor: pointer; }
  table.grid th.sortable:hover { background: var(--bg-elevated); }
  table.grid th .ty { display: block; color: var(--text-faint); font-weight: 400; font-size: 0.85rem; }
  table.grid th .key { color: var(--warn, #d9a441); }
  table.grid td.n, table.grid th.n { position: sticky; left: 0; background: var(--bg-panel); color: var(--text-faint); text-align: right; min-width: 38px; user-select: none; -webkit-user-select: none; cursor: default; }
  table.grid th.n { z-index: 2; }
  table.grid td.null { color: var(--text-faint); font-style: italic; }
  table.grid td.num { text-align: right; }
  table.grid td.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.grid td.dirty { background: color-mix(in srgb, var(--warn, #d9a441) 18%, transparent); }
  table.grid tr.gone td { text-decoration: line-through; color: var(--text-faint); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  table.grid tr.fresh td { background: color-mix(in srgb, var(--ok) 10%, transparent); }
  table.grid tr.picked td.n { background: var(--accent-soft); color: var(--text); }
  table.grid tr:hover td { background-image: linear-gradient(color-mix(in srgb, var(--text) 4%, transparent), color-mix(in srgb, var(--text) 4%, transparent)); }
  table.grid td input.cell { width: 100%; min-width: 120px; min-height: 0; padding: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--text); }
  .peek { flex: none; max-height: 30%; overflow: auto; border-top: 1px solid var(--border); background: var(--bg-panel); padding: 6px 10px; }
  .peek pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-family: ui-monospace, Menlo, monospace; }
  .status { display: flex; align-items: center; gap: 12px; padding: 4px 10px; border-top: 1px solid var(--border); color: var(--text-dim); background: var(--bg-panel); flex: none; min-height: 26px; white-space: nowrap; overflow: hidden; }

  /* ── structure ── */
  .sect { padding: 12px 14px 4px; }
  .sect h3 { margin: 0 0 6px; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); display: flex; align-items: center; gap: 8px; }
  table.list { border-collapse: collapse; width: 100%; }
  table.list th { text-align: left; padding: 4px 10px; color: var(--text-faint); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.list td { padding: 4px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.list td.m { font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; overflow-wrap: anywhere; }
  table.list td.m.n { white-space: nowrap; overflow-wrap: normal; }
  table.list td.act { text-align: right; white-space: nowrap; width: 1%; }
  .link { color: var(--accent); cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .link.bad { color: var(--danger); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 12px 14px 0; }
  .facts div b { display: block; color: var(--text-faint); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  pre.code { margin: 0; padding: 12px 14px; font: 0.95rem/1.5 ui-monospace, Menlo, monospace; white-space: pre; tab-size: 4; }
  .kw { color: var(--accent); font-weight: 600; }
  .str { color: var(--ok); }
  .com { color: var(--text-faint); font-style: italic; }
  .numt { color: var(--warn, #d9a441); }

  /* ── the editor ── */
  .ed { display: grid; grid-template-columns: auto minmax(0, 1fr); flex: none; height: 38%; min-height: 80px; border-bottom: 1px solid var(--border); background: var(--bg-input); overflow: hidden; }
  .ed-gutter { padding: 8px 6px 8px 10px; text-align: right; color: var(--text-faint); font: 12px/18px ui-monospace, Menlo, monospace; user-select: none; -webkit-user-select: none; overflow: hidden; border-right: 1px solid var(--border); min-width: 34px; }
  .ed-gutter div.bad { color: var(--on-accent); background: var(--danger); border-radius: 3px; }
  .ed-body { position: relative; overflow: hidden; }
  .ed-paint, .ed-area { position: absolute; inset: 0; margin: 0; padding: 8px 10px; border: 0; font: 12px/18px ui-monospace, Menlo, monospace; white-space: pre; tab-size: 2; letter-spacing: 0; }
  .ed-paint { pointer-events: none; overflow: visible; color: var(--text); will-change: transform; }
  .ed-area { width: 100%; height: 100%; resize: none; overflow: auto; background: transparent; color: transparent; caret-color: var(--text); outline: 0 !important; }
  .ed-area::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .ed-pop { position: absolute; z-index: 5; min-width: 180px; max-width: 360px; max-height: 190px; overflow: auto; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-elevated); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35); font: 12px/1.5 ui-monospace, Menlo, monospace; }
  .ed-pop div { display: flex; gap: 10px; padding: 2px 9px; cursor: pointer; white-space: nowrap; }
  .ed-pop div.on { background: var(--accent-soft); }
  .ed-pop div i { margin-left: auto; font-style: normal; color: var(--text-faint); }
  .ed-size { height: 5px; flex: none; cursor: row-resize; margin-top: -3px; z-index: 2; }
  .ed-size:hover { background: var(--accent-soft); }
  .rtabs { display: flex; gap: 2px; padding: 4px 8px 0; border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; scrollbar-width: none; }
  .rtabs button { padding: 3px 10px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; color: var(--text-dim); white-space: nowrap; }
  .rtabs button.on { color: var(--text); border-color: var(--border); background: var(--bg-elevated); }
  .msgs { padding: 8px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; line-height: 1.6; }
  .msgs .m { display: flex; gap: 10px; padding: 2px 0; border-bottom: 1px dashed var(--border); }
  .msgs .m .s { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
  .msgs .m .w { white-space: nowrap; }
  .msgs .notice { color: var(--text-dim); padding-left: 16px; white-space: pre-wrap; }

  /* ── reports, the plan, the dashboard ── */
  .facts.tight { padding: 0 0 6px; }
  .sect .note { color: var(--text-faint); margin: -2px 0 6px; }
  .sect input.find { margin-bottom: 6px; width: min(340px, 100%); }
  table.list tr.go { cursor: pointer; }
  table.list tr.go:hover td { background: var(--bg-elevated); }
  table.plan td { white-space: nowrap; }
  table.plan td.node { font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; }
  table.plan td.node .what { color: var(--text-dim); }
  table.plan td.r { text-align: right; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; }
  table.plan .share { display: inline-block; width: 110px; height: 8px; vertical-align: middle; background: var(--bg-elevated); border-radius: 4px; overflow: hidden; }
  table.plan .share i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  table.plan .flag { color: var(--warn, #d9a441); white-space: normal; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; padding: 12px 14px 24px; }
  .chart { position: relative; padding: 10px 12px 8px; border: 1px solid var(--border); border-radius: calc(var(--radius, 8px) + 2px); background: var(--bg-panel); min-width: 0; }
  .chart h4 { margin: 0 0 2px; font-size: 1rem; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .chart h4 span { margin-left: auto; font: 600 1.1rem ui-monospace, Menlo, monospace; }
  .chart .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--text-dim); min-height: 18px; }
  .chart .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .chart .legend b { font: 600 0.95rem ui-monospace, Menlo, monospace; color: var(--text); margin-left: 4px; }
  .chart svg { display: block; width: 100%; height: auto; margin-top: 4px; }
  .chart svg text { font: 9px ui-monospace, Menlo, monospace; fill: var(--text-faint); }
  .chart .tip { position: absolute; z-index: 3; pointer-events: none; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-elevated); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); white-space: nowrap; font-size: 0.92rem; }
  .chart .tip div i { display: inline-block; width: 8px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .chart .tip b { font-family: ui-monospace, Menlo, monospace; margin-left: 6px; }

  /* ── the table designer ── */
  table.design { border-collapse: collapse; width: 100%; }
  table.design th { text-align: left; padding: 4px 6px; color: var(--text-faint); font-weight: 600; white-space: nowrap; }
  table.design td { padding: 3px 6px; vertical-align: middle; }
  table.design input[type="text"] { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; }
  table.design td.c { width: 1%; text-align: center; white-space: nowrap; }
  table.design tr.fresh td:first-child { box-shadow: inset 2px 0 0 var(--ok); }
  table.design tr.touched td:first-child { box-shadow: inset 2px 0 0 var(--warn, #d9a441); }
  table.design input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }

  /* ── the grant form ── */
  .grant { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 0; border-bottom: 1px solid var(--border); min-height: 0; flex: 1; }
  .grant > div { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .grant > div:last-child { border-right: 0; }
  .grant h3 { margin: 0; padding: 9px 12px 6px; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); display: flex; gap: 8px; align-items: center; }
  .grant .list { overflow: auto; padding: 0 6px 10px; flex: 1; }
  .grant label.pick { display: flex; align-items: center; gap: 7px; padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grant label.pick:hover { background: var(--bg-elevated); }
  .grant label.pick input { accent-color: var(--accent); flex: none; }
  .grant .sub { padding: 8px 6px 2px; color: var(--text-dim); display: flex; gap: 8px; }
  .grant .find { margin: 0 12px 6px; }

  /* ── the diagram ── */
  svg.erd { display: block; user-select: none; -webkit-user-select: none; }
  svg.erd text { font: 11px ui-monospace, Menlo, monospace; fill: var(--text-dim); }
  svg.erd text.erd-name { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; fill: var(--text); }
  svg.erd text.erd-col { fill: var(--text-dim); }
  svg.erd text.erd-col.need { fill: var(--text); }
  svg.erd text.erd-type { fill: var(--text-faint); font-size: 10px; }
  svg.erd text.erd-pk { fill: var(--warn, #d9a441); }
  svg.erd text.erd-fk { fill: var(--accent); }

  /* ── home, menus, the form ── */
  .home { padding: 22px 26px 40px; max-width: 980px; }
  .home h2 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 600; }
  .home p.lead { margin: 0 0 16px; color: var(--text-dim); line-height: 1.6; max-width: 72ch; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .card { display: flex; flex-direction: column; gap: 5px; padding: 11px 13px; border: 1px solid var(--border); border-radius: calc(var(--radius, 8px) + 2px); background: var(--bg-panel); cursor: pointer; min-width: 0; }
  .card:hover { border-color: var(--text-faint); }
  .card .top { display: flex; align-items: center; gap: 7px; }
  .card .top b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .at { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.add { align-items: center; justify-content: center; border-style: dashed; color: var(--text-dim); min-height: 70px; }
  .menu { position: fixed; z-index: 40; min-width: 190px; padding: 4px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-elevated); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4); max-height: 80vh; overflow: auto; }
  .menu button { display: block; width: 100%; text-align: left; padding: 4px 10px; border-radius: calc(var(--radius, 8px) - 3px); white-space: nowrap; }
  .menu button:hover { background: var(--accent-soft); }
  .menu button.danger { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  .menu .hd { padding: 4px 10px 2px; color: var(--text-faint); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.07em; }
  .menu .hist { max-width: 560px; white-space: normal; }
  .menu .hist .q { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 0.92rem; max-height: 3.2em; overflow: hidden; overflow-wrap: anywhere; }
  .menu .hist .w { display: block; color: var(--text-faint); font-size: 0.85rem; }
  .menu input { width: 100%; margin-bottom: 4px; }

<script>
(function () {
  'use strict';

  var ENGINES = {
    postgres: { label: 'PostgreSQL', short: 'PG', port: 5432 },

    sqlite: { label: 'SQLite', short: 'SL', port: null }

  var KEYWORDS = ['SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'NOT', 'NULL', 'IS', 'IN', 'LIKE', 'ILIKE', 'BETWEEN', 'EXISTS', 'AS', 'ON', 'JOIN', 'LEFT', 'RIGHT', 'INNER', 'OUTER', 'FULL', 'CROSS', 'USING', 'GROUP', 'BY', 'ORDER', 'HAVING', 'LIMIT', 'OFFSET', 'DISTINCT', 'UNION', 'ALL', 'EXCEPT', 'INTERSECT', 'INSERT', 'INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE', 'RETURNING', 'CREATE', 'ALTER', 'DROP', 'TRUNCATE', 'TABLE', 'VIEW', 'INDEX', 'SCHEMA', 'DATABASE', 'SEQUENCE', 'FUNCTION', 'PROCEDURE', 'TRIGGER', 'COLUMN', 'CONSTRAINT', 'PRIMARY', 'FOREIGN', 'KEY', 'REFERENCES', 'UNIQUE', 'CHECK', 'DEFAULT', 'CASCADE', 'IF', 'ADD', 'RENAME', 'TO', 'BEGIN', 'COMMIT', 'ROLLBACK', 'TRANSACTION', 'EXPLAIN', 'ANALYZE', 'WITH', 'RECURSIVE', 'CASE', 'WHEN', 'THEN', 'ELSE', 'END', 'ASC', 'DESC', 'COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'COALESCE', 'CAST', 'TRUE', 'FALSE', 'GRANT', 'REVOKE', 'MATERIALIZED', 'REFRESH', 'VACUUM', 'SHOW', 'DESCRIBE', 'USE', 'OVER', 'PARTITION', 'INTERVAL', 'NOW', 'CURRENT_TIMESTAMP', 'CURRENT_DATE'];

  var ROW_LIMITS = [100, 1000, 5000, 20000];
  var PAGE_SIZES = [50, 200, 1000, 5000];
  var CHUNK = 300;
  var GROUPS = [
    { kind: 'table', label: 'Tables', icon: 'T', cls: 't' },
    { kind: 'view', label: 'Views', icon: 'V', cls: 'v' },
    { kind: 'matview', label: 'Materialized views', icon: 'M', cls: 'v' },
    { kind: 'foreign', label: 'Foreign tables', icon: 'F', cls: 't' },
    { kind: 'partition', label: 'Partitions', icon: 'P', cls: 't' },
    { kind: 'sequence', label: 'Sequences', icon: 'S', cls: '' },
    { kind: 'routine', label: 'Functions', icon: 'ƒ', cls: 'f' }

  /**
   * What else a schema and a database hold, beyond what has a row of its own
   * in the tree: each is a page that is read, listed under "More". Per engine,
   * so nothing is offered that the engine has no word for.
   */
  var MORE = {
    schema: {
      postgres: [['indexes', 'Indexes'], ['triggers', 'Triggers'], ['rules', 'Rules'], ['policies', 'Row-level security'], ['partitions', 'Partitioning'], ['types', 'Types and domains']],
      mysql: [['indexes', 'Indexes'], ['triggers', 'Triggers'], ['events', 'Scheduled events'], ['partitions', 'Partitioning']],
      sqlite: [['indexes', 'Indexes'], ['triggers', 'Triggers']]
    },
    database: {
      postgres: [['extensions', 'Extensions'], ['foreign', 'Foreign data'], ['publications', 'Publications and subscriptions'], ['eventTriggers', 'Event triggers'], ['languages', 'Languages and casts']]
    }
  };

  /**
   * The statement that changes one setting of the server, or puts it back.
   *
   * PostgreSQL writes it to its own file and has to be told to read it again;
   * MySQL changes the running value and remembers it in one go. A name that is
   * not a setting's name writes nothing — it goes into the statement unquoted,
   * because that is the only way either server takes it.
   */
  function settingSql(engine, name, value, reset) {
    if (!/^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)?$/.test(String(name || ''))) return null;
    var text = String(value === null || value === undefined ? '' : value).trim();
    if (!reset && text === '' && engine !== 'postgres') return null;
    if (engine === 'postgres') {
      return (reset ? 'ALTER SYSTEM RESET ' + name : 'ALTER SYSTEM SET ' + name + " = '" + text.replace(/'/g, "''") + "'") + ';\nSELECT pg_reload_conf();';
    }
    if (engine !== 'mysql') return null;
    if (reset) return 'RESET PERSIST ' + name + ';';
    var bare = /^-?\d+(\.\d+)?$/.test(text) || /^(ON|OFF|TRUE|FALSE|DEFAULT)$/i.test(text);
    return 'SET PERSIST ' + name + ' = ' + (bare ? text : "'" + text.replace(/\\/g, '\\\\').replace(/'/g, "''") + "'") + ';';
  }

  /** A row that is a statement the server remembers leads to that statement, in a query tab, to be read and explained. */
  function reportStatement(columns, row) {
    var at = columns.map(function (column) { return column.name; }).indexOf('statement');
    return at >= 0 && row[at] ? String(row[at]) : null;
  }

  /** Where a row of a report leads when it names a table: that table, in the schema the row says or the one the page is about. */
  function reportTarget(columns, row, fallbackSchema) {
    var names = columns.map(function (column) { return column.name; });
    var table = row[names.indexOf('table')];
    if (names.indexOf('table') < 0 || !table) return null;
    var schema = names.indexOf('schema') >= 0 ? row[names.indexOf('schema')] : fallbackSchema;
    return { schema: schema || null, table: table };
  }

  var state = {
    started: false,
    showing: true,
    connections: [],
    saved: [],
    open: {},
    cache: {},
    filter: '',
    tabs: [],
    active: null,
    seq: 0,
    sideWidth: 270
  };

  // ───────────────────────────────────────────────────────────── pure parts ──

  /** A name, quoted the way its engine quotes names. */
  function qi(engine, name) {
    var text = String(name == null ? '' : name);
    return engine === 'mysql' ? '`' + text.replace(/`/g, '``') + '`' : '"' + text.replace(/"/g, '""') + '"';
  }

  /** `schema.table`, each half quoted. SQLite has no schema worth writing. */
  function qname(engine, schema, name) {
    return engine === 'sqlite' || !schema ? qi(engine, name) : qi(engine, schema) + '.' + qi(engine, name);
  }

  function fmtBytes(value) {
    var n = Number(value);
    if (value === null || value === undefined || !isFinite(n)) return '';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1; }
    return (i === 0 ? String(n) : n.toFixed(n < 10 ? 1 : 0)) + ' ' + units[i];
  }

  function fmtCount(value) {
    var n = Number(value);
    if (value === null || value === undefined || !isFinite(n)) return '';
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function fmtMs(value) {
    var n = Number(value) || 0;
    if (n < 1000) return n + ' ms';
    if (n < 60000) return (n / 1000).toFixed(n < 10000 ? 2 : 1) + ' s';
    return Math.floor(n / 60000) + ' min ' + Math.round((n % 60000) / 1000) + ' s';
  }

  function ago(at, now) {
    var seconds = Math.max(0, Math.round(((now || Date.now()) - Number(at)) / 1000));
    if (seconds < 45) return 'just now';
    if (seconds < 3600) return Math.max(1, Math.round(seconds / 60)) + ' min ago';
    if (seconds < 86400) return Math.round(seconds / 3600) + ' h ago';
    return Math.round(seconds / 86400) + ' d ago';
  }

  /** Whether a column's type is a number, so its cells line up on the right. */
  function isNumeric(type) {
    // Anchored at both ends of the word: `interval` starts with `int` and is not a number.
    return /^((small|big|medium|tiny)?int(eger)?\d*|numeric|decimal|real|double|float\d*|money|(small|big)?serial|long(long)?|newdecimal|short|year)\b/i.test(String(type || ''));
  }

  /**
   * SQL as pieces to colour: keywords, strings, comments, numbers, and the rest.
   * Not a parser — enough to tell a keyword from the same word inside a string.
   */
  function sqlTokens(text) {
    var source = String(text == null ? '' : text);
    var out = [];
    var re = /(--[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:[^']|'')*'?|\$([A-Za-z_]*)\$[\s\S]*?(?:\$\3\$|$))|("(?:[^"]|"")*"?|`(?:[^`]|``)*`?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_$]*)|(\s+)|([\s\S])/g;
    var match;
    while ((match = re.exec(source))) {
      if (match[1] !== undefined) out.push({ t: 'com', s: match[1] });
      else if (match[2] !== undefined) out.push({ t: 'str', s: match[2] });
      else if (match[4] !== undefined) out.push({ t: 'id', s: match[4] });
      else if (match[5] !== undefined) out.push({ t: 'num', s: match[5] });
      else if (match[6] !== undefined) out.push({ t: KEYWORD_SET[match[6].toUpperCase()] === true ? 'kw' : 'word', s: match[6] });
      else out.push({ t: 'ws', s: match[0] });
    }
    return out;
  }

  var FORMAT_CLAUSES = { SELECT: 1, FROM: 1, WHERE: 1, HAVING: 1, LIMIT: 1, OFFSET: 1, VALUES: 1, SET: 1, RETURNING: 1, UNION: 1, EXCEPT: 1, INTERSECT: 1, UPDATE: 1, INSERT: 1, DELETE: 1, WITH: 1, JOIN: 1 };
  var FORMAT_STARTS = { SELECT: 1, WITH: 1, INSERT: 1, UPDATE: 1, DELETE: 1, EXPLAIN: 1, VALUES: 1 };
  var JOIN_WORDS = { LEFT: 1, RIGHT: 1, INNER: 1, FULL: 1, CROSS: 1, NATURAL: 1 };

  /**
   * SQL laid out the way it reads: a clause to a line, a column to a line when
   * there are several, AND and OR under their WHERE, a subquery indented.
   *
   * It moves whitespace and capitalises keywords, and that is all it does.
   * Nothing is added where two things were written together, so `a.b`,
   * `x::int` and `f(x)` stay as they were, and what is inside quotes and
   * comments is never looked at. Statements that are not queries — CREATE,
   * ALTER, a function body — are left exactly as they were typed, because a
   * formatter that guesses at DDL does more harm than none.
   */
  function formatSql(text) {
    var items = [];
    var gap = '';
    sqlTokens(text).forEach(function (token) {
      if (token.t === 'ws' && /^\s+$/.test(token.s)) { gap += token.s; return; }
      items.push({ t: token.t === 'ws' ? 'op' : token.t, s: token.s, gap: gap });
      gap = '';
    });
    var statements = [];
    var current = [];
    items.forEach(function (item) {
      if (item.t === 'op' && item.s === ';') { statements.push(current); current = []; } else current.push(item);

    var open = current.length > 0;
    if (open) statements.push(current);
    var out = statements.filter(function (list) { return list.length; }).map(function (list) {

    return out.join(';\n\n') + (open && items[items.length - 1].s !== ';' && !/;\s*$/.test(String(text)) ? '' : ';');
  }

  function flowSql(items) {
    var out = '';
    var level = 0;
    var stack = [{ sub: true, clause: '', multi: false, pending: false }];
    var between = false;
    // A keyword written straight after a dot is a column that happens to be called that: `t.select`, `o.from`.

    }
    for (var i = 0; i < items.length; i += 1) {
      var item = items[i];
      var prev = items[i - 1];
      var top = stack[stack.length - 1];
      var glued = i > 0 && item.gap === '';
      var keyword = item.t === 'kw' && !(glued && prev.s === '.');
      var upper = keyword ? item.s.toUpperCase() : '';
      var before = upperAt(i - 1);
      var sep = i === 0 ? '' : glued ? '' : ' ';
      var broke = false;
      var flow = !top.fn;

      if (item.t === 'op' && item.s === ')') {
        if (stack.length > 1) {
          var closed = stack.pop();
          if (closed.sub) { level -= 1; line(0); broke = true; }
          top = stack[stack.length - 1];
        }
        sep = '';
      } else if (i > 0 && prev.t === 'com' && /^--/.test(prev.s)) {

        broke = true;
      } else if (i > 0 && item.t === 'com' && /\n/.test(item.gap)) {
        line(0);
        broke = true;
      }

      if (i > 0 && keyword && flow) {
        var starts = false;
        if (upper === 'WITH') starts = prev.s === '(';
        else if (upper === 'INSERT' || upper === 'UPDATE' || upper === 'DELETE') starts = prev.s === ')' || before === 'EXPLAIN' || before === 'ANALYZE';
        else if (upper === 'SET') starts = top.clause === 'UPDATE';
        else if (upper === 'FROM') starts = before !== 'DELETE' && !(before === 'DISTINCT' && (upperAt(i - 2) === 'IS' || upperAt(i - 2) === 'NOT'));
        else if (upper === 'JOIN') starts = JOIN_WORDS[before] !== 1 && before !== 'OUTER';
        else if (JOIN_WORDS[upper] === 1) starts = upperAt(i + 1) === 'JOIN' || (upperAt(i + 1) === 'OUTER' && upperAt(i + 2) === 'JOIN');
        else if (upper === 'GROUP' || upper === 'ORDER') starts = upperAt(i + 1) === 'BY';
        else if (upper === 'VALUES') starts = true;
        else starts = FORMAT_CLAUSES[upper] === 1;
        if (starts) {
          if (!broke) line(0);
          broke = true;
          top.clause = JOIN_WORDS[upper] === 1 ? 'JOIN' : upper;
          top.multi = (upper === 'SELECT' || upper === 'SET') && listed(i);
          top.pending = top.multi;
          between = false;
        } else if ((upper === 'AND' || upper === 'OR') && (top.clause === 'WHERE' || top.clause === 'HAVING' || top.clause === 'JOIN')) {
          if (upper === 'AND' && between) between = false;
          else if (!broke) { line(2); broke = true; }
        } else if (top.pending && upper !== 'DISTINCT' && upper !== 'ALL') {
          top.pending = false;
          if (!broke) { line(2); broke = true; }
        }
      } else if (i === 0 && keyword) {
        top.clause = upper;
        top.multi = upper === 'SELECT' && listed(0);
        top.pending = top.multi;
      } else if (i > 0 && flow && top.pending && !(item.t === 'op' && (item.s === ',' || item.s === ')'))) {
        top.pending = false;
        if (!broke) { line(2); broke = true; }
      }

      if (!broke && i > 0) {
        if (item.t === 'op' && (item.s === ',' || item.s === ')')) sep = '';
        else if (prev.t === 'op' && prev.s === ',') {
          if (flow && top.multi && (top.clause === 'SELECT' || top.clause === 'SET')) { line(2); broke = true; } else if (flow && top.clause === 'WITH') { line(0); broke = true; } else sep = ' ';
        } else if (prev.t === 'op' && prev.s === '(') sep = '';
      }
      if (upper === 'BETWEEN') between = true;
      out += (broke ? '' : sep) + (keyword ? upper : item.s);

      if (item.t === 'op' && item.s === '(') {
        var inner = upperAt(i + 1);
        var sub = flow && (inner === 'SELECT' || inner === 'WITH');
        stack.push({ sub: sub, fn: !sub, clause: '', multi: false, pending: false });
        if (sub) {
          level += 1;
          // The clause that follows starts its own line; say so here, because it is not "after the first token".
          line(0);
          var fresh = stack[stack.length - 1];
          fresh.clause = inner;
          fresh.multi = inner === 'SELECT' && listed(i + 1);
          fresh.pending = fresh.multi;
          out += inner;
          i += 1;
        }
      }
    }
    return out.replace(/[ \t]+\n/g, '\n').trim();
  }

  /** The word being typed at the caret, and the name before its dot if it has one. */
  function wordAt(text, caret) {
    var before = String(text).slice(0, caret);
    var match = /(?:([A-Za-z_][A-Za-z0-9_$]*)\.)?([A-Za-z_][A-Za-z0-9_$]*)?$/.exec(before);
    var word = match && match[2] ? match[2] : '';
    var qualifier = match && match[1] ? match[1] : '';
    if (!word && !qualifier) return { word: '', qualifier: '', start: caret };
    return { word: word, qualifier: qualifier, start: caret - word.length };
  }

  /**
   * What to offer for a word being typed.
   *
   * After `name.` it is that table's columns, or that schema's tables, and
   * nothing else. Otherwise tables first, then the columns of the tables the
   * query already mentions, then keywords — and nothing at all for one letter,
   * unless it was asked for.
   */
  function suggest(word, qualifier, known, forced) {
    var prefix = String(word || '').toLowerCase();
    var out = [];
    var seen = {};
    function offer(text, kind) {
      var lower = String(text).toLowerCase();
      if (seen[lower] || lower === prefix) return;
      if (prefix && lower.indexOf(prefix) !== 0) return;
      seen[lower] = true;
      out.push({ text: String(text), kind: kind });
    }
    if (qualifier) {
      var q = qualifier.toLowerCase();
      Object.keys(known.columns || {}).forEach(function (table) {
        if (table.toLowerCase() === q) known.columns[table].forEach(function (column) { offer(column, 'column'); });
      });
      (known.tables || []).forEach(function (table) {
        if (String(table.schema || '').toLowerCase() === q) offer(table.name, table.kind || 'table');
      });
      return out.slice(0, 40);
    }
    if (!forced && prefix.length < 2) return [];
    (known.tables || []).forEach(function (table) { offer(table.name, table.kind || 'table'); });
    (known.mentioned || []).forEach(function (table) {
      ((known.columns || {})[table] || []).forEach(function (column) { offer(column, 'column'); });
    });
    (known.schemas || []).forEach(function (schema) { offer(schema, 'schema'); });
    KEYWORDS.forEach(function (keyword) { offer(keyword, 'keyword'); });
    return out.slice(0, 14);
  }

  /**
   * What the grid changed, as the three lists the app saves in one transaction.
   *
   * A row is named by its key as it was read, never by where it sat on the
   * page. A row marked for deletion is deleted and none of its edits are sent;
   * an added row sends only the cells somebody filled in, so the rest take
   * their defaults.
   */
  function buildChanges(columns, key, rows, edits, deleted, added) {
    var names = columns.map(function (column) { return column.name; });
    function keyOf(row) {
      var out = {};
      key.forEach(function (column) { out[column] = row[names.indexOf(column)]; });
      return out;
    }
    var changes = { updates: [], inserts: [], deletes: [] };
    Object.keys(deleted || {}).forEach(function (r) {
      if (deleted[r] && rows[r]) changes.deletes.push(keyOf(rows[r]));
    });
    Object.keys(edits || {}).forEach(function (r) {
      if ((deleted || {})[r] || !rows[r]) return;
      var set = {};
      var any = false;
      Object.keys(edits[r]).forEach(function (column) {
        var index = names.indexOf(column);
        if (index < 0 || edits[r][column] === rows[r][index]) return;
        set[column] = edits[r][column];
        any = true;
      });
      if (any) changes.updates.push({ key: keyOf(rows[r]), set: set });
    });
    (added || []).forEach(function (row) {
      var values = {};
      Object.keys(row).forEach(function (column) { if (row[column] !== undefined) values[column] = row[column]; });
      changes.inserts.push(values);
    });
    return changes;
  }

  function changeCount(changes) {
    return changes.updates.length + changes.inserts.length + changes.deletes.length;
  }

  /** Rows in the order a clicked column asks for: numbers as numbers, NULL last. */
  function sortedOrder(rows, column, desc, numeric) {
    var order = rows.map(function (_, index) { return index; });
    order.sort(function (a, b) {
      var x = rows[a][column];
      var y = rows[b][column];
      if (x === null && y === null) return a - b;
      if (x === null) return 1;
      if (y === null) return -1;
      var result = numeric && isFinite(Number(x)) && isFinite(Number(y)) ? Number(x) - Number(y) : String(x) < String(y) ? -1 : String(x) > String(y) ? 1 : 0;
      return (desc ? -result : result) || a - b;
    });
    return order;
  }

  /** A value as a reader wants it: JSON laid out, everything else as it is. */
  function pretty(value) {
    var text = String(value);
    if (text.length < 200000 && /^\s*[[{]/.test(text)) {
      try { return JSON.stringify(JSON.parse(text), null, 2); } catch (error) { return text; }
    }
    return text;
  }

  /** The statement a tree action starts a query tab with. */
  function scriptFor(kind, engine, schema, name, columns) {
    var target = qname(engine, schema, name);
    var cols = (columns || []).map(function (column) { return qi(engine, column); });

  function connOf(id) {
    for (var i = 0; i < state.connections.length; i += 1) if (state.connections[i].id === id) return state.connections[i];
    return null;
  }

  /** What every call that may stop and ask carries, so the question can say where. */
  function where(conn, database) {
    return { id: conn.id, connectionName: conn.name, production: conn.production, engine: conn.engine, database: database || '' };
  }

  var rememberTimer = null;
  function rememberSoon() {
    clearTimeout(rememberTimer);
    rememberTimer = setTimeout(function () {
      host.emit('remember', {
        sideWidth: state.sideWidth,
        active: state.active,
        tabs: state.tabs.filter(function (tab) { return tab.kind !== 'home'; }).slice(0, 20).map(function (tab) {
          return {
            id: tab.id, kind: tab.kind, conn: tab.conn, database: tab.database, schema: tab.schema, name: tab.name, sub: tab.sub,
            title: tab.title, sql: tab.kind === 'query' ? String(tab.sql || '').slice(0, 20000) : undefined, routine: tab.routine
          };
        })
      });
    }, 500);
  }

  // ─────────────────────────────────────────────────────────────── loading ──

  function load(key, fetcher, force) {
    var slot = state.cache[key];
    if (slot && (slot.loading || ((slot.data || slot.error) && !force))) return slot;
    slot = state.cache[key] = { loading: true, error: null, data: slot ? slot.data : null };
    fetcher().then(function (data) {
      slot.loading = false;
      slot.data = data;
    }, function (error) {
      slot.loading = false;
      slot.data = null;
      slot.error = error && error.message ? error.message : String(error);
    }).then(function () {
      drawTree();
      markLive();
    });
    return slot;
  }

  /** Forget what was read under a connection (or one database of it), so the tree asks again. */
  function forget(id, database) {
    Object.keys(state.cache).forEach(function (key) {
      var rest = key.slice(key.indexOf(':') + 1);
      if (rest === id || rest.indexOf(id + '/' + (database ? database + '/' : '')) === 0 || (database && rest === id + '/' + database)) delete state.cache[key];
    });
  }

  function refreshOverview() {
    return call('overview').then(function (data) {
      state.connections = data.connections || [];
      state.saved = data.saved || [];
      drawTree();
      state.tabs.forEach(function (tab) { if (tab.kind === 'home') drawHome(tab); });
    });
  }

  function markLive() {
    call('overview').then(function (data) {
      var live = {};
      (data.connections || []).forEach(function (conn) { live[conn.id] = conn.open; });
      state.connections.forEach(function (conn) { conn.open = Boolean(live[conn.id]); });
      var dots = document.querySelectorAll('[data-live]');
      for (var i = 0; i < dots.length; i += 1) dots[i].className = 'dot' + (live[dots[i].getAttribute('data-live')] ? ' live' : '');
    }, function () {});
  }

  // ────────────────────────────────────────────────────────────── the tree ──

  function toggle(key) {
    if (state.open[key]) delete state.open[key];
    else state.open[key] = true;
    drawTree();
  }

  function treeRow(depth, opts) {
    var row = h('div', {
      class: 'tr' + (opts.cls ? ' ' + opts.cls : ''),
      style: 'padding-left:' + (6 + depth * 14) + 'px',
      title: opts.title || null,
      onclick: opts.onclick || null,
      ondblclick: opts.ondblclick || null,
      oncontextmenu: opts.menu ? function (event) { event.preventDefault(); openMenu(event.clientX, event.clientY, opts.menu()); } : null
    });
    row.appendChild(h('span', { class: 'tw' + (opts.open ? ' open' : ''), text: opts.open === undefined ? '' : '›' }));
    append(row, opts.lead);
    row.appendChild(h('span', { class: 'lb', text: opts.label }));
    if (opts.count !== undefined && opts.count !== null) row.appendChild(h('span', { class: 'ct', text: String(opts.count) }));
    append(row, opts.tail);
    if (opts.menu) {
      row.appendChild(h('button', {
        class: 'more', text: '⋯', title: 'Actions',
        onclick: function (event) {
          event.stopPropagation();
          var box = event.currentTarget.getBoundingClientRect();
          openMenu(box.left, box.bottom + 2, opts.menu());
        }
      }));
    }
    return row;
  }

  function noteRow(depth, text, cls) {
    return h('div', { class: 'tr note' + (cls ? ' ' + cls : ''), style: 'padding-left:' + (24 + depth * 14) + 'px', text: text });
  }

  function slotRows(box, depth, slot, retry) {
    if (slot.loading && !slot.data) { box.appendChild(noteRow(depth, 'Loading…')); return false; }
    if (slot.error) {
      var row = h('div', { class: 'tr err', style: 'padding-left:' + (24 + depth * 14) + 'px' }, h('span', { text: slot.error + ' ' }), h('span', { class: 'link', text: 'Retry', onclick: retry }));
      box.appendChild(row);
      return false;
    }
    return Boolean(slot.data);
  }

  function drawTree() {
    var box = clear($('tree'));
    if (!state.connections.length) {
      box.appendChild(h('div', { class: 'empty', text: 'No connections yet. Add one to see its tables here.' }));
      return;
    }
    state.connections.forEach(function (conn) {
      var key = 'c:' + conn.id;
      var isOpen = Boolean(state.open[key]);
      box.appendChild(treeRow(0, {
        label: conn.name,
        title: conn.engine === 'sqlite' ? conn.file : (conn.user ? conn.user + '@' : '') + conn.host + ':' + conn.port + (conn.database ? '/' + conn.database : ''),
        open: isOpen,
        lead: [h('span', { class: 'dot' + (conn.open ? ' live' : ''), 'data-live': conn.id }), h('span', { class: 'eng ' + conn.engine, text: ENGINES[conn.engine].short })],
        tail: [conn.production ? h('span', { class: 'tag prod', text: 'PROD' }) : null, conn.readOnly ? h('span', { class: 'tag ro', text: 'read-only' }) : null],
        onclick: function () { toggle(key); },
        menu: function () { return connMenu(conn); }
      }));
      if (!isOpen) return;
      if (conn.engine === 'sqlite') { drawGroups(box, conn, 'main', null, 1); return; }
      var slot = load('dbs:' + conn.id, function () { return call('databases', { id: conn.id }); });
      if (!slotRows(box, 1, slot, function () { forget(conn.id); drawTree(); })) return;
      slot.data.databases.forEach(function (database) {
        var dkey = 'd:' + conn.id + '/' + database.name;
        var dOpen = Boolean(state.open[dkey]);
        box.appendChild(treeRow(1, {
          label: database.name,
          cls: database.system ? 'sys' : '',
          open: dOpen,
          lead: h('span', { class: 'ic d', text: 'DB' }),
          count: database.size ? fmtBytes(database.size) : null,
          onclick: function () { toggle(dkey); },
          menu: function () { return databaseMenu(conn, database.name); }
        }));
        if (!dOpen) return;
        if (conn.engine === 'mysql') { drawGroups(box, conn, database.name, database.name, 2); return; }
        var schemas = load('sch:' + conn.id + '/' + database.name, function () { return call('schemas', { id: conn.id, database: database.name }); });
        if (!slotRows(box, 2, schemas, function () { forget(conn.id, database.name); drawTree(); })) return;
        schemas.data.schemas.forEach(function (schema) {
          var skey = 's:' + conn.id + '/' + database.name + '/' + schema.name;
          var sOpen = Boolean(state.open[skey]);
          box.appendChild(treeRow(2, {
            label: schema.name,
            cls: schema.system ? 'sys' : '',
            open: sOpen,
            lead: h('span', { class: 'ic', text: '{}' }),
            onclick: function () { toggle(skey); },
            menu: function () { return schemaMenu(conn, database.name, schema.name); }
          }));
          if (sOpen) drawGroups(box, conn, database.name, schema.name, 3);
        });
        drawMore(box, conn, database.name, undefined, 2, MORE.database[conn.engine] || []);
      });
    });
    if (state.saved.length) {
      var skey = 'saved';
      box.appendChild(treeRow(0, { label: 'Saved queries', cls: 'grp', open: Boolean(state.open[skey]), count: state.saved.length, onclick: function () { toggle(skey); } }));
      if (state.open[skey]) {
        state.saved.forEach(function (saved) {
          box.appendChild(treeRow(1, {
            label: saved.name,
            title: saved.sql.slice(0, 600),
            lead: h('span', { class: 'ic f', text: '★' }),
            onclick: function () { openSaved(saved); },
            menu: function () {
              return [
                { label: 'Open', run: function () { openSaved(saved); } },
                { label: 'Delete', danger: true, run: function () { call('deleteQuery', { id: saved.id }).then(function (data) { state.saved = data.saved || []; drawTree(); }, fail); } }
              ];
            }
          }));
        });
      }
    }
  }

  function objectsKey(conn, database, schema) { return 'obj:' + conn.id + '/' + database + '/' + (schema || ''); }

  function drawGroups(box, conn, database, schema, depth) {
    var slot = load(objectsKey(conn, database, schema), function () { return call('objects', { id: conn.id, database: database, schema: schema }); });
    if (!slotRows(box, depth, slot, function () { delete state.cache[objectsKey(conn, database, schema)]; drawTree(); })) return;
    var filter = state.filter.trim().toLowerCase();
    var any = false;
    GROUPS.forEach(function (group) {
      var items = group.kind === 'routine' ? slot.data.routines : slot.data.relations.filter(function (one) { return one.kind === group.kind; });
      if (filter) items = items.filter(function (one) { return one.name.toLowerCase().indexOf(filter) >= 0; });
      if (!items.length && !(group.kind === 'table' && !filter)) return;
      any = true;
      var gkey = 'g:' + conn.id + '/' + database + '/' + (schema || '') + '/' + group.kind;
      var isOpen = filter ? true : state.open[gkey] !== undefined ? Boolean(state.open[gkey]) : group.kind === 'table';
      box.appendChild(treeRow(depth, {
        label: group.label,
        cls: 'grp',
        open: isOpen,
        count: items.length,
        onclick: function () { state.open[gkey] = !isOpen; drawTree(); },
        menu: group.kind === 'table' && !conn.readOnly ? function () { return [{ label: 'Create table…', run: function () { openDesigner(conn, database, schema, ''); } }, { label: 'Refresh', run: function () { delete state.cache[objectsKey(conn, database, schema)]; drawTree(); } }]; } : null
      }));
      if (!isOpen) return;
      items.slice(0, 1500).forEach(function (item) {
        if (group.kind === 'routine') {
          box.appendChild(treeRow(depth + 1, {
            label: item.name + (item.args ? '(' + item.args + ')' : ''),
            title: (item.kind || 'function') + (item.returns ? ' → ' + item.returns : ''),
            lead: h('span', { class: 'ic ' + group.cls, text: item.kind === 'procedure' ? 'P' : group.icon }),
            onclick: function () { openRoutine(conn, database, schema, item); }
          }));
          return;
        }
        var on = state.active && activeTab() && activeTab().key === tableKey(conn.id, database, schema, item.name);
        box.appendChild(treeRow(depth + 1, {
          label: item.name,
          cls: on ? 'on' : '',
          title: item.parent ? 'A partition of ' + item.parent : item.comment || null,
          lead: h('span', { class: 'ic ' + group.cls, text: group.icon }),
          count: group.kind === 'sequence' ? null : item.rows !== null && item.rows !== undefined ? '~' + fmtCount(item.rows) : null,
          onclick: function () { openTable(conn, database, schema, item.name, group.kind === 'sequence' ? 'structure' : 'data'); },
          menu: function () { return relationMenu(conn, database, schema, item); }
        }));
      });
      if (items.length > 1500) box.appendChild(noteRow(depth + 1, '… ' + (items.length - 1500) + ' more. Filter to find one.'));
    });
    if (!any) box.appendChild(noteRow(depth, filter ? 'Nothing matches the filter.' : 'Nothing here.'));
    if (!filter) drawMore(box, conn, database, schema, depth, MORE.schema[conn.engine] || []);
  }

  /** The pages of "More": one row each, opening what the server says about that kind of thing. */
  function drawMore(box, conn, database, schema, depth, pages) {
    if (!pages.length) return;
    var key = 'm:' + conn.id + '/' + database + '/' + (schema === undefined ? '*' : schema || '');
    var isOpen = Boolean(state.open[key]);
    box.appendChild(treeRow(depth, { label: 'More', cls: 'grp', open: isOpen, onclick: function () { toggle(key); } }));
    if (!isOpen) return;
    pages.forEach(function (page) {
      box.appendChild(treeRow(depth + 1, {
        label: page[1],
        lead: h('span', { class: 'ic', text: '≡' }),
        onclick: function () { openReport(conn, database, page[0], page[1] + ' · ' + (schema || database), schema === undefined ? null : schema); }
      }));
    });
  }

  // ─────────────────────────────────────────────────────────────── menus ──

  var menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  function openMenu(x, y, items) {
    closeMenu();
    menuEl = h('div', { class: 'menu', onclick: function (event) { event.stopPropagation(); } });
    items.forEach(function (item) {
      if (!item) return;
      if (item.sep) menuEl.appendChild(h('hr'));
      else if (item.head) menuEl.appendChild(h('div', { class: 'hd', text: item.head }));
      else if (item.el) menuEl.appendChild(item.el);
      else menuEl.appendChild(h('button', { class: item.danger ? 'danger' : '', text: item.label, onclick: function () { closeMenu(); item.run(); } }));
    });
    document.body.appendChild(menuEl);
    var box = menuEl.getBoundingClientRect();
    var zoom = box.width && menuEl.offsetWidth ? box.width / menuEl.offsetWidth : 1;
    var left = Math.max(4, Math.min(x, window.innerWidth - box.width - 6)) / zoom;
    var top = Math.max(4, Math.min(y, window.innerHeight - box.height - 6)) / zoom;
    menuEl.style.left = left + 'px';
    menuEl.style.top = top + 'px';
  }

  /** Run one statement the tree asked for. The app stops and asks first when it takes something away. */
  function runNow(conn, database, sql, done) {
    call('query', Object.assign(where(conn, database), { tab: 'tree', sql: sql })).then(function (data) {
      var last = data.results[data.results.length - 1];
      if (last && last.error) { say(last.error.error, true); return; }
      say('Done');
      forget(conn.id, conn.engine === 'postgres' ? database : null);
      drawTree();
      if (done) done();
    }, fail);
  }

  function connMenu(conn) {
    return [
      { label: 'New query', run: function () { openQuery(conn, conn.engine === 'sqlite' ? 'main' : conn.database, ''); } },
      { label: shellLabel(conn.engine), run: function () { openShell(conn, conn.engine === 'sqlite' ? 'main' : conn.database); } },
      { label: conn.engine === 'sqlite' ? 'About this file' : 'Server: dashboard, activity, locks…', run: function () { openServer(conn); } },
      conn.engine === 'sqlite' ? { label: 'Search objects…', run: function () { openSearch(conn, 'main'); } } : null,
      conn.engine === 'sqlite' ? { label: 'Back up…', run: function () { backup(conn, 'main'); } } : null,
      conn.engine === 'sqlite' ? { label: 'Diagram of its tables', run: function () { openErd(conn, 'main', null); } } : null,
      conn.engine === 'sqlite' ? { label: 'Compare with another file…', run: function () { openDiff(conn, 'main', ''); } } : null,
      conn.engine === 'sqlite' && !conn.readOnly ? { head: 'Maintenance' } : null,
    ].concat(conn.engine === 'sqlite' && !conn.readOnly ? maintenanceFor('sqlite', null, '').map(function (one) { return { label: one[0], run: function () { runNow(conn, 'main', one[1]); } }; }) : []).concat([
      { label: 'Refresh', run: function () { forget(conn.id); state.open['c:' + conn.id] = true; drawTree(); } },
      { sep: true },
      { label: 'Edit connection…', run: function () { openForm(conn); } },
      { label: 'Disconnect', run: function () { call('disconnect', { id: conn.id }).then(function () { forget(conn.id); delete state.open['c:' + conn.id]; drawTree(); markLive(); }, fail); } },
      { label: 'Forget connection…', danger: true, run: function () {
        call('deleteConnection', { id: conn.id, connectionName: conn.name }).then(function () {
          state.tabs.filter(function (tab) { return tab.conn === conn.id; }).forEach(function (tab) { closeTab(tab, true); });
          forget(conn.id);
          refreshOverview();
        }, fail);
      } }
    ]);
  }

  function databaseMenu(conn, database) {
    var items = [
      { label: 'New query', run: function () { openQuery(conn, database, ''); } },
      { label: shellLabel(conn.engine), run: function () { openShell(conn, database); } },
      { label: 'Search objects…', run: function () { openSearch(conn, database); } },
      { label: 'Performance: what is slow, and why', run: function () { openReport(conn, database, 'performance', 'Performance · ' + database, null); } },
      { label: 'Refresh', run: function () { forget(conn.id, database); drawTree(); } }
    ];
    if (conn.engine === 'mysql' && !conn.readOnly) items.push({ label: 'Grant or revoke privileges…', run: function () { openGrant(conn, database, database, ''); } });
    if (conn.engine === 'mysql') items.push({ label: 'Diagram of its tables', run: function () { openErd(conn, database, database); } });
    if (conn.engine === 'mysql') items.push({ label: 'Compare with another database…', run: function () { openDiff(conn, database, database); } });
    items.push({ sep: true }, { head: 'Backup' });
    items.push({ label: 'Back up…', run: function () { backup(conn, database, { format: 'plain' }); } });
    if (conn.engine === 'postgres') items.push({ label: 'Back up, pg_restore format…', run: function () { backup(conn, database, { format: 'custom' }); } });
    items.push({ label: 'Back up the structure only…', run: function () { backup(conn, database, { format: 'plain', schemaOnly: true }); } });
    if (!conn.readOnly) items.push({ label: 'Restore…', danger: true, run: function () { restore(conn, database); } });
    if (!conn.readOnly && conn.engine === 'postgres') {
      items.push({ sep: true }, { head: 'Maintenance' });
      maintenanceFor(conn.engine, null, '').forEach(function (one) { items.push({ label: one[0], run: function () { runNow(conn, database, one[1]); } }); });
    }
    if (!conn.readOnly) {
      items.push({ sep: true });
      if (conn.engine === 'postgres') items.push({ label: 'Create schema…', run: function () { openQuery(conn, database, 'CREATE SCHEMA new_schema;'); } });
      if (conn.engine === 'mysql') items.push({ label: 'Create table…', run: function () { openDesigner(conn, database, database, ''); } });
      items.push({ label: 'Create database…', run: function () { openQuery(conn, conn.database || database, 'CREATE DATABASE new_database;'); } });
      items.push({ label: 'Drop database…', danger: true, run: function () { runNow(conn, conn.engine === 'postgres' ? (conn.database && conn.database !== database ? conn.database : 'postgres') : '', 'DROP DATABASE ' + qi(conn.engine, database), function () { forget(conn.id); drawTree(); }); } });
    }
    return items;
  }

  function schemaMenu(conn, database, schema) {
    var items = [
      { label: 'New query', run: function () { openQuery(conn, database, ''); } },
      conn.readOnly ? null : { label: 'Grant or revoke privileges…', run: function () { openGrant(conn, database, schema, ''); } },
      { label: 'Diagram of its tables', run: function () { openErd(conn, database, schema); } },
      { label: 'Compare with another schema…', run: function () { openDiff(conn, database, schema); } },
      { label: 'Refresh', run: function () { delete state.cache[objectsKey(conn, database, schema)]; drawTree(); } }
    ];
    if (!conn.readOnly) {
      items.push({ sep: true });
      items.push({ label: 'Create table…', run: function () { openDesigner(conn, database, schema, ''); } });
      items.push({ label: 'Drop schema…', danger: true, run: function () { runNow(conn, database, 'DROP SCHEMA ' + qi(conn.engine, schema)); } });
      items.push({ label: 'Drop schema and everything in it…', danger: true, run: function () { runNow(conn, database, 'DROP SCHEMA ' + qi(conn.engine, schema) + ' CASCADE'); } });
    }
    return items;
  }

  function relationMenu(conn, database, schema, item) {
    var engine = conn.engine;
    var target = qname(engine, schema, item.name);
    // A partition is a table: it has rows, a structure, and everything a table's menu does.
    var kind = item.kind === 'partition' ? 'table' : item.kind;
    var noun = kind === 'view' ? 'VIEW' : kind === 'matview' ? 'MATERIALIZED VIEW' : kind === 'sequence' ? 'SEQUENCE' : kind === 'foreign' ? 'FOREIGN TABLE' : 'TABLE';
    function withColumns(what) {
      call('table', { id: conn.id, database: database, schema: schema, name: item.name }).then(function (data) {
        openQuery(conn, database, scriptFor(what, engine, schema, item.name, data.table.columns.map(function (column) { return column.name; })));
      }, fail);
    }
    var items = [];
    if (kind !== 'sequence') items.push({ label: 'Rows', run: function () { openTable(conn, database, schema, item.name, 'data'); } });
    items.push({ label: 'Structure', run: function () { openTable(conn, database, schema, item.name, 'structure'); } });
    items.push({ label: 'Definition (DDL)', run: function () { openTable(conn, database, schema, item.name, 'ddl'); } });
    if (kind === 'table' && !conn.readOnly) items.push({ label: 'Design: columns, types, defaults…', run: function () { openDesigner(conn, database, schema, item.name); } });
    if (kind !== 'sequence') {
      items.push({ sep: true }, { head: 'Script' });
      items.push({ label: 'SELECT', run: function () { withColumns('select'); } });
      if (kind === 'table') {
        items.push({ label: 'INSERT', run: function () { withColumns('insert'); } });
        items.push({ label: 'UPDATE', run: function () { withColumns('update'); } });
        items.push({ label: 'DELETE', run: function () { openQuery(conn, database, scriptFor('delete', engine, schema, item.name)); } });
      }
      items.push({ sep: true });
      items.push({ label: 'Export all rows…', run: function () { exportRows(conn, database, 'SELECT * FROM ' + target, item.name, schema, item.name); } });
      items.push({ label: 'Ask Claude about it', run: function () { askClaude({ id: conn.id, database: database, schema: schema, name: item.name }); } });
    }
    items.push({ label: 'Copy name', run: function () { copy(target); } });
    if (kind === 'table' && !conn.readOnly) items.push({ label: 'Import rows from a file…', run: function () { openImport(conn, database, schema, item.name); } });
    if (kind === 'table') items.push({ label: 'Back up this table…', run: function () { backup(conn, database, { format: 'plain', schema: schema, name: item.name }); } });
    if (!conn.readOnly && (kind === 'table' || kind === 'matview')) {
      var upkeep = maintenanceFor(engine, schema, item.name);
      if (upkeep.length) items.push({ sep: true }, { head: 'Maintenance' });
      upkeep.forEach(function (one) { items.push({ label: one[0], run: function () { runNow(conn, database, one[1], function () { reloadTabs(conn.id, database, schema, item.name); }); } }); });
    }
    if (!conn.readOnly) {
      items.push({ sep: true });
      if (kind === 'matview') items.push({ label: 'Refresh materialized view', run: function () { runNow(conn, database, 'REFRESH MATERIALIZED VIEW ' + target); } });
      if (kind === 'table' && engine !== 'sqlite') items.push({ label: 'Truncate…', danger: true, run: function () { runNow(conn, database, 'TRUNCATE TABLE ' + target, function () { reloadTabs(conn.id, database, schema, item.name); }); } });
      if (kind === 'table' && engine === 'sqlite') items.push({ label: 'Delete all rows…', danger: true, run: function () { runNow(conn, database, 'DELETE FROM ' + target, function () { reloadTabs(conn.id, database, schema, item.name); }); } });
      items.push({ label: 'Drop…', danger: true, run: function () { runNow(conn, database, 'DROP ' + noun + ' ' + target, function () { closeTabsOf(conn.id, database, schema, item.name); }); } });
      if (engine === 'postgres') items.push({ label: 'Drop, with what depends on it…', danger: true, run: function () { runNow(conn, database, 'DROP ' + noun + ' ' + target + ' CASCADE', function () { closeTabsOf(conn.id, database, schema, item.name); }); } });
    }
    return items;
  }

  function askClaude(args) {
    host.call('db.ask', args).then(function (result) {
      if (result && result.ok === false) say(result.error || 'Claude could not be asked', true);
    }, fail);
  }

  function exportRows(conn, database, sql, name, schema, table) {
    openMenu(window.innerWidth / 2 - 100, 120, [
      { head: 'Export as' },
      { label: 'CSV', run: function () { go('csv'); } },
      { label: 'JSON', run: function () { go('json'); } },
