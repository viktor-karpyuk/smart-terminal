  // ───────────────────────────────────────────────────────────────── tabs ──

  function activeTab() {
    for (var i = 0; i < state.tabs.length; i += 1) if (state.tabs[i].id === state.active) return state.tabs[i];
    return null;
  }

  function tableKey(id, database, schema, name) { return 't:' + id + '/' + database + '/' + (schema || '') + '/' + name; }

  function addTab(tab) {
    tab.id = tab.id || 'tab' + (++state.seq) + '-' + Date.now().toString(36);
    state.tabs = state.tabs.filter(function (one) {
      if (one.kind === 'home' && one.el) one.el.remove();
      return one.kind !== 'home';
    });
    state.tabs.push(tab);
    mount(tab);
    show(tab.id);
    return tab;
  }

  function mount(tab) {
    tab.el = h('div', { class: 'view', hidden: true });
    $('main').appendChild(tab.el);
    tab.mounted = false;
  }

  function show(id) {
    state.active = id;
    state.tabs.forEach(function (tab) {
      if (!tab.el) mount(tab);
      tab.el.hidden = tab.id !== id;
      if (tab.id === id && !tab.mounted) {
        tab.mounted = true;
        if (tab.kind === 'table') drawTable(tab);
        else if (tab.kind === 'query') buildQuery(tab);
        else if (tab.kind === 'server') drawServer(tab);
        else if (tab.kind === 'routine') drawRoutine(tab);
        else if (tab.kind === 'search') drawSearch(tab);
        else if (tab.kind === 'design') drawDesigner(tab);
        else if (tab.kind === 'grant') drawGrant(tab);
        else if (tab.kind === 'diff') drawDiff(tab);
        else if (tab.kind === 'erd') drawErd(tab);
        else if (tab.kind === 'report') drawReport(tab);
        else drawHome(tab);
      }
    });
    drawTabs();
    drawTree();
    rememberSoon();
    var tab = activeTab();
    if (tab && tab.kind === 'server') tickServer(tab);
    if (tab && tab.focus) tab.focus();
  }

  function closeTab(tab, quiet) {
    if (tab.kind === 'table' && !quiet && changeCount(pending(tab))) {
      say('This table has changes that were not saved. Save or discard them first.', true);
      show(tab.id);
      return;
    }
    if (tab.kind === 'query') {
      if (tab.txn === 'open' && !quiet) say('The transaction that tab had open was rolled back.', true);
      host.call('db.closeTab', { id: tab.conn, database: tab.database, tab: tab.id }).then(function () {}, function () {});
    }
    clearTimeout(tab.timer);
    if (tab.el) tab.el.remove();
    var index = state.tabs.indexOf(tab);
    state.tabs.splice(index, 1);
    if (!state.tabs.length) { addHome(); return; }
    if (state.active === tab.id) show(state.tabs[Math.max(0, index - 1)].id);
    else { drawTabs(); rememberSoon(); }
  }

  function closeTabsOf(id, database, schema, name) {
    var key = tableKey(id, database, schema, name);
    state.tabs.filter(function (tab) { return tab.key === key; }).forEach(function (tab) { closeTab(tab, true); });
  }

  function reloadTabs(id, database, schema, name) {
    var key = tableKey(id, database, schema, name);
    state.tabs.forEach(function (tab) { if (tab.key === key && tab.mounted) { tab.data = null; tab.total = null; drawTable(tab); } });
  }

  function drawTabs() {
    var box = clear($('tabs'));
    state.tabs.forEach(function (tab) {
      var conn = connOf(tab.conn);
      var dirty = tab.kind === 'table' && tab.mounted && changeCount(pending(tab)) > 0;
      box.appendChild(h('div', {
        class: 'tab' + (tab.id === state.active ? ' on' : ''),
        title: (conn ? conn.name + (tab.database ? ' · ' + tab.database : '') + ' · ' : '') + tab.title,
        onclick: function () { show(tab.id); },
        onauxclick: function (event) { if (event.button === 1) closeTab(tab); }
      },
        conn ? h('span', { class: 'eng ' + conn.engine, text: ENGINES[conn.engine].short }) : null,
        h('span', { class: 'nm', text: (dirty ? '● ' : '') + tab.title }),
        conn && conn.production ? h('span', { class: 'tag prod', text: 'PROD' }) : null,
        tab.kind === 'home' ? null : h('button', { class: 'x', text: '×', title: 'Close', onclick: function (event) { event.stopPropagation(); closeTab(tab); } })
      ));
    });
    box.appendChild(h('div', { class: 'tab plus', text: '+', title: 'New query', onclick: function () {
      var tab = activeTab();
      var conn = tab && connOf(tab.conn) ? connOf(tab.conn) : state.connections[0];
      if (!conn) { openForm(null); return; }
      openQuery(conn, tab && tab.conn === conn.id && tab.database ? tab.database : conn.engine === 'sqlite' ? 'main' : conn.database, '');
    } }));
  }

  function addHome() {
    var tab = { id: 'home', kind: 'home', title: 'Connections' };
    state.tabs = [tab];
    mount(tab);
    show(tab.id);
  }

  function drawHome(tab) {
    var box = clear(tab.el);
    var page = h('div', { class: 'home' });
    page.appendChild(h('h2', { text: 'Databases' }));
    page.appendChild(h('p', { class: 'lead', text: state.connections.length
      ? 'Open a connection to browse it, or start a query. Passwords are kept by the app, encrypted, and never reach this panel.'
      : 'Connect to PostgreSQL, MySQL or MariaDB, or open a SQLite file. Paste a URL like postgres://user:password@host:5432/database and the form fills itself in.' }));
    var cards = h('div', { class: 'cards' });
    state.connections.forEach(function (conn) {
      cards.appendChild(h('div', { class: 'card', onclick: function () { state.open['c:' + conn.id] = true; drawTree(); openQuery(conn, conn.engine === 'sqlite' ? 'main' : conn.database, ''); } },
        h('div', { class: 'top' }, h('span', { class: 'eng ' + conn.engine, text: ENGINES[conn.engine].short }), h('b', { text: conn.name }), h('span', { class: 'spacer' }),
          conn.production ? h('span', { class: 'tag prod', text: 'PROD' }) : null, conn.readOnly ? h('span', { class: 'tag ro', text: 'read-only' }) : null),
        h('div', { class: 'at mono', text: conn.engine === 'sqlite' ? conn.file : (conn.user ? conn.user + '@' : '') + conn.host + ':' + conn.port + (conn.database ? '/' + conn.database : '') }),
        h('div', {}, h('span', { class: 'link', text: 'Edit', onclick: function (event) { event.stopPropagation(); openForm(conn); } }))
      ));
    });
    cards.appendChild(h('div', { class: 'card add', text: '+ Add a connection', onclick: function () { openForm(null); } }));
    page.appendChild(cards);
    box.appendChild(h('div', { class: 'scroll' }, page));
  }

  // ────────────────────────────────────────────── reports, and charts ──

  function sv(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var key in attrs || {}) if (attrs[key] !== null && attrs[key] !== undefined) el.setAttribute(key, String(attrs[key]));
    for (var i = 2; i < arguments.length; i += 1) if (arguments[i]) el.appendChild(typeof arguments[i] === 'string' ? document.createTextNode(arguments[i]) : arguments[i]);
    return el;
  }

  /**
   * A page that is only read, drawn from whatever sections the app sent:
   * a row of facts, or a table — with a box to narrow it when it is long, and
   * rows that open something when the caller says what.
   */
  function reportView(data, opts) {
    var page = h('div', { class: 'scroll' });
    if (data.supported === false) { page.appendChild(h('div', { class: 'empty', text: 'This engine has nothing to say about that.' })); return page; }
    (data.sections || []).forEach(function (section) {
      var sect = h('div', { class: 'sect' }, h('h3', {}, section.title + (section.rows && !section.vertical ? ' · ' + section.rows.length + (section.truncated ? '+' : '') : '')));
      if (section.note) sect.appendChild(h('div', { class: 'note', text: section.note }));
      page.appendChild(sect);
      if (section.error) { sect.appendChild(h('div', { class: 'bad', text: section.error })); return; }
      if (!section.rows.length) { sect.appendChild(h('div', { class: 'faint', text: 'Nothing.' })); return; }
      if (section.vertical) {
        var facts = h('div', { class: 'facts tight' });
        section.columns.forEach(function (column, index) {
          var value = section.rows[0][index];
          facts.appendChild(h('div', {}, h('b', { text: column.name }), value === null ? h('span', { class: 'faint', text: '—' }) : /^\d{4,}$/.test(value) ? fmtCount(value) : value));
        });
        sect.appendChild(facts);
        return;
      }
      var body = h('tbody');
      function fill(needle) {
        clear(body);
        var shown = 0;
        section.rows.forEach(function (row) {
          if (needle && row.join('\u0001').toLowerCase().indexOf(needle) < 0) return;
          shown += 1;
          if (shown > 600) return;
          var tr = h('tr', { class: section.open && opts && opts.onOpen ? 'go' : '', onclick: section.open && opts && opts.onOpen ? function () { opts.onOpen(row, section.columns); } : null });
          row.forEach(function (value) { tr.appendChild(h('td', { class: 'm' + (value === null ? ' faint' : /^-?[\d.,:]+$/.test(value) ? ' n' : ''), text: value === null ? '—' : value })); });
          body.appendChild(tr);
        });
        if (shown > 600) body.appendChild(h('tr', {}, h('td', { class: 'faint', colspan: section.columns.length, text: '… ' + (shown - 600) + ' more. Narrow it down.' })));
      }
      if (section.filter) sect.appendChild(h('input', { class: 'find', type: 'text', placeholder: 'Narrow these ' + section.rows.length, spellcheck: 'false', oninput: function (event) { fill(event.target.value.trim().toLowerCase()); } }));
      sect.appendChild(h('table', { class: 'list' }, h('thead', {}, h('tr', {}, section.columns.map(function (column) { return h('th', { text: column.name }); }))), body));
      fill('');
    });
    return page;
  }

  var SERIES_COLORS = ['var(--accent)', 'var(--warn, #d9a441)', 'var(--violet, #a78bfa)'];
  var CHART_SLOTS = 100;

  /**
   * One measure over the last few minutes. Lines, because it is change over
   * time; one axis, from zero; a legend that also says where each line stands
   * now, so the colour is never the only thing naming it.
   */
  function lineChart(title, series, times) {
    var W = 440, H = 124, L = 34, R = 8, T = 6, B = 16;
    var top = niceTop(Math.max.apply(null, series.map(function (one) { return Math.max.apply(null, one.values.concat([0])); })));
    var count = times.length;
    function x(i) { return L + (W - L - R) * ((CHART_SLOTS - count + i) / (CHART_SLOTS - 1)); }
    function y(v) { return T + (H - T - B) * (1 - v / top); }
    var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': title });
    [0, 0.5, 1].forEach(function (part) {
      svg.appendChild(sv('line', { x1: L, x2: W - R, y1: y(top * part), y2: y(top * part), stroke: 'var(--border)', 'stroke-width': 1 }));
      svg.appendChild(sv('text', { x: L - 5, y: y(top * part) + 3, 'text-anchor': 'end' }, compact(top * part)));
    });
    series.forEach(function (one, index) {
      if (!one.values.length) return;
      var points = one.values.map(function (value, i) { return x(i).toFixed(1) + ',' + y(value).toFixed(1); });
      svg.appendChild(sv('polyline', { points: points.join(' '), fill: 'none', stroke: SERIES_COLORS[index], 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      var last = one.values.length - 1;
      svg.appendChild(sv('circle', { cx: x(last), cy: y(one.values[last]), r: 3.5, fill: SERIES_COLORS[index], stroke: 'var(--bg-panel)', 'stroke-width': 2 }));
    });
    var cross = sv('line', { y1: T, y2: H - B, stroke: 'var(--text-faint)', 'stroke-width': 1, visibility: 'hidden' });
    svg.appendChild(cross);
    var tip = h('div', { class: 'tip', hidden: true });
    var latest = function (one) { return one.values.length ? compact(one.values[one.values.length - 1]) : '—'; };
    var box = h('div', { class: 'chart' },
      h('h4', {}, title, series.length === 1 ? h('span', { text: latest(series[0]) }) : null),
      h('div', { class: 'legend' }, series.length > 1 ? series.map(function (one, index) {
        return h('span', {}, h('i', { style: 'background:' + SERIES_COLORS[index] }), one.name, h('b', { text: latest(one) }));
      }) : null),
      svg, tip);
    svg.addEventListener('mousemove', function (event) {
      if (!count) return;
      var rect = svg.getBoundingClientRect();
      var at = (event.clientX - rect.left) / rect.width * W;
      var i = Math.round((at - L) / (W - L - R) * (CHART_SLOTS - 1)) - (CHART_SLOTS - count);
      i = Math.max(0, Math.min(count - 1, i));
      cross.setAttribute('x1', x(i));
      cross.setAttribute('x2', x(i));
      cross.setAttribute('visibility', 'visible');
      clear(tip);
      tip.appendChild(h('div', { class: 'faint', text: new Date(times[i]).toLocaleTimeString() }));
      series.forEach(function (one, index) { tip.appendChild(h('div', {}, h('i', { style: 'background:' + SERIES_COLORS[index] }), one.name, h('b', { text: compact(one.values[i]) }))); });
      tip.hidden = false;
      var inside = box.getBoundingClientRect();
      var zoom = inside.width && box.offsetWidth ? inside.width / box.offsetWidth : 1;
      var left = (event.clientX - inside.left) / zoom;
      tip.style.left = (left > box.offsetWidth / 2 ? left - tip.offsetWidth - 12 : left + 12) + 'px';
      tip.style.top = '34px';
    });
    svg.addEventListener('mouseleave', function () { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; });
    return box;
  }

  // ───────────────────────────────────────────────────────────── the grid ──

  /**
   * A grid of text. It draws what it is told and reports what was done to it;
   * what a click means — sort on the server, or here — is the caller's.
   */
  function makeGrid(opts) {
    var columns = opts.columns;
    var numeric = columns.map(function (column) { return isNumeric(column.type); });
    var total = opts.rowCount();
    var shown = 0;
    var selected = null;
    var picked = {};
    var lastPicked = null;
    var body = h('tbody');
    var peek = h('div', { class: 'peek', hidden: true });
    var head = h('tr', {}, h('th', { class: 'n', text: '#' }));
    columns.forEach(function (column, c) {
      var sort = opts.sort && opts.sort.column === c ? (opts.sort.desc ? ' ▼' : ' ▲') : '';
      head.appendChild(h('th', {
        class: opts.onSort ? 'sortable' : '',
        title: column.name + (column.type ? ' · ' + column.type : ''),
        onclick: opts.onSort ? function () { opts.onSort(c); } : null
      }, (opts.keys && opts.keys[column.name] ? h('span', { class: 'key', text: '⚷ ' }) : null), column.name + sort, h('span', { class: 'ty', text: column.type || ' ' })));
    });
    var table = h('table', { class: 'grid' }, h('thead', {}, head), body);
    var box = h('div', { class: 'gridbox' }, table);

    function paintCell(td, r, c) {
      var value = opts.value(r, c);
      var cls = opts.cellClass ? opts.cellClass(r, c) : '';
      if (value === null) { td.textContent = 'NULL'; cls += ' null'; }
      else if (value === undefined) { td.textContent = 'default'; cls += ' null'; }
      else { td.textContent = value.length > 300 ? value.slice(0, 300) + '…' : value; if (numeric[c]) cls += ' num'; }
      if (selected && selected.r === r && selected.c === c) cls += ' sel';
      td.className = cls.trim();
    }

    function paintRow(tr, r) {
      tr.className = ((opts.rowClass ? opts.rowClass(r) : '') + (picked[r] ? ' picked' : '')).trim();
    }

    function rowEl(r, position) {
      var tr = h('tr', { 'data-r': r });
      // Numbered by where it is drawn: sorted here, row 1 is the first one shown.
      tr.appendChild(h('td', { class: 'n', text: String((opts.offset || 0) + position + 1) }));
      for (var c = 0; c < columns.length; c += 1) {
        var td = h('td', { 'data-c': c });
        paintCell(td, r, c);
        tr.appendChild(td);
      }
      paintRow(tr, r);
      return tr;
    }

    function more() {
      var until = Math.min(total, shown + CHUNK);
      var fragment = document.createDocumentFragment();
      for (; shown < until; shown += 1) fragment.appendChild(rowEl(opts.order ? opts.order[shown] : shown, shown));
      body.appendChild(fragment);
    }

    function cellOf(r, c) {
      var tr = body.querySelector('tr[data-r="' + r + '"]');
      return tr ? tr.children[c + 1] : null;
    }

    function select(r, c) {
      var old = selected ? cellOf(selected.r, selected.c) : null;
      selected = { r: r, c: c };
      if (old) old.classList.remove('sel');
      var td = cellOf(r, c);
      if (td) td.classList.add('sel');
      var value = opts.value(r, c);
      clear(peek);
      peek.hidden = false;
      peek.appendChild(h('div', { class: 'dim' },
        h('b', { text: columns[c].name }), ' ', h('span', { class: 'faint', text: (columns[c].type || '') + (typeof value === 'string' ? ' · ' + fmtCount(value.length) + ' chars' : '') }),
        opts.isClipped && opts.isClipped(r, c) ? h('span', { class: 'bad', text: '  · too long to show whole; not editable here' }) : null,
        '  ', value === null || value === undefined ? null : h('span', { class: 'link', text: 'Copy', onclick: function () { copy(value); } })
      ));
      peek.appendChild(h('pre', { class: value === null || value === undefined ? 'faint' : '', text: value === null ? 'NULL' : value === undefined ? '(left to its default)' : pretty(value) }));
      if (opts.onSelect) opts.onSelect(r, c);
    }

    function edit(td, r, c) {
      if (!opts.canEdit || !opts.canEdit(r, c) || td.querySelector('input')) return;
      var value = opts.value(r, c);
      var input = h('input', { class: 'cell', type: 'text', value: value === null || value === undefined ? '' : value, spellcheck: 'false' });
      var done = false;
      function finish(next, keep) {
        if (done) return;
        done = true;
        if (keep) opts.onEdit(r, c, next);
        paintCell(td, r, c);
      }
      input.addEventListener('keydown', function (event) {
        event.stopPropagation();
        if (event.key === 'Enter') { event.preventDefault(); finish(input.value, true); }
        else if (event.key === 'Escape') { event.preventDefault(); finish(null, false); }
        // An empty cell is an empty string. NULL has to be said: ⌘⌫ or Ctrl+Backspace.
        else if (event.key === 'Backspace' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); finish(null, true); }
      });
      input.addEventListener('blur', function () { finish(input.value, input.value !== (value === null || value === undefined ? '' : value)); });
      td.textContent = '';
      td.appendChild(input);
      input.focus();
      input.select();
    }

    body.addEventListener('click', function (event) {
      var td = event.target.closest ? event.target.closest('td') : null;
      if (!td) return;
      var r = Number(td.parentNode.getAttribute('data-r'));
      if (td.classList.contains('n')) {
        if (!opts.onPick) return;
        if (event.shiftKey && lastPicked !== null) {
          var from = Math.min(lastPicked, r);
          var to = Math.max(lastPicked, r);
          for (var i = from; i <= to; i += 1) picked[i] = true;
        } else if (picked[r]) delete picked[r];
        else picked[r] = true;
        lastPicked = r;
        var rows = body.children;
        for (var k = 0; k < rows.length; k += 1) paintRow(rows[k], Number(rows[k].getAttribute('data-r')));
        opts.onPick(Object.keys(picked).map(Number));
        return;
      }
      select(r, Number(td.getAttribute('data-c')));
    });
    body.addEventListener('dblclick', function (event) {
      var td = event.target.closest ? event.target.closest('td') : null;
      if (!td || td.classList.contains('n')) return;
      edit(td, Number(td.parentNode.getAttribute('data-r')), Number(td.getAttribute('data-c')));
    });
    box.addEventListener('scroll', function () {
      if (shown < total && box.scrollTop + box.clientHeight > box.scrollHeight - 400) more();
    });
    more();

    return {
      el: h('div', { class: 'gridwrap' }, box, peek),
      selected: function () { return selected; },
      picked: function () { return Object.keys(picked).map(Number); },
      clearPicked: function () { picked = {}; lastPicked = null; },
      repaint: function (r) {
        var tr = body.querySelector('tr[data-r="' + r + '"]');
        if (!tr) return;
        paintRow(tr, r);
        for (var c = 0; c < columns.length; c += 1) paintCell(tr.children[c + 1], r, c);
      },
      addRow: function () {
        total = opts.rowCount();
        // Everything has to be on screen for the new row to be at the end of it.
        while (shown < total - 1) more();
        more();
        box.scrollTop = box.scrollHeight;
      },
      edit: function (r, c) { var td = cellOf(r, c); if (td) edit(td, r, c); }
    };
  }

  // ──────────────────────────────────────────────────────────────── tables ──

  function openTable(conn, database, schema, name, sub) {
    var key = tableKey(conn.id, database, schema, name);
    var found = null;
    state.tabs.forEach(function (tab) { if (tab.key === key) found = tab; });
    if (found) {
      if (sub && found.sub !== sub) { found.sub = sub; if (found.mounted) drawTable(found); }
      show(found.id);
      return;
    }
    addTab({ kind: 'table', key: key, title: name, conn: conn.id, database: database, schema: schema, name: name, sub: sub || 'data' });
  }

  var TABLE_REPORTS = { stats: 'tableStats', deps: 'dependencies', privs: 'privileges' };

  /** The views a table has, per engine: nothing is offered that the engine cannot answer. */
  function tableSubs(engine) {
    var subs = [['data', 'Rows'], ['structure', 'Structure']];
    if (engine !== 'sqlite') subs.push(['stats', 'Statistics']);
    if (engine === 'postgres') subs.push(['deps', 'Dependencies']);
    if (engine !== 'sqlite') subs.push(['privs', 'Privileges']);
    subs.push(['ddl', 'DDL']);
    return subs;
  }

  function tableArgs(tab) { return { id: tab.conn, database: tab.database, schema: tab.schema, name: tab.name }; }

  function pending(tab) {
    if (!tab.data || !tab.meta) return { updates: [], inserts: [], deletes: [] };
    return buildChanges(tab.data.columns, tab.meta.key, tab.data.rows, tab.edits, tab.deleted, tab.added);
  }

  function drawTable(tab) {
    var conn = connOf(tab.conn);
    var box = clear(tab.el);
    if (!conn) { box.appendChild(h('div', { class: 'empty', text: 'This connection is not there any more.' })); return; }
    if (!tab.page) tab.page = { limit: 200, offset: 0, where: '', draft: '', orderBy: [] };
    if (!tab.edits) { tab.edits = {}; tab.deleted = {}; tab.added = []; }

  function runQuery(tab, mode, direct) {
    var conn = connOf(tab.conn);

    var chosen = direct ? { sql: direct, line: 0 } : tab.editor.chosen();

    tab.errorLine = null;
    tab.sent = sql;
    tab.started = Date.now();
    drawQueryBar(tab);
    tab.editor.repaint();
    call('query', Object.assign(where(conn, tab.database), { tab: tab.id, sql: sql, maxRows: tab.maxRows })).then(function (data) {
      tab.results = data.results;

      tab.ran = data.ran;
      tab.of = data.of;
      var failed = data.results[data.results.length - 1];
      failed = failed && failed.error ? failed : null;
      // A PostgreSQL plan comes back as JSON in one cell; when it does, it is drawn.
      var first = data.results[0];

    if (found) { show(found.id); return; }
    addTab({ kind: 'routine', key: key, title: item.name, conn: conn.id, database: database, schema: schema, name: item.name, routine: String(item.id) });
  }

        if (form.viaSsh) {
          box.appendChild(h('div', { class: 'two' }, field('SSH host', 'sshHost', { placeholder: 'bastion.example.com, or an alias from ~/.ssh/config' }),
            h('label', { class: 'field', style: 'flex:0 0 110px' }, h('span', { text: 'SSH port' }), h('input', { type: 'number', value: form.sshPort || '', placeholder: '22', oninput: function (event) { form.sshPort = event.target.value; } }))));
          box.appendChild(h('div', { class: 'two' }, field('SSH user', 'sshUser', { placeholder: 'yours, unless you say' }), field('Key file', 'sshKey', { placeholder: 'optional — your agent and ~/.ssh are used' })));
          box.appendChild(h('div', { class: 'faint', style: 'margin:-2px 0 6px', text: 'It is your own ssh that is run, with your keys and your known hosts: what works in a terminal works here. It cannot ask for a password or a passphrase.' }));
        }
      }
      box.appendChild(h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: form.readOnly, onchange: function (event) { form.readOnly = event.target.checked; } }),
        h('span', {}, 'Read-only', h('small', { text: 'Nothing but a read is ever sent through it, and the server is told the same.' }))));
      box.appendChild(h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: form.production, onchange: function (event) { form.production = event.target.checked; } }),
        h('span', {}, 'This is production', h('small', { text: 'Anything that changes it stops and asks first, and its tabs say so in red.' }))));
      if (result.text) box.appendChild(h('div', { class: 'result ' + (result.bad ? 'bad' : 'okc'), text: result.text }));
      box.appendChild(h('div', { class: 'foot' },
        h('button', { class: 'btn', text: busy ? 'Testing…' : 'Test', disabled: busy, onclick: function () {
          busy = true; result.text = ''; draw();
          call('testConnection', { connection: payload() }).then(function (data) {
            result = { text: 'Connected in ' + fmtMs(data.ms) + ' — ' + data.version, bad: false };
          }, function (error) { result = { text: error.message, bad: true }; }).then(function () { busy = false; draw(); });
        } }),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn quiet', text: 'Cancel', onclick: function () { veil.remove(); } }),
        h('button', { class: 'btn primary', text: 'Save', disabled: busy, onclick: function () {
          call('saveConnection', { connection: payload() }).then(function (data) {
            veil.remove();
            forget(data.connection.id);
            state.open['c:' + data.connection.id] = true;
            refreshOverview();
            state.tabs.forEach(function (tab) { if (tab.conn === data.connection.id && tab.kind === 'query' && tab.mounted) drawQueryBar(tab); });
            drawTabs();
          }, function (error) { result = { text: error.message, bad: true }; draw(); });
        } })
      ));
      veil.appendChild(box);
    }
    draw();
    document.body.appendChild(veil);
    var first = veil.querySelector('input');
    if (first) first.focus();
  }

  // ───────────────────────────────────────────────────────────────── start ──

  function start(context) {
    if (state.started) return;
    state.started = true;
    var resume = context && context.resume && typeof context.resume === 'object' ? context.resume : null;
    if (resume && Number(resume.sideWidth) >= 180) state.sideWidth = Math.min(700, Number(resume.sideWidth));
    $('side').style.width = state.sideWidth + 'px';
    refreshOverview().then(function () {
      var restored = [];
      (resume && Array.isArray(resume.tabs) ? resume.tabs : []).forEach(function (saved) {
        if (!saved || !connOf(saved.conn) || ['table', 'query', 'server', 'routine', 'report', 'erd'].indexOf(saved.kind) < 0) return;
        var tab = { id: String(saved.id || ''), kind: saved.kind, conn: saved.conn, database: saved.database || '', schema: saved.schema || null, name: saved.name || '', sub: saved.sub, title: String(saved.title || saved.name || 'Query'), routine: saved.routine };
        if (!tab.id) return;
        if (tab.kind === 'table') tab.key = tableKey(tab.conn, tab.database, tab.schema, tab.name);
        if (tab.kind === 'server') { tab.key = 'srv:' + tab.conn; tab.auto = false; }
        if (tab.kind === 'routine') tab.key = 'r:' + tab.conn + '/' + tab.database + '/' + (tab.schema || '') + '/' + tab.routine;
        if (tab.kind === 'report') tab.key = 'rep:' + tab.conn + '/' + tab.database + '/' + tab.name + '/' + (tab.schema || '');
        if (tab.kind === 'erd') { tab.key = 'erd:' + tab.conn + '/' + tab.database + '/' + (tab.schema || ''); tab.zoom = 1; tab.find = ''; }
        if (tab.kind === 'query') { tab.sql = String(saved.sql || ''); tab.maxRows = 1000; queryNumber += 1; }
        restored.push(tab);
      });
      if (!restored.length) { addHome(); return; }
      state.tabs = restored;
      restored.forEach(mount);
      var active = restored.filter(function (tab) { return tab.id === resume.active; })[0] || restored[0];
      state.open['c:' + active.conn] = true;
      show(active.id);
    }, function (error) {
      addHome();
      fail(error);
    });
  }

  $('add').addEventListener('click', function () { openForm(null); });
  $('filter').addEventListener('input', function (event) { state.filter = event.target.value; drawTree(); });
  $('split').addEventListener('mousedown', function (event) {
    event.preventDefault();
    var side = $('side');
    var startX = event.clientX;
    var startW = side.getBoundingClientRect().width;
    var zoom = side.offsetWidth ? startW / side.offsetWidth : 1;
    function move(e) {
      state.sideWidth = Math.max(180, Math.min(700, (startW + e.clientX - startX) / zoom));
      side.style.width = state.sideWidth + 'px';
    }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); rememberSoon(); }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  document.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    closeMenu();
    var veil = $('veil');
    if (veil) veil.remove();
  });
  window.addEventListener('blur', closeMenu);

  host.on('context', start);
  host.on('showing', function (payload) {
    state.showing = !payload || payload.showing !== false;
    var tab = activeTab();
    if (state.showing && tab && tab.kind === 'server') tickServer(tab);
  });
  host.ready();
})();
</script>
