<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Smart Terminal</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="signin">
  <div class="signin-card">
    <div class="brand">
      <span class="brand-mark" id="mark">ST</span>
      <div><strong id="org">Smart Terminal</strong><small>Smart Terminal</small></div>
    </div>
    <div>
      <h1>Sign in</h1>
      <p class="muted" style="margin-top:6px">See your week, and if you manage the team, everyone’s.</p>
    </div>
    <div class="sso" id="providers"></div>
    <div class="divider" id="or" hidden>or with your password</div>
    <form id="form" class="sso" style="gap:14px">
      <label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="username" required autofocus></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit" style="padding:10px">Sign in</button>
      <p id="error" class="error" role="alert"></p>
    </form>
  </div>
</main>
<script src="/assets/login.js"></script>
</body>
</html>
